<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legenda Gunung Tampomas</title>
<style>
  :root{
    --tp-sky-top:#ffd9a0;
    --tp-sky-bottom:#ffb3a7;
    --tp-panel:#2b2018;
    --tp-panel-light:#3d2e21;
    --tp-cream:#fff6e6;
    --tp-gold:#e0a840;
    --tp-gold-bright:#ffcf6b;
    --tp-red:#c0453a;
    --tp-green:#3f6b3a;
    --tp-shadow:rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Verdana,Tahoma,sans-serif;
    background:var(--tp-panel);
    color:var(--tp-cream);
    display:flex;
    justify-content:center;
  }
  .tp-game{
    width:100%;
    max-width:640px;
    background:linear-gradient(180deg,var(--tp-panel) 0%, var(--tp-panel-light) 100%);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 6px 24px var(--tp-shadow);
    padding-bottom:14px;
  }
  .tp-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:rgba(0,0,0,0.25);
  }
  .tp-title{
    font-size:15px;
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--tp-gold-bright);
  }
  .tp-topbtns{
    display:flex;
    gap:6px;
  }
  .tp-iconbtn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:var(--tp-cream);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .tp-iconbtn:hover{background:rgba(255,255,255,0.16);}
  .tp-iconbtn:active{transform:scale(0.96);}

  .tp-stage-wrap{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:linear-gradient(180deg,var(--tp-sky-top) 0%, var(--tp-sky-bottom) 100%);
    touch-action:none;
    overflow:hidden;
  }
  .tp-stage-wrap canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .tp-cover{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(180deg,rgba(20,15,10,0.55),rgba(20,15,10,0.75));
    padding:24px;
    gap:14px;
  }
  .tp-cover h1{
    margin:0;
    font-size:24px;
    color:var(--tp-gold-bright);
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  .tp-cover p{
    margin:0;
    max-width:440px;
    font-size:14px;
    line-height:1.5;
    color:var(--tp-cream);
    opacity:0.9;
  }
  .tp-primary-btn{
    background:linear-gradient(180deg,var(--tp-gold-bright),var(--tp-gold));
    color:#2b2018;
    border:none;
    padding:12px 28px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
  }
  .tp-primary-btn:active{transform:scale(0.97);}
  .tp-hidden{display:none !important;}

  .tp-caption{
    padding:12px 16px 4px 16px;
    min-height:44px;
    font-size:14px;
    line-height:1.5;
    color:var(--tp-cream);
  }
  .tp-instruction{
    padding:0 16px 8px 16px;
    font-size:12.5px;
    font-style:italic;
    color:var(--tp-gold-bright);
    min-height:18px;
  }

  .tp-dots{
    display:flex;
    justify-content:center;
    gap:7px;
    padding:6px 16px 10px 16px;
    flex-wrap:wrap;
  }
  .tp-dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    transition:background 0.25s, transform 0.25s;
  }
  .tp-dot.tp-active{
    background:var(--tp-gold-bright);
    transform:scale(1.25);
  }
  .tp-dot.tp-done{
    background:var(--tp-red);
  }

  .tp-controls{
    display:flex;
    justify-content:center;
    padding:6px 16px 4px 16px;
  }

  .tp-progressbar-wrap{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:70%;
    max-width:320px;
    height:12px;
    background:rgba(0,0,0,0.35);
    border-radius:8px;
    overflow:hidden;
    display:none;
  }
  .tp-progressbar-wrap.tp-show{display:block;}
  .tp-progressbar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--tp-gold),var(--tp-gold-bright));
  }

  .tp-footer{
    text-align:center;
    font-size:11px;
    opacity:0.55;
    padding:4px 16px 0 16px;
  }
</style>
</head>
<body>

<div class="tp-game" id="tpGame">

  <div class="tp-topbar">
    <div class="tp-title" id="tpTitle">Legenda Gunung Tampomas</div>
    <div class="tp-topbtns">
      <button class="tp-iconbtn" id="tpLangBtn" type="button">EN</button>
      <button class="tp-iconbtn" id="tpMuteBtn" type="button">🔊</button>
    </div>
  </div>

  <div class="tp-stage-wrap" id="tpStageWrap">
    <canvas id="tpCanvas"></canvas>
    <div class="tp-progressbar-wrap" id="tpProgressWrap">
      <div class="tp-progressbar-fill" id="tpProgressFill"></div>
    </div>
    <div class="tp-cover" id="tpCover">
      <h1 id="tpCoverTitle">Legenda Gunung Tampomas</h1>
      <p id="tpCoverText">Dahulu kala, Gunung Tampomas bernama Gunung Gede. Ikuti kisah seorang raja muda yang mempertaruhkan segalanya demi menyelamatkan rakyatnya.</p>
      <button class="tp-primary-btn" id="tpStartBtn" type="button">Mulai Cerita</button>
    </div>
  </div>

  <div class="tp-caption" id="tpCaption"></div>
  <div class="tp-instruction" id="tpInstruction"></div>

  <div class="tp-dots" id="tpDots"></div>

  <div class="tp-controls">
    <button class="tp-primary-btn tp-hidden" id="tpReplayBtn" type="button">Ulangi Cerita</button>
  </div>

  <div class="tp-footer" id="tpFooter">Kisah rakyat Jawa Barat</div>

</div>

<script>
(function(){
  "use strict";

  /* ================= STATE ================= */
  var urlParams = new URLSearchParams(window.location.search);
  var lang = (urlParams.get('lang') === 'en') ? 'en' : 'id';
  var muted = (localStorage.getItem('tampomasMuted') === '1');
  var sceneIndex = -1; // -1 = cover
  var started = false;
  var interactionState = null; // holds per-scene interaction data
  var voices = [];

  /* ================= DOM ================= */
  var canvas = document.getElementById('tpCanvas');
  var ctx = canvas.getContext('2d');
  var stageWrap = document.getElementById('tpStageWrap');
  var coverEl = document.getElementById('tpCover');
  var coverTitle = document.getElementById('tpCoverTitle');
  var coverText = document.getElementById('tpCoverText');
  var startBtn = document.getElementById('tpStartBtn');
  var replayBtn = document.getElementById('tpReplayBtn');
  var captionEl = document.getElementById('tpCaption');
  var instructionEl = document.getElementById('tpInstruction');
  var dotsEl = document.getElementById('tpDots');
  var langBtn = document.getElementById('tpLangBtn');
  var muteBtn = document.getElementById('tpMuteBtn');
  var titleEl = document.getElementById('tpTitle');
  var footerEl = document.getElementById('tpFooter');
  var progressWrap = document.getElementById('tpProgressWrap');
  var progressFill = document.getElementById('tpProgressFill');

  /* ================= TEXT ================= */
  var UI_TEXT = {
    id:{
      gameTitle:"Legenda Gunung Tampomas",
      coverTitle:"Legenda Gunung Tampomas",
      coverText:"Dahulu kala, Gunung Tampomas bernama Gunung Gede. Ikuti kisah seorang raja muda yang mempertaruhkan segalanya demi menyelamatkan rakyatnya.",
      startBtn:"Mulai Cerita",
      replayBtn:"Ulangi Cerita",
      footer:"Kisah rakyat Jawa Barat, Indonesia",
      muteOn:"🔊",
      muteOff:"🔇",
      langBtn:"EN"
    },
    en:{
      gameTitle:"The Legend of Mount Tampomas",
      coverTitle:"The Legend of Mount Tampomas",
      coverText:"Long ago, Mount Tampomas was known as Mount Gede. Follow the story of a young king who risked everything to save his people.",
      startBtn:"Start the Story",
      replayBtn:"Replay Story",
      footer:"A folktale from West Java, Indonesia",
      muteOn:"🔊",
      muteOff:"🔇",
      langBtn:"ID"
    }
  };

  /* ================= SCENE DATA ================= */
  // Each scene: narration {id,en}, instruction {id,en}, draw(t) function,
  // interaction setup(scene) / teardown(), and a "complete" trigger.

  var scenes = [
    {
      key:"intro",
      narration:{
        id:"Dahulu kala, berdirilah Kerajaan Sumedang Larang yang subur dan makmur, dipimpin oleh seorang raja muda yang bijaksana. Di utara kerajaan, menjulang sebuah gunung indah bernama Gunung Gede.",
        en:"Long ago, the kingdom of Sumedang Larang stood fertile and prosperous, led by a wise young king. To the north of the kingdom rose a beautiful mountain called Mount Gede."
      },
      instruction:{
        id:"Ketuk istana untuk memulai kisah.",
        en:"Tap the palace to begin the tale."
      },
      interaction:{type:"tap", target:"palace", needed:1}
    },
    {
      key:"rumble",
      narration:{
        id:"Suatu hari, tanpa peringatan, Gunung Gede bergemuruh keras. Tanah berguncang dan asap putih tebal mengepul dari puncaknya.",
        en:"One day, without warning, Mount Gede began to rumble violently. The ground shook and thick white smoke billowed from its peak."
      },
      instruction:{
        id:"Ketuk gunung tiga kali untuk merasakan getarannya.",
        en:"Tap the mountain three times to feel it rumble."
      },
      interaction:{type:"tap", target:"mountain", needed:3}
    },
    {
      key:"panic",
      narration:{
        id:"Rakyat yang tinggal di kaki gunung ketakutan. Mereka berlarian mencari tempat aman menjauh dari gunung yang mengamuk.",
        en:"The villagers living at the mountain's foot were terrified. They ran to find safety, fleeing the raging mountain."
      },
      instruction:{
        id:"Ketuk setiap warga untuk membantu mereka mengungsi.",
        en:"Tap each villager to help them escape to safety."
      },
      interaction:{type:"tapmulti", target:"villagers", needed:3}
    },
    {
      key:"meditation",
      narration:{
        id:"Sang raja sangat cemas memikirkan keselamatan rakyatnya. Ia pun masuk ke ruangan sunyi untuk bersemedi, memohon petunjuk kepada Yang Maha Kuasa.",
        en:"The king was deeply worried for his people's safety. He entered a quiet chamber to meditate, praying for guidance."
      },
      instruction:{
        id:"Tekan dan tahan sang raja agar ia dapat bersemedi dengan khusyuk.",
        en:"Press and hold the king so he can meditate deeply."
      },
      interaction:{type:"hold", target:"king", durationMs:2200}
    },
    {
      key:"vision",
      narration:{
        id:"Setelah berhari-hari bersemedi, raja mendengar bisikan gaib. Ia diperintahkan untuk melemparkan keris emas pusaka leluhurnya ke dalam kawah Gunung Gede.",
        en:"After days of meditation, the king heard a mysterious whisper. He was told to throw his ancestors' sacred gold keris into the crater of Mount Gede."
      },
      instruction:{
        id:"Ketuk keris emas yang bersinar untuk menerima wangsit.",
        en:"Tap the glowing gold keris to receive the vision."
      },
      interaction:{type:"tap", target:"keris", needed:1}
    },
    {
      key:"climb",
      narration:{
        id:"Tanpa ragu, sang raja mendaki Gunung Gede seorang diri, menembus hutan lebat dan jalan terjal demi menyelamatkan rakyatnya.",
        en:"Without hesitation, the king climbed Mount Gede alone, pushing through dense forest and steep paths to save his people."
      },
      instruction:{
        id:"Seret sang raja ke atas menuju puncak gunung.",
        en:"Drag the king upward toward the mountain's peak."
      },
      interaction:{type:"drag", target:"king", axis:"up"}
    },
    {
      key:"throw",
      narration:{
        id:"Setibanya di puncak, raja mendekati tepi kawah yang bergolak. Ia mengangkat keris emas tinggi-tinggi, lalu bersiap melemparkannya ke dalam kawah.",
        en:"Reaching the summit, the king approached the churning crater. He raised the gold keris high, ready to cast it into the crater."
      },
      instruction:{
        id:"Ketuk keris tepat saat berada di atas kawah.",
        en:"Tap the keris right when it lines up with the crater."
      },
      interaction:{type:"timing", target:"keris", zone:[0.42,0.58]}
    },
    {
      key:"ending",
      narration:{
        id:"Keajaiban terjadi. Gemuruh mereda, asap menghilang, dan gunung kembali tenang. Sejak saat itu, gunung tersebut diberi nama Gunung Tampomas, gunung yang telah menerima keris emas.",
        en:"A miracle happened. The rumbling faded, the smoke cleared, and the mountain grew calm once more. From that day on, the mountain was named Mount Tampomas, the mountain that received the gold keris."
      },
      instruction:{
        id:"Kisah selesai. Ketuk tombol di bawah untuk mengulang.",
        en:"The story ends here. Tap the button below to replay."
      },
      interaction:{type:"none"}
    }
  ];

  /* ================= CANVAS SIZING ================= */
  var W=800, H=600, DPR=1;
  function resizeCanvas(){
    var rect = stageWrap.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = Math.max(1, Math.floor(W*DPR));
    canvas.height = Math.max(1, Math.floor(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawCurrentFrame();
    notifyResize();
  }
  window.addEventListener('resize', resizeCanvas);

  /* ================= POSTMESSAGE AUTO RESIZE ================= */
  function notifyResize(){
    try{
      var h = document.getElementById('tpGame').scrollHeight;
      window.parent.postMessage({ type:'tampomas-resize', height:h }, '*');
    }catch(e){}
  }

  /* ================= DRAWING HELPERS ================= */
  function grad(x0,y0,x1,y1,stops){
    var g = ctx.createLinearGradient(x0,y0,x1,y1);
    for(var i=0;i<stops.length;i++){ g.addColorStop(stops[i][0], stops[i][1]); }
    return g;
  }
  function radGrad(x,y,r,stops){
    var g = ctx.createRadialGradient(x,y,0,x,y,r);
    for(var i=0;i<stops.length;i++){ g.addColorStop(stops[i][0], stops[i][1]); }
    return g;
  }

  function drawSky(erupting){
    var top = erupting ? '#a8593f' : '#ffd9a0';
    var bottom = erupting ? '#5c3a2e' : '#ffb3a7';
    ctx.fillStyle = grad(0,0,0,H,[[0,top],[1,bottom]]);
    ctx.fillRect(0,0,W,H);
    // sun
    ctx.fillStyle = radGrad(W*0.78,H*0.2,60,[[0,'rgba(255,240,190,0.95)'],[1,'rgba(255,240,190,0)']]);
    ctx.beginPath();
    ctx.arc(W*0.78,H*0.2,60,0,Math.PI*2);
    ctx.fill();
  }

  function drawMountain(smokeLevel, glow){
    // smokeLevel 0..1, glow 0..1 (kawah glow when erupting)
    var baseY = H*0.78;
    var peakX = W*0.62, peakY = H*0.22;
    ctx.save();
    // mountain body
    ctx.beginPath();
    ctx.moveTo(W*0.18, baseY);
    ctx.lineTo(peakX-30, peakY+10);
    ctx.lineTo(peakX, peakY);
    ctx.lineTo(peakX+34, peakY+16);
    ctx.lineTo(W*0.98, baseY);
    ctx.closePath();
    ctx.fillStyle = grad(0,peakY,0,baseY,[[0,'#5c7a4a'],[1,'#2e4a2c']]);
    ctx.fill();
    // ridge shading
    ctx.beginPath();
    ctx.moveTo(peakX,peakY);
    ctx.lineTo(peakX+34,peakY+16);
    ctx.lineTo(W*0.98,baseY);
    ctx.lineTo(peakX,baseY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fill();
    // trees (simple triangles)
    ctx.fillStyle = '#274d27';
    for(var i=0;i<14;i++){
      var tx = W*0.2 + i*((W*0.72)/14) + (i%2)*8;
      var ty = baseY - 6 - (i%3)*4;
      var scaleFactor = 1 - Math.abs((tx-peakX)/(W*0.5));
      var s = 10 + 8*Math.max(0.2,scaleFactor);
      if(tx > peakX-40 && tx < peakX+50) continue;
      ctx.beginPath();
      ctx.moveTo(tx, ty-s);
      ctx.lineTo(tx-s*0.5, ty);
      ctx.lineTo(tx+s*0.5, ty);
      ctx.closePath();
      ctx.fill();
    }
    // kawah (crater) mouth near peak
    var kx = peakX+2, ky = peakY+6;
    ctx.beginPath();
    ctx.ellipse(kx,ky,16,7,0,0,Math.PI*2);
    ctx.fillStyle = glow>0 ? radGrad(kx,ky,26,[[0,'rgba(255,150,60,'+(0.6+glow*0.4)+')'],[1,'rgba(255,80,20,0)']]) : '#1f2a1f';
    ctx.fill();
    // smoke
    if(smokeLevel>0){
      ctx.globalAlpha = 0.75;
      for(var s2=0; s2<5; s2++){
        var sxOff = (s2-2)*10*smokeLevel;
        var syOff = -s2*22*smokeLevel - 10;
        var rad = (16 + s2*9) * (0.4+smokeLevel*0.8);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(230,230,225,'+(0.5-s2*0.07)+')';
        ctx.arc(kx+sxOff, ky+syOff, rad, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    return {kx:kx, ky:ky, peakX:peakX, peakY:peakY, baseY:baseY};
  }

  function drawGround(){
    ctx.fillStyle = grad(0,H*0.78,0,H,[[0,'#7ba85c'],[1,'#5c8a44']]);
    ctx.fillRect(0,H*0.78,W,H*0.22);
  }

  function drawPalace(cx, cy, scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);
    // base
    ctx.fillStyle = '#caa15a';
    ctx.fillRect(-55,-10,110,50);
    // roof
    ctx.beginPath();
    ctx.moveTo(-70,-10);
    ctx.lineTo(0,-60);
    ctx.lineTo(70,-10);
    ctx.closePath();
    ctx.fillStyle = '#8a2f26';
    ctx.fill();
    // second roof tier
    ctx.beginPath();
    ctx.moveTo(-45,-32);
    ctx.lineTo(0,-72);
    ctx.lineTo(45,-32);
    ctx.closePath();
    ctx.fillStyle = '#a5382d';
    ctx.fill();
    // door
    ctx.fillStyle = '#4a2e1a';
    ctx.fillRect(-12,10,24,30);
    // pillars
    ctx.fillStyle = '#e6c98a';
    ctx.fillRect(-48,-6,8,46);
    ctx.fillRect(40,-6,8,46);
    // flag
    ctx.strokeStyle = '#7a5a2a';
    ctx.beginPath(); ctx.moveTo(0,-72); ctx.lineTo(0,-92); ctx.stroke();
    ctx.fillStyle = '#e0483e';
    ctx.beginPath();
    ctx.moveTo(0,-92); ctx.lineTo(20,-86); ctx.lineTo(0,-80);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawFigure(cx, cy, opts){
    opts = opts || {};
    var scale = opts.scale || 1;
    var robeColor = opts.robeColor || '#c0453a';
    var isKing = !!opts.king;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0,30,16,5,0,0,Math.PI*2);
    ctx.fill();
    // robe/body
    ctx.beginPath();
    ctx.moveTo(-14,28);
    ctx.lineTo(-9,-6);
    ctx.lineTo(9,-6);
    ctx.lineTo(14,28);
    ctx.closePath();
    ctx.fillStyle = robeColor;
    ctx.fill();
    // arms
    ctx.strokeStyle = robeColor;
    ctx.lineWidth = 6;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-9,-2); ctx.lineTo(-18, opts.armUp? -14:10);
    ctx.moveTo(9,-2); ctx.lineTo(18, opts.armUp? -14:10);
    ctx.stroke();
    // head
    ctx.beginPath();
    ctx.arc(0,-16,10,0,Math.PI*2);
    ctx.fillStyle = '#e8b98a';
    ctx.fill();
    if(isKing){
      // crown
      ctx.fillStyle = '#e0a840';
      ctx.beginPath();
      ctx.moveTo(-9,-24);
      ctx.lineTo(-6,-32);
      ctx.lineTo(-2,-25);
      ctx.lineTo(0,-33);
      ctx.lineTo(2,-25);
      ctx.lineTo(6,-32);
      ctx.lineTo(9,-24);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawVillager(cx,cy,frame){
    ctx.save();
    ctx.translate(cx,cy);
    var bob = Math.sin(frame*0.3)*3;
    ctx.translate(0,bob);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(0,22,10,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3d6b8a';
    ctx.beginPath();
    ctx.moveTo(-8,20); ctx.lineTo(-6,-4); ctx.lineTo(6,-4); ctx.lineTo(8,20);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.arc(0,-12,7,0,Math.PI*2);
    ctx.fillStyle = '#e8b98a';
    ctx.fill();
    ctx.restore();
  }

  function drawKeris(cx,cy,scale,glowAmt){
    scale = scale||1;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);
    if(glowAmt>0){
      ctx.fillStyle = radGrad(0,0,40,[[0,'rgba(255,220,120,'+(0.5*glowAmt)+')'],[1,'rgba(255,220,120,0)']]);
      ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill();
    }
    // blade (wavy keris)
    ctx.strokeStyle = '#e0a840';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0,26);
    ctx.quadraticCurveTo(10,10,0,0);
    ctx.quadraticCurveTo(-10,-10,0,-20);
    ctx.quadraticCurveTo(8,-28,2,-38);
    ctx.stroke();
    // handle
    ctx.fillStyle = '#7a4a24';
    ctx.fillRect(-4,26,8,14);
    ctx.restore();
  }

  /* ================= SCENE RENDERING ================= */
  var lastFrameArgs = null;

  function drawCurrentFrame(){
    if(sceneIndex < 0) return;
    var s = scenes[sceneIndex];
    var st = interactionState || {};
    ctx.clearRect(0,0,W,H);
    if(s.key==="intro"){
      drawSky(false);
      var m = drawMountain(0,0);
      drawGround();
      drawPalace(W*0.42,H*0.72,1.0);
      lastFrameArgs = {palace:{x:W*0.42,y:H*0.72,r:70}};
    } else if(s.key==="rumble"){
      var shake = (st.taps||0) > 0 ? Math.sin(Date.now()*0.05)*3*(st.taps) : 0;
      drawSky(st.taps>=2);
      var m2 = drawMountain(Math.min(1,(st.taps||0)/3), Math.min(1,(st.taps||0)/3));
      drawGround();
      ctx.save();
      ctx.translate(shake,0);
      ctx.restore();
      lastFrameArgs = {mountain:{x:m2.peakX,y:(m2.peakY+m2.baseY)/2,r:90}};
    } else if(s.key==="panic"){
      drawSky(true);
      drawMountain(1,0.6);
      drawGround();
      var positions = st.positions || [
        {x:W*0.25,y:H*0.66},{x:W*0.45,y:H*0.7},{x:W*0.65,y:H*0.64}
      ];
      var done = st.done || [false,false,false];
      var frame = st.frame||0;
      var pts=[];
      for(var i=0;i<positions.length;i++){
        if(done[i]) continue;
        drawVillager(positions[i].x,positions[i].y,frame+i*8);
        pts.push({x:positions[i].x,y:positions[i].y,r:34,i:i});
      }
      lastFrameArgs = {villagers:pts};
    } else if(s.key==="meditation"){
      drawSky(false);
      drawMountain(0.15,0.1);
      drawGround();
      var hp = (st.holdProgress||0);
      drawFigure(W*0.5,H*0.68,{king:true,robeColor:'#c0453a',armUp:hp>0.05});
      if(hp>0){
        ctx.save();
        ctx.fillStyle = radGrad(W*0.5,H*0.6,50+hp*30,[[0,'rgba(255,220,150,'+(0.5*hp)+')'],[1,'rgba(255,220,150,0)']]);
        ctx.beginPath(); ctx.arc(W*0.5,H*0.6,50+hp*30,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      lastFrameArgs = {king:{x:W*0.5,y:H*0.66,r:50}};
    } else if(s.key==="vision"){
      drawSky(false);
      drawMountain(0.1,0.1);
      drawGround();
      drawFigure(W*0.32,H*0.7,{king:true,robeColor:'#c0453a'});
      var glow = st.revealed ? 1 : 0.5 + Math.sin(Date.now()*0.006)*0.2;
      drawKeris(W*0.62,H*0.6,1.4,glow);
      lastFrameArgs = {keris:{x:W*0.62,y:H*0.6,r:44}};
    } else if(s.key==="climb"){
      drawSky(true);
      var m3 = drawMountain(0.9,0.4);
      drawGround();
      // path
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,0.25)';
      ctx.setLineDash([6,6]);
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(W*0.3,H*0.76);
      ctx.lineTo(m3.peakX-10, m3.peakY+30);
      ctx.stroke();
      ctx.restore();
      var prog = st.climbProgress || 0;
      var startX=W*0.3, startY=H*0.74, endX=m3.peakX-10, endY=m3.peakY+34;
      var kx = startX + (endX-startX)*prog;
      var ky = startY + (endY-startY)*prog;
      drawFigure(kx,ky,{king:true,robeColor:'#c0453a',scale:1-0.25*prog});
      lastFrameArgs = {king:{x:kx,y:ky,r:40}, dragAxis:"up"};
    } else if(s.key==="throw"){
      drawSky(true);
      var m4 = drawMountain(0.5, 0.9);
      drawGround();
      drawFigure(m4.peakX-40,m4.peakY+40,{king:true,robeColor:'#c0453a',scale:0.85,armUp:true});
      var t = (st.swingT!==undefined) ? st.swingT : ((Date.now()%2000)/2000);
      var swingX = m4.peakX-70 + t*110;
      var swingY = m4.peakY+16 - Math.sin(t*Math.PI)*36;
      drawKeris(swingX,swingY,1.1,0.8);
      // target zone marker (kawah)
      lastFrameArgs = {keris:{x:swingX,y:swingY,r:30}, zoneT:t, kawah:{x:m4.kx,y:m4.ky}};
    } else if(s.key==="ending"){
      drawSky(false);
      drawMountain(0,0);
      drawGround();
      drawPalace(W*0.3,H*0.72,0.85);
      drawFigure(W*0.6,H*0.7,{king:true,robeColor:'#c0453a',armUp:true});
      drawVillager(W*0.72,H*0.74,4);
      drawVillager(W*0.5,H*0.76,9);
      lastFrameArgs = {};
    }
  }

  var rafId = null;
  function animLoop(){
    drawCurrentFrame();
    rafId = requestAnimationFrame(animLoop);
  }

  /* ================= SPEECH ================= */
  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices();
  }
  if('speechSynthesis' in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(targetLang){
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(targetLang)===0) return voices[i];
    }
    return null;
  }
  function speak(text){
    if(muted) return;
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = (lang==='id') ? 'id-ID' : 'en-US';
      var v = pickVoice(lang==='id' ? 'id' : 'en');
      if(v) u.voice = v;
      u.rate = 0.95;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function stopSpeak(){
    if('speechSynthesis' in window){
      try{ window.speechSynthesis.cancel(); }catch(e){}
    }
  }

  /* ================= UI TEXT APPLY ================= */
  function applyLangUI(){
    var t = UI_TEXT[lang];
    titleEl.textContent = t.gameTitle;
    coverTitle.textContent = t.coverTitle;
    coverText.textContent = t.coverText;
    startBtn.textContent = t.startBtn;
    replayBtn.textContent = t.replayBtn;
    footerEl.textContent = t.footer;
    langBtn.textContent = t.langBtn;
    muteBtn.textContent = muted ? t.muteOff : t.muteOn;
    document.documentElement.lang = lang;
  }

  /* ================= DOTS ================= */
  function buildDots(){
    dotsEl.innerHTML = "";
    for(var i=0;i<scenes.length;i++){
      var d = document.createElement('div');
      d.className = 'tp-dot';
      d.id = 'tpDot'+i;
      dotsEl.appendChild(d);
    }
  }
  function updateDots(){
    for(var i=0;i<scenes.length;i++){
      var d = document.getElementById('tpDot'+i);
      if(!d) continue;
      d.classList.remove('tp-active','tp-done');
      if(i < sceneIndex) d.classList.add('tp-done');
      else if(i === sceneIndex) d.classList.add('tp-active');
    }
  }

  /* ================= CAPTION / INSTRUCTION ================= */
  function updateCaption(){
    if(sceneIndex<0){ captionEl.textContent=""; instructionEl.textContent=""; return; }
    var s = scenes[sceneIndex];
    captionEl.textContent = s.narration[lang];
    instructionEl.textContent = s.instruction[lang];
  }

  /* ================= INTERACTION SETUP ================= */
  function distance(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }

  function getPointerPos(evt){
    var rect = canvas.getBoundingClientRect();
    var clientX = (evt.touches && evt.touches[0]) ? evt.touches[0].clientX : evt.clientX;
    var clientY = (evt.touches && evt.touches[0]) ? evt.touches[0].clientY : evt.clientY;
    return { x: clientX-rect.left, y: clientY-rect.top };
  }

  var holdTimer = null;
  var holdStart = 0;
  var holdRAF = null;
  var dragActive = false;

  function clearInteractionHandlers(){
    canvas.onpointerdown = null;
    canvas.onpointerup = null;
    canvas.onpointermove = null;
    canvas.onpointercancel = null;
    canvas.onpointerleave = null;
    if(holdRAF) cancelAnimationFrame(holdRAF);
    holdRAF = null;
    dragActive = false;
    progressWrap.classList.remove('tp-show');
    progressFill.style.width='0%';
  }

  function completeScene(){
    stopSpeak();
    clearInteractionHandlers();
    setTimeout(function(){
      goToScene(sceneIndex+1);
    }, 500);
  }

  function setupInteraction(){
    clearInteractionHandlers();
    var s = scenes[sceneIndex];
    var inter = s.interaction;
    interactionState = {};

    if(inter.type === "tap"){
      interactionState.taps = 0;
      canvas.onpointerdown = function(evt){
        var p = getPointerPos(evt);
        if(!lastFrameArgs) return;
        var hot = lastFrameArgs[inter.target];
        if(!hot) return;
        if(distance(p.x,p.y,hot.x,hot.y) <= hot.r){
          interactionState.taps++;
          if(interactionState.taps >= inter.needed){
            completeScene();
          }
        }
      };
    } else if(inter.type === "tapmulti"){
      interactionState.done = [];
      interactionState.frame = 0;
      canvas.onpointerdown = function(evt){
        var p = getPointerPos(evt);
        if(!lastFrameArgs || !lastFrameArgs.villagers) return;
        var list = lastFrameArgs.villagers;
        for(var i=0;i<list.length;i++){
          var v = list[i];
          if(distance(p.x,p.y,v.x,v.y) <= v.r){
            interactionState.done[v.i] = true;
            var count=0;
            for(var k=0;k<inter.needed;k++){ if(interactionState.done[k]) count++; }
            if(count >= inter.needed){ completeScene(); }
            break;
          }
        }
      };
    } else if(inter.type === "hold"){
      progressWrap.classList.add('tp-show');
      interactionState.holdProgress = 0;
      var startHold = function(evt){
        if(!lastFrameArgs) return;
        var p = getPointerPos(evt);
        var hot = lastFrameArgs[inter.target];
        if(!hot || distance(p.x,p.y,hot.x,hot.y) > hot.r) return;
        holdStart = Date.now();
        function tick(){
          var elapsed = Date.now()-holdStart;
          var prog = Math.min(1, elapsed/inter.durationMs);
          interactionState.holdProgress = prog;
          progressFill.style.width = (prog*100)+'%';
          if(prog>=1){
            completeScene();
            return;
          }
          holdRAF = requestAnimationFrame(tick);
        }
        holdRAF = requestAnimationFrame(tick);
      };
      var stopHold = function(){
        if(holdRAF) cancelAnimationFrame(holdRAF);
        holdRAF = null;
        interactionState.holdProgress = 0;
        progressFill.style.width='0%';
      };
      canvas.onpointerdown = startHold;
      canvas.onpointerup = stopHold;
      canvas.onpointercancel = stopHold;
      canvas.onpointerleave = stopHold;
    } else if(inter.type === "drag"){
      progressWrap.classList.add('tp-show');
      interactionState.climbProgress = 0;
      var dragStartY = 0;
      canvas.onpointerdown = function(evt){
        var p = getPointerPos(evt);
        if(!lastFrameArgs) return;
        var hot = lastFrameArgs[inter.target];
        if(!hot || distance(p.x,p.y,hot.x,hot.y) > hot.r+20) return;
        dragActive = true;
        dragStartY = p.y;
      };
      canvas.onpointermove = function(evt){
        if(!dragActive) return;
        var p = getPointerPos(evt);
        var deltaY = dragStartY - p.y;
        if(deltaY > 0){
          var inc = deltaY / (H*0.55);
          interactionState.climbProgress = Math.min(1, interactionState.climbProgress + inc*0.06);
          dragStartY = p.y;
        }
        progressFill.style.width = (interactionState.climbProgress*100)+'%';
        if(interactionState.climbProgress >= 1){
          dragActive = false;
          completeScene();
        }
      };
      var endDrag = function(){ dragActive = false; };
      canvas.onpointerup = endDrag;
      canvas.onpointercancel = endDrag;
      canvas.onpointerleave = endDrag;
    } else if(inter.type === "timing"){
      interactionState.swingT = 0;
      var startT = Date.now();
      function swingTick(){
        var t = ((Date.now()-startT)%2000)/2000;
        interactionState.swingT = t;
        holdRAF = requestAnimationFrame(swingTick);
      }
      holdRAF = requestAnimationFrame(swingTick);
      canvas.onpointerdown = function(evt){
        var p = getPointerPos(evt);
        if(!lastFrameArgs || !lastFrameArgs.keris) return;
        var hot = lastFrameArgs.keris;
        if(distance(p.x,p.y,hot.x,hot.y) <= hot.r+16){
          var t = lastFrameArgs.zoneT;
          if(t >= inter.zone[0] && t <= inter.zone[1]){
            completeScene();
          }
        }
      };
    } else if(inter.type === "none"){
      // handled by replay button
    }
  }

  /* ================= SCENE NAVIGATION ================= */
  function goToScene(idx){
    stopSpeak();
    clearInteractionHandlers();
    if(idx >= scenes.length){
      idx = scenes.length-1;
    }
    sceneIndex = idx;
    interactionState = null;
    updateDots();
    updateCaption();
    if(sceneIndex === scenes.length-1){
      replayBtn.classList.remove('tp-hidden');
    } else {
      replayBtn.classList.add('tp-hidden');
    }
    setupInteraction();
    drawCurrentFrame();
    speak(scenes[sceneIndex].narration[lang]);
    notifyResize();
  }

  function startStory(){
    started = true;
    coverEl.classList.add('tp-hidden');
    if(!rafId) animLoop();
    goToScene(0);
  }

  function restartStory(){
    replayBtn.classList.add('tp-hidden');
    goToScene(0);
  }

  /* ================= EVENTS ================= */
  startBtn.addEventListener('click', startStory);
  replayBtn.addEventListener('click', restartStory);

  langBtn.addEventListener('click', function(){
    lang = (lang==='id') ? 'en' : 'id';
    applyLangUI();
    updateCaption();
    if(started && sceneIndex>=0){
      speak(scenes[sceneIndex].narration[lang]);
    }
    var url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState(null,'', url.toString());
  });

  muteBtn.addEventListener('click', function(){
    muted = !muted;
    localStorage.setItem('tampomasMuted', muted ? '1':'0');
    applyLangUI();
    if(muted) stopSpeak();
  });

  /* ================= INIT ================= */
  buildDots();
  applyLangUI();
  resizeCanvas();
  drawSky(false);
  drawMountain(0,0);
  drawGround();
  drawPalace(W*0.42,H*0.72,1.0);

  window.addEventListener('load', notifyResize);
  setTimeout(notifyResize, 300);

})();
</script>
</body>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harpa Ajaib - Cerita Rakyat Inggris</title>
<style>
  :root{
    --bg-1:#1b1409;
    --bg-2:#2d2013;
    --panel:#241a10;
    --panel-2:#2f2315;
    --gold:#d9a94d;
    --gold-dim:#a97f34;
    --cream:#f3e6c8;
    --cream-dim:#cbb98f;
    --ember:#e0703e;
    --green:#4f7a4a;
    --shadow: rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-1) 70%);
    color: var(--cream);
    display:flex;
    justify-content:center;
    padding: 14px 10px 20px;
  }
  #app{
    width:100%;
    max-width:640px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border-radius:18px;
    border:1px solid rgba(217,169,77,0.25);
    box-shadow: 0 10px 30px var(--shadow);
    padding:16px;
    position:relative;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:8px;
    flex-wrap:wrap;
  }
  h1{
    font-size:19px;
    margin:0;
    color: var(--gold);
    letter-spacing:0.3px;
    font-weight:700;
  }
  .subtitle{
    font-size:11.5px;
    color: var(--cream-dim);
    margin-top:2px;
    font-style:italic;
  }
  .controls-top{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  button{
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    cursor:pointer;
    border:none;
    outline:none;
  }
  .icon-btn{
    background: rgba(217,169,77,0.14);
    border:1px solid rgba(217,169,77,0.4);
    color: var(--cream);
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    transition: background 0.15s, transform 0.1s;
  }
  .icon-btn:hover{ background: rgba(217,169,77,0.28); }
  .icon-btn:active{ transform: scale(0.94); }
  .icon-btn.lang-btn{ width:auto; padding:0 10px; font-size:12px; font-weight:700; letter-spacing:0.5px; }

  #stage-wrap{
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(217,169,77,0.3);
    background:#0f0a05;
  }
  #stage{
    display:block;
    width:100%;
    height:auto;
    touch-action: none;
  }

  #dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:12px 0 10px;
    flex-wrap:wrap;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background: rgba(217,169,77,0.25);
    transition: background 0.25s, transform 0.25s;
  }
  .dot.active{ background: var(--gold); transform: scale(1.3); }
  .dot.done{ background: var(--gold-dim); }

  #instruction{
    text-align:center;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:13.5px;
    color:#1b1409;
    background: linear-gradient(180deg,#e9cf8f,#d9a94d);
    border-radius:10px;
    padding:9px 14px;
    margin-bottom:10px;
    min-height:18px;
    font-weight:700;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }

  #narration{
    font-size:14.5px;
    line-height:1.55;
    color: var(--cream);
    background: rgba(0,0,0,0.22);
    border-left:3px solid var(--gold);
    border-radius:8px;
    padding:12px 14px;
    min-height:44px;
  }

  #progressbar-wrap{
    display:none;
    margin-top:10px;
  }
  #progressbar-track{
    width:100%;
    height:14px;
    background: rgba(0,0,0,0.35);
    border-radius:7px;
    overflow:hidden;
    border:1px solid rgba(217,169,77,0.35);
  }
  #progressbar-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg,var(--ember),var(--gold));
    transition: width 0.05s linear;
  }
  #progressbar-label{
    font-size:11px;
    text-align:center;
    color: var(--cream-dim);
    margin-top:4px;
    font-family:'Trebuchet MS',sans-serif;
  }

  .action-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .main-btn{
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color:#241a10;
    font-weight:700;
    font-size:14px;
    padding:11px 22px;
    border-radius:24px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    transition: transform 0.12s;
  }
  .main-btn:active{ transform: scale(0.96); }
  .ghost-btn{
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background: transparent;
    border:1px solid rgba(217,169,77,0.5);
    color: var(--cream);
    font-size:13px;
    padding:10px 18px;
    border-radius:24px;
  }

  footer{
    margin-top:16px;
    text-align:center;
    font-size:10.5px;
    color: rgba(203,185,143,0.55);
    font-family:'Trebuchet MS',sans-serif;
  }

  .hidden{ display:none !important; }

  #start-screen, #end-screen{
    text-align:center;
    padding: 30px 10px 10px;
  }
  #start-screen h2, #end-screen h2{
    color: var(--gold);
    font-size:20px;
    margin-bottom:8px;
  }
  #start-screen p, #end-screen p{
    color: var(--cream-dim);
    font-size:13.5px;
    line-height:1.6;
    max-width:440px;
    margin:0 auto 18px;
  }
  .moral-box{
    background: rgba(217,169,77,0.1);
    border:1px solid rgba(217,169,77,0.3);
    border-radius:10px;
    padding:12px 16px;
    font-size:13px;
    color: var(--cream);
    max-width:440px;
    margin: 0 auto 16px;
    font-style:italic;
    line-height:1.6;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="title-text">Harpa Ajaib</h1>
      <div class="subtitle" id="subtitle-text">Cerita Rakyat Inggris</div>
    </div>
    <div class="controls-top">
      <button class="icon-btn lang-btn" id="lang-toggle" title="Ganti Bahasa">EN</button>
      <button class="icon-btn" id="mute-toggle" title="Mute/Unmute">🔊</button>
    </div>
  </header>

  <div id="start-screen">
    <h2 id="start-title">Harpa Ajaib</h2>
    <p id="start-desc">Sebuah dongeng rakyat Inggris tentang Morgan, kebaikan hati, tiga peri penyamar, dan sebuah harpa ajaib yang bisa membuat siapa saja menari.</p>
    <button class="main-btn" id="start-btn">▶ Mulai Cerita</button>
  </div>

  <div id="game-area" class="hidden">
    <div id="stage-wrap">
      <canvas id="stage" width="700" height="500"></canvas>
    </div>

    <div id="dots"></div>

    <div id="instruction"></div>

    <div id="progressbar-wrap">
      <div id="progressbar-track"><div id="progressbar-fill"></div></div>
      <div id="progressbar-label"></div>
    </div>

    <div id="narration"></div>

    <div class="action-row">
      <button class="ghost-btn hidden" id="replay-scene-btn">↺ <span id="replay-scene-text">Ulangi Suara</span></button>
    </div>
  </div>

  <div id="end-screen" class="hidden">
    <h2 id="end-title">Cerita Selesai</h2>
    <div class="moral-box" id="moral-text"></div>
    <div class="action-row">
      <button class="main-btn" id="restart-btn">↺ Ulangi Cerita</button>
    </div>
  </div>

  <footer id="footer-text">Dongeng interaktif · Kumpulan Cerita Rakyat Dunia</footer>
</div>

<script>
(function(){
  "use strict";

  /* ============ LANGUAGE & MUTE STATE ============ */
  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'en' ? 'en' : 'id';
  var muted = false;
  try{ muted = localStorage.getItem('harpaAjaib_muted') === '1'; }catch(e){}

  var UI = {
    id:{
      title:"Harpa Ajaib",
      subtitle:"Cerita Rakyat Inggris",
      startTitle:"Harpa Ajaib",
      startDesc:"Sebuah dongeng rakyat Inggris tentang Morgan, kebaikan hati, tiga peri penyamar, dan sebuah harpa ajaib yang bisa membuat siapa saja menari.",
      startBtn:"▶ Mulai Cerita",
      replayScene:"Ulangi Suara",
      endTitle:"Cerita Selesai",
      restartBtn:"↺ Ulangi Cerita",
      footer:"Dongeng interaktif · Kumpulan Cerita Rakyat Dunia",
      moral:"Hikmah: balaslah kebaikan dengan kebaikan, dan jangan menyimpan dendam — sebab keburukan yang kita perbuat akan kembali kepada diri kita sendiri."
    },
    en:{
      title:"The Magic Harp",
      subtitle:"An English Folktale",
      startTitle:"The Magic Harp",
      startDesc:"An English folktale about Morgan, kindness, three disguised fairies, and a magic harp that could make anyone dance.",
      startBtn:"▶ Start Story",
      replayScene:"Replay Narration",
      endTitle:"The End",
      restartBtn:"↺ Play Again",
      footer:"Interactive folktale · World Folklore Collection",
      moral:"Moral: repay kindness with kindness, and never hold a grudge — for the harm we do to others has a way of returning to us."
    }
  };

  /* ============ SCENE DATA ============ */
  // interaction types: 'tap', 'drag', 'hold', 'mash', 'multitap'
  var SCENES = [
    {
      id:1, interaction:'tap',
      narr:{
        id:"Di sebuah desa di Inggris, hiduplah seorang pria bernama Morgan. Ia tinggal bersama istrinya, dan malam itu ia duduk santai dekat perapian sambil bersenandung — walau banyak orang berkata suaranya jelek.",
        en:"In a village in England lived a man named Morgan. He lived with his wife, and that night he sat by the fireplace humming a tune — even though many said his voice was terrible."
      },
      instr:{ id:"Ketuk perapian yang menyala untuk melanjutkan", en:"Tap the glowing fireplace to continue" }
    },
    {
      id:2, interaction:'tap',
      narr:{
        id:"Tiba-tiba terdengar ketukan di pintu. Tiga orang pengembara berdiri di depan rumah Morgan, kelelahan dan kehabisan bekal makanan.",
        en:"Suddenly there was a knock at the door. Three weary travelers stood outside Morgan's house, out of food and exhausted from their journey."
      },
      instr:{ id:"Ketuk pintu untuk mempersilakan tamu masuk", en:"Tap the door to let the guests in" }
    },
    {
      id:3, interaction:'drag',
      narr:{
        id:"\"Kami kehabisan bekal, maukah engkau memberi kami sedikit makanan?\" pinta mereka. Morgan pun mempersilakan mereka duduk dan menyediakan roti serta susu coklat hangat.",
        en:"\"We have run out of food — would you share some with us?\" they asked. Morgan welcomed them warmly and offered bread and warm chocolate milk."
      },
      instr:{ id:"Seret roti dan susu ke arah para tamu", en:"Drag the bread and the milk to the guests" }
    },
    {
      id:4, interaction:'tap',
      narr:{
        id:"Ketiga tamu itu sangat berterima kasih. Mereka bersikeras membalas kebaikan Morgan. Morgan pun berkata ia ingin memiliki harpa ajaib yang membuat semua orang menari kegirangan saat dimainkan.",
        en:"The three guests were deeply grateful and insisted on repaying Morgan's kindness. Morgan admitted he wished for a magic harp that would make everyone dance with joy when played."
      },
      instr:{ id:"Ketuk cahaya di tengah ruangan untuk melihat keajaiban", en:"Tap the light in the middle of the room to see the magic" }
    },
    {
      id:5, interaction:'tap',
      narr:{
        id:"Seketika cahaya berpendar, dan ketiga pengembara itu lenyap — ternyata mereka adalah peri! Di hadapan Morgan kini tergeletak sebuah harpa emas yang indah, hadiah atas kebaikan hatinya.",
        en:"In a flash of light, the three travelers vanished — they were fairies in disguise! Before Morgan now lay a beautiful golden harp, a gift for his kind heart."
      },
      instr:{ id:"Ketuk harpa emas untuk mengambilnya", en:"Tap the golden harp to pick it up" }
    },
    {
      id:6, interaction:'hold',
      narr:{
        id:"Morgan memetik senar harpa itu. Bunyinya begitu merdu hingga istrinya datang dan tak bisa menahan diri untuk menari mengikuti alunannya.",
        en:"Morgan plucked the harp's strings. The sound was so beautiful that his wife came running and couldn't help but dance along to the melody."
      },
      instr:{ id:"Tahan jarimu di atas senar harpa untuk memainkannya", en:"Hold your finger on the harp strings to play them" },
      holdLabel:{ id:"Memetik senar...", en:"Plucking the strings..." }
    },
    {
      id:7, interaction:'mash',
      narr:{
        id:"Suara harpa terdengar hingga ke jalan. Satu per satu orang yang lewat, lalu para tetangga, ikut keluar rumah dan menari bersama Morgan di halaman depan rumahnya.",
        en:"The sound of the harp carried out to the street. Passersby, then neighbors, one by one came out and joined the joyful dancing in front of Morgan's house."
      },
      instr:{ id:"Ketuk harpa berulang kali untuk mengundang para tetangga menari", en:"Tap the harp repeatedly to invite the neighbors to dance" },
      mashTarget: 8,
      mashLabel:{ id:"Tetangga yang bergabung", en:"Neighbors joined" }
    },
    {
      id:8, interaction:'tap',
      narr:{
        id:"Esok harinya, tamu yang dahulu pernah mengejek suara Morgan datang berkunjung. \"Sekarang kau tak akan mengejek suaraku lagi,\" kata Morgan bangga. Namun sang tamu hanya tertawa, tak percaya.",
        en:"The next day, the guest who once mocked Morgan's singing came to visit. \"Now you won't be able to mock my voice again,\" Morgan said proudly. But the guest only laughed, unconvinced."
      },
      instr:{ id:"Ketuk tamu untuk mendengar ejekannya", en:"Tap the guest to hear him scoff" }
    },
    {
      id:9, interaction:'mash',
      narr:{
        id:"Merasa kesal, Morgan memainkan harpanya dan mempercepat temponya. Sang tamu mulai menari tanpa bisa berhenti, memohon ampun sambil terus bergoyang mengikuti irama yang makin cepat.",
        en:"Annoyed, Morgan played the harp faster and faster. The guest began dancing uncontrollably, begging for mercy as he was forced to keep moving to the ever-quickening rhythm."
      },
      instr:{ id:"Ketuk harpa cepat-cepat untuk mempercepat temponya", en:"Tap the harp quickly to speed up the tempo" },
      mashTarget: 10,
      mashLabel:{ id:"Kelelahan sang tamu", en:"Guest's exhaustion" }
    },
    {
      id:10, interaction:'multitap',
      narr:{
        id:"Sang tamu akhirnya jatuh pingsan kelelahan. Morgan tertawa puas. Namun keesokan paginya, harpa ajaib itu telah lenyap dari rumahnya — para peri murka dan menarik kembali hadiah mereka.",
        en:"The guest finally collapsed from exhaustion. Morgan laughed, satisfied. But the next morning, the magic harp had vanished from his home — the fairies, angered, had taken back their gift."
      },
      instr:{ id:"Ketuk meja, rak, dan jendela untuk mencari harpa yang hilang", en:"Tap the table, the shelf, and the window to search for the lost harp" },
      spots:['table','shelf','window']
    }
  ];

  var TOTAL_SCENES = SCENES.length;

  var MORAL = UI[lang].moral;

  /* ============ DOM refs ============ */
  var els = {
    startScreen: document.getElementById('start-screen'),
    gameArea: document.getElementById('game-area'),
    endScreen: document.getElementById('end-screen'),
    startBtn: document.getElementById('start-btn'),
    restartBtn: document.getElementById('restart-btn'),
    stage: document.getElementById('stage'),
    dots: document.getElementById('dots'),
    instruction: document.getElementById('instruction'),
    narration: document.getElementById('narration'),
    muteToggle: document.getElementById('mute-toggle'),
    langToggle: document.getElementById('lang-toggle'),
    progWrap: document.getElementById('progressbar-wrap'),
    progFill: document.getElementById('progressbar-fill'),
    progLabel: document.getElementById('progressbar-label'),
    replaySceneBtn: document.getElementById('replay-scene-btn'),
    replaySceneText: document.getElementById('replay-scene-text'),
    moralText: document.getElementById('moral-text'),
    footerText: document.getElementById('footer-text'),
    titleText: document.getElementById('title-text'),
    subtitleText: document.getElementById('subtitle-text'),
    startTitle: document.getElementById('start-title'),
    startDesc: document.getElementById('start-desc'),
    endTitle: document.getElementById('end-title')
  };

  var ctx = els.stage.getContext('2d');
  var CW = 700, CH = 500;

  /* ============ RESIZE / postMessage ============ */
  function resizeCanvas(){
    var wrapWidth = els.stage.parentElement.clientWidth;
    els.stage.style.width = wrapWidth + 'px';
    els.stage.style.height = (wrapWidth * (CH/CW)) + 'px';
  }
  function reportHeight(){
    try{
      var h = document.getElementById('app').scrollHeight + 20;
      window.parent.postMessage({ type:'harpaAjaibResize', height:h }, '*');
    }catch(e){}
  }
  window.addEventListener('resize', function(){ resizeCanvas(); reportHeight(); });

  /* ============ SPEECH ============ */
  var synth = window.speechSynthesis;
  var voices = [];
  function loadVoices(){ voices = synth ? synth.getVoices() : []; }
  if(synth){
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  }
  function pickVoice(bcp47){
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase() === bcp47.toLowerCase()) return voices[i];
    }
    for(var j=0;j<voices.length;j++){
      if(voices[j].lang && voices[j].lang.toLowerCase().indexOf(bcp47.split('-')[0].toLowerCase())===0) return voices[j];
    }
    return null;
  }
  function speak(text){
    if(!synth || muted || !text) return;
    try{ synth.cancel(); }catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    var targetLang = lang === 'id' ? 'id-ID' : 'en-US';
    var v = pickVoice(targetLang);
    if(v) u.voice = v;
    u.lang = targetLang;
    u.rate = 0.95;
    u.pitch = 1.0;
    try{ synth.speak(u); }catch(e){}
  }
  function stopSpeak(){ if(synth){ try{ synth.cancel(); }catch(e){} } }

  /* ============ STATE ============ */
  var state = {
    sceneIdx: 0,          // index into SCENES
    started: false,
    holdActive:false,
    holdProgress:0,
    holdRAF:null,
    mashCount:0,
    multiTapDone:[],
    animRAF:null,
    animT:0,
    dragging:null,
    dragItems:[],         // for drag scene
    fireLit:false,
    doorOpen:false,
    harpRevealed:false,
    wifeDancing:false,
    neighborCount:0,
    guestTired:0,
    guestCollapsed:false
  };

  /* ============ DOTS ============ */
  function buildDots(){
    els.dots.innerHTML = '';
    for(var i=0;i<TOTAL_SCENES;i++){
      var d = document.createElement('div');
      d.className = 'dot';
      els.dots.appendChild(d);
    }
  }
  function updateDots(){
    var dotEls = els.dots.children;
    for(var i=0;i<dotEls.length;i++){
      dotEls[i].className = 'dot' + (i < state.sceneIdx ? ' done' : '') + (i === state.sceneIdx ? ' active' : '');
    }
  }

  /* ============ TEXT APPLY ============ */
  function applyStaticText(){
    document.documentElement.lang = lang;
    els.titleText.textContent = UI[lang].title;
    els.subtitleText.textContent = UI[lang].subtitle;
    els.startTitle.textContent = UI[lang].startTitle;
    els.startDesc.textContent = UI[lang].startDesc;
    els.startBtn.textContent = UI[lang].startBtn;
    els.replaySceneText.textContent = UI[lang].replayScene;
    els.endTitle.textContent = UI[lang].endTitle;
    els.restartBtn.textContent = UI[lang].restartBtn;
    els.footerText.textContent = UI[lang].footer;
    els.langToggle.textContent = lang === 'id' ? 'EN' : 'ID';
    els.moralText.textContent = UI[lang].moral;
  }

  /* ============ SCENE FLOW ============ */
  function startStory(){
    state.started = true;
    state.sceneIdx = 0;
    els.startScreen.classList.add('hidden');
    els.endScreen.classList.add('hidden');
    els.gameArea.classList.remove('hidden');
    buildDots();
    enterScene(0);
    reportHeight();
  }

  function resetSceneFlags(){
    state.holdActive = false;
    state.holdProgress = 0;
    if(state.holdRAF){ cancelAnimationFrame(state.holdRAF); state.holdRAF = null; }
    state.mashCount = 0;
    state.multiTapDone = [];
    state.dragging = null;
  }

  function enterScene(idx){
    resetSceneFlags();
    state.transitioning = false;
    state.sceneIdx = idx;
    var sc = SCENES[idx];
    updateDots();
    els.instruction.textContent = sc.instr[lang];
    els.narration.textContent = sc.narr[lang];
    els.progWrap.style.display = (sc.interaction === 'hold' || sc.interaction === 'mash') ? 'block' : 'none';
    els.progFill.style.width = '0%';
    updateProgLabel(sc, 0);
    els.replaySceneBtn.classList.remove('hidden');
    speak(sc.narr[lang]);

    // scene-specific init
    if(sc.id === 3){ initDragScene(); }
    if(sc.id === 5){ state.harpRevealed = false; }
    if(sc.id === 6){ state.wifeDancing = false; }
    if(sc.id === 7){ state.neighborCount = 0; }
    if(sc.id === 9){ state.guestTired = 0; state.guestCollapsed = false; }
    if(sc.id === 10){ state.multiTapDone = []; }

    startAnim();
    reportHeight();
  }

  function updateProgLabel(sc, val){
    if(sc.interaction === 'hold'){
      els.progLabel.textContent = (sc.holdLabel ? sc.holdLabel[lang] : '') + '  ' + Math.round(val) + '%';
    } else if(sc.interaction === 'mash'){
      els.progLabel.textContent = (sc.mashLabel ? sc.mashLabel[lang] : '') + ': ' + Math.round(val) + ' / ' + sc.mashTarget;
    }
  }

  function nextScene(){
    if(state.transitioning) return;
    state.transitioning = true;
    stopSpeak();
    var next = state.sceneIdx + 1;
    if(next >= TOTAL_SCENES){
      finishStory();
    } else {
      enterScene(next);
    }
  }

  function finishStory(){
    stopAnim();
    stopSpeak();
    els.gameArea.classList.add('hidden');
    els.endScreen.classList.remove('hidden');
    reportHeight();
  }

  function restartStory(){
    els.endScreen.classList.add('hidden');
    els.startScreen.classList.remove('hidden');
    reportHeight();
  }

  /* ============ ANIMATION LOOP ============ */
  function startAnim(){
    if(state.animRAF) cancelAnimationFrame(state.animRAF);
    function loop(){
      state.animT += 0.02;
      draw();
      state.animRAF = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopAnim(){
    if(state.animRAF){ cancelAnimationFrame(state.animRAF); state.animRAF = null; }
  }

  /* ============ DRAWING HELPERS ============ */
  function clear(){
    ctx.clearRect(0,0,CW,CH);
  }

  function drawRoomBackground(){
    // night sky through window gradient wall
    var g = ctx.createLinearGradient(0,0,0,CH);
    g.addColorStop(0,'#241c14');
    g.addColorStop(1,'#3a2b18');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,CW,CH);

    // floor
    ctx.fillStyle = '#4a3620';
    ctx.fillRect(0, CH-110, CW, 110);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    for(var i=0;i<CW;i+=40){
      ctx.beginPath(); ctx.moveTo(i, CH-110); ctx.lineTo(i, CH); ctx.stroke();
    }

    // window with night sky + stars
    ctx.fillStyle = '#0d1a2e';
    roundRect(ctx, 520, 60, 130, 150, 8); ctx.fill();
    ctx.strokeStyle = '#6b4a26'; ctx.lineWidth = 8;
    roundRect(ctx, 520, 60, 130, 150, 8); ctx.stroke();
    ctx.strokeStyle = '#6b4a26'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(585,60); ctx.lineTo(585,210); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(520,135); ctx.lineTo(650,135); ctx.stroke();
    // moon
    ctx.fillStyle = '#f3e6c8';
    ctx.beginPath(); ctx.arc(600, 100, 14, 0, Math.PI*2); ctx.fill();
    // stars
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    var starSeeds = [[540,80],[560,180],[620,150],[540,190],[630,90]];
    starSeeds.forEach(function(s,idx){
      var tw = 0.5 + 0.5*Math.sin(state.animT*2 + idx);
      ctx.globalAlpha = tw;
      ctx.beginPath(); ctx.arc(s[0], s[1], 1.6, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  function drawFireplace(lit, hoverGlow){
    var fx = 80, fy = 260, fw = 150, fh = 170;
    // stone frame
    ctx.fillStyle = '#5a5044';
    roundRect(ctx, fx-16, fy-10, fw+32, fh+60, 10); ctx.fill();
    ctx.fillStyle = '#2a2018';
    roundRect(ctx, fx, fy, fw, fh, 6); ctx.fill();

    if(lit){
      var flick = Math.sin(state.animT*8)*4;
      var grad = ctx.createRadialGradient(fx+fw/2, fy+fh-20, 10, fx+fw/2, fy+fh-20, 90+flick);
      grad.addColorStop(0, 'rgba(255,200,90,0.9)');
      grad.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(fx+fw/2, fy+fh-20, 90+flick, 0, Math.PI*2); ctx.fill();

      // flames
      for(var i=0;i<3;i++){
        var fxx = fx + 30 + i*45;
        var h = 55 + 12*Math.sin(state.animT*6 + i*2);
        ctx.fillStyle = i%2===0 ? '#f2a13a' : '#e0703e';
        ctx.beginPath();
        ctx.moveTo(fxx, fy+fh-5);
        ctx.quadraticCurveTo(fxx-16, fy+fh-h*0.6, fxx, fy+fh-h);
        ctx.quadraticCurveTo(fxx+16, fy+fh-h*0.6, fxx, fy+fh-5);
        ctx.fill();
        ctx.fillStyle = '#ffe08a';
        ctx.beginPath();
        ctx.moveTo(fxx, fy+fh-8);
        ctx.quadraticCurveTo(fxx-8, fy+fh-h*0.45, fxx, fy+fh-h*0.75);
        ctx.quadraticCurveTo(fxx+8, fy+fh-h*0.45, fxx, fy+fh-8);
        ctx.fill();
      }
    } else {
      // unlit logs
      ctx.fillStyle = '#3b2a1a';
      ctx.fillRect(fx+25, fy+fh-25, 100, 14);
    }

    if(hoverGlow){
      ctx.strokeStyle = 'rgba(217,169,77,0.9)';
      ctx.lineWidth = 3;
      roundRect(ctx, fx-4, fy-4, fw+8, fh+8, 8); ctx.stroke();
    }

    // mantle glow tag for hit detection reference
    return {x:fx-16, y:fy-10, w:fw+32, h:fh+60};
  }

  function drawMorganChair(sitting){
    var cx = 300, cy = 380;
    ctx.fillStyle = '#5a3d24';
    roundRect(ctx, cx-40, cy, 80, 20, 4); ctx.fill();
    ctx.fillStyle = '#6b4a2c';
    roundRect(ctx, cx-40, cy-60, 14, 80, 4); ctx.fill();
    roundRect(ctx, cx+26, cy-60, 14, 80, 4); ctx.fill();
    drawPerson(cx, cy-30, '#3f6d8f', '#f0cf9a', sitting, 0);
  }

  function drawPerson(x, y, shirtColor, skinColor, sitting, phase, opts){
    opts = opts || {};
    ctx.save();
    ctx.translate(x,y);
    var bounce = opts.dancing ? Math.sin(state.animT*6 + phase)*8 : 0;
    ctx.translate(0, bounce);
    // legs
    ctx.strokeStyle = '#2c2418';
    ctx.lineWidth = 8;
    ctx.lineCap='round';
    var legSwing = opts.dancing ? Math.sin(state.animT*6+phase)*14 : 0;
    ctx.beginPath(); ctx.moveTo(-8,40); ctx.lineTo(-8+legSwing,70); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,40); ctx.lineTo(8-legSwing,70); ctx.stroke();
    // body
    ctx.fillStyle = shirtColor;
    roundRect(ctx, -18, 0, 36, 45, 10); ctx.fill();
    // arms
    ctx.strokeStyle = shirtColor;
    ctx.lineWidth = 9;
    var armSwing = opts.dancing ? Math.sin(state.animT*6+phase+1)*20 : (opts.armsUp ? -20 : 6);
    ctx.beginPath(); ctx.moveTo(-16,8); ctx.lineTo(-30, 8-armSwing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16,8); ctx.lineTo(30, 8+armSwing); ctx.stroke();
    // head
    ctx.fillStyle = skinColor;
    ctx.beginPath(); ctx.arc(0,-14,16,0,Math.PI*2); ctx.fill();
    // hair
    ctx.fillStyle = opts.hair || '#4a3524';
    ctx.beginPath(); ctx.arc(0,-20,16,Math.PI,0); ctx.fill();
    // simple face
    ctx.fillStyle = '#241a10';
    ctx.beginPath(); ctx.arc(-5,-14,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-14,1.6,0,Math.PI*2); ctx.fill();
    if(opts.mouthOpen){
      ctx.beginPath(); ctx.ellipse(0,-8,4,5,0,0,Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,-8,4,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    }
    ctx.restore();
  }

  function drawDoor(open, hoverGlow){
    var dx = 520, dy = 230, dw = 90, dh = 190;
    ctx.fillStyle = '#3a2814';
    roundRect(ctx, dx-8, dy-8, dw+16, dh+16, 6); ctx.fill();
    ctx.save();
    if(open){
      ctx.translate(dx, dy);
      ctx.transform(0.35,0,0,1,0,0);
      ctx.fillStyle = '#6b4a2c';
      ctx.fillRect(0,0,dw,dh);
      ctx.restore();
      // dark opening behind
      ctx.fillStyle = '#0a0704';
      ctx.fillRect(dx, dy, dw, dh);
    } else {
      ctx.fillStyle = '#6b4a2c';
      ctx.fillRect(dx, dy, dw, dh);
      ctx.strokeStyle = '#4a3320';
      ctx.lineWidth = 3;
      ctx.strokeRect(dx+8, dy+10, dw-16, dh/2-14);
      ctx.strokeRect(dx+8, dy+dh/2+4, dw-16, dh/2-14);
      ctx.fillStyle = '#d9a94d';
      ctx.beginPath(); ctx.arc(dx+dw-16, dy+dh/2, 4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if(hoverGlow && !open){
      ctx.strokeStyle = 'rgba(217,169,77,0.9)';
      ctx.lineWidth = 3;
      ctx.strokeRect(dx-4, dy-4, dw+8, dh+8);
    }
    return {x:dx-8,y:dy-8,w:dw+16,h:dh+16};
  }

  function drawTravelers(count, x0){
    for(var i=0;i<count;i++){
      drawPerson(x0 + i*46, 330, '#4a5d3f', '#e0bf90', false, i, {hair:'#2c2218'});
      // hooded cloak effect
      ctx.fillStyle = 'rgba(60,60,50,0.35)';
      ctx.beginPath(); ctx.arc(x0 + i*46, 316-14, 19, Math.PI*0.9, Math.PI*2.1); ctx.fill();
    }
  }

  function drawTable(){
    ctx.fillStyle = '#5a3d24';
    ctx.fillRect(140, 360, 220, 12);
    ctx.fillRect(150, 372, 10, 40);

  function drawFoodItem(type, x, y, dragging){
    ctx.save();
    ctx.translate(x,y);
    if(dragging){ ctx.shadowColor='rgba(217,169,77,0.8)'; ctx.shadowBlur=14; }
    if(type==='bread'){
      ctx.fillStyle = '#c98a45';
      ctx.beginPath(); ctx.ellipse(0,0,26,16,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#a06a30'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-14,-4); ctx.lineTo(14,-4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-10,4); ctx.lineTo(10,4); ctx.stroke();
    } else if(type==='milk'){
      ctx.fillStyle = '#8b5a2b';
      roundRect(ctx,-12,-18,24,32,4); ctx.fill();
      ctx.fillStyle = '#5c3a1a';

  function drawLightBurst(intensity){
    var grad = ctx.createRadialGradient(350,300,5,350,300,40+intensity*120);
    grad.addColorStop(0, 'rgba(255,240,180,'+(0.9)+')');
    grad.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(350,300,40+intensity*120,0,Math.PI*2); ctx.fill();
  }

  function drawHarp(x, y, scale, glow, stringsAnim){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale, scale);
    if(glow){
      ctx.shadowColor = 'rgba(217,169,77,0.9)';
      ctx.shadowBlur = 25;
    }
    // frame
    ctx.strokeStyle = '#d9a94d';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-30,60);
    ctx.quadraticCurveTo(-50,-10,-10,-70);
    ctx.quadraticCurveTo(0,-80,10,-70);
    ctx.lineTo(20,60);
    ctx.closePath();
    ctx.fillStyle = '#b8863a';
    ctx.fill();
    ctx.stroke();
    // strings
    ctx.strokeStyle = '#f3e6c8';
    ctx.lineWidth = 1.4;
    var n = 9;
    for(var i=0;i<n;i++){
      var t = i/(n-1);
      var topX = -8 + t*16 - 12;
      var topY = -68 + t*4;
      var botX = -26 + t*44;
      var botY = 58;
      var jiggle = stringsAnim ? Math.sin(state.animT*30 + i)* (1.5) : 0;
      ctx.beginPath();
      ctx.moveTo(topX, topY);
      ctx.lineTo(botX + jiggle, botY);
      ctx.stroke();
    }
    ctx.restore();
  }

      ctx.translate(430, 420);
      ctx.rotate(Math.PI/2);
      drawPerson(0,0,'#7a3f3f','#e6c89a',false,0,{hair:'#241a10'});

    // Morgan playing harp
    drawPerson(230, 330, '#3f6d8f', '#f0cf9a', false, 0, {armsUp:true, hair:'#5a4028'});
    drawHarp(270, 340, 0.85, true, true);
  }

      case 2: renderScene2(); break;
      case 3: renderScene3(); break;
      case 4: renderScene4(); break;
      case 5: renderScene5(); break;
      case 6: renderScene6(); break;
      case 7: renderScene7(); break;
      case 8: renderScene8(); break;
      case 9: renderScene9(); break;
      case 10: renderScene10(); break;

  /* ============ INPUT HANDLING ============ */
  function getCanvasCoords(evt){
    var rect = els.stage.getBoundingClientRect();
    var clientX, clientY;
    if(evt.touches && evt.touches.length){
      clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
    } else if(evt.changedTouches && evt.changedTouches.length){
      clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY;
    } else {
      clientX = evt.clientX; clientY = evt.clientY;
    }
    var scaleX = CW / rect.width;
    var scaleY = CH / rect.height;
    return { x: (clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function inBox(pt, box){
    return box && pt.x>=box.x && pt.x<=box.x+box.w && pt.y>=box.y && pt.y<=box.h+box.y;
  }

  function handlePointerDown(evt){
    if(!state.started || state.transitioning) return;
    evt.preventDefault();
    var pt = getCanvasCoords(evt);
    var sc = SCENES[state.sceneIdx];

    if(sc.interaction === 'tap'){
      handleTap(sc, pt);
    } else if(sc.interaction === 'drag'){
      startDrag(pt);
    } else if(sc.interaction === 'hold'){
      if(inBox(pt, hitboxes.harpStrings)){
        state.holdActive = true;
        runHold(sc);
      }
    } else if(sc.interaction === 'mash'){
      handleMash(sc, pt);
    } else if(sc.interaction === 'multitap'){
      handleMultiTap(sc, pt);
    }
  }
  function handlePointerMove(evt){
    if(!state.started) return;
    var sc = SCENES[state.sceneIdx];
    if(sc.interaction === 'drag' && state.dragging){
      evt.preventDefault();
      var pt = getCanvasCoords(evt);
      state.dragging.x = pt.x;
      state.dragging.y = pt.y;
    }
  }
  function handlePointerUp(evt){
    if(!state.started) return;
    var sc = SCENES[state.sceneIdx];
    if(sc.interaction === 'drag' && state.dragging){
      endDrag();
    }
    if(sc.interaction === 'hold'){
      state.holdActive = false;
    }
  }

  els.stage.addEventListener('mousedown', handlePointerDown);
  els.stage.addEventListener('mousemove', handlePointerMove);
  window.addEventListener('mouseup', handlePointerUp);
  els.stage.addEventListener('touchstart', handlePointerDown, {passive:false});
  els.stage.addEventListener('touchmove', handlePointerMove, {passive:false});
  els.stage.addEventListener('touchend', handlePointerUp, {passive:false});

  /* ---- TAP scenes ---- */
  function handleTap(sc, pt){
    if(sc.id===1 && inBox(pt, hitboxes.fireplace)){
      nextScene();
    } else if(sc.id===2 && inBox(pt, hitboxes.door)){
      nextScene();
    } else if(sc.id===4 && inBox(pt, hitboxes.lightSpot)){
      nextScene();
    } else if(sc.id===5 && inBox(pt, hitboxes.harp)){
      if(!state.harpRevealed){
        state.harpRevealed = true;
        setTimeout(nextScene, 500);
      }
    } else if(sc.id===8 && inBox(pt, hitboxes.guest)){
      nextScene();
    }
  }

  /* ---- DRAG scene (scene 3) ---- */
  function initDragScene(){
    state.dragItems = [
      {type:'bread', x:170, y:345, homeX:170, homeY:345, delivered:false},
      {type:'milk', x:230, y:345, homeX:230, homeY:345, delivered:false}
    ];
  }
  function startDrag(pt){
    for(var i=0;i<state.dragItems.length;i++){
      var it = state.dragItems[i];
      if(it.delivered) continue;
      var dx = pt.x-it.x, dy = pt.y-it.y;
      if(Math.sqrt(dx*dx+dy*dy) < 30){
        state.dragging = it;
        break;
      }
    }
  }
  function endDrag(){
    if(!state.dragging) return;
    var it = state.dragging;
    if(inBox({x:it.x,y:it.y}, hitboxes.dragZone)){
      it.delivered = true;
      it.x = -999; it.y = -999;
      checkDragComplete();
    } else {
      it.x = it.homeX; it.y = it.homeY;
    }
    state.dragging = null;
  }
  function checkDragComplete(){
    var remaining = state.dragItems.filter(function(d){ return !d.delivered; });
    // update instruction dynamically
    if(remaining.length===0){
      setTimeout(nextScene, 400);
    }
  }

  /* ---- HOLD scene (scene 6, sc.id 5 is actually "5" is harp reveal... wait sc.id 6 uses hold) ---- */
  function runHold(sc){
    function step(){
      if(!state.holdActive){
        // decay
        state.holdProgress = Math.max(0, state.holdProgress - 2.2);
        els.progFill.style.width = state.holdProgress + '%';
        updateProgLabel(sc, state.holdProgress);
        if(state.holdProgress>0){
          state.holdRAF = requestAnimationFrame(step);
        }
        return;
      }
      state.holdProgress = Math.min(100, state.holdProgress + 1.6);
      els.progFill.style.width = state.holdProgress + '%';
      updateProgLabel(sc, state.holdProgress);
      if(state.holdProgress>=35 && !state.wifeDancing){
        state.wifeDancing = true;
      }
      if(state.holdProgress >= 100){
        state.holdActive = false;
        setTimeout(nextScene, 500);
        return;
      }
      state.holdRAF = requestAnimationFrame(step);
    }
    step();
  }

  /* ---- MASH scenes (7 and 9) ---- */
  function handleMash(sc, pt){
    if(inBox(pt, hitboxes.harpStrings)){
      state.mashCount++;
      if(sc.id===7){
        state.neighborCount = Math.min(sc.mashTarget, state.mashCount);
      }
      if(sc.id===9){
        state.guestTired = Math.min(sc.mashTarget, state.mashCount);
      }
      var pct = (state.mashCount/sc.mashTarget)*100;
      els.progFill.style.width = Math.min(100,pct) + '%';
      updateProgLabel(sc, Math.min(state.mashCount, sc.mashTarget));
      if(state.mashCount >= sc.mashTarget){
        if(sc.id===9){ state.guestCollapsed = true; }
        setTimeout(nextScene, 700);
      }
    }
  }

  /* ---- MULTITAP scene (10) ---- */
  function handleMultiTap(sc, pt){
    var map = { table:hitboxes.spotTable, shelf:hitboxes.spotShelf, window:hitboxes.spotWindow };
    sc.spots.forEach(function(key){
      if(state.multiTapDone.indexOf(key)!==-1) return;
      if(inBox(pt, map[key])){
        state.multiTapDone.push(key);
      }
    });
    if(state.multiTapDone.length >= sc.spots.length){
      setTimeout(nextScene, 900);
    }
  }

  /* ============ UI EVENTS ============ */
  els.startBtn.addEventListener('click', startStory);
  els.restartBtn.addEventListener('click', restartStory);
  els.replaySceneBtn.addEventListener('click', function(){
    var sc = SCENES[state.sceneIdx];
    speak(sc.narr[lang]);
  });

  els.muteToggle.addEventListener('click', function(){
    muted = !muted;
    try{ localStorage.setItem('harpaAjaib_muted', muted ? '1':'0'); }catch(e){}
    els.muteToggle.textContent = muted ? '🔇' : '🔊';
    if(muted) stopSpeak();
  });
  els.muteToggle.textContent = muted ? '🔇' : '🔊';

  els.langToggle.addEventListener('click', function(){
    lang = lang === 'id' ? 'en' : 'id';
    applyStaticText();
    if(state.started && !els.gameArea.classList.contains('hidden')){
      var sc = SCENES[state.sceneIdx];
      els.instruction.textContent = sc.instr[lang];
      els.narration.textContent = sc.narr[lang];
      updateProgLabel(sc, sc.interaction==='hold' ? state.holdProgress : (sc.interaction==='mash' ? state.mashCount : 0));
      speak(sc.narr[lang]);
    }
    reportHeight();
  });

  /* ============ INIT ============ */
  applyStaticText();
  resizeCanvas();
  reportHeight();
  window.addEventListener('load', function(){ resizeCanvas(); reportHeight(); });

  // initial idle draw on start screen (subtle)
  clear();

})();
</script>
</body>
</html>

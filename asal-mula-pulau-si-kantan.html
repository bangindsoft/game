<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asal Mula Pulau Si Kantan</title>
<style>
  :root{
    --bg: #f3e9d2;
    --panel: #4a2f1c;
    --panel-light: #6b4226;
    --cream: #fbf3e0;
    --ink: #2a1a10;
    --gold: #c8952e;
    --gold-light: #e8c169;
    --river: #2f6690;
    --river-dark: #1c4460;
    --storm: #232042;
    --storm-light: #4b3f78;
    --leaf: #4c7a41;
    --leaf-dark: #345a2b;
    --danger: #a13d2b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 14px 10px 20px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap');

  #app{
    width:100%;
    max-width: 760px;
    background: var(--cream);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(42,26,16,0.18);
    border: 1px solid rgba(74,47,28,0.15);
  }
  header{
    background: linear-gradient(135deg, var(--panel), var(--panel-light));
    color: var(--cream);
    padding: 14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }
  header h1{
    font-family:'Playfair Display', Georgia, serif;
    font-size: 1.15rem;
    margin:0;
    line-height:1.25;
  }
  header .subtitle{
    font-size: 0.72rem;
    opacity: 0.8;
    margin-top: 2px;
    font-weight:600;
    letter-spacing: 0.02em;
  }
  .controls{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .icon-btn{
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--cream);
    border-radius: 10px;
    width: 38px;
    height: 38px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size: 1rem;
    transition: background 0.15s;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.22); }
  .icon-btn.active{ background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .lang-btn{
    width:auto;
    padding: 0 10px;
    font-size: 0.75rem;
    font-weight:800;
  }

  #stageWrap{
    position:relative;
    width:100%;
    background: linear-gradient(180deg, #dcefef, #cfe6e0);
  }
  #stage{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio: 800 / 500;
    touch-action: manipulation;
  }
  #hotspotLayer{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
  }

  #dots{
    display:flex;
    justify-content:center;
    gap:6px;
    padding: 10px 8px 4px;
    flex-wrap:wrap;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background: rgba(74,47,28,0.22);
    transition: all 0.2s;
  }
  .dot.active{ background: var(--gold); width:20px; border-radius:5px; }
  .dot.done{ background: var(--leaf); }

  #instructionPanel{
    padding: 8px 18px 4px;
    text-align:center;
    min-height: 20px;
  }
  #instructionText{
    font-weight:800;
    font-size: 0.92rem;
    color: var(--panel);
    background: rgba(200,149,46,0.15);
    display:inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px dashed var(--gold);
  }

  #narrationPanel{
    padding: 6px 20px 16px;
    text-align:center;
  }
  #narrationText{
    font-size: 0.95rem;
    line-height:1.5;
    color: var(--ink);
    min-height: 44px;
  }

  #actionRow{
    display:flex;
    justify-content:center;
    gap:10px;
    padding: 4px 16px 18px;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size: 0.9rem;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    background: var(--gold);
    color: var(--ink);
    box-shadow: 0 3px 0 #9c7017;
    transition: transform 0.08s;
  }
  .btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #9c7017; }
  .btn.secondary{
    background: var(--river);
    color: var(--cream);
    box-shadow: 0 3px 0 var(--river-dark);
  }
  .btn.danger{
    background: var(--danger);
    color: var(--cream);
    box-shadow: 0 3px 0 #6e2418;
  }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  footer{
    text-align:center;
    font-size: 0.68rem;
    color: rgba(42,26,16,0.5);
    padding: 8px 12px 14px;
  }

  .hotspot-btn{
    position:absolute;
    cursor:pointer;
    background: transparent;
    border: none;
    padding:0;
  }

  #tapButton{
    position:absolute;
    left:50%;
    bottom:8%;
    transform: translateX(-50%);
    padding: 12px 30px;
    font-size: 1rem;
    border-radius: 999px;
    border: none;
    background: var(--gold);
    color: var(--ink);
    font-weight: 800;
    box-shadow: 0 4px 0 #9c7017;
    cursor:pointer;
  }
  #tapButton:active{ transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #9c7017; }

  .choice-row{
    position:absolute;
    left:50%;
    bottom:6%;
    transform: translateX(-50%);
    display:flex;
    gap: 14px;
  }
  .choice-btn{
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid var(--panel);
    background: var(--cream);
    color: var(--panel);
    font-weight: 800;
    font-size: 0.85rem;
    cursor:pointer;
  }
  .choice-btn.negative{ border-color: var(--danger); color: var(--danger); }

  @media (max-width: 480px){
    header h1{ font-size: 1rem; }
    .btn{ padding: 9px 18px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="titleText">Asal Mula Pulau Si Kantan</h1>
      <div class="subtitle" id="subtitleText">Legenda dari Sumatra Utara</div>
    </div>
    <div class="controls">
      <button class="icon-btn lang-btn" id="langBtn" title="Ganti Bahasa / Change Language">EN</button>
      <button class="icon-btn" id="muteBtn" title="Mute/Unmute">🔊</button>
    </div>
  </header>

  <div id="stageWrap">
    <canvas id="stage" width="800" height="500"></canvas>
    <div id="hotspotLayer"></div>
  </div>

  <div id="dots"></div>

  <div id="instructionPanel"><span id="instructionText"></span></div>
  <div id="narrationPanel"><div id="narrationText"></div></div>

  <div id="actionRow"></div>

  <footer id="footerText">Kisah rakyat Labuhan Batu, Sumatra Utara — diceritakan ulang secara interaktif.</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- State ----------
  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'en' ? 'en' : (localStorage.getItem('siKantanLang') || 'id');
  let muted = localStorage.getItem('siKantanMuted') === '1';
  let currentScene = -1; // -1 = start screen
  let voicesReady = false;

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const hotspotLayer = document.getElementById('hotspotLayer');
  const dotsEl = document.getElementById('dots');
  const instructionText = document.getElementById('instructionText');
  const narrationText = document.getElementById('narrationText');
  const actionRow = document.getElementById('actionRow');
  const langBtn = document.getElementById('langBtn');
  const muteBtn = document.getElementById('muteBtn');
  const titleText = document.getElementById('titleText');
  const subtitleText = document.getElementById('subtitleText');
  const footerText = document.getElementById('footerText');

  // ---------- Text content ----------
  const T = {
    id: {
      title: "Asal Mula Pulau Si Kantan",
      subtitle: "Legenda dari Sumatra Utara",
      footer: "Kisah rakyat Labuhan Batu, Sumatra Utara — diceritakan ulang secara interaktif.",
      startBtn: "Mulai Cerita",
      replayBtn: "Ulangi Cerita",
      nextBtn: "Lanjut",
      startTitle: "Asal Mula Pulau Si Kantan",
      startDesc: "Sebuah legenda dari Labuhan Batu tentang seorang anak miskin yang menjadi kaya raya, namun melupakan ibunya sendiri.",
      endTitle: "Tamat",
      endDesc: "Pulau Si Kantan hingga kini dipercaya sebagai wujud kutukan bagi anak yang durhaka kepada ibunya. Kisah ini mengajarkan kita untuk selalu menghormati dan berbakti kepada orang tua, apa pun keadaan kita.",
    },
    en: {
      title: "The Origin of Si Kantan Island",
      subtitle: "A Legend from North Sumatra",
      footer: "A folktale from Labuhan Batu, North Sumatra — retold as an interactive story.",
      startBtn: "Start Story",
      replayBtn: "Replay Story",
      nextBtn: "Continue",
      startTitle: "The Origin of Si Kantan Island",
      startDesc: "A legend from Labuhan Batu about a poor boy who became wealthy, yet forgot his own mother.",
      endTitle: "The End",
      endDesc: "Si Kantan Island is still believed to be a curse upon a child who betrays his mother. This story teaches us to always respect and care for our parents, whatever our circumstances.",
    }
  };

  // ---------- Scenes data ----------
  // Each scene: id, narration (id/en), instruction (id/en), draw(progressObj), setup(sceneApi), mechanic type
  const scenes = [];

  function addScene(def){ scenes.push(def); }

  // Scene 1: Gubuk miskin di tepi sungai
  addScene({
    key: "hut",
    narration: {
      id: "Di tepi sebuah sungai di Labuhan Batu, Sumatra Utara, hiduplah seorang janda miskin bersama anaknya, Si Kantan, di sebuah gubuk yang reyot dan kumuh. Si Kantan dikenal sebagai anak yang rajin dan patuh kepada ibunya.",
      en: "By a riverbank in Labuhan Batu, North Sumatra, lived a poor widow and her son, Si Kantan, in a run-down, shabby hut. Si Kantan was known as a diligent boy who always obeyed his mother."
    },
    instruction: {
      id: "Ketuk gubuk reyot itu untuk memulai kisah",
      en: "Tap the run-down hut to begin the story"
    },
    draw(p){ drawHutScene(ctx, p); },
    setup(api){
      addHotspot(0.40, 0.42, 0.20, 0.34, api.advance);
    }
  });

  // Scene 2: Mimpi kakek tua
  addScene({
    key: "dream",
    narration: {
      id: "Malam itu, ibu Kantan bermimpi bertemu seorang kakek tua yang menyuruhnya menggali tanah di suatu tempat dalam hutan. Pagi harinya ia menceritakan mimpi itu kepada Si Kantan.",
      en: "That night, Kantan's mother dreamed of an old man who told her to dig at a certain spot in the forest. The next morning, she told Si Kantan about her dream."
    },
    instruction: {
      id: "Ketuk kakek tua di dalam mimpi untuk mendengar pesannya",
      en: "Tap the old man in the dream to hear his message"
    },
    draw(p){ drawDreamScene(ctx, p); },
    setup(api){
      addHotspot(0.62, 0.28, 0.24, 0.34, api.advance);
    }
  });

  // Scene 3: Menggali tanah (press and hold)
  addScene({
    key: "dig",
    narration: {
      id: "Mereka pergi ke hutan membawa peralatan menggali. Sesampainya di bawah pohon besar yang ditunjukkan dalam mimpi, Si Kantan pun mulai menggali tanah dengan penuh semangat.",
      en: "They went to the forest carrying digging tools. Reaching the large tree shown in the dream, Si Kantan began to dig the ground with great enthusiasm."
    },
    instruction: {
      id: "Tahan area tanah di bawah pohon untuk menggali",
      en: "Press and hold the ground beneath the tree to dig"
    },
    draw(p){ drawDigScene(ctx, p); },
    setup(api){
      addHoldHotspot(0.34, 0.62, 0.32, 0.24, 1800, api.advance, (prog)=>{ api.setProgress(prog); });
    }
  });

  // Scene 4: Bungkusan kain (multi-tap)
  addScene({
    key: "bundle",
    narration: {
      id: "Tidak lama menggali, Si Kantan menemukan sebuah benda terbungkus kain putih usang. Ketika dibuka, ternyata sebuah tongkat emas berhiaskan permata yang sangat indah!",
      en: "Not long after digging, Si Kantan found an object wrapped in worn white cloth. When opened, it turned out to be a beautiful golden staff adorned with gems!"
    },
    instruction: {
      id: "Ketuk bungkusan kain 3 kali untuk membukanya",
      en: "Tap the cloth bundle 3 times to unwrap it"
    },
    draw(p){ drawBundleScene(ctx, p); },
    setup(api){
      let taps = 0;
      const needed = 3;
      addHotspot(0.32, 0.42, 0.36, 0.32, ()=>{
        taps++;
        api.setProgress(taps/needed);
        renderCurrentScene();
        if(taps >= needed) api.advance();
      });
    }
  });

  // Scene 5: Berlayar ke Malaka (timing bar)
  addScene({
    key: "sail",
    narration: {
      id: "Karena tongkat itu terlalu berharga untuk dibeli penduduk kampung, Si Kantan berlayar ke Malaka untuk menjualnya. Ia harus mengarungi sungai dan laut lepas yang diterjang badai dahsyat.",
      en: "Since the staff was too precious for the villagers to buy, Si Kantan sailed to Malacca to sell it. He had to cross the river and open sea, battered by a fierce storm."
    },
    instruction: {
      id: "Ketuk tombol KEMUDI saat penunjuk berada di area hijau. Lakukan 3 kali!",
      en: "Tap the STEER button when the pointer is in the green zone. Do it 3 times!"
    },
    draw(p){ drawSailScene(ctx, p); },
    setup(api){
      setupTimingBar(api, 3);
    }
  });

  // Scene 6: Istana raja Malaka
  addScene({
    key: "palace",
    narration: {
      id: "Di Malaka, tak ada pedagang yang mampu membeli tongkat itu. Namun raja Malaka begitu terpesona dan menawarkan untuk menikahkan Si Kantan dengan putrinya sebagai gantinya. Si Kantan pun setuju.",
      en: "In Malacca, no merchant could afford the staff. But the King of Malacca was so captivated that he offered to marry Si Kantan to his daughter instead. Si Kantan agreed."
    },
    instruction: {
      id: "Ketuk tombol 'Terima Pinangan Raja'",
      en: "Tap the 'Accept the King's Offer' button"
    },
    draw(p){ drawPalaceScene(ctx, p); },
    setup(api){
      addButton(api.advance, T[lang].btnAccept || (lang==='id' ? "Terima Pinangan Raja" : "Accept the King's Offer"));
    }
  });

  // Scene 7: Kapal pulang ke kampung (drag)
  addScene({
    key: "shiphome",
    narration: {
      id: "Si Kantan hidup mewah sebagai keluarga kerajaan dan melupakan janjinya pada sang ibu. Namun karena didesak istrinya, ia akhirnya bersedia pulang ke kampung untuk memperkenalkan ibunya.",
      en: "Si Kantan lived in luxury as royalty and forgot his promise to his mother. But pressed by his wife, he finally agreed to return to his village to introduce his mother."
    },
    instruction: {
      id: "Seret kapal menyusuri sungai menuju kampung halaman",
      en: "Drag the ship along the river toward the village"
    },
    draw(p){ drawShipHomeScene(ctx, p); },
    setup(api){
      setupDragScene(api, 0.16, 0.86);
    }
  });

  // Scene 8: Ibu mendayung sampan (press hold)
  addScene({
    key: "rowing",
    narration: {
      id: "Mendengar kabar kedatangan anaknya, sang ibu bergegas mendayung sampan tuanya menuju kapal besar itu, hatinya berdebar penuh rindu dan harap.",
      en: "Hearing news of her son's arrival, the mother hurried to row her old canoe toward the great ship, her heart pounding with longing and hope."
    },
    instruction: {
      id: "Tahan tombol DAYUNG untuk membantu ibu mendayung sampan",
      en: "Press and hold the ROW button to help the mother paddle her canoe"
    },
    draw(p){ drawRowingScene(ctx, p); },
    setup(api){
      addHoldButton(2000, api.advance, (prog)=>{ api.setProgress(prog); }, lang==='id' ? "DAYUNG" : "ROW");
    }
  });

  // Scene 9: Pilihan Si Kantan (branching choice)
  addScene({
    key: "choice",
    narration: {
      id: "Sang ibu memanggil-manggil namanya dari sampan. Namun karena malu memiliki ibu yang tua dan miskin di hadapan istrinya, Si Kantan harus memutuskan sikapnya.",
      en: "The mother called out his name from her canoe. But ashamed to have an old, poor mother in front of his wife, Si Kantan had to decide how to respond."
    },
    instruction: {
      id: "Ketuk salah satu pilihan sikap Si Kantan",
      en: "Tap one of the choices for Si Kantan's response"
    },
    draw(p){ drawChoiceScene(ctx, p); },
    setup(api){
      setupChoiceScene(api);
    }
  });

  // Scene 10: Badai kutukan (tap mash)
  addScene({
    key: "storm",
    narration: {
      id: "Si Kantan mengusir ibunya dengan kasar. Dengan hati hancur, sang ibu berdoa kepada Tuhan agar anaknya diberi balasan setimpal. Seketika langit gelap, petir menyambar, dan badai dahsyat pun turun.",
      en: "Si Kantan cruelly drove his mother away. Heartbroken, she prayed to God for her son to receive his due punishment. Instantly the sky darkened, lightning struck, and a fierce storm descended."
    },
    instruction: {
      id: "Ketuk gambar petir berkali-kali untuk menghadirkan badai",
      en: "Tap the lightning bolt repeatedly to summon the storm"
    },
    draw(p){ drawStormScene(ctx, p); },
    setup(api){
      const needed = 8;
      let taps = 0;
      addHotspot(0.40, 0.05, 0.20, 0.30, ()=>{
        taps++;
        api.setProgress(taps/needed);
        api.customState = { flash:true, litUp:true, shake:(Math.random()-0.5)*16 };
        renderCurrentScene();
        setTimeout(()=>{
          if(sceneStillActive()){
            api.customState = { flash:false, litUp:false, shake:0 };
            renderCurrentScene();
          }
        }, 110);
        if(taps >= needed) api.advance();
      });
      function sceneStillActive(){ return scenes[currentScene] === scenes.find(s=>s.key==='storm') && scenes[currentScene]._api === api; }
    }
  });

  // Scene 11: Pulau muncul
  addScene({
    key: "island",
    narration: {
      id: "Ombak menghempas kapal Si Kantan hingga tenggelam ke dasar Sungai Barumun. Tak lama kemudian, muncullah sebuah pulau di tengah sungai. Penduduk menamainya Pulau Si Kantan.",
      en: "The waves smashed Si Kantan's ship until it sank to the bottom of the Barumun River. Soon after, an island appeared in the middle of the river. The people named it Si Kantan Island."
    },
    instruction: {
      id: "Ketuk permukaan sungai untuk melihat pulau yang muncul",
      en: "Tap the river's surface to see the island emerge"
    },
    draw(p){ drawIslandScene(ctx, p); },
    setup(api){
      addHotspot(0.28, 0.55, 0.44, 0.30, api.advance);
    }
  });

  // ---------- Drawing helpers ----------
  function clear(){
    ctx.clearRect(0,0,800,500);
  }
  function skyRiver(topColor, botColor){
    const g = ctx.createLinearGradient(0,0,0,500);
    g.addColorStop(0, topColor);
    g.addColorStop(1, botColor);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,800,500);
  }
  function drawSun(x,y,r,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawCloud(x,y,scale,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x,y,28*scale,16*scale,0,0,Math.PI*2);
    ctx.ellipse(x+24*scale,y-8*scale,20*scale,14*scale,0,0,Math.PI*2);
    ctx.ellipse(x-24*scale,y-4*scale,18*scale,12*scale,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function drawRiver(y1,y2,color){
    ctx.fillStyle = color;
    ctx.fillRect(0,y1,800,y2-y1);
  }
  function drawRiverWaves(y, color){
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    for(let i=0;i<6;i++){
      ctx.beginPath();
      const yy = y + i*14;
      for(let x=0;x<=800;x+=20){
        const off = Math.sin((x/40)+i)*3;
        if(x===0) ctx.moveTo(x, yy+off); else ctx.lineTo(x, yy+off);
      }
      ctx.stroke();
    }
  }
  function drawTree(x,y,scale,leafColor,trunkColor){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = trunkColor || '#5c3a21';
    ctx.fillRect(-9,0,18,70);
    ctx.fillStyle = leafColor || '#4c7a41';
    ctx.beginPath(); ctx.ellipse(0,-40,55,50,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-45,-15,32,30,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(45,-15,32,30,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawHutShape(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // walls
    ctx.fillStyle = '#8a6238';
    ctx.fillRect(-60,-10,120,90);
    // wall planks
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    for(let i=-50;i<60;i+=15){ ctx.beginPath(); ctx.moveTo(i,-10); ctx.lineTo(i,80); ctx.stroke(); }
    // roof (thatched)
    ctx.fillStyle = '#6b4a26';
    ctx.beginPath();
    ctx.moveTo(-80,-10);
    ctx.lineTo(0,-70);
    ctx.lineTo(80,-10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth=1;
    for(let i=-70;i<75;i+=8){
      ctx.beginPath();
      ctx.moveTo(i, -10 - (70-Math.abs(i))*0.02);
      ctx.lineTo(i*0.55, -10-(70-Math.abs(i*0.55))*0.85+8);
      ctx.stroke();
    }
    // door
    ctx.fillStyle = '#3a2513';
    ctx.fillRect(-16,20,32,60);
    ctx.restore();
  }
  function drawPerson(x,y,scale,skinColor,clothColor,opts){
    opts = opts||{};
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // legs
    ctx.fillStyle = opts.legColor || '#3a2a1a';
    ctx.fillRect(-10,40,8,30);
    ctx.fillRect(2,40,8,30);

    ctx.beginPath();

    ctx.lineTo(20,45);

    ctx.closePath();

      ctx.beginPath(); ctx.moveTo(-14,14); ctx.lineTo(-26,-6); ctx.stroke();

    } else {
      ctx.beginPath(); ctx.moveTo(-14,14); ctx.lineTo(-20,36); ctx.stroke();

    }

      ctx.fillStyle = opts.headScarf;
      ctx.beginPath(); ctx.arc(0,-9,16,Math.PI*0.95,Math.PI*2.05); ctx.fill();
    }
    // simple face
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath(); ctx.arc(-5,-4,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-4,1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- Interaction helpers ----------
  function clearHotspots(){ hotspotLayer.innerHTML = ''; }

  function addHotspot(xr,yr,wr,hr, onClick){
    const el = document.createElement('button');
    el.className = 'hotspot-btn';
    el.style.left = (xr*100)+'%';
    el.style.top = (yr*100)+'%';
    el.style.width = (wr*100)+'%';
    el.style.height = (hr*100)+'%';
    el.setAttribute('aria-label','interact');
    el.addEventListener('click', function(e){ e.preventDefault(); onClick(); });
    hotspotLayer.appendChild(el);
    return el;
  }

  function addHoldHotspot(xr,yr,wr,hr, durationMs, onComplete, onProgress){
    const el = addHotspot(xr,yr,wr,hr, ()=>{});
    let holding = false, start=0, raf=null;
    let progress = 0;
    function step(){
      if(!holding) return;
      const elapsed = performance.now()-start;
      progress = Math.min(1, elapsed/durationMs);
      onProgress(progress);
      renderCurrentScene();
      if(progress>=1){ holding=false; onComplete(); return; }
      raf = requestAnimationFrame(step);
    }
    function begin(e){ e.preventDefault(); holding=true; start=performance.now()-((progress||0)*durationMs*0); start=performance.now(); raf=requestAnimationFrame(step); }
    function end(e){ holding=false; if(raf) cancelAnimationFrame(raf); if(progress<1){ progress=Math.max(0,progress-0.15); onProgress(progress); renderCurrentScene(); } }
    el.addEventListener('mousedown', begin);
    el.addEventListener('touchstart', begin, {passive:false});
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    return el;
  }

  function addButton(onClick, label){
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.id = 'tapButton';
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    hotspotLayer.appendChild(btn);
    return btn;
  }

  function addHoldButton(durationMs, onComplete, onProgress, label){
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.id = 'tapButton';
    btn.textContent = label;
    hotspotLayer.appendChild(btn);
    let holding=false, start=0, raf=null, progress=0, done=false;
    function step(){
      if(!holding) return;
      const elapsed = performance.now()-start;
      progress = Math.min(1, elapsed/durationMs);
      onProgress(progress);
      renderCurrentScene();
      if(progress>=1){ holding=false; if(!done){ done=true; onComplete(); } return; }
      raf = requestAnimationFrame(step);
    }
    function begin(e){ if(done) return; e.preventDefault(); holding=true; start=performance.now(); raf=requestAnimationFrame(step); }
    function end(){ holding=false; if(raf) cancelAnimationFrame(raf); if(progress<1 && !done){ progress=Math.max(0,progress-0.12); onProgress(progress); renderCurrentScene(); } }
    btn.addEventListener('mousedown', begin);
    btn.addEventListener('touchstart', begin, {passive:false});
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
    btn.addEventListener('touchend', end);
    return btn;
  }

  function setupTimingBar(api, hitsNeeded){
    let marker = 0, dir = 1;
    let zoneStart = 0.4, zoneWidth = 0.2;
    let hits = 0;
    let flash = false;
    let boatX = 0;
    let raf;
    function pickZone(){ zoneStart = 0.15 + Math.random()*0.55; }
    pickZone();
    function tick(){
      marker += dir*0.014;
      if(marker>1){ marker=1; dir=-1; }
      if(marker<0){ marker=0; dir=1; }
      api.customState = {marker, zoneStart, zoneWidth, boatX, flash};
      renderCurrentScene();
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    api.onTeardown = ()=>{ cancelAnimationFrame(raf); };
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.id = 'tapButton';
    btn.textContent = lang==='id' ? 'KEMUDI' : 'STEER';
    btn.addEventListener('click', ()=>{
      if(marker >= zoneStart && marker <= zoneStart+zoneWidth){
        hits++;
        boatX = Math.min(1, hits/hitsNeeded);
        flash = true;
        setTimeout(()=>{ flash=false; }, 120);
        pickZone();
        if(hits>=hitsNeeded){
          cancelAnimationFrame(raf);
          setTimeout(api.advance, 400);
        }
      } else {
        flash = false;
        btn.style.background = '#a13d2b';
        setTimeout(()=>{ btn.style.background=''; }, 180);
      }
    });
    hotspotLayer.appendChild(btn);
  }

  function setupDragScene(api, startXr, endXr){
    let dragT = 0;
    let dragging = false;
    let startClientX = 0;
    let baseT = 0;
    api.customState = {dragT};
    renderCurrentScene();
    function move(e){
      if(!dragging) return;
      e.preventDefault && e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const rect = canvas.getBoundingClientRect();
      const deltaXr = (clientX-startClientX)/rect.width;
      dragT = Math.max(0, Math.min(1, baseT - deltaXr/0.72));
      api.customState = {dragT};
      renderCurrentScene();
      if(dragT>=0.97){
        dragging=false;
        cleanup();
        setTimeout(api.advance, 250);
      }
    }
    function down(e){
      e.preventDefault && e.preventDefault();
      dragging=true;
      startClientX = e.touches ? e.touches[0].clientX : e.clientX;
      baseT = dragT;
    }
    function up(){ dragging=false; }
    function cleanup(){
      window.removeEventListener('mousemove', move);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchend', up);
    }
    // draggable hotspot over the boat's current approx starting area (right side, near palace)
    const dragHandle = addHotspot(0.68, 0.58, 0.28, 0.30, ()=>{});
    dragHandle.style.cursor='grab';
    dragHandle.addEventListener('mousedown', down);
    dragHandle.addEventListener('touchstart', down, {passive:false});
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
    api.onTeardown = cleanup;
  }

  function setupChoiceScene(api){
    const wrap = document.createElement('div');
    wrap.className = 'choice-row';
    const hugBtn = document.createElement('button');
    hugBtn.className = 'choice-btn';
    hugBtn.textContent = lang==='id' ? 'Peluk Ibu' : 'Embrace Mother';
    const rejectBtn = document.createElement('button');
    rejectBtn.className = 'choice-btn negative';
    rejectBtn.textContent = lang==='id' ? 'Usir Ibu' : 'Drive Her Away';
    wrap.appendChild(hugBtn);
    wrap.appendChild(rejectBtn);
    hotspotLayer.appendChild(wrap);

    let redirected = false;
    hugBtn.addEventListener('click', ()=>{
      if(redirected) return;
      redirected = true;
      narrationText.textContent = lang==='id'
        ? 'Sayangnya, dalam kisah ini, rasa malu telah menguasai hati Si Kantan. Ia tetap memilih untuk mengusir ibunya sendiri...'
        : 'Sadly, in this tale, shame had already taken hold of Si Kantan\'s heart. He still chose to drive his own mother away...';
      hugBtn.disabled = true;
      hugBtn.style.opacity = 0.4;
    });
    rejectBtn.addEventListener('click', ()=>{ api.advance(); });
  }

  // ---------- Scene engine ----------
  function totalScenes(){ return scenes.length; }

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i=0;i<scenes.length;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.dataset.index = i;
      dotsEl.appendChild(d);
    }
  }
  function updateDots(){
    const nodes = dotsEl.querySelectorAll('.dot');
    nodes.forEach((d,i)=>{
      d.classList.remove('active','done');
      if(i<currentScene) d.classList.add('done');
      else if(i===currentScene) d.classList.add('active');
    });
  }

  let animRaf = null;
  let teardownFn = null;

  function renderCurrentScene(){
    if(currentScene<0 || currentScene>=scenes.length) return;
    const sc = scenes[currentScene];
    const state = sc._api ? sc._api.customState : undefined;
    sc.draw(state || sc._api && {progress: sc._api.progress});
  }

  function stopSpeech(){
    if('speechSynthesis' in window){ window.speechSynthesis.cancel(); }
  }

  function speak(text){
    if(muted) return;
    if(!('speechSynthesis' in window)) return;
    stopSpeech();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang==='id' ? 'id-ID' : 'en-US';
    utter.rate = 0.95;
    utter.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang));
    if(preferred) utter.voice = preferred;
    window.speechSynthesis.speak(utter);
  }

  function teardownScene(){
    if(teardownFn){ try{ teardownFn(); }catch(e){} teardownFn=null; }
    clearHotspots();
  }

  function goToScene(index){
    teardownScene();
    currentScene = index;
    updateDots();
    actionRow.innerHTML = '';

    if(index >= scenes.length){
      showEndScreen();
      return;
    }

    const sc = scenes[index];
    instructionText.textContent = sc.instruction[lang];
    narrationText.textContent = sc.narration[lang];
    speak(sc.narration[lang]);

    let advanced = false;
    const api = {
      progress: 0,
      customState: undefined,
      setProgress(p){ api.progress = p; },
      advance(){
        if(advanced) return;
        advanced = true;
        goToScene(currentScene+1);
      }
    };
    sc._api = api;
    sc.draw({progress:0});
    sc.setup(api);
    teardownFn = api.onTeardown;
    notifyResize();
  }

  function showStartScreen(){
    teardownScene();
    currentScene = -1;
    updateDots();
    clear();
    skyRiver('#bfe3d8','#e9dcb8');
    drawSun(650,90,50,'#f6d778');
    drawCloud(160,80,1.3,'rgba(255,255,255,0.85)');
    ctx.fillStyle = '#8a9a52';
    ctx.fillRect(0,330,800,90);
    ctx.fillStyle = '#7a8a46';
    ctx.fillRect(0,330,800,18);
    drawRiver(420,500,'#3f83a8');
    drawRiverWaves(435,'rgba(255,255,255,0.3)');
    drawTree(700,300,1.1,'#3f6b36');
    drawHutShape(150,290,1.0);
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.35)';
    roundRect(150,150,500,90,16); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.font='bold 30px "Playfair Display", Georgia, serif';
    ctx.fillText(T[lang].startTitle, 400, 200);
    ctx.restore();
    ctx.textAlign='left';

    instructionText.textContent = '';
    narrationText.textContent = T[lang].startDesc;
    actionRow.innerHTML = '';
    const btn = document.createElement('button');
    btn.className='btn';
    btn.textContent = T[lang].startBtn;
    btn.addEventListener('click', ()=>{ goToScene(0); });
    actionRow.appendChild(btn);
    notifyResize();
  }

  function showEndScreen(){
    clear();
    skyRiver('#bfe3d8','#e9dcb8');
    drawSun(730,60,44,'#f6d778');
    drawRiver(340,500,'#3f83a8');
    drawRiverWaves(360,'rgba(255,255,255,0.3)');
    ctx.save();
    ctx.translate(400,420);
    ctx.fillStyle='#7a9a52';
    ctx.beginPath(); ctx.ellipse(0,0,140,50,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5c7a3e';
    ctx.beginPath(); ctx.ellipse(0,-6,130,30,0,0,Math.PI*2); ctx.fill();
    drawTree(-40,-30,0.6,'#3f6b36');
    drawTree(30,-24,0.5,'#4c7a41');
    drawTree(80,-34,0.55,'#345a2b');
    ctx.restore();
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.4)';
    roundRect(160,60,480,70,16); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.font='bold 28px "Playfair Display", Georgia, serif';
    ctx.fillText(T[lang].endTitle, 400,105);
    ctx.restore();
    ctx.textAlign='left';

    instructionText.textContent = '';
    narrationText.textContent = T[lang].endDesc;
    speak(T[lang].endDesc);
    actionRow.innerHTML = '';
    const btn = document.createElement('button');
    btn.className='btn secondary';
    btn.textContent = T[lang].replayBtn;
    btn.addEventListener('click', ()=>{ showStartScreen(); });
    actionRow.appendChild(btn);
    updateDots();
    const nodes = dotsEl.querySelectorAll('.dot');
    nodes.forEach(d=>d.classList.add('done'));
    notifyResize();
  }

  // ---------- Language & Mute ----------
  function applyLangUI(){
    titleText.textContent = T[lang].title;
    subtitleText.textContent = T[lang].subtitle;
    footerText.textContent = T[lang].footer;
    langBtn.textContent = lang==='id' ? 'EN' : 'ID';
    document.documentElement.lang = lang;
  }
  langBtn.addEventListener('click', ()=>{
    lang = lang==='id' ? 'en' : 'id';
    localStorage.setItem('siKantanLang', lang);
    applyLangUI();
    stopSpeech();
    if(currentScene===-1) showStartScreen();
    else if(currentScene>=scenes.length) showEndScreen();
    else goToScene(currentScene);
  });

  function applyMuteUI(){
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('active', muted);
  }
  muteBtn.addEventListener('click', ()=>{
    muted = !muted;
    localStorage.setItem('siKantanMuted', muted ? '1':'0');
    applyMuteUI();
    if(muted) stopSpeech();
    else if(currentScene>=0 && currentScene<scenes.length) speak(scenes[currentScene].narration[lang]);
    else if(currentScene>=scenes.length) speak(T[lang].endDesc);
  });

  // ---------- Resize / postMessage ----------
  function notifyResize(){
    requestAnimationFrame(()=>{
      const h = document.getElementById('app').offsetHeight;
      try{
        window.parent.postMessage({ type: 'siKantanHeight', height: h }, '*');
      }catch(e){}
    });
  }
  window.addEventListener('resize', notifyResize);
  new ResizeObserver(notifyResize).observe(document.getElementById('app'));

  // ---------- Init ----------
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = ()=>{ voicesReady = true; };
  }
  buildDots();
  applyLangUI();
  applyMuteUI();
  showStartScreen();

})();
</script>
</body>

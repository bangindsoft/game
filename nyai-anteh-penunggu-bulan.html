<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyai Anteh Penunggu Bulan</title>
<style>
  :root{
    --na-bg-top:#0b1638;
    --na-bg-bottom:#1c2c5e;
    --na-panel:#131f45;
    --na-panel-2:#1a2a58;
    --na-moon:#f6efd2;
    --na-moon-glow:#fff6d8;
    --na-accent:#ffce54;
    --na-accent-2:#ff9f6b;
    --na-text:#f1f0ff;
    --na-muted:#aab2e0;
    --na-line:#2c3c72;
    --na-good:#7fe3a3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'NA-Body', 'Segoe UI', Tahoma, sans-serif;
    background:linear-gradient(180deg,var(--na-bg-top),var(--na-bg-bottom));
    color:var(--na-text);
    display:flex;
    justify-content:center;
    padding:14px 10px 18px;
  }
  @font-face{
    font-family:'NA-Body';
    src:local('Segoe UI');
  }
  .na-root{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .na-topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .na-title{
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--na-accent);
    margin:0;
  }
  .na-toolbtns{
    display:flex;
    gap:6px;
  }
  .na-iconbtn{
    background:var(--na-panel-2);
    border:1px solid var(--na-line);
    color:var(--na-text);
    border-radius:8px;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .na-iconbtn:hover{background:#22346a;}
  .na-iconbtn:active{transform:scale(.94);}
  .na-iconbtn.na-lang{
    width:auto;
    padding:0 10px;
    font-size:12px;
    font-weight:700;
  }
  .na-stage-wrap{
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    background:radial-gradient(ellipse at 50% 20%, #21306a 0%, #0c1636 75%);
    border:1px solid var(--na-line);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .na-stage{
    position:relative;
    width:100%;
    aspect-ratio:8/5;
  }
  #naCanvas{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    display:block;
  }
  .na-overlay{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .na-hot{
    position:absolute;
    pointer-events:auto;
    background:transparent;
    border:none;
    cursor:pointer;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .na-hot:focus{outline:2px solid rgba(255,206,84,.6);}
  .na-startlayer{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(6,11,28,.72);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
    padding:20px;
    pointer-events:auto;
  }
  .na-startlayer h2{
    margin:0;
    font-size:19px;
    color:var(--na-moon-glow);
  }
  .na-startlayer p{
    margin:0;
    font-size:13px;
    color:var(--na-muted);
    max-width:420px;
    line-height:1.5;
  }
  .na-primarybtn{
    background:linear-gradient(180deg,var(--na-accent),#e0a83a);
    color:#3a2500;
    border:none;
    border-radius:999px;
    padding:11px 26px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(255,206,84,.35);
    transition:transform .1s ease;
  }
  .na-primarybtn:active{transform:scale(.96);}
  .na-caption{
    background:var(--na-panel);
    border:1px solid var(--na-line);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    line-height:1.55;
    min-height:44px;
    color:var(--na-text);
  }
  .na-instruction{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--na-accent-2);
    font-weight:700;
    min-height:18px;
    padding:0 2px;
  }
  .na-instruction.na-hidden{visibility:hidden;}
  .na-instruction::before{
    content:"👉";
    font-size:13px;
  }
  .na-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .na-dots{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .na-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--na-line);
    transition:background .2s ease, transform .2s ease;
  }
  .na-dot.na-active{
    background:var(--na-accent);
    transform:scale(1.25);
  }
  .na-dot.na-done{background:var(--na-good);}
  .na-actionrow{
    display:flex;
    gap:8px;
  }
  .na-footer{
    text-align:center;
    font-size:11px;
    color:#5f6aa0;
    padding-top:2px;
  }
  .na-badge{
    display:inline-block;
    background:var(--na-panel-2);
    border:1px solid var(--na-line);
    border-radius:999px;
    padding:2px 10px;
    font-size:11px;
    color:var(--na-muted);
  }
  @media (max-width:380px){
    .na-title{font-size:13px;}
    .na-caption{font-size:13px;}
  }
</style>
</head>
<body>
<div class="na-root">

  <div class="na-topbar">
    <p class="na-title" id="naTitle">Nyai Anteh Penunggu Bulan</p>
    <div class="na-toolbtns">
      <button class="na-iconbtn na-lang" id="naLangBtn" type="button" aria-label="Switch language">EN</button>
      <button class="na-iconbtn" id="naMuteBtn" type="button" aria-label="Mute narration">🔊</button>
    </div>
  </div>

  <div class="na-stage-wrap">
    <div class="na-stage">
      <canvas id="naCanvas" width="800" height="500"></canvas>
      <div class="na-overlay" id="naOverlay"></div>
      <div class="na-startlayer" id="naStartLayer">
        <h2 id="naStartHeading">Nyai Anteh Penunggu Bulan</h2>
        <p id="naStartText">Dongeng rakyat Jawa Barat tentang seorang dayang istana yang akhirnya tinggal selamanya di bulan bersama kucing kesayangannya.</p>
        <button class="na-primarybtn" id="naStartBtn" type="button">Mulai Cerita</button>
      </div>
    </div>
  </div>

  <div class="na-caption" id="naCaption"></div>
  <div class="na-instruction na-hidden" id="naInstruction"></div>

  <div class="na-controls">
    <div class="na-dots" id="naDots"></div>
    <div class="na-actionrow">
      <button class="na-iconbtn" id="naReplayBtn" type="button" style="display:none;width:auto;padding:0 14px;font-weight:700;font-size:12.5px;" aria-label="Replay story">↺ <span id="naReplayLabel" style="margin-left:4px;">Ulangi</span></button>
    </div>
  </div>

  <div class="na-footer">
    <span class="na-badge" id="naFooterBadge">Cerita Rakyat Jawa Barat</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ STATE ============ */
  var NA = {
    lang: 'id',
    muted: false,
    sceneIndex: 0,
    started: false,
    voices: [],
    voiceReady: false,
    currentUtterance: null,
    resizeSent: -1
  };

  var qs = new URLSearchParams(window.location.search);
  if (qs.get('lang') === 'en') NA.lang = 'en';

  try {
    var storedMute = localStorage.getItem('na_muted');
    if (storedMute === '1') NA.muted = true;
  } catch(e){}

  /* ============ DOM ============ */
  var canvas = document.getElementById('naCanvas');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('naOverlay');
  var captionEl = document.getElementById('naCaption');
  var instructionEl = document.getElementById('naInstruction');
  var dotsEl = document.getElementById('naDots');
  var startLayer = document.getElementById('naStartLayer');
  var startBtn = document.getElementById('naStartBtn');
  var replayBtn = document.getElementById('naReplayBtn');
  var muteBtn = document.getElementById('naMuteBtn');
  var langBtn = document.getElementById('naLangBtn');
  var titleEl = document.getElementById('naTitle');
  var startHeading = document.getElementById('naStartHeading');
  var startText = document.getElementById('naStartText');
  var replayLabel = document.getElementById('naReplayLabel');
  var footerBadge = document.getElementById('naFooterBadge');

  var CW = 800, CH = 500;

  /* ============ I18N ============ */
  var T = {
    id: {
      title: "Nyai Anteh Penunggu Bulan",
      startHeading: "Nyai Anteh Penunggu Bulan",
      startText: "Dongeng rakyat Jawa Barat tentang seorang dayang istana yang akhirnya tinggal selamanya di bulan bersama kucing kesayangannya.",
      startBtn: "Mulai Cerita",
      replay: "Ulangi",
      footerBadge: "Cerita Rakyat Jawa Barat",
      mute: "Bisukan narasi",
      unmute: "Aktifkan narasi"
    },
    en: {
      title: "Nyai Anteh, Guardian of the Moon",
      startHeading: "Nyai Anteh, Guardian of the Moon",
      startText: "A West Javanese folktale about a palace lady-in-waiting who ends up living forever on the moon with her beloved cat.",
      startBtn: "Start Story",
      replay: "Replay",
      footerBadge: "West Javanese Folktale",
      mute: "Mute narration",
      unmute: "Unmute narration"
    }
  };

  /* ============ SCENES ============ */
  // Each scene: id, caption {id,en}, instruction {id,en}, setup(scene), draw(progress)
  var scenes = [];

  function addScene(s){ scenes.push(s); }

  /* ---------- Drawing helpers ---------- */
  function clear(){
    var g = ctx.createLinearGradient(0,0,0,CH);
    g.addColorStop(0,'#0b1638');
    g.addColorStop(1,'#1c2c5e');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,CW,CH);
  }

  function drawStars(seed, count, area){
    area = area || {x:0,y:0,w:CW,h:CH*0.6};
    var r = mulberry32(seed);
    ctx.save();
    for (var i=0;i<count;i++){
      var x = area.x + r()*area.w;
      var y = area.y + r()*area.h;
      var s = r()*1.6+0.4;
      ctx.globalAlpha = 0.35 + r()*0.5;
      ctx.fillStyle = '#fff8dd';
      ctx.beginPath();
      ctx.arc(x,y,s,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function drawMoon(cx,cy,r,glow){
    ctx.save();
    if (glow){
      var gg = ctx.createRadialGradient(cx,cy,r*0.6,cx,cy,r*2.6);
      gg.addColorStop(0,'rgba(255,246,216,0.55)');
      gg.addColorStop(1,'rgba(255,246,216,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(cx,cy,r*2.6,0,Math.PI*2);
      ctx.fill();
    }
    var mg = ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
    mg.addColorStop(0,'#fffdf0');
    mg.addColorStop(1,'#e7dcae');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(200,185,140,0.35)';
    ctx.beginPath(); ctx.arc(cx-r*0.35,cy-r*0.15,r*0.14,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.25,cy+r*0.3,r*0.1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.1,cy-r*0.35,r*0.07,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawGround(color, y){
    ctx.save();
    ctx.fillStyle = color || '#233a63';
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.quadraticCurveTo(CW*0.5, y-18, CW, y);
    ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPalaceSilhouette(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#101c40';
    // main hall
    ctx.beginPath();
    ctx.moveTo(-140,40);
    ctx.lineTo(-140,-30);
    ctx.lineTo(-90,-70);
    ctx.lineTo(-40,-30);
    ctx.lineTo(-40,40);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(40,40);
    ctx.lineTo(40,-30);
    ctx.lineTo(90,-70);
    ctx.lineTo(140,-30);
    ctx.lineTo(140,40);
    ctx.closePath();
    ctx.fill();
    // center dome tower
    ctx.beginPath();
    ctx.moveTo(-45,40);
    ctx.lineTo(-45,-60);
    ctx.lineTo(0,-105);
    ctx.lineTo(45,-60);
    ctx.lineTo(45,40);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffce54';
    ctx.beginPath();
    ctx.arc(0,-105,5,0,Math.PI*2);
    ctx.fill();
    // windows glow
    ctx.fillStyle = 'rgba(255,206,84,0.55)';
    [[-90,-10],[90,-10],[0,-30]].forEach(function(p){
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(p[0]-6,p[1]-8,12,16,3) : ctx.rect(p[0]-6,p[1]-8,12,16);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawTree(x,y,scale,swayFrame){
    var sway = Math.sin((swayFrame||0)*0.05)*3;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.strokeStyle = '#3a2a1c';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(0,40);
    ctx.quadraticCurveTo(sway*0.3,0,sway,-50);
    ctx.stroke();
    var foliageColors = ['#1f5c3f','#28714c','#173f2c'];
    for (var i=0;i<3;i++){
      ctx.fillStyle = foliageColors[i];
      ctx.beginPath();
      ctx.arc(sway + (i-1)*22, -60+ i*6, 34-i*4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFigure(x,y,scale,opts){
    opts = opts || {};
    var robe = opts.robe || '#7a4fae';
    var robe2 = opts.robe2 || '#5c3688';
    var skin = opts.skin || '#e9b98a';
    var hair = opts.hair || '#241a12';
    var isMale = !!opts.male;
    var armAngle = opts.armAngle || 0;
    var flip = opts.flip ? -1 : 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale*flip, scale);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(0,4,26,7,0,0,Math.PI*2);
    ctx.fill();
    // robe
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(-20,0);
    ctx.quadraticCurveTo(-26,-55,-10,-70);
    ctx.lineTo(10,-70);
    ctx.quadraticCurveTo(26,-55,20,0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = robe2;
    ctx.beginPath();
    ctx.moveTo(-20,0);
    ctx.quadraticCurveTo(0,-10,20,0);
    ctx.lineTo(20,6);
    ctx.quadraticCurveTo(0,-2,-20,6);
    ctx.closePath();
    ctx.fill();
    // arm
    ctx.strokeStyle = robe;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(14,-55);
    ctx.lineTo(14 + Math.cos(armAngle)*22, -55 + Math.sin(armAngle)*22);
    ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(14 + Math.cos(armAngle)*22, -55 + Math.sin(armAngle)*22, 5,0,Math.PI*2);
    ctx.fill();
    // neck+head
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0,-82,15,0,Math.PI*2);
    ctx.fill();
    // hair
    ctx.fillStyle = hair;
    if (isMale){
      ctx.beginPath();
      ctx.arc(0,-88,15.5,Math.PI,Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0,-86,16,Math.PI*0.95,Math.PI*2.05);
      ctx.fill();
      // sanggul / bun
      ctx.beginPath();
      ctx.arc(0,-100,7,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-14,-80); ctx.quadraticCurveTo(-20,-55,-14,-40);
      ctx.quadraticCurveTo(-10,-60,-10,-80);
      ctx.closePath(); ctx.fill();
    }
    // face hint
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.arc(-4,-82,1.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-82,1.4,0,Math.PI*2); ctx.fill();
    if (opts.smile !== false){
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(0,-78,3,0.15*Math.PI,0.85*Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCat(x,y,scale,mischief){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0,10,20,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#403450';
    ctx.beginPath();
    ctx.ellipse(0,0,18,12,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(16,-6,9,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(10,-13); ctx.lineTo(15,-22); ctx.lineTo(18,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(20,-13); ctx.lineTo(26,-21); ctx.lineTo(26,-11); ctx.closePath(); ctx.fill();
    var tailWag = mischief ? Math.sin(Date.now()/120)*10 : -6;
    ctx.strokeStyle = '#403450';
    ctx.lineWidth = 5;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-16,2);
    ctx.quadraticCurveTo(-32,tailWag-4, -26, tailWag-18);
    ctx.stroke();
    ctx.fillStyle = '#ffd76a';
    ctx.beginPath(); ctx.arc(14,-7,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(19,-7,1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawJasmine(x,y,collected){
    ctx.save();
    ctx.translate(x,y);
    ctx.globalAlpha = collected ? 0.15 : 1;
    ctx.strokeStyle = '#2f6b45';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(0,0); ctx.stroke();
    ctx.fillStyle = '#fffef2';
    for (var i=0;i<5;i++){
      var ang = i*(Math.PI*2/5) - Math.PI/2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(ang)*7, Math.sin(ang)*7, 5,3, ang, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffce54';
    ctx.beginPath(); ctx.arc(0,0,2.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawDoor(x,y,scale,open){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#5a3a22';
    ctx.fillRect(-26,-70,52,72);
    ctx.fillStyle = '#3a2513';
    ctx.fillRect(-26,-70,52,6);
    var swing = open ? 34 : 0;
    ctx.save();
    ctx.translate(-24,0);
    ctx.rotate(-swing*Math.PI/180);
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(0,-68,44,70);
    ctx.strokeStyle = '#4a3018';
    ctx.lineWidth = 2;
    ctx.strokeRect(6,-60,32,54);
    ctx.restore();
    ctx.restore();
  }

  function drawCarriage(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#c98a2e';
    ctx.beginPath();
    ctx.moveTo(-50,-10); ctx.quadraticCurveTo(-50,-45,-20,-45);
    ctx.lineTo(20,-45); ctx.quadraticCurveTo(50,-45,50,-10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffce54';
    ctx.fillRect(-14,-38,28,20);
    ctx.strokeStyle = '#8a5a1a';
    ctx.lineWidth = 3;
    ctx.strokeRect(-14,-38,28,20);
    ['#3a2513'].forEach(function(c){
      ctx.fillStyle = c;
      [-32,32].forEach(function(wx){
        ctx.beginPath();
        ctx.arc(wx,-6,14,0,Math.PI*2);
        ctx.fill();
      });
    });
    ctx.fillStyle = '#c98a2e';
    [-32,32].forEach(function(wx){
      ctx.beginPath(); ctx.arc(wx,-6,6,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function drawThread(points, color){
    ctx.save();
    ctx.strokeStyle = color || '#f6efd2';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    points.forEach(function(p,i){ i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); });
    ctx.stroke();
    ctx.restore();
  }

  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  /* ============ NARRATION ============ */
  function loadVoices(){
    NA.voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    NA.voiceReady = true;
  }
  if ('speechSynthesis' in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(lang){
    var wanted = lang === 'en' ? 'en' : 'id';
    var list = NA.voices || [];
    var exact = list.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(wanted) === 0; });
    if (exact.length) return exact[0];
    return null;
  }

  function speak(text){
    if (!('speechSynthesis' in window)) return;
    if (NA.muted) return;
    try {
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = NA.lang === 'en' ? 'en-US' : 'id-ID';
      var v = pickVoice(NA.lang);
      if (v) utter.voice = v;
      utter.rate = 0.95;
      utter.pitch = 1.02;
      NA.currentUtterance = utter;
      window.speechSynthesis.speak(utter);
    } catch(e){}
  }

  function stopSpeak(){
    if ('speechSynthesis' in window){
      try { window.speechSynthesis.cancel(); } catch(e){}
    }
  }

  /* ============ RESIZE (postMessage) ============ */
  function reportSize(){
    var h = document.documentElement.scrollHeight;
    if (Math.abs(h - NA.resizeSent) < 2) return;
    NA.resizeSent = h;
    try {
      window.parent.postMessage({ type: 'na-resize', slug: 'nyai-anteh', height: h }, '*');
    } catch(e){}
  }
  window.addEventListener('load', function(){
    reportSize();
    setTimeout(reportSize, 300);
  });
  window.addEventListener('resize', reportSize);
  if (window.ResizeObserver){
    new ResizeObserver(reportSize).observe(document.body);
  }

  /* ============ OVERLAY HOTSPOT HELPERS ============ */
  function clearOverlay(){
    overlay.innerHTML = '';
  }
  function addHot(px, py, pw, ph, onActivate, label){
    var b = document.createElement('button');
    b.className = 'na-hot';
    b.style.left = px + '%';
    b.style.top = py + '%';
    b.style.width = pw + '%';
    b.style.height = ph + '%';
    b.setAttribute('aria-label', label || 'interact');
    b.disabled = false;
    var used = false;
    function handler(e){
      e.preventDefault();
      if (b.disabled) return;
      onActivate(b, e);
    }
    b.addEventListener('click', handler);
    overlay.appendChild(b);
    return b;
  }
  function addDraggable(px,py,pw,ph,onDrag,onDrop,label){
    var b = document.createElement('button');
    b.className = 'na-hot';
    b.style.left = px + '%';
    b.style.top = py + '%';
    b.style.width = pw + '%';
    b.style.height = ph + '%';
    b.setAttribute('aria-label', label || 'drag');
    var dragging = false;
    function getPct(e){
      var rect = overlay.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX);
      var cy = (e.touches ? e.touches[0].clientY : e.clientY);
      return { x: (cx-rect.left)/rect.width*100, y:(cy-rect.top)/rect.height*100 };
    }
    function start(e){ dragging = true; e.preventDefault(); }
    function move(e){
      if (!dragging) return;
      var p = getPct(e);
      onDrag(p);
    }
    function end(e){
      if (!dragging) return;
      dragging = false;
      var p = getPct(e);
      onDrop(p);
    }
    b.addEventListener('mousedown', start);
    b.addEventListener('touchstart', start, {passive:false});
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('mouseup', end);
    window.addEventListener('touchend', end);
    overlay.appendChild(b);
    return b;
  }
  function addHoldButton(px,py,pw,ph,onHoldTick,onComplete,durationMs,label){
    var b = document.createElement('button');
    b.className = 'na-hot';
    b.style.left = px+'%'; b.style.top = py+'%';
    b.style.width = pw+'%'; b.style.height = ph+'%';
    b.setAttribute('aria-label', label||'hold');
    var holding = false, progress = 0, raf = null, last = 0;
    function step(ts){
      if (!holding){ raf=null; return; }
      if (!last) last = ts;
      var dt = ts-last; last = ts;
      progress += dt/durationMs;
      if (progress >= 1){
        progress = 1;
        onHoldTick(progress);
        holding = false;
        onComplete();
        return;
      }
      onHoldTick(progress);
      raf = requestAnimationFrame(step);
    }
    function start(e){ e.preventDefault(); if (b.disabled) return; holding = true; last=0; raf = requestAnimationFrame(step); }
    function stop(e){
      holding = false;
      if (progress < 1){ progress = Math.max(0, progress - 0.18); onHoldTick(progress); }
    }
    b.addEventListener('mousedown', start);
    b.addEventListener('touchstart', start, {passive:false});
    b.addEventListener('mouseup', stop);
    b.addEventListener('mouseleave', stop);
    b.addEventListener('touchend', stop);
    overlay.appendChild(b);
    return b;
  }

      ctx.fillStyle='#fff';
      ctx.textAlign='center';
      ctx.fillText(NA.lang==='id' ? 'Tenunan Tangga' : 'Woven Ladder', bx+bw/2, by-8);
      ctx.restore();
      if (sc.finished){
        ctx.save();
        ctx.font='bold 20px serif';
        ctx.fillStyle='#ffce54';
        ctx.textAlign='center';
        ctx.fillText(NA.lang==='id' ? 'Nyai Anteh tetap tinggal di bulan...' : 'Nyai Anteh remains on the moon...', 400, 60);
        ctx.restore();
      }
    }
  });

  /* ============ ENGINE ============ */
  function setCaption(text){
    captionEl.textContent = text;
  }
  function setInstruction(text){
    if (text){
      instructionEl.textContent = text;
      instructionEl.classList.remove('na-hidden');
    } else {
      instructionEl.textContent = '';
      instructionEl.classList.add('na-hidden');
    }
  }
  function draw(sc, frame){
    sc.draw(sc, frame);
  }

  function buildDots(){
    dotsEl.innerHTML = '';
    scenes.forEach(function(_, i){
      var d = document.createElement('div');
      d.className = 'na-dot';
      d.id = 'naDot'+i;
      dotsEl.appendChild(d);
    });
  }
  function updateDots(){
    scenes.forEach(function(_, i){
      var d = document.getElementById('naDot'+i);
      if (!d) return;
      d.classList.remove('na-active','na-done');
      if (i < NA.sceneIndex) d.classList.add('na-done');
      else if (i === NA.sceneIndex) d.classList.add('na-active');
    });
  }

  function showContinue(){
    setInstruction(NA.lang==='id' ? 'Ketuk tombol Lanjutkan untuk melanjutkan cerita.' : 'Tap the Continue button to proceed.');
    var b = addHot(35,84,30,10,function(btn){
      btn.disabled = true;
      goNext();
    }, 'continue');
    b.style.background = 'rgba(255,206,84,0.16)';
    b.style.border = '1px solid rgba(255,206,84,0.6)';
    b.style.borderRadius = '999px';
    b.style.color = '#ffce54';
    b.style.fontWeight = '800';
    b.style.fontSize = '13px';
    b.style.display='flex';
    b.style.alignItems='center';
    b.style.justifyContent='center';
    b.textContent = NA.lang==='id' ? 'Lanjutkan ▶' : 'Continue ▶';
    b.disabled = false;
  }

  function loadScene(i){
    NA.sceneIndex = i;
    clearOverlay();
    var sc = scenes[i];
    setCaption(sc.caption[NA.lang]);
    setInstruction(sc.instruction ? sc.instruction[NA.lang] : '');
    updateDots();
    sc.setup(sc);
    speak(sc.caption[NA.lang]);
    reportSize();
  }

  function goNext(){
    stopSpeak();
    if (NA.sceneIndex < scenes.length - 1){
      loadScene(NA.sceneIndex + 1);
    } else {
      finishStory();
    }
  }

  function finishStory(){
    clearOverlay();
    setInstruction('');
    replayBtn.style.display = 'inline-flex';
    reportSize();
  }

  function startStory(){
    NA.started = true;
    startLayer.style.display = 'none';
    buildDots();
    loadScene(0);
  }

  function restartStory(){
    replayBtn.style.display = 'none';
    NA.sceneIndex = 0;
    loadScene(0);
  }

  /* ============ CONTROLS ============ */
  startBtn.addEventListener('click', startStory);
  replayBtn.addEventListener('click', restartStory);

  muteBtn.addEventListener('click', function(){
    NA.muted = !NA.muted;
    muteBtn.textContent = NA.muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', NA.muted ? T[NA.lang].mute : T[NA.lang].unmute);
    try { localStorage.setItem('na_muted', NA.muted ? '1' : '0'); } catch(e){}
    if (NA.muted) stopSpeak();
  });

  langBtn.addEventListener('click', function(){
    NA.lang = (NA.lang === 'id') ? 'en' : 'id';
    applyLang();
    if (NA.started && scenes[NA.sceneIndex]){
      var sc = scenes[NA.sceneIndex];
      setCaption(sc.caption[NA.lang]);
      setInstruction(sc.instruction ? sc.instruction[NA.lang] : '');
      draw(sc, 0);
      speak(sc.caption[NA.lang]);
    }
  });

  function applyLang(){
    var t = T[NA.lang];
    titleEl.textContent = t.title;
    startHeading.textContent = t.startHeading;
    startText.textContent = t.startText;
    startBtn.textContent = t.startBtn;
    replayLabel.textContent = t.replay;
    footerBadge.textContent = t.footerBadge;
    langBtn.textContent = (NA.lang === 'id') ? 'EN' : 'ID';
    document.documentElement.lang = NA.lang;
  }

  /* ============ INIT ============ */
  muteBtn.textContent = NA.muted ? '🔇' : '🔊';
  applyLang();
  clear();
  drawStars(1, 40, {x:0,y:0,w:CW,h:260});
  drawMoon(400,230,90,true);
  reportSize();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asal Usul Gubuk Rubuh</title>
<style>
  :root{
    --bg-deep:#2b1810;
    --bg-panel:#3c2415;
    --wood:#5a3825;
    --wood-light:#7a5138;
    --gold:#d4a94a;
    --gold-bright:#f0c866;
    --cream:#f3e6c9;
    --maroon:#7a2e2e;
    --maroon-light:#9c4444;
    --green:#4a7c59;
    --green-dark:#345a3f;
    --sky-top:#3a2a4a;
    --sky-bottom:#c97f4a;
    --ink:#2a1c12;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:var(--bg-deep);
    color:var(--cream);
    overflow-x:hidden;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    background:linear-gradient(180deg,var(--bg-deep),#1c0f09);
    padding:14px 14px 18px;
    border-radius:10px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .brand{
    font-size:15px;
    font-weight:700;
    letter-spacing:.5px;
    color:var(--gold-bright);
  }
  .controls{
    display:flex;
    gap:6px;
  }
  .iconbtn{
    background:var(--bg-panel);
    border:1px solid var(--wood-light);
    color:var(--cream);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    transition:background .15s;
  }
  .iconbtn:hover{ background:var(--wood); }
  .iconbtn.active{ border-color:var(--gold); color:var(--gold-bright); }

  .stage-wrap{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--wood-light);
    border-radius:10px;
    padding:10px;
  }
  #stage{
    display:block;
    width:100%;
    height:auto;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
    border-radius:8px;
    touch-action:manipulation;
    cursor:pointer;
  }
  .dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:10px 0 4px;
    flex-wrap:wrap;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#6b4a2f;
    transition:all .2s;
  }
  .dot.active{ background:var(--gold-bright); width:20px; border-radius:5px; }
  .dot.done{ background:var(--green); }

  .narration-box{
    margin-top:10px;
    background:var(--bg-panel);
    border:1px solid var(--wood-light);
    border-left:4px solid var(--gold);
    border-radius:8px;
    padding:12px 14px;
    font-size:15px;
    line-height:1.55;
    min-height:60px;
  }
  .instruction{
    margin-top:8px;
    background:rgba(212,169,74,0.12);
    border:1px dashed var(--gold);
    border-radius:8px;
    padding:8px 12px;
    font-size:13.5px;
    color:var(--gold-bright);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .instruction::before{
    content:"👉";
    font-size:15px;
  }
  .action-row{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#2a1c0c;
    border:none;
    padding:10px 22px;
    font-size:15px;
    font-weight:700;
    border-radius:24px;
    cursor:pointer;
    box-shadow:0 3px 0 #8a6a24;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #8a6a24; }
  .btn.secondary{
    background:var(--bg-panel);
    color:var(--cream);
    border:1px solid var(--wood-light);
    box-shadow:none;
  }
  .dialogue-choices{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .choice-btn{
    background:var(--bg-panel);
    border:1px solid var(--gold);
    color:var(--cream);
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
    text-align:left;
    cursor:pointer;
  }
  .choice-btn:hover{ background:var(--wood); }
  .hidden{ display:none !important; }

  footer{
    margin-top:14px;
    text-align:center;
    font-size:11px;
    color:#a08a6a;
    line-height:1.6;
  }
  .progress-track{
    width:100%;
    height:10px;
    background:#241209;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--wood-light);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--gold-bright));
    width:0%;
    transition:width .1s linear;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand" id="brandTitle">Gubuk Rubuh</div>
    <div class="controls">
      <button class="iconbtn" id="langBtn" title="Switch language">🌐 <span id="langLabel">EN</span></button>
      <button class="iconbtn" id="muteBtn" title="Mute/unmute">🔊</button>
    </div>
  </div>

  <div class="stage-wrap">
    <canvas id="stage" width="800" height="500"></canvas>
  </div>

  <div class="dots" id="dots"></div>

  <div class="narration-box" id="narrationBox">
    Memuat...
  </div>
  <div class="instruction hidden" id="instructionBox"></div>

  <div class="dialogue-choices hidden" id="dialogueChoices"></div>

  <div class="action-row">
    <button class="btn hidden" id="startBtn">Mulai Cerita</button>
    <button class="btn secondary hidden" id="replayBtn">Ulangi Cerita</button>
  </div>

  <footer id="footerText">
    Kisah rakyat Nusantara &mdash; dituturkan ulang secara interaktif.
  </footer>
</div>

<script>
(function(){
"use strict";

/* ============ I18N ============ */
const I18N = {
  id: {
    brand: "Gubuk Rubuh",
    startBtn: "Mulai Cerita",
    replayBtn: "Ulangi Cerita",
    footer: "Kisah rakyat Nusantara — dituturkan ulang secara interaktif.",
    cover_title: "Asal Usul Gubuk Rubuh",
    cover_sub: "Sebuah kisah rakyat dari Gunung Kidul, Yogyakarta",
    end_title: "Tamat",
    end_sub: "Terima kasih telah menyimak kisah Gubuk Rubuh.",
  },
  en: {
    brand: "Gubuk Rubuh",
    startBtn: "Start Story",
    replayBtn: "Replay Story",
    footer: "A folk tale from the Indonesian archipelago, retold interactively.",
    cover_title: "The Origin of Gubuk Rubuh",
    cover_sub: "A folk tale from Gunung Kidul, Yogyakarta",
    end_title: "The End",
    end_sub: "Thank you for following the tale of Gubuk Rubuh.",
  }
};

const SCENES = [
  {
    id:"s1",
    narration:{
      id:"Kerajaan Majapahit dipimpin oleh Prabu Brawijaya V. Namun pergolakan terjadi di istana, dan sang prabu memutuskan mengasingkan permaisurinya, Putri Campa, yang saat itu tengah mengandung anaknya.",
      en:"The Majapahit Kingdom was ruled by King Brawijaya V. But turmoil struck the palace, and the king decided to exile his queen, Putri Campa, who was pregnant with his child."
    },
    instruction:{ id:"Ketuk layar untuk melanjutkan kisah.", en:"Tap the screen to continue the story." },
    type:"tap"
  },
  {
    id:"s2",
    narration:{
      id:"Prabu Brawijaya V mengutus Arya Damar untuk menikahi Putri Campa dan membawanya pergi dari istana. Beberapa bulan kemudian, lahirlah seorang putra yang diberi nama Raden Patah.",
      en:"King Brawijaya V sent Arya Damar to marry Putri Campa and take her away from the palace. A few months later, she gave birth to a son named Raden Patah."
    },
    instruction:{ id:"Ketuk perahu untuk mengantar Putri Campa pergi.", en:"Tap the boat to send Putri Campa away." },
    type:"tapTarget"
  },
  {
    id:"s3",
    narration:{
      id:"Setelah menikah dengan Arya Damar, Putri Campa melahirkan putra lainnya bernama Raden Kusen. Kedua bersaudara itu tumbuh dewasa dan pergi berguru kepada Sunan Ampel di Surabaya.",
      en:"After marrying Arya Damar, Putri Campa gave birth to another son named Raden Kusen. The two brothers grew up and went to study under Sunan Ampel in Surabaya."
    },
    instruction:{ id:"Ketuk kedua ayunan bayi secara bergantian untuk membesarkan Raden Patah dan Raden Kusen.", en:"Tap both cradles, one after another, to raise Raden Patah and Raden Kusen." },
    type:"multiTarget"
  },
  {
    id:"s4",
    narration:{
      id:"Raden Kusen menyamar dan mendatangi Kerajaan Majapahit. Kecakapannya membuat ia dipercaya menjadi Adipati Terung, sementara Raden Patah mendirikan pesantren Glagahwangi di Jawa Tengah.",
      en:"Raden Kusen disguised himself and entered the Majapahit court. His skill earned him the title of Adipati of Terung, while Raden Patah founded the Glagahwangi pesantren in Central Java."
    },
    instruction:{ id:"Seret jubah penyamaran ke tubuh Raden Kusen.", en:"Drag the disguise robe onto Raden Kusen." },
    type:"drag"
  },
  {
    id:"s5",
    narration:{
      id:"Raden Kusen mengajak Raden Patah menghadap Prabu Brawijaya V untuk mengungkap jati diri mereka yang sebenarnya.",
      en:"Raden Kusen invited Raden Patah to meet King Brawijaya V and reveal their true identities."
    },
    instruction:{ id:"Ketuk kalimat yang akan diucapkan Raden Kusen kepada sang Prabu.", en:"Tap the words Raden Kusen will say to the king." },
    type:"dialogue",
    choices:[
      { id:"Ungkapkan bahwa Raden Patah adalah putra Prabu Brawijaya V.", en:"Reveal that Raden Patah is the king's own son." },
      { id:"Ungkapkan bahwa Raden Kusen adalah cucu Prabu Brawijaya V.", en:"Reveal that Raden Kusen is the king's grandson." }
    ]
  },
  {
    id:"s6",
    narration:{
      id:"Prabu Brawijaya V akhirnya percaya dan mengangkat Raden Patah menjadi Bupati Glagahwangi, yang kemudian berganti nama menjadi Demak. Di bawah kepemimpinannya, Demak berkembang pesat sebagai kota pelabuhan yang ramai.",
      en:"King Brawijaya V finally believed them and appointed Raden Patah as regent of Glagahwangi, later renamed Demak. Under his rule, Demak flourished into a bustling trading port."
    },
    instruction:{ id:"Ketuk kapal-kapal dagang sebanyak mungkin untuk memajukan Demak.", en:"Tap as many trading ships as you can to grow Demak." },
    type:"mash"
  },
  {
    id:"s7",
    narration:{
      id:"Raden Patah berniat mengislamkan ayahandanya, namun ditentang gurunya, Sunan Ampel. Setelah Sunan Ampel wafat, niat itu muncul kembali dan Raden Patah pun menyerang Majapahit.",
      en:"Raden Patah wished to bring his father to Islam, but his teacher Sunan Ampel opposed it. After Sunan Ampel passed away, the wish returned, and Raden Patah marched against Majapahit."
    },
    instruction:{ id:"Ketuk tombol saat penanda berada di area hijau untuk memilih waktu yang tepat menyerang.", en:"Tap the button when the marker is in the green zone to choose the right moment to attack." },
    type:"timing"
  },
  {
    id:"s8",
    narration:{
      id:"Majapahit pun takluk. Banyak penduduknya memeluk Islam, namun Prabu Brawijaya V menolak dan melarikan diri bersama para pengikutnya menuju Gunung Kidul.",
      en:"Majapahit fell. Many of its people embraced Islam, but King Brawijaya V refused and fled with his followers toward Gunung Kidul."
    },
    instruction:{ id:"Seret Prabu Brawijaya V menuju Gunung Kidul di peta.", en:"Drag King Brawijaya V toward Gunung Kidul on the map." },
    type:"dragMap"
  },
  {
    id:"s9",
    narration:{
      id:"Sesampainya di Gunung Kidul, para pengikut singgah di sebuah gubuk untuk melepas lelah. Namun pasukan Raden Patah telah mengepung mereka, dan satu per satu pengikut itu pun bersujud memeluk Islam.",
      en:"Arriving in Gunung Kidul, the followers stopped to rest at a hut. But Raden Patah's troops surrounded them, and one by one the followers bowed down and embraced Islam."
    },
    instruction:{ id:"Ketuk setiap pengikut agar mereka bersujud.", en:"Tap each follower so they bow down." },
    type:"multiTarget3"
  },
  {
    id:"s10",
    narration:{
      id:"Sementara itu, Prabu Brawijaya V tetap menolak dan melarikan diri sendirian hingga ke selatan Gunung Kidul, tempat ia mengakhiri hidupnya. Tempat para pengikutnya diislamkan itu kemudian dinamakan Gubuk Rubuh — \"gubuk\" berarti rumah, dan \"rubuh\" berarti rubuhnya badan ketika bersujud menunaikan sholat.",
      en:"Meanwhile, King Brawijaya V kept refusing and fled alone further south, where he ended his life. The place where his followers embraced Islam became known as Gubuk Rubuh — \"gubuk\" means hut, and \"rubuh\" means the body collapsing as it bows in prayer."
    },
    instruction:{ id:"Ketuk gubuk untuk melihat akhir kisah.", en:"Tap the hut to see the ending of the story." },
    type:"tapTarget"
  }
];

/* ============ STATE ============ */
const state = {
  lang: "id",
  muted: false,
  sceneIndex: -1, // -1 = cover, SCENES.length = end
  started: false,
  sceneState: {},
  voices: [],
};

/* ============ DOM ============ */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const narrationBox = document.getElementById("narrationBox");
const instructionBox = document.getElementById("instructionBox");
const dotsEl = document.getElementById("dots");
const startBtn = document.getElementById("startBtn");
const replayBtn = document.getElementById("replayBtn");
const langBtn = document.getElementById("langBtn");
const langLabel = document.getElementById("langLabel");
const muteBtn = document.getElementById("muteBtn");
const dialogueChoices = document.getElementById("dialogueChoices");
const brandTitle = document.getElementById("brandTitle");
const footerText = document.getElementById("footerText");

/* ============ URL LANG PARAM + STORAGE ============ */
function initLang(){
  const params = new URLSearchParams(window.location.search);
  const urlLang = params.get("lang");
  const stored = localStorage.getItem("gubukrubuh_lang");
  if(urlLang === "en" || urlLang === "id"){
    state.lang = urlLang;
  } else if(stored === "en" || stored === "id"){
    state.lang = stored;
  } else {
    state.lang = "id";
  }
}
function initMute(){
  const stored = localStorage.getItem("gubukrubuh_muted");
  state.muted = stored === "1";
}
initLang();
initMute();

/* ============ CANVAS RESIZE ============ */
function fitCanvas(){
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth - 20;
  const ratio = 500/800;
  canvas.style.width = w + "px";
  canvas.style.height = (w*ratio) + "px";
}
window.addEventListener("resize", fitCanvas);

/* ============ IFRAME AUTO-RESIZE ============ */
function sendHeightToParent(){
  try{
    const h = document.getElementById("app").getBoundingClientRect().height + 24;
    window.parent.postMessage({ type:"gubukRubuhResize", height: Math.ceil(h) }, "*");
  }catch(e){}
}
if(window.ResizeObserver){
  const ro = new ResizeObserver(sendHeightToParent);
  ro.observe(document.getElementById("app"));
}
window.addEventListener("load", sendHeightToParent);
setInterval(sendHeightToParent, 1200);

/* ============ SPEECH ============ */
let currentUtterance = null;
function loadVoices(){
  state.voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(lang){
  const target = lang === "id" ? "id-ID" : "en-US";
  let v = state.voices.find(v=>v.lang === target);
  if(!v) v = state.voices.find(v=>v.lang && v.lang.startsWith(lang==="id"?"id":"en"));
  return v || null;
}
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  if(state.muted || !text) return;
  const utt = new SpeechSynthesisUtterance(text);
  const v = pickVoice(state.lang);
  if(v) utt.voice = v;
  utt.lang = state.lang === "id" ? "id-ID" : "en-US";
  utt.rate = 0.95;
  utt.pitch = 1.0;
  currentUtterance = utt;
  window.speechSynthesis.speak(utt);
}
function stopSpeak(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}
if(!window.speechSynthesis){
  muteBtn.classList.add("hidden");
}

/* ============ LANG / MUTE TOGGLES ============ */
function updateMuteBtn(){
  muteBtn.textContent = state.muted ? "🔇" : "🔊";
  muteBtn.classList.toggle("active", !state.muted);
}
muteBtn.addEventListener("click", ()=>{
  state.muted = !state.muted;
  localStorage.setItem("gubukrubuh_muted", state.muted ? "1":"0");
  updateMuteBtn();
  if(state.muted) stopSpeak();
  else renderNarrationSpeak();
});
langBtn.addEventListener("click", ()=>{
  state.lang = state.lang === "id" ? "en" : "id";
  localStorage.setItem("gubukrubuh_lang", state.lang);
  applyLanguage();
});
function applyLanguage(){
  const t = I18N[state.lang];
  langLabel.textContent = state.lang === "id" ? "EN" : "ID";
  brandTitle.textContent = t.brand;
  startBtn.textContent = t.startBtn;
  replayBtn.textContent = t.replayBtn;
  footerText.textContent = t.footer;
  document.documentElement.lang = state.lang;
  if(state.sceneIndex >= 0 && state.sceneIndex < SCENES.length){
    renderNarrationText();
    if(SCENES[state.sceneIndex].type === "dialogue" && !dialogueChoices.classList.contains("hidden")){
      dialogueChoices.innerHTML = "";
      buildDialogueChoices(state.sceneIndex);
    }
  } else if(state.sceneIndex === SCENES.length){
    narrationBox.textContent = I18N[state.lang].end_sub;
  } else {
    narrationBox.textContent = I18N[state.lang].cover_sub;
  }
  renderScene(false);
}
updateMuteBtn();

/* ============ DOTS ============ */
function buildDots(){
  dotsEl.innerHTML = "";
  SCENES.forEach((s,i)=>{
    const d = document.createElement("div");
    d.className = "dot";
    d.dataset.index = i;
    dotsEl.appendChild(d);
  });
}
function updateDots(){
  const dots = dotsEl.querySelectorAll(".dot");
  dots.forEach((d,i)=>{
    d.classList.remove("active","done");
    if(i < state.sceneIndex) d.classList.add("done");
    else if(i === state.sceneIndex) d.classList.add("active");
  });
}
buildDots();

/* ============ DRAWING HELPERS ============ */
function clear(){
  ctx.clearRect(0,0,800,500);
}
function skyBg(topColor,bottomColor){
  const g = ctx.createLinearGradient(0,0,0,500);
  g.addColorStop(0, topColor);
  g.addColorStop(1, bottomColor);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,800,500);
}
function ground(color, y){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.quadraticCurveTo(400, y-25, 800, y);
  ctx.lineTo(800,500);
  ctx.lineTo(0,500);
  ctx.closePath();
  ctx.fill();
}
function cloud(x,y,scale){
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.beginPath();
  ctx.ellipse(x,y,30*scale,16*scale,0,0,Math.PI*2);
  ctx.ellipse(x+25*scale,y+6*scale,22*scale,13*scale,0,0,Math.PI*2);
  ctx.ellipse(x-25*scale,y+6*scale,20*scale,12*scale,0,0,Math.PI*2);
  ctx.fill();
}
function mountainRange(y,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0,y+40);
  ctx.lineTo(80,y-30);
  ctx.lineTo(160,y+10);
  ctx.lineTo(260,y-55);
  ctx.lineTo(360,y);
  ctx.lineTo(460,y-40);
  ctx.lineTo(560,y+5);
  ctx.lineTo(660,y-35);
  ctx.lineTo(760,y+15);
  ctx.lineTo(800,y-10);
  ctx.lineTo(800,y+80);
  ctx.lineTo(0,y+80);
  ctx.closePath();
  ctx.fill();
}
// simple person figure: x,y = feet position; scale; robeColor; bowed(0-1) tilts figure forward
function drawFigure(x,y,scale,robeColor,opts){
  opts = opts||{};
  const bow = opts.bow||0;
  const headColor = "#caa27a";
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(bow*0.9);
  ctx.translate(0,-bow*10);
  // robe
  ctx.fillStyle = robeColor;
  ctx.beginPath();
  ctx.moveTo(-16*scale, 0);
  ctx.lineTo(16*scale, 0);
  ctx.lineTo(11*scale, -55*scale);
  ctx.lineTo(-11*scale, -55*scale);
  ctx.closePath();
  ctx.fill();
  // sash
  if(opts.sash){
    ctx.fillStyle = opts.sash;
    ctx.fillRect(-11*scale,-35*scale,22*scale,7*scale);
  }
  // arms
  ctx.strokeStyle = robeColor;
  ctx.lineWidth = 6*scale;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-10*scale,-48*scale);
  ctx.lineTo(-20*scale,-30*scale + (opts.armRaise? -14*scale:0));
  ctx.moveTo(10*scale,-48*scale);
  ctx.lineTo(20*scale,-30*scale + (opts.armRaise? -14*scale:0));
  ctx.stroke();
  // head
  ctx.fillStyle = headColor;
  ctx.beginPath();
  ctx.arc(0,-63*scale,10*scale,0,Math.PI*2);
  ctx.fill();
  // head covering
  if(opts.crown){
    ctx.fillStyle = "#d4a94a";
    ctx.beginPath();
    ctx.moveTo(-11*scale,-70*scale);
    ctx.lineTo(11*scale,-70*scale);
    ctx.lineTo(0,-85*scale);
    ctx.closePath();
    ctx.fill();
  } else if(opts.headwrap){
    ctx.fillStyle = opts.headwrap;
    ctx.beginPath();
    ctx.arc(0,-68*scale,11*scale,Math.PI,Math.PI*2);
    ctx.fill();
    ctx.fillRect(-11*scale,-68*scale,22*scale,4*scale);
  }
  ctx.restore();
}
function drawHut(x,y,scale,collapsed){
  ctx.save();
  ctx.translate(x,y);
  const tilt = collapsed ? 0.18 : 0;
  ctx.translate(0, collapsed? 10:0);
  ctx.rotate(tilt);
  // roof
  ctx.fillStyle = "#8a6a3e";
  ctx.beginPath();
  ctx.moveTo(-70*scale,-40*scale);
  ctx.lineTo(0,-90*scale);
  ctx.lineTo(70*scale,-40*scale);
  ctx.lineTo(60*scale,-30*scale);
  ctx.lineTo(0,-75*scale);

/* ============ SCENE RENDER ============ */
let animT = 0;

function renderNarrationText(){
  const s = SCENES[state.sceneIndex];
  narrationBox.textContent = s.narration[state.lang];
  const inst = s.instruction;
  if(inst){
    instructionBox.textContent = inst[state.lang];
    instructionBox.classList.remove("hidden");
  } else {
    instructionBox.classList.add("hidden");
  }
}
function renderNarrationSpeak(){
  const s = SCENES[state.sceneIndex];
  if(s) speak(s.narration[state.lang]);
}

function setupSceneState(idx){
  const s = SCENES[idx];
  state.sceneState = { type: s.type, done:false };
  if(s.type === "multiTarget"){
    state.sceneState.tapped = [false,false];
  }
  if(s.type === "multiTarget3"){
    state.sceneState.tapped = [false,false,false];
  }
  if(s.type === "mash"){
    state.sceneState.progress = 0;
  }
  if(s.type === "timing"){
    state.sceneState.markerPos = 0;
    state.sceneState.markerDir = 1;
    state.sceneState.locked = false;
  }
  if(s.type === "drag" || s.type === "dragMap"){
    state.sceneState.dragging = false;
    state.sceneState.dragX = s.type==="drag" ? 620 : 220;
    state.sceneState.dragY = s.type==="drag" ? 380 : 130;
    state.sceneState.dropped = false;
  }
}

function goToScene(idx){
  stopSpeak();
  state.sceneIndex = idx;
  if(idx >= 0 && idx < SCENES.length){
    setupSceneState(idx);
    updateDots();
    renderNarrationText();
    renderNarrationSpeak();
    dialogueChoices.classList.add("hidden");
    dialogueChoices.innerHTML = "";
    if(SCENES[idx].type === "dialogue"){
      buildDialogueChoices(idx);
    }
  }
  renderScene(true);
}

function buildDialogueChoices(idx){
  const s = SCENES[idx];
  dialogueChoices.classList.remove("hidden");
  s.choices.forEach((c)=>{
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.textContent = c[state.lang];
    b.addEventListener("click", ()=>{
      dialogueChoices.classList.add("hidden");
      state.sceneState.done = true;
      advance();
    });
    dialogueChoices.appendChild(b);
  });
}

function advance(){
  if(state.sceneIndex + 1 < SCENES.length){
    goToScene(state.sceneIndex + 1);
  } else {
    showEnding();
  }
}

function showEnding(){
  stopSpeak();
  state.sceneIndex = SCENES.length;
  updateDots();
  const t = I18N[state.lang];
  narrationBox.textContent = t.end_sub;
  instructionBox.classList.add("hidden");
  dialogueChoices.classList.add("hidden");
  replayBtn.classList.remove("hidden");
  drawEndingScene();
}

/* Main draw dispatcher */
function renderScene(reflow){
  if(state.sceneIndex === -1){ drawCover(); return; }
  if(state.sceneIndex === SCENES.length){ drawEndingScene(); return; }
  const s = SCENES[state.sceneIndex];
  clear();
  switch(s.id){
    case "s1": drawScene1(); break;
    case "s2": drawScene2(); break;
    case "s3": drawScene3(); break;

    case "s9": drawScene9(); break;

}

/* ============ ANIMATION LOOP for timing bar ============ */
function animLoop(){
  requestAnimationFrame(animLoop);
  if(state.sceneIndex>=0 && state.sceneIndex<SCENES.length){
    const s = SCENES[state.sceneIndex];
    if(s.type === "timing" && !state.sceneState.locked){
      let pos = state.sceneState.markerPos + state.sceneState.markerDir * 0.012;
      if(pos>=1){ pos=1; state.sceneState.markerDir=-1; }
      if(pos<=0){ pos=0; state.sceneState.markerDir=1; }
      state.sceneState.markerPos = pos;
      drawScene7();
    }
  }
}
requestAnimationFrame(animLoop);

/* ============ CANVAS INTERACTION ============ */
function getCanvasPos(evt){
  const rect = canvas.getBoundingClientRect();
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  const scaleX = 800/rect.width;
  const scaleY = 500/rect.height;
  return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
}
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }

let dragActive = false;

canvas.addEventListener("pointerdown", (e)=>{
  const p = getCanvasPos(e);
  handlePointerDown(p);
});
canvas.addEventListener("pointermove", (e)=>{
  if(dragActive){
    const p = getCanvasPos(e);
    handlePointerMove(p);
  }
});
window.addEventListener("pointerup", (e)=>{
  if(dragActive){
    const p = getCanvasPos(e);
    handlePointerUp(p);
  }
  dragActive = false;
});

function handlePointerDown(p){
  if(state.sceneIndex === -1) return;
  if(state.sceneIndex === SCENES.length) return;
  const s = SCENES[state.sceneIndex];
  if(!s) return;

  if(s.type === "tap"){
    advance();
  } else if(s.type === "tapTarget"){
    let target;
    if(s.id==="s2") target = window.__s2hit;
    if(s.id==="s10") target = window.__s10hit;
    if(target && dist(p.x,p.y,target.x,target.y) < target.r){
      if(s.id==="s2"){ s2boatSent = true; renderScene(); setTimeout(advance,500); }
      if(s.id==="s10"){ advance(); }
    }
  } else if(s.type === "multiTarget"){
    const hits = window.__s3hits||[];
    hits.forEach((h,i)=>{
      if(!state.sceneState.tapped[i] && dist(p.x,p.y,h.x,h.y)<h.r){
        state.sceneState.tapped[i]=true;
      }
    });
    renderScene();
    if(state.sceneState.tapped.every(Boolean)){
      setTimeout(advance,500);
    }
  } else if(s.type === "multiTarget3"){
    const hits = window.__s9hits||[];
    hits.forEach((h,i)=>{
      if(!state.sceneState.tapped[i] && dist(p.x,p.y,h.x,h.y)<h.r){
        state.sceneState.tapped[i]=true;
      }
    });
    renderScene();
    if(state.sceneState.tapped.every(Boolean)){
      setTimeout(advance,600);
    }
  } else if(s.type === "mash"){
    const hits = window.__s6hits||[];
    hits.forEach((h,i)=>{
      if(!s6clicked.has(i) && dist(p.x,p.y,h.x,h.y)<50){
        s6clicked.add(i);
        state.sceneState.progress = Math.min(100, (s6clicked.size/hits.length)*100);
      }
    });
    renderScene();
    if(s6clicked.size >= hits.length){
      setTimeout(advance,500);
    }
  } else if(s.type === "timing"){
    const bar = window.__s7bar;
    if(bar){
      const pos = state.sceneState.markerPos;
      if(pos >= 0.42 && pos <= 0.58){
        state.sceneState.locked = true;
        setTimeout(advance,400);
      }
    }
  } else if(s.type === "drag"){
    if(state.sceneState.dropped) return;
    const rx = state.sceneState.dragX, ry = state.sceneState.dragY;
    if(dist(p.x,p.y,rx,ry-30) < 55){
      dragActive = true;
      state.sceneState.dragging = true;
    }
  } else if(s.type === "dragMap"){
    if(state.sceneState.dropped) return;
    const rx = state.sceneState.dragX, ry = state.sceneState.dragY;
    if(dist(p.x,p.y,rx,ry-40) < 55){
      dragActive = true;
      state.sceneState.dragging = true;
    }
  }
}

function handlePointerMove(p){
  if(state.sceneIndex<0 || state.sceneIndex>=SCENES.length) return;
  const s = SCENES[state.sceneIndex];
  if(!s) return;
  if((s.type==="drag" || s.type==="dragMap") && state.sceneState.dragging && !state.sceneState.dropped){
    state.sceneState.dragX = p.x;
    state.sceneState.dragY = p.y;
    renderScene();
  }
}
function handlePointerUp(p){
  if(state.sceneIndex<0 || state.sceneIndex>=SCENES.length) return;
  const s = SCENES[state.sceneIndex];
  if(!s) return;
  if(s.type === "drag" && state.sceneState.dragging && !state.sceneState.dropped){
    const target = window.__s4target;
    if(target && dist(p.x,p.y,target.x,target.y) < target.r+30){
      state.sceneState.dropped = true;
      renderScene();
      setTimeout(advance,500);
    }
    state.sceneState.dragging = false;
  } else if(s.type === "dragMap" && state.sceneState.dragging && !state.sceneState.dropped){
    const target = window.__s8target;
    if(target && dist(p.x,p.y,target.x,target.y) < target.r){
      state.sceneState.dropped = true;
      renderScene();
      setTimeout(advance,500);
    } else {
      // snap back
      state.sceneState.dragX = 220;
      state.sceneState.dragY = 130;
      renderScene();
    }
    state.sceneState.dragging = false;
  }
}

/* ============ START / REPLAY ============ */
startBtn.addEventListener("click", ()=>{
  state.started = true;
  startBtn.classList.add("hidden");
  goToScene(0);
});
replayBtn.addEventListener("click", ()=>{
  replayBtn.classList.add("hidden");
  s2boatSent = false;
  s6clicked = new Set();
  goToScene(0);
});

/* ============ INIT ============ */
function init(){
  fitCanvas();
  applyLanguage();
  narrationBox.textContent = I18N[state.lang].cover_sub;
  startBtn.classList.remove("hidden");
  drawCover();
}
init();

})();
</script>

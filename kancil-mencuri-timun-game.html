<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Si Kancil Mencuri Timun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #16210f;
    --bg-panel: #223318;
    --bg-panel-2: #2b3f20;
    --gold: #d9a441;
    --gold-dim: #8a6a2c;
    --leaf: #7fa65a;
    --cream: #f3ecd8;
    --cream-dim: #cfc7ab;
    --danger: #c1584f;
    --success: #6fae5a;
    --shadow: rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(217,164,65,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(127,166,90,0.12), transparent 55%),
      var(--bg-deep);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient fireflies */
  .firefly{
    position:fixed;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 3px rgba(217,164,65,0.65);
    opacity:0;
    animation:drift 9s ease-in-out infinite, glow 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes drift{
    0%{transform:translate(0,0);}
    50%{transform:translate(18px,-26px);}
    100%{transform:translate(-6px,4px);}
  }
  @keyframes glow{
    0%,100%{opacity:0.15;}
    50%{opacity:0.9;}
  }

  .stage{
    width:100%;
    max-width:640px;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border-radius:20px;
    border:1px solid rgba(217,164,65,0.22);
    box-shadow:0 18px 50px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
    padding:28px 26px 24px;
    position:relative;
    z-index:2;
  }

  /* top bar: progress + lang + lamp */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
  }
  .progress{
    font-family:'Baloo 2', sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.4px;
    color:var(--cream-dim);
    background:rgba(0,0,0,0.22);
    padding:6px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .controls{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .icon-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid rgba(217,164,65,0.35);
    background:rgba(0,0,0,0.25);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background .2s ease;
    position:relative;
  }
  .icon-btn:hover{transform:translateY(-1px); background:rgba(217,164,65,0.12);}
  .icon-btn:active{transform:translateY(0);}
  .lang-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--cream);
    width:auto;
    padding:0 12px;
    border-radius:999px;
  }
  .lang-btn .alt{opacity:0.45; margin:0 3px;}

  /* lamp icon (mute toggle), lit = flicker glow */
  .lamp-svg{width:20px;height:20px;}
  .lamp-flame{transform-origin: 12px 9px;}
  .icon-btn.lit .lamp-flame{
    animation:flicker 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 4px rgba(217,164,65,0.9));
  }
  @keyframes flicker{
    0%,100%{opacity:1; transform:scale(1);}
    45%{opacity:0.85; transform:scale(0.94) translateY(0.5px);}
    60%{opacity:1; transform:scale(1.05);}
  }
  .icon-btn.muted .lamp-flame{opacity:0.12;}

  h2{
    font-family:'Baloo 2', sans-serif;
    font-size:23px;
    font-weight:700;
    margin:0 0 12px;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:8px;
  }
  p.story{
    font-size:16.5px;
    line-height:1.65;
    color:var(--cream);
    margin:0 0 20px;
  }

  .scene{
    width:100%;
    aspect-ratio:16/10;
    border-radius:14px;
    margin-bottom:18px;
    display:flex;align-items:center;justify-content:center;
    font-size:64px;
    background:radial-gradient(ellipse at 50% 30%, rgba(127,166,90,0.20), transparent 65%), rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.05);
    position:relative;
    overflow:hidden;
    user-select:none;
  }
  .scene .emoji-main{
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4));
    transition:transform .15s ease;
  }

  /* QTE target */
  .qte-target{
    position:absolute;
    font-size:44px;
    cursor:pointer;
    animation:pulse 0.9s ease-in-out infinite;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }
  .qte-bar-wrap{
    width:100%;
    height:10px;
    background:rgba(0,0,0,0.3);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:16px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .qte-bar{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--danger));
    width:100%;
    transition:width .05s linear;
  }
  .qte-counter{
    font-family:'Baloo 2',sans-serif;
    font-size:13px;
    color:var(--cream-dim);
    text-align:center;
    margin:-8px 0 16px;
  }

  .choices{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
  .choice-btn{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:15px;
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid rgba(217,164,65,0.3);
    background:rgba(0,0,0,0.2);
    color:var(--cream);
    cursor:pointer;
    transition:background .18s ease, transform .12s ease, border-color .18s ease;
  }
  .choice-btn:hover{background:rgba(217,164,65,0.14); border-color:var(--gold); transform:translateX(2px);}
  .choice-btn:active{transform:translateX(0) scale(0.99);}

  .primary-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    background:linear-gradient(180deg, var(--gold), #b9852f);
    color:#26210f;
    box-shadow:0 8px 18px rgba(217,164,65,0.28);
    transition:transform .12s ease, box-shadow .18s ease;
  }
  .primary-btn:hover{transform:translateY(-1px); box-shadow:0 10px 22px rgba(217,164,65,0.38);}
  .primary-btn:active{transform:translateY(0);}

  .primary-btn.danger{
    background:linear-gradient(180deg, var(--danger), #8f3d36);
    color:#fdf1ee;
    box-shadow:0 8px 18px rgba(193,88,79,0.28);
  }
  .primary-btn.success{
    background:linear-gradient(180deg, var(--success), #3f7a3c);
    color:#f2fbee;
    box-shadow:0 8px 18px rgba(111,174,90,0.28);
  }

  .ending-tag{
    font-family:'Baloo 2',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    display:inline-block;
    margin-bottom:10px;
  }
  .ending-tag.bad{background:rgba(193,88,79,0.18); color:#ecb0aa; border:1px solid rgba(193,88,79,0.4);}
  .ending-tag.good{background:rgba(111,174,90,0.18); color:#b7dea6; border:1px solid rgba(111,174,90,0.4);}

  .narr-indicator{
    display:flex; align-items:center; gap:6px;
    font-family:'Baloo 2',sans-serif;
    font-size:12px;
    color:var(--gold);
    opacity:0;
    height:16px;
    margin:-10px 0 14px;
    transition:opacity .2s ease;
  }
  .narr-indicator.on{opacity:1;}
  .narr-dot{width:6px;height:6px;border-radius:50%;background:var(--gold); animation:blink 1s infinite ease-in-out;}
  .narr-dot:nth-child(2){animation-delay:.15s;}
  .narr-dot:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}

  @media (max-width:480px){
    .stage{padding:20px 16px 18px; border-radius:16px;}
    h2{font-size:20px;}
    p.story{font-size:15.5px;}
    .scene{font-size:52px;}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="topbar">
    <div class="progress" id="progressLabel">Tahap 1 / 4</div>
    <div class="controls">
      <button class="lang-btn icon-btn" id="langBtn" title="Ganti bahasa / Switch language">
        <span class="cur">ID</span><span class="alt">/</span><span class="alt-lang">EN</span>
      </button>
      <button class="icon-btn lit" id="lampBtn" title="Bisukan narasi / Mute narration">
        <svg class="lamp-svg" viewBox="0 0 24 24" fill="none">
          <path class="lamp-flame" d="M12 4C10 7 9.2 8.6 9.2 10.2C9.2 12 10.4 13.2 12 13.2C13.6 13.2 14.8 12 14.8 10.2C14.8 8.6 14 7 12 4Z" fill="#d9a441"/>
          <path d="M8.5 13.5H15.5L14.5 17H9.5L8.5 13.5Z" fill="#cfc7ab" opacity="0.85"/>
          <rect x="9.7" y="17" width="4.6" height="1.4" rx="0.5" fill="#8a6a2c"/>
          <path d="M9 20H15" stroke="#8a6a2c" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="narr-indicator" id="narrIndicator">
    <span class="narr-dot"></span><span class="narr-dot"></span><span class="narr-dot"></span>
    <span id="narrLabel">Bercerita...</span>
  </div>

  <div id="sceneWrap"></div>
  <h2 id="stepTitle"></h2>
  <p class="story" id="stepText"></p>
  <div id="interactionArea"></div>
</div>

<script>
/* ============ i18n content ============ */
const STORY = {
  id: {
    progress: n => `Tahap ${n} / 4`,
    narrating: "Bercerita...",
    steps: [
      {
        title: "🦌 Si Kancil Mencuri Timun",
        text: "Si Kancil hendak mencuri timun lagi di kebun Pak Tani. Tapi kali ini Pak Tani sudah menyiapkan jebakan! Ikuti ceritanya sampai Si Kancil berhasil kabur ke hutan.",
        emoji: "🦌🥒",
        cta: "Mulai Cerita"
      },
      {
        title: "Menyelinap ke Kebun",
        text: "Malam itu sunyi. Si Kancil mengendap-endap masuk kebun. Ada beberapa timun ranum tergantung di antara daun-daun — cepat, petik sebanyak mungkin sebelum Pak Tani terbangun!",
        emoji: "🌙",
        qte: true
      },
      {
        title: "Terjebak Jerat!",
        text: "Krak! Kaki Si Kancil tersangkut jerat rotan yang disembunyikan Pak Tani. Ia meronta, tapi jerat itu makin erat. Tak lama, Pak Tani datang dan memasukkannya ke dalam kurungan bambu di dekat gubuk.",
        emoji: "🕸️",
        cta: "Lanjutkan"
      },
      {
        title: "Anjing Penjaga Datang",
        text: "Tengah malam, anjing penjaga Pak Tani mendekati kurungan. Si Kancil harus berkata sesuatu yang meyakinkan agar anjing itu mau membukakan kurungan — apa yang sebaiknya ia katakan?",
        emoji: "🐕",
        choices: [
          { label: "\"Aku dikurung karena disuruh menikahi anak Pak Tani. Aku tidak mau — kau saja gantikan aku!\"", correct: true },
          { label: "\"Tolong bukakan pintunya, aku janji tidak akan mencuri timun lagi.\"", correct: false },
          { label: "\"Aku bosan di sini, ayo kita main-main saja.\"", correct: false }
        ]
      }
    ],
    endings: {
      bad: {
        tag: "Ketahuan Pak Tani",
        title: "Ketahuan Pak Tani! 😬",
        text: "Anjing tidak percaya bujukan Si Kancil, dan Pak Tani keburu datang. Coba lagi, ikuti lagi ceritanya dari awal!",
        emoji: "😬",
        cta: "Coba Lagi"
      },
      good: {
        tag: "Si Kancil Kabur",
        title: "Si Kancil Berhasil Kabur! 🎉",
        text: "Berkat kecerdikannya menipu anjing, Si Kancil lolos dari kurungan Pak Tani. Tapi ingat, mencuri tetap perbuatan yang tidak baik ya — kecerdikan sebaiknya dipakai untuk hal-hal yang jujur.",
        emoji: "🎉",
        cta: "Main Lagi"
      }
    },
    qteHint: n => `Timun dipetik: ${n}`,
    qteGo: "Ambil timunnya sebelum kabur!"
  },
  en: {
    progress: n => `Stage ${n} / 4`,
    narrating: "Narrating...",
    steps: [
      {
        title: "🦌 Kancil Steals the Cucumbers",
        text: "The mouse-deer Kancil wants to steal cucumbers from Farmer Tani's garden again. But this time, the farmer has set a trap! Follow the story until Kancil escapes back to the forest.",
        emoji: "🦌🥒",
        cta: "Start Story"
      },
      {
        title: "Sneaking Into the Garden",
        text: "The night was quiet. Kancil crept into the garden. Several ripe cucumbers hung among the leaves — quick, grab as many as you can before the farmer wakes up!",
        emoji: "🌙",
        qte: true
      },
      {
        title: "Caught in the Snare!",
        text: "Snap! Kancil's leg got caught in a rattan snare the farmer had hidden. He struggled, but it only tightened. Soon, the farmer arrived and locked him in a bamboo cage near the hut.",
        emoji: "🕸️",
        cta: "Continue"
      },
      {
        title: "The Guard Dog Arrives",
        text: "At midnight, the farmer's guard dog approached the cage. Kancil needs to say something convincing to get the dog to open it — what should he say?",
        emoji: "🐕",
        choices: [
          { label: "\"I'm locked up because they want me to marry the farmer's daughter. I don't want to — you take my place instead!\"", correct: true },
          { label: "\"Please let me out, I promise I won't steal cucumbers again.\"", correct: false },
          { label: "\"I'm bored in here, let's just play together.\"", correct: false }
        ]
      }
    ],
    endings: {
      bad: {
        tag: "Caught by the Farmer",
        title: "Caught by Farmer Tani! 😬",
        text: "The dog didn't believe Kancil's trick, and the farmer arrived just in time. Try again — follow the story once more from the start!",
        emoji: "😬",
        cta: "Try Again"
      },
      good: {
        tag: "Kancil Escapes",
        title: "Kancil Escapes! 🎉",
        text: "Thanks to his cunning trick on the dog, Kancil slipped free from the farmer's cage. But remember, stealing is still wrong — cleverness is best used for honest things.",
        emoji: "🎉",
        cta: "Play Again"
      }
    },
    qteHint: n => `Cucumbers picked: ${n}`,
    qteGo: "Grab the cucumbers before you run out of time!"
  }
};

/* ============ state ============ */
const params = new URLSearchParams(window.location.search);
let lang = params.get('lang') === 'en' ? 'en' : 'id';
let muted = localStorage.getItem('kancilMuted') === '1';
let stepIndex = 0; // 0..3 within STORY[lang].steps
let currentUtterance = null;
let voicesCache = [];

const els = {
  progressLabel: document.getElementById('progressLabel'),
  langBtn: document.getElementById('langBtn'),
  lampBtn: document.getElementById('lampBtn'),
  sceneWrap: document.getElementById('sceneWrap'),
  stepTitle: document.getElementById('stepTitle'),
  stepText: document.getElementById('stepText'),
  interactionArea: document.getElementById('interactionArea'),
  narrIndicator: document.getElementById('narrIndicator'),
  narrLabel: document.getElementById('narrLabel')
};

/* ============ fireflies ============ */
function spawnFireflies(){
  for(let i=0;i<14;i++){
    const f = document.createElement('div');
    f.className='firefly';
    f.style.left = Math.random()*100+'vw';
    f.style.top = Math.random()*100+'vh';
    f.style.animationDelay = (Math.random()*6)+'s, '+(Math.random()*2)+'s';
    document.body.appendChild(f);
  }
}
spawnFireflies();

/* ============ speech ============ */
function loadVoices(){
  voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(targetLang){
  if(!voicesCache || !voicesCache.length) return null;
  const wantId = targetLang === 'id';
  let match = voicesCache.find(v => wantId ? v.lang.toLowerCase().startsWith('id') : v.lang.toLowerCase().startsWith('en'));
  if(!match && wantId){
    // fallback: some systems lack Indonesian voices; use any voice but slow it down
    match = voicesCache.find(v => v.lang.toLowerCase().startsWith('en'));
  }
  return match || voicesCache[0];
}
function stopNarration(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  els.narrIndicator.classList.remove('on');
}
function narrate(text){
  stopNarration();
  if(muted || !('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang);
  if(v) utter.voice = v;
  utter.lang = lang === 'id' ? 'id-ID' : 'en-US';
  utter.rate = 0.92;
  utter.pitch = 1.02;
  utter.onstart = () => els.narrIndicator.classList.add('on');
  utter.onend = () => els.narrIndicator.classList.remove('on');
  utter.onerror = () => els.narrIndicator.classList.remove('on');
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

/* ============ lamp / mute toggle ============ */
function refreshLampUI(){
  els.lampBtn.classList.toggle('lit', !muted);
  els.lampBtn.classList.toggle('muted', muted);
  els.lampBtn.title = muted
    ? (lang==='id' ? 'Nyalakan narasi' : 'Unmute narration')
    : (lang==='id' ? 'Bisukan narasi' : 'Mute narration');
}
els.lampBtn.addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('kancilMuted', muted ? '1':'0');
  refreshLampUI();
  if(muted) stopNarration();
  else {
    // re-narrate current visible text
    const t = STORY[lang];
    const s = t.steps[stepIndex];
    if(s) narrate(s.text);
  }
});

/* ============ lang toggle ============ */
function refreshLangUI(){
  els.langBtn.querySelector('.cur').textContent = lang.toUpperCase();
  els.langBtn.querySelector('.alt-lang').textContent = lang === 'id' ? 'EN' : 'ID';
}
els.langBtn.addEventListener('click', () => {
  lang = lang === 'id' ? 'en' : 'id';
  const url = new URL(window.location.href);
  url.searchParams.set('lang', lang);
  window.history.replaceState({}, '', url);
  refreshLangUI();
  render();
});

/* ============ QTE ============ */
let qteInterval = null;
let qteTimeout = null;
function runQTE(t){
  const scene = document.createElement('div');
  scene.className = 'scene';
  scene.innerHTML = '<div class="emoji-main">🌳🌙</div>';
  els.sceneWrap.innerHTML = '';
  els.sceneWrap.appendChild(scene);

  const barWrap = document.createElement('div');
  barWrap.className = 'qte-bar-wrap';
  barWrap.innerHTML = '<div class="qte-bar" id="qteBar"></div>';

  const counter = document.createElement('div');
  counter.className = 'qte-counter';
  counter.id = 'qteCounter';
  counter.textContent = t.qteHint(0);

  const hint = document.createElement('p');
  hint.className = 'story';
  hint.style.marginTop = '-4px';
  hint.style.opacity = '0.85';
  hint.style.fontSize = '14px';
  hint.textContent = t.qteGo;

  els.interactionArea.innerHTML = '';
  els.interactionArea.appendChild(barWrap);
  els.interactionArea.appendChild(counter);
  els.interactionArea.appendChild(hint);

  let picked = 0;
  const duration = 6000;
  const startTime = Date.now();
  const bar = document.getElementById('qteBar');

  function placeTarget(){
    const existing = scene.querySelector('.qte-target');
    if(existing) existing.remove();
    const target = document.createElement('div');
    target.className = 'qte-target';
    target.textContent = '🥒';
    target.style.left = (10 + Math.random()*70) + '%';
    target.style.top = (15 + Math.random()*55) + '%';
    target.addEventListener('click', () => {
      picked++;
      document.getElementById('qteCounter').textContent = t.qteHint(picked);
      placeTarget();
    });
    scene.appendChild(target);
  }
  placeTarget();

  qteInterval = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const pct = Math.max(0, 100 - (elapsed/duration)*100);
    bar.style.width = pct + '%';
    if(elapsed >= duration){
      clearInterval(qteInterval);
      goToStep(2); // proceed to caught-in-snare narrative regardless of count (part of the tale)
    }
  }, 50);
}

/* ============ choices ============ */
function renderChoices(t, step){
  const wrap = document.createElement('div');
  wrap.className = 'choices';
  step.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.label;
    btn.addEventListener('click', () => {
      stopNarration();
      if(choice.correct) showEnding('good');
      else showEnding('bad');
    });
    wrap.appendChild(btn);
  });
  els.interactionArea.innerHTML = '';
  els.interactionArea.appendChild(wrap);
}

/* ============ endings ============ */
function showEnding(kind){
  const t = STORY[lang];
  const e = t.endings[kind];
  els.progressLabel.textContent = kind === 'good' ? '✓' : '↺';

  const scene = document.createElement('div');
  scene.className = 'scene';
  scene.innerHTML = `<div class="emoji-main">${e.emoji}</div>`;
  els.sceneWrap.innerHTML = '';
  els.sceneWrap.appendChild(scene);

  const tag = document.createElement('span');
  tag.className = 'ending-tag ' + (kind === 'good' ? 'good' : 'bad');
  tag.textContent = e.tag;

  els.stepTitle.innerHTML = '';
  els.stepTitle.appendChild(tag);
  const titleLine = document.createElement('div');
  titleLine.textContent = e.title;
  els.stepTitle.appendChild(titleLine);

  els.stepText.textContent = e.text;

  const btn = document.createElement('button');
  btn.className = 'primary-btn ' + (kind === 'good' ? 'success' : 'danger');
  btn.textContent = e.cta;
  btn.addEventListener('click', () => {
    stepIndex = 0;
    render();
  });
  els.interactionArea.innerHTML = '';
  els.interactionArea.appendChild(btn);

  narrate(e.text);
}

/* ============ step rendering ============ */
function goToStep(idx){
  stepIndex = idx;
  render();
}

function render(){
  clearInterval(qteInterval);
  const t = STORY[lang];
  const step = t.steps[stepIndex];

  els.progressLabel.textContent = t.progress(stepIndex + 1);
  els.stepTitle.textContent = step.title;
  els.stepText.textContent = step.text;
  refreshLangUI();
  refreshLampUI();
  els.narrLabel.textContent = t.narrating;

  const scene = document.createElement('div');
  scene.className = 'scene';
  scene.innerHTML = `<div class="emoji-main">${step.emoji}</div>`;
  els.sceneWrap.innerHTML = '';
  els.sceneWrap.appendChild(scene);
  els.interactionArea.innerHTML = '';

  if(step.qte){
    runQTE(t);
  } else if(step.choices){
    renderChoices(t, step);
  } else {
    const btn = document.createElement('button');
    btn.className = 'primary-btn';
    btn.textContent = step.cta;
    btn.addEventListener('click', () => goToStep(stepIndex + 1));
    els.interactionArea.appendChild(btn);
  }

  narrate(step.text);

  // notify parent (Blogger) of height for auto-resize iframe embedding
  requestAnimationFrame(reportHeight);
}

/* ============ iframe auto-resize (Blogger embedding) ============ */
function reportHeight(){
  try{
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ kancilHeight: height }, '*');
  }catch(e){ /* no-op if not embedded */ }
}
window.addEventListener('resize', reportHeight);
new MutationObserver(reportHeight).observe(document.body, { childList:true, subtree:true, attributes:true });

/* ============ init ============ */
refreshLangUI();
refreshLampUI();
render();
</script>
</body>
</html>

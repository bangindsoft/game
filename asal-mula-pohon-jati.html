<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asal Mula Pohon Jati Besar-Besar</title>
<style>
  :root{
    --bg-dark:#1c1408;
    --bg-panel:#2b1e10;
    --wood:#7a4a26;
    --wood-dark:#4e2f18;
    --gold:#d9a441;
    --gold-light:#f2c766;
    --cream:#f6ecd9;
    --leaf:#3f6b3a;
    --leaf-dark:#274a26;
    --red:#a5382c;
    --sky1:#f4d9a0;
    --sky2:#e08a4c;
    --night1:#101427;
    --night2:#2b2f52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:var(--bg-dark);
    color:var(--cream);
    display:flex;
    justify-content:center;
    overflow-y:auto;
    overflow-x:hidden;
    min-height:100vh;
  }
  #app{
    width:100%;
    max-width:720px;
    background:linear-gradient(180deg,#241809,#150e06);
    border-radius:0;
    overflow:visible;
    position:relative;
  }
  /* Top bar */
  #topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(217,164,65,0.25);
  }
  #topbar .title{
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--gold-light);
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:55%;
  }
  .icon-btn{
    background:rgba(217,164,65,0.12);
    border:1px solid rgba(217,164,65,0.4);
    color:var(--gold-light);
    border-radius:8px;
    width:36px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:15px;
    transition:background .15s;
  }
  .icon-btn:hover{background:rgba(217,164,65,0.25);}
  .lang-btn{
    font-size:12px;
    font-weight:700;
    width:auto;
    padding:0 10px;
  }
  #topbar-right{display:flex;gap:8px;}

  /* Stage */
  #stage-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 4/3;
    background:linear-gradient(180deg,var(--night1),var(--night2));
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }

  /* Progress dots */
  #dots{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:5;
    background:rgba(0,0,0,0.3);
    padding:5px 9px;
    border-radius:20px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,0.3);
    transition:background .3s, transform .3s;
  }
  .dot.active{background:var(--gold-light); transform:scale(1.3);}
  .dot.done{background:var(--gold);}

  /* Narration box */
  #narration-box{
    padding:14px 16px 10px;
    background:var(--bg-panel);
    min-height:74px;
    border-top:2px solid var(--wood-dark);
  }
  #narration-text{
    font-size:15px;
    line-height:1.5;
    color:var(--cream);
    min-height:44px;
  }
  #narration-text .speaking{color:var(--gold-light);}

  /* Controls */
  #controls{
    padding:10px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--bg-panel);
  }
  .btn-row{display:flex; gap:10px; justify-content:center;}
  .main-btn{
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    color:#3a2504;
    border:none;
    padding:11px 24px;
    border-radius:24px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 0 #96701f;
    transition:transform .1s;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    position:relative;
    z-index:20;
  }
  .main-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #96701f;}
  .main-btn.secondary{
    background:transparent;
    color:var(--gold-light);
    border:1.5px solid var(--gold);
    box-shadow:none;
  }
  .main-btn:disabled{opacity:0.5; cursor:default;}

  /* Minigame prompt */
  #minigame-prompt{
    text-align:center;
    font-size:13px;
    color:var(--gold-light);
    min-height:16px;
    font-style:italic;
  }
  #hold-btn{
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  #controls{ position:relative; z-index:15; }
  #debug-line{
    font-size:10px;
    color:#ff8a8a;
    text-align:center;
    min-height:0;
    word-break:break-word;
    padding:0 8px;
  }
  #progress-bar-wrap{
    width:100%;
    height:14px;
    background:rgba(255,255,255,0.12);
    border-radius:8px;
    overflow:hidden;
    border:1px solid rgba(217,164,65,0.3);
  }
  #progress-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--gold),var(--gold-light));
    transition:width .05s linear;
  }

  /* Footer */
  #footer{
    text-align:center;
    font-size:11px;
    color:rgba(246,236,217,0.45);
    padding:8px 10px 12px;
    background:var(--bg-panel);
  }

  /* Start overlay */
  #start-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(16,20,39,0.65), rgba(28,20,8,0.92));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    z-index:10;
  }
  #start-overlay h1{
    font-size:22px;
    color:var(--gold-light);
    margin:0 0 8px;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  #start-overlay p{
    font-size:13px;
    color:var(--cream);
    max-width:320px;
    margin:0 0 20px;
    opacity:0.85;
  }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="title" id="topbar-title">Asal Mula Pohon Jati Besar-Besar</div>
    <div id="topbar-right">
      <button class="icon-btn lang-btn" id="lang-toggle">EN</button>
      <button class="icon-btn" id="mute-toggle" title="Mute">🔊</button>
    </div>
  </div>

  <div id="stage-wrap">
    <div id="dots"></div>
    <canvas id="stage" width="800" height="600"></canvas>
    <div id="start-overlay">
      <h1 id="start-title">Asal Mula Pohon Jati Besar-Besar</h1>
      <p id="start-desc">Cerita rakyat dari Jawa Timur tentang seorang raja, sebuah rahasia, dan pohon jati yang tumbuh raksasa.</p>
      <button class="main-btn" id="start-btn">▶ Mulai Cerita</button>
    </div>
  </div>

  <div id="narration-box">
    <div id="narration-text"></div>
  </div>

  <div id="controls">
    <div id="minigame-prompt"></div>
    <div id="progress-bar-wrap" class="hidden"><div id="progress-bar-fill"></div></div>
    <div class="btn-row" id="btn-row">
      <button class="main-btn hidden" id="next-btn">Lanjut ▶</button>
      <button class="main-btn hidden" id="action-btn">Gali ⛏️</button>
      <button class="main-btn secondary hidden" id="replay-btn">↺ Ulangi Cerita</button>
    </div>
  </div>

  <div id="footer">Cerita Rakyat Nusantara — Dongeng Interaktif</div>
  <div id="debug-line"></div>
</div>

<script>
(function(){
"use strict";

/* Global error visibility: shows any uncaught error directly on the page
   so problems can be diagnosed from a screenshot without opening devtools. */
window.addEventListener('error', function(e){
  try{
    const dbg = document.getElementById('debug-line');
    if(dbg) dbg.textContent = 'Debug: ' + (e.message || 'unknown error') + ' (line ' + e.lineno + ')';
  }catch(_e){}
});
window.addEventListener('unhandledrejection', function(e){
  try{
    const dbg = document.getElementById('debug-line');
    if(dbg) dbg.textContent = 'Debug (promise): ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  }catch(_e){}
});


/* ============== I18N STRINGS ============== */
const STR = {

    holdWhisper: "Tahan tombol untuk berbisik",
    whisper: "Bisikkan Rahasia 🌳",
    tapWalk: "Ketuk berkali-kali agar Sulang terus berjalan",
    walk: "Melangkah 👣",
    tapDrum: "Ketuk berkali-kali untuk menabuh bedug",
    drum: "Tabuh Bedug 🥁",
    footer: "Cerita Rakyat Nusantara — Dongeng Interaktif"
  },
  en: {
    title: "The Origin of the Giant Teak Trees",

    startBtn: "▶ Start Story",
    next: "Next ▶",
    replay: "↺ Replay Story",
    holdToDig: "Hold the button to dig",
    dig: "Dig ⛏️",
    holdWhisper: "Hold the button to whisper",
    whisper: "Whisper the Secret 🌳",

    walk: "Step 👣",

};

/* ============== SCENES ============== */
const SCENES = [
{
  id:"intro",
  type:"narration",
  bg:"palaceNight",
  narr:{
    id:"Dahulu kala di Medang Kamulan, hiduplah seorang raja yang telah tua namun belum juga memiliki putra. Dengan hati sedih, ia pergi bertapa ke tengah hutan, memohon kepada dewata agar dikaruniai seorang anak.",

  draw: drawIntro

{
  id:"blessing",
  type:"narration",
  bg:"palaceNight",
  narr:{

    en:"During his meditation, the gods sent him a dream: soon the queen would conceive. The king returned home overjoyed, and not long after, the queen was indeed expecting a child."

  draw: drawBlessing
},
{

  type:"narration",
  bg:"palaceDay",
  narr:{
    id:"Sembilan bulan berlalu. Namun yang lahir bukanlah bayi manusia, melainkan seekor bayi kijang mungil. Raja terkejut—perasaan kecewa, marah, dan malu bercampur menjadi satu.",
    en:"Nine months passed. But what was born was not a human baby—it was a tiny fawn. The king was stunned, feeling disappointment, anger, and shame all at once."

},
{
  id:"bury",
  type:"hold",
  bg:"forestNight",
  duration:2600,
  narr:{
    id:"Tanpa berpikir panjang, raja membawa bayi kijang itu jauh ke tengah hutan. Agar rahasianya tak diketahui siapa pun, ia menguburkannya hidup-hidup di bawah tanah.",
    en:"Without thinking twice, the king carried the fawn deep into the forest. To keep his secret hidden from everyone, he buried it alive beneath the earth."
  },
  promptKey:"holdToDig",
  actionKey:"dig",
  draw: drawBury
},
{
  id:"illness",
  type:"narration",
  bg:"palaceNight",
  narr:{
    id:"Sesampainya di istana, raja tiba-tiba jatuh sakit. Tubuhnya membengkak dan sulit digerakkan. Banyak tabib datang mengobati, namun tak satu pun sanggup menyembuhkannya.",
    en:"Back at the palace, the king suddenly fell gravely ill. His body swelled up and he could barely move. Many healers came, but none could cure him."

  narr:{

    id:"Karena ukurannya yang besar, rakyat menebang pohon jati itu dan menjadikannya bedug. Ketika ditabuh, bedug itu berbunyi aneh, seolah bercerita tentang rahasia sang raja kepada seluruh negeri.",
    en:"Because of its enormous size, the villagers cut down the teak tree and made it into a great drum. When beaten, the drum made a strange sound—as if telling the king's secret to the whole kingdom."
  },
  promptKey:"tapDrum",
  actionKey:"drum",
  draw: drawBedug
},
{
  id:"ending",
  type:"narration",
  bg:"forestDawn",
  narr:{
    id:"\"Dang... dang... dang... Raja Medang berputra seekor kijang, dikuburnya hidup-hidup, lalu diceritakan kepada Sulang...\" Begitulah bunyi bedug itu, hingga seluruh rakyat mengetahui rahasia sang raja. Dan sejak itu, pohon jati tumbuh besar di seluruh negeri.",
    en:"\"Dang... dang... dang... King Medang's son was a fawn, buried alive, then told to Sulang...\" So sang the drum, until the whole kingdom learned the king's secret. And from that day, teak trees grew tall and mighty across the land."

];

/* ============== STATE ============== */
let lang = (function(){
  const p = new URLSearchParams(location.search);
  if(p.get('lang')==='en') return 'en';
  return 'id';
})();
function safeGetStorage(key){
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
function safeSetStorage(key,val){
  try{ window.localStorage.setItem(key,val); }catch(e){ /* storage blocked, e.g. sandboxed iframe */ }
}
let muted = safeGetStorage('jati_muted') === '1';
let sceneIndex = 0;
let started = false;
let holdActive = false;
let holdStart = 0;
let holdRAF = null;
let tapCount = 0;
let tapTarget = 0;
let animRAF = null;
let animStartTime = 0;
let voices = [];

/* ============== DOM ============== */
const dotsEl = document.getElementById('dots');
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const narrTextEl = document.getElementById('narration-text');
const nextBtn = document.getElementById('next-btn');
const actionBtn = document.getElementById('action-btn');
const replayBtn = document.getElementById('replay-btn');
const promptEl = document.getElementById('minigame-prompt');
const progWrap = document.getElementById('progress-bar-wrap');
const progFill = document.getElementById('progress-bar-fill');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const langToggle = document.getElementById('lang-toggle');
const muteToggle = document.getElementById('mute-toggle');
const topbarTitle = document.getElementById('topbar-title');
const startTitle = document.getElementById('start-title');
const startDesc = document.getElementById('start-desc');
const footerEl = document.getElementById('footer');

/* ============== CRITICAL EVENT WIRING (do this first, before any risky code) ============== */
/* Wired immediately so buttons work even if a later feature (speech, storage,
   canvas sizing) throws an error in a restrictive browser/iframe context. */
actionBtn.addEventListener('mousedown', (e)=>{
  const scene = SCENES[sceneIndex];
  if(scene.type==='hold'){ startHold(); }
});
actionBtn.addEventListener('touchstart', (e)=>{
  const scene = SCENES[sceneIndex];
  if(scene.type==='hold'){
    e.preventDefault();
    startHold();
  }
  /* for 'tap' scenes we deliberately do NOT preventDefault here,
     so the browser fires a normal 'click' afterward — the most
     reliable cross-device event for repeated taps. */
}, {passive:false});
['mouseup','mouseleave'].forEach(ev=>actionBtn.addEventListener(ev, cancelHold));
actionBtn.addEventListener('touchend', cancelHold);
actionBtn.addEventListener('touchcancel', cancelHold);
actionBtn.addEventListener('click', ()=>{
  const scene = SCENES[sceneIndex];
  if(scene.type==='tap'){ doTap(); }
});

nextBtn.addEventListener('click', goNext);
replayBtn.addEventListener('click', ()=>{
  sceneIndex = 0;
  replayBtn.classList.add('hidden');
  renderScene();
});

startBtn.addEventListener('click', ()=>{
  started = true;
  startOverlay.classList.add('hidden');
  try{ buildDots(); }catch(e){ console.warn('dots build skipped:', e); }
  renderScene();
});

muteToggle.addEventListener('click', ()=>{
  muted = !muted;
  safeSetStorage('jati_muted', muted ? '1':'0');
  try{ applyMuteUI(); }catch(e){}
  if(muted) stopSpeak();
});

langToggle.addEventListener('click', ()=>{
  lang = lang === 'id' ? 'en' : 'id';
  try{ applyLang(); }catch(e){}
  if(started){
    renderScene(true);
  }
});

window.addEventListener('load', notifyResize);
window.addEventListener('resize', notifyResize);
window.addEventListener('resize', ()=>{ try{ fitCanvas(); }catch(e){} });

/* ============== SETUP DOTS ============== */
function buildDots(){
  dotsEl.innerHTML = '';
  SCENES.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.dataset.i = i;
    dotsEl.appendChild(d);
  });
}
function updateDots(){
  [...dotsEl.children].forEach((d,i)=>{
    d.classList.toggle('active', i===sceneIndex);
    d.classList.toggle('done', i<sceneIndex);
  });
}

/* ============== I18N APPLY ============== */
function applyLang(){
  const t = STR[lang];
  topbarTitle.textContent = t.title;
  startTitle.textContent = t.title;
  startDesc.textContent = t.startDesc;
  startBtn.textContent = t.startBtn;
  nextBtn.textContent = t.next;
  replayBtn.textContent = t.replay;
  footerEl.textContent = t.footer;
  langToggle.textContent = lang === 'id' ? 'EN' : 'ID';
  document.documentElement.lang = lang;
}

/* ============== SPEECH ============== */
function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  if(!voices || !voices.length) return null;
  const wantLang = lang === 'id' ? 'id' : 'en';
  let v = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(wantLang));
  if(!v && wantLang==='id') v = voices.find(v=>/indones/i.test(v.name));
  return v || voices[0];
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  if(muted) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if(v) u.voice = v;
  u.lang = lang === 'id' ? 'id-ID' : 'en-US';
  u.rate = 0.92;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}
function stopSpeak(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}

/* ============== TYPEWRITER NARRATION ============== */
let typeTimer = null;
function showNarration(text){
  narrTextEl.textContent = '';
  if(typeTimer) clearInterval(typeTimer);
  let i = 0;
  typeTimer = setInterval(()=>{
    narrTextEl.textContent = text.slice(0,i);
    i++;
    if(i > text.length){ clearInterval(typeTimer); }
  }, 14);
}

/* ============== RESIZE / POSTMESSAGE ============== */
function notifyResize(){
  const h = document.getElementById('app').getBoundingClientRect().height;
  try{
    window.parent.postMessage({ type:'jati-resize', height: Math.ceil(h) }, '*');
  }catch(e){}
}
/* ============== MUTE ============== */
function applyMuteUI(){
  muteToggle.textContent = muted ? '🔇' : '🔊';
}

/* ============== CANVAS SIZE ============== */
function fitCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 800 * dpr;
  canvas.height = 600 * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* ============== BACKGROUND HELPERS ============== */
function drawBackground(kind, t){
  const W=800,H=600;
  let sky1,sky2,ground1,ground2;
  switch(kind){
    case 'palaceNight':
      sky1='#141a33'; sky2='#2c2f57'; ground1='#3a2510'; ground2='#241608'; break;
    case 'palaceDay':
      sky1='#f7dfa8'; sky2='#e39a5a'; ground1='#8a5a2a'; ground2='#5c3a18'; break;
    case 'forestNight':
      sky1='#0d1220'; sky2='#1c2440'; ground1='#182a17'; ground2='#0e1a0d'; break;
    case 'forestDay':
      sky1='#bfe3d6'; sky2='#8fc9a6'; ground1='#3f6b3a'; ground2='#274a26'; break;
    case 'villageDay':
      sky1='#fbe7bd'; sky2='#eab074'; ground1='#8a6a3a'; ground2='#5c4520'; break;
    case 'forestDawn':
      sky1='#ffd9a0'; sky2='#f2966b'; ground1='#4a6b3a'; ground2='#2a4a26'; break;
    default:
      sky1='#222'; sky2='#111'; ground1='#333'; ground2='#111';
  }
  const g = ctx.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,sky1); g.addColorStop(1,sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H*0.62);

  const gg = ctx.createLinearGradient(0,H*0.55,0,H);
  gg.addColorStop(0,ground1); gg.addColorStop(1,ground2);
  ctx.fillStyle = gg;
  ctx.fillRect(0,H*0.55,W,H*0.45);

  // stars for night scenes
  if(kind==='palaceNight' || kind==='forestNight'){
    ctx.fillStyle='rgba(255,255,255,0.8)';
    for(let i=0;i<40;i++){
      const sx = (i*97 + 31) % W;
      const sy = (i*53 + 12) % (H*0.5);
      const tw = 0.5 + 0.5*Math.sin(t/500 + i);
      ctx.globalAlpha = 0.3 + 0.5*tw;
      ctx.beginPath();
      ctx.arc(sx,sy,1.4,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
    // moon
    ctx.fillStyle = '#f4edd6';
    ctx.beginPath(); ctx.arc(W-100,90,34,0,Math.PI*2); ctx.fill();
  }
  if(kind==='palaceDay' || kind==='villageDay'){
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(120,80,36,0,Math.PI*2); ctx.fill();
  }
  if(kind==='forestDay'){
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(W-110,70,30,0,Math.PI*2); ctx.fill();
  }
  if(kind==='forestDawn'){
    ctx.fillStyle='rgba(255,240,210,0.9)';
    ctx.beginPath(); ctx.arc(W/2,H*0.55,60,0,Math.PI*2); ctx.fill();
  }
}

/* ============== ANIMATION LOOP ============== */
function animLoop(now){
  if(!animStartTime) animStartTime = now;
  const t = now - animStartTime;
  const scene = SCENES[sceneIndex];
  let progress = 0;
  if(scene.type==='hold'){
    progress = holdActive ? Math.min(1,(now - holdStart)/scene.duration) : currentHoldProgress;
  } else if(scene.type==='tap'){
    progress = Math.min(1, tapCount/tapTarget);
  }
  ctx.clearRect(0,0,800,600);
  scene.draw(t, progress);
  animRAF = requestAnimationFrame(animLoop);
}

/* ============== SCENE FLOW ============== */
let currentHoldProgress = 0;

function renderScene(skipTypewriter){
  const scene = SCENES[sceneIndex];
  updateDots();
  tapCount = 0;
  tapTarget = scene.type==='tap' ? scene.duration : 0;
  currentHoldProgress = 0;
  holdActive = false;
  animStartTime = 0;

  // narration
  const text = scene.narr[lang];
  if(skipTypewriter){
    narrTextEl.textContent = text;
  } else {
    showNarration(text);
  }
  speak(text);

  // buttons / minigame UI
  nextBtn.classList.add('hidden');
  actionBtn.classList.add('hidden');
  progWrap.classList.add('hidden');
  promptEl.textContent = '';
  nextBtn.disabled = false;
  actionBtn.disabled = false;

  if(scene.type === 'narration'){
    nextBtn.classList.remove('hidden');
  } else if(scene.type === 'hold'){
    actionBtn.classList.remove('hidden');
    actionBtn.textContent = STR[lang][scene.actionKey];
    promptEl.textContent = STR[lang][scene.promptKey];
    progWrap.classList.remove('hidden');
    progFill.style.width = '0%';
  } else if(scene.type === 'tap'){
    actionBtn.classList.remove('hidden');
    actionBtn.textContent = STR[lang][scene.actionKey];
    promptEl.textContent = STR[lang][scene.promptKey];
    progWrap.classList.remove('hidden');
    progFill.style.width = '0%';
  }

  if(animRAF) cancelAnimationFrame(animRAF);
  animRAF = requestAnimationFrame(animLoop);

  setTimeout(notifyResize, 50);
}

function goNext(){
  stopSpeak();
  if(sceneIndex < SCENES.length-1){
    sceneIndex++;
    renderScene();
  } else {
    finishStory();
  }
}

function finishStory(){
  nextBtn.classList.add('hidden');
  actionBtn.classList.add('hidden');
  progWrap.classList.add('hidden');
  promptEl.textContent='';
  replayBtn.classList.remove('hidden');
  setTimeout(notifyResize, 50);
}

/* ============== HOLD INTERACTION ============== */
function startHold(){
  const scene = SCENES[sceneIndex];
  if(scene.type !== 'hold') return;
  if(holdActive) return;
  holdActive = true;
  holdStart = performance.now();
  actionBtn.disabled = true;
  tickHold();
}
function tickHold(){
  const scene = SCENES[sceneIndex];
  if(!holdActive) return;
  const now = performance.now();
  const p = Math.min(1, (now-holdStart)/scene.duration);
  currentHoldProgress = p;
  progFill.style.width = (p*100)+'%';
  if(p>=1){
    holdActive = false;
    actionBtn.disabled = false;
    completeMinigame();
    return;
  }
  holdRAF = requestAnimationFrame(tickHold);
}
function cancelHold(){
  const scene = SCENES[sceneIndex];
  if(scene.type !== 'hold') return;
  if(!holdActive) return;
  holdActive = false;
  actionBtn.disabled = false;
  if(holdRAF) cancelAnimationFrame(holdRAF);
  // decay progress a bit but keep some
  currentHoldProgress = Math.max(0, currentHoldProgress - 0.15);
  progFill.style.width = (currentHoldProgress*100)+'%';
}

/* ============== TAP INTERACTION ============== */
function doTap(){
  const scene = SCENES[sceneIndex];
  if(scene.type !== 'tap') return;
  tapCount++;
  const p = Math.min(1, tapCount/tapTarget);
  progFill.style.width = (p*100)+'%';
  if(tapCount >= tapTarget){
    completeMinigame();
  }
}

function completeMinigame(){
  actionBtn.classList.add('hidden');
  progWrap.classList.add('hidden');
  promptEl.textContent='';
  nextBtn.classList.remove('hidden');
}

/* ============== FINAL INIT (non-critical features, guarded) ============== */
try{
  if('speechSynthesis' in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
}catch(e){ console.warn('speech init skipped:', e); }

try{ applyMuteUI(); }catch(e){ console.warn('mute UI skipped:', e); }
try{ applyLang(); }catch(e){ console.warn('lang apply skipped:', e); }
try{ fitCanvas(); }catch(e){ console.warn('canvas fit skipped:', e); }
try{ buildDots(); }catch(e){ console.warn('dots build skipped:', e); }
try{ notifyResize(); }catch(e){ console.warn('resize notify skipped:', e); }

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Asal Mula Nama Karimunjawa - Legenda Sunan Nyamplungan</title>
<style>
  :root{
    --sea-deep:#0b4a5e;
    --sea-mid:#12718c;
    --sea-light:#3fa8b8;
    --sand:#e8caa0;
    --wood:#5c3a21;
    --wood-dark:#3c2414;
    --gold:#d9a441;
    --gold-light:#f0c869;
    --cream:#faf3e3;
    --ink:#2b1c12;
    --leaf:#3f7d4a;
    --leaf-dark:#2b5934;
    --danger:#b5452e;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:transparent;
  }
  #app{
    width:100%;
    max-width:760px;
    margin:0 auto;
    background:linear-gradient(180deg,#fdf6e6 0%,#f5e6c4 100%);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 6px 24px rgba(60,36,20,0.25);
    border:3px solid var(--wood);
  }
  #titlebar{
    background:linear-gradient(135deg,var(--wood-dark),var(--wood));
    color:var(--gold-light);
    padding:12px 16px;
    text-align:center;
    position:relative;
  }
  #titlebar h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:0.5px;
    font-weight:700;
    text-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  #titlebar .subtitle{
    font-size:0.72rem;
    color:var(--cream);
    opacity:0.85;
    margin-top:2px;
  }
  #top-controls{
    position:absolute;
    top:8px;
    right:10px;
    display:flex;
    gap:6px;
  }
  .icon-btn{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.35);
    color:var(--cream);
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.85rem;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.25);}
  .icon-btn.active{background:var(--gold);color:var(--wood-dark);border-color:var(--gold);}

  #stage-wrap{
    position:relative;
    width:100%;
    background:#000;
  }
  #stage{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:800/450;
    background:linear-gradient(180deg,#a9d8e6,#3fa8b8);
  }
  #interaction-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  #interaction-layer button, #interaction-layer .drag-target{
    pointer-events:auto;
  }

  #dots{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px 8px 4px;
    background:#f5e6c4;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:#d8c4a0;
    border:1px solid #b89a68;
    transition:all .25s;
  }
  .dot.active{
    background:var(--gold);
    border-color:var(--wood);
    transform:scale(1.3);
  }
  .dot.done{
    background:var(--leaf);
    border-color:var(--leaf-dark);
  }

  #instruction-bar{
    margin:6px 14px 0;
    background:linear-gradient(135deg,#fff3d6,#ffe8b3);
    border:1.5px dashed var(--gold);
    border-radius:10px;
    padding:8px 12px;
    font-size:0.82rem;
    color:var(--ink);
    text-align:center;
    font-weight:600;
    min-height:1.2em;
  }
  #instruction-bar .icon{margin-right:6px;}

  #narration-box{
    margin:8px 14px 14px;
    padding:10px 14px;
    background:var(--cream);
    border-radius:10px;
    border-left:4px solid var(--gold);
    font-size:0.86rem;
    line-height:1.5;
    color:var(--ink);
    min-height:3.2em;
  }

  #bottom-controls{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:0 14px 16px;
    flex-wrap:wrap;
  }
  .main-btn{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:var(--wood-dark);
    border:none;
    padding:10px 22px;
    border-radius:24px;
    font-weight:700;
    font-size:0.88rem;
    cursor:pointer;
    box-shadow:0 3px 6px rgba(0,0,0,0.2);
    transition:transform .12s;
  }
  .main-btn:hover{transform:translateY(-1px);}
  .main-btn:active{transform:translateY(1px);}
  .main-btn.secondary{
    background:linear-gradient(135deg,#eee,#ccc);
    color:var(--ink);
  }

  #footer{
    text-align:center;
    font-size:0.65rem;
    color:#a08a5f;
    padding:4px 10px 10px;
  }

  /* interaction widgets */
  .paddle-btn{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 70%);
    border:3px solid var(--wood-dark);
    color:var(--wood-dark);
    font-weight:800;
    font-size:0.85rem;
    width:88px;height:88px;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.35);
    user-select:none;
    touch-action:none;
  }
  .paddle-btn:active{filter:brightness(0.9);}

  .progress-track{
    position:absolute;
    left:8%;
    right:8%;
    bottom:14px;
    height:12px;
    background:rgba(255,255,255,0.4);
    border-radius:8px;
    border:1px solid rgba(0,0,0,0.2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--leaf),var(--gold));
    transition:width .05s linear;
  }

  .step-row{
    position:absolute;
    bottom:12px;
    left:0;right:0;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    padding:0 10px;
  }
  .step-btn{
    background:var(--cream);
    border:2px solid var(--wood);
    color:var(--ink);
    padding:8px 12px;
    border-radius:10px;
    font-size:0.72rem;
    font-weight:700;
    cursor:pointer;
    opacity:0.5;
    pointer-events:none;
    transition:all .2s;
  }
  .step-btn.enabled{
    opacity:1;
    pointer-events:auto;
    background:var(--gold-light);
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .step-btn.done{
    background:var(--leaf);
    color:#fff;
    opacity:0.85;
    border-color:var(--leaf-dark);
  }

  .drag-target{
    position:absolute;
    width:56px;height:56px;
    cursor:grab;
    touch-action:none;
  }

  #tap-counter{
    position:absolute;
    top:10px;right:10px;
    background:rgba(0,0,0,0.45);
    color:#fff;
    padding:4px 10px;
    border-radius:14px;
    font-size:0.75rem;
    font-weight:700;
  }

  #start-overlay{
    position:absolute;
    inset:0;
    background:rgba(10,20,25,0.55);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    color:#fff;
  }
  #start-overlay h2{
    margin:0 0 8px;
    font-size:1.1rem;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
  }
  #start-overlay p{
    font-size:0.8rem;
    max-width:380px;
    margin:0 0 16px;
    opacity:0.9;
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div id="top-controls">
      <button class="icon-btn" id="langBtn" title="Language">EN</button>
      <button class="icon-btn" id="muteBtn" title="Mute">🔊</button>
    </div>
    <h1 id="mainTitle">Asal Mula Nama Karimunjawa</h1>
    <div class="subtitle" id="subTitle">Legenda Sunan Nyamplungan &mdash; Cerita Rakyat Jawa Tengah</div>
  </div>

  <div id="stage-wrap">
    <canvas id="stage" width="800" height="450"></canvas>
    <div id="interaction-layer"></div>
    <div id="start-overlay">
      <h2 id="startTitle">Asal Mula Nama Karimunjawa</h2>
      <p id="startDesc">Ikuti kisah Amir Hasan, putra Sunan Muria, yang diasingkan ke sebuah pulau terpencil dan akhirnya menjadi asal mula nama Karimunjawa.</p>
      <button class="main-btn" id="startBtn">Mulai Cerita</button>
    </div>
  </div>

  <div id="dots"></div>
  <div id="instruction-bar"><span class="icon">👉</span><span id="instructionText"></span></div>
  <div id="narration-box"><span id="narrationText"></span></div>
  <div id="bottom-controls">
    <button class="main-btn secondary" id="replayBtn" style="display:none;">Ulangi Cerita</button>
  </div>
  <div id="footer">Cerita rakyat Nusantara &bull; Karimunjawa, Jawa Tengah</div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- i18n ---------------- */
  var STR = {
    id:{
      title:"Asal Mula Nama Karimunjawa",
      subtitle:"Legenda Sunan Nyamplungan — Cerita Rakyat Jawa Tengah",
      startTitle:"Asal Mula Nama Karimunjawa",
      startDesc:"Ikuti kisah Amir Hasan, putra Sunan Muria, yang diasingkan ke sebuah pulau terpencil dan akhirnya menjadi asal mula nama Karimunjawa.",
      startBtn:"Mulai Cerita",
      replayBtn:"Ulangi Cerita",
      langBtnLabel:"EN",
      tapsLeft:function(n){return "Sisa ketukan: " + n;}
    },
    en:{
      title:"The Origin of the Name Karimunjawa",
      subtitle:"The Legend of Sunan Nyamplungan — Folktale from Central Java",
      startTitle:"The Origin of the Name Karimunjawa",
      startDesc:"Follow the story of Amir Hasan, son of Sunan Muria, who was sent away to a remote island and became the origin of the name Karimunjawa.",
      startBtn:"Start Story",
      replayBtn:"Replay Story",
      langBtnLabel:"ID",
      tapsLeft:function(n){return "Taps left: " + n;}
    }
  };

  /* ---------------- Scenes data ---------------- */
  var scenes = [
    {
      id:"pesantren",
      narration:{
        id:"Pada zaman dahulu, di sebuah pesantren milik Sunan Kudus, tinggallah seorang pemuda bernama Amir Hasan, putra Sunan Muria. Sayangnya, ia dikenal nakal dan sering membuat ulah, meski telah dibimbing dengan penuh kasih sayang.",
        en:"Long ago, at a religious school belonging to Sunan Kudus, lived a young man named Amir Hasan, son of Sunan Muria. Sadly, he was known to be mischievous and often caused trouble, even though he had been raised with great care."
      },
      instruction:{
        id:"Ketuk gambar Amir Hasan untuk melihat kenakalannya",
        en:"Tap the picture of Amir Hasan to see his mischief"
      },
      type:"tapCharacter",
      target:5
    },
    {
      id:"berlayar",
      narration:{
        id:"Karena kenakalannya tak kunjung reda, Amir Hasan dititipkan untuk berlayar ke sebuah pulau kecil dan terpencil di Laut Jawa, agar ia dapat memperdalam ilmu agama jauh dari keramaian.",
        en:"Because his mischief never subsided, Amir Hasan was sent to sail toward a small, remote island in the Java Sea, so he could deepen his religious knowledge far from the crowds."
      },
      instruction:{
        id:"Tahan tombol dayung untuk mendayung perahu menuju pulau",
        en:"Hold the paddle button to row the boat toward the island"
      },
      type:"holdProgress"
    },
    {
      id:"hutan",
      narration:{
        id:"Pulau itu masih berupa hutan belantara yang lebat, dipenuhi hewan liar. Di tengah perjalanannya, seekor ular berbisa menghadangnya. Namun dengan keteguhan hati, Amir Hasan berhasil mengusirnya pergi.",
        en:"The island was still dense, untouched wilderness, full of wild creatures. In the middle of his journey, a venomous snake blocked his path. But with a steady heart, Amir Hasan managed to drive it away."
      },
      instruction:{
        id:"Ketuk layar dengan cepat untuk mengusir ular berbisa itu!",
        en:"Tap the screen rapidly to drive the venomous snake away!"
      },
      type:"rapidTap",
      target:10
    },
    {
      id:"menetap",
      narration:{
        id:"Amir Hasan pun menetap di pulau itu. Ia membuka lahan, menanam pohon nyamplung, dan dengan sabar mengajarkan ajaran Islam kepada penduduk yang tinggal di sana.",
        en:"Amir Hasan then settled on the island. He cleared the land, planted nyamplung trees, and patiently taught the Islamic faith to the people who lived there."
      },
      instruction:{
        id:"Ketuk tombol sesuai urutan: Gali Tanah, Tanam Biji, lalu Siram Tanaman",
        en:"Tap the buttons in order: Dig Soil, Plant Seed, then Water the Plant"
      },
      type:"sequentialSteps",
      steps:{
        id:["Gali Tanah","Tanam Biji","Siram Tanaman"],
        en:["Dig Soil","Plant Seed","Water Plant"]
      }
    },
    {
      id:"ibu",
      narration:{
        id:"Di seberang lautan, sang ibu, Nyai Sunan Muria, sangat merindukan putranya. Ia membawa bekal pecel lele dan siput kesukaan Amir Hasan, namun tak berhasil menemukannya. Dengan sedih, ia melemparkan bekal itu ke laut, hingga tempat itu kini dikenal sebagai Legon Lele.",
        en:"Across the sea, his mother, Nyai Sunan Muria, missed her son deeply. She brought his favorite catfish dish and snails, but could not find him. Sadly, she threw the food into the sea, and that place became known as Legon Lele."
      },
      instruction:{
        id:"Seret bungkusan bekal ke arah laut",
        en:"Drag the food bundle toward the sea"
      },
      type:"dragDrop"
    },
    {
      id:"nama",
      narration:{
        id:"Suatu hari, dari kejauhan, Amir Hasan melihat daratan Jawa yang tampak samar tertutup kabut. Ia pun berkata, 'Kulo katon Jawi neng kono', yang berarti 'saya melihat Jawa di sana'. Dari ucapan itulah pulau ini dikenal dengan nama Karimunjawa, dan Amir Hasan dijuluki Sunan Nyamplungan.",
        en:"One day, from a distance, Amir Hasan saw the land of Java looking hazy through the mist. He said, 'Kulo katon Jawi neng kono' — meaning 'I can see Java over there'. From those words, the island became known as Karimunjawa, and Amir Hasan was given the title Sunan Nyamplungan."
      },
      instruction:{
        id:"Ketuk ke arah pulau Jawa yang samar di kejauhan",
        en:"Tap toward the hazy island of Java in the distance"
      },
      type:"finalTap"
    }
  ];

  /* ---------------- State ---------------- */
  var state = {
    lang: (function(){
      var params = new URLSearchParams(window.location.search);
      var urlLang = params.get('lang');
      if(urlLang === 'en' || urlLang === 'id') return urlLang;
      var saved = localStorage.getItem('karimunjawa_lang');
      return saved === 'en' ? 'en' : 'id';
    })(),
    muted: localStorage.getItem('karimunjawa_muted') === 'true',
    sceneIndex: -1,
    started: false,
    completedScenes: []
  };

  /* ---------------- DOM refs ---------------- */
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var interactionLayer = document.getElementById('interaction-layer');
  var dotsEl = document.getElementById('dots');
  var instructionText = document.getElementById('instructionText');
  var narrationText = document.getElementById('narrationText');
  var replayBtn = document.getElementById('replayBtn');
  var startBtn = document.getElementById('startBtn');
  var startOverlay = document.getElementById('start-overlay');
  var langBtn = document.getElementById('langBtn');
  var muteBtn = document.getElementById('muteBtn');

  var W = 800, H = 450;
  var rafId = null;
  var animTime = 0;

  /* ---------------- Utility: draw helpers ---------------- */
  function clear(){
    ctx.clearRect(0,0,W,H);
  }

  function drawSkySea(cfg){
    cfg = cfg || {};
    var skyTop = cfg.skyTop || '#bfe3ee';
    var skyBottom = cfg.skyBottom || '#eaf6ee';
    var seaTop = cfg.seaTop || '#3fa8b8';
    var seaBottom = cfg.seaBottom || '#0b4a5e';
    var horizon = cfg.horizon || 200;

    var skyGrad = ctx.createLinearGradient(0,0,0,horizon);
    skyGrad.addColorStop(0, skyTop);
    skyGrad.addColorStop(1, skyBottom);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,horizon);

    var seaGrad = ctx.createLinearGradient(0,horizon,0,H);
    seaGrad.addColorStop(0, seaTop);
    seaGrad.addColorStop(1, seaBottom);
    ctx.fillStyle = seaGrad;
    ctx.fillRect(0,horizon,W,H-horizon);

    // waves
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    for(var i=0;i<6;i++){
      var y = horizon + 20 + i*32;
      if(y > H-10) continue;
      ctx.beginPath();
      for(var x=-20;x<=W+20;x+=20){
        var offset = Math.sin((x*0.03)+(animTime*0.002)+i) * 4;
        if(x===-20) ctx.moveTo(x,y+offset);
        else ctx.lineTo(x,y+offset);
      }
      ctx.stroke();
    }
    return horizon;
  }

  function drawSun(x,y,r){
    var g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'#fff6d8');
    g.addColorStop(1,'#ffd76b');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  function drawCloud(x,y,scale){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(x,y,28*scale,14*scale,0,0,Math.PI*2);
    ctx.ellipse(x+22*scale,y+4*scale,20*scale,11*scale,0,0,Math.PI*2);
    ctx.ellipse(x-22*scale,y+5*scale,18*scale,10*scale,0,0,Math.PI*2);
    ctx.fill();
  }

  function drawPesantren(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // main building
    ctx.fillStyle = '#c98f4e';
    ctx.fillRect(-90,-70,180,90);
    ctx.fillStyle = '#a56a30';
    ctx.fillRect(-90,-70,180,14);
    // roof
    ctx.fillStyle = '#7a3f22';
    ctx.beginPath();
    ctx.moveTo(-110,-70);
    ctx.lineTo(0,-130);
    ctx.lineTo(110,-70);
    ctx.closePath();
    ctx.fill();
    // door
    ctx.fillStyle = '#4a2a14';
    ctx.beginPath();
    ctx.moveTo(-18,20);
    ctx.lineTo(-18,-30);
    ctx.quadraticCurveTo(0,-50,18,-30);
    ctx.lineTo(18,20);
    ctx.closePath();
    ctx.fill();
    // windows
    ctx.fillStyle = '#4a2a14';
    ctx.beginPath(); ctx.arc(-55,-35,12,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(55,-35,12,0,Math.PI*2); ctx.fill();
    // dome ornament
    ctx.fillStyle = '#d9a441';
    ctx.beginPath();
    ctx.arc(0,-138,10,Math.PI,0);
    ctx.fill();
    ctx.restore();
  }

  function drawCharacter(x,y,scale,opts){
    opts = opts || {};
    var bob = opts.bob || 0;
    ctx.save();
    ctx.translate(x,y+bob);
    ctx.scale(scale,scale);
    // robe
    ctx.fillStyle = opts.robeColor || '#3b7a5a';
    ctx.beginPath();
    ctx.moveTo(-26,60);
    ctx.quadraticCurveTo(-30,0,-14,-20);
    ctx.lineTo(14,-20);
    ctx.quadraticCurveTo(30,0,26,60);
    ctx.closePath();
    ctx.fill();
    // arms
    ctx.strokeStyle = opts.robeColor || '#3b7a5a';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    var armSwing = opts.armSwing || 0;
    ctx.beginPath();
    ctx.moveTo(-16,-8);
    ctx.lineTo(-34,20+armSwing);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(16,-8);
    ctx.lineTo(34,20-armSwing);
    ctx.stroke();
    // head
    ctx.fillStyle = '#e3ad76';
    ctx.beginPath();
    ctx.arc(0,-34,16,0,Math.PI*2);
    ctx.fill();
    // peci (cap)
    ctx.fillStyle = opts.capColor || '#2b2b2b';
    ctx.beginPath();
    ctx.arc(0,-44,14,Math.PI,0);
    ctx.fill();
    ctx.fillRect(-14,-44,28,6);
    // face
    ctx.fillStyle = '#2b1c12';
    ctx.beginPath(); ctx.arc(-5,-33,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-33,1.6,0,Math.PI*2); ctx.fill();
    if(opts.expression === 'naughty'){
      ctx.beginPath();
      ctx.moveTo(-6,-26);
      ctx.quadraticCurveTo(0,-21,6,-27);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(0,-28,4,0,Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawElderCharacter(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#5a4632';
    ctx.beginPath();
    ctx.moveTo(-28,60);
    ctx.quadraticCurveTo(-32,0,-16,-20);
    ctx.lineTo(16,-20);
    ctx.quadraticCurveTo(32,0,28,60);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e3ad76';
    ctx.beginPath();
    ctx.arc(0,-34,16,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#eee';
    ctx.beginPath();
    ctx.arc(0,-46,15,Math.PI,0);
    ctx.fill();
    ctx.fillRect(-15,-46,30,5);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-10,-24);
    ctx.lineTo(-14,-6);
    ctx.moveTo(10,-24);
    ctx.lineTo(14,-6);
    ctx.stroke();
    ctx.fillStyle = '#2b1c12';
    ctx.beginPath(); ctx.arc(-5,-33,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-33,1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawBoat(x,y,scale,rock){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate((rock||0)*0.05);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#7a4a24';
    ctx.beginPath();
    ctx.moveTo(-60,10);
    ctx.quadraticCurveTo(-70,30,-40,32);
    ctx.lineTo(40,32);
    ctx.quadraticCurveTo(70,30,60,10);
    ctx.quadraticCurveTo(0,-4,-60,10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#4a2a14';
    ctx.lineWidth = 2;
    ctx.stroke();
    // mast
    ctx.strokeStyle = '#4a2a14';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0,10);
    ctx.lineTo(0,-60);
    ctx.stroke();
    // sail
    ctx.fillStyle = '#f0e6cf';
    ctx.beginPath();
    ctx.moveTo(0,-58);
    ctx.lineTo(38,-20);
    ctx.lineTo(0,-10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#c9b98a';
    ctx.stroke();
    ctx.restore();
  }

  function drawIslandSilhouette(x,y,scale,opacity){
    ctx.save();
    ctx.globalAlpha = opacity!==undefined?opacity:1;
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#7fa9b0';
    ctx.beginPath();
    ctx.moveTo(-90,10);
    ctx.quadraticCurveTo(-60,-30,-20,-15);
    ctx.quadraticCurveTo(20,-40,60,-10);
    ctx.quadraticCurveTo(90,0,90,10);
    ctx.lineTo(-90,10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawJungleIsland(horizon){
    // ground
    ctx.fillStyle = '#2f6b3a';
    ctx.beginPath();
    ctx.moveTo(0,H);
    ctx.lineTo(0,horizon+40);
    ctx.quadraticCurveTo(W*0.5,horizon-10,W,horizon+30);
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fill();
  }

  function drawPalm(x,y,scale,sway){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.strokeStyle = '#6b4423';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(8+ (sway||0),-40,4+(sway||0)*1.4,-80);
    ctx.stroke();
    var tipX = 4+(sway||0)*1.4, tipY=-80;
    ctx.fillStyle = '#3f7d4a';
    for(var i=0;i<6;i++){
      var ang = (i/6)*Math.PI*2;
      ctx.save();
      ctx.translate(tipX,tipY);
      ctx.rotate(ang*0.5 + (sway||0)*0.01);
      ctx.beginPath();
      ctx.ellipse(20,0,26,9,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSnake(x,y,scale,shake){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.rotate((shake||0)*0.06);
    ctx.strokeStyle = '#4c7a2e';
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-50,20);
    ctx.quadraticCurveTo(-20,-10+((shake||0)*2),10,10);
    ctx.quadraticCurveTo(35,25,50,-5+((shake||0)*2));
    ctx.stroke();
    // head
    ctx.fillStyle = '#4c7a2e';
    ctx.beginPath();
    ctx.arc(52,-6+((shake||0)*2),10,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.moveTo(60,-6+((shake||0)*2));
    ctx.lineTo(72,-4+((shake||0)*2));
    ctx.lineTo(60,-2+((shake||0)*2));
    ctx.fill();
    // eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(56,-9+((shake||0)*2),2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawTreeStage(x,y,stage){
    // stage 0=hole,1=seed,2=sprout,3=small tree,4=full tree
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = '#6b4423';
    ctx.beginPath();
    ctx.ellipse(0,0,26,8,0,0,Math.PI*2);
    ctx.fill();
    if(stage>=1 && stage<2){
      ctx.fillStyle = '#caa25a';
      ctx.beginPath();
      ctx.arc(0,-4,5,0,Math.PI*2);
      ctx.fill();
    }
    if(stage>=2){
      var h = stage===2?18:(stage===3?45:90);
      ctx.strokeStyle = '#5c3a21';
      ctx.lineWidth = stage===2?4:(stage===3?7:11);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(0,-h);
      ctx.stroke();
      var leafScale = stage===2?0.4:(stage===3?0.7:1.15);
      ctx.fillStyle = '#3f7d4a';
      for(var i=0;i<7;i++){
        var ang=(i/7)*Math.PI*2;
        ctx.beginPath();
        ctx.ellipse(Math.cos(ang)*22*leafScale, -h+Math.sin(ang)*14*leafScale, 20*leafScale, 9*leafScale, ang, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawBundle(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.moveTo(-22,0);
    ctx.quadraticCurveTo(0,-26,22,0);
    ctx.quadraticCurveTo(0,14,-22,0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#7a2016';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#e0b95c';
    ctx.beginPath();
    ctx.arc(0,-10,4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* ---------------- Speech ---------------- */
  var currentUtterance = null;
  function speak(text){
    if(state.muted) return;
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = state.lang === 'en' ? 'en-US' : 'id-ID';
      u.rate = 0.95;
      u.pitch = 1.0;
      var voices = window.speechSynthesis.getVoices();
      var match = voices.find(function(v){ return v.lang === u.lang; });
      if(!match){
        match = voices.find(function(v){ return v.lang && v.lang.indexOf(state.lang==='en'?'en':'id') === 0; });
      }
      if(match) u.voice = match;
      currentUtterance = u;
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not supported */ }
  }
  function stopSpeak(){
    if('speechSynthesis' in window){
      try{ window.speechSynthesis.cancel(); }catch(e){}
    }
  }
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){};
  }

  /* ---------------- Resize / postMessage ---------------- */
  function notifyResize(){
    var h = document.getElementById('app').offsetHeight;
    try{
      window.parent.postMessage({type:'resize', height: h, source:'karimunjawa-game'}, '*');
    }catch(e){}
  }
  window.addEventListener('resize', notifyResize);

  /* ---------------- Dots ---------------- */
  function renderDots(){
    dotsEl.innerHTML = '';
    scenes.forEach(function(s, i){
      var d = document.createElement('div');
      d.className = 'dot';
      if(i < state.sceneIndex) d.className += ' done';
      if(i === state.sceneIndex) d.className += ' active';
      dotsEl.appendChild(d);
    });
  }

  /* ---------------- Text update ---------------- */
  function updateStaticText(){
    var t = STR[state.lang];
    document.getElementById('mainTitle').textContent = t.title;
    document.getElementById('subTitle').textContent = t.subtitle;
    document.getElementById('startTitle').textContent = t.startTitle;
    document.getElementById('startDesc').textContent = t.startDesc;
    startBtn.textContent = t.startBtn;
    replayBtn.textContent = t.replayBtn;
    langBtn.textContent = t.langBtnLabel;
    document.documentElement.lang = state.lang;
  }

  function updateSceneText(){
    if(state.sceneIndex < 0 || state.sceneIndex >= scenes.length) return;
    var sc = scenes[state.sceneIndex];
    instructionText.textContent = sc.instruction[state.lang];
    narrationText.textContent = sc.narration[state.lang];
  }

  /* ---------------- Interaction cleanup ---------------- */
  function clearInteraction(){
    interactionLayer.innerHTML = '';
    canvas.onclick = null;
    canvas.onpointerdown = null;
    canvas.onpointermove = null;
    canvas.onpointerup = null;
  }

  /* ---------------- Scene runner ---------------- */
  var sceneRuntime = {}; // per-scene mutable data

  function goToScene(index){
    if(rafId) cancelAnimationFrame(rafId);
    clearInteraction();
    state.sceneIndex = index;
    sceneRuntime = {};
    renderDots();
    updateSceneText();
    var sc = scenes[index];
    speak(sc.narration[state.lang]);
    setupScene(sc);
    startLoop(sc);
    notifyResize();
  }

  function onSceneComplete(){
    if(state.sceneIndex < scenes.length - 1){
      setTimeout(function(){ goToScene(state.sceneIndex+1); }, 900);
    } else {
      setTimeout(function(){ finishStory(); }, 1200);
    }
  }

  function finishStory(){
    if(rafId) cancelAnimationFrame(rafId);
    clearInteraction();
    renderDots();
    Array.prototype.forEach.call(document.querySelectorAll('.dot'), function(d){
      d.className = 'dot done';
    });
    drawEndingCard();
    replayBtn.style.display = 'inline-block';
    var t = state.lang==='en' ? "The End. Now you know the origin of the name Karimunjawa!" : "Tamat. Sekarang kamu tahu asal mula nama Karimunjawa!";
    instructionText.textContent = state.lang==='en' ? "Story complete!" : "Cerita selesai!";
    speak(t);
    notifyResize();
  }

  /* ================= Scene setup logic ================= */
  function setupScene(sc){
    switch(sc.type){
      case 'tapCharacter': setupTapCharacter(sc); break;
      case 'holdProgress': setupHoldProgress(sc); break;
      case 'rapidTap': setupRapidTap(sc); break;
      case 'sequentialSteps': setupSequentialSteps(sc); break;
      case 'dragDrop': setupDragDrop(sc); break;
      case 'finalTap': setupFinalTap(sc); break;
    }
  }

  /* ---- Scene 1: tap character (naughty) ---- */
  function setupTapCharacter(sc){
    sceneRuntime.taps = 0;
    sceneRuntime.target = sc.target;
    sceneRuntime.shake = 0;
    var counter = document.createElement('div');
    counter.id = 'tap-counter';
    counter.textContent = STR[state.lang].tapsLeft(sceneRuntime.target);
    interactionLayer.appendChild(counter);
    sceneRuntime.counterEl = counter;

    canvas.style.cursor = 'pointer';
    canvas.onpointerdown = function(e){
      if(sceneRuntime.done) return;
      var rect = canvas.getBoundingClientRect();
      var scaleX = W / rect.width;
      var mx = (e.clientX - rect.left) * scaleX;
      var my = (e.clientY - rect.top) * (H/rect.height);
      // hit region: character body around (400,290)
      var dx = mx-400, dy = my-260;
      if(dx*dx/ (140*140) + dy*dy/(180*180) <= 1){
        sceneRuntime.taps++;
        sceneRuntime.shake = 10;
        counter.textContent = STR[state.lang].tapsLeft(Math.max(0,sceneRuntime.target - sceneRuntime.taps));
        if(sceneRuntime.taps >= sceneRuntime.target){
          sceneRuntime.done = true;
          counter.textContent = state.lang==='en' ? 'Enough!' : 'Cukup!';
          onSceneComplete();
        }
      }
    };
  }
  function drawTapCharacterScene(){
    var horizon = drawSkySea({horizon:170, skyTop:'#cfe9f2', skyBottom:'#eef8ee'});
    drawSun(700,60,38);
    drawCloud(150,60,1); drawCloud(500,40,0.7);
    drawPesantren(400,300,1.15);
    var shakeX = sceneRuntime.shake ? Math.sin(animTime*0.08)*sceneRuntime.shake : 0;
    sceneRuntime.shake = Math.max(0, (sceneRuntime.shake||0) - 0.6);
    drawCharacter(400+shakeX, 300, 1.1, {robeColor:'#3b7a5a', expression:'naughty', armSwing: Math.sin(animTime*0.01)*4});
  }

  /* ---- Scene 2: hold to row boat ---- */
  function setupHoldProgress(sc){
    sceneRuntime.progress = 0;
    var track = document.createElement('div');
    track.className = 'progress-track';
    var fill = document.createElement('div');
    fill.className = 'progress-fill';
    track.appendChild(fill);
    interactionLayer.appendChild(track);
    sceneRuntime.fillEl = fill;

    var btn = document.createElement('button');
    btn.className = 'paddle-btn';
    btn.textContent = state.lang==='en' ? 'HOLD\nTO ROW' : 'TAHAN\nDAYUNG';
    btn.style.whiteSpace = 'pre-line';
    interactionLayer.appendChild(btn);

    sceneRuntime.holding = false;
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      sceneRuntime.holding = true;
    });
    var stopHold = function(){ sceneRuntime.holding = false; };
    btn.addEventListener('pointerup', stopHold);
    btn.addEventListener('pointerleave', stopHold);
    btn.addEventListener('pointercancel', stopHold);
  }
  function updateHoldProgress(){
    if(sceneRuntime.done) return;
    if(sceneRuntime.holding){
      sceneRuntime.progress = Math.min(100, sceneRuntime.progress + 0.9);
    } else {
      sceneRuntime.progress = Math.max(0, sceneRuntime.progress - 0.3);
    }
    if(sceneRuntime.fillEl) sceneRuntime.fillEl.style.width = sceneRuntime.progress + '%';
    if(sceneRuntime.progress >= 100 && !sceneRuntime.done){
      sceneRuntime.done = true;
      onSceneComplete();
    }
  }
  function drawHoldProgressScene(){
    var horizon = drawSkySea({horizon:200});
    drawSun(120,70,40);
    drawCloud(600,60,1);
    var prog = (sceneRuntime.progress||0)/100;
    drawIslandSilhouette(680, 210, 1.1, 0.7 + prog*0.3);
    var boatX = 150 + prog*380;
    var rock = Math.sin(animTime*0.006)*2;
    drawBoat(boatX, 260, 0.9, rock);
    drawCharacter(boatX, 232, 0.55, {robeColor:'#8a5a2b', armSwing: sceneRuntime.holding ? Math.sin(animTime*0.03)*10 : 2});
    updateHoldProgress();
  }

  /* ---- Scene 3: rapid tap snake ---- */
  function setupRapidTap(sc){
    sceneRuntime.taps = 0;
    sceneRuntime.target = sc.target;
    sceneRuntime.shake = 0;
    var counter = document.createElement('div');
    counter.id = 'tap-counter';
    counter.textContent = STR[state.lang].tapsLeft(sceneRuntime.target);
    interactionLayer.appendChild(counter);
    sceneRuntime.counterEl = counter;

    canvas.style.cursor = 'pointer';
    canvas.onpointerdown = function(){
      if(sceneRuntime.done) return;
      sceneRuntime.taps++;
      sceneRuntime.shake = 8;
      counter.textContent = STR[state.lang].tapsLeft(Math.max(0, sceneRuntime.target - sceneRuntime.taps));
      if(sceneRuntime.taps >= sceneRuntime.target){
        sceneRuntime.done = true;
        counter.textContent = state.lang==='en' ? 'Safe!' : 'Aman!';
        onSceneComplete();
      }
    };
  }
  function drawRapidTapScene(){
    var horizon = drawSkySea({horizon:150, skyTop:'#9fcdd8', skyBottom:'#c9e6cf'});
    drawJungleIsland(horizon);
    drawPalm(120,340,1,Math.sin(animTime*0.003)*4);
    drawPalm(680,330,0.8,Math.sin(animTime*0.003+1)*4);
    var retreat = Math.min(1, (sceneRuntime.taps||0)/sceneRuntime.target) * 200;
    drawSnake(500+retreat, 300, 1, sceneRuntime.shake);
    sceneRuntime.shake = Math.max(0,(sceneRuntime.shake||0)-0.5);
    drawCharacter(300, 320, 1.1, {robeColor:'#3b7a5a', expression:'naughty', armSwing: Math.sin(animTime*0.02)*6});
  }

  /* ---- Scene 4: sequential steps ---- */
  function setupSequentialSteps(sc){
    sceneRuntime.step = 0;
    var labels = sc.steps[state.lang];
    var row = document.createElement('div');
    row.className = 'step-row';
    sceneRuntime.buttons = [];
    labels.forEach(function(label, idx){
      var b = document.createElement('button');
      b.className = 'step-btn' + (idx===0 ? ' enabled' : '');
      b.textContent = (idx+1)+'. '+label;
      b.addEventListener('click', function(){
        if(idx !== sceneRuntime.step) return;
        b.classList.remove('enabled');
        b.classList.add('done');
        sceneRuntime.step++;
        if(sceneRuntime.step < sceneRuntime.buttons.length){
          sceneRuntime.buttons[sceneRuntime.step].classList.add('enabled');
        } else {
          sceneRuntime.done = true;
          onSceneComplete();
        }
      });
      row.appendChild(b);
      sceneRuntime.buttons.push(b);
    });
    interactionLayer.appendChild(row);
  }
  function drawSequentialStepsScene(){
    var horizon = drawSkySea({horizon:150, skyTop:'#bfe3ee', skyBottom:'#d8edd0'});
    drawJungleIsland(horizon);
    drawPalm(650,320,0.8,2);
    var stage = sceneRuntime.step===0?0:(sceneRuntime.step===1?1:(sceneRuntime.step===2?3:4));
    drawTreeStage(420, 340, stage);
    drawCharacter(280, 330, 1.0, {robeColor:'#3b7a5a', armSwing: Math.sin(animTime*0.015)*5});
    if(sceneRuntime.step >= 2){
      drawElderCharacter(150,340,0.75);
    }
  }

  /* ---- Scene 5: drag drop ---- */
  function setupDragDrop(sc){
    sceneRuntime.dropped = false;
    var seaHorizon = H*0.58; // must match drawDragDropScene horizon
    sceneRuntime.seaHorizon = seaHorizon;
    var bundleX = W*0.4, bundleY = seaHorizon - 90; // starts well above the sea, near the mother's hand (canvas-space)
    var dz = document.createElement('div');
    dz.className = 'drag-target';
    dz.style.borderRadius = '50%';
    interactionLayer.appendChild(dz);
    sceneRuntime.dz = dz;
    sceneRuntime.pos = {x:bundleX,y:bundleY};

    function placeAtCanvasCoords(cx, cy){
      var rect = interactionLayer.getBoundingClientRect();
      var sx = rect.width / W, sy = rect.height / H;
      dz.style.left = (cx*sx - 28) + 'px';
      dz.style.top = (cy*sy - 28) + 'px';
    }
    placeAtCanvasCoords(bundleX, bundleY);

    var dragging = false;
    function toCanvasCoords(clientX, clientY){
      var rect = canvas.getBoundingClientRect();
      return {
        x: (clientX-rect.left) * (W/rect.width),
        y: (clientY-rect.top) * (H/rect.height)
      };
    }
    dz.addEventListener('pointerdown', function(e){
      e.preventDefault();
      dragging = true;
      dz.setPointerCapture(e.pointerId);
    });
    dz.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var rect = interactionLayer.getBoundingClientRect();
      var lx = e.clientX - rect.left;
      var ly = e.clientY - rect.top;
      dz.style.left = (lx-28)+'px';
      dz.style.top = (ly-28)+'px';
      var cc = toCanvasCoords(e.clientX, e.clientY);
      sceneRuntime.pos = cc;
    });
    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      var seaThreshold = seaHorizon + 15; // must be dragged clearly past the shoreline into the sea
      if(sceneRuntime.pos.y > seaThreshold && !sceneRuntime.done){
        sceneRuntime.done = true;
        sceneRuntime.dropped = true;
        dz.style.display = 'none';
        onSceneComplete();
      } else {
        placeAtCanvasCoords(bundleX, bundleY);
        sceneRuntime.pos = {x:bundleX,y:bundleY};
      }
    }
    dz.addEventListener('pointerup', endDrag);
    dz.addEventListener('pointercancel', endDrag);
    window.addEventListener('resize', function(){
      if(!dragging && !sceneRuntime.dropped){
        placeAtCanvasCoords(sceneRuntime.pos.x, sceneRuntime.pos.y);
      }
    });
  }
  function drawDragDropScene(){
    var seaHorizon = sceneRuntime.seaHorizon || H*0.58;
    var horizon = drawSkySea({horizon: seaHorizon, seaTop:'#3fa8b8', seaBottom:'#0b4a5e'});
    drawSun(700,60,35);
    drawElderCharacter(180, seaHorizon-40, 1.0);
    if(sceneRuntime.dropped){
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'italic 15px Georgia, serif';
      ctx.textAlign='center';
      ctx.fillText(state.lang==='en' ? '"Legon Lele"' : '"Legon Lele"', 500, seaHorizon+60);
      ctx.restore();
    }
  }

  /* ---- Scene 6: final tap island ---- */
  function setupFinalTap(sc){
    canvas.style.cursor = 'pointer';
    canvas.onpointerdown = function(e){
      if(sceneRuntime.done) return;
      var rect = canvas.getBoundingClientRect();
      var mx = (e.clientX-rect.left) * (W/rect.width);
      var my = (e.clientY-rect.top) * (H/rect.height);
      var dx = mx-620, dy = my-140;
      if(dx*dx/(160*160) + dy*dy/(110*110) <= 1.4){
        sceneRuntime.done = true;
        sceneRuntime.revealed = true;
        onSceneComplete();
      }
    };
  }
  function drawFinalTapScene(){
    var horizon = drawSkySea({horizon:220, skyTop:'#d8ecec', skyBottom:'#eaf6ee'});
    drawSun(80,70,36);
    // hazy Java in distance
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(animTime*0.002)*0.05;
    drawIslandSilhouette(620,150,1.6,1);
    ctx.restore();
    if(!sceneRuntime.revealed){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 3;
      ctx.setLineDash([6,6]);
      ctx.strokeRect(470,90,300,130);
      ctx.setLineDash([]);
      ctx.restore();
    } else {
      ctx.save();
      ctx.fillStyle = '#2b1c12';
      ctx.font = 'bold 18px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.lang==='en' ? '"I can see Java over there!"' : '"Kulo katon Jawi neng kono!"', 400, 90);
      ctx.restore();
    }
    drawPalm(120,330,1,Math.sin(animTime*0.003)*3);
    drawCharacter(220,340,1.15,{robeColor:'#3b7a5a', armSwing: sceneRuntime.revealed ? 14 : Math.sin(animTime*0.01)*4});
  }

  /* ---------------- Main render dispatcher ---------------- */
  function renderCurrentScene(){
    if(state.sceneIndex < 0) return;
    var sc = scenes[state.sceneIndex];
    switch(sc.type){
      case 'tapCharacter': drawTapCharacterScene(); break;
      case 'holdProgress': drawHoldProgressScene(); break;
      case 'rapidTap': drawRapidTapScene(); break;
      case 'sequentialSteps': drawSequentialStepsScene(); break;
      case 'dragDrop': drawDragDropScene(); break;
      case 'finalTap': drawFinalTapScene(); break;
    }
  }

  function startLoop(){
    function loop(t){
      animTime = t;
      renderCurrentScene();
      rafId = requestAnimationFrame(loop);
    }
    rafId = requestAnimationFrame(loop);
  }

  /* ---------------- Controls ---------------- */
  function refreshInteractionText(){
    if(state.sceneIndex < 0 || state.sceneIndex >= scenes.length) return;
    var sc = scenes[state.sceneIndex];
    if((sc.type === 'tapCharacter' || sc.type === 'rapidTap') && sceneRuntime.counterEl){
      if(sceneRuntime.done){
        sceneRuntime.counterEl.textContent = state.lang==='en' ? (sc.type==='rapidTap'?'Safe!':'Enough!') : (sc.type==='rapidTap'?'Aman!':'Cukup!');
      } else {
        var remaining = Math.max(0, sceneRuntime.target - (sceneRuntime.taps||0));
        sceneRuntime.counterEl.textContent = STR[state.lang].tapsLeft(remaining);
      }
    } else if(sc.type === 'holdProgress'){
      var btn = interactionLayer.querySelector('.paddle-btn');
      if(btn) btn.textContent = state.lang==='en' ? 'HOLD\nTO ROW' : 'TAHAN\nDAYUNG';
    } else if(sc.type === 'sequentialSteps' && sceneRuntime.buttons){
      var labels = sc.steps[state.lang];
      sceneRuntime.buttons.forEach(function(b, idx){
        b.textContent = (idx+1)+'. '+labels[idx];
      });
    }
  }

  langBtn.addEventListener('click', function(){
    state.lang = state.lang === 'id' ? 'en' : 'id';
    localStorage.setItem('karimunjawa_lang', state.lang);
    updateStaticText();
    if(state.sceneIndex >= 0 && state.sceneIndex < scenes.length){
      updateSceneText();
      refreshInteractionText();
      speak(scenes[state.sceneIndex].narration[state.lang]);
    } else if(state.sceneIndex >= scenes.length){
      drawEndingCard();
    }
  });

  function updateMuteUI(){
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('active', state.muted);
  }
  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    localStorage.setItem('karimunjawa_muted', state.muted);
    updateMuteUI();
    if(state.muted) stopSpeak();
  });

  startBtn.addEventListener('click', function(){
    startOverlay.style.display = 'none';
    state.started = true;
    goToScene(0);
  });

  replayBtn.addEventListener('click', function(){
    replayBtn.style.display = 'none';
    goToScene(0);
  });

  /* ---------------- Init ---------------- */
  function init(){
    updateMuteUI();
    updateStaticText();
    clear();
    var horizon = drawSkySea({horizon:220});
    drawSun(680,70,40);
    drawIslandSilhouette(600,220,1.3,0.9);
    drawPalm(560,260,0.9,2);
    renderDots();
    notifyResize();
    setTimeout(notifyResize, 300);
  }

  window.addEventListener('load', function(){
    init();
  });
  // in case load already fired
  if(document.readyState === 'complete'){ init(); }

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cerita Rakyat Korea: 3 Benda Warisan</title>
<style>
  :root{
    --bg1:#f6efdc;
    --bg2:#efe3c2;
    --wood:#7a4a2b;
    --wood-dark:#5c3620;
    --gold:#c99a2e;
    --gold-light:#e8c368;
    --red:#b5372c;
    --jade:#2f6b52;
    --indigo:#2b3a67;
    --cream:#fff8ea;
    --ink:#3a2a1c;
    --shadow:rgba(58,42,28,0.25);
    font-family: 'Segoe UI', -apple-system, 'Noto Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    display:flex;
    justify-content:center;
    color:var(--ink);
  }
  #app{
    width:100%;
    max-width:820px;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 24px var(--shadow);
    border:3px solid var(--gold);
  }
  #topBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 12px;
    background:var(--wood-dark);
  }
  #titleTag{
    color:var(--cream);
    font-weight:700;
    font-size:14px;
    letter-spacing:.5px;
  }
  #topBtns{display:flex;gap:8px;}
  .iconBtn{
    background:var(--gold);
    color:var(--wood-dark);
    border:none;
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    min-width:40px;
  }
  .iconBtn:active{transform:scale(0.95);}
  #stageWrap{
    position:relative;
    background:#000;
  }
  #stage{
    position:relative;
    width:100%;
    aspect-ratio: 800/450;
    background:#111;
  }
  #gameCanvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:pointer;
  }
  #dots{
    display:flex;
    justify-content:center;
    gap:6px;
    padding:10px 8px 4px;
    flex-wrap:wrap;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:#d8c9a3;
    border:1px solid var(--wood);
    transition:all .2s;
  }
  .dot.active{background:var(--red);transform:scale(1.3);}
  .dot.done{background:var(--jade);}
  #narrationPanel{
    padding:10px 18px 4px;
    min-height:44px;
  }
  #narrationText{
    margin:0 0 6px;
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
  }
  #instructionText{
    margin:0;
    font-size:13px;
    font-style:italic;
    color:var(--jade);
    background:#eef6ef;
    border-left:3px solid var(--jade);
    padding:6px 10px;
    border-radius:4px;
    min-height:18px;
  }
  #controls{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:12px 16px 18px;
    flex-wrap:wrap;
  }
  .mainBtn{
    background:var(--red);
    color:var(--cream);
    border:none;
    border-radius:30px;
    padding:12px 26px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 0 #7c221a;
    letter-spacing:.3px;
  }
  .mainBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #7c221a;}
  .mainBtn.secondary{
    background:var(--jade);
    box-shadow:0 3px 0 #1c4835;
  }
  .mainBtn.secondary:active{box-shadow:0 1px 0 #1c4835;}
  .mainBtn:disabled{
    background:#b7ab8c;
    box-shadow:0 3px 0 #8c8267;
    cursor:default;
    opacity:.7;
  }
  #footer{
    text-align:center;
    font-size:11px;
    color:var(--wood);
    padding:6px 10px 12px;
    opacity:.75;
  }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="topBar">
    <span id="titleTag">🏺 3 Benda Warisan</span>
    <div id="topBtns">
      <button class="iconBtn" id="langBtn" title="Ganti Bahasa">EN</button>
      <button class="iconBtn" id="muteBtn" title="Bisukan/Suarakan">🔊</button>
    </div>
  </div>
  <div id="stageWrap">
    <div id="stage">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>
  </div>
  <div id="dots"></div>
  <div id="narrationPanel">
    <p id="narrationText"></p>
    <p id="instructionText"></p>
  </div>
  <div id="controls">
    <button class="mainBtn" id="startBtn">Mulai Cerita</button>
    <button class="mainBtn" id="actionBtn" style="display:none;">Lanjut ➜</button>
    <button class="mainBtn secondary" id="replayBtn" style="display:none;">↺ Ulangi Cerita</button>
  </div>
  <div id="footer">Cerita Rakyat Tradisional Korea</div>
</div>

<script>
(function(){
  "use strict";

  /* ============ STRINGS ============ */
  var STR = {
    id:{
      appTitle:"3 Benda Warisan",
      start:"Mulai Cerita",
      replay:"↺ Ulangi Cerita",
      next:"Lanjut ➜",
      hold:"Tahan: \"Apel! Apel!\"",
      mute:"🔇",
      unmute:"🔊",
      langBtn:"EN",
      scenes:[
        {
          title:"Perpisahan Sang Ibu",
          narr:"Di sebuah desa, hiduplah seorang ibu tua bersama tiga anak laki-lakinya. Sang ibu merasa ajalnya sudah dekat, lalu memanggil ketiga anaknya untuk berkumpul.",
          instr:"Ketuk tombol \"Lanjut\" untuk mendengarkan wasiat sang ibu."
        },
        {
          title:"Tiga Benda Wasiat",
          narr:"Sang ibu memberikan tiga benda wasiat: batu bening untuk si sulung, seruling bambu untuk anak kedua, dan baju lusuh untuk si bungsu. Ketiganya menyimpan keajaiban.",
          instr:"Ketuk batu bening, seruling bambu, dan baju lusuh satu per satu untuk melihat keajaibannya."
        },
        {
          title:"Anak Sulung yang Sombong",
          narr:"Anak sulung yang sombong memamerkan batu ajaibnya di halaman istana. Sang putri yang tamak pun tertarik dan ingin melihatnya sendiri.",
          instr:"Ketuk berulang kali batu ajaib di layar agar menggelinding dan mengeluarkan koin emas."
        },
        {
          title:"Anak Kedua Tertipu",
          narr:"Anak kedua memainkan seruling bambu hingga sekelompok prajurit muncul. Sang putri licik meminta mencoba, lalu merampasnya dan menangkap anak kedua.",
          instr:"Ketuk seruling bambu di tangan anak kedua untuk memainkannya di hadapan sang putri."
        },
        {
          title:"Bungsu Menyelinap ke Istana",
          narr:"Si bungsu yang cemas menyusul kakak-kakaknya ke istana. Ia mengenakan baju lusuh ajaib agar tak terlihat, lalu menyelinap melewati lorong istana.",
          instr:"Ketuk baju lusuh pada anak bungsu, lalu ketuk titik-titik lorong secara berurutan dari kiri ke kanan."
        },
        {
          title:"Hutan Pohon Apel Ajaib",
          narr:"Di belakang istana, si bungsu menemukan hutan dengan dua jenis pohon apel. Apel merah membuat hidung memanjang, sedangkan apel kuning mengembalikannya seperti semula.",
          instr:"Ketuk apel merah di pohon kiri lebih dulu, lalu ketuk apel kuning di pohon kanan."
        },
        {
          title:"Menyamar Menjadi Penjual Apel",
          narr:"Si bungsu menyamar menjadi penjual apel merah yang ranum. Ia berusaha memikat sang putri yang tamak agar mau memakannya.",
          instr:"Tahan tombol \"Apel! Apel!\" hingga penuh untuk memanggil sang putri."
        },
        {
          title:"Hidung Sang Putri Memanjang",
          narr:"Sang putri memakan apel merah itu dengan rakus. Perlahan hidungnya memanjang, dan seluruh istana menjadi kacau mencari cara menyembuhkannya.",
          instr:"Ketuk layar berkali-kali untuk menirukan kepanikan para pengawal istana."
        },
        {
          title:"Membebaskan Kakak-Kakak",
          narr:"Di tengah kekacauan, si bungsu menyelinap mengambil kembali batu ajaib dan seruling bambu, lalu membebaskan kedua kakaknya dari penjara.",
          instr:"Seret batu ajaib dan seruling bambu ke jeruji penjara untuk mengembalikannya pada kakak-kakak."
        },
        {
          title:"Pulang dengan Selamat",
          narr:"Ketiga bersaudara berhasil melarikan diri dan pulang dengan selamat. Mereka belajar bahwa kesombongan hanya mendatangkan malapetaka, sedangkan kebaikan hati membawa keselamatan.",
          instr:"Ketuk \"Ulangi Cerita\" jika ingin mendengarkan kisah ini sekali lagi."
        }
      ]
    },
    en:{
      appTitle:"Three Inheritance Items",
      start:"Start Story",
      replay:"↺ Replay Story",
      next:"Next ➜",
      hold:"Hold: \"Apples! Apples!\"",
      mute:"🔇",
      unmute:"🔊",
      langBtn:"ID",
      scenes:[
        {
          title:"The Mother's Farewell",
          narr:"In a small village lived an old mother with her three sons. Feeling her time was near, she called her sons together to speak with them.",
          instr:"Tap the \"Next\" button to hear the mother's final wishes."
        },
        {
          title:"Three Inheritance Items",
          narr:"The mother gave three magical items: a clear stone for the eldest, a bamboo flute for the second son, and ragged clothes for the youngest. Each held a hidden power.",
          instr:"Tap the clear stone, the bamboo flute, and the ragged clothes one by one to see their magic."
        },
        {
          title:"The Proud Eldest Son",
          narr:"The proud eldest son showed off his magic stone in the palace courtyard. The greedy princess noticed and wanted to see it for herself.",
          instr:"Tap the magic stone on screen repeatedly to make it roll and spill gold coins."
        },
        {
          title:"The Second Son is Tricked",
          narr:"The second son played his bamboo flute and a group of soldiers appeared. The cunning princess asked to try it herself, then seized it and had him captured.",
          instr:"Tap the bamboo flute in the second son's hand to play it for the princess."
        },
        {
          title:"The Youngest Sneaks into the Palace",
          narr:"Worried for his brothers, the youngest son followed them to the palace. He put on the magic ragged clothes to become invisible, then crept through the palace corridor.",
          instr:"Tap the ragged clothes on the youngest son, then tap the corridor dots in order from left to right."
        },
        {
          title:"The Magic Apple Orchard",
          narr:"Behind the palace, the youngest found an orchard with two kinds of apples. Red apples made a nose grow long, while yellow apples made it shrink back.",
          instr:"Tap the red apple on the left tree first, then tap the yellow apple on the right tree."
        },
        {
          title:"Disguised as an Apple Seller",
          narr:"The youngest son disguised himself as a seller of plump red apples, hoping to lure the greedy princess into eating one.",
          instr:"Press and hold the \"Apples! Apples!\" button until it's full to call the princess over."
        },
        {
          title:"The Princess's Nose Grows",
          narr:"The princess greedily ate the red apple. Slowly her nose grew longer and longer, throwing the whole palace into chaos as they searched for a cure.",
          instr:"Tap the screen repeatedly to act out the palace guards' panic."
        },
        {
          title:"Freeing the Brothers",
          narr:"Amid the chaos, the youngest son slipped in to reclaim the magic stone and bamboo flute, then freed his two brothers from prison.",
          instr:"Drag the magic stone and the bamboo flute to the prison bars to return them to the brothers."
        },
        {
          title:"Safely Home",
          narr:"The three brothers escaped and made it home safely. They learned that pride only brings disaster, while kindness leads to safety.",
          instr:"Tap \"Replay Story\" if you'd like to hear this tale again."
        }
      ]
    }
  };

  /* ============ STATE ============ */
  var state = {
    lang: (new URLSearchParams(location.search).get('lang')==='en') ? 'en':'id',
    muted: localStorage.getItem('cts_k3_mute')==='1',
    scene: -1, // -1 = title screen
    locked:false,
    started:false,
    // scene2
    items:{stone:false,flute:false,cloak:false},
    // scene3
    rollTaps:0, rollTarget:14,
    // scene4
    fluteDone:false,
    // scene5
    cloakOn:false, corridorIdx:0,
    corridorPts:[[300,380],[420,355],[540,380],[660,350]],
    // scene6
    appleStep:0,
    // scene7
    holding:false, holdVal:0,
    // scene8
    chaos:0, chaosTarget:12,
    // scene9
    stoneReturned:false, fluteReturned:false,
    dragging:null, dragPos:{x:0,y:0},
    // anim
    animT:0
  };

  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var W=800,H=450;
  var narrationText = document.getElementById('narrationText');
  var instructionText = document.getElementById('instructionText');
  var startBtn = document.getElementById('startBtn');
  var actionBtn = document.getElementById('actionBtn');
  var replayBtn = document.getElementById('replayBtn');
  var langBtn = document.getElementById('langBtn');
  var muteBtn = document.getElementById('muteBtn');
  var dotsWrap = document.getElementById('dots');

  function T(){ return STR[state.lang]; }

  /* ============ DOTS ============ */
  function buildDots(){
    dotsWrap.innerHTML='';
    for(var i=0;i<10;i++){
      var d=document.createElement('div');
      d.className='dot';
      d.dataset.i=i;
      dotsWrap.appendChild(d);
    }
  }
  function updateDots(){
    var els = dotsWrap.querySelectorAll('.dot');
    els.forEach(function(el,i){
      el.classList.remove('active','done');
      if(i<state.scene) el.classList.add('done');
      else if(i===state.scene) el.classList.add('active');
    });
  }

  /* ============ SPEECH ============ */
  var voices=[];
  function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if('speechSynthesis' in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(lang){
    var pref = lang==='en' ? 'en' : 'id';
    var v = voices.find(function(v){return v.lang && v.lang.toLowerCase().indexOf(pref)===0;});
    return v || null;
  }
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    if(state.muted || !text) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang==='en' ? 'en-US' : 'id-ID';
    var v = pickVoice(state.lang);
    if(v) u.voice = v;
    u.rate = 0.95;
    u.pitch = 1.05;
    try{ speechSynthesis.speak(u); }catch(e){}
  }

  /* ============ RESIZE / POSTMESSAGE ============ */
  function notifyResize(){
    var h = document.getElementById('app').offsetHeight;
    try{
      window.parent.postMessage({type:'caritasato-resize', height:h}, '*');
    }catch(e){}
  }
  if(window.ResizeObserver){
    new ResizeObserver(notifyResize).observe(document.getElementById('app'));
  }
  window.addEventListener('resize', notifyResize);
  window.addEventListener('load', notifyResize);

  /* ============ DRAW HELPERS ============ */
  function grad(x0,y0,x1,y1,stops){
    var g = ctx.createLinearGradient(x0,y0,x1,y1);
    stops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
    return g;
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawSky(topColor,botColor){
    ctx.fillStyle = grad(0,0,0,H,[[0,topColor],[1,botColor]]);
    ctx.fillRect(0,0,W,H);
  }
  function drawGround(y,color){
    ctx.fillStyle=color;
    ctx.fillRect(0,y,W,H-y);
  }
  function drawCloud(x,y,s){
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(x,y,18*s,0,Math.PI*2);
    ctx.arc(x+20*s,y-8*s,14*s,0,Math.PI*2);
    ctx.arc(x+38*s,y,16*s,0,Math.PI*2);
    ctx.arc(x+18*s,y+6*s,16*s,0,Math.PI*2);
    ctx.fill();
  }
  function drawHutBG(){
    drawSky('#fbe7b8','#f3cf8e');
    drawCloud(120,60,1); drawCloud(620,40,0.8);
    drawGround(320,'#8a6a3f');
    // floor mat
    ctx.fillStyle='#c9a15f';
    roundRect(60,300,680,120,10); ctx.fill();
    ctx.strokeStyle='#a67c3d'; ctx.lineWidth=3; roundRect(60,300,680,120,10); ctx.stroke();
    // back wall beams
    ctx.strokeStyle='#5c3a1e'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(0,300); ctx.lineTo(800,300); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(400,60); ctx.lineTo(400,300); ctx.stroke();
    // roof triangle
    ctx.fillStyle='#6b4726';
    ctx.beginPath();
    ctx.moveTo(50,90); ctx.lineTo(400,20); ctx.lineTo(750,90); ctx.lineTo(400,60); ctx.closePath();
    ctx.fill();
  }
  function drawPalaceBG(){
    drawSky('#e9d3ef','#f4e3bf');
    drawCloud(100,50,0.9); drawCloud(680,70,1);
    drawGround(330,'#c9b487');
    // palace pillars
    for(var i=0;i<5;i++){
      var x = 90+i*160;
      ctx.fillStyle='#a5372c';
      ctx.fillRect(x,150,26,180);
      ctx.fillStyle='#7c2620';
      ctx.fillRect(x,150,26,10);
    }
    // roof
    ctx.fillStyle='#2f6b52';
    ctx.beginPath();
    ctx.moveTo(40,150); ctx.lineTo(400,60); ctx.lineTo(760,150); ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#c99a2e';
    ctx.beginPath();
    ctx.moveTo(60,155); ctx.lineTo(400,75); ctx.lineTo(740,155); ctx.lineTo(400,140); ctx.closePath();
    ctx.fill();
    // steps
    ctx.fillStyle='#b7a06a';
    ctx.fillRect(250,320,300,20);
    ctx.fillRect(230,340,340,20);
  }
  function drawForestBG(){
    drawSky('#dff0e0','#f4ecc7');
    drawCloud(150,50,0.8);
    drawGround(340,'#7fae6a');
    ctx.fillStyle='#5c8b4e';
    ctx.fillRect(0,330,800,20);
  }
  function drawPrisonBG(){
    drawSky('#4a4460','#2b3a67');
    drawGround(330,'#3c3550');
    ctx.fillStyle='#241f33';
    ctx.fillRect(0,120,800,210);
  }
  function drawNightPalaceBG(){
    drawSky('#2b3a67','#5c4a6b');
    // stars
    ctx.fillStyle='#fff';
    for(var i=0;i<24;i++){
      var sx=(i*137)%800, sy=(i*79)%180+20;
      ctx.globalAlpha=0.4+0.5*Math.sin(state.animT*2+i);
      ctx.beginPath(); ctx.arc(sx,sy,1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    drawGround(330,'#54406a');
  }
  function drawHomeBG(){
    drawSky('#fdeec2','#f6d98f');
    drawCloud(140,55,1); drawCloud(600,45,0.8);
    drawGround(320,'#7fae6a');
    // hut
    ctx.fillStyle='#8a6a3f';
    ctx.fillRect(300,220,200,110);
    ctx.fillStyle='#6b4726';
    ctx.beginPath(); ctx.moveTo(270,220); ctx.lineTo(400,150); ctx.lineTo(530,220); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4a3018';
    ctx.fillRect(375,270,50,60);
  }

  function drawPerson(x,y,scale,opts){
    opts = opts||{};
    var robe = opts.robe || '#2f6b52';
    var alpha = opts.invisible ? 0.28 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0,4,26,7,0,0,Math.PI*2); ctx.fill();
    // robe
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(-22,0);
    ctx.quadraticCurveTo(-26,-55,-14,-70);
    ctx.lineTo(14,-70);
    ctx.quadraticCurveTo(26,-55,22,0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1; ctx.stroke();
    // belt
    ctx.fillStyle = opts.belt || '#c99a2e';
    ctx.fillRect(-22,-30,44,6);
    // arms
    ctx.strokeStyle = robe; ctx.lineWidth=9; ctx.lineCap='round';
    var armSwing = opts.armSwing || 0;
    ctx.beginPath(); ctx.moveTo(-16,-58); ctx.lineTo(-30+armSwing,-30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16,-58); ctx.lineTo(30-armSwing,-30); ctx.stroke();
    // head
    var faceColor = opts.face || '#f0c199';
    ctx.fillStyle = faceColor;
    ctx.beginPath(); ctx.arc(0,-84,15,0,Math.PI*2); ctx.fill();
    // hair
    ctx.fillStyle = opts.hair || '#2a1c12';
    if(opts.old){
      ctx.beginPath(); ctx.arc(0,-90,15,Math.PI,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-104,6,0,Math.PI*2); ctx.fill(); // bun
    } else {
      ctx.beginPath(); ctx.arc(0,-90,15.5,Math.PI*0.95,Math.PI*2.05); ctx.fill();
      if(opts.topknot){
        ctx.beginPath(); ctx.arc(0,-103,5,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=opts.hair; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(-10,-96); ctx.lineTo(10,-96); ctx.stroke();
      }
    }
    // face features
    ctx.fillStyle='#3a2a1c';
    ctx.beginPath(); ctx.arc(-5,-84,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-84,1.6,0,Math.PI*2); ctx.fill();
    // nose
    var noseLen = opts.noseLen || 3;
    ctx.strokeStyle='#c98a5a'; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-83); ctx.lineTo(noseLen,-80+Math.max(0,noseLen*0.05)); ctx.stroke();
    if(noseLen>10){
      ctx.beginPath(); ctx.arc(noseLen,-80,2,0,Math.PI*2); ctx.fillStyle='#c98a5a'; ctx.fill();
    }
    // mouth
    ctx.strokeStyle='#8a4a3a'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(0,-79,3,0,Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawStoneObj(x,y,s,glow){
    ctx.save();
    ctx.translate(x,y); ctx.scale(s,s);

  /* ============ HOTSPOT HELPERS ============ */
  function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }
  function canvasPos(evt){
    var rect = canvas.getBoundingClientRect();
    var cx = (evt.clientX!==undefined) ? evt.clientX : (evt.touches&&evt.touches[0].clientX);
    var cy = (evt.clientY!==undefined) ? evt.clientY : (evt.touches&&evt.touches[0].clientY);
    var scaleX = W/rect.width, scaleY = H/rect.height;
    return { x:(cx-rect.left)*scaleX, y:(cy-rect.top)*scaleY };
  }

  /* ============ RENDER LOOP ============ */
  var lastTs=0;
  function loop(ts){
    var dt = (ts-lastTs)/1000 || 0; lastTs=ts;
    state.animT += dt;
    ctx.clearRect(0,0,W,H);
    if(state.scene>=0 && state.scene<scenes.length){
      scenes[state.scene].draw();
    } else {
      drawTitleScreen();
    }
    // hold progress passive fill logic handled in pointer handlers
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function drawTitleScreen(){
    drawHomeBG();
    ctx.fillStyle='rgba(58,42,28,0.35)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff8ea';
    ctx.textAlign='center';
    ctx.font='bold 34px Georgia, serif';
    ctx.fillText(state.lang==='en' ? 'The Three Inheritance Items' : 'Tiga Benda Warisan', 400, 210);
    ctx.font='16px sans-serif';
    ctx.fillText(state.lang==='en' ? 'A Korean Folktale' : 'Cerita Rakyat Korea', 400, 245);
  }

  /* ============ SCENE FLOW ============ */
  function showAction(){
    actionBtn.style.display='inline-block';
    actionBtn.disabled=false;
  }
  function hideAction(){
    actionBtn.style.display='none';
  }

  function enterScene(idx){
    if(idx>=scenes.length){
      // shouldn't happen; clamp
      idx = scenes.length-1;
    }
    state.scene = idx;
    state.locked = false;
    hideAction();
    updateDots();
    var sdef = T().scenes[idx];
    narrationText.textContent = sdef.narr;
    instructionText.textContent = sdef.instr;
    speak(sdef.narr);
    if(scenes[idx].needsAction){
      showAction();
    }
    if(scenes[idx].final){
      replayBtn.style.display='inline-block';
      hideAction();
    } else {
      replayBtn.style.display='none';
    }
    notifyResize();
  }

  function nextScene(){
    if(state.locked) return;
    state.locked = true;
    var next = state.scene+1;
    setTimeout(function(){
      enterScene(next);
    }, 120);
  }

  function resetGame(){
    state.items={stone:false,flute:false,cloak:false};
    state.rollTaps=0;
    state.fluteDone=false;
    state.cloakOn=false; state.corridorIdx=0;
    state.appleStep=0;
    state.holding=false; state.holdVal=0;
    state.chaos=0;
    state.stoneReturned=false; state.fluteReturned=false;
    state.dragging=null;
  }

  /* ============ INPUT ============ */
  var holdTimer=null;
  function findHotspot(pos){
    if(state.scene<0) return null;
    var sc = scenes[state.scene];
    if(!sc.hotspots) return null;
    var list = sc.hotspots();
    for(var i=0;i<list.length;i++){
      var h=list[i];
      if(dist(pos.x,pos.y,h.x,h.y)<=h.r) return h.id;
    }
    return null;
  }

  canvas.addEventListener('pointerdown', function(e){
    if(state.scene<0 || state.locked) return;
    var pos = canvasPos(e);
    var sc = scenes[state.scene];
    if(sc.onDragStart){
      var id = findHotspot(pos);
      if(id){
        sc.onDragStart(id,pos);
        try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
        return;
      }
    }
    var id2 = findHotspot(pos);
    if(id2 && sc.onTap){ sc.onTap(id2); }
  });
  canvas.addEventListener('pointermove', function(e){
    if(state.scene<0) return;
    var sc = scenes[state.scene];
    if(sc.onDragMove && state.dragging){
      sc.onDragMove(canvasPos(e));
    }
  });
  window.addEventListener('pointerup', function(e){
    if(state.scene<0) return;
    var sc = scenes[state.scene];
    if(sc.onDragEnd && state.dragging){
      sc.onDragEnd(canvasPos(e));
    }
  });

  /* ============ BUTTONS ============ */
  startBtn.addEventListener('click', function(){
    startBtn.style.display='none';
    resetGame();
    enterScene(0);
  });

  actionBtn.addEventListener('click', function(){
    if(state.scene===6 && state.holdVal<1) return; // scene 7 (index6) uses hold until filled
    hideAction();
    nextScene();
  });

  // Scene 6 (index) "Menyamar" uses press-and-hold on actionBtn
  function startHold(){
    if(state.scene!==6) return;
    state.holding=true;
  }
  function endHold(){
    state.holding=false;
  }
  actionBtn.addEventListener('pointerdown', function(){
    if(state.scene===6){ startHold(); }
  });
  actionBtn.addEventListener('pointerup', endHold);
  actionBtn.addEventListener('pointerleave', endHold);
  actionBtn.addEventListener('pointercancel', endHold);

  // hold tick
  setInterval(function(){
    if(state.scene===6 && state.holding && state.holdVal<1){
      state.holdVal += 0.045;
      if(state.holdVal>=1){
        state.holdVal=1;
        state.holding=false;
        showAction();
        actionBtn.textContent = T().next;
      }
    }
  }, 60);

  replayBtn.addEventListener('click', function(){
    resetGame();
    replayBtn.style.display='none';
    enterScene(0);
  });

  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    localStorage.setItem('cts_k3_mute', state.muted ? '1':'0');
    muteBtn.textContent = state.muted ? T().mute : T().unmute;
    if(state.muted && 'speechSynthesis' in window){ speechSynthesis.cancel(); }
  });

  langBtn.addEventListener('click', function(){
    state.lang = state.lang==='id' ? 'en':'id';
    langBtn.textContent = T().langBtn;
    startBtn.textContent = T().start;
    replayBtn.textContent = T().replay;
    actionBtn.textContent = (state.scene===6) ? T().hold : T().next;
    if(state.scene>=0){
      var sdef = T().scenes[state.scene];
      narrationText.textContent = sdef.narr;
      instructionText.textContent = sdef.instr;
      speak(sdef.narr);
    }
  });

  /* ============ INIT ============ */
  function initUI(){
    buildDots();
    langBtn.textContent = T().langBtn;
    muteBtn.textContent = state.muted ? T().mute : T().unmute;
    startBtn.textContent = T().start;
    replayBtn.textContent = T().replay;
    actionBtn.textContent = T().next;
    narrationText.textContent = '';
    instructionText.textContent = state.lang==='en'
      ? 'Tap "Start Story" below to begin this Korean folktale.'
      : 'Ketuk "Mulai Cerita" di bawah untuk memulai dongeng ini.';
  }
  // update actionBtn label dynamically when entering scene 6
  var origEnter = enterScene;
  enterScene = function(idx){
    origEnter(idx);
    actionBtn.textContent = (idx===6) ? T().hold : T().next;
  };

  initUI();
  updateDots();
  notifyResize();
})();
</script>
</body>
</html>

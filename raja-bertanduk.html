<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raja Bertanduk / The Horned King</title>
<style>
  :root{
    --bg-top:#160c2e;
    --bg-bottom:#3b1f5c;
    --gold:#f0c14b;
    --gold-dark:#c9962e;
    --silhouette:#170c28;
    --parchment:#f7edd6;
    --text-dark:#2b1d0e;
    --danger:#c1483c;
    --panel:#0f0a1e;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Georgia','Times New Roman',serif;
    background:transparent;
    display:flex;
    justify-content:center;
    color:var(--parchment);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:640px;
    margin:0 auto;
    border-radius:var(--radius);
    overflow:hidden;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    position:relative;
  }
  #topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    background:rgba(0,0,0,.25);
  }
  #topbar .title{
    font-size:14px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.85;
    font-family:Georgia,serif;
  }
  #topbar .btns{display:flex;gap:8px;}
  .iconbtn{
    background:rgba(240,193,75,.12);
    border:1px solid rgba(240,193,75,.5);
    color:var(--gold);
    border-radius:20px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
    font-family:Georgia,serif;
    transition:background .15s ease;
  }
  .iconbtn:hover{background:rgba(240,193,75,.25);}
  .iconbtn:active{transform:scale(.96);}

  #stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
  }
  #stage svg{width:100%;height:100%;display:block;}
  #qte-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  #qte-layer.active{pointer-events:auto;}

  #textbox{
    background:var(--parchment);
    color:var(--text-dark);
    padding:18px 20px 14px;
  }
  #narration-text{
    margin:0 0 14px;
    font-size:16.5px;
    line-height:1.55;
    min-height:70px;
  }
  #scene-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold-dark);
    margin-bottom:6px;
    font-family:Georgia,serif;
  }
  #controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  #dots{display:flex;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#d8c79f;}
  .dot.on{background:var(--gold-dark);}
  .navbtn{
    background:var(--gold-dark);
    color:#fff;
    border:none;
    border-radius:24px;
    padding:9px 20px;
    font-size:14px;
    cursor:pointer;
    font-family:Georgia,serif;
    font-weight:bold;
  }
  .navbtn:disabled{opacity:.35;cursor:not-allowed;}
  .navbtn.ghost{
    background:transparent;
    color:var(--gold-dark);
    border:1px solid var(--gold-dark);
    padding:9px 14px;
  }

  /* Title screen */
  #titlescreen{
    position:absolute;inset:0;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:24px;
    z-index:20;
  }
  #titlescreen h1{
    font-size:32px;color:var(--gold);margin:14px 0 4px;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  #titlescreen p.sub{color:var(--parchment);opacity:.8;margin:0 0 22px;font-size:14px;letter-spacing:.04em;}
  #startBtn{
    background:var(--gold);
    color:var(--panel);
    border:none;
    padding:14px 30px;
    border-radius:30px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    font-family:Georgia,serif;
    box-shadow:0 4px 14px rgba(240,193,75,.4);
  }
  #startBtn:active{transform:scale(.97);}

  /* QTE overlay */
  .qte-panel{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:12px 16px 14px;
    background:rgba(15,10,30,.72);
    backdrop-filter:blur(2px);
    text-align:center;
  }
  .qte-instruction{color:var(--parchment);font-size:13px;margin:0 0 8px;}
  .meterWrap{
    width:100%;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:10px;
  }
  .meterFill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));width:0%;transition:width .12s linear;}
  #lockBtn{
    background:var(--gold);
    color:var(--panel);
    border:none;
    width:76px;height:76px;
    border-radius:50%;
    font-size:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(240,193,75,.45);
  }
  #lockBtn:active{transform:scale(.92);}
  .qte-timer{color:var(--gold);font-size:12px;margin-top:8px;}

  .potion{
    position:absolute;
    font-size:26px;
    cursor:pointer;
    user-select:none;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }
  .score-badge{
    position:absolute;top:8px;right:10px;
    background:rgba(0,0,0,.4);
    color:var(--gold);
    padding:4px 10px;
    border-radius:12px;
    font-size:12px;
  }

  .final-moral{
    margin-top:10px;
    padding:10px 12px;
    background:rgba(201,150,46,.12);
    border-left:3px solid var(--gold-dark);
    font-style:italic;
    font-size:14px;
    border-radius:4px;
  }
</style>
</head>
<body>
<div id="app">

  <div id="titlescreen">
    <svg width="120" height="110" viewBox="0 0 120 110">
      <path d="M60 92 L30 92 L34 60 Q60 40 86 60 L90 92 Z" fill="#170c28"/>
      <path d="M42 45 Q30 15 45 25 Q40 45 48 48 Z" fill="#170c28"/>
      <path d="M78 45 Q90 15 75 25 Q80 45 72 48 Z" fill="#170c28"/>
      <circle cx="60" cy="46" r="20" fill="#170c28"/>
      <path d="M42 34 L48 20 L54 32 L60 18 L66 32 L72 20 L78 34 Z" fill="#f0c14b"/>
    </svg>
    <h1 id="titleText">Raja Bertanduk</h1>
    <p class="sub" id="subText">Dongeng Anak dari Filipina</p>
    <button id="startBtn">🎬 Mulai Cerita</button>
  </div>

  <div id="topbar">
    <span class="title" id="topbarTitle">Raja Bertanduk</span>
    <div class="btns">
      <button class="iconbtn" id="langBtn">EN</button>
      <button class="iconbtn" id="muteBtn">🔊</button>
    </div>
  </div>

  <div id="stage">
    <div id="scene-svg"></div>
    <div id="qte-layer"></div>
  </div>

  <div id="textbox">
    <div id="scene-label"></div>
    <p id="narration-text"></p>
    <div id="controls">
      <button class="navbtn ghost" id="prevBtn">◀</button>
      <div id="dots"></div>
      <button class="navbtn" id="nextBtn">▶</button>
    </div>
  </div>
</div>

<script>
(function(){

/* ---------- language ---------- */
function getQueryLang(){
  var m = location.search.match(/[?&]lang=([a-z]{2})/i);
  return m ? m[1].toLowerCase() : 'id';
}
var lang = getQueryLang() === 'en' ? 'en' : 'id';
var muted = false;

/* ---------- content ---------- */
var UI = {
  id:{ appTitle:"Raja Bertanduk", sub:"Dongeng Anak dari Filipina", start:"🎬 Mulai Cerita",
       prev:"◀ Kembali", next:"Lanjut ▶", replay:"↺ Ulangi Cerita", skip:"Lewati" },
  en:{ appTitle:"The Horned King", sub:"A Folktale from the Philippines", start:"🎬 Start Story",
       prev:"◀ Back", next:"Next ▶", replay:"↺ Play Again", skip:"Skip" }
};

var scenes = [
  { type:"story", horn:0, art:"castle",
    label:{id:"1. Kerajaan yang Kejam", en:"1. A Cruel Kingdom"},
    text:{
      id:"Dahulu kala, di sebuah kerajaan di Filipina, hidup seorang Raja yang terkenal kejam. Ia sering memaki rakyatnya dengan kata-kata kasar.",
      en:"Once upon a time, in a kingdom in the Philippines, there lived a King known for his cruelty. He often scolded his people with harsh words."
    }},
  { type:"story", horn:0, art:"witch-meet",
    label:{id:"2. Bertemu Nenek Tua", en:"2. Meeting the Old Woman"},
    text:{
      id:"Suatu hari, saat berjalan di luar istana, Raja bertemu seorang nenek tua. Karena marah, ia memaki nenek itu tanpa belas kasihan.",
      en:"One day, while walking outside the palace, the King met an old woman. In his anger, he insulted her without mercy."
    }},
  { type:"story", horn:0, art:"curse",
    label:{id:"3. Kutukan Sang Penyihir", en:"3. The Witch's Curse"},
    text:{
      id:"Ternyata nenek itu seorang penyihir. \u201cKata-katamu hanya pantas diucapkan seekor binatang!\u201d serunya, lalu ia menghilang meninggalkan sebuah kutukan.",
      en:"The old woman was secretly a witch. \u201cYour words belong to a beast, not a king!\u201d she cried, then vanished, leaving behind a curse."
    }},
  { type:"story", horn:14, art:"walk-home",
    label:{id:"4. Pulang dengan Amarah", en:"4. Walking Home Angry"},
    text:{
      id:"Raja pulang sambil terus mengomel. Tanpa disadarinya, sepasang tanduk mulai tumbuh perlahan di kepalanya.",
      en:"The King stomped home, still grumbling. Without realizing it, a pair of horns slowly began to grow on his head."
    }},
  { type:"story", horn:26, art:"discover",
    label:{id:"5. Tanduk di Kepala Raja", en:"5. Horns on the King's Head"},
    text:{
      id:"Sesampainya di istana, Raja terkejut melihat tanduk di kepalanya! Ia segera memanggil tukang cukur istana dan mengancamnya agar merahasiakan hal ini.",
      en:"Back at the palace, the King was shocked to see horns on his head! He summoned the royal barber and threatened him to keep it secret."
    }},
  { type:"qte-secret", horn:26, art:"barber",
    label:{id:"Mini Game: Jaga Rahasia!", en:"Mini Game: Keep the Secret!"},
    text:{
      id:"Bantu tukang cukur menahan rahasia! Ketuk gembok sebanyak mungkin sebelum waktu habis.",
      en:"Help the barber hold the secret! Tap the lock as many times as you can before time runs out."
    }},
  { type:"story", horn:34, art:"rumor",
    label:{id:"6. Kabar yang Menyebar", en:"6. The Rumor Spreads"},
    text:{
      id:"Namun waktu berlalu, tukang cukur tanpa sengaja membisikkan rahasia itu kepada seorang pejabat. Kabar tanduk Raja pun menyebar ke seluruh kerajaan!",
      en:"But as time passed, the barber accidentally whispered the secret to a palace official. News of the King's horns spread across the whole kingdom!"
    }},
  { type:"story", horn:52, art:"long-horns",
    label:{id:"7. Segala Cara Dicoba", en:"7. Every Cure Attempted"},
    text:{
      id:"Tanduk Raja semakin panjang hingga hampir menutupi wajahnya. Ia mencoba segala macam obat, namun tak satu pun berhasil.",
      en:"The King's horns grew longer and longer, almost covering his face. He tried every remedy he could find, but nothing worked."
    }},
  { type:"qte-potion", horn:52, art:"remedies",
    label:{id:"Mini Game: Coba Obat!", en:"Mini Game: Try the Remedies!"},
    text:{
      id:"Ketuk ramuan yang jatuh untuk mencobanya! Sayangnya, tak satu pun bisa menghilangkan tanduk Raja...",
      en:"Tap the falling potions to try them! Sadly, none of them can remove the King's horns..."
    }},
  { type:"story", horn:60, art:"forest-leave",
    label:{id:"8. Pergi ke Hutan", en:"8. Leaving for the Forest"},
    text:{
      id:"Karena tak sanggup menanggung malu, pada suatu malam Raja pergi meninggalkan istana bersama permaisurinya, menuju hutan yang sunyi.",
      en:"Unable to bear the shame any longer, one night the King left the palace with his queen, heading into the quiet forest."
    }},
  { type:"end", horn:60, art:"forest-end",
    label:{id:"Tamat", en:"The End"},
    text:{
      id:"Di hutan, jauh dari tahta dan rakyatnya, Raja hidup tenang sambil merenungi semua perbuatannya.",
      en:"In the forest, far from his throne and his people, the King lived quietly, reflecting on all he had done."
    },
    moral:{
      id:"Pesan cerita: kata-kata kasar dapat membawa akibat panjang \u2014 sepanjang tanduk di kepala sang Raja.",
      en:"Moral: harsh words can bring long consequences \u2014 as long as the horns upon the King's head."
    }}
];

var idx = 0;
var started = false;

/* ---------- SVG art helpers (silhouette style) ---------- */
function sky(){
  return '<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#20123f"/><stop offset="1" stop-color="#4a2a70"/>'+
    '</linearGradient></defs><rect width="800" height="450" fill="url(#skyg)"/>'+
    '<circle cx="670" cy="90" r="42" fill="#f7edd6" opacity="0.9"/>'+
    '<circle cx="655" cy="80" r="42" fill="#20123f" opacity="0.55"/>';
}
function ground(){ return '<rect x="0" y="380" width="800" height="70" fill="#0f0a1e"/>'; }
function castle(){
  return '<g fill="#170c28">'+
    '<rect x="60" y="230" width="680" height="150" />'+
    '<rect x="90" y="150" width="70" height="230"/><polygon points="90,150 125,110 160,150"/>'+
    '<rect x="640" y="150" width="70" height="230"/><polygon points="640,150 675,110 710,150"/>'+
    '<rect x="360" y="120" width="80" height="260"/><polygon points="360,120 400,80 440,120"/>'+
    '<rect x="380" y="330" width="40" height="50" fill="#0f0a1e"/>'+
    '</g>';
}
function forest(dark){
  var trees='';
  var xs=[40,110,180,250,560,630,700,760];
  for(var i=0;i<xs.length;i++){
    var h=90+ (i%3)*30, x=xs[i];
    trees+='<polygon points="'+x+',380 '+(x-38)+',380 '+x+','+(380-h)+'" fill="#170c28"/>';
    trees+='<polygon points="'+x+',350 '+(x-30)+',350 '+x+','+(350-h*0.7)+'" fill="#170c28"/>';
  }
  return trees;
}
function king(cx,cy,scale,horn,mood){
  scale = scale||1;
  var s='<g transform="translate('+cx+','+cy+') scale('+scale+')" fill="#170c28">';
  // robe
  s+='<path d="M-34 90 L-44 10 Q0 -14 44 10 L34 90 Z"/>';
  // arms
  s+='<path d="M-34 20 Q-54 40 -46 62" stroke="#170c28" stroke-width="10" fill="none" stroke-linecap="round"/>';
  s+='<path d="M34 20 Q54 40 46 62" stroke="#170c28" stroke-width="10" fill="none" stroke-linecap="round"/>';
  // head
  s+='<circle cx="0" cy="-18" r="26"/>';
  // horns (curled), length driven by "horn" 0..60
  var h = horn;
  if(h>0){
    s+='<path d="M-14 -38 Q'+(-20-h*0.5)+' '+(-40-h*0.9)+' '+(-6-h*0.25)+' '+(-46-h*0.6)+'" stroke="#c9962e" stroke-width="7" fill="none" stroke-linecap="round"/>';
    s+='<path d="M14 -38 Q'+(20+h*0.5)+' '+(-40-h*0.9)+' '+(6+h*0.25)+' '+(-46-h*0.6)+'" stroke="#c9962e" stroke-width="7" fill="none" stroke-linecap="round"/>';
  }
  // crown
  s+='<path d="M-18 -34 L-13 -46 L-6 -36 L0 -48 L6 -36 L13 -46 L18 -34 Z" fill="#f0c14b"/>';
  s+='</g>';
  return s;
}
function witch(cx,cy){
  return '<g transform="translate('+cx+','+cy+')" fill="#170c28">'+
    '<path d="M-30 90 L-36 20 Q0 0 36 20 L30 90 Z"/>'+
    '<circle cx="0" cy="-4" r="20"/>'+
    '<polygon points="-22,-16 0,-64 22,-16"/>'+
    '<path d="M-8 -70 q8 -8 16 0" stroke="#170c28" stroke-width="4" fill="none"/>'+
    '</g>';
}
function barber(cx,cy){
  return '<g transform="translate('+cx+','+cy+')" fill="#170c28">'+
    '<path d="M-26 84 L-30 20 Q0 4 30 20 L26 84 Z"/>'+
    '<circle cx="0" cy="-6" r="18"/>'+
    '<rect x="16" y="6" width="22" height="6" rx="2" fill="#c9962e" transform="rotate(30 16 6)"/>'+
    '</g>';
}
function crowd(){
  var s='<g fill="#170c28">';
  var xs=[120,180,240,560,620,680];
  for(var i=0;i<xs.length;i++){
    var x=xs[i], y=360;
    s+='<circle cx="'+x+'" cy="'+(y-24)+'" r="10"/><path d="M'+(x-10)+' '+y+' L'+(x-12)+' '+(y-24)+' Q'+x+' '+(y-34)+' '+(x+12)+' '+(y-24)+' L'+(x+10)+' '+y+' Z"/>';
  }
  s+='</g>';
  // speech bubbles
  s+='<g fill="#f0c14b" opacity="0.85">'+
     '<ellipse cx="180" cy="300" rx="20" ry="13"/><ellipse cx="620" cy="300" rx="20" ry="13"/>'+
     '</g>';
  return s;
}

function sceneArt(s){
  var svg = '<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">';
  svg += sky();
  switch(s.art){
    case "castle":
      svg += ground()+castle()+king(220,300,1.1,s.horn);
      break;
    case "witch-meet":
      svg += ground()+forest()+king(280,300,1.05,s.horn)+witch(500,300);
      break;
    case "curse":
      svg += ground()+forest()+king(280,300,1.05,s.horn)+witch(500,300)+
             '<g fill="#c1483c" opacity="0.55"><circle cx="500" cy="220" r="70"/></g>';
      break;
    case "walk-home":
      svg += ground()+forest()+king(400,300,1.15,s.horn);
      break;
    case "discover":
      svg += ground()+castle()+king(400,300,1.2,s.horn);
      break;
    case "barber":
      svg += ground()+castle()+king(280,300,1.1,s.horn)+barber(520,310);
      break;
    case "rumor":
      svg += ground()+castle()+crowd()+king(400,150,0.7,s.horn);
      break;
    case "long-horns":
      svg += ground()+castle()+king(400,300,1.25,s.horn);
      break;
    case "remedies":
      svg += ground()+castle()+king(400,320,1.2,s.horn);
      break;
    case "forest-leave":
      svg += ground()+forest(true)+king(340,300,1.05,s.horn)+
             '<g fill="#170c28"><path d="M420 90 L410 10 Q450 -10 490 10 L480 90 Z"/><circle cx="450" cy="0" r="20"/></g>';
      break;
    case "forest-end":
      svg += ground()+forest(true)+king(400,320,1.15,s.horn);
      break;
  }
  svg += '</svg>';
  return svg;
}

/* ---------- narration (Web Speech API) ---------- */
function speak(text){
  if(muted || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'en' ? 'en-US' : 'id-ID';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}
function stopSpeak(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }

/* ---------- resize messaging for iframe embed ---------- */
function sendHeight(){
  try{
    var h = document.getElementById('app').getBoundingClientRect().height;
    window.parent.postMessage({ type:'resize', slug:'raja-bertanduk', height: Math.ceil(h) }, '*');
  }catch(e){}
}

/* ---------- rendering ---------- */
var els = {
  sceneSvg: document.getElementById('scene-svg'),
  qteLayer: document.getElementById('qte-layer'),
  label: document.getElementById('scene-label'),
  text: document.getElementById('narration-text'),
  dots: document.getElementById('dots'),
  prev: document.getElementById('prevBtn'),
  next: document.getElementById('nextBtn'),
  langBtn: document.getElementById('langBtn'),
  muteBtn: document.getElementById('muteBtn'),
  titlescreen: document.getElementById('titlescreen'),
  startBtn: document.getElementById('startBtn'),
  titleText: document.getElementById('titleText'),
  subText: document.getElementById('subText'),
  topbarTitle: document.getElementById('topbarTitle')
};

function buildDots(){
  els.dots.innerHTML='';
  scenes.forEach(function(_,i){
    var d=document.createElement('div');
    d.className='dot'+(i===idx?' on':'');
    els.dots.appendChild(d);
  });
}

var qteTimer = null;
var qteActive = false;

function clearQte(){
  els.qteLayer.innerHTML='';
  els.qteLayer.classList.remove('active');
  if(qteTimer){ clearInterval(qteTimer); qteTimer=null; }
  qteActive=false;
  els.next.disabled=false;
}

function renderScene(){
  clearQte();
  var s = scenes[idx];
  els.sceneSvg.innerHTML = sceneArt(s);
  els.label.textContent = s.label[lang];
  els.text.textContent = s.text[lang];
  buildDots();
  els.prev.disabled = idx===0;
  els.next.textContent = (idx===scenes.length-1) ? UI[lang].replay : UI[lang].next;

  if(s.type==='qte-secret') startSecretQte();
  if(s.type==='qte-potion') startPotionQte();

  speak(s.text[lang]);
  requestAnimationFrame(sendHeight);
  setTimeout(sendHeight,150);
}

/* --- QTE 1: Jaga Rahasia (mash lock) --- */
function startSecretQte(){
  qteActive=true;
  els.qteLayer.classList.add('active');
  els.next.disabled = true;
  var meter = 0, timeLeft = 6.0;
  var panel = document.createElement('div');
  panel.className='qte-panel';
  panel.innerHTML =
    '<div class="qte-instruction"></div>'+
    '<div class="meterWrap"><div class="meterFill" id="meterFill"></div></div>'+
    '<button id="lockBtn">\uD83D\uDD12</button>'+
    '<div class="qte-timer" id="qteTimerText"></div>';
  els.qteLayer.appendChild(panel);
  panel.querySelector('.qte-instruction').textContent = scenes[idx].text[lang];

  var fill = panel.querySelector('#meterFill');
  var timerText = panel.querySelector('#qteTimerText');
  var lockBtn = panel.querySelector('#lockBtn');

  function tick(){
    timeLeft -= 0.1;
    meter = Math.max(0, meter - 1.2);
    fill.style.width = Math.min(100,meter)+'%';
    timerText.textContent = (lang==='en'?'Time: ':'Waktu: ') + Math.max(0,timeLeft).toFixed(1)+'s';
    if(timeLeft<=0){
      clearInterval(qteTimer); qteTimer=null; qteActive=false;
      panel.remove();
      els.qteLayer.classList.remove('active');
      els.next.disabled=false;
      var msg = meter>60
        ? (lang==='en' ? "The barber held the secret bravely for a while..." : "Tukang cukur berhasil menahan rahasia cukup lama...")
        : (lang==='en' ? "The secret was hard to keep..." : "Rahasia itu ternyata sulit ditahan...");
      els.text.textContent = scenes[idx].text[lang] + '  ' + msg;
      setTimeout(sendHeight,50);
    }
  }
  qteTimer = setInterval(tick,100);

  function mash(e){
    e.preventDefault();
    meter = Math.min(100, meter+10);
    fill.style.width = meter+'%';
    lockBtn.style.transform='scale(0.9)';
    setTimeout(function(){lockBtn.style.transform='';},80);
  }
  lockBtn.addEventListener('click',mash);
  lockBtn.addEventListener('touchstart',mash);
  setTimeout(sendHeight,50);
}

/* --- QTE 2: Coba Obat (catch falling potions) --- */
function startPotionQte(){
  qteActive=true;
  els.qteLayer.classList.add('active');
  els.next.disabled = true;
  var score=0, timeLeft=6.0;
  var emojis=['\uD83E\uDDEA','\uD83C\uDF3F','\uD83C\uDF6F'];
  var panel = document.createElement('div');
  panel.className='qte-panel';
  panel.style.background='transparent';
  panel.style.pointerEvents='none';
  panel.innerHTML = '<div class="score-badge" id="scoreBadge"></div>';
  els.qteLayer.appendChild(panel);
  var scoreBadge = panel.querySelector('#scoreBadge');
  function updateScore(){
    scoreBadge.textContent = (lang==='en'?'Tried: ':'Dicoba: ')+score;
  }
  updateScore();
  scoreBadge.style.pointerEvents='none';

  var spawnTimer = setInterval(function(){
    var el = document.createElement('div');
    el.className='potion';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    var xPct = 10+Math.random()*80;
    el.style.left = xPct+'%';
    el.style.top = '-30px';
    el.style.pointerEvents='auto';
    els.qteLayer.appendChild(el);
    var pos=-30;
    var fall = setInterval(function(){
      pos += 6;
      el.style.top = pos+'px';
      if(pos>380){ clearInterval(fall); el.remove(); }
    },40);
    el.addEventListener('click',function(){
      score++; updateScore();
      clearInterval(fall);
      el.remove();
    });
  },700);

  var timerText = document.createElement('div');
  timerText.className='qte-timer';
  timerText.style.position='absolute';
  timerText.style.top='8px'; timerText.style.left='10px';
  timerText.style.background='rgba(0,0,0,.4)';
  timerText.style.padding='4px 10px';
  timerText.style.borderRadius='12px';
  els.qteLayer.appendChild(timerText);

  qteTimer = setInterval(function(){
    timeLeft -= 0.1;
    timerText.textContent = (lang==='en'?'Time: ':'Waktu: ')+Math.max(0,timeLeft).toFixed(1)+'s';
    if(timeLeft<=0){
      clearInterval(qteTimer); qteTimer=null;
      clearInterval(spawnTimer);
      qteActive=false;
      els.qteLayer.innerHTML='';
      els.qteLayer.classList.remove('active');
      els.next.disabled=false;
      var msg = (lang==='en')
        ? "None of the "+score+" remedies worked..."
        : "Semua "+score+" ramuan yang dicoba tak ada yang berhasil...";
      els.text.textContent = scenes[idx].text[lang] + '  ' + msg;
      setTimeout(sendHeight,50);
    }
  },100);
  setTimeout(sendHeight,50);
}

/* ---------- ending extras ---------- */
function maybeShowMoral(){
  var s = scenes[idx];
  if(s.type==='end'){
    var box = document.createElement('div');
    box.className='final-moral';
    box.textContent = s.moral[lang];
    els.text.parentNode.insertBefore(box, els.text.nextSibling);
    setTimeout(sendHeight,60);
  }
}

var origRenderScene = renderScene;
renderScene = function(){
  origRenderScene();
  maybeShowMoral();
};

/* ---------- navigation ---------- */
els.prev.addEventListener('click', function(){
  if(idx>0){ idx--; renderScene(); }
});
els.next.addEventListener('click', function(){
  if(qteActive) return;
  if(idx < scenes.length-1){ idx++; renderScene(); }
  else { idx=0; renderScene(); }
});

/* ---------- lang & mute ---------- */
function applyLangUI(){
  els.langBtn.textContent = lang==='id' ? 'EN' : 'ID';
  els.titleText.textContent = UI[lang].appTitle;
  els.subText.textContent = UI[lang].sub;
  els.topbarTitle.textContent = UI[lang].appTitle;
  els.startBtn.textContent = UI[lang].start;
  els.prev.textContent = '\u25C0';
  if(started) renderScene();
}
els.langBtn.addEventListener('click', function(){
  lang = lang==='id' ? 'en' : 'id';
  applyLangUI();
});
els.muteBtn.addEventListener('click', function(){
  muted = !muted;
  els.muteBtn.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
  if(muted) stopSpeak(); else if(started) speak(scenes[idx].text[lang]);
});

els.startBtn.addEventListener('click', function(){
  started = true;
  els.titlescreen.style.display='none';
  renderScene();
});

/* ---------- init ---------- */
applyLangUI();
window.addEventListener('resize', function(){ setTimeout(sendHeight,50); });
window.addEventListener('load', sendHeight);
document.getElementById('app').addEventListener('click', function(){ sendHeight(); }, {capture:true});

})();
</script>
</body>
</html>

<style>
  :root{
    --bg-deep:#231409;
    --bg-panel:#2e1c0f;
    --wood:#8a5a2b;
    --wood-dark:#5c3a1a;
    --gold:#d4a94b;
    --gold-soft:#e8cf8a;
    --cream:#f6ecd8;
    --ulos-red:#8c2a3a;
    --ulos-black:#191008;
    --ulos-white:#efe4cd;
    --shadow: rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg-deep);
    font-family:'Work Sans',sans-serif;
    color:var(--cream);
    overflow-x:hidden;
  }
  #stageWrap{
    max-width:960px;
    margin:0 auto;
    position:relative;
    background:var(--bg-panel);
    border:2px solid var(--wood-dark);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px var(--shadow);
  }
  #stage{
    position:relative;
    width:100%;
    aspect-ratio: 960 / 620;
  }
  canvas#gameCanvas{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    display:block;
  }
  #overlay{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;
  }
  #overlay .clickable{ pointer-events:auto; }

  /* Top bar */
  #topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 10px;
    z-index:20;
    pointer-events:none;
  }
  .pillbtn{
    pointer-events:auto;
    background:rgba(25,16,8,0.72);
    border:1.5px solid var(--gold);
    color:var(--gold-soft);
    font-family:'Work Sans',sans-serif;
    font-size:clamp(11px,1.6vw,13px);
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    transition:background .15s ease, transform .15s ease;
    user-select:none;
  }
  .pillbtn:hover{ background:rgba(140,42,58,0.55); transform:translateY(-1px); }
  .pillbtn:active{ transform:translateY(0px) scale(0.97); }
  #topbarRight{ display:flex; gap:8px; pointer-events:none;}

  /* Caption / narration panel */
  #captionBox{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:10px 14px 12px 14px;
    background:linear-gradient(180deg, rgba(35,20,9,0) 0%, rgba(21,12,5,0.92) 32%, rgba(21,12,5,0.96) 100%);
    z-index:15;
    pointer-events:none;
  }
  #captionTitle{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:clamp(14px,2.4vw,20px);
    color:var(--gold-soft);
    margin:0 0 4px 0;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  #captionText{
    margin:0;
    font-size:clamp(12px,1.9vw,15px);
    line-height:1.45;
    max-width:820px;
    text-shadow:0 1px 4px rgba(0,0,0,0.7);
  }
  #hintText{
    margin-top:6px;
    font-size:clamp(11px,1.6vw,13px);
    color:var(--gold);
    font-style:italic;
    opacity:0.9;
  }
  #footerRow{
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
    margin-top:8px;
    pointer-events:auto;
  }
  #progressDots{ display:flex; gap:5px; }
  .dot{ width:7px;height:7px;border-radius:50%;background:rgba(246,236,216,0.28); }
  .dot.active{ background:var(--gold); }
  .dot.done{ background:var(--ulos-red); }

  button.storybtn{
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:clamp(12px,1.9vw,14px);
    background:linear-gradient(180deg, var(--ulos-red), #6e1f2c);
    color:var(--cream);
    border:1px solid rgba(255,255,255,0.15);
    padding:9px 20px;
    border-radius:9px;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.35);
    white-space:nowrap;
  }
  button.storybtn:hover{ filter:brightness(1.1); }
  button.storybtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.35); }
  button.storybtn.secondary{
    background:linear-gradient(180deg,#4a3115,#2e1c0f);
  }
  button.storybtn:disabled{ opacity:0.4; cursor:default; }

  /* QTE glowing target dots */
  .qte-target{
    position:absolute;
    width:9%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3cf, var(--gold) 55%, #a5771f 100%);
    box-shadow:0 0 14px 4px rgba(212,169,75,0.75), 0 0 0 2px rgba(255,255,255,0.4) inset;
    cursor:pointer;
    pointer-events:auto;
    animation: pulseTarget 1.3s ease-in-out infinite;
    transform:translate(-50%,-50%);
    z-index:12;
  }
  .qte-target.collected{
    animation:none;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
  }
  @keyframes pulseTarget{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.35); }
  }

  /* Drag chips */
  .drag-chip{
    position:absolute;
    pointer-events:auto;
    background:rgba(25,16,8,0.85);
    border:2px solid var(--gold);
    color:var(--cream);
    border-radius:10px;
    padding:7px 10px;
    font-size:clamp(11px,1.7vw,13px);
    font-weight:600;
    text-align:center;
    cursor:grab;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    z-index:18;
    touch-action:none;
    user-select:none;
    transition:box-shadow .15s ease;
  }
  .drag-chip.dragging{ cursor:grabbing; box-shadow:0 8px 22px rgba(0,0,0,0.55); z-index:30; }
  .drop-slot{
    position:absolute;
    pointer-events:none;
    border:2.5px dashed rgba(246,236,216,0.55);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-size:clamp(10px,1.5vw,12px);
    color:rgba(246,236,216,0.75);
    padding:4px;
    z-index:10;
  }
  .drop-slot.filled{ border-style:solid; border-color:var(--gold); color:var(--gold-soft); }
  .drop-slot.wobble{ animation:wobble .4s ease; }
  @keyframes wobble{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  /* Start / End screens */
  .fullscreenPanel{
    position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:6% 8%;
    z-index:25;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(140,42,58,0.25), transparent 60%),
      linear-gradient(180deg, #1c1108, #2e1c0f 60%, #1c1108);
    pointer-events:auto;
  }
  .fullscreenPanel h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(24px,5vw,42px);
    color:var(--gold-soft);
    margin:0 0 6px 0;
    text-shadow:0 3px 10px rgba(0,0,0,0.6);
  }
  .fullscreenPanel h2{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(13px,2.3vw,17px);
    color:var(--gold);
    margin:0 0 18px 0;
    font-style:italic;
    opacity:0.9;
  }
  .fullscreenPanel p{
    max-width:520px;
    font-size:clamp(12px,2vw,15px);
    line-height:1.6;
    margin:0 0 20px 0;
    color:var(--cream);
  }
  .ulos-strip{
    width:80%;
    max-width:420px;
    height:14px;
    margin:14px 0 22px 0;
    background:repeating-linear-gradient(45deg,
      var(--ulos-red) 0 10px,
      var(--ulos-black) 10px 20px,
      var(--ulos-white) 20px 30px,
      var(--ulos-black) 30px 40px);
    border-radius:3px;
    opacity:0.9;
  }
  .startbtns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  /* small language / mute toggles inside start screen */
  .miniToggles{ display:flex; gap:10px; margin-bottom:6px; }

  #loadingNote{
    font-size:11px;
    color:rgba(246,236,216,0.5);
    margin-top:14px;
  }

  @media (max-width:480px){
    .drag-chip{ font-size:10px; padding:5px 7px; }
  }
</style>
</head>

</div>

  function T(){ return STR[lang]; }

  /* ============== SPEECH ============== */
  function loadVoices(){
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if(window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(targetLang){
    var wanted = targetLang === 'id' ? 'id' : 'en';
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(wanted) === 0) return voices[i];
    }
    return null;
  }
  function speak(text){
    if(!window.speechSynthesis || muted || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'id' ? 'id-ID' : 'en-US';
    var v = pickVoice(lang);
    if(v) u.voice = v;
    u.rate = 0.95;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }
  function stopSpeech(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
  }

  /* ============== CANVAS HELPERS ============== */
  var W = 960, H = 620;

  function grad(x0,y0,x1,y1,stops){
    var g = ctx.createLinearGradient(x0,y0,x1,y1);
    stops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
    return g;
  }

  function drawUlosBorder(){
    var stripH = 16;
    var colors = ['#8c2a3a','#191008','#efe4cd','#191008'];
    var segW = 24;
    for(var y=0; y<2; y++){
      var yy = y===0 ? 0 : H-stripH;
      for(var x=0; x*segW < W; x++){
        ctx.fillStyle = colors[x % colors.length];
        ctx.fillRect(x*segW, yy, segW, stripH);
      }
    }
  }

  function drawSky(topColor, bottomColor){
    ctx.fillStyle = grad(0,0,0,H,[[0,topColor],[1,bottomColor]]);
    ctx.fillRect(0,0,W,H);
  }

  function drawGround(color, y){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.quadraticCurveTo(W/2, y-18, W, y);
    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();
  }

  function drawTree(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#3b2b12';
    ctx.fillRect(-6,-10,12,50);
    ctx.fillStyle = '#3e6b2e';
    ctx.beginPath();
    ctx.ellipse(0,-40,42,50,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#4d7f39';
    ctx.beginPath();
    ctx.ellipse(-14,-58,28,32,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawHut(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#6b4423';
    ctx.fillRect(-60,-10,120,70);
    ctx.fillStyle = '#3a2412';
    ctx.beginPath();
    ctx.moveTo(-75,-10);
    ctx.lineTo(0,-70);
    ctx.lineTo(75,-10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8c2a3a';
    ctx.beginPath();
    ctx.moveTo(-75,-10);
    ctx.lineTo(0,-70);
    ctx.lineTo(75,-10);
    ctx.lineTo(60,-6);
    ctx.lineTo(0,-58);
    ctx.lineTo(-60,-6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2a1a0c';
    ctx.fillRect(-14,20,28,40);
    ctx.restore();
  }

  // Simple person figure. color = clothing color, skin optional, headwear optional string
  function drawPerson(x,y,opts){
    opts = opts || {};
    var scale = opts.scale || 1;
    var cloth = opts.cloth || '#8a5a2b';
    var skin = opts.skin || '#c98a52';
    var hair = opts.hair || '#241708';
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // legs
    ctx.fillStyle = '#2a1a0c';
    ctx.fillRect(-10,40,8,26);
    ctx.fillRect(2,40,8,26);
    // body/robe
    ctx.fillStyle = cloth;
    ctx.beginPath();
    ctx.moveTo(-18,10);
    ctx.lineTo(18,10);
    ctx.lineTo(14,46);
    ctx.lineTo(-14,46);
    ctx.closePath();
    ctx.fill();
    // arms
    ctx.strokeStyle = cloth;
    ctx.lineWidth = 7;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-15,16); ctx.lineTo(-24, opts.armUp ? -4 : 32);
    ctx.moveTo(15,16); ctx.lineTo(24, opts.armUp2 ? -4 : 32);
    ctx.stroke();
    // head
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0,-4,15,0,Math.PI*2);
    ctx.fill();
    // hair
    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.arc(0,-9,15.5,Math.PI, Math.PI*2);
    ctx.fill();
    if(opts.headwear === 'ulos'){
      ctx.fillStyle = '#8c2a3a';
      ctx.fillRect(-15,-16,30,7);
    } else if(opts.headwear === 'crown'){
      ctx.fillStyle = '#d4a94b';
      ctx.beginPath();
      ctx.moveTo(-13,-16); ctx.lineTo(-13,-24); ctx.lineTo(-4,-16);
      ctx.lineTo(0,-26); ctx.lineTo(4,-16); ctx.lineTo(13,-24); ctx.lineTo(13,-16);
      ctx.closePath(); ctx.fill();
    }
    // simple face
    ctx.fillStyle = '#241708';
    ctx.beginPath();
    ctx.arc(-5,-5,1.6,0,Math.PI*2);
    ctx.arc(5,-5,1.6,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawStatue(x,y,opts){
    opts = opts || {};
    var scale = opts.scale || 1;
    var human = opts.human || 0; // 0..1 morph amount to human skin tone
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    var woodColor = '#a9793f';
    var skinColor = '#e8b98a';
    function mix(c1,c2,t){
      function hex2rgb(c){ c=c.replace('#',''); return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]; }
      var a = hex2rgb(c1), b = hex2rgb(c2);
      var r = Math.round(a[0]+(b[0]-a[0])*t);
      var g = Math.round(a[1]+(b[1]-a[1])*t);
      var bl = Math.round(a[2]+(b[2]-a[2])*t);
      return 'rgb('+r+','+g+','+bl+')';
    }
    var bodyColor = mix(woodColor, skinColor, human);
    // pedestal (fades out as human)
    ctx.globalAlpha = 1-human*0.6;
    ctx.fillStyle = '#5c3a1a';
    ctx.fillRect(-22,58,44,10);
    ctx.globalAlpha = 1;
    // legs
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-11,20,9,40);
    ctx.fillRect(2,20,9,40);
    // dress/cloth (appears more once dressed)
    if(opts.dressed){
      ctx.fillStyle = opts.dressColor || '#8c2a3a';
      ctx.beginPath();
      ctx.moveTo(-16,-6);
      ctx.lineTo(16,-6);
      ctx.lineTo(13,34);
      ctx.lineTo(-13,34);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(-16,-6);
      ctx.lineTo(16,-6);
      ctx.lineTo(13,34);
      ctx.lineTo(-13,34);
      ctx.closePath();
      ctx.fill();
      // carving lines
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      for(var i=-10;i<=10;i+=5){
        ctx.beginPath(); ctx.moveTo(i,-6); ctx.lineTo(i*0.8, 30); ctx.stroke();
      }
    }
    // jewelry
    if(opts.jewelry){
      ctx.strokeStyle = '#d4a94b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0,-2,15,0.15*Math.PI,0.85*Math.PI);
      ctx.stroke();
    }
    // arms
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14,0); ctx.lineTo(-20,26);
    ctx.moveTo(14,0); ctx.lineTo(20,26);
    ctx.stroke();
    // head
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(0,-16,15,0,Math.PI*2);
    ctx.fill();
    // hair (once human)
    if(human > 0.4){
      ctx.fillStyle = '#241708';
      ctx.globalAlpha = Math.min(1,(human-0.4)/0.6);
      ctx.beginPath();
      ctx.arc(0,-21,15.5,Math.PI,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // glow when transforming
    if(opts.glow){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(0,-6,5,0,-6,70);
      g.addColorStop(0,'rgba(255,236,180,0.55)');
      g.addColorStop(1,'rgba(255,236,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0,-6,70,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawStars(seedCount, tOffset){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for(var i=0;i<seedCount;i++){
      var sx = (i*97 + 31) % W;
      var sy = (i*53 + 17) % 200;
      var tw = 0.5 + 0.5*Math.sin((tOffset||0)*0.002 + i);
      ctx.globalAlpha = 0.3 + 0.5*tw;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLakeAndSamosir(){
    drawSky('#a9d4e0','#dff0e4');
    ctx.fillStyle = '#2e6d8a';
    ctx.beginPath();
    ctx.ellipse(W/2, H-120, 470, 140, 0, 0, Math.PI*2);
    ctx.fill();
    // island
    ctx.fillStyle = '#4d7f39';
    ctx.beginPath();
    ctx.ellipse(W/2+40, H-150, 130, 55, 0, 0, Math.PI*2);
    ctx.fill();
    drawTree(W/2-10,H-170,0.7);
    drawTree(W/2+70,H-180,0.9);
    drawTree(W/2+130,H-165,0.6);
  }

  var raf = null;
  function stopAnim(){ if(raf){ cancelAnimationFrame(raf); raf = null; } }

  function clearOverlaySceneLayer(){
    sceneLayer.innerHTML = '';
  }

  function pct(v, total){ return (v/total*100) + '%'; }

  function setCaption(sceneObj, showHint){

  function setCtrlButton(label, onClick, secondary, disabled){
    ctrlButtons.innerHTML = '';
    if(!label) return;
    var b = document.createElement('button');
    b.className = 'storybtn' + (secondary ? ' secondary' : '');
    b.textContent = label;

    b.addEventListener('click', onClick);

  function addQteTargets(count, onAllDone){
    clearOverlaySceneLayer();
    var remaining = count;
    var positions = [];
    var tries = 0;
    while(positions.length < count && tries < 500){
      tries++;
      var px = 12 + Math.random()*76;
      var py = 14 + Math.random()*55;
      var ok = true;
      for(var i=0;i<positions.length;i++){
        var dx = positions[i][0]-px, dy = positions[i][1]-py;
        if(Math.sqrt(dx*dx+dy*dy) < 16) ok = false;
      }
      if(ok) positions.push([px,py]);
    }
    positions.forEach(function(pos){
      var t = document.createElement('div');
      t.className = 'qte-target clickable';
      t.style.left = pos[0] + '%';
      t.style.top = pos[1] + '%';
      t.addEventListener('click', function(){
        if(t.classList.contains('collected')) return;
        t.classList.add('collected');
        remaining--;
        if(remaining <= 0){
          setTimeout(onAllDone, 250);
        }
      });
      sceneLayer.appendChild(t);
    });
  }

  function addDragMatch(chipLabels, roleLabels, correctMap, onAllDone){
    // correctMap: array index i -> role index it belongs to
    clearOverlaySceneLayer();
    var slotPositions = [ [50,20], [50,45], [50,70] ]; // percent x,y for role slots (right side)
    var chipStartPositions = [ [15,25],[15,48],[15,71] ];
    var filledCount = 0;
    var slots = [];

    roleLabels.forEach(function(rl, i){
      var s = document.createElement('div');
      s.className = 'drop-slot';
      s.style.left = '68%';
      s.style.top = (18 + i*27) + '%';
      s.style.width = '27%';
      s.style.height = '18%';
      s.dataset.role = i;
      s.textContent = rl;
      sceneLayer.appendChild(s);
      slots.push(s);
    });

    chipLabels.forEach(function(cl, i){
      var chip = document.createElement('div');
      chip.className = 'drag-chip clickable';
      chip.textContent = cl;
      chip.style.left = '8%';
      chip.style.top = (18 + i*27) + '%';
      chip.style.width = '22%';
      chip.dataset.role = correctMap[i];
      chip.dataset.placed = '0';
      sceneLayer.appendChild(chip);

      var dragging = false, startX, startY, origLeft, origTop;

      function toPercentPos(clientX, clientY){
        var rect = sceneLayer.getBoundingClientRect();
        return {
          x: (clientX - rect.left) / rect.width * 100,
          y: (clientY - rect.top) / rect.height * 100
        };
      }

      chip.addEventListener('pointerdown', function(e){
        if(chip.dataset.placed === '1') return;
        dragging = true;
        chip.classList.add('dragging');
        chip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      chip.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var p = toPercentPos(e.clientX, e.clientY);
        chip.style.left = (p.x - 11) + '%';
        chip.style.top = (p.y - 4) + '%';
      });
      function endDrag(e){
        if(!dragging) return;
        dragging = false;
        chip.classList.remove('dragging');
        // check overlap with slots
        var chipRect = chip.getBoundingClientRect();
        var cx = chipRect.left + chipRect.width/2;
        var cy = chipRect.top + chipRect.height/2;
        var matched = null;
        slots.forEach(function(s){
          var r = s.getBoundingClientRect();
          if(cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom){
            matched = s;
          }
        });
        if(matched && parseInt(matched.dataset.role,10) === parseInt(chip.dataset.role,10) && !matched.classList.contains('filled')){
          var r = matched.getBoundingClientRect();
          var sr = toPercentPos(r.left + r.width/2, r.top + r.height/2);
          chip.style.left = (sr.x - 11) + '%';
          chip.style.top = (sr.y - 4) + '%';
          chip.dataset.placed = '1';
          chip.style.cursor = 'default';
          matched.classList.add('filled');
          filledCount++;
          if(filledCount >= chipLabels.length){
            setTimeout(onAllDone, 400);
          }
        } else if(matched){
          matched.classList.add('wobble');
          setTimeout(function(){ matched.classList.remove('wobble'); }, 400);
          chip.style.left = chipStartPositions ? chip.dataset.origLeft || chip.style.left : chip.style.left;
          resetChipPos();
        } else {
          resetChipPos();
        }
      }
      function resetChipPos(){
        chip.style.left = '8%';
        chip.style.top = (18 + i*27) + '%';
      }
      chip.addEventListener('pointerup', endDrag);
      chip.addEventListener('pointercancel', endDrag);
    });
  }

  function addDragDress(onAllDone){
    clearOverlaySceneLayer();
    var itemsData = [
      {label: lang==='id' ? 'Kain' : 'Cloth', target:{x:50,y:52}, start:{x:14,y:22}},
      {label: lang==='id' ? 'Perhiasan' : 'Jewelry', target:{x:50,y:38}, start:{x:14,y:68}}
    ];
    var placed = 0;
    itemsData.forEach(function(item, idx){
      var chip = document.createElement('div');
      chip.className = 'drag-chip clickable';
      chip.textContent = item.label;
      chip.style.left = item.start.x + '%';
      chip.style.top = item.start.y + '%';
      chip.style.width = '20%';
      sceneLayer.appendChild(chip);
      var dragging = false;
      function toPercentPos(clientX, clientY){
        var rect = sceneLayer.getBoundingClientRect();
        return { x:(clientX-rect.left)/rect.width*100, y:(clientY-rect.top)/rect.height*100 };
      }
      chip.addEventListener('pointerdown', function(e){
        if(chip.dataset.placed === '1') return;
        dragging = true;
        chip.classList.add('dragging');
        chip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      chip.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var p = toPercentPos(e.clientX, e.clientY);
        chip.style.left = (p.x-10) + '%';
        chip.style.top = (p.y-4) + '%';
      });
      function endDrag(e){
        if(!dragging) return;
        dragging = false;
        chip.classList.remove('dragging');
        var p = toPercentPos(e.clientX, e.clientY);
        var dx = p.x - item.target.x, dy = p.y - item.target.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 14){
          chip.style.left = (item.target.x-10) + '%';
          chip.style.top = (item.target.y-4) + '%';
          chip.dataset.placed = '1';
          chip.style.cursor = 'default';
          placed++;
          if(idx === 0){ dressState.dressed = true; }
          if(idx === 1){ dressState.jewelry = true; }
          renderCurrentSceneArt();
          if(placed >= itemsData.length){
            setTimeout(onAllDone, 400);
          }
        } else {
          chip.style.left = item.start.x + '%';
          chip.style.top = item.start.y + '%';
        }
      }
      chip.addEventListener('pointerup', endDrag);
      chip.addEventListener('pointercancel', endDrag);
    });
  }

  function animateTransform(onDone){
    stopAnim();
    transformProgress = 0;
    var start = null;
    var duration = 2600;
    function step(ts){
      if(!start) start = ts;
      var elapsed = ts - start;
      transformProgress = Math.min(1, elapsed/duration);
      renderCurrentSceneArt();
      if(transformProgress < 1){
        raf = requestAnimationFrame(step);
      } else {
        raf = requestAnimationFrame(function loopGlow(t2){
          renderCurrentSceneArt();
          raf = requestAnimationFrame(loopGlow);
        });
        setTimeout(onDone, 300);
      }
    }
    raf = requestAnimationFrame(step);
  }

  function animatePrayerBackground(){
    stopAnim();
    function step(){
      renderCurrentSceneArt();
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  /* ============== SCENE FLOW ============== */

  function goToScene(idx){
    stopAnim();
    stopSpeech();
    sceneIndex = idx;
    renderProgressDots();

    if(idx >= TOTAL_SCENES){
      showEndScreen();
      return;
    }

    var s = T().scenes[idx];
    setCaption(s);
    renderCurrentSceneArt();
    speak(s.narration);

    switch(idx){
      case 0: // forest QTE
        setCtrlButton(null);
        addQteTargets(5, function(){ goToScene(idx+1); });
        break;
      case 1: // carving QTE
        setCtrlButton(null);
        addQteTargets(6, function(){ goToScene(idx+1); });
        break;
      case 2: // dressing drag
        setCtrlButton(null);
        dressState = {dressed:false, jewelry:false};
        renderCurrentSceneArt();
        addDragDress(function(){ goToScene(idx+1); });
        break;
      case 3: // prayer QTE with animated bg (stars twinkle)
        clearOverlaySceneLayer();
        setCtrlButton(null);
        animatePrayerBackground();
        addQteTargets(6, function(){ stopAnim(); goToScene(idx+1); });
        break;
      case 4: // transform auto animation
        clearOverlaySceneLayer();
        setCtrlButton(null, null, false, true);
        animateTransform(function(){
          setCtrlButton(T().continueBtn, function(){ goToScene(idx+1); });
        });
        break;
      case 5: // dispute intro -> tap continue to matching puzzle
        clearOverlaySceneLayer();
        setCtrlButton(T().continueBtn, function(){ goToScene(idx+1); });
        break;
      case 6: // dispute matching puzzle
        setCaption({title:s.title, text:s.text, hint:s.hint});
        setCtrlButton(null);
        // correctMap per chip index (Datu Partoar=0 -> Father(0), Datu Panggana=1 -> Uncle(1), Bao Partigatiga=2 -> OlderBrother(2))
        addDragMatch(T().chipLabels, T().roleLabels, [0,1,2], function(){
          goToScene(idx+1);
        });
        break;
      case 7: // proposal 1 - reject
        clearOverlaySceneLayer();
        setCtrlButton(T().rejectBtn, function(){ goToScene(idx+1); });
        break;
      case 8: // proposal 2 - accept
        clearOverlaySceneLayer();
        setCtrlButton(T().acceptBtn, function(){ goToScene(idx+1); });
        break;
      case 9: // illness
        clearOverlaySceneLayer();
        setCtrlButton(T().continueBtn, function(){ goToScene(idx+1); });
        break;
      case 10: // ending narrative scene, then to end screen
        clearOverlaySceneLayer();
        setCtrlButton(T().continueBtn, function(){ goToScene(idx+1); });
        break;
    }
  }

  /* ============== START / END SCREENS ============== */

  function showStartScreen(){
    stopAnim();
    stopSpeech();
    sceneIndex = -1;
    ctx.clearRect(0,0,W,H);
    drawLakeAndSamosir();
    drawUlosBorder();
    document.getElementById('captionBox').style.display = 'none';
    clearOverlaySceneLayer();

    var panel = document.createElement('div');
    panel.className = 'fullscreenPanel';
    panel.innerHTML =
      '<h1>' + T().gameTitle + '</h1>' +
      '<h2>' + T().gameSubtitle + '</h2>' +
      '<div class="ulos-strip"></div>' +
      '<p>' + T().startDesc + '</p>' +
      '<div class="startbtns"><button class="storybtn clickable" id="playBtnEl">' + T().playBtn + '</button></div>';
    sceneLayer.appendChild(panel);

    document.getElementById('playBtnEl').addEventListener('click', function(){
      document.getElementById('captionBox').style.display = 'block';
      goToScene(0);
    });
  }

  function showEndScreen(){
    ctx.clearRect(0,0,W,H);
    drawLakeAndSamosir();
    drawStatue(W/2-40, H-220, {scale:1.4, dressed:true, jewelry:true, dressColor:'#8c2a3a'});
    drawUlosBorder();
    document.getElementById('captionBox').style.display = 'none';
    clearOverlaySceneLayer();

    var panel = document.createElement('div');
    panel.className = 'fullscreenPanel';
    panel.innerHTML =
      '<h1>' + T().endTitle + '</h1>' +
      '<div class="ulos-strip"></div>' +
      '<p>' + T().endMoral + '</p>' +
      '<div class="startbtns"><button class="storybtn clickable" id="replayBtnEl">' + T().replayBtn + '</button></div>';
    sceneLayer.appendChild(panel);
    speak(T().endMoral);

    document.getElementById('replayBtnEl').addEventListener('click', function(){
      showStartScreen();
    });
  }

  /* ============== TOP CONTROLS ============== */

  function refreshLangUI(){
    langLabel.textContent = T().langLabel;
    document.getElementById('htmlRoot').lang = lang;
  }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'id') ? 'en' : 'id';
    refreshLangUI();
    if(sceneIndex === -1){
      showStartScreen();
    } else if(sceneIndex >= TOTAL_SCENES){
      showEndScreen();
    } else {
      goToScene(sceneIndex);
    }
  });

  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? T().muteOff : T().muteOn;
    if(muted) stopSpeech();
  });

  /* ============== RESIZE REPORTING (for iframe embed) ============== */
  function reportHeight(){
    var h = document.getElementById('stageWrap').getBoundingClientRect().height;
    try{
      window.parent.postMessage({ type:'naiManggaleHeight', height: Math.ceil(h) }, '*');
    }catch(e){}
  }
  if(window.ResizeObserver){
    var ro = new ResizeObserver(reportHeight);
    ro.observe(document.getElementById('stageWrap'));
  }
  window.addEventListener('resize', reportHeight);
  window.addEventListener('load', function(){ reportHeight(); setTimeout(reportHeight, 400); setTimeout(reportHeight, 1200); });

  /* ============== INIT ============== */
  refreshLangUI();
  muteBtn.textContent = T().muteOn;
  showStartScreen();

})();
</script>
</body>
</html>

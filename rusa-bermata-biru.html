<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rusa Bermata Biru — Game Dongeng Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241608;
    --night-top:#0d1b2e;
    --night-bottom:#1b3a5c;
    --parchment:#f4ede0;
    --parchment-edge:#e4d6b8;
    --parchment-shadow:#c9b998;
    --spirit-blue:#4fc3f0;
    --spirit-blue-soft:#bfeaff;
    --ember:#e8823c;
    --ember-soft:#f4a662;
    --text-dark:#2a1810;
    --text-soft:#6b5640;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:transparent;
    font-family:'Nunito',sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow-x:hidden;
  }
  #app{
    max-width:820px;
    margin:0 auto;
    background:linear-gradient(180deg,var(--night-top),var(--night-bottom));
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(13,27,46,0.35);
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:rgba(13,20,32,0.55);
    backdrop-filter:blur(4px);
    border-bottom:1px solid rgba(244,237,224,0.12);
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  .moon-ic{font-size:20px;line-height:1;flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-text strong{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:16px;
    color:var(--parchment);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-text small{
    font-size:10.5px;
    color:var(--spirit-blue-soft);
    opacity:0.85;
    white-space:nowrap;
  }
  .controls{display:flex;gap:8px;flex-shrink:0;}
  .chip{
    font-family:'Baloo 2',cursive;
    font-weight:600;
    font-size:13px;
    background:rgba(244,237,224,0.12);
    color:var(--parchment);
    border:1px solid rgba(244,237,224,0.25);
    border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
    min-width:38px;
    min-height:32px;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .chip:hover{background:rgba(244,237,224,0.22);}
  .chip:active{transform:scale(0.94);}
  .chip.is-off{opacity:0.55;}

  .stage-wrap{position:relative;width:100%;aspect-ratio:5/3;background:#0d1b2e;}
  #stage{width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation;}

  .progress-overlay{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:min(78%,360px);
    background:rgba(13,20,32,0.55);
    border:1px solid rgba(244,237,224,0.25);
    border-radius:999px;
    padding:6px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .progress-overlay.visible{opacity:1;}
  .progress-track{flex:1;height:10px;border-radius:999px;background:rgba(244,237,224,0.18);overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--ember),var(--ember-soft));transition:width 0.15s ease;}
  .progress-label{font-family:'Baloo 2',cursive;font-size:11px;color:var(--parchment);white-space:nowrap;}

  .skip-link{
    position:absolute;
    right:12px;
    bottom:14px;
    font-size:11px;
    color:var(--parchment);
    background:rgba(13,20,32,0.55);
    border:1px solid rgba(244,237,224,0.3);
    border-radius:999px;
    padding:5px 11px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    font-family:'Nunito',sans-serif;
  }
  .skip-link.visible{opacity:1;pointer-events:auto;}

  .caption-card{
    background:var(--parchment);
    border-top:3px solid var(--parchment-edge);
    padding:16px 18px 14px;
    position:relative;
  }
  .caption-card::before{
    content:"";
    position:absolute;
    top:-11px;left:50%;
    transform:translateX(-50%);
    width:46px;height:6px;
    background:var(--parchment-edge);
    border-radius:999px;
  }
  .speaker{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:13px;
    color:var(--ember);
    letter-spacing:0.02em;
    min-height:16px;
    margin-bottom:2px;
  }
  .caption-text{
    font-family:'Nunito',sans-serif;
    font-weight:600;
    font-size:16px;
    line-height:1.55;
    color:var(--text-dark);
    margin:0;
    min-height:48px;
    white-space:pre-line;
  }
  .caption-text.narrator-style{font-style:italic;font-weight:600;color:var(--text-soft);}
  .caption-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    margin-top:12px;
  }
  .ghost-btn{
    background:none;
    border:1.5px solid var(--parchment-shadow);
    color:var(--text-soft);
    border-radius:999px;
    width:38px;height:38px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .ghost-btn:active{transform:scale(0.92);}
  .next-btn{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:15px;
    background:var(--ember);
    color:#fff8ef;
    border:none;
    border-radius:999px;
    padding:11px 22px;
    cursor:pointer;
    box-shadow:0 4px 0 #b85f22;
    transition:transform 0.08s ease, box-shadow 0.08s ease;
    flex:1;
    max-width:280px;
  }
  .next-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b85f22;}
  .next-btn.wide{max-width:none;}

  .credit{
    text-align:center;
    font-size:10.5px;
    color:rgba(244,237,224,0.55);
    padding:7px 10px 10px;
    background:var(--night-bottom);
  }
  .credit a{color:var(--spirit-blue-soft);text-decoration:none;}
  .credit a:hover{text-decoration:underline;}

  @media (max-width:420px){
    .brand-text strong{font-size:14px;}
    .caption-text{font-size:14.5px;}
    .next-btn{font-size:14px;padding:10px 16px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="moon-ic">🌙</span>
      <span class="brand-text">
        <strong id="titleText">Rusa Bermata Biru</strong>
        <small id="subtitleText">Dongeng Anak dari Amerika</small>
      </span>
    </div>
    <div class="controls">
      <button id="langBtn" class="chip" aria-label="Ganti bahasa / Switch language">EN</button>
      <button id="muteBtn" class="chip" aria-label="Bisukan suara">🔊</button>
    </div>
  </div>

  <div class="stage-wrap">
    <canvas id="stage" width="1600" height="960"></canvas>
    <div id="progressOverlay" class="progress-overlay">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressLabel" class="progress-label">0 / 10</div>
    </div>
    <div id="skipLink" class="skip-link">…</div>
  </div>

  <div class="caption-card">
    <div class="speaker" id="speakerName"></div>
    <p class="caption-text" id="captionText"></p>
    <div class="caption-actions">
      <button class="ghost-btn" id="replayBtn" title="Dengarkan lagi">🔁</button>
      <button class="next-btn" id="nextBtn">Mulai Cerita</button>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ---------- Colors ---------- */
var INK = '#241608';
var SPIRIT_BLUE = '#4fc3f0';
var AMBER_EYE = '#f0b23c';
var EMBER = '#e8823c';
var EMBER_SOFT = '#f4a662';
var PARCH = '#f4ede0';

/* ---------- Language strings ---------- */
var UI = {
  id:{
    title:"Rusa Bermata Biru",
    subtitle:"Dongeng Anak dari Amerika",
    start:"Mulai Cerita",
    next:"Lanjut",
    replayLabel:"Mainkan Lagi",
    skip:"Lewati ›",
    tapHintPrefix:"👆 ",
    mashLabel:"Ketuk!",
    narrator:"",
    fairy:"Peri Rusa",
    boone:"Boone",
    moralTitle:"Pesan Cerita",
    moralText:"Sesuatu yang berbeda bukan untuk dikejar dan dimiliki, tapi untuk dihormati dan dijaga.",
  },
  en:{
    title:"The Blue-Eyed Deer",
    subtitle:"A Children's Folktale from America",
    start:"Start the Story",
    next:"Continue",
    replayLabel:"Play Again",
    skip:"Skip ›",
    tapHintPrefix:"👆 ",
    mashLabel:"Tap!",
    narrator:"",
    fairy:"The Deer Fairy",
    boone:"Boone",
    moralTitle:"Moral of the Story",
    moralText:"Something rare is not meant to be chased and owned, but to be respected and protected.",
  }
};

/* ---------- Story steps ---------- */
var STEPS = [
  { id:'title', type:'title', art:'title' },

  { id:'s1', type:'narration', art:'forest-hunter', speaker:'narrator',
    text:{
      id:"Konon, di sebuah hutan yang lebat, hiduplah seorang pemburu bernama Boone. Ia terkenal sangat piawai berburu rusa — belum pernah ada rusa yang lolos dari bidikannya.",
      en:"Long ago, in a deep forest, there lived a hunter named Boone. He was famous for his skill at hunting deer — no deer had ever escaped him." } },

  { id:'s1b', type:'tap', art:'ember-tap', speaker:'narrator',
    text:{
      id:"Trik Boone selalu sama: ia membawa panci berisi bara api. Cahayanya membuat mata rusa silau, sehingga rusa tak bisa lari.",
      en:"Boone's trick was always the same: he carried a pan of glowing embers. Their light would dazzle a deer's eyes so it couldn't run." },
    hint:{ id:"Ketuk bara api untuk menyalakannya", en:"Tap the embers to light them" } },

  { id:'s2a', type:'narration', art:'forest-spotted', speaker:'narrator',
    text:{
      id:"Suatu malam terasa berbeda. Di kegelapan hutan, Boone melihat sepasang mata bersinar aneh — bukan kuning seperti biasanya, melainkan biru terang.",
      en:"One night felt different. In the darkness of the forest, Boone spotted a strange pair of glowing eyes — not the usual amber, but a bright, brilliant blue." } },

  { id:'s2b', type:'spot', art:'eyes-game', speaker:'narrator',
    text:{
      id:"Di antara pepohonan, banyak pasang mata rusa yang berkilau. Tapi hanya satu yang berwarna biru. Bisakah kamu menemukannya?",
      en:"Among the trees, many pairs of deer eyes glimmered. But only one pair was blue. Can you find it?" },
    hint:{ id:"Cepat, temukan mata biru di antara pepohonan!", en:"Quick, find the blue eyes among the trees!" },
    eyeTargets:[
      {x:150,y:230,color:AMBER_EYE},
      {x:255,y:185,color:AMBER_EYE},
      {x:400,y:245,color:SPIRIT_BLUE,correct:true},
      {x:520,y:195,color:AMBER_EYE},
      {x:645,y:235,color:AMBER_EYE},
      {x:330,y:150,color:AMBER_EYE}
    ] },

  { id:'s3a', type:'narration', art:'deer-close', speaker:'narrator',
    text:{
      id:"Boone belum pernah melihat rusa seperti ini sebelumnya. Ia yakin, jika berhasil menangkapnya, rusa bermata biru ini pasti sangat berharga.",
      en:"Boone had never seen a deer like this before. He was certain that if he could catch it, this blue-eyed deer would be worth a great deal." } },

  { id:'s3b', type:'tap', art:'aim-tap', speaker:'narrator',
    text:{
      id:"Seperti biasa, Boone mengarahkan bara api ke arah mata sang rusa.",
      en:"As always, Boone aimed the glowing embers straight at the deer's eyes." },
    hint:{ id:"Ketuk untuk mengarahkan bara api", en:"Tap to aim the embers" } },

  { id:'s4a', type:'narration', art:'ember-fails', speaker:'narrator',
    text:{
      id:"Anehnya, bara api itu sama sekali tidak membuat rusa itu silau. Rusa bermata biru balik menatap Boone — lalu berlari kencang menembus kegelapan.",
      en:"Strangely, the embers didn't dazzle the deer at all. The blue-eyed deer stared right back at Boone — then bolted into the darkness." } },

  { id:'s4b', type:'mash', art:'chase', speaker:'narrator', required:10,
    text:{
      id:"Boone tak mau menyerah. Ia berlari mengejar rusa itu sekuat tenaga!",
      en:"Boone refused to give up. He ran after the deer with all his might!" },
    hint:{ id:"Ketuk berulang kali untuk mengejar rusa!", en:"Tap again and again to chase the deer!" } },

  { id:'s5a', type:'narration', art:'cabin-exterior', speaker:'narrator',
    text:{
      id:"Rusa itu berlari menuju sebuah pondok kecil di tengah hutan — lalu menghilang begitu saja di baliknya. Boone sangat keheranan: bagaimana mungkin seekor rusa masuk ke dalam rumah?",
      en:"The deer ran straight to a small cottage deep in the forest — and vanished right at its door. Boone was baffled: how could a deer disappear into a house?" } },

  { id:'s5b', type:'tap', art:'peek-tap', speaker:'narrator',
    text:{
      id:"Perlahan, Boone mengendap-endap mendekati jendela pondok itu.",
      en:"Slowly, Boone crept closer toward the cottage window." },
    hint:{ id:"Ketuk untuk mengintip dari jendela", en:"Tap to peek through the window" } },

  { id:'s6a', type:'narration', art:'peek-empty', speaker:'narrator',
    text:{
      id:"Ia mengintip ke dalam. Namun tak ada seekor rusa pun di sana — hanya cahaya hangat dan sebuah ruangan yang sepi.",
      en:"He peeked inside. But there was no deer at all — only warm light and a quiet, empty room." } },

  { id:'s6b', type:'narration', art:'cabin-glow', speaker:'fairy',
    text:{
      id:"\u201cMasuklah, Tuan. Tak perlu hanya mengintip dari luar.\u201d",
      en:"\u201cCome in, sir. There's no need to only peek from outside.\u201d" } },

  { id:'s7a', type:'narration', art:'boone-enters', speaker:'narrator',
    text:{
      id:"Dengan jantung berdebar, Boone melangkah masuk. Seorang wanita cantik menyambutnya dengan ramah, seolah telah menantikan kedatangannya.",
      en:"With his heart pounding, Boone stepped inside. A beautiful woman welcomed him warmly, as though she had been expecting him all along." } },

  { id:'s7b', type:'narration', art:'fairy-intro', speaker:'fairy',
    text:{
      id:"\u201cAku adalah peri rusa,\u201d katanya. \u201cAku tahu betul, kaulah pemburu yang selama ini memburu rusa-rusa di hutan ini.\u201d",
      en:"\u201cI am the deer fairy,\u201d she said. \u201cI know very well — you are the hunter who has been hunting the deer of this forest.\u201d" } },

  { id:'s7c', type:'narration', art:'fairy-warn', speaker:'fairy',
    text:{
      id:"\u201cMulai sekarang akan kutahan kau di sini, agar tak bisa memburu rusa lagi. Dengan begitu, mereka bisa hidup tenang.\u201d",
      en:"\u201cFrom now on, I will keep you here, so you can hunt no more deer. That way, they may live in peace.\u201d" } },

  { id:'s7d', type:'narration', art:'boone-plea', speaker:'boone',
    text:{
      id:"Boone ketakutan. \u201cJangan tahan aku... kumohon, lepaskan aku. Aku berjanji tak akan berburu rusa lagi,\u201d pintanya.",
      en:"Boone was frightened. \u201cPlease don't keep me here... I beg you, let me go. I promise I will never hunt deer again,\u201d he pleaded." } },

  { id:'s7e', type:'tap', art:'promise-tap', speaker:'narrator',
    text:{
      id:"Boone meletakkan tangan di dadanya, bersungguh-sungguh dengan janjinya.",
      en:"Boone placed his hand on his chest, meaning his promise with all his heart." },
    hint:{ id:"Ketuk untuk membuat janji sungguh-sungguh", en:"Tap to make a solemn promise" } },

  { id:'s8a', type:'narration', art:'fairy-release', speaker:'narrator',
    text:{
      id:"Peri rusa tersenyum lembut. Ia percaya pada janji Boone, dan akhirnya melepaskannya untuk kembali pulang.",
      en:"The deer fairy smiled gently. She believed Boone's promise, and finally set him free to return home." } },

  { id:'s8b', type:'end', art:'ending', speaker:'narrator',
    text:{
      id:"Sejak malam itu, Boone tak pernah lagi berburu rusa di hutan. Ia menepati janjinya — dan rusa-rusa pun kembali hidup tenang di antara pepohonan.",
      en:"From that night on, Boone never hunted deer in the forest again. He kept his promise — and the deer once more lived peacefully among the trees." } }
];

/* ---------- State ---------- */
var state = {
  lang:'id',
  muted:false,
  stepIndex:0,
  mashCount:0,
  wrongTaps:0,
  stepEnteredAt:0,
  pings:[],
  lastTapAt:0,
  voices:[],
  advancing:false
};

var params = new URLSearchParams(window.location.search);
if(params.get('lang')==='en') state.lang='en';
if(params.get('mute')==='1') state.muted=true;

/* ---------- DOM refs ---------- */
var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var titleText = document.getElementById('titleText');
var subtitleText = document.getElementById('subtitleText');
var speakerName = document.getElementById('speakerName');
var captionText = document.getElementById('captionText');
var nextBtn = document.getElementById('nextBtn');
var replayBtn = document.getElementById('replayBtn');
var langBtn = document.getElementById('langBtn');
var muteBtn = document.getElementById('muteBtn');
var progressOverlay = document.getElementById('progressOverlay');
var progressFill = document.getElementById('progressFill');
var progressLabel = document.getElementById('progressLabel');
var skipLink = document.getElementById('skipLink');

ctx.scale(2,2); // backing store is 2x logical 800x480

/* ---------- Precomputed scenery ---------- */
function rand(a,b){ return a+Math.random()*(b-a); }

var STARS = [];
for(var i=0;i<44;i++){
  STARS.push({x:rand(10,790),y:rand(10,260),r:rand(0.6,1.8),speed:rand(0.4,1.4),phase:rand(0,10),baseAlpha:rand(0.4,1)});
}

var FIREFLIES = [];
for(var i=0;i<9;i++){
  FIREFLIES.push({x:rand(60,740),y:rand(260,400),sp:rand(0.5,1.3),ph:rand(0,10)});
}

var TREE_POSITIONS = [
  {x:60,baseY:420,h:150,w:70},
  {x:150,baseY:432,h:190,w:85},
  {x:250,baseY:414,h:160,w:75},
  {x:400,baseY:398,h:128,w:60},
  {x:340,baseY:442,h:210,w:95},
  {x:460,baseY:420,h:170,w:80},
  {x:560,baseY:446,h:222,w:100},
  {x:650,baseY:414,h:165,w:78},
  {x:740,baseY:436,h:196,w:88}
].sort(function(a,b){ return a.h-b.h; });

/* ---------- Drawing primitives ---------- */
function drawSky(top,bottom){
  var g = ctx.createLinearGradient(0,0,0,480);
  g.addColorStop(0,top); g.addColorStop(1,bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,800,480);
}

function drawMoon(x,y,r){
  ctx.save();
  ctx.shadowColor='rgba(244,237,224,0.65)';
  ctx.shadowBlur=44;
  ctx.fillStyle=PARCH;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawStars(t){
  ctx.save();
  for(var i=0;i<STARS.length;i++){
    var s = STARS[i];
    var flick = 0.5+0.5*Math.sin(t/1000*s.speed+s.phase);
    ctx.globalAlpha = Math.max(0,Math.min(1,0.25+0.75*flick*s.baseAlpha));
    ctx.fillStyle = PARCH;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawFireflies(t,color){
  ctx.save();
  for(var i=0;i<FIREFLIES.length;i++){
    var f = FIREFLIES[i];
    var fx = f.x + Math.sin(t/1000*f.sp+f.ph)*16;
    var fy = f.y + Math.cos(t/1300*f.sp+f.ph)*11;
    var a = 0.25+0.65*Math.abs(Math.sin(t/700*f.sp+f.ph));
    ctx.globalAlpha = a;
    ctx.shadowColor = color; ctx.shadowBlur = 9;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(fx,fy,1.7,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawGround(color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0,480); ctx.lineTo(0,392);
  ctx.quadraticCurveTo(400,360,800,392);
  ctx.lineTo(800,480); ctx.closePath(); ctx.fill();
}

function drawTree(x,baseY,h,w){
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(x, baseY-h);
  ctx.lineTo(x-w*0.5, baseY-h*0.58);
  ctx.lineTo(x-w*0.25, baseY-h*0.58);
  ctx.lineTo(x-w*0.62, baseY-h*0.2);
  ctx.lineTo(x-w*0.32, baseY-h*0.2);
  ctx.lineTo(x-w*0.75, baseY-h*0.02);
  ctx.lineTo(x+w*0.75, baseY-h*0.02);
  ctx.lineTo(x+w*0.32, baseY-h*0.2);
  ctx.lineTo(x+w*0.62, baseY-h*0.2);
  ctx.lineTo(x+w*0.25, baseY-h*0.58);
  ctx.lineTo(x+w*0.5, baseY-h*0.58);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(x-w*0.05, baseY-h*0.02, w*0.1, 16);
}

function drawTreeLine(){
  for(var i=0;i<TREE_POSITIONS.length;i++){
    var tp = TREE_POSITIONS[i];
    drawTree(tp.x,tp.baseY,tp.h,tp.w);
  }
}

function drawEyesPair(x,y,color,strength){
  ctx.save();
  ctx.shadowColor=color; ctx.shadowBlur=12*strength;
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(x-6.5,y,3,2.1,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+6.5,y,3,2.1,0,0,Math.PI*2); ctx.fill();

}

function drawPings(t){
  state.pings = state.pings.filter(function(p){ return t-p.t0 < 650; });
  for(var i=0;i<state.pings.length;i++){
    var p = state.pings[i];
    var prog = (t-p.t0)/650;
    ctx.save();
    ctx.globalAlpha = 1-prog;
    ctx.strokeStyle = p.correct ? SPIRIT_BLUE : '#e8543c';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x,p.y,10+prog*26,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

}

/* ---------- Animation loop ---------- */
function loop(t){
  var step = STEPS[state.stepIndex];
  renderScene(step.art, t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Speech synthesis ---------- */
function loadVoices(){ state.voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(langCode){
  for(var i=0;i<state.voices.length;i++){
    if(state.voices[i].lang && state.voices[i].lang.toLowerCase().indexOf(langCode)===0) return state.voices[i];
  }
  return null;
}
function speak(text){
  if(!window.speechSynthesis || state.muted || !text) return;
  window.speechSynthesis.cancel();
  var clean = text.replace(/\u201c|\u201d/g,'"');
  var utter = new SpeechSynthesisUtterance(clean);
  var langCode = state.lang==='id' ? 'id' : 'en';
  utter.lang = state.lang==='id' ? 'id-ID' : 'en-US';
  var v = pickVoice(langCode);
  if(v) utter.voice = v;
  utter.rate = 0.96;
  utter.pitch = 1.0;
  window.speechSynthesis.speak(utter);
}

/* ---------- UI update ---------- */
function speakerLabel(step){
  var u = UI[state.lang];
  if(step.speaker==='fairy') return u.fairy;
  if(step.speaker==='boone') return u.boone;
  return '';
}

function updateStaticUI(){
  var u = UI[state.lang];
  titleText.textContent = u.title;
  subtitleText.textContent = u.subtitle;
  langBtn.textContent = state.lang==='id' ? 'EN' : 'ID';
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('is-off', state.muted);
  document.documentElement.lang = state.lang;
}

function showStep(i){
  state.stepIndex = i;
  state.mashCount = 0;
  state.wrongTaps = 0;
  state.stepEnteredAt = performance.now();
  state.pings = [];
  skipLink.classList.remove('visible');
  var step = STEPS[i];
  var u = UI[state.lang];

  speakerName.textContent = speakerLabel(step);
  captionText.textContent = step.text[state.lang];
  captionText.classList.toggle('narrator-style', step.speaker==='narrator' && step.type==='narration');

  if(step.type==='title'){
    nextBtn.textContent = u.start;
    nextBtn.classList.add('wide');
    replayBtn.style.visibility = 'hidden';
  } else if(step.type==='end'){
    captionText.textContent = u.moralTitle + '\n' + step.text[state.lang] + '\n\n' + u.moralText;
    nextBtn.textContent = u.replayLabel;
    nextBtn.classList.add('wide');
    replayBtn.style.visibility = 'hidden';
  } else if(step.type==='tap'){
    nextBtn.textContent = u.tapHintPrefix + step.hint[state.lang];
    nextBtn.classList.remove('wide');
    replayBtn.style.visibility = 'visible';
  } else if(step.type==='mash'){
    nextBtn.textContent = u.mashLabel;
    nextBtn.classList.remove('wide');
    replayBtn.style.visibility = 'visible';
  } else if(step.type==='spot'){
    nextBtn.textContent = u.tapHintPrefix + step.hint[state.lang];
    nextBtn.classList.remove('wide');
    replayBtn.style.visibility = 'visible';
  } else {
    nextBtn.textContent = u.next;
    nextBtn.classList.remove('wide');
    replayBtn.style.visibility = 'visible';
  }

  if(step.type==='mash'){
    progressOverlay.classList.add('visible');
    updateMashUI();
  } else {
    progressOverlay.classList.remove('visible');
  }

  speak(step.text[state.lang]);
  setTimeout(reportHeight,30);
}

function updateMashUI(){
  var step = STEPS[state.stepIndex];
  var req = step.required;
  var pct = Math.min(100, (state.mashCount/req)*100);
  progressFill.style.width = pct+'%';
  progressLabel.textContent = state.mashCount+' / '+req;
}

function advance(){
  if(state.advancing) return;
  state.advancing = true;
  var next = state.stepIndex+1;
  if(next>=STEPS.length) next = STEPS.length-1;
  showStep(next);
  setTimeout(function(){ state.advancing=false; },250);
}

function restart(){
  showStep(0);
}

function tapSuccess(){
  state.lastTapAt = performance.now();
  setTimeout(advance, 480);
}

function mashTap(){
  var step = STEPS[state.stepIndex];
  if(step.type!=='mash') return;
  state.lastTapAt = performance.now();
  state.mashCount = Math.min(step.required, state.mashCount+1);
  updateMashUI();
  if(state.mashCount>=step.required){
    setTimeout(advance, 400);
  }
}

function trySpotClick(logicalX,logicalY){
  var step = STEPS[state.stepIndex];
  var targets = step.eyeTargets;
  var now = performance.now();
  var best=null,bestD=9999;
  for(var i=0;i<targets.length;i++){
    var e = targets[i];
    var d = Math.hypot(logicalX-e.x, logicalY-e.y);
    if(d<bestD){ bestD=d; best=e; }
  }
  if(best && bestD<34){
    state.pings.push({x:best.x,y:best.y,t0:now,correct:!!best.correct});
    if(best.correct){
      setTimeout(advance, 420);
    } else {
      state.wrongTaps++;
      if(state.wrongTaps>=4) skipLink.classList.add('visible');
    }
  }
}

/* ---------- Input handlers ---------- */
function logicalCoords(evt){
  var rect = canvas.getBoundingClientRect();
  var cx = (evt.touches && evt.touches.length) ? evt.touches[0].clientX : evt.clientX;
  var cy = (evt.touches && evt.touches.length) ? evt.touches[0].clientY : evt.clientY;
  return { x:(cx-rect.left)/rect.width*800, y:(cy-rect.top)/rect.height*480 };
}

canvas.addEventListener('click', function(evt){
  var step = STEPS[state.stepIndex];
  var p = logicalCoords(evt);
  if(step.type==='tap'){ tapSuccess(); }
  else if(step.type==='mash'){ mashTap(); }
  else if(step.type==='spot'){ trySpotClick(p.x,p.y); }
  else if(step.type==='title' || step.type==='narration'){ advance(); }
});

nextBtn.addEventListener('click', function(){
  var step = STEPS[state.stepIndex];
  if(step.type==='title'){ advance(); }
  else if(step.type==='end'){ restart(); }
  else if(step.type==='tap'){ tapSuccess(); }
  else if(step.type==='mash'){ mashTap(); }
  else if(step.type==='spot'){ /* button acts as a gentle nudge, not an answer */ }
  else { advance(); }
});

replayBtn.addEventListener('click', function(){
  var step = STEPS[state.stepIndex];
  speak(step.text[state.lang]);
});

langBtn.addEventListener('click', function(){
  state.lang = state.lang==='id' ? 'en' : 'id';
  updateStaticUI();
  var step = STEPS[state.stepIndex];
  var u = UI[state.lang];
  speakerName.textContent = speakerLabel(step);
  if(step.type==='end'){
    captionText.textContent = u.moralTitle + '\n' + step.text[state.lang] + '\n\n' + u.moralText;
  } else {
    captionText.textContent = step.text[state.lang];
  }
  if(step.type==='title'){ nextBtn.textContent = u.start; }
  else if(step.type==='end'){ nextBtn.textContent = u.replayLabel; }
  else if(step.type==='tap' || step.type==='spot'){ nextBtn.textContent = u.tapHintPrefix + step.hint[state.lang]; }
  else if(step.type==='mash'){ nextBtn.textContent = u.mashLabel; }
  else { nextBtn.textContent = u.next; }
  setTimeout(reportHeight,30);
});

muteBtn.addEventListener('click', function(){
  state.muted = !state.muted;
  updateStaticUI();
  if(state.muted && window.speechSynthesis) window.speechSynthesis.cancel();
  else { var step = STEPS[state.stepIndex]; speak(step.text[state.lang]); }
});

skipLink.addEventListener('click', function(){
  var step = STEPS[state.stepIndex];
  if(step.type==='spot'){
    // reveal the correct pair briefly by pulsing, then let them tap it
    state.wrongTaps = 0;
    skipLink.classList.remove('visible');
  }
});
skipLink.textContent = UI[state.lang].skip;

/* watch for skip visibility timing on spot steps */
setInterval(function(){
  var step = STEPS[state.stepIndex];
  if(step.type==='spot' && performance.now()-state.stepEnteredAt>9000){
    skipLink.classList.add('visible');
  }
}, 1000);

/* ---------- Resize reporting to parent (for iframe embedding) ---------- */
function reportHeight(){
  var h = document.getElementById('app').getBoundingClientRect().height;
  try{
    window.parent.postMessage({ type:'dongeng-resize', slug:'rusa-bermata-biru', height:Math.ceil(h) }, '*');
  }catch(e){}
}
window.addEventListener('load', reportHeight);
window.addEventListener('resize', function(){ setTimeout(reportHeight,60); });
if(window.ResizeObserver){
  new ResizeObserver(function(){ reportHeight(); }).observe(document.getElementById('app'));
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(reportHeight); }

/* ---------- Init ---------- */
updateStaticUI();
showStep(0);
})();
</script>
</body>
</html>

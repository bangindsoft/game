<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelikan Desa Kabrau</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: transparent;
    overflow: hidden;
  }
  .pk-wrap {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    background: linear-gradient(180deg, #fff6e0 0%, #ffe9bf 100%);
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(120,70,10,0.25);
    overflow: hidden;
    border: 3px solid #d98e2b;
    position: relative;
  }
  .pk-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #b25b1e;
    color: #fff8ea;
  }
  .pk-title {
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 0.3px;
  }
  .pk-controls { display: flex; gap: 8px; }
  .pk-btn-icon {
    background: #8a3f10;
    border: none;
    color: #fff8ea;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .pk-btn-icon:hover { transform: scale(1.08); background:#a4501a; }
  .pk-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #cdeefc;
    overflow: hidden;
  }
  .pk-canvas { width: 100%; height: 100%; display: block; }
  .pk-narration-box {
    position: absolute;
    left: 10px; right: 10px; bottom: 10px;
    background: rgba(46, 24, 8, 0.82);
    color: #fff3de;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    min-height: 20px;
    max-height: 40%;
    overflow-y: auto;
  }
  .pk-overlay-ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  .pk-overlay-ui > * { pointer-events: auto; }
  .pk-action-btn {
    position: absolute;
    left: 50%;
    bottom: 78px;
    transform: translateX(-50%);
    background: #e0723e;
    color: #fff8ea;
    border: none;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    user-select: none;
    touch-action: manipulation;
  }
  .pk-action-btn:active { transform: translateX(-50%) scale(0.96); }
  .pk-progress-wrap {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    height: 12px;
    background: rgba(255,255,255,0.5);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(120,60,10,0.4);
  }
  .pk-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#f2b53a,#e0723e);
    transition: width .12s ease-out;
  }
  .pk-hint {
    position: absolute;
    top: 30px; left: 0; right: 0;
    text-align: center;
    color: #7a3d0f;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
  }
  .pk-bottombar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #fff2d9;
  }
  .pk-dots { display: flex; gap: 7px; }
  .pk-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #e6c893;
    transition: background .25s, transform .25s;
  }
  .pk-dot.pk-active { background: #c1481c; transform: scale(1.25); }
  .pk-dot.pk-done { background: #8fae4d; }
  .pk-footer {
    text-align: center;
    font-size: 11px;
    color: #a06a2c;
    padding: 4px 0 8px;
    background: #fff2d9;
  }
  .pk-footer a { color: #a06a2c; }
  .pk-startscreen, .pk-endscreen {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,#fbdca0 0%, #f2b563 60%, #d98e2b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  .pk-startscreen h1, .pk-endscreen h2 {
    color: #5c2a08;
    margin: 6px 0;
    font-size: 22px;
  }
  .pk-startscreen p, .pk-endscreen p {
    color: #6b3410;
    font-size: 14px;
    max-width: 440px;
    margin: 6px 0 16px;
    line-height: 1.5;
  }
  .pk-start-btn {
    background: #c1481c;
    color: #fff8ea;
    border: none;
    padding: 14px 34px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .pk-start-btn:hover { background: #d9531f; }
  .pk-lang-toggle {
    margin-top: 14px;
    display: flex;
    gap: 8px;
  }
  .pk-lang-btn {
    background: rgba(255,255,255,0.55);
    border: 1px solid #8a5623;
    color: #5c2a08;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
  }
  .pk-lang-btn.pk-lang-active { background: #5c2a08; color: #fff3de; }
  .pk-hidden { display: none !important; }
  @media (max-width: 420px) {
    .pk-title { font-size: 13px; }
    .pk-action-btn { font-size: 13px; padding: 10px 20px; bottom: 66px; }
    .pk-narration-box { font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="pk-wrap" id="pkWrap">

  <div class="pk-topbar">
    <div class="pk-title" id="pkTitle">Pelikan Desa Kabrau</div>
    <div class="pk-controls">
      <button class="pk-btn-icon" id="pkLangBtn" title="Change language">EN</button>
      <button class="pk-btn-icon" id="pkMuteBtn" title="Mute/Unmute">🔊</button>
    </div>
  </div>

  <div class="pk-stage" id="pkStage">
    <canvas class="pk-canvas" id="pkCanvas"></canvas>

    <div class="pk-overlay-ui" id="pkOverlay">
      <div class="pk-progress-wrap pk-hidden" id="pkProgressWrap">
        <div class="pk-progress-bar" id="pkProgressBar"></div>
      </div>
      <div class="pk-hint pk-hidden" id="pkHint"></div>
      <button class="pk-action-btn pk-hidden" id="pkActionBtn">Lanjut</button>
    </div>

    <div class="pk-narration-box" id="pkNarrationBox"></div>

    <div class="pk-startscreen" id="pkStartScreen">
      <h1 id="pkStartTitle">🐦 Pelikan Desa Kabrau</h1>
      <p id="pkStartDesc">Dongeng anak dari Afrika Tengah tentang seekor pelikan baik hati dan seruling ajaib.</p>
      <button class="pk-start-btn" id="pkStartBtn">▶ Mulai Cerita</button>
      <div class="pk-lang-toggle">
        <button class="pk-lang-btn pk-lang-active" id="pkLangIdBtn">Bahasa Indonesia</button>
        <button class="pk-lang-btn" id="pkLangEnBtn">English</button>
      </div>
    </div>

    <div class="pk-endscreen pk-hidden" id="pkEndScreen">
      <h2 id="pkEndTitle">🌾 Selesai</h2>
      <p id="pkEndDesc"></p>
      <button class="pk-start-btn" id="pkReplayBtn">↺ Ulangi Cerita</button>
    </div>
  </div>

  <div class="pk-bottombar">
    <div class="pk-dots" id="pkDots"></div>
  </div>
  <div class="pk-footer">Kisah rakyat &middot; <a href="https://caritasato.blogspot.com/" target="_blank" rel="noopener">caritasato.blogspot.com</a></div>
</div>

<script>
(function(){
  "use strict";

  var TOTAL_STAGES = 7;

  var urlParams = new URLSearchParams(window.location.search);
  var lang = urlParams.get("lang") === "en" ? "en" : "id";

  var muted = localStorage.getItem(MUTE_KEY) === "1";

  /* ===================== TEXT CONTENT ===================== */
  var T = {
    id: {
      title: "Pelikan Desa Kabrau",

      blowHint: "Tahan tombol untuk meniup seruling ajaib!",
      blowBtn: "Tiup Seruling",

      blow3Btn: "Mainkan Lagi",
      endDesc: "Pelikan dan penduduk Desa Kabrau sadar bahwa keserakahan hanya akan membuat berkah pergi. Bersyukur atas apa yang telah dimiliki adalah kunci kebahagiaan.",
      stage: [

        "Setelah sekian lama terbang, Pelikan hinggap di sebuah padang rumput. Ada sesuatu tersembunyi di antara rerumputan itu. Coba cari benda itu!",
        "Pelikan menemukan sebuah seruling tergeletak di tanah. Ia merasa penasaran dengan seruling itu, lalu mengambil dan meniupnya.",
        "Ajaib! Ternyata dari dalam seruling itu keluar butiran gandum. Pelikan pun merasa sangat senang dan segera terbang kembali ke Desa Kabrau membawa seruling ajaib itu.",
        "Sesampainya di desa, Pelikan menemui kepala suku dan menceritakan seruling ajaib itu. Kepala suku pun menabuh genderang untuk mengumpulkan seluruh penduduk desa.",
        "Setelah penduduk berkumpul, Pelikan memainkan seruling ajaibnya. Butiran-butiran gandum keluar dari seruling itu, dan penduduk desa beramai-ramai menampungnya ke dalam karung. Lumbung gandum Desa Kabrau pun penuh, dan semua pulang dengan hati gembira.",
        "Keesokan harinya, penduduk desa kembali berkumpul di depan rumah Pelikan. Meski lumbung telah penuh, mereka meminta Pelikan memainkan seruling sekali lagi. Nampaknya mereka belum merasa puas."
      ],
      stageExtra: [
        "",

        "Pelikan masuk ke rumahnya untuk mengambil seruling ajaib, namun ternyata seruling itu telah hilang! \"Aku tahu ke mana perginya seruling ajaib itu,\" gumam Pelikan. Ia pun terbang kembali ke tempat pertama kali ditemukannya seruling itu."
      ],
      stage9: "Ternyata seruling ajaib telah kembali ke tempat asalnya. Pelikan pun mengambil dan membawanya kembali ke Desa Kabrau untuk memenuhi permintaan warga sekali lagi.",
      stage10: "Setibanya di depan para penduduk desa, Pelikan langsung memainkan seruling ajaib. Namun aneh, kali ini yang keluar adalah batu-batu kerikil!",

    },
    en: {
      title: "The Pelican of Kabrau Village",
      startTitle: "🐦 The Pelican of Kabrau Village",
      startDesc: "A folktale from Central Africa about a kind pelican and a magic flute.",
      startBtn: "▶ Start Story",
      replayBtn: "↺ Replay Story",
      endTitle: "🌾 The End",
      next: "Continue",
      flyHint: "Tap the button repeatedly to make the Pelican fly far!",
      flyBtn: "Flap Wings!",
      findHint: "Tap the grass to find something...",
      blowHint: "Hold the button to blow the magic flute!",
      blowBtn: "Blow the Flute",
      drumHint: "Tap the drum to gather the villagers!",
      drumBtn: "Beat the Drum",
      blow2Hint: "Hold the button to fill the village barn with grain!",
      blow2Btn: "Play the Flute",
      blow3Hint: "The villagers are asking you to play it once more...",
      blow3Btn: "Play Again",
      endDesc: "The Pelican and the people of Kabrau Village realized that greed only drives blessings away. Being grateful for what we already have is the key to happiness.",
      stage: [
        "The Pelican was a bird that could fly far and wide. Long ago, there lived a pelican from Kabrau Village. At that time, Kabrau Village was struck by a terrible famine. The Pelican wanted very much to help his fellow villagers.",

        "After flying for a long time, the Pelican landed on a grassy field. Something was hidden among the grass. Try to find it!",
        "The Pelican found a flute lying on the ground. Curious about it, he picked it up and blew into it.",
        "Amazingly, grains of wheat came pouring out of the flute! The Pelican was overjoyed and flew straight back to Kabrau Village, carrying the magic flute with him.",
        "Once he arrived, the Pelican met the village chief and told him about the magic flute. The chief then beat the drum to gather all the villagers.",
        "Once everyone had gathered, the Pelican played the magic flute. Grains of wheat poured out, and the villagers rushed to fill their sacks with them. The village granary became full, and everyone went home with joyful hearts.",
        "The next day, the villagers gathered again in front of the Pelican's house. Even though the granary was already full, they asked the Pelican to play the flute once more. It seemed they were still not satisfied."
      ],
      stageExtra: [
        "",
        "",
        "",
        "",

        "",

        "The Pelican went inside his house to fetch the magic flute, but it was gone! \"I know where the magic flute has gone,\" the Pelican murmured. He flew back to the very place where he had first found it."
      ],
      stage9: "Sure enough, the magic flute had returned to its original spot. The Pelican picked it up and carried it back to Kabrau Village to fulfill the villagers' request once more.",
      stage10: "Once he stood before the villagers, the Pelican played the magic flute right away. But strangely, this time small stones came pouring out instead!",
      stage11: "The villagers cried out in pain as the stones struck them, and they scattered away from the Pelican's house. At last, the Pelican and the villagers realized they had been too greedy, and it had made the magic flute angry."
    }
  };

  /* ===================== DOM REFS ===================== */
  var canvas = document.getElementById("pkCanvas");
  var ctx = canvas.getContext("2d");
  var stageEl = document.getElementById("pkStage");
  var narrationBox = document.getElementById("pkNarrationBox");
  var actionBtn = document.getElementById("pkActionBtn");
  var hintEl = document.getElementById("pkHint");
  var progressWrap = document.getElementById("pkProgressWrap");
  var progressBar = document.getElementById("pkProgressBar");
  var dotsWrap = document.getElementById("pkDots");
  var startScreen = document.getElementById("pkStartScreen");
  var endScreen = document.getElementById("pkEndScreen");
  var startBtn = document.getElementById("pkStartBtn");
  var replayBtn = document.getElementById("pkReplayBtn");
  var muteBtn = document.getElementById("pkMuteBtn");
  var langBtn = document.getElementById("pkLangBtn");
  var langIdBtn = document.getElementById("pkLangIdBtn");
  var langEnBtn = document.getElementById("pkLangEnBtn");

  /* ===================== CANVAS SIZE ===================== */
  var W = 700, H = 438;
  function fitCanvas(){
    var rect = stageEl.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W = rect.width; H = rect.height;
    draw();
  }
  window.addEventListener("resize", fitCanvas);

  /* ===================== IFRAME AUTO-RESIZE ===================== */
  function sendResize(){
    var h = document.getElementById("pkWrap").scrollHeight;
    try {
      window.parent.postMessage({ key: RESIZE_KEY, height: h }, "*");
    } catch(e) {}
  }
  window.addEventListener("load", function(){ setTimeout(sendResize, 250); });

  /* ===================== NARRATION (WEB SPEECH API) ===================== */
  var synth = window.speechSynthesis;
  var voices = [];
  function loadVoices(){ voices = synth ? synth.getVoices() : []; }
  if (synth) {
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  }
  function pickVoice(targetLang){
    if (!voices || !voices.length) return null;
    var prefix = targetLang === "en" ? "en" : "id";
    var v = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; });
    return v || null;
  }
  function narrate(text){
    narrationBox.textContent = text;
    if (!synth || muted || !text) return;
    synth.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang === "en" ? "en-US" : "id-ID";
    var v = pickVoice(lang);
    if (v) utter.voice = v;
    utter.rate = 0.95;
    utter.pitch = 1.05;
    synth.speak(utter);
  }
  function stopNarration(){ if (synth) synth.cancel(); }

  /* ===================== MUTE TOGGLE ===================== */
  function applyMuteUI(){
    muteBtn.textContent = muted ? "🔇" : "🔊";
    if (muted) stopNarration();
  }
  muteBtn.addEventListener("click", function(){
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
    applyMuteUI();
  });
  applyMuteUI();

  /* ===================== LANG TOGGLE ===================== */
  function applyLangUI(){
    langBtn.textContent = lang === "en" ? "ID" : "EN";
    langIdBtn.classList.toggle("pk-lang-active", lang === "id");
    langEnBtn.classList.toggle("pk-lang-active", lang === "en");
    document.getElementById("pkTitle").textContent = T[lang].title;
    document.getElementById("pkStartTitle").textContent = T[lang].startTitle;
    document.getElementById("pkStartDesc").textContent = T[lang].startDesc;
    document.getElementById("pkStartBtn").textContent = T[lang].startBtn;
    document.getElementById("pkReplayBtn").textContent = T[lang].replayBtn;
    document.title = T[lang].title;
  }
  function setLang(l){
    lang = l;
    applyLangUI();
  }
  langBtn.addEventListener("click", function(){ setLang(lang === "en" ? "id" : "en"); refreshStageTexts(); });
  langIdBtn.addEventListener("click", function(){ setLang("id"); refreshStageTexts(); });
  langEnBtn.addEventListener("click", function(){ setLang("en"); refreshStageTexts(); });
  applyLangUI();

  /* ===================== STATE ===================== */
  var stageIndex = 0;       // 0..6 -> 7 dots
  var phase = "start";      // start | s0..s6 | end
  var flapAngle = 0;
  var idleAnim = true;
  var particles = [];
  var villagers = [];       // {x,y,scared}
  var grainInBarn = 0;      // 0..1
  var fluteFound = false;
  var holdTimer = null;
  var progressVal = 0;      // 0..100 generic
  var flutePos = { x: 0.62, y: 0.72 };
  var lostFlute = false;

  /* ===================== DOTS ===================== */
  function buildDots(){
    dotsWrap.innerHTML = "";
    for (var i=0;i<TOTAL_STAGES;i++){
      var d = document.createElement("div");
      d.className = "pk-dot";
      dotsWrap.appendChild(d);
    }
  }
  function updateDots(){
    var els = dotsWrap.children;
    for (var i=0;i<els.length;i++){
      els[i].className = "pk-dot" + (i < stageIndex ? " pk-done" : (i === stageIndex ? " pk-active" : ""));
    }
  }
  buildDots();

  /* ===================== DRAWING HELPERS ===================== */
  function lerp(a,b,t){ return a+(b-a)*t; }

  function drawSky(dry){
    var g = ctx.createLinearGradient(0,0,0,H);
    if (dry){
      g.addColorStop(0,"#ffd98a");
      g.addColorStop(1,"#ffb35c");
    } else {
      g.addColorStop(0,"#bfe6ff");
      g.addColorStop(1,"#e8f7ff");
    }
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    // sun
    ctx.fillStyle = "rgba(255,235,150,0.9)";
    ctx.beginPath();
    ctx.arc(W*0.85, H*0.18, W*0.06, 0, Math.PI*2);
    ctx.fill();
  }

  function drawCloud(x,y,scale){
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.ellipse(x,y,28*scale,14*scale,0,0,Math.PI*2);
    ctx.ellipse(x+22*scale,y+4*scale,20*scale,11*scale,0,0,Math.PI*2);
    ctx.ellipse(x-22*scale,y+5*scale,18*scale,10*scale,0,0,Math.PI*2);
    ctx.fill();
  }

  function drawGround(dry){
    var gy = H*0.68;
    ctx.fillStyle = dry ? "#c98f4a" : "#b3823f";
    ctx.fillRect(0,gy,W,H-gy);
    // texture lines / cracks
    ctx.strokeStyle = dry ? "rgba(90,50,10,0.35)" : "rgba(80,50,15,0.2)";
    ctx.lineWidth = 1.4;
    for (var i=0;i<14;i++){
      var x = (i/14)*W + (i%3)*10;
      ctx.beginPath();
      ctx.moveTo(x, gy + 8 + (i%3)*6);
      ctx.lineTo(x + 18, gy + 26 + (i%2)*10);
      ctx.stroke();
    }
  }

  function drawGrassTuft(x,y,scale){
    ctx.strokeStyle = "#5f8a35";
    ctx.lineWidth = 2.5;
    for (var i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(x + i*3*scale, y);
      ctx.quadraticCurveTo(x + i*5*scale, y - 16*scale, x + i*2*scale, y - 26*scale);
      ctx.stroke();
    }
  }

  function drawHut(x,y,scale){
    ctx.fillStyle = "#c9a06a";
    ctx.fillRect(x-20*scale, y-22*scale, 40*scale, 24*scale);
    ctx.fillStyle = "#8a5a2b";
    ctx.beginPath();
    ctx.moveTo(x-26*scale, y-20*scale);
    ctx.lineTo(x, y-46*scale);
    ctx.lineTo(x+26*scale, y-20*scale);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#5c3a17";
    ctx.fillRect(x-5*scale, y-10*scale, 10*scale, 12*scale);
  }

  function drawVillage(dry){
    drawHut(W*0.14, H*0.66, 1.1);
    drawHut(W*0.26, H*0.63, 0.85);
    drawHut(W*0.88, H*0.65, 1);
  }

  function drawBarn(x,y,scale,fill){
    // silo/granary shape
    ctx.fillStyle = "#a97840";
    ctx.beginPath();
    ctx.ellipse(x, y-40*scale, 22*scale, 8*scale, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(x-22*scale, y-40*scale, 44*scale, 40*scale);
    ctx.beginPath();
    ctx.ellipse(x, y, 22*scale, 8*scale, 0, 0, Math.PI*2);
    ctx.fill();
    // fill level (grain visible through top opening)
    var maxFillH = 34*scale;
    var fh = maxFillH * Math.max(0,Math.min(1,fill));
    ctx.fillStyle = "#f2c246";
    ctx.beginPath();
    ctx.ellipse(x, y-40*scale + (maxFillH-fh), 18*scale, 6*scale, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(x-18*scale, y-40*scale + (maxFillH-fh), 36*scale, fh);
  }

  function drawPelican(x,y,scale,flap,facing){
    facing = facing || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale*facing, scale);
    // wing (back)
    ctx.fillStyle = "#e7e7e2";
    ctx.beginPath();
    var wingLift = Math.sin(flap)*14;
    ctx.moveTo(-4,-2);
    ctx.quadraticCurveTo(-30, -10 - wingLift, -34, 6 - wingLift*0.3);
    ctx.quadraticCurveTo(-16, 10, -4, 8);
    ctx.closePath();
    ctx.fill();
    // body
    ctx.fillStyle = "#f5f5f0";
    ctx.beginPath();
    ctx.ellipse(0,0,26,18,0,0,Math.PI*2);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.ellipse(24,-10,12,11,0,0,Math.PI*2);
    ctx.fill();
    // pouch/beak
    ctx.fillStyle = "#e8a33d";
    ctx.beginPath();
    ctx.moveTo(30,-8);
    ctx.quadraticCurveTo(52,-4,52,4);
    ctx.quadraticCurveTo(40,6,32,-2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#c47e1f";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // eye
    ctx.fillStyle = "#2b2b2b";
    ctx.beginPath();
    ctx.arc(27,-13,1.8,0,Math.PI*2);
    ctx.fill();
    // legs (only if grounded, scale hint via alpha)
    ctx.strokeStyle = "#e8a33d";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-4,16); ctx.lineTo(-6,26);
    ctx.moveTo(6,16); ctx.lineTo(8,26);
    ctx.stroke();
    ctx.restore();
  }

  function drawFlute(x,y,glow){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-0.5);
    if (glow){
      ctx.shadowColor = "#ffe08a";
      ctx.shadowBlur = 18;
    }
    ctx.fillStyle = "#8a5a2b";
    ctx.fillRect(-30,-4,60,8);
    ctx.fillStyle = "#5c3a17";
    for (var i=-20;i<=20;i+=10){
      ctx.fillRect(i-1,-4,2,8);
    }
    ctx.restore();
  }

  function drawDrum(x,y,hit){
    ctx.save();
    ctx.translate(x,y + (hit? -4:0));
    ctx.fillStyle = "#7a4a1e";
    ctx.beginPath();
    ctx.ellipse(0,30,30,10,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillRect(-30,-10,60,40);
    ctx.fillStyle = "#e9c98a";
    ctx.beginPath();
    ctx.ellipse(0,-10,30,10,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#5c3a17";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawVillager(x,y,scared,seed){
    var bob = Math.sin(Date.now()/300 + seed) * (scared?4:1.5);
    ctx.save();
    ctx.translate(x, y+bob);
    var colors = ["#c1481c","#3f7d4a","#3a5ba0","#a0743a","#7a4a9c"];
    ctx.fillStyle = colors[seed % colors.length];
    ctx.beginPath();
    ctx.ellipse(0,4,7,12,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#5c3a22";
    ctx.beginPath();
    ctx.arc(0,-10,6,0,Math.PI*2);
    ctx.fill();
    if (scared){
      ctx.strokeStyle="#2b2b2b"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(-4,-18); ctx.lineTo(0,-24); ctx.lineTo(4,-18); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(){
    particles.forEach(function(p){
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.type === "grain"){
        ctx.fillStyle = "#f2c246";
        ctx.beginPath();
        ctx.ellipse(p.x,p.y,3.5,2.2,p.rot,0,Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#8a8a8a";
        ctx.beginPath();
        ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
  }
  function stepParticles(){
    particles.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life -= 0.02;
    });
    particles = particles.filter(function(p){ return p.life > 0 && p.y < H+20; });
  }
  function spawnParticles(x,y,type,count){
    for (var i=0;i<count;i++){
      particles.push({
        x: x + (Math.random()-0.5)*10,
        y: y,
        vx: (Math.random()-0.5)*3,
        vy: -2 - Math.random()*2,
        rot: Math.random()*Math.PI,
        life: 1,
        type: type
      });
    }
  }

  /* ===================== SCENES PER STAGE ===================== */
  function draw(){
    ctx.clearRect(0,0,W,H);
    switch(stageIndex){
      case 0: sceneIntro(); break;
      case 1: sceneFly(); break;
      case 2: sceneFind(); break;
      case 3: sceneBlow(); break;
      case 4: sceneDrum(); break;
      case 5: sceneBarn(); break;
      case 6: sceneStones(); break;
      default: sceneIntro();
    }
    stepParticles();
    drawParticles();
    if (idleAnim){
      flapAngle += 0.09;
      requestAnimationFrame(draw);
    }
  }

  function sceneIntro(){
    drawSky(true);
    drawCloud(W*0.2,H*0.15,1);
    drawGround(true);
    drawVillage(true);
    drawGrassTuft(W*0.45,H*0.72,1);
    drawGrassTuft(W*0.55,H*0.75,0.8);
    drawPelican(W*0.65,H*0.52,1.4,flapAngle);
  }

  function sceneFly(){
    drawSky(false);
    drawCloud(W*0.25,H*0.2,1.2);
    drawCloud(W*0.6,H*0.12,0.8);
    drawCloud(W*0.8,H*0.3,1);
    // savanna ground far below
    ctx.fillStyle = "#d7b06a";
    ctx.fillRect(0,H*0.82,W,H*0.18);
    var flyX = lerp(W*0.1, W*0.85, progressVal/100);
    var bob = Math.sin(Date.now()/220)*8;
    drawPelican(flyX, H*0.45+bob, 1.5, flapAngle, 1);
  }

  function sceneFind(){
    drawSky(false);
    drawCloud(W*0.15,H*0.15,0.9);
    drawGround(false);
    for (var i=0;i<6;i++){
      drawGrassTuft(W*(0.1+i*0.15), H*0.78 + (i%2)*10, 1);
    }
    if (!fluteFound){
      drawFlute(W*flutePos.x, H*flutePos.y, true);
    }
    drawPelican(W*0.25, H*0.55, 1.3, flapAngle);
  }

  function sceneBlow(){
    drawSky(false);
    drawGround(false);
    drawGrassTuft(W*0.15,H*0.78,1);
    drawGrassTuft(W*0.85,H*0.78,1);
    drawPelican(W*0.4, H*0.5, 1.5, flapAngle);
    drawFlute(W*0.62, H*0.5, false);
  }

  function sceneDrum(){
    drawSky(true);
    drawGround(true);
    drawVillage(true);
    drawDrum(W*0.28, H*0.62, holdTimer!==null);
    drawPelican(W*0.68, H*0.42, 1.3, flapAngle);
    villagers.forEach(function(v,i){ drawVillager(v.x, v.y, false, i); });
  }

  function sceneBarn(){
    drawSky(true);
    drawGround(true);
    drawBarn(W*0.16, H*0.72, 1.4, grainInBarn);
    drawPelican(W*0.55, H*0.42, 1.5, flapAngle);
    drawFlute(W*0.68, H*0.5, false);
    villagers.forEach(function(v,i){ drawVillager(v.x, v.y, false, i); });
  }

  function sceneStones(){
    drawSky(true);
    drawGround(true);
    drawBarn(W*0.14, H*0.74, 1.1, 1);
    drawPelican(W*0.5, H*0.4, 1.4, flapAngle);
    drawFlute(W*0.63, H*0.48, false);
    villagers.forEach(function(v,i){ drawVillager(v.x, v.y, v.scared, i); });
  }

  /* ===================== INTERACTION SETUP PER STAGE ===================== */
  function clearOverlay(){
    actionBtn.classList.add("pk-hidden");
    hintEl.classList.add("pk-hidden");
    progressWrap.classList.add("pk-hidden");
    progressBar.style.width = "0%";
    actionBtn.onclick = null;
    canvas.onclick = null;
    actionBtn.onpointerdown = null;
    actionBtn.onpointerup = null;
    actionBtn.onpointerleave = null;
    if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
  }

  function goToStage(i){
    stageIndex = i;
    updateDots();
    clearOverlay();
    progressVal = 0;
    if (i === 0) setupIntro();
    else if (i === 1) setupFly();
    else if (i === 2) setupFind();
    else if (i === 3) setupBlow();
    else if (i === 4) setupDrum();
    else if (i === 5) setupBarn();
    else if (i === 6) setupStones();
    draw();
    setTimeout(sendResize, 150);
  }

  function setupIntro(){
    narrate(T[lang].stage[0]);
    actionBtn.textContent = T[lang].next;
    actionBtn.classList.remove("pk-hidden");
    actionBtn.onclick = function(){ goToStage(1); };
  }

  function setupFly(){
    narrate(T[lang].stage[1]);
    hintEl.textContent = T[lang].flyHint;
    hintEl.classList.remove("pk-hidden");
    progressWrap.classList.remove("pk-hidden");
    actionBtn.textContent = T[lang].flyBtn;
    actionBtn.classList.remove("pk-hidden");
    actionBtn.onclick = function(){
      progressVal = Math.min(100, progressVal + 9);
      progressBar.style.width = progressVal + "%";
      if (progressVal >= 100){
        setTimeout(function(){ goToStage(2); }, 300);
      }
    };
  }

  function setupFind(){
    fluteFound = false;
    flutePos.x = 0.35 + Math.random()*0.4;
    flutePos.y = 0.68 + Math.random()*0.12;
    narrate(T[lang].stage[2]);
    hintEl.textContent = T[lang].findHint;
    hintEl.classList.remove("pk-hidden");
    canvas.onclick = function(evt){
      if (fluteFound) return;
      var rect = canvas.getBoundingClientRect();
      var cx = evt.clientX - rect.left;
      var cy = evt.clientY - rect.top;
      var fx = flutePos.x * W, fy = flutePos.y * H;
      var dist = Math.hypot(cx-fx, cy-fy);
      if (dist < 45){
        fluteFound = true;
        hintEl.classList.add("pk-hidden");
        narrate(T[lang].stage[3]);
        setTimeout(function(){ goToStage(3); }, 900);
      }
    };
  }

  function setupBlow(){
    narrate(T[lang].stage[4]);
    hintEl.textContent = T[lang].blowHint;
    hintEl.classList.remove("pk-hidden");
    progressWrap.classList.remove("pk-hidden");
    actionBtn.textContent = T[lang].blowBtn;
    actionBtn.classList.remove("pk-hidden");
    var advancing = false;
    function startHold(){
      if (holdTimer) return;
      holdTimer = setInterval(function(){
        progressVal = Math.min(100, progressVal + 3);
        progressBar.style.width = progressVal + "%";
        spawnParticles(W*0.62, H*0.5, "grain", 1);
        if (progressVal >= 100){
          clearInterval(holdTimer); holdTimer = null;
          setTimeout(function(){ goToStage(4); }, 500);
        }
      }, 90);
    }
    function stopHold(){ if (holdTimer){ clearInterval(holdTimer); holdTimer = null; } }
    actionBtn.onpointerdown = startHold;
    actionBtn.onpointerup = stopHold;
    actionBtn.onpointerleave = stopHold;
  }

  function setupDrum(){
    villagers = [];
    narrate(T[lang].stage[5]);
    hintEl.textContent = T[lang].drumHint;
    hintEl.classList.remove("pk-hidden");
    progressWrap.classList.remove("pk-hidden");
    actionBtn.textContent = T[lang].drumBtn;
    actionBtn.classList.remove("pk-hidden");
    var count = 0;
    var target = 6;
    actionBtn.onclick = function(){
      count++;
      progressVal = Math.min(100, (count/target)*100);
      progressBar.style.width = progressVal + "%";
      var idx = villagers.length;
      if (villagers.length < target){
        villagers.push({ x: W*(0.45 + (idx%3)*0.13), y: H*(0.7 + Math.floor(idx/3)*0.1) });
      }
      draw();
      if (count >= target){
        setTimeout(function(){ goToStage(5); }, 500);
      }
    };
  }

  function setupBarn(){
    grainInBarn = 0;
    narrate(T[lang].stage[6]);
    hintEl.textContent = T[lang].blow2Hint;
    hintEl.classList.remove("pk-hidden");
    progressWrap.classList.remove("pk-hidden");
    actionBtn.textContent = T[lang].blow2Btn;
    actionBtn.classList.remove("pk-hidden");
    // ensure villagers persist visually near barn
    villagers = villagers.map(function(v,i){ return { x: W*(0.6+ (i%3)*0.1), y: H*(0.75 + Math.floor(i/3)*0.08) }; });
    function startHold(){
      if (holdTimer) return;
      holdTimer = setInterval(function(){
        progressVal = Math.min(100, progressVal + 2.5);
        grainInBarn = progressVal/100;
        progressBar.style.width = progressVal + "%";
        spawnParticles(W*0.68, H*0.5, "grain", 1);
        if (progressVal >= 100){
          clearInterval(holdTimer); holdTimer = null;
          setTimeout(function(){ goToGreedyThenStones(); }, 600);
        }
      }, 80);
    }
    function stopHold(){ if (holdTimer){ clearInterval(holdTimer); holdTimer = null; } }
    actionBtn.onpointerdown = startHold;
    actionBtn.onpointerup = stopHold;
    actionBtn.onpointerleave = stopHold;
  }

  // Stage 6 (index 6) covers: greedy request -> flute missing -> re-find -> play stones -> ending
  var stage6Sub = 0;
  function goToGreedyThenStones(){
    stageIndex = 6;
    updateDots();
    stage6Sub = 0;
    setupStones();
    draw();
  }

  function setupStones(){
    clearOverlay();
    if (stage6Sub === 0){
      narrate(T[lang].stage[7]);
      actionBtn.textContent = T[lang].next;
      actionBtn.classList.remove("pk-hidden");
      actionBtn.onclick = function(){ stage6Sub = 1; setupStones(); };
    } else if (stage6Sub === 1){
      narrate(T[lang].stageExtra[7]);
      actionBtn.textContent = T[lang].next;
      actionBtn.classList.remove("pk-hidden");
      actionBtn.onclick = function(){ stage6Sub = 2; fluteFound = false; setupStonesFind(); };
    }
  }

  function setupStonesFind(){
    clearOverlay();
    hintEl.textContent = T[lang].findHint;
    hintEl.classList.remove("pk-hidden");
    flutePos.x = 0.35 + Math.random()*0.4;
    flutePos.y = 0.68 + Math.random()*0.1;
    draw();
    canvas.onclick = function(evt){
      if (fluteFound) return;
      var rect = canvas.getBoundingClientRect();
      var cx = evt.clientX - rect.left;
      var cy = evt.clientY - rect.top;
      var fx = flutePos.x * W, fy = flutePos.y * H;
      var dist = Math.hypot(cx-fx, cy-fy);
      if (dist < 45){
        fluteFound = true;
        hintEl.classList.add("pk-hidden");
        narrate(T[lang].stage9);
        stage6Sub = 3;
        setTimeout(setupStonesPlay, 1200);
      }
    };
    // override scene drawing temporarily to reuse find-like layout on savanna ground
    stageIndex = 6;
    sceneOverride = "find";
    draw();
  }

  var sceneOverride = null;
  var origSceneStones = sceneStones;
  sceneStones = function(){
    if (sceneOverride === "find"){
      drawSky(false);
      drawGround(false);
      for (var i=0;i<6;i++){ drawGrassTuft(W*(0.1+i*0.15), H*0.78 + (i%2)*10, 1); }
      if (!fluteFound) drawFlute(W*flutePos.x, H*flutePos.y, true);
      drawPelican(W*0.25, H*0.55, 1.3, flapAngle);
    } else {
      origSceneStones();
    }
  };

  function setupStonesPlay(){
    sceneOverride = null;
    clearOverlay();
    narrate(T[lang].stage10);
    hintEl.textContent = T[lang].blow3Hint;
    hintEl.classList.remove("pk-hidden");
    progressWrap.classList.remove("pk-hidden");
    actionBtn.textContent = T[lang].blow3Btn;
    actionBtn.classList.remove("pk-hidden");
    villagers = [
      {x:W*0.62,y:H*0.7,scared:false},
      {x:W*0.72,y:H*0.75,scared:false},
      {x:W*0.8,y:H*0.68,scared:false},
      {x:W*0.68,y:H*0.82,scared:false}
    ];
    draw();
    function startHold(){
      if (holdTimer) return;
      holdTimer = setInterval(function(){
        progressVal = Math.min(100, progressVal + 3.2);
        progressBar.style.width = progressVal + "%";
        spawnParticles(W*0.63, H*0.48, "stone", 1);
        if (progressVal > 40){
          villagers.forEach(function(v){ v.scared = true; v.x += (Math.random()-0.5)*6; v.y += (Math.random()-0.5)*2; });
        }
        if (progressVal >= 100){
          clearInterval(holdTimer); holdTimer = null;
          narrate(T[lang].stage11);
          setTimeout(showEnding, 1400);
        }
      }, 90);
    }
    function stopHold(){ if (holdTimer){ clearInterval(holdTimer); holdTimer = null; } }
    actionBtn.onpointerdown = startHold;
    actionBtn.onpointerup = stopHold;
    actionBtn.onpointerleave = stopHold;
  }

  function showEnding(){
    clearOverlay();
    idleAnim = false;
    document.getElementById("pkEndTitle").textContent = T[lang].endTitle;
    document.getElementById("pkEndDesc").textContent = T[lang].endDesc;
    endScreen.classList.remove("pk-hidden");
    updateDotsAllDone();
    setTimeout(sendResize, 150);
  }
  function updateDotsAllDone(){
    var els = dotsWrap.children;
    for (var i=0;i<els.length;i++){ els[i].className = "pk-dot pk-done"; }
  }

  function refreshStageTexts(){
    // Re-trigger narration/UI text for current phase without resetting progress drastically
    if (!endScreen.classList.contains("pk-hidden")){
      document.getElementById("pkEndTitle").textContent = T[lang].endTitle;
      document.getElementById("pkEndDesc").textContent = T[lang].endDesc;
      return;
    }
    if (startScreen.classList.contains("pk-hidden")){
      // re-run current setup to refresh hint/action labels + narration
      if (stageIndex === 0) setupIntro();
      else if (stageIndex === 1) setupFly();
      else if (stageIndex === 2) setupFind();
      else if (stageIndex === 3) setupBlow();
      else if (stageIndex === 4) setupDrum();
      else if (stageIndex === 5) setupBarn();
      else if (stageIndex === 6) setupStones();
    }
  }

  /* ===================== START / REPLAY ===================== */
  function startGame(){
    startScreen.classList.add("pk-hidden");
    idleAnim = true;
    fitCanvas();
    goToStage(0);
    draw();
  }
  startBtn.addEventListener("click", startGame);
  replayBtn.addEventListener("click", function(){
    endScreen.classList.add("pk-hidden");
    grainInBarn = 0;
    villagers = [];
    fluteFound = false;
    stage6Sub = 0;
    sceneOverride = null;
    startGame();
  });

  /* ===================== INIT ===================== */
  fitCanvas();
  drawSky(true); drawGround(true); drawVillage(true);
  drawPelican(W*0.6,H*0.5,1.4,0);
  window.addEventListener("message", function(){});
})();
</script>
</body>
</html>

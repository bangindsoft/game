<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Legenda Kolam Sampuraga</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Mulish:wght@400;600;700;800&display=swap');

  :root{
    --bg-deep:#241609;
    --panel:#3a2513;
    --panel-2:#28190c;
    --gold:#d9a441;
    --gold-light:#f0c869;
    --copper:#c1622e;
    --copper-light:#e8935a;
    --ember:#e0483e;
    --steam:#7fd9c4;
    --cream:#f5ecd8;
    --ink:#160d05;
    --font-display:'Cinzel', Georgia, 'Times New Roman', serif;
    --font-body:'Mulish', 'Segoe UI', system-ui, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0;
    background:transparent;
    font-family:var(--font-body);
  }

  .app{
    width:100%;
    max-width:820px;
    margin:0 auto;
    background:linear-gradient(180deg,var(--panel) 0%, var(--panel-2) 100%);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    color:var(--cream);
    border:1px solid rgba(217,164,65,0.25);
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:linear-gradient(90deg, rgba(217,164,65,0.14), rgba(217,164,65,0.02));
    border-bottom:1px solid rgba(217,164,65,0.25);
  }

  .title{
    font-family:var(--font-display);
    font-weight:700;
    letter-spacing:0.02em;
    font-size:clamp(15px,3.4vw,21px);
    color:var(--gold-light);
    text-shadow:0 1px 0 rgba(0,0,0,0.3);
  }

  .topbtns{display:flex; gap:8px;}

  .iconbtn{
    background:rgba(245,236,216,0.08);
    border:1px solid rgba(217,164,65,0.4);
    color:var(--cream);
    border-radius:10px;
    padding:7px 11px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.1s ease;
    min-width:40px;
  }
  .iconbtn:hover{background:rgba(217,164,65,0.22);}
  .iconbtn:active{transform:scale(0.95);}
  .iconbtn:focus-visible{outline:2px solid var(--gold-light); outline-offset:2px;}

  .stage{
    width:100%;
    background:#000;
    position:relative;
    line-height:0;
  }

  #gameCanvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:8/5;
    touch-action:none;
    cursor:pointer;
  }

  .instruction{
    margin:14px 16px 2px 16px;
    padding:10px 12px;
    background:rgba(217,164,65,0.12);
    border-left:3px solid var(--gold);
    border-radius:6px;
    font-size:14px;
    font-weight:700;
    color:var(--gold-light);
    min-height:20px;
  }

  .narration{
    margin:10px 16px 4px 16px;
    font-size:15px;
    line-height:1.55;
    color:var(--cream);
    min-height:24px;
  }

  .narration .extra{
    display:block;
    margin-top:8px;
    color:var(--copper-light);
    font-style:italic;
  }

  .dots{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    padding:6px 16px 4px 16px;
  }

  .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:rgba(245,236,216,0.2);
    border:1px solid rgba(217,164,65,0.4);
    transition:all 0.2s ease;
  }
  .dot.active{ background:var(--gold); width:22px; border-radius:5px; }
  .dot.done{ background:var(--copper); }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    padding:12px 16px 18px 16px;
  }

  .btn{
    font-family:var(--font-body);
    font-weight:800;
    font-size:14px;
    letter-spacing:0.01em;
    padding:12px 22px;
    border-radius:999px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform 0.1s ease, filter 0.15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn:focus-visible{outline:2px solid var(--gold-light); outline-offset:3px;}

  .btn-primary{
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#2b1f08;
  }
  .btn-primary:hover{filter:brightness(1.06);}

  .btn-secondary{
    background:rgba(245,236,216,0.06);
    color:var(--cream);
    border:1px solid rgba(217,164,65,0.45);
  }
  .btn-secondary:hover{background:rgba(217,164,65,0.16);}

  .progressWrap{
    width:100%;
    max-width:520px;
    margin:2px auto 0 auto;
    height:12px;
    background:rgba(245,236,216,0.12);
    border-radius:999px;
    overflow:hidden;
    border:1px solid rgba(217,164,65,0.35);
    display:none;
  }
  .progressWrap.show{display:block;}
  .progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--copper), var(--gold));
    transition:width 0.08s linear;
  }

  .footer{
    text-align:center;
    font-size:11.5px;
    color:rgba(245,236,216,0.55);
    padding:0 16px 14px 16px;
    letter-spacing:0.03em;
  }

  @media (max-width:420px){
    .btn{padding:11px 16px; font-size:13px;}
    .title{font-size:14px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="title" id="titleText">Legenda Kolam Sampuraga</div>
    <div class="topbtns">
      <button class="iconbtn" id="langBtn" type="button">EN</button>
      <button class="iconbtn" id="muteBtn" type="button">🔊</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div class="progressWrap" id="progressWrap"><div class="progressBar" id="progressBar"></div></div>
  <div class="instruction" id="instructionText"></div>
  <p class="narration" id="narrationText"></p>
  <div class="dots" id="dotsRow"></div>
  <div class="controls" id="controlsRow"></div>
  <div class="footer" id="footerText">Legenda Nusantara — Kisah dari Sumatera Utara</div>
</div>

<script>
(function(){
  "use strict";

  /* ============ STATE ============ */
  var qsLang = new URLSearchParams(location.search).get('lang');
  var lang = localStorage.getItem('sampuraga_lang') || qsLang || 'id';
  if(lang !== 'id' && lang !== 'en') lang = 'id';
  var muted = localStorage.getItem('sampuraga_muted') === '1';
  var phase = 'start'; // 'start' | 'scene'
  var sceneIndex = 0;
  var sceneState = {};
  var activeInterval = null;
  var rafId = null;
  var voicesCache = [];

  /* ============ DOM ============ */
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var titleText = document.getElementById('titleText');
  var langBtn = document.getElementById('langBtn');
  var muteBtn = document.getElementById('muteBtn');
  var instructionText = document.getElementById('instructionText');
  var narrationText = document.getElementById('narrationText');
  var dotsRow = document.getElementById('dotsRow');
  var controlsRow = document.getElementById('controlsRow');
  var footerText = document.getElementById('footerText');
  var progressWrap = document.getElementById('progressWrap');
  var progressBar = document.getElementById('progressBar');

  var W = 800, H = 500;

  /* ============ TEXT DICTIONARY ============ */
  var T = {
    title: {id:'Legenda Kolam Sampuraga', en:'The Legend of Kolam Sampuraga'},
    footer: {id:'Legenda Nusantara — Kisah dari Sumatera Utara', en:'Legends of the Archipelago — A Tale from North Sumatra'},
    startTitle: {id:'Legenda Kolam Sampuraga', en:'The Legend of Kolam Sampuraga'},
    startSub: {id:'Kisah Pemuda Durhaka dari Tanah Mandailing, Sumatera Utara', en:'The Tale of the Ungrateful Son from Mandailing, North Sumatra'},
    startInstruction: {id:'Ketuk tombol Mulai Cerita untuk memulai kisahnya.', en:'Tap the Start Story button to begin the tale.'},
    startBtn: {id:'Mulai Cerita ▶', en:'Start Story ▶'},
    nextBtn: {id:'Lanjut ▶', en:'Next ▶'},
    replayBtn: {id:'Ulangi Cerita ↺', en:'Replay Story ↺'}
  };

  /* ============ SCENES ============ */
  var scenes = [
    {
      id:'intro', type:'auto',
      narration:{
        id:'Di daerah Padang Lawas Utara, hiduplah seorang pemuda bernama Sampuraga bersama ibunya yang telah tua. Mereka berdua bekerja sebagai buruh tani dengan jujur dan rajin, meski hidup mereka sangat sederhana.',
        en:'In the region of Padang Lawas Utara, there lived a young man named Sampuraga together with his elderly mother. The two of them worked as farm laborers, honest and hardworking, though their life was very simple.'
      },
      instruction:{
        id:'Ketuk tombol Lanjut untuk melanjutkan kisah Sampuraga.',
        en:'Tap the Next button to continue Sampuraga\'s story.'
      },
      draw: drawIntroScene
    },
    {
      id:'tawaran', type:'tap',
      narration:{
        id:'Pemilik lahan sangat menyukai Sampuraga karena kejujuran dan kerajinannya dalam bekerja.',
        en:'The landowner was very fond of Sampuraga for his honesty and diligence in his work.'
      },
      instruction:{
        id:'Ketuk sang pemilik lahan untuk mendengar sarannya kepada Sampuraga.',
        en:'Tap the landowner to hear his advice to Sampuraga.'
      },
      extraText:{
        id:'"Sampuraga, pergilah merantau ke Mandailing untuk menjadi pendulang emas, agar hidupmu lebih sejahtera," kata sang pemilik lahan.',
        en:'"Sampuraga, go to Mandailing and become a gold panner, so your life may become more prosperous," said the landowner.'
      },
      target:{x:560, y:300, r:60},
      draw: drawTawaranScene
    },
    {
      id:'restu', type:'tap',
      narration:{
        id:'Sampuraga pulang dan menyampaikan kabar itu kepada ibunya. Ia ingin sekali mendapat pekerjaan yang layak agar bisa membahagiakan sang ibu.',
        en:'Sampuraga went home and told his mother the news. He longed to find a decent living so he could bring happiness to his mother.'
      },
      instruction:{
        id:'Ketuk ibu Sampuraga untuk meminta restu sebelum pergi merantau.',
        en:'Tap Sampuraga\'s mother to ask for her blessing before he leaves.'
      },
      extraText:{
        id:'"Pergilah, Nak. Ibu merestuimu. Ibu hanya ingin melihatmu hidup sejahtera," ucap sang ibu dengan wajah sedih menahan rindu.',
        en:'"Go, my child. You have my blessing. I only wish to see you live well," said the mother, her face heavy with sorrow.'
      },
      target:{x:250, y:310, r:58},
      draw: drawRestuScene
    },
    {
      id:'perjalanan', type:'hold',
      narration:{
        id:'Sampuraga berjalan jauh menuju Mandailing, beristirahat sejenak di Pidoli Lombang, sebelum akhirnya tiba di Desa Sirambas, wilayah yang dipimpin oleh Raja Silanjang.',
        en:'Sampuraga walked a long way toward Mandailing, resting briefly at Pidoli Lombang, before finally arriving at the village of Sirambas, ruled by King Silanjang.'
      },
      instruction:{
        id:'Tekan dan tahan jejak kaki untuk menemani Sampuraga berjalan menempuh perjalanan jauh.',
        en:'Press and hold the footprints to help Sampuraga walk the long journey.'
      },
      extraText:{
        id:'Sampuraga tiba dengan selamat di Desa Sirambas.',
        en:'Sampuraga arrived safely at the village of Sirambas.'
      },
      target:{x:400, y:400, r:64},
      draw: drawPerjalananScene
    },
    {
      id:'bekerja', type:'mash',
      narration:{
        id:'Di Sirambas, Sampuraga bekerja sebagai pendulang emas dengan tekun dan penuh kejujuran, sehingga ia menjadi anak buah yang disenangi oleh Raja Silanjang.',
        en:'In Sirambas, Sampuraga worked as a gold panner with diligence and honesty, and soon became a trusted worker favored by King Silanjang.'
      },
      instruction:{
        id:'Ketuk dulang emas berulang kali agar Sampuraga bekerja dengan tekun.',
        en:'Tap the gold pan repeatedly to help Sampuraga work diligently.'
      },
      extraText:{
        id:'Raja Silanjang begitu terkesan, hingga ia mempercayakan seluruh usaha dagangnya kepada Sampuraga. Sampuraga pun menjadi pemuda yang kaya raya.',
        en:'King Silanjang was so impressed that he entrusted his entire trading business to Sampuraga, who soon became a very wealthy young man.'
      },
      target:{x:400, y:360, r:70},
      draw: drawBekerjaScene
    },
    {
      id:'pernikahan', type:'auto',
      narration:{
        id:'Karena kagum dengan kepribadian Sampuraga, Raja Silanjang menikahkannya dengan sang putri yang cantik jelita. Pesta pernikahan itu dirayakan dengan sangat mewah dan megah.',
        en:'Impressed by Sampuraga\'s character, King Silanjang gave his beautiful daughter\'s hand in marriage to him. The wedding was celebrated with great splendor and grandeur.'
      },
      instruction:{
        id:'Ketuk tombol Lanjut untuk melanjutkan kisah Sampuraga.',
        en:'Tap the Next button to continue the story.'
      },
      draw: drawPernikahanScene
    },
    {
      id:'ibumencari', type:'hold',
      narration:{
        id:'Kabar pernikahan Sampuraga terdengar hingga ke kampung halamannya. Dengan penuh rindu, sang ibu menempuh perjalanan jauh dan melelahkan menuju Desa Sirambas untuk memastikan kabar itu.',
        en:'News of Sampuraga\'s marriage reached his home village. Full of longing, his mother made the long, exhausting journey to Sirambas to see if the news was true.'
      },
      instruction:{
        id:'Tekan dan tahan jejak kaki untuk menemani ibu menempuh perjalanan jauh mencari Sampuraga.',
        en:'Press and hold the footprints to help the mother travel the long journey to find Sampuraga.'
      },
      extraText:{
        id:'Setelah menempuh perjalanan yang jauh dan melelahkan, sang ibu pun tiba di tempat pesta pernikahan itu berlangsung.',
        en:'After a long and exhausting journey, the mother finally arrived at the place where the wedding celebration was being held.'
      },
      target:{x:400, y:400, r:64},
      draw: drawIbuMencariScene
    },
    {
      id:'penolakan', type:'tap',
      narration:{
        id:'Dengan pakaian lusuh, sang ibu mendekati pesta itu dan memanggil nama anaknya dengan bahagia. Namun Sampuraga merasa malu di hadapan para tamu undangannya.',
        en:'In her worn, tattered clothes, the mother approached the celebration and joyfully called out her son\'s name. But Sampuraga felt ashamed in front of his wedding guests.'
      },
      instruction:{
        id:'Ketuk Sampuraga untuk melihat bagaimana ia bersikap kepada ibunya sendiri.',
        en:'Tap Sampuraga to see how he treats his own mother.'
      },
      extraText:{
        id:'"Siapa kau, perempuan tua dan miskin?! Aku tidak mengenalimu! Ibuku sudah lama meninggal, pergi kau dari sini!" hardik Sampuraga tega mengusir ibu kandungnya di depan semua tamu.',
        en:'"Who are you, old and poor woman?! I don\'t know you! My mother has long passed away, get away from here!" Sampuraga cruelly shouted, driving away his own mother in front of all the guests.'
      },
      target:{x:330, y:290, r:56},
      draw: drawPenolakanScene
    },
    {
      id:'kutukan', type:'mash',
      narration:{
        id:'Dengan hati hancur dan air mata berlinang, sang ibu yang telah diusir keluar berdoa memohon keadilan kepada Tuhan atas perlakuan anaknya.',
        en:'With a broken heart and tears streaming down, the mother, driven away from the feast, prayed and begged heaven for justice over her son\'s cruel treatment.'
      },
      instruction:{
        id:'Ketuk tangan ibu yang menengadah berulang kali untuk mengucapkan doanya.',
        en:'Tap the mother\'s raised hands repeatedly as she speaks her prayer.'
      },
      extraText:{
        id:'Tak lama kemudian, langit menjadi gelap, angin bertiup kencang, dan air panas datang meluluhlantakkan seluruh tempat pesta pernikahan itu.',
        en:'Soon after, the sky darkened, the wind roared fiercely, and scalding hot water surged forth, sweeping away the entire wedding celebration.'
      },
      target:{x:400, y:330, r:66},
      draw: drawKutukanScene
    },
    {
      id:'ending', type:'auto',
      narration:{
        id:'Sampuraga hilang ditelan banjir air panas itu bersama seluruh pesta pernikahannya. Tempat itu kini berubah menjadi kolam air panas yang dikenal sebagai Kolam Sampuraga, di daerah Mandailing, Sumatera Utara — sebuah pengingat akan akibat durhaka kepada orang tua.',
        en:'Sampuraga vanished, swallowed by the scalding flood along with his entire wedding feast. The site turned into a hot spring now known as Kolam Sampuraga, in the Mandailing region of North Sumatra — a lasting reminder of the consequences of dishonoring one\'s parents.'
      },
      instruction:{
        id:'Ketuk tombol Ulangi Cerita untuk mendengar kisahnya kembali.',
        en:'Tap the Replay Story button to hear the tale again.'
      },
      draw: drawEndingScene
    }
  ];

  /* ============ UTIL ============ */
  function tr(dict){ return dict[lang] || dict.id; }
  function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function clearActiveInterval(){ if(activeInterval){ clearInterval(activeInterval); activeInterval = null; } }
  function clearRaf(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  function getPos(evt){
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    var cx = (evt.clientX !== undefined) ? evt.clientX : (evt.touches && evt.touches[0] ? evt.touches[0].clientX : 0);
    var cy = (evt.clientY !== undefined) ? evt.clientY : (evt.touches && evt.touches[0] ? evt.touches[0].clientY : 0);
    return { x:(cx - rect.left) * scaleX, y:(cy - rect.top) * scaleY };
  }

  function reportHeight(){
    try{
      var h = document.getElementById('app').scrollHeight;
      parent.postMessage({ type:'sampuragaResize', height:h }, '*');
    }catch(e){}
  }

  /* ============ SPEECH ============ */
  function loadVoices(){
    if('speechSynthesis' in window){ voicesCache = speechSynthesis.getVoices(); }
  }
  if('speechSynthesis' in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  } else {
    muteBtn.style.display = 'none';
  }

  function pickVoice(){
    if(!voicesCache || !voicesCache.length) return null;
    var target = lang === 'id' ? 'id' : 'en';
    var v = voicesCache.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(target) === 0; });
    return v || null;
  }

  function speak(text){
    if(muted || !text || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'id' ? 'id-ID' : 'en-US';
      var v = pickVoice();
      if(v) u.voice = v;
      u.rate = 0.94;
      u.pitch = 1.0;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  function stopSpeech(){
    if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }
  }

  /* ============ RENDER CHROME ============ */
  function renderChrome(){
    titleText.textContent = tr(T.title);
    footerText.textContent = tr(T.footer);
    langBtn.textContent = lang === 'id' ? 'EN' : 'ID';
    langBtn.setAttribute('aria-label', lang === 'id' ? 'Switch to English' : 'Ganti ke Bahasa Indonesia');
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? (lang==='id'?'Aktifkan suara':'Unmute narration') : (lang==='id'?'Bisukan suara':'Mute narration'));

    if(phase === 'start'){
      instructionText.textContent = tr(T.startInstruction);
      narrationText.innerHTML = '<strong style="color:var(--gold-light);font-family:var(--font-display);font-size:17px;">' + tr(T.startTitle) + '</strong><br>' + tr(T.startSub);
      dotsRow.style.display = 'none';
      progressWrap.classList.remove('show');
      renderStartControls();
      return;
    }

    dotsRow.style.display = 'flex';
    var sc = scenes[sceneIndex];
    instructionText.textContent = tr(sc.instruction);
    var html = tr(sc.narration);
    if(sceneState.extraShown && sc.extraText){
      html += '<span class="extra">' + tr(sc.extraText) + '</span>';
    }
    narrationText.innerHTML = html;
    renderDots();
    renderControlsForScene();
  }

  function renderDots(){
    dotsRow.innerHTML = '';
    for(var i=0;i<scenes.length;i++){
      var d = document.createElement('div');
      d.className = 'dot' + (i === sceneIndex ? ' active' : (i < sceneIndex ? ' done' : ''));
      dotsRow.appendChild(d);
    }
  }

  function makeBtn(label, cls, handler){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.addEventListener('click', handler);
    return b;
  }

  function renderStartControls(){
    controlsRow.innerHTML = '';
    controlsRow.appendChild(makeBtn(tr(T.startBtn), 'btn-primary', startStory));
  }

  function renderControlsForScene(){
    controlsRow.innerHTML = '';
    var sc = scenes[sceneIndex];

    if(sc.type === 'auto'){
      if(sceneIndex === scenes.length - 1){
        controlsRow.appendChild(makeBtn(tr(T.replayBtn), 'btn-primary', replayStory));
      } else {
        controlsRow.appendChild(makeBtn(tr(T.nextBtn), 'btn-primary', function(){ goToScene(sceneIndex + 1); }));
      }
      return;
    }

    if(sc.type === 'tap'){
      if(sceneState.tapped){
        controlsRow.appendChild(makeBtn(tr(T.nextBtn), 'btn-primary', function(){ goToScene(sceneIndex + 1); }));
      }
      return;
    }

    if(sc.type === 'mash'){
      if(sceneState.completed){
        controlsRow.appendChild(makeBtn(tr(T.nextBtn), 'btn-primary', function(){ goToScene(sceneIndex + 1); }));
      }
      return;
    }

    if(sc.type === 'hold'){
      if(sceneState.completed){
        controlsRow.appendChild(makeBtn(tr(T.nextBtn), 'btn-primary', function(){ goToScene(sceneIndex + 1); }));
      }
      return;
    }
  }

  function updateProgressUI(pct, show){
    progressWrap.classList.toggle('show', !!show);
    progressBar.style.width = clamp(pct,0,100) + '%';
  }

  /* ============ SCENE LIFECYCLE ============ */
  function startStory(){
    phase = 'scene';
    goToScene(0);
  }

  function replayStory(){
    goToScene(0);
  }

  function goToScene(idx){
    clearActiveInterval();
    clearRaf();
    stopSpeech();
    sceneIndex = idx;
    sceneState = createInitialState(scenes[idx]);
    phase = 'scene';
    updateProgressUI(0, false);
    drawCurrentScene();
    renderChrome();
    speak(tr(scenes[idx].narration));
    reportHeight();
  }

  function createInitialState(sc){
    var s = {};
    if(sc.type === 'tap'){
      s.tapped = false;
      s.extraShown = false;
      s.pulse = 0;
    } else if(sc.type === 'mash'){
      s.progress = 0;
      s.completed = false;
      s.extraShown = false;
      s.flash = 0;
    } else if(sc.type === 'hold'){
      s.holding = false;
      s.progress = 0;
      s.completed = false;
      s.extraShown = false;
    }
    return s;
  }

  function drawCurrentScene(){
    if(phase === 'start'){ drawStartScreen(ctx); return; }
    scenes[sceneIndex].draw(ctx, sceneState, scenes[sceneIndex]);
  }

  /* ============ INTERACTION: TAP ============ */
  function handleTapDown(p){
    var sc = scenes[sceneIndex];
    if(sc.type !== 'tap' || sceneState.tapped) return;
    var t = sc.target;
    if(dist(p.x,p.y,t.x,t.y) < t.r){
      sceneState.tapped = true;
      sceneState.extraShown = true;
      speak(tr(sc.extraText));
      drawCurrentScene();
      renderChrome();
    }
  }

  /* ============ INTERACTION: MASH ============ */
  function startMashDecay(){
    activeInterval = setInterval(function(){
      var sc = scenes[sceneIndex];
      if(!sc || sc.type !== 'mash' || sceneState.completed) return;
      sceneState.progress = clamp(sceneState.progress - 1.1, 0, 100);
      if(sceneState.flash > 0) sceneState.flash -= 0.12;
      updateProgressUI(sceneState.progress, true);
      drawCurrentScene();
    }, 140);
  }

  function handleMashDown(p){
    var sc = scenes[sceneIndex];
    if(sc.type !== 'mash' || sceneState.completed) return;
    var t = sc.target;
    if(dist(p.x,p.y,t.x,t.y) < t.r){
      sceneState.progress = clamp(sceneState.progress + 8.5, 0, 100);
      sceneState.flash = 1;
      updateProgressUI(sceneState.progress, true);
      if(sceneState.progress >= 100 && !sceneState.completed){
        sceneState.completed = true;
        sceneState.extraShown = true;
        clearActiveInterval();
        speak(tr(sc.extraText));
        renderChrome();
        drawCurrentScene();
      }
      drawCurrentScene();
    }
  }

  /* ============ INTERACTION: HOLD (JOURNEY) ============ */
  function handleHoldDown(p){
    var sc = scenes[sceneIndex];
    if(sc.type !== 'hold' || sceneState.completed) return;
    var t = sc.target;
    if(dist(p.x,p.y,t.x,t.y) < t.r){
      sceneState.holding = true;
      clearActiveInterval();
      activeInterval = setInterval(function(){
        if(!sceneState.holding || sceneState.completed) return;
        sceneState.progress = clamp(sceneState.progress + 2.6, 0, 100);
        updateProgressUI(sceneState.progress, true);
        drawCurrentScene();
        if(sceneState.progress >= 100){
          sceneState.completed = true;
          sceneState.holding = false;
          sceneState.extraShown = true;
          clearActiveInterval();
          speak(tr(sc.extraText));
          renderChrome();
          drawCurrentScene();
        }
      }, 80);
    }
  }

  function handleHoldUp(){
    var sc = scenes[sceneIndex];
    if(sc.type !== 'hold') return;
    sceneState.holding = false;
    if(!sceneState.completed){
      clearActiveInterval();
      activeInterval = setInterval(function(){
        sceneState.progress = clamp(sceneState.progress - 1.8, 0, 100);
        updateProgressUI(sceneState.progress, true);
        drawCurrentScene();
        if(sceneState.progress <= 0){ clearActiveInterval(); }
      }, 80);
    }
  }

  /* ============ POINTER WIRING ============ */
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var p = getPos(e);
    if(phase !== 'scene') return;
    var type = scenes[sceneIndex].type;
    if(type === 'tap') handleTapDown(p);
    else if(type === 'mash') handleMashDown(p);
    else if(type === 'hold') handleHoldDown(p);
  });

  window.addEventListener('pointerup', function(e){
    if(phase !== 'scene') return;
    var type = scenes[sceneIndex].type;
    if(type === 'hold') handleHoldUp();
  });

  canvas.addEventListener('pointerleave', function(){
    if(phase !== 'scene') return;
    if(scenes[sceneIndex].type === 'hold' && sceneState.holding){
      handleHoldUp();
    }
  });

      c.beginPath();
      c.ellipse(toeOffsets[i], -12 + (i===1||i===2?-1:0), toeSizes[i], toeSizes[i]*1.15, 0, 0, Math.PI*2);
      c.fill(); c.stroke();
    }
    c.restore();
  }

  function drawWalkTapHint(c, x, y){
    c.save();
    drawFootIcon(c, x-7, y+6, 1.15);
    drawFootIcon(c, x+7, y-8, 1.15);
    c.restore();
  }

  function drawTapHint(c, x, y, r, pulse){
    pulse = pulse || 0;
    c.save();
    c.strokeStyle = 'rgba(240,200,105,' + (0.6 - pulse*0.4) + ')';
    c.lineWidth = 3;
    c.setLineDash([6,6]);
    c.beginPath();
    c.arc(x,y,r + pulse*14,0,Math.PI*2);
    c.stroke();
    c.restore();
  }

  function drawFootpath(c, startX, startY, endX, endY, progress){
    var n = 7;
    c.save();
    for(var i=0;i<n;i++){
      var t = i/(n-1);
      if(t*100 > progress + 6) continue;
      var fx = startX + (endX-startX)*t;
      var fy = startY + (endY-startY)*t;
      c.save();
      c.translate(fx,fy);
      c.rotate((i%2===0? -0.3 : 0.3));
      c.fillStyle = 'rgba(60,40,20,0.4)';
      c.beginPath();
      c.ellipse(0,0,6,10,0,0,Math.PI*2);
      c.fill();
      c.restore();
    }
    c.restore();
  }

  function drawWalker(c, startX, startY, endX, endY, progress, drawer, opts){
    var t = clamp(progress/100, 0, 1);
    var x = startX + (endX-startX)*t;
    var y = startY + (endY-startY)*t;
    var scale = 0.75 + 0.35*t;
    var bob = Math.sin(Date.now()/140) * (progress>0 && progress<100 ? 3 : 0);
    drawer(c, x, y+bob, scale, opts);
  }

  function drawSignpost(c, x, y, label){
    c.save();
    c.translate(x,y);
    c.fillStyle = '#5a3a1e';
    c.fillRect(-3,-30,6,32);
    c.fillStyle = '#d9a441';
    c.fillRect(-28,-42,56,18);
    c.strokeStyle = '#3a2510'; c.lineWidth = 1.5;
    c.strokeRect(-28,-42,56,18);
    c.fillStyle = '#2b1c10';
    c.font = '700 9px Mulish, sans-serif';
    c.textAlign = 'center';
    c.fillText(label, 0, -30);
    c.restore();
  }

  function drawWeddingDais(c, cx, baseY, scale){
    c.save();
    c.translate(cx, baseY);
    c.scale(scale, scale);
    // platform
    c.fillStyle = '#8a5a2e';
    c.fillRect(-150, 10, 300, 16);
    c.strokeStyle = '#4a2f16'; c.lineWidth = 2;
    c.strokeRect(-150, 10, 300, 16);
    // canopy poles
    c.strokeStyle = '#6f4a22'; c.lineWidth = 6;
    c.beginPath(); c.moveTo(-130,10); c.lineTo(-130,-110); c.moveTo(130,10); c.lineTo(130,-110); c.stroke();
    // canopy cloth
    var g = c.createLinearGradient(0,-130,0,-90);
    g.addColorStop(0,'#c1622e');
    g.addColorStop(1,'#e8935a');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-140,-110);
    c.quadraticCurveTo(0,-150,140,-110);
    c.lineTo(140,-92);
    c.quadraticCurveTo(0,-128,-140,-92);
    c.closePath();
    c.fill();
    c.strokeStyle = '#f0c869'; c.lineWidth = 2;
    c.stroke();
    // banners
    for(var i=-120;i<=120;i+=40){
      c.fillStyle = i%80===0 ? '#f0c869' : '#d9a441';
      c.beginPath();
      c.moveTo(i,-92);
      c.lineTo(i-8,-78);
      c.lineTo(i+8,-78);
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawGuests(c, positions, scale){
    positions.forEach(function(p){
      c.save();
      c.translate(p.x,p.y);
      c.scale(scale,scale);
      c.fillStyle = 'rgba(0,0,0,0.2)';
      c.beginPath(); c.ellipse(0,30,14,4,0,0,Math.PI*2); c.fill();
      c.fillStyle = p.color;
      c.beginPath();
      c.moveTo(-9,-6); c.lineTo(9,-6); c.lineTo(13,26); c.lineTo(-13,26);
      c.closePath(); c.fill();
      c.fillStyle = '#c99a72';
      c.beginPath(); c.arc(0,-14,9,0,Math.PI*2); c.fill();
      c.restore();
    });
  }

  function drawStormClouds(c, alpha){
    c.save();
    c.globalAlpha = alpha;
    c.fillStyle = '#2a2830';
    [ [140,70,60],[260,50,80],[420,60,70],[580,75,65],[700,55,55] ].forEach(function(cl){
      c.beginPath();
      c.arc(cl[0],cl[1],cl[2],0,Math.PI*2);
      c.fill();
    });
    c.restore();
  }

  function drawRain(c, alpha, seed){
    c.save();
    c.globalAlpha = alpha;
    c.strokeStyle = 'rgba(180,210,225,0.65)';
    c.lineWidth = 2;
    var rnd = seed || 1;
    function pr(){ rnd = (rnd*9301+49297) % 233280; return rnd/233280; }
    for(var i=0;i<38;i++){
      var rx = pr()*W;
      var ry = pr()*H*0.7;
      c.beginPath();
      c.moveTo(rx,ry);
      c.lineTo(rx-8,ry+22);
      c.stroke();
    }
    c.restore();
  }

  function drawHotFlood(c, progress){
    var t = clamp(progress,0,1);
    var y = H - (H*0.22)*t;
    c.save();
    var g = c.createLinearGradient(0,y,0,H);
    g.addColorStop(0,'rgba(224,72,62,0.85)');
    g.addColorStop(1,'rgba(150,30,20,0.95)');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(0,y);
    for(var x=0;x<=W;x+=40){
      var off = Math.sin((x/50)+Date.now()/220)*6;
      c.lineTo(x,y+off);
    }
    c.lineTo(W,H); c.lineTo(0,H);
    c.closePath();
    c.fill();
    if(t>0){
      c.fillStyle = 'rgba(255,255,255,0.5)';
      for(var i=0;i<10;i++){
        var sx = (i*83 + Date.now()/25) % W;
        var sy = y + 10 + (i%3)*8;
        c.beginPath();
        c.arc(sx, sy - t*30, 3, 0, Math.PI*2);
        c.globalAlpha = 0.4 * (1-t*0.4);
        c.fill();
      }
      c.globalAlpha = 1;
    }
    c.restore();
  }

  function drawSteamPool(c, cx, cy, rw, rh){
    c.save();
    var g = c.createRadialGradient(cx,cy,4,cx,cy,rw);
    g.addColorStop(0,'rgba(230,150,120,0.9)');
    g.addColorStop(1,'rgba(150,60,40,0.9)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(cx,cy,rw,rh,0,0,Math.PI*2);
    c.fill();
    c.strokeStyle = 'rgba(240,200,105,0.5)';
    c.lineWidth = 3;
    c.stroke();
    // steam wisps
    c.strokeStyle = 'rgba(245,236,216,0.5)';
    c.lineWidth = 3;
    c.lineCap = 'round';
    for(var i=0;i<5;i++){
      var sx = cx - rw*0.6 + i*(rw*1.2/4);
      var wobble = Math.sin(Date.now()/300 + i)*8;
      c.beginPath();
      c.moveTo(sx, cy - rh*0.3);
      c.quadraticCurveTo(sx+wobble, cy-60, sx-wobble*0.6, cy-100);
      c.stroke();
    }
    c.restore();
  }

  /* ============ START SCREEN ============ */
  function drawStartScreen(c){
    bgGradient(c, '#e8c25f', '#8a5a2e');
    drawHills(c, 300, '#4a3018');
    drawGround(c, 380, '#3a5a2a');
    drawHut(c, 640, 380, 0.9);
    drawSampuraga(c, 220, 400, 1.3);
    drawIbu(c, 320, 410, 1.1);
    c.fillStyle = 'rgba(0,0,0,0.3)';
    c.fillRect(0,0,W,H);
    c.textAlign = 'center';
    c.fillStyle = '#f0c869';
    c.font = '700 38px Cinzel, Georgia, serif';
    c.fillText(tr(T.startTitle), W/2, 200);
    c.fillStyle = '#f5ecd8';
    c.font = '600 16px Mulish, sans-serif';
    c.fillText(tr(T.startSub), W/2, 236);
    c.textAlign = 'left';
  }

  /* ============ SCENE 0: INTRO ============ */
  function drawIntroScene(c){
    bgGradient(c, '#e8c25f', '#c99a3a');
    drawSun(c, 700, 70, 30);
    drawHills(c, 260, '#4a3018');
    drawGround(c, 340, '#3a5a2a');
    drawRiceField(c, 60, 350, 260, 100);
    drawHut(c, 620, 400, 1);
    drawSampuraga(c, 300, 410, 1.15);
    drawIbu(c, 400, 415, 1);
  }

  /* ============ SCENE 1: TAWARAN ============ */
  function drawTawaranScene(c, s, sc){
    bgGradient(c, '#e8c25f', '#c99a3a');
    drawHills(c, 260, '#4a3018');
    drawGround(c, 340, '#3a5a2a');
    drawRiceField(c, 60, 350, 640, 100);
    drawSampuraga(c, 260, 320, 1.1);
    if(!s.tapped) drawTapHint(c, sc.target.x, sc.target.y, 55, (Math.sin(Date.now()/260)+1)/4);
    drawPemilikLahan(c, sc.target.x, sc.target.y, 1.1);
    if(s.tapped){
      c.fillStyle = 'rgba(245,236,216,0.92)';
      c.beginPath();
      c.moveTo(sc.target.x+10, sc.target.y-70);
      c.lineTo(sc.target.x-30, sc.target.y-110);
      c.lineTo(sc.target.x+70, sc.target.y-110);
      c.closePath();
      c.fill();
      c.beginPath();
      c.roundRect ? c.roundRect(sc.target.x-40, sc.target.y-170, 130, 62, 10) : c.rect(sc.target.x-40, sc.target.y-170, 130, 62);
      c.fill();
      c.fillStyle = '#e0483e';
      c.font = '700 22px Mulish, sans-serif';
      c.textAlign = 'center';
      c.fillText('💬', sc.target.x+25, sc.target.y-135);
      c.textAlign = 'left';
    }
  }

  /* ============ SCENE 2: RESTU ============ */
  function drawRestuScene(c, s, sc){
    bgGradient(c, '#e8c25f', '#c99a3a');
    drawGround(c, 340, '#3a5a2a');
    drawHut(c, 400, 400, 1.1);
    drawSampuraga(c, 480, 340, 1.05);
    if(!s.tapped) drawTapHint(c, sc.target.x, sc.target.y, 54, (Math.sin(Date.now()/260)+1)/4);
    drawIbu(c, sc.target.x, sc.target.y, 1.1, {tearful:s.tapped});
    if(s.tapped){
      c.save();
      c.fillStyle = '#e8935a';
      c.font = '26px sans-serif';
      c.textAlign = 'center';
      c.fillText('💗', sc.target.x, sc.target.y-90);
      c.restore();
      c.textAlign = 'left';
    }
  }

  /* ============ SCENE 3: PERJALANAN ============ */
  function drawPerjalananScene(c, s, sc){
    bgGradient(c, '#c99a3a', '#8a5a2e');
    drawHills(c, 220, '#3a2814');
    drawGround(c, 320, '#4a6a30');
    drawFootpath(c, 90, 420, 700, 340, s.progress);
    drawSignpost(c, 300, 380, 'Pidoli Lombang');
    drawSignpost(c, 560, 350, 'Sirambas');
    if(!s.completed) drawTapHint(c, sc.target.x, sc.target.y, 58, s.holding ? 0.3 : 0.12);
    drawWalker(c, 90, 420, 700, 340, s.progress, drawSampuraga, {});
    c.save();
    c.translate(sc.target.x, sc.target.y);
    c.globalAlpha = 0.9;
    c.restore();
    drawWalkTapHint(c, sc.target.x, sc.target.y);
  }

  /* ============ SCENE 4: BEKERJA ============ */
  function drawBekerjaScene(c, s, sc){
    bgGradient(c, '#c99a3a', '#7a5228');
    drawGround(c, 300, '#4a6a30');
    drawStream(c, 380);
    drawRaja(c, 640, 300, 0.85);
    var tilt = Math.sin(Date.now()/90) * 0.15 * (s.flash>0?1:0.3);
    if(!s.completed) drawTapHint(c, sc.target.x, sc.target.y, 62, s.flash);
    drawGoldPan(c, sc.target.x, sc.target.y, 1.3, tilt);
    drawSampuraga(c, sc.target.x-10, sc.target.y-55, 1, {rich:s.completed});
    if(s.completed){
      for(var i=0;i<5;i++){
        var ang = (i/5)*Math.PI*2 + Date.now()/500;
        c.save();
        c.fillStyle = '#f0c869';
        c.beginPath();
        c.arc(sc.target.x + Math.cos(ang)*70, sc.target.y-30 + Math.sin(ang)*20, 3, 0, Math.PI*2);
        c.fill();
        c.restore();
      }
    }
  }

  /* ============ SCENE 5: PERNIKAHAN ============ */
  function drawPernikahanScene(c){
    bgGradient(c, '#e8935a', '#7a3a1a');
    drawGround(c, 380, '#5a3a1e');
    drawWeddingDais(c, 400, 400, 1);
    drawGuests(c, [
      {x:120,y:400,color:'#3a5a3a'}, {x:170,y:410,color:'#5a3a5a'},
      {x:640,y:400,color:'#3a5a3a'}, {x:690,y:410,color:'#5a3a5a'},
      {x:210,y:420,color:'#7a4a2a'}, {x:600,y:420,color:'#7a4a2a'}
    ], 1);
    drawSampuraga(c, 350, 350, 1.05, {rich:true});
    drawPutri(c, 450, 350, 1.05);
  }

  /* ============ SCENE 6: IBU MENCARI ============ */
  function drawIbuMencariScene(c, s, sc){
    bgGradient(c, '#c99a3a', '#7a5228');
    drawHills(c, 220, '#3a2814');
    drawGround(c, 320, '#4a6a30');
    drawFootpath(c, 90, 420, 700, 340, s.progress);
    if(!s.completed) drawTapHint(c, sc.target.x, sc.target.y, 58, s.holding ? 0.3 : 0.12);
    drawWalker(c, 90, 420, 700, 340, s.progress, drawIbu, {tearful:false});
    c.save();
    c.translate(sc.target.x, sc.target.y);
    c.globalAlpha = 0.9;
    c.restore();
    drawWalkTapHint(c, sc.target.x, sc.target.y);
  }

  /* ============ SCENE 7: PENOLAKAN ============ */
  function drawPenolakanScene(c, s, sc){
    bgGradient(c, '#e8935a', '#7a3a1a');
    drawGround(c, 380, '#5a3a1e');
    drawWeddingDais(c, 400, 400, 0.9);
    drawGuests(c, [ {x:600,y:400,color:'#3a5a3a'}, {x:650,y:410,color:'#5a3a5a'} ], 0.9);
    if(!s.tapped) drawTapHint(c, sc.target.x, sc.target.y, 52, (Math.sin(Date.now()/260)+1)/4);
    drawSampuraga(c, sc.target.x, sc.target.y, 1, {rich:true, angry:s.tapped});
    drawPutri(c, sc.target.x+90, sc.target.y-6, 0.95);
    drawIbu(c, 200, 370, 1, {tearful:true});
    if(s.tapped){
      c.save();
      c.fillStyle = '#e0483e';
      c.font = '26px sans-serif';
      c.textAlign = 'center';
      c.fillText('❗', sc.target.x, sc.target.y-90);
      c.restore();
      c.textAlign = 'left';
    }
  }

  /* ============ SCENE 8: KUTUKAN ============ */
  function drawKutukanScene(c, s, sc){
    bgGradient(c, '#5a4a4a', '#2a2020');
    drawGround(c, 380, '#3a2a20');
    drawStormClouds(c, clamp(s.progress/100,0,0.8));
    if(s.progress > 20) drawRain(c, clamp((s.progress-20)/60,0,0.7), 7);
    if(s.completed){
      drawHotFlood(c, clamp((s.progress-90)/10,0,1));
    }
    if(!s.completed) drawTapHint(c, sc.target.x, sc.target.y, 60, s.flash);
    drawIbu(c, sc.target.x, sc.target.y, 1.3, {praying:true, tearful:true});
    if(s.flash>0){
      c.save();
      c.globalAlpha = clamp(s.flash,0,1)*0.6;
      var g = c.createRadialGradient(sc.target.x,sc.target.y-60,4,sc.target.x,sc.target.y-60,60);
      g.addColorStop(0,'rgba(245,236,216,0.8)');
      g.addColorStop(1,'rgba(245,236,216,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(sc.target.x,sc.target.y-60,60,0,Math.PI*2); c.fill();
      c.restore();
    }
  }

  /* ============ SCENE 9: ENDING ============ */
  function drawEndingScene(c){
    bgGradient(c, '#6a4a3a', '#2a1810');
    drawHills(c, 240, '#3a2814');
    drawGround(c, 340, '#4a3020');
    drawSteamPool(c, 400, 380, 220, 70);
    c.save();
    c.globalAlpha = 0.5;
    c.fillStyle = '#f5ecd8';
    c.font = 'italic 14px Mulish, sans-serif';
    c.textAlign = 'center';
    c.fillText(lang==='id' ? 'Kolam Sampuraga, Mandailing' : 'Kolam Sampuraga, Mandailing', 400, 470);
    c.restore();
    c.textAlign = 'left';
  }

  /* ============ INIT ============ */
  function init(){
    phase = 'start';
    sceneState = {};
    renderChrome();
    drawCurrentScene();
    reportHeight();
    startAmbientLoop();
  }

  function startAmbientLoop(){
    setInterval(function(){
      if(phase === 'scene'){
        var sc = scenes[sceneIndex];
        if(sc && (sc.type === 'auto' || (sc.type==='tap' && sc.id!=='tawaran' && sc.id!=='restu' && sc.id!=='penolakan') )){
          // light idle redraw for subtle animation on auto/steam scenes
        }
      }
      if(scenes[sceneIndex] && scenes[sceneIndex].id === 'ending' && phase==='scene'){
        drawCurrentScene();
      }
      if(scenes[sceneIndex] && scenes[sceneIndex].id === 'bekerja' && phase==='scene'){
        drawCurrentScene();
      }
    }, 120);
  }

  window.addEventListener('load', function(){
    setTimeout(reportHeight, 60);
  });
  window.addEventListener('resize', reportHeight);
  if('ResizeObserver' in window){
    var ro = new ResizeObserver(function(){ reportHeight(); });
    ro.observe(document.getElementById('app'));
  }
  setInterval(reportHeight, 900);

  init();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dara Itam — Bisikan Sungai Tenganap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Mulish:wght@400;600;700&display=swap');

  :root{
    --bg:#0b120d;
    --panel:#121d16;
    --panel-border:#274a34;
    --gold:#d4af37;
    --gold-soft:#e8cf7a;
    --green:#2f7a4f;
    --green-deep:#173a26;
    --cream:#ece7d5;
    --muted:#9fb0a4;
    --danger:#7a3b2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Mulish', sans-serif;
    background:
      radial-gradient(circle at 20% 0%, #14261a 0%, transparent 45%),
      radial-gradient(circle at 85% 100%, #17301f 0%, transparent 50%),
      var(--bg);
    color:var(--cream);
    min-height:100vh;
    padding:18px 12px 30px;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:640px;
  }
  .brand{
    text-align:center;
    margin-bottom:14px;
    position:relative;
  }
  .brand h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:1.7rem;
    margin:0;
    letter-spacing:1px;
    color:var(--gold-soft);
    text-shadow:0 0 18px rgba(212,175,55,0.25);
  }
  .brand p{
    margin:4px 0 0;
    font-size:0.8rem;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .langbar{
    position:absolute;
    right:0; top:0;
    display:flex;
    gap:4px;
  }
  .langbtn{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--muted);
    font-size:0.7rem;
    padding:4px 8px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Mulish',sans-serif;
  }
  .langbtn.active{
    color:var(--bg);
    background:var(--gold-soft);
    border-color:var(--gold-soft);
    font-weight:700;
  }

  .progress{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:14px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#25342a;
    border:1px solid var(--panel-border);
    transition:all .3s ease;
  }
  .dot.done{background:var(--gold);border-color:var(--gold);}
  .dot.current{background:var(--green);border-color:var(--gold);box-shadow:0 0 6px var(--gold);}

  .card{
    background:linear-gradient(180deg, var(--panel) 0%, #0f1911 100%);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:22px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4), inset 0 0 40px rgba(47,122,79,0.05);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-40%; left:-20%;
    width:140%; height:140%;
    background:radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 60%);
    pointer-events:none;
  }
  .scene-title{
    font-family:'Cinzel', serif;
    color:var(--gold-soft);
    font-size:1.1rem;
    margin:0 0 10px;
    letter-spacing:0.5px;
  }
  .scene-text{
    font-size:0.98rem;
    line-height:1.7;
    color:var(--cream);
    margin:0 0 18px;
    white-space:pre-line;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice-btn{
    text-align:left;
    background:var(--green-deep);
    border:1px solid var(--panel-border);
    color:var(--cream);
    padding:13px 16px;
    border-radius:10px;
    font-family:'Mulish',sans-serif;
    font-size:0.92rem;
    cursor:pointer;
    transition:all .2s ease;
    line-height:1.4;
  }
  .choice-btn:hover{
    border-color:var(--gold);
    background:#1c3524;
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  .choice-btn .tag{
    display:block;
    font-size:0.7rem;
    color:var(--gold-soft);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:4px;
  }

  .btn-primary{
    display:inline-block;
    margin-top:16px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#231a05;
    border:none;
    padding:12px 22px;
    border-radius:10px;
    font-weight:700;
    font-family:'Mulish',sans-serif;
    font-size:0.92rem;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .btn-primary:hover{filter:brightness(1.08);}

  .btn-ghost{
    display:inline-block;
    margin-top:10px;
    margin-left:8px;
    background:transparent;
    color:var(--muted);
    border:1px solid var(--panel-border);
    padding:11px 18px;
    border-radius:10px;
    font-family:'Mulish',sans-serif;
    font-size:0.85rem;
    cursor:pointer;
  }
  .btn-ghost:hover{color:var(--cream);border-color:var(--gold);}

  .result-badge{
    text-align:center;
    padding:16px 10px 6px;
  }
  .result-badge .icon{font-size:2.4rem;}
  .result-badge h2{
    font-family:'Cinzel', serif;
    color:var(--gold);
    font-size:1.5rem;
    margin:6px 0 4px;
    text-shadow:0 0 20px rgba(212,175,55,0.3);
  }
  .result-badge .subtitle{
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:14px;
  }
  .stats{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:16px 0;
  }
  .stat-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.78rem;
    color:var(--muted);
  }
  .stat-label{width:110px;flex-shrink:0;}
  .stat-bar-bg{
    flex:1;
    background:#1a2620;
    border-radius:6px;
    height:8px;
    overflow:hidden;
  }
  .stat-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--green), var(--gold));
    border-radius:6px;
  }

  .share-box{
    background:var(--green-deep);
    border:1px dashed var(--panel-border);
    border-radius:10px;
    padding:12px 14px;
    font-size:0.85rem;
    color:var(--cream);
    margin-top:12px;
    line-height:1.5;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
  }
  .copy-feedback{
    font-size:0.78rem;
    color:var(--gold-soft);
    margin-top:8px;
    height:16px;
  }
  footer.credit{
    text-align:center;
    color:#4b5c50;
    font-size:0.7rem;
    margin-top:14px;
  }
</style>
</head>

/* ===================== STATE ===================== */
let lang = "id";
let step = 0; // 0=intro,1=stage1,2=stage2,3=stage3,4=result
const stageKeys = ["intro","stage1","stage2","stage3"];
let score = { tabib:0, pejuang:0, setia:0, bijak:0 };

/* ===================== INIT ===================== */
(function initLang(){
  const params = new URLSearchParams(window.location.search);
  const q = params.get('lang');
  if(q === 'en') lang = 'en';
})();

function setLang(l){
  lang = l;
  render();
}

function t(){ return TXT[lang]; }

function updateChrome(){
  document.getElementById('brandTitle').textContent = t().brandTitle;
  document.getElementById('brandSub').textContent = t().brandSub;
  document.getElementById('credit').textContent = t().credit;
  document.getElementById('btn-id').classList.toggle('active', lang==='id');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
}

function renderProgress(){
  const wrap = document.getElementById('progress');
  wrap.innerHTML = "";
  for(let i=0;i<stageKeys.length;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < step ? ' done' : '') + (i === step ? ' current' : '');
    wrap.appendChild(d);
  }
}

function pickResultKey(){
  const order = ["tabib","setia","pejuang","bijak"];
  let best = order[0];
  for(const k of order){
    if(score[k] > score[best]) best = k;
  }
  return best;
}

function render(){
  updateChrome();
  const card = document.getElementById('card');

  if(step < stageKeys.length){
    renderProgress();
    const key = stageKeys[step];
    const data = t()[key];
    let html = `<div class="scene-title">${data.title}</div>`;
    html += `<div class="scene-text">${data.text}</div>`;

    if(key === "intro"){
      html += `<button class="btn-primary" onclick="goNext()">${t().startBtn}</button>`;
    } else {
      html += `<div class="choices">`;
      data.options.forEach((opt, idx)=>{
        html += `<button class="choice-btn" onclick="chooseOption(${idx})">
                   <span class="tag">${opt.tag}</span>${opt.label}
                 </button>`;
      });
      html += `</div>`;
    }
    card.innerHTML = html;
  } else {
    document.getElementById('progress').innerHTML = "";
    renderResult();
  }
  notifyResize();
}

function chooseOption(idx){
  const key = stageKeys[step];
  const opt = t()[key].options[idx];
  Object.keys(opt.stats).forEach(k => score[k] += opt.stats[k]);
  step++;
  render();
}

function goNext(){
  step++;
  render();
}

function renderResult(){
  const rKey = pickResultKey();
  const r = t().results[rKey];
  const card = document.getElementById('card');

  const maxScore = Math.max(1, ...Object.values(score));
  const statOrder = ["tabib","pejuang","setia","bijak"];

  let statsHtml = `<div class="stats">`;
  statOrder.forEach(k=>{
    const pct = Math.round((score[k]/ (maxScore*2)) * 100);
    statsHtml += `<div class="stat-row">
        <div class="stat-label">${t().stats[k]}</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${Math.min(100,pct)}%"></div></div>
      </div>`;
  });
  statsHtml += `</div>`;

  const html = `
    <div class="result-badge">
      <div class="icon">${r.icon}</div>
      <div class="subtitle">${t().resultSubtitle}</div>
      <h2>${r.title}</h2>
      <div class="scene-text" style="text-align:left">${r.desc}</div>
      <div style="text-align:left; font-size:0.75rem; color:var(--muted); margin-top:10px;">${t().yourStats}</div>
      ${statsHtml}
      <div class="share-box" id="shareText">${r.share}</div>
      <div class="copy-feedback" id="copyFeedback"></div>
      <div class="actions">
        <button class="btn-primary" onclick="copyResult()">${t().copyBtn}</button>
        <button class="btn-ghost" onclick="restartGame()">${t().restartBtn}</button>
      </div>
    </div>
  `;
  card.innerHTML = html;
}

function copyResult(){
  const text = document.getElementById('shareText').textContent;
  const feedback = document.getElementById('copyFeedback');
  const done = ()=>{ feedback.textContent = t().copied; setTimeout(()=>feedback.textContent="",2500); };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  cb();
}

function restartGame(){
  step = 0;
  score = { tabib:0, pejuang:0, setia:0, bijak:0 };
  render();
}

/* ===================== AUTO-RESIZE UNTUK IFRAME ===================== */
function notifyResize(){
  requestAnimationFrame(()=>{
    const h = document.body.scrollHeight;
    if(window.parent && window.parent !== window){
      window.parent.postMessage({ type: 'caritasato-resize', height: h }, '*');
    }
  });
}
window.addEventListener('load', notifyResize);
window.addEventListener('resize', notifyResize);
new ResizeObserver(notifyResize).observe(document.body);

/* ===================== START ===================== */
render();
</script>

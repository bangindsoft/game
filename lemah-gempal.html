<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asal Mula Nama Lemah Gempal</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: transparent;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    background: linear-gradient(180deg, #fdf6e9 0%, #f3e6cc 100%);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.12);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .title {
    font-size: 16px;
    font-weight: 700;
    color: #5c3d1f;
    flex: 1;
  }
  .icon-btn {
    background: #7a5230;
    color: #fff;
    border: none;
    border-radius: 8px;
    width: 38px;
    height: 38px;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.95); }
  .lang-btn {
    background: #a9835c;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 12px;
    height: 38px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  #canvasWrap {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    background: #cde7f0;
    border: 3px solid #a9835c;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
  }
  #dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin: 10px 0 4px 0;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #d8c4a2;
    transition: background 0.25s, transform 0.25s;
  }
  .dot.active {
    background: #c0402f;
    transform: scale(1.25);
  }
  .dot.done {
    background: #7a5230;
  }
  #captionBox {
    background: #fffaf0;
    border: 1px solid #e2cfa8;
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 10px;
    min-height: 44px;
    font-size: 14.5px;
    line-height: 1.5;
    color: #4a3520;
  }
  #controls {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .main-btn {
    background: #c0402f;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 #8c2c1f;
  }
  .main-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8c2c1f;
  }
  .main-btn:disabled {
    background: #cbb79a;
    box-shadow: none;
    cursor: default;
  }
  #holdBtn {
    background: #4a7a4e;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 14px 30px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 3px 0 #305233;
    user-select: none;
    touch-action: none;
  }
  #holdBtn .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: rgba(255,255,255,0.35);
  }
  #holdBtn span { position: relative; z-index: 1; }
  footer {
    text-align: center;
    margin-top: 12px;
    font-size: 11px;
    color: #a08a6c;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title" id="titleText">Asal Mula Nama Lemah Gempal</div>
    <button class="lang-btn" id="langBtn">EN</button>
    <button class="icon-btn" id="muteBtn">🔊</button>
  </div>

  <div id="canvasWrap">
    <canvas id="stage" width="700" height="420"></canvas>
  </div>

  <div id="dots"></div>

  <div id="captionBox">Memuat cerita...</div>

  <div id="controls">
    <button class="main-btn" id="startBtn">Mulai Cerita</button>
  </div>

  <footer>Cerita Rakyat Jawa Tengah &middot; Dongeng Interaktif</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- Language & state ----------
  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'en' ? 'en' : 'id';
  var muted = localStorage.getItem('lemahGempalMuted') === 'true';
  var voices = [];
  var currentUtterance = null;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var captionBox = document.getElementById('captionBox');
  var controls = document.getElementById('controls');
  var dotsWrap = document.getElementById('dots');
  var startBtn = document.getElementById('startBtn');
  var muteBtn = document.getElementById('muteBtn');
  var langBtn = document.getElementById('langBtn');
  var titleText = document.getElementById('titleText');

  var W = canvas.width, H = canvas.height;

  var TXT = {
    title: { id: 'Asal Mula Nama Lemah Gempal', en: 'The Origin of Lemah Gempal' },
    start: { id: 'Mulai Cerita', en: 'Start Story' },
    replay: { id: 'Ulangi Cerita', en: 'Replay Story' },
    next: { id: 'Lanjutkan', en: 'Continue' },
    hold: { id: 'Tahan untuk Menggali', en: 'Hold to Dig' },
    footer: { id: 'Cerita Rakyat Jawa Tengah · Dongeng Interaktif', en: 'Central Java Folklore · Interactive Tale' }
  };

  function t(key){ return TXT[key][lang]; }

  // ---------- Scene state ----------
  var sceneIndex = -1; // -1 = start screen
  var raf = null;
  var frame = 0;
  var pointer = { x: -1, y: -1, down: false };
  var digProgress = 0;
  var digging = false;
  var tanggulCollapsed = false;
  var tanggulFixed = false;
  var doorTapped = false;
  var stoneLeftTaken = false;
  var stoneRightTaken = false;
  var dragStone = null; // {which, x, y}
  var stoneLeftPlaced = false;
  var stoneRightPlaced = false;
  var miracleShown = false;
  var riverTapped = false;

  // Scenes definition
  var scenes = [
    { id: 'flood' },
    { id: 'canal' },
    { id: 'kisanak_door' },
    { id: 'stones' },
    { id: 'bury' },
    { id: 'miracle' },
    { id: 'ending' }
  ];

  var CAPTIONS = {
    flood: {
      id: 'Dahulu, Semarang sering dilanda banjir karena letaknya dekat pantai dan dialiri sungai besar. Ketuklah sungai untuk melihat banjir yang meresahkan warga.',
      en: 'Long ago, Semarang was often flooded because it was near the coast with a big river running through it. Tap the river to see the flood that troubled the people.'
    },
    canal: {
      id: 'Pemerintah Belanda membangun kanal di barat dan timur kota agar air sungai tidak meluap. Tahan tombol untuk menggali tanggul kanal barat.',
      en: 'The Dutch government built canals on the west and east sides of the city so the river would not overflow. Hold the button to dig the west canal levee.'
    },
    canal2: {
      id: 'Sayangnya, setiap kali digali, tanah tanggul barat selalu longsor. Para pekerja putus asa dan mendatangi orang pintar bernama Ki Sanak.',
      en: 'Sadly, every time it was dug, the west levee soil kept collapsing. The workers gave up and went to see a wise man named Ki Sanak.'
    },
    kisanak_door: {
      id: 'Para pekerja tiba di rumah Ki Sanak untuk meminta petunjuk. Ketuklah pintu rumahnya.',
      en: 'The workers arrived at Ki Sanak\'s house to ask for guidance. Tap his door.'
    },
    kisanak_advice: {
      id: 'Ki Sanak mendengar keluhan para pekerja. Ia menyuruh mereka mengambil batu di kanan dan kiri rumahnya.',
      en: 'Ki Sanak listened to the workers\' troubles. He told them to take the stones on the left and right side of his house.'
    },
    stones: {
      id: 'Ketuklah batu di sebelah kiri, lalu batu di sebelah kanan rumah untuk mengambilnya.',
      en: 'Tap the stone on the left, then the stone on the right side of the house to collect them.'
    },
    bury: {
      id: 'Bawa kedua batu itu ke tanggul kanal barat. Seret setiap batu ke lubang tanggul untuk menguburnya.',
      en: 'Bring both stones to the west canal levee. Drag each stone into the hole in the levee to bury it.'
    },
    miracle: {
      id: 'Ajaib! Ketuk tombol untuk melihat keajaiban yang terjadi pada tanggul.',
      en: 'It\'s a miracle! Tap the button to witness what happens to the levee.'
    },
    miracle2: {
      id: 'Reruntuhan tanggul kembali menyatu dan tidak pernah longsor lagi sejak saat itu.',
      en: 'The collapsed levee fused back together and never crumbled again from that day on.'
    },
    ending: {
      id: 'Sejak saat itu, daerah tersebut dikenal dengan nama Lemah Gempal — "lemah" berarti tanah, "gempal" berarti longsor atau bongkahan.',
      en: 'From that day on, the area became known as Lemah Gempal — "lemah" means soil, "gempal" means landslide or a chunk of earth.'
    }
  };

  var NARR = {
    intro: {
      id: 'Pada masa penjajahan Belanda, Semarang di Jawa Tengah sering dilanda banjir. Inilah kisah asal mula nama Lemah Gempal.',
      en: 'During the Dutch colonial era, Semarang in Central Java was often struck by floods. This is the story of the origin of the name Lemah Gempal.'
    },
    flood: {
      id: 'Semarang berada dekat pantai dan dialiri sungai besar di tengah kota. Setiap musim hujan tiba, banjir datang dan menghanyutkan harta benda warga.',
      en: 'Semarang was near the coast with a big river flowing through the city center. Every rainy season, floods came and swept away the people\'s belongings.'
    },
    canal: {
      id: 'Untuk mengatasi banjir, pemerintah Belanda membangun dua kanal, di barat dan di timur kota, agar air sungai tidak meluap.',
      en: 'To solve the flooding, the Dutch government built two canals, one to the west and one to the east of the city, so the river would not overflow.'
    },
    canal2: {
      id: 'Namun para pekerja kesulitan membangun kanal barat. Setiap kali tanggul digali, tanahnya selalu longsor kembali.',
      en: 'But the workers struggled to build the west canal. Every time the levee was dug, the soil would collapse again.'
    },
    kisanak_door: {
      id: 'Merasa putus asa, para pekerja mendatangi seorang orang pintar bernama Ki Sanak untuk meminta saran.',
      en: 'Feeling hopeless, the workers went to see a wise man named Ki Sanak to ask for advice.'
    },
    kisanak_advice: {
      id: 'Ki Sanak memerintahkan para pekerja mengambil batu yang berada di kanan dan kiri rumahnya, lalu menanamnya di tanggul yang longsor.',
      en: 'Ki Sanak instructed the workers to take the stones on the right and left of his house, then bury them in the collapsing levee.'
    },
    stones: {
      id: 'Para pekerja mengambil kedua batu itu dengan penuh harap.',
      en: 'The workers took both stones with great hope.'
    },
    bury: {
      id: 'Sesampainya di lokasi, para pekerja mengubur kedua batu itu di dalam tanggul yang tengah dikerjakan.',
      en: 'Upon arriving at the site, the workers buried both stones inside the levee that was being built.'
    },
    miracle: {
      id: 'Ajaib! Tidak lama kemudian, reruntuhan tanggul itu kembali menyatu dengan sendirinya.',
      en: 'Miraculously, not long after, the collapsed levee fused back together on its own.'
    },
    ending: {
      id: 'Sejak saat itu, daerah tersebut dikenal dengan nama Lemah Gempal. Dalam bahasa Jawa, lemah berarti tanah, dan gempal berarti longsor atau bongkahan.',
      en: 'From that day on, the area became known as Lemah Gempal. In Javanese, "lemah" means soil, and "gempal" means landslide or a chunk of earth.'
    }
  };

  // ---------- Speech ----------
  function loadVoices(){
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(langCode){
    if (!voices || !voices.length) return null;
    var exact = voices.filter(function(v){ return v.lang === langCode; });
    if (exact.length) return exact[0];
    var prefix = langCode.split('-')[0];
    var loose = voices.filter(function(v){ return v.lang && v.lang.indexOf(prefix) === 0; });
    if (loose.length) return loose[0];
    return null;
  }

  function speak(text){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (muted || !text) return;
    var utter = new SpeechSynthesisUtterance(text);
    var langCode = lang === 'id' ? 'id-ID' : 'en-US';
    utter.lang = langCode;
    var v = pickVoice(langCode);
    if (v) utter.voice = v;
    utter.rate = 0.95;
    utter.pitch = 1.0;
    currentUtterance = utter;
    window.speechSynthesis.speak(utter);
  }

  function stopSpeech(){
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function setCaption(key, useNarr){
    var src = useNarr ? NARR : CAPTIONS;
    var entry = src[key];
    if (!entry) return;
    captionBox.textContent = entry[lang];
  }

  function narrate(key){
    var entry = NARR[key];
    if (!entry) return;
    setCaption(key, true);
    speak(entry[lang]);
  }

  // ---------- Mute toggle ----------
  function updateMuteBtn(){
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    localStorage.setItem('lemahGempalMuted', muted ? 'true' : 'false');
    updateMuteBtn();
    if (muted) stopSpeech();
  });
  updateMuteBtn();

  // ---------- Lang toggle ----------
  function applyLangUI(){
    titleText.textContent = t('title');
    langBtn.textContent = lang === 'id' ? 'EN' : 'ID';
  }
  langBtn.addEventListener('click', function(){
    lang = lang === 'id' ? 'en' : 'id';
    var url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState({}, '', url);
    applyLangUI();
    refreshCurrentText();
    rebuildControls();
  });

  function rebuildControls(){
    if (sceneIndex === -1) {
      controls.innerHTML = '';
      var startB = document.createElement('button');
      startB.className = 'main-btn';
      startB.textContent = t('start');
      startB.addEventListener('click', function(){ enterScene(0); });
      controls.appendChild(startB);
      return;
    }
    var id = scenes[sceneIndex].id;
    if (id === 'flood' || id === 'kisanak_door') {
      controls.innerHTML = '';
    } else if (id === 'canal') {
      if (tanggulCollapsed) showNextButton(); else showHoldButton();
    } else if (id === 'stones') {
      if (stoneLeftTaken && stoneRightTaken) showNextButton(); else controls.innerHTML = '';
    } else if (id === 'bury') {
      if (stoneLeftPlaced && stoneRightPlaced) showNextButton(); else controls.innerHTML = '';
    } else if (id === 'miracle') {
      if (miracleShown) showNextButton(); else showMiracleButton();
    } else if (id === 'ending') {
      showReplayButton();
    }
  }

  function refreshCurrentText(){
    if (sceneIndex === -1) {
      captionBox.textContent = lang === 'id'
        ? 'Ketuk tombol di bawah untuk memulai kisah Asal Mula Nama Lemah Gempal.'
        : 'Tap the button below to begin the story of The Origin of Lemah Gempal.';
      return;
    }
    var s = scenes[sceneIndex];
    var key = currentCaptionKey(s.id);
    setCaption(key, false);
  }

  function currentCaptionKey(id){
    if (id === 'canal') return tanggulCollapsed ? 'canal2' : 'canal';
    if (id === 'kisanak_door') return doorTapped ? 'kisanak_advice' : 'kisanak_door';
    if (id === 'miracle') return miracleShown ? 'miracle2' : 'miracle';
    return id;
  }

  // ---------- Dots ----------
  function renderDots(){
    dotsWrap.innerHTML = '';
    for (var i = 0; i < scenes.length; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      if (i === sceneIndex) d.className += ' active';
      else if (i < sceneIndex) d.className += ' done';
      dotsWrap.appendChild(d);
    }
  }

  // ---------- Drawing helpers ----------
  function clear(){
    ctx.clearRect(0, 0, W, H);
  }

  function skyGradient(topColor, botColor){
    var g = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    g.addColorStop(0, topColor);
    g.addColorStop(1, botColor);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.62);
  }

  function drawCloud(x, y, scale){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.arc(20, -8, 14, 0, Math.PI * 2);
    ctx.arc(-20, -6, 13, 0, Math.PI * 2);
    ctx.arc(20, 6, 12, 0, Math.PI * 2);
    ctx.arc(-18, 8, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHouse(x, y, w, h, roofColor, wallColor){
    ctx.fillStyle = wallColor;
    ctx.fillRect(x, y, w, h);
    ctx.beginPath();
    ctx.moveTo(x - 8, y);
    ctx.lineTo(x + w / 2, y - h * 0.6);
    ctx.lineTo(x + w + 8, y);
    ctx.closePath();
    ctx.fillStyle = roofColor;
    ctx.fill();
    ctx.fillStyle = '#5c3d1f';
    ctx.fillRect(x + w * 0.4, y + h * 0.45, w * 0.2, h * 0.55);
  }

  function roundRectPath(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawTapLabel(x, y, text){
    ctx.save();
    var bounce = Math.sin(frame * 0.08) * 3;
    ctx.font = 'bold 13px Segoe UI, sans-serif';
    var padding = 9;
    var textWidth = ctx.measureText(text).width;
    var boxW = textWidth + padding * 2;
    var boxH = 25;
    var bx = x - boxW / 2;
    var by = y - boxH - 14 + bounce;
    roundRectPath(bx, by, boxW, boxH, 7);
    ctx.fillStyle = 'rgba(192,64,47,0.94)';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 6, by + boxH);
    ctx.lineTo(x + 6, by + boxH);
    ctx.lineTo(x, by + boxH + 8);
    ctx.closePath();
    ctx.fillStyle = 'rgba(192,64,47,0.94)';
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, by + boxH / 2 + 1);
    ctx.restore();
  }

  function drawFigure(x, y, scale, colorShirt){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#e8bd8f';
    ctx.beginPath();
    ctx.arc(0, -34, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = colorShirt || '#c0402f';
    ctx.fillRect(-9, -26, 18, 24);
    ctx.fillStyle = '#3c2e22';
    ctx.fillRect(-8, -2, 7, 16);
    ctx.fillRect(1, -2, 7, 16);
    ctx.restore();
  }

  // ---------- Scene: FLOOD ----------
  var riverHitbox = { x: 0, y: H * 0.68, w: W, h: H * 0.20 };
  var rainDrops = [];
  function initFlood(){
    riverTapped = false;
    rainDrops = [];
    for (var i = 0; i < 60; i++) {
      rainDrops.push({ x: Math.random() * W, y: Math.random() * H, speed: 4 + Math.random() * 4 });
    }
  }

  function drawFlood(){
    clear();
    skyGradient(riverTapped ? '#7d8fa0' : '#bcdff0', riverTapped ? '#9aa8b5' : '#e8f4fa');
    drawCloud(120, 60, 1.2);
    drawCloud(500, 40, 1.5);
    drawCloud(320, 90, 0.9);

    // ground
    ctx.fillStyle = '#7a9e5c';
    ctx.fillRect(0, H * 0.55, W, H * 0.15);

    // houses row
    drawHouse(60, H * 0.55, 70, 50, '#8c4a2f', '#e3c79a');
    drawHouse(180, H * 0.55, 60, 45, '#a9583a', '#f0d6ab');
    drawHouse(500, H * 0.55, 65, 48, '#8c4a2f', '#e3c79a');
    drawHouse(600, H * 0.55, 60, 45, '#a9583a', '#f0d6ab');

    // river
    var riverY = H * 0.68;
    var riverH = riverTapped ? H * 0.28 : H * 0.20;
    var g = ctx.createLinearGradient(0, riverY, 0, riverY + riverH);
    g.addColorStop(0, '#4a90c4');
    g.addColorStop(1, '#2f6a99');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, riverY);
    for (var x = 0; x <= W; x += 20) {
      var wave = Math.sin((x + frame * 3) * 0.03) * 5;
      ctx.lineTo(x, riverY + wave);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    if (riverTapped) {
      // floating debris
      for (var i = 0; i < 4; i++) {
        var fx = ((frame * 1.5 + i * 160) % (W + 60)) - 30;
        var fy = riverY + 20 + Math.sin((frame + i * 40) * 0.05) * 6 + i * 8;
        ctx.fillStyle = '#6b4423';
        ctx.fillRect(fx, fy, 26, 6);
      }
      // rain
      ctx.strokeStyle = 'rgba(200,220,240,0.7)';
      ctx.lineWidth = 2;
      for (var r = 0; r < rainDrops.length; r++) {
        var d = rainDrops[r];
        d.y += d.speed;
        if (d.y > H) d.y = -10;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 3, d.y + 10);
        ctx.stroke();
      }
    } else {
      // pulsing highlight to invite tap
      var pulse = 0.5 + 0.5 * Math.sin(frame * 0.08);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.3 + 0.3 * pulse) + ')';
      ctx.lineWidth = 3;
      ctx.strokeRect(riverHitbox.x + 4, riverY, W - 8, riverH - 4);
      drawTapLabel(W / 2, riverY, lang === 'id' ? 'Ketuk Sungai' : 'Tap the River');
    }
  }

  function flickFlood(mx, my){

  // ---------- Scene: CANAL (dig + collapse) ----------
  function initCanal(){
    digProgress = 0;
    digging = false;
    tanggulCollapsed = false;
  }

  function drawCanal(){
    clear();
    skyGradient('#bcdff0', '#e8f4fa');
    drawCloud(150, 50, 1.1);
    drawCloud(520, 70, 1.3);

    ctx.fillStyle = '#c9a86a';
    ctx.fillRect(0, H * 0.5, W, H * 0.5);

    // levee (tanggul) block
    var lx = 220, ly = H * 0.52, lw = 260, lh = 90;
    var shake = tanggulCollapsed ? Math.sin(frame * 0.6) * 3 : 0;

    if (!tanggulCollapsed) {
      // solid dirt mound, chips away with progress
      ctx.fillStyle = '#8a6b4b';
      ctx.fillRect(lx, ly, lw, lh - (digProgress / 100) * 30);
      ctx.fillStyle = '#6e5236';
      for (var i = 0; i < 5; i++) {
        ctx.fillRect(lx + i * (lw / 5), ly, lw / 5 - 4, 8);
      }
    } else {
      // cracked / collapsed rubble
      ctx.save();
      ctx.translate(shake, 0);
      ctx.fillStyle = '#6e5236';
      var pieces = [
        [lx, ly + 20, 60, 40],
        [lx + 70, ly + 35, 50, 30],
        [lx + 130, ly + 10, 55, 45],
        [lx + 195, ly + 30, 65, 35]
      ];
      for (var p = 0; p < pieces.length; p++) {
        ctx.fillRect(pieces[p][0], pieces[p][1], pieces[p][2], pieces[p][3]);
      }

    // worker figure digging
    var wx = lx + lw + 40;
    drawFigure(wx, H * 0.68, 1.3, '#4a7a4e');

      ctx.save();
      ctx.translate(wx - 10, H * 0.68 - 10);
      ctx.rotate(Math.sin(frame * 0.5) * 0.5);
      ctx.strokeStyle = '#5c3d1f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(20, 15);
      ctx.stroke();
      ctx.restore();
    }

    // canal water trench in front
    ctx.fillStyle = '#4a90c4';
    ctx.fillRect(0, H * 0.9, W, H * 0.1);
  }

  // ---------- Scene: STONES ----------
  var stoneLeftBox, stoneRightBox;
  function initStones(){

  function drawStoneScene(){
    clear();
    skyGradient('#f6e0b0', '#fbeed0');
    ctx.fillStyle = '#a9835c';
    ctx.fillRect(0, H * 0.7, W, H * 0.3);

    drawHouse(W / 2 - 90, H * 0.4, 180, 120, '#7a4a2b', '#e6cd9c');

    function drawStone(box, taken, label){
      if (taken) return;
      ctx.save();
      ctx.translate(box.x, box.y);
      var pulse = 0.5 + 0.5 * Math.sin(frame * 0.08);
      ctx.fillStyle = '#7d7d7d';

      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * pulse) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, box.r + 6, box.r * 0.8 + 6, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    drawStone(stoneLeftBox, stoneLeftTaken);
    drawStone(stoneRightBox, stoneRightTaken);
    if (!stoneLeftTaken) drawTapLabel(stoneLeftBox.x, stoneLeftBox.y - stoneLeftBox.r * 0.8, lang === 'id' ? 'Ketuk Batu Kiri' : 'Tap Left Stone');
    if (!stoneRightTaken) drawTapLabel(stoneRightBox.x, stoneRightBox.y - stoneRightBox.r * 0.8, lang === 'id' ? 'Ketuk Batu Kanan' : 'Tap Right Stone');

    // workers
    drawFigure(W / 2 - 30, H * 0.88, 1.1, '#c0402f');
    drawFigure(W / 2 + 30, H * 0.88, 1.0, '#4a7a4e');

    if (stoneLeftTaken && stoneRightTaken) {
      // done indicator handled by next-button
    }
  }

  function clickStones(mx, my){
    if (!stoneLeftTaken) {
      var dxl = mx - stoneLeftBox.x, dyl = my - stoneLeftBox.y;
      if ((dxl * dxl) / (stoneLeftBox.r * stoneLeftBox.r) + (dyl * dyl) / ((stoneLeftBox.r * 0.8) * (stoneLeftBox.r * 0.8)) <= 1.6) {
        stoneLeftTaken = true;
        checkStonesDone();
        return;
      }
    }
    if (!stoneRightTaken) {
      var dxr = mx - stoneRightBox.x, dyr = my - stoneRightBox.y;
      if ((dxr * dxr) / (stoneRightBox.r * stoneRightBox.r) + (dyr * dyr) / ((stoneRightBox.r * 0.8) * (stoneRightBox.r * 0.8)) <= 1.6) {
        stoneRightTaken = true;
        checkStonesDone();
        return;
      }
    }
  }

  function checkStonesDone(){

      narrate('stones');

  // ---------- Scene: BURY (drag and drop) ----------
  var stonesToBury, holeLeft, holeRight;
  function initBury(){
    stoneLeftPlaced = false;
    stoneRightPlaced = false;
    dragStone = null;
    stonesToBury = [
      { id: 'left', x: 90, y: H * 0.85, r: 20, placed: false },
      { id: 'right', x: W - 90, y: H * 0.85, r: 20, placed: false }
    ];
    holeLeft = { x: W / 2 - 60, y: H * 0.62, r: 26 };
    holeRight = { x: W / 2 + 60, y: H * 0.62, r: 26 };
  }

  function drawBuryScene(){
    clear();
    skyGradient('#bcdff0', '#e8f4fa');
    ctx.fillStyle = '#c9a86a';
    ctx.fillRect(0, H * 0.5, W, H * 0.5);

    var lx = 180, ly = H * 0.52, lw = 340, lh = 90;
    ctx.fillStyle = '#8a6b4b';
    ctx.fillRect(lx, ly, lw, lh);
    ctx.fillStyle = '#6e5236';
    for (var i = 0; i < 6; i++) {
      ctx.fillRect(lx + i * (lw / 6), ly, lw / 6 - 4, 6);
    }

    // holes
    function drawHole(hole, filled){
      ctx.save();
      ctx.translate(hole.x, hole.y);
      var pulse = 0.5 + 0.5 * Math.sin(frame * 0.08);
      if (!filled) {
        ctx.fillStyle = '#3d2c1c';
        ctx.beginPath();
        ctx.ellipse(0, 0, hole.r, hole.r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.35 * pulse) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, hole.r + 5, hole.r * 0.7 + 5, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#7d7d7d';
        ctx.beginPath();
        ctx.ellipse(0, 4, hole.r * 0.7, hole.r * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    drawHole(holeLeft, stoneLeftPlaced);
    drawHole(holeRight, stoneRightPlaced);
    if (!stoneLeftPlaced) drawTapLabel(holeLeft.x, holeLeft.y - holeLeft.r * 0.7, lang === 'id' ? 'Taruh di Sini' : 'Drop Here');
    if (!stoneRightPlaced) drawTapLabel(holeRight.x, holeRight.y - holeRight.r * 0.7, lang === 'id' ? 'Taruh di Sini' : 'Drop Here');

    // canal water below
    ctx.fillStyle = '#4a90c4';
    ctx.fillRect(0, H * 0.9, W, H * 0.1);

    // stones tray at bottom (draggable)
    for (var s = 0; s < stonesToBury.length; s++) {
      var st = stonesToBury[s];
      if (st.placed) continue;
      if (dragStone && dragStone.id === st.id) continue; // drawn separately while dragging
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.fillStyle = '#7d7d7d';
      ctx.beginPath();
      ctx.ellipse(0, 0, st.r, st.r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#9a9a9a';
      ctx.beginPath();
      ctx.ellipse(-4, -4, st.r * 0.4, st.r * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      drawTapLabel(st.x, st.y - st.r * 0.8, lang === 'id' ? 'Seret Batu' : 'Drag Stone');
    }

    if (dragStone) {
      ctx.save();
      ctx.translate(dragStone.x, dragStone.y);
      ctx.fillStyle = '#7d7d7d';
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // worker watching
    drawFigure(70, H * 0.66, 1.0, '#c0402f');
  }

  function buryPointerDown(mx, my){
    for (var s = 0; s < stonesToBury.length; s++) {
      var st = stonesToBury[s];
      if (st.placed) continue;
      var dx = mx - st.x, dy = my - st.y;
      if (dx * dx + dy * dy <= (st.r + 8) * (st.r + 8)) {
        dragStone = { id: st.id, x: mx, y: my };
        return;
      }
    }
  }

  function buryPointerMove(mx, my){
    if (dragStone) {
      dragStone.x = mx;
      dragStone.y = my;
    }
  }

  function buryPointerUp(mx, my){
    if (!dragStone) return;
    var target = dragStone.id === 'left' ? holeLeft : holeRight;
    var otherHole = dragStone.id === 'left' ? holeRight : holeLeft;
    var dx = mx - target.x, dy = my - target.y;
    var dxo = mx - otherHole.x, dyo = my - otherHole.y;
    var hitTarget = dx * dx + dy * dy <= (target.r + 20) * (target.r + 20);
    var hitOther = dxo * dxo + dyo * dyo <= (otherHole.r + 20) * (otherHole.r + 20);

    if (hitTarget) {
      if (dragStone.id === 'left') stoneLeftPlaced = true;
      else stoneRightPlaced = true;
      markStoneAsPlaced(dragStone.id);
    } else if (hitOther) {
      // dropped on wrong hole but still counts as buried (any hole works)
      if (dragStone.id === 'left') stoneLeftPlaced = true;
      else stoneRightPlaced = true;
      markStoneAsPlaced(dragStone.id);
    } else {
      // snap back
      for (var s = 0; s < stonesToBury.length; s++) {
        if (stonesToBury[s].id === dragStone.id) {
          // reset position handled by draw (original x,y unchanged since we never mutated st.x/st.y)
        }
      }
    }
    dragStone = null;
    checkBuryDone();
  }

  function markStoneAsPlaced(id){
    for (var s = 0; s < stonesToBury.length; s++) {
      if (stonesToBury[s].id === id) stonesToBury[s].placed = true;
    }
  }

  function checkBuryDone(){
    if (stoneLeftPlaced && stoneRightPlaced) {
      narrate('bury');
      setTimeout(showNextButton, 600);
    }
  }

  // ---------- Scene: MIRACLE ----------
  var sparkles = [];
  function initMiracle(){

    sparkles = [];

  function drawMiracleScene(){
    clear();
    skyGradient('#bcdff0', '#e8f4fa');
    ctx.fillStyle = '#c9a86a';
    ctx.fillRect(0, H * 0.5, W, H * 0.5);

    var lx = 220, ly = H * 0.52, lw = 260, lh = 90;
    ctx.fillStyle = '#8a6b4b';
    ctx.fillRect(lx, ly, lw, lh);

    for (var i = 0; i < 5; i++) {
      ctx.fillRect(lx + i * (lw / 5), ly, lw / 5 - 4, 8);
    }

    if (miracleShown) {
      for (var s = 0; s < sparkles.length; s++) {
        var sp = sparkles[s];
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - sp.age / 40);
        ctx.fillStyle = '#ffe08a';

      }
      sparkles = sparkles.filter(function(sp){ return sp.age < 40; });

        sparkles.push({ x: lx + Math.random() * lw, y: ly + Math.random() * lh, r: 2 + Math.random() * 3, age: 0 });
      }

  // ---------- Scene manager ----------
  function sceneInit(id){
    if (id === 'flood') initFlood();
    else if (id === 'canal') initCanal();
    else if (id === 'kisanak_door') initDoor();
    else if (id === 'stones') initStones();
    else if (id === 'bury') initBury();
    else if (id === 'miracle') initMiracle();
  }

  function sceneDraw(id){
    if (id === 'flood') drawFlood();
    else if (id === 'canal') drawCanal();
    else if (id === 'kisanak_door') drawDoorScene();
    else if (id === 'stones') drawStoneScene();
    else if (id === 'bury') drawBuryScene();
    else if (id === 'miracle') drawMiracleScene();
    else if (id === 'ending') drawEndingScene();
  }

  function loop(){
    frame++;
    if (sceneIndex >= 0) {
      sceneDraw(scenes[sceneIndex].id);
    }
    raf = requestAnimationFrame(loop);
  }

  function showNextButton(){
    controls.innerHTML = '';
    var btn = document.createElement('button');
    btn.className = 'main-btn';
    btn.textContent = t('next');
    btn.addEventListener('click', goNextScene);
    controls.appendChild(btn);
  }

  function showHoldButton(){
    controls.innerHTML = '';
    var wrap = document.createElement('button');
    wrap.id = 'holdBtn';
    wrap.innerHTML = '<div class="fill" id="holdFill"></div><span>' + t('hold') + '</span>';
    controls.appendChild(wrap);

    var fillEl = document.getElementById('holdFill');
    var holdTimer = null;
    var active = false;

    function startHold(e){
      e.preventDefault();
      if (tanggulCollapsed) return;
      active = true;
      digging = true;
      wrap.disabled = false;
      holdTimer = setInterval(function(){
        if (!active) return;
        digProgress += 3;
        fillEl.style.width = Math.min(digProgress, 100) + '%';
        if (digProgress >= 100) {
          clearInterval(holdTimer);
          digging = false;
          active = false;
          tanggulCollapsed = true;
          narrate('canal2');
          controls.innerHTML = '';
          setTimeout(showNextButton, 400);
        }
      }, 60);
    }
    function endHold(){
      active = false;
      digging = false;
      if (holdTimer) clearInterval(holdTimer);
    }

    wrap.addEventListener('mousedown', startHold);
    wrap.addEventListener('touchstart', startHold, { passive: false });
    wrap.addEventListener('mouseup', endHold);
    wrap.addEventListener('mouseleave', endHold);
    wrap.addEventListener('touchend', endHold);
    wrap.addEventListener('touchcancel', endHold);
  }

  function showMiracleButton(){
    controls.innerHTML = '';
    var btn = document.createElement('button');
    btn.className = 'main-btn';
    btn.textContent = lang === 'id' ? 'Lihat Keajaiban' : 'Witness the Miracle';
    btn.addEventListener('click', function(){
      if (miracleShown) return;
      miracleShown = true;
      narrate('miracle2');
      btn.disabled = true;
      setTimeout(showNextButton, 1200);
    });
    controls.appendChild(btn);
  }

  function showReplayButton(){
    controls.innerHTML = '';
    var btn = document.createElement('button');
    btn.className = 'main-btn';
    btn.textContent = t('replay');
    btn.addEventListener('click', function(){
      sceneIndex = -1;
      goToStart();
    });
    controls.appendChild(btn);
  }

  function clearControlsForInteraction(){
    controls.innerHTML = '';
  }

  function enterScene(index){
    sceneIndex = index;
    renderDots();
    var s = scenes[index];
    sceneInit(s.id);

    if (s.id === 'flood') {
      clearControlsForInteraction();
      narrate('flood');
    } else if (s.id === 'canal') {
      narrate('canal');
      showHoldButton();
    } else if (s.id === 'kisanak_door') {
      clearControlsForInteraction();
      narrate('kisanak_door');
    } else if (s.id === 'stones') {
      clearControlsForInteraction();
      narrate('stones');
    } else if (s.id === 'bury') {
      clearControlsForInteraction();
      narrate('bury');
    } else if (s.id === 'miracle') {
      showMiracleButton();
      setCaption('miracle', false);
    } else if (s.id === 'ending') {
      narrate('ending');
      showReplayButton();
    }
  }

  function goNextScene(){
    stopSpeech();
    if (sceneIndex + 1 < scenes.length) {
      enterScene(sceneIndex + 1);
    }
  }

  function goToStart(){
    stopSpeech();
    sceneIndex = -1;
    rebuildControls();
    renderDots();
    clear();
    drawStartArt();
    captionBox.textContent = lang === 'id'
      ? 'Ketuk tombol di bawah untuk memulai kisah Asal Mula Nama Lemah Gempal.'
      : 'Tap the button below to begin the story of The Origin of Lemah Gempal.';
    narrate('intro');
  }

  function drawStartArt(){
    skyGradient('#bcdff0', '#e8f4fa');
    drawCloud(140, 60, 1.2);
    drawCloud(520, 50, 1.4);
    ctx.fillStyle = '#7a9e5c';
    ctx.fillRect(0, H * 0.6, W, H * 0.4);
    drawHouse(W / 2 - 220, H * 0.5, 90, 70, '#8c4a2f', '#e3c79a');
    drawHouse(W / 2 + 110, H * 0.5, 90, 70, '#a9583a', '#f0d6ab');
    ctx.fillStyle = '#4a90c4';
    ctx.fillRect(0, H * 0.85, W, H * 0.15);
    drawFigure(W / 2, H * 0.8, 1.6, '#c0402f');
    ctx.fillStyle = 'rgba(74,53,32,0.85)';
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Segoe UI, sans-serif';
    ctx.fillText(lang === 'id' ? 'Asal Mula Nama' : 'The Origin of the Name', W / 2, H * 0.28);
    ctx.font = 'bold 30px Segoe UI, sans-serif';
    ctx.fillText('Lemah Gempal', W / 2, H * 0.28 + 38);
  }

  // ---------- Pointer handling ----------
  function getPos(evt){
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (evt.touches && evt.touches.length) {
      clientX = evt.touches[0].clientX;
      clientY = evt.touches[0].clientY;
    } else if (evt.changedTouches && evt.changedTouches.length) {
      clientX = evt.changedTouches[0].clientX;
      clientY = evt.changedTouches[0].clientY;
    } else {
      clientX = evt.clientX;
      clientY = evt.clientY;
    }
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  canvas.addEventListener('click', function(evt){
    if (sceneIndex < 0) return;
    var pos = getPos(evt);
    var id = scenes[sceneIndex].id;
    if (id === 'flood') flickFlood(pos.x, pos.y);
    else if (id === 'kisanak_door') clickDoor(pos.x, pos.y);
    else if (id === 'stones') clickStones(pos.x, pos.y);
  });

  canvas.addEventListener('mousedown', function(evt){
    if (sceneIndex < 0) return;
    var id = scenes[sceneIndex].id;
    if (id === 'bury') {
      var pos = getPos(evt);
      buryPointerDown(pos.x, pos.y);
    }
  });
  canvas.addEventListener('mousemove', function(evt){
    if (sceneIndex < 0) return;
    var id = scenes[sceneIndex].id;
    if (id === 'bury' && dragStone) {
      var pos = getPos(evt);
      buryPointerMove(pos.x, pos.y);
    }
  });
  window.addEventListener('mouseup', function(evt){
    if (sceneIndex < 0) return;
    var id = scenes[sceneIndex].id;
    if (id === 'bury' && dragStone) {
      var pos = getPos(evt);
      buryPointerUp(pos.x, pos.y);
    }
  });

  canvas.addEventListener('touchstart', function(evt){
    if (sceneIndex < 0) return;
    var id = scenes[sceneIndex].id;
    var pos = getPos(evt);
    if (id === 'bury') {
      evt.preventDefault();
      buryPointerDown(pos.x, pos.y);
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', function(evt){
    if (sceneIndex < 0) return;
    var id = scenes[sceneIndex].id;
    if (id === 'bury' && dragStone) {
      evt.preventDefault();
      var pos = getPos(evt);
      buryPointerMove(pos.x, pos.y);
    }
  }, { passive: false });
  canvas.addEventListener('touchend', function(evt){
    if (sceneIndex < 0) return;
    var id = scenes[sceneIndex].id;
    var pos = getPos(evt);
    if (id === 'bury' && dragStone) {
      buryPointerUp(pos.x, pos.y);
    } else if (id === 'flood') {
      flickFlood(pos.x, pos.y);
    } else if (id === 'kisanak_door') {
      clickDoor(pos.x, pos.y);
    } else if (id === 'stones') {
      clickStones(pos.x, pos.y);
    }
  });

  // ---------- Auto-resize (postMessage to parent Blogger page) ----------
  function sendHeight(){
    var appEl = document.getElementById('app');
    var height = appEl.getBoundingClientRect().height + 24;
    window.parent.postMessage({ lemahGempalHeight: height }, '*');
  }
  window.addEventListener('load', function(){
    sendHeight();
    setTimeout(sendHeight, 300);
    setTimeout(sendHeight, 1000);
  });
  window.addEventListener('resize', sendHeight);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(sendHeight);
    ro.observe(document.getElementById('app'));
  }

  // ---------- Init ----------
  applyLangUI();
  goToStart();
  loop();

})();
</script>
</body>
</html>

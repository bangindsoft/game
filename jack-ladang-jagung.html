<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack di Ladang Jagung</title>
<style>
  :root{
    --sky-day1:#8ec9f0; --sky-day2:#e9f6ff;
    --sky-eve1:#3a4a7a; --sky-eve2:#f0a860;
    --panel:#fff8ec; --ink:#3a2b1a; --accent:#d9772f; --accent2:#4a8a3f;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Verdana, Arial, sans-serif;
    background:linear-gradient(180deg,#fef6e4,#fbe8cf);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:14px 10px 22px;
  }
  #app{
    width:100%;
    max-width:760px;
    background:var(--panel);
    border-radius:18px;
    box-shadow:0 6px 22px rgba(90,60,20,0.18);
    padding:14px 14px 18px;
    border:2px solid #e7cfa0;
  }
  #topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; gap:8px; flex-wrap:wrap;
  }
  h1{
    font-size:1.25rem; margin:0; color:#7a3f14; flex:1; min-width:180px;
  }
  .ctrl-btn{
    background:#fff; border:2px solid var(--accent); color:var(--accent);
    border-radius:10px; padding:7px 10px; font-size:0.85rem; cursor:pointer;
    font-weight:600; display:flex; align-items:center; gap:5px;
    transition:transform .12s ease;
  }
  .ctrl-btn:hover{transform:translateY(-2px);}
  .ctrl-btn.active{background:var(--accent); color:#fff;}
  #canvasWrap{
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    border:3px solid #7a3f14;
    background:#000;
  }
  canvas{
    width:100%; display:block; touch-action:manipulation; cursor:pointer;
  }
  #dots{
    display:flex; justify-content:center; gap:7px; margin:12px 0 6px;
  }
  .dot{
    width:10px; height:10px; border-radius:50%; background:#e0c99a;
    transition:background .2s, transform .2s;
  }
  .dot.active{background:var(--accent); transform:scale(1.3);}
  .dot.done{background:var(--accent2);}
  #instructionBox{
    background:#fffefb;
    border:2px dashed #d9a45f;
    border-radius:12px;
    padding:10px 14px;
    margin-top:8px;
    font-size:0.98rem;
    line-height:1.45;
    min-height:48px;
    display:flex;
    align-items:center;
  }
  #progressBarWrap{
    width:100%; height:14px; background:#eadfc7; border-radius:8px;
    margin-top:8px; overflow:hidden; display:none; border:1px solid #d9a45f;
  }
  #progressBar{
    height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent));
  }
  #bottomControls{
    display:flex; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap;
  }
  #startBtn{
    background:var(--accent2); color:#fff; border:none; border-radius:12px;
    padding:11px 22px; font-size:1rem; font-weight:700; cursor:pointer;
    box-shadow:0 4px 0 #2f6027;
  }
  #startBtn:active{transform:translateY(2px); box-shadow:0 2px 0 #2f6027;}
  .choiceBtn{
    background:#fff; border:2px solid var(--accent2); color:#2f6027;
    border-radius:10px; padding:9px 14px; font-weight:700; cursor:pointer; font-size:0.92rem;
  }
  .choiceBtn:hover{background:#eef8ea;}
  footer{
    text-align:center; margin-top:14px; font-size:0.72rem; color:#a08050;
  }
  @media(max-width:480px){
    h1{font-size:1.05rem;}
    .ctrl-btn{font-size:0.75rem; padding:6px 8px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1 id="titleText">🌽 Jack di Ladang Jagung</h1>
    <button class="ctrl-btn" id="langBtn">EN</button>
    <button class="ctrl-btn" id="muteBtn">🔊</button>
  </div>

  <div id="canvasWrap">
    <canvas id="game" width="800" height="500"></canvas>
  </div>

  <div id="dots"></div>

  <div id="progressBarWrap"><div id="progressBar"></div></div>

  <div id="instructionBox">
    <span id="instructionText"></span>
  </div>

  <div id="bottomControls">
    <button id="startBtn">▶ Mulai Cerita</button>
  </div>

  <footer id="footerText">Kisah rakyat interaktif</footer>
</div>

<script>
(function(){
"use strict";

/* ===================== STATE ===================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const params = new URLSearchParams(location.search);
let lang = (params.get('lang') === 'en') ? 'en' : 'id';
let muted = (localStorage.getItem('jackCornMuted') === '1');
let sceneIndex = 0;
let started = false;
let animFrame = null;
let t = 0; // global animation timer

const TOTAL_SCENES = 8;

/* progress state for interactive mechanics */
let holdProgress = 0;   // scene 1 climb
let holdActive = false;
let mashCount = 0;      // scene 3 & 4 & 5 mash counters
let mashNeeded = 12;
let stalkHeight = 0;    // grows in scene1-3
let sway = 0;
let choiceMade = null;  // scene 6

/* ===================== TEXT ===================== */
const T = {
  id: {
    title: "🌽 Jack di Ladang Jagung",
    startBtn: "▶ Mulai Cerita",
    replayBtn: "↻ Ulangi Cerita",
    footer: "Kisah rakyat interaktif — ketuk & dengarkan ceritanya",
    scenes: [
      {
        narration: "Jack senang bermain di ladang jagung milik ayahnya. Suatu hari ia melihat sebatang jagung yang sangat besar di tengah ladang. Jack terkesima dan ingin memanjatnya.",
        instruction: "Ketuk batang jagung raksasa di tengah ladang untuk mendekat."
      },
      {
        narration: "Jack mulai memanjat batang jagung yang besar itu. Ia memanjat perlahan, semakin lama semakin tinggi.",
        instruction: "Tekan dan tahan batang jagung untuk membantu Jack memanjat ke atas."
      },
      {
        narration: "Sesampainya di atas, Jack melihat pemandangan yang luas. Ia dapat melihat seluruh ladang jagung ayahnya dari ketinggian, di antara awan-awan putih.",
        instruction: "Ketuk awan untuk melihat pemandangan luas di sekeliling Jack."
      },
      {
        narration: "Tiba-tiba batang jagung itu terus tumbuh memanjang. Jack terkejut karena ia sudah berada sangat tinggi, hampir mencapai langit.",
        instruction: "Ketuk berulang kali pada batang jagung agar Jack bisa berpegangan erat."
      },
      {
        narration: "Jack ketakutan dan berteriak minta tolong sekeras-kerasnya, berharap ayahnya di bawah bisa mendengar.",
        instruction: "Ketuk berulang kali pada mulut Jack untuk berteriak minta tolong."
      },
      {
        narration: "Ayah Jack mendengar teriakan itu. Ia segera mengambil kapak dan menebang batang jagung raksasa itu sekuat tenaga.",
        instruction: "Ketuk kapak yang dipegang ayah untuk menebang batang jagung."
      },
      {
        narration: "Tubuh Jack bergoncang keras. Ia menangis panik... namun tiba-tiba ia mendengar suara ibunya memanggil dan membangunkannya. Ternyata semua itu hanya mimpi.",
        instruction: "Ketuk jawaban Jack kepada ibunya tentang doa sebelum tidur."
      },
      {
        narration: "Sejak saat itu, Jack selalu berdoa sebelum tidur agar terhindar dari mimpi buruk dan dapat tidur dengan nyenyak.",
        instruction: "Ketuk tombol Ulangi Cerita untuk memainkan kisah ini lagi."
      }
    ],
    choiceMother: "Ibu bertanya: \"Sudahkah kau berdoa sebelum tidur, Jack?\"",
    choiceA: "Belum, Bu...",
    choiceB: "Aku akan berdoa sekarang!",
    choiceFeedbackA: "Ibu tersenyum: \"Nah itu sebabnya kau bermimpi buruk. Ayo berdoa dulu sebelum tidur.\"",
    choiceFeedbackB: "Ibu tersenyum bangga melihat Jack mulai berdoa sebelum tidur.",
    moral: "Pesan cerita: Jangan lupa berdoa sebelum tidur, agar kita bermimpi indah dan tidur nyenyak."
  },
  en: {
    title: "🌽 Jack in the Cornfield",
    startBtn: "▶ Start Story",
    replayBtn: "↻ Replay Story",
    footer: "Interactive folktale — tap and listen to the story",
    scenes: [
      {
        narration: "Jack loved playing in his father's cornfield. One day he saw an enormous cornstalk standing in the middle of the field. Jack was amazed and wanted to climb it.",
        instruction: "Tap the giant cornstalk in the middle of the field to get closer."
      },
      {
        narration: "Jack began climbing the huge cornstalk. He climbed slowly, getting higher and higher.",
        instruction: "Press and hold the cornstalk to help Jack climb up."
      },
      {
        narration: "When he reached the top, Jack saw a wide view. He could see his father's whole cornfield from up high, among the white clouds.",
        instruction: "Tap the clouds to look around at the wide view."
      },
      {
        narration: "Suddenly the cornstalk kept growing taller. Jack was shocked to find himself so high up, almost reaching the sky.",
        instruction: "Tap the cornstalk repeatedly so Jack can hold on tight."
      },
      {
        narration: "Jack was terrified and shouted for help as loud as he could, hoping his father down below would hear him.",
        instruction: "Tap Jack's mouth repeatedly to shout for help."
      },
      {
        narration: "Jack's father heard the cry. He quickly grabbed an axe and began chopping the giant cornstalk with all his strength.",
        instruction: "Tap the axe held by the father to chop the cornstalk."
      },
      {
        narration: "Jack's body shook hard. He cried in panic... until suddenly he heard his mother's voice waking him up. It had all been a dream.",
        instruction: "Tap Jack's answer to his mother about praying before bed."
      },
      {
        narration: "From then on, Jack always prayed before going to sleep, so he could avoid nightmares and sleep soundly.",
        instruction: "Tap the Replay Story button to play this tale again."
      }
    ],
    choiceMother: "Mother asks: \"Did you pray before going to sleep, Jack?\"",
    choiceA: "Not yet, Mom...",
    choiceB: "I'll pray right now!",
    choiceFeedbackA: "Mother smiles: \"That's why you had a nightmare. Let's pray before bed next time.\"",
    choiceFeedbackB: "Mother smiles proudly as Jack begins to pray before bed.",
    moral: "Moral of the story: Don't forget to pray before sleeping, so we have sweet dreams and rest well."
  }
};

/* ===================== DOM ELEMENTS ===================== */
const titleEl = document.getElementById('titleText');
const instructionEl = document.getElementById('instructionText');
const startBtn = document.getElementById('startBtn');
const langBtn = document.getElementById('langBtn');
const muteBtn = document.getElementById('muteBtn');
const dotsWrap = document.getElementById('dots');
const progressWrap = document.getElementById('progressBarWrap');
const progressBar = document.getElementById('progressBar');
const footerEl = document.getElementById('footerText');
const bottomControls = document.getElementById('bottomControls');

/* ===================== DOTS ===================== */
function buildDots(){
  dotsWrap.innerHTML = '';
  for(let i=0;i<TOTAL_SCENES;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    dotsWrap.appendChild(d);
  }
}
function updateDots(){
  const dots = dotsWrap.querySelectorAll('.dot');
  dots.forEach((d,i)=>{
    d.classList.remove('active','done');
    if(i < sceneIndex) d.classList.add('done');
    else if(i === sceneIndex) d.classList.add('active');
  });
}

/* ===================== NARRATION (Web Speech API) ===================== */
let voices = [];
function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  if(muted || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'id' ? 'id-ID' : 'en-US';
  const targetLang = u.lang;
  const v = voices.find(v=>v.lang === targetLang) ||
            voices.find(v=>v.lang && v.lang.startsWith(lang));
  if(v) u.voice = v;
  u.rate = 0.95;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}
function stopSpeak(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

/* ===================== RESIZE / EMBED ===================== */
function notifyHeight(){
  const h = document.getElementById('app').offsetHeight + 20;
  try{ window.parent.postMessage({ type:'jackCornHeight', height:h }, '*'); }catch(e){}
}

/* ===================== HELPERS TO DRAW ===================== */
function clear(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function drawSky(nightAmount){
  // nightAmount 0..1 (0 = bright day, 1 = evening/dream-ish)
  const g = ctx.createLinearGradient(0,0,0,360);
  if(nightAmount < 0.5){
    g.addColorStop(0,'#7fc4ef');
    g.addColorStop(1,'#eaf7ff');
  } else {
    g.addColorStop(0,'#5b6aa0');
    g.addColorStop(1,'#f2a35f');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0,0,canvas.width,360);
}
function drawSun(){
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath();
  ctx.arc(700,70,38,0,Math.PI*2);
  ctx.fill();
}
function drawGround(){
  ctx.fillStyle = '#c9a15c';
  ctx.fillRect(0,360,canvas.width,140);
  ctx.fillStyle = '#a97e3f';
  ctx.fillRect(0,360,canvas.width,10);
}
function drawCornRow(x,y,scale,swayAmt){
  ctx.save();
  ctx.translate(x,y);
  const lean = Math.sin(t*0.05 + x*0.03)*swayAmt;
  ctx.rotate(lean*0.01);
  ctx.strokeStyle = '#4a8a3f';
  ctx.lineWidth = 5*scale;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,-70*scale);
  ctx.stroke();
  // leaves
  ctx.fillStyle = '#5aa14a';
  for(let i=0;i<3;i++){
    const ly = -20*scale - i*20*scale;
    ctx.beginPath();
    ctx.moveTo(0,ly);
    ctx.quadraticCurveTo(25*scale,ly-8*scale,35*scale,ly-2*scale);
    ctx.quadraticCurveTo(20*scale,ly+6*scale,0,ly+4*scale);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,ly);
    ctx.quadraticCurveTo(-25*scale,ly-8*scale,-35*scale,ly-2*scale);
    ctx.quadraticCurveTo(-20*scale,ly+6*scale,0,ly+4*scale);
    ctx.fill();
  }
  ctx.fillStyle = '#e8d477';
  ctx.beginPath();
  ctx.ellipse(10*scale,-55*scale,6*scale,16*scale,0.3,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawField(){
  for(let i=0;i<9;i++){
    drawCornRow(60+i*40,420,0.9,3);
  }
  for(let i=0;i<8;i++){
    drawCornRow(90+i*44,470,1.1,2);
  }
}
function drawClouds(offsetY){
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  const positions = [[150,90],[430,60],[620,140],[260,150]];
  positions.forEach(([cx,cy])=>{
    const yy = cy + (offsetY||0);
    ctx.beginPath();
    ctx.arc(cx,yy,26,0,Math.PI*2);
    ctx.arc(cx+28,yy+6,20,0,Math.PI*2);
    ctx.arc(cx-26,yy+8,18,0,Math.PI*2);
    ctx.fill();
  });
}
/* giant stalk anchored at baseX,baseY, extends upward by height, with sway */
let stalkHotspot = {x:0,y:0,r:0};
function drawGiantStalk(baseX, baseY, height, swayAmt, highlight){
  const lean = Math.sin(t*0.04)*swayAmt;
  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.rotate(lean*0.008);
  ctx.strokeStyle = highlight ? '#3f7a33' : '#3f7a33';
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,-height);
  ctx.stroke();
  // leaves along the stalk
  ctx.fillStyle = '#5aa14a';
  for(let i=1;i<Math.floor(height/60);i++){
    const ly = -i*60;
    ctx.beginPath();
    ctx.moveTo(0,ly);
    ctx.quadraticCurveTo(45,ly-14,60,ly+6);
    ctx.quadraticCurveTo(28,ly+16,0,ly+8);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,ly);
    ctx.quadraticCurveTo(-45,ly-14,-60,ly+6);
    ctx.quadraticCurveTo(-28,ly+16,0,ly+8);
    ctx.fill();
  }
  if(highlight){
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(t*0.15)*0.15;
    ctx.strokeStyle = '#ffe27a';
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(0,-height);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  // store hotspot in screen coords (approx near mid-upper stalk)
  const hx = baseX + Math.sin(lean*0.008)* (height*0.5);
  const hy = baseY - height*0.55;
  stalkHotspot = {x:hx, y:hy, r:70};
}
function drawJack(x,y,scale,pose){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  // legs
  ctx.strokeStyle = '#2b3a5a';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-6,20); ctx.lineTo(-10,45);
  ctx.moveTo(6,20); ctx.lineTo(10,45);
  ctx.stroke();
  // body
  ctx.fillStyle = '#d64545';
  ctx.beginPath();
  ctx.roundRect(-14,-8,28,32,8);
  ctx.fill();
  // arms
  ctx.strokeStyle = '#d64545';
  ctx.lineWidth = 8;
  if(pose === 'shout'){
    ctx.beginPath();
    ctx.moveTo(-14,0); ctx.lineTo(-30,-14);
    ctx.moveTo(14,0); ctx.lineTo(30,-14);
    ctx.stroke();
  } else if(pose === 'hold'){
    ctx.beginPath();
    ctx.moveTo(-14,0); ctx.lineTo(-4,-20);
    ctx.moveTo(14,0); ctx.lineTo(24,-6);
    ctx.stroke();
  } else if(pose === 'pray'){
    ctx.beginPath();
    ctx.moveTo(-14,2); ctx.lineTo(0,-10);
    ctx.moveTo(14,2); ctx.lineTo(0,-10);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-14,0); ctx.lineTo(-22,16);
    ctx.moveTo(14,0); ctx.lineTo(22,16);
    ctx.stroke();
  }
  // head
  ctx.fillStyle = '#f2c294';
  ctx.beginPath();
  ctx.arc(0,-22,16,0,Math.PI*2);
  ctx.fill();
  // hair
  ctx.fillStyle = '#4a2e15';
  ctx.beginPath();
  ctx.arc(0,-30,15,Math.PI,Math.PI*2);
  ctx.fill();
  // face
  ctx.fillStyle = '#2b2b2b';
  if(pose === 'shout' || pose === 'scared'){
    ctx.beginPath(); ctx.arc(-6,-24,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-24,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,-14,6,8,0,0,Math.PI*2);
    ctx.fillStyle = '#a33';
    ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(-6,-24,2.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-24,2.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.arc(0,-16,5,0,Math.PI,false);
    ctx.strokeStyle = '#2b2b2b';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}
function drawFather(x,y,scale,pose){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.strokeStyle = '#4a3a2a';
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(-8,26); ctx.lineTo(-12,58);
  ctx.moveTo(8,26); ctx.lineTo(12,58);
  ctx.stroke();
  ctx.fillStyle = '#5a7a9a';
  ctx.beginPath();
  ctx.roundRect(-18,-8,36,40,8);
  ctx.fill();
  // head
  ctx.fillStyle = '#e8b988';
  ctx.beginPath();
  ctx.arc(0,-26,18,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath();
  ctx.arc(0,-34,17,Math.PI,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath(); ctx.arc(-6,-27,2.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6,-27,2.6,0,Math.PI*2); ctx.fill();

  if(pose === 'chop'){
    const swing = Math.sin(t*0.5)*0.6;
    ctx.save();
    ctx.translate(22,10);
    ctx.rotate(0.6+swing);
    ctx.strokeStyle = '#7a5a3a';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,42); ctx.stroke();
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.moveTo(-4,38); ctx.lineTo(20,30); ctx.lineTo(20,50); ctx.lineTo(-4,50);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // axe hotspot approx
    axeHotspot = {x: x + 22*scale + 10, y: y + 30*scale, r:55};
  } else if(pose === 'listen'){
    ctx.save();
    ctx.translate(24,-30);
    ctx.strokeStyle = '#e8b988';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0,0,10,0.2,Math.PI*1.6); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = '#5a7a9a';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(-18,0); ctx.lineTo(-30,20);
    ctx.moveTo(18,0); ctx.lineTo(30,20);
    ctx.stroke();
  }
  ctx.restore();
}
let axeHotspot = {x:0,y:0,r:0};
function drawMother(x,y,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.strokeStyle = '#6a4a3a';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-8,24); ctx.lineTo(-10,50);
  ctx.moveTo(8,24); ctx.lineTo(10,50);
  ctx.stroke();
  ctx.fillStyle = '#c97fae';
  ctx.beginPath();
  ctx.moveTo(-18,26); ctx.quadraticCurveTo(0,10,18,26);
  ctx.lineTo(14,-6); ctx.lineTo(-14,-6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f0cfa0';
  ctx.beginPath();
  ctx.arc(0,-22,15,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#3a2416';
  ctx.beginPath();
  ctx.arc(0,-24,16,Math.PI*0.9,Math.PI*2.1);
  ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath(); ctx.arc(-5,-23,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-23,2.2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#2b2b2b';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,-15,4,0,Math.PI,false); ctx.stroke();
  ctx.restore();
}
function drawBed(x,y,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.fillStyle = '#8a5a3a';
  ctx.fillRect(-70,10,140,14);
  ctx.fillStyle = '#e8e2d0';
  ctx.fillRect(-64,-6,128,20);
  ctx.fillStyle = '#f5f0e6';
  ctx.beginPath();
  ctx.ellipse(-40,-2,20,10,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawMoon(){
  ctx.fillStyle = '#fff3d0';
  ctx.beginPath();
  ctx.arc(680,80,34,0,Math.PI*2);
  ctx.fill();
}
function drawStars(){
  ctx.fillStyle = '#fff';
  const pts = [[100,50],[220,90],[340,40],[500,110],[600,50],[730,150]];
  pts.forEach(([x,y])=>{
    ctx.beginPath();
    ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fill();
  });
}
function drawLabel(text,x,y){
  ctx.font = 'bold 15px Segoe UI, Arial';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const w = ctx.measureText(text).width + 16;
  ctx.beginPath();
  ctx.roundRect(x-w/2,y-16,w,24,10);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(text,x,y);
  ctx.textAlign = 'left';
}
function pulseCircle(x,y,r,color){
  const p = 0.5+Math.sin(t*0.12)*0.5;
  ctx.save();
  ctx.globalAlpha = 0.25+p*0.35;
  ctx.strokeStyle = color || '#fff3a0';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(x,y,r + p*8,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

/* ===================== SCENE RENDERERS ===================== */
function renderScene0(){
  drawSky(0); drawSun(); drawClouds(0); drawGround(); drawField();
  drawGiantStalk(400,400,190,3,true);
  drawJack(300,388,1.3,'normal');
  pulseCircle(stalkHotspot.x, stalkHotspot.y, 46, '#ffe27a');
  drawLabel(lang==='id' ? 'Batang Jagung Raksasa' : 'Giant Cornstalk', stalkHotspot.x, stalkHotspot.y-60);
}
function renderScene1(){
  drawSky(0); drawSun(); drawClouds(0); drawGround(); drawField();
  const h = 190 + holdProgress*2.6;
  drawGiantStalk(400,400,h,2,false);
  const climbY = 400 - holdProgress*2.4;
  drawJack(400,climbY,1.15,'hold');
  pulseCircle(stalkHotspot.x, stalkHotspot.y, 50, '#a0e0a0');
  drawLabel(lang==='id' ? 'Tahan untuk memanjat' : 'Hold to climb', 400, 60);
}
function renderScene2(){
  drawSky(0.15);
  drawClouds(Math.sin(t*0.02)*4);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(0,320,canvas.width,180);
  // tiny field far below
  ctx.save();
  ctx.globalAlpha = 0.7;
  for(let i=0;i<10;i++){
    ctx.fillStyle = '#5aa14a';
    ctx.fillRect(40+i*70, 460, 30, 20);
  }
  ctx.restore();
  drawGiantStalk(400,500,470,1.5,false);
  drawJack(400,50,1.1,'normal');
  const cloudHot = {x:430,y:130,r:60};
  pulseCircle(cloudHot.x, cloudHot.y, 45, '#ffffff');
  drawLabel(lang==='id' ? 'Ketuk awan' : 'Tap the clouds', cloudHot.x, cloudHot.y-70);
  window.cloudHotspot = cloudHot;
}
function renderScene3(){
  const shake = mashCount>0 ? Math.sin(t*0.8)*3 : 0;
  ctx.save();
  ctx.translate(shake, 0);
  drawSky(0.3); drawClouds(-40+Math.sin(t*0.02)*4); drawGround();
  drawGiantStalk(400,500,470+Math.min(mashCount*3,60),8,false);
  drawJack(400,60,1.15,'scared');
  ctx.restore();
  pulseCircle(400,60,60,'#ffb0b0');
  drawLabel(lang==='id' ? 'Ketuk batang untuk berpegangan' : 'Tap the stalk to hold on', 400, 20);
}
function renderScene4(){
  drawSky(0.35); drawClouds(-40);
  drawGiantStalk(400,500,470,2,false);
  drawJack(400,60,1.15,'shout');
  const mouthX = 400, mouthY = 30;
  pulseCircle(mouthX,mouthY,40,'#ffd27a');
  drawLabel(lang==='id' ? 'Ketuk mulut Jack' : "Tap Jack's mouth", mouthX, mouthY-56);
  window.mouthHotspot = {x:mouthX,y:mouthY,r:50};
  // father far below listening
  drawGround();
  drawFather(400,420,1.2,'listen');
}
function renderScene5(){
  drawSky(0.35); drawGround(); drawField();
  drawGiantStalk(400,400,190,mashCount>0?6:2,false);
  drawFather(340,388,1.25,'chop');
  drawJack(460,220,0.8,'scared');
  pulseCircle(axeHotspot.x, axeHotspot.y, 42, '#ffcf9a');
  drawLabel(lang==='id' ? 'Ketuk kapak ayah' : "Tap father's axe", axeHotspot.x, axeHotspot.y-58);
}
function renderScene6(){
  drawSky(0.85); drawStars(); drawMoon(); drawGround();
  drawBed(400,430,1.5);
  drawJack(360,400,1.1, choiceMade ? 'pray' : 'scared');
  drawMother(500,380,1.1);
  drawLabel(lang==='id' ? T.id.choiceMother : T.en.choiceMother, 400, 60);
}
function renderScene7(){
  drawSky(0.15); drawSun(); drawClouds(0); drawGround(); drawField();
  drawJack(400,388,1.4,'pray');
  drawLabel(lang==='id' ? T.id.moral : T.en.moral, 400, 60);
}
const renderers = [renderScene0,renderScene1,renderScene2,renderScene3,renderScene4,renderScene5,renderScene6,renderScene7];

/* ===================== MAIN LOOP ===================== */
function loop(){
  t++;
  clear();
  renderers[sceneIndex]();
  if(sceneIndex===1 && holdActive){
    holdProgress = Math.min(100, holdProgress + 1.4);
    progressBar.style.width = holdProgress + '%';
    if(holdProgress>=100){
      holdActive = false;
      goToScene(sceneIndex+1);
    }
  }
  animFrame = requestAnimationFrame(loop);
}

/* ===================== SCENE FLOW ===================== */
function currentText(){ return T[lang]; }

function goToScene(i){
  if(i>=TOTAL_SCENES){ return; }
  sceneIndex = i;
  holdProgress = 0; holdActive = false; mashCount = 0; choiceMade = null;
  progressWrap.style.display = (i===1) ? 'block' : 'none';
  progressBar.style.width = '0%';
  updateDots();
  updateInstruction();
  updateBottomControls();
  const txt = currentText().scenes[i].narration;
  speak(txt);
  notifyHeight();
}
function updateInstruction(){
  instructionEl.textContent = currentText().scenes[sceneIndex].instruction;
}
function updateBottomControls(){
  bottomControls.innerHTML = '';
  if(sceneIndex === 6){
    const a = document.createElement('button');
    a.className='choiceBtn';
    a.textContent = currentText().choiceA;
    a.onclick = ()=>makeChoice('A');
    const b = document.createElement('button');
    b.className='choiceBtn';
    b.textContent = currentText().choiceB;
    b.onclick = ()=>makeChoice('B');
    bottomControls.appendChild(a);
    bottomControls.appendChild(b);
  } else if(sceneIndex === TOTAL_SCENES-1){
    const r = document.createElement('button');
    r.id = 'startBtn';
    r.textContent = currentText().replayBtn;
    r.onclick = restart;
    bottomControls.appendChild(r);
  }
}
function makeChoice(which){
  if(choiceMade) return;
  choiceMade = which;
  const txt = which==='A' ? currentText().choiceFeedbackA : currentText().choiceFeedbackB;
  speak(txt);
  instructionEl.textContent = txt;
  setTimeout(()=>{ goToScene(sceneIndex+1); }, 3200);
}
function restart(){
  goToScene(0);
}

/* ===================== INPUT HANDLING ===================== */
function getCanvasPos(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width;
  const scaleY = canvas.height/rect.height;
  let clientX, clientY;
  if(evt.touches && evt.touches.length){
    clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
  } else {
    clientX = evt.clientX; clientY = evt.clientY;
  }
  return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
}
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }

function handleDown(evt){
  if(!started) return;
  evt.preventDefault();
  const p = getCanvasPos(evt);
  if(sceneIndex===0){
    if(dist(p.x,p.y,stalkHotspot.x,stalkHotspot.y) < stalkHotspot.r+20){
      goToScene(1);
    }
  } else if(sceneIndex===1){
    if(dist(p.x,p.y,stalkHotspot.x,stalkHotspot.y) < stalkHotspot.r+30){
      holdActive = true;
    }
  } else if(sceneIndex===2){
    const c = window.cloudHotspot || {x:430,y:130,r:60};
    if(dist(p.x,p.y,c.x,c.y) < c.r+20){
      goToScene(3);
    }
  } else if(sceneIndex===3){
    mashCount++;
    if(mashCount>=mashNeeded){
      goToScene(4);
    }
  } else if(sceneIndex===4){
    const m = window.mouthHotspot || {x:400,y:30,r:50};
    if(dist(p.x,p.y,m.x,m.y) < m.r+25){
      mashCount++;
      if(mashCount>=mashNeeded){
        goToScene(5);
      }
    }
  } else if(sceneIndex===5){
    if(dist(p.x,p.y,axeHotspot.x,axeHotspot.y) < axeHotspot.r+25){
      mashCount++;
      if(mashCount>=8){
        goToScene(6);
      }
    }
  }
}
function handleUp(){
  holdActive = false;
}
canvas.addEventListener('mousedown', handleDown);
canvas.addEventListener('touchstart', handleDown, {passive:false});
canvas.addEventListener('mouseup', handleUp);
canvas.addEventListener('mouseleave', handleUp);
canvas.addEventListener('touchend', handleUp);
canvas.addEventListener('touchcancel', handleUp);

/* ===================== UI EVENTS ===================== */
startBtn.addEventListener('click', ()=>{
  started = true;
  document.getElementById('bottomControls').innerHTML='';
  goToScene(0);
});
langBtn.addEventListener('click', ()=>{
  lang = (lang==='id') ? 'en' : 'id';
  langBtn.textContent = (lang==='id') ? 'EN' : 'ID';
  applyStaticText();
  if(started){
    updateInstruction();
    updateBottomControls();
    speak(currentText().scenes[sceneIndex].narration);
  }
});
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  localStorage.setItem('jackCornMuted', muted ? '1' : '0');
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('active', muted);
  if(muted) stopSpeak();
});

function applyStaticText(){
  const txt = currentText();
  titleEl.textContent = txt.title;
  footerEl.textContent = txt.footer;
  if(!started){
    startBtn.textContent = txt.startBtn;
  }
  document.documentElement.lang = lang;
}

/* ===================== INIT ===================== */
buildDots();
applyStaticText();
muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.classList.toggle('active', muted);
langBtn.textContent = (lang==='id') ? 'EN' : 'ID';
loop();
window.addEventListener('load', notifyHeight);
window.addEventListener('resize', notifyHeight);
setTimeout(notifyHeight, 400);

})();
</script>

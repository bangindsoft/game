<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legenda Cikaputrian - Cerita Rakyat Banten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --royal-purple:#4a2145;
    --royal-plum:#2c1428;
    --gold:#d6a94a;
    --cream:#f7ecd6;
    --ink:#2a1620;
    --lake-teal:#1f6f6a;
    --danger:#a23b2e;
    --storm:#20232f;
    --panel-bg:#fbf3e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:linear-gradient(180deg,var(--royal-purple),var(--royal-plum));
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:14px 10px 20px;
  }
  #app{
    width:100%;
    max-width:720px;
    background:var(--panel-bg);
    border-radius:18px;
    border:6px solid var(--gold);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    overflow:hidden;
    position:relative;
  }
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:var(--royal-purple);
    color:var(--cream);
  }
  #title{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:1.02rem;
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #title .flag{font-size:1rem;opacity:.9;}
  .iconbtn{
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.5);
    color:var(--cream);
    border-radius:10px;
    padding:6px 10px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:.78rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    transition:transform .15s ease, background .15s ease;
  }
  .iconbtn:hover{background:rgba(255,255,255,.26);}
  .iconbtn:active{transform:scale(.94);}
  #controls{display:flex;gap:8px;}

  #stage-wrap{
    position:relative;
    background:
      radial-gradient(ellipse at 50% -10%, #6a3a5e 0%, transparent 55%),
      repeating-linear-gradient(45deg, rgba(214,169,74,.06) 0 8px, transparent 8px 16px),
      #efd9d4;
    border-bottom:4px solid var(--gold);
  }
  canvas{display:block;width:100%;height:auto;}

  #dots{
    display:flex;
    justify-content:center;
    gap:6px;
    padding:10px 8px 4px;
    background:var(--panel-bg);
    flex-wrap:wrap;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:#e3cfa8;
    border:1.5px solid #b99a5b;
    transition:background .2s, transform .2s;
  }
  .dot.active{background:var(--danger);border-color:var(--danger);transform:scale(1.25);}
  .dot.done{background:var(--lake-teal);border-color:var(--lake-teal);}

  #narration-panel{
    padding:12px 16px 6px;
    background:var(--panel-bg);
  }
  #narration-text{
    font-size:.95rem;
    line-height:1.5;
    min-height:2.6em;
    color:var(--ink);
  }
  #instruction{
    margin-top:6px;
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:.86rem;
    color:var(--danger);
    display:flex;
    align-items:center;
    gap:6px;
  }
  #instruction::before{
    content:"👉";
    font-size:.95rem;
  }

  #bottombar{
    display:flex;
    justify-content:center;
    padding:12px 16px 18px;
    background:var(--panel-bg);
  }
  #primary-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1rem;
    background:var(--danger);
    color:var(--cream);
    border:none;
    border-radius:14px;
    padding:12px 28px;
    cursor:pointer;
    box-shadow:0 4px 0 #6e2419;
    transition:transform .1s ease;
  }
  #primary-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6e2419;}
  #primary-btn.hidden{display:none;}

  footer{
    text-align:center;
    font-size:.68rem;
    color:#8a7550;
    padding:0 16px 12px;
    font-family:'Nunito',sans-serif;
  }

  @media (max-width:420px){
    #title{font-size:.9rem;}
    .iconbtn{padding:5px 8px;font-size:.7rem;}
    #narration-text{font-size:.88rem;}
    #instruction{font-size:.8rem;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title"><span class="flag">👑</span><span id="title-text">Legenda Cikaputrian</span></div>
    <div id="controls">
      <button class="iconbtn" id="lang-btn" type="button">EN</button>
      <button class="iconbtn" id="mute-btn" type="button">🔊</button>
    </div>
  </div>

  <div id="stage-wrap">
    <canvas id="game" width="800" height="500"></canvas>
  </div>

  <div id="dots"></div>

  <div id="narration-panel">
    <div id="narration-text"></div>
    <div id="instruction"></div>
  </div>

  <div id="bottombar">
    <button id="primary-btn" type="button">Mulai Cerita</button>
  </div>

  <footer id="footer-text">Kisah rakyat Banten, diceritakan ulang secara interaktif.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- i18n ---------------- */
  var params = new URLSearchParams(window.location.search);
  var lang = (params.get('lang') === 'en') ? 'en' : 'id';

  var STR = {
    id:{
      title:"Legenda Cikaputrian",
      startBtn:"Mulai Cerita",
      replayBtn:"Ulangi Cerita",
      nextHint:"Ketuk untuk melanjutkan",
      footer:"Kisah rakyat Banten, diceritakan ulang secara interaktif.",
      langBtn:"EN"
    },
    en:{
      title:"The Legend of Cikaputrian",
      startBtn:"Start Story",
      replayBtn:"Replay Story",
      nextHint:"Tap to continue",
      footer:"A Banten folktale, retold interactively.",
      langBtn:"ID"
    }
  };

  var scenes = [
    {
      id:"intro", type:"tap", target:"istana",
      narration:{
        id:"Di kaki sebuah gunung yang indah di Banten, berdirilah istana megah milik seorang raja. Sang raja memiliki putri yang sangat cantik jelita.",
        en:"At the foot of a beautiful mountain in Banten stood a magnificent palace belonging to a king. The king had a daughter of great beauty."
      },
      instruction:{ id:"Ketuk istana untuk memulai kisah.", en:"Tap the palace to begin the story." }
    },
    {
      id:"cermin", type:"tap", target:"cermin",
      narration:{
        id:"Sayangnya, kecantikan sang putri tidak diimbangi hatinya. Ia sombong dan pemalas, lebih suka berhias di depan cermin daripada membantu pekerjaan istana.",
        en:"Sadly, the princess's beauty was not matched by her heart. She was proud and lazy, preferring to primp before her mirror rather than help with the palace's chores."
      },
      instruction:{ id:"Ketuk cermin untuk melihat kebiasaan sang putri.", en:"Tap the mirror to see the princess's habit." }
    },
    {
      id:"minta_puri", type:"tap", target:"raja",
      narration:{
        id:"Sang putri selalu meminta apa pun yang ia inginkan kepada sang raja. Kali ini, ia memaksa ayahnya membangunkan sebuah puri yang sangat indah untuknya.",
        en:"The princess always demanded whatever she wished from the king. This time, she forced her father to build her a magnificent private villa."
      },
      instruction:{ id:"Ketuk sang raja untuk mendengar permintaan sang putri.", en:"Tap the king to hear the princess's demand." }
    },
    {
      id:"taman_puri", type:"tap", target:"taman",
      narration:{
        id:"Puri itu pun berdiri di kaki gunung, dikelilingi taman bunga yang sangat indah dan penuh warna.",
        en:"The villa stood at the foot of the mountain, surrounded by a garden of flowers bursting with color."
      },
      instruction:{ id:"Ketuk taman bunga untuk melihat keindahan puri sang putri.", en:"Tap the flower garden to see the princess's beautiful villa." }
    },
    {
      id:"larangan_danau", type:"tap", target:"papan",
      narration:{
        id:"Di dekat puri itu ada sebuah danau yang jernih. Namun sang putri melarang siapa pun mendekatinya \u2014 danau itu hanya boleh ia gunakan sendiri untuk mandi.",
        en:"Near the villa lay a clear lake. But the princess forbade anyone from going near it \u2014 the lake was hers alone to bathe in."
      },
      instruction:{ id:"Ketuk papan larangan di tepi danau untuk mengetahui aturannya.", en:"Tap the warning sign by the lake to learn its rule." }
    },
    {
      id:"wanita_tua_datang", type:"tap", target:"wanitatua",
      narration:{
        id:"Suatu hari, seorang perempuan tua yang tidak tahu aturan itu datang ke danau untuk membasuh wajah dan tangannya yang lelah.",
        en:"One day, an old woman who did not know the rule came to the lake to wash her tired face and hands."
      },
      instruction:{ id:"Ketuk wanita tua untuk melihat kedatangannya ke danau.", en:"Tap the old woman to see her arrive at the lake." }
    },
    {
      id:"bentak", type:"tapcount", target:"putri", count:3,
      narration:{
        id:"Sang putri melihatnya dan langsung murka. Ia membentak perempuan tua itu berkali-kali dengan kata-kata yang sangat kasar.",
        en:"The princess saw her and flew into a rage, shouting harsh, cruel words at the old woman again and again."
      },
      instruction:{ id:"Ketuk sang putri tiga kali untuk mendengar bentakannya.", en:"Tap the princess three times to hear her shout." },
      lines:{
        id:["\u201cHei perempuan tua yang kotor dan dekil!\u201d", "\u201cApa kau bisu, tidak menjawab ucapanku?!\u201d", "\u201cDasar wanita miskin, tua, dan tak tahu diri!\u201d"],
        en:["\u201cHey, you filthy old woman!\u201d", "\u201cAre you mute, ignoring what I say?!\u201d", "\u201cYou worthless, poor old crone!\u201d"]
      }
    },
    {
      id:"nasihat", type:"tap", target:"wanitatua2",
      narration:{
        id:"Perempuan tua itu hanya bisa menasihati sang putri dengan lembut, mengingatkan bahwa meski ia anak raja, ia tetaplah manusia biasa.",
        en:"The old woman could only gently advise the princess, reminding her that even as a king's daughter, she was still an ordinary human being."
      },
      instruction:{ id:"Ketuk wanita tua untuk mendengar nasihatnya.", en:"Tap the old woman to hear her advice." }
    },
    {
      id:"hukuman", type:"tap", target:"pengawal",
      narration:{
        id:"Namun sang putri semakin murka. Ia memerintahkan pengawalnya untuk menangkap dan menjatuhkan hukuman mati kepada perempuan tua itu.",
        en:"But the princess grew even angrier. She ordered her guards to seize the old woman and put her to death."
      },
      instruction:{ id:"Ketuk pengawal untuk melihat perintah sang putri.", en:"Tap the guard to see the princess's order." }
    },
    {
      id:"kutukan", type:"hold", target:"putri2", holdMs:1800,
      narration:{
        id:"Belum sempat pengawal bertindak, langit tiba-tiba menggelap. Petir menyambar dan hujan turun sangat lebat \u2014 sebuah kutukan sedang terjadi pada sang putri.",
        en:"Before the guards could act, the sky suddenly darkened. Lightning struck and rain poured down fiercely \u2014 a curse was falling upon the princess."
      },
      instruction:{ id:"Tekan dan tahan gambar sang putri untuk melihat kutukan datang.", en:"Press and hold the princess to watch the curse arrive." }
    },
    {
      id:"penyesalan", type:"tap", target:"ular",
      narration:{
        id:"Tubuh sang putri perlahan berubah menjadi seekor ular. Ia menyesal, namun semuanya sudah terlambat \u2014 ia tak lagi berwujud manusia.",
        en:"The princess's body slowly transformed into a serpent. She regretted it deeply, but it was too late \u2014 she was no longer human."
      },
      instruction:{ id:"Ketuk ular untuk melihat penyesalannya.", en:"Tap the serpent to see its regret." }
    },
    {
      id:"ending", type:"end",
      narration:{
        id:"Ular jelmaan sang putri itu akhirnya tinggal selamanya di danau tersebut. Danau itu kemudian dikenal dengan nama Cikaputrian, yang berarti \u2018tempat sang putri mandi\u2019. Kisah ini mengajarkan kita untuk menjauhi sifat sombong, karena keangkuhan hanya akan membawa penyesalan.",
        en:"The serpent that was once the princess remained forever in that lake. It came to be known as Lake Cikaputrian, meaning \u2018the place where the princess bathed.\u2019 This tale teaches us to avoid arrogance, for pride only brings regret."
      },
      instruction:{ id:"Ketuk \u201cUlangi Cerita\u201d untuk mendengar kisah ini lagi.", en:"Tap \u201cReplay Story\u201d to hear this tale again." }
    }
  ];

  /* ---------------- state ---------------- */
  var state = {
    sceneIndex:-1,
    started:false,
    locked:false,
    muted:(localStorage.getItem('lck_muted')==='1'),
    holdActive:false,
    holdStart:0,
    holdRAF:null,
    tapCount:0
  };

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var CW = 800, CH = 500;
  var dotsEl = document.getElementById('dots');
  var narrationEl = document.getElementById('narration-text');
  var instructionEl = document.getElementById('instruction');
  var primaryBtn = document.getElementById('primary-btn');
  var muteBtn = document.getElementById('mute-btn');
  var langBtn = document.getElementById('lang-btn');
  var titleText = document.getElementById('title-text');
  var footerText = document.getElementById('footer-text');

  function applyStrings(){
    var s = STR[lang];
    titleText.textContent = s.title;
    footerText.textContent = s.footer;
    langBtn.textContent = s.langBtn;
    muteBtn.textContent = state.muted ? '\ud83d\udd07' : '\ud83d\udd0a';
    if(!state.started){ primaryBtn.textContent = s.startBtn; }
  }

  /* ---------------- dots ---------------- */
  function buildDots(){
    dotsEl.innerHTML = '';
    for(var i=0;i<scenes.length;i++){
      var d = document.createElement('div');
      d.className = 'dot';
      d.dataset.i = i;
      dotsEl.appendChild(d);
    }
  }
  function updateDots(){
    var kids = dotsEl.children;
    for(var i=0;i<kids.length;i++){
      kids[i].classList.remove('active','done');
      if(i < state.sceneIndex) kids[i].classList.add('done');
      else if(i === state.sceneIndex) kids[i].classList.add('active');
    }
  }

  /* ---------------- narration (speech) ---------------- */
  var voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if(window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(bcp){
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(bcp.toLowerCase())===0) return voices[i];
    }
    return null;
  }
  function speak(text){
    if(!window.speechSynthesis || state.muted || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var bcp = lang === 'id' ? 'id-ID' : 'en-US';
    u.lang = bcp;
    var v = pickVoice(bcp);
    if(v) u.voice = v;
    u.rate = 0.96;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }
  function stopSpeak(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); }

  function setNarration(text, instr){
    narrationEl.textContent = text;
    instructionEl.textContent = instr || '';
  }

  /* ---------------- drawing helpers ---------------- */
  function clear(){ ctx.clearRect(0,0,CW,CH); }

  function drawBackdrop(stormAmt){
    stormAmt = stormAmt || 0;
    var g = ctx.createLinearGradient(0,0,0,CH);
    if(stormAmt > 0){
      g.addColorStop(0, lerpColor('#f2d9c8','#20232f',stormAmt));
      g.addColorStop(1, lerpColor('#e8d0c0','#3a3d4a',stormAmt));
    } else {
      g.addColorStop(0,'#f6ddc6');
      g.addColorStop(1,'#f0d4a0');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0,0,CW,CH);
    // sun / dark clouds
    if(stormAmt <= 0){
      ctx.fillStyle='#fbeccb';
      ctx.beginPath();ctx.arc(700,80,36,0,7);ctx.fill();
    } else {
      ctx.save();
      ctx.globalAlpha = Math.min(1, stormAmt);
      ctx.fillStyle = '#14161f';
      ctx.beginPath();ctx.ellipse(200,70,110,40,0,0,7);ctx.fill();
      ctx.beginPath();ctx.ellipse(560,50,140,46,0,0,7);ctx.fill();
      ctx.restore();
    }
    // mountain
    ctx.fillStyle = stormAmt>0 ? '#3a2f45' : '#7a5a72';
    ctx.beginPath();
    ctx.moveTo(0,320); ctx.lineTo(260,150); ctx.lineTo(520,320); ctx.closePath(); ctx.fill();
    ctx.fillStyle = stormAmt>0 ? '#2f2638' : '#6a4a64';
    ctx.beginPath();
    ctx.moveTo(320,320); ctx.lineTo(600,180); ctx.lineTo(800,320); ctx.closePath(); ctx.fill();
    // ground
    ctx.fillStyle = stormAmt>0 ? '#241d2c' : '#8fae6a';
    ctx.beginPath();
    ctx.moveTo(0,360);
    for(var x=0;x<=CW;x+=40){ ctx.lineTo(x,355+Math.sin(x/70)*8); }
    ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.closePath(); ctx.fill();
    ctx.fillStyle = stormAmt>0 ? '#1a1420' : '#6b8a4a';
    ctx.fillRect(0,395,CW,CH-395);
    // rain
    if(stormAmt > 0){
      ctx.strokeStyle = 'rgba(200,220,255,'+(0.35*stormAmt)+')';
      ctx.lineWidth = 2;
      var rn = Math.floor(60*stormAmt);
      for(var i=0;i<rn;i++){
        var rx = (i*53)%CW;
        var ry = (i*97)%CH;
        ctx.beginPath();
        ctx.moveTo(rx,ry);
        ctx.lineTo(rx-8,ry+18);
        ctx.stroke();
      }
    }
  }

  function lerpColor(a,b,t){
    var ca = hexToRgb(a), cb = hexToRgb(b);
    var r = Math.round(ca.r + (cb.r-ca.r)*t);
    var g = Math.round(ca.g + (cb.g-ca.g)*t);
    var bl = Math.round(ca.b + (cb.b-ca.b)*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    return { r:parseInt(hex.substring(0,2),16), g:parseInt(hex.substring(2,4),16), b:parseInt(hex.substring(4,6),16) };
  }

  function drawFigure(x,y,opts){
    opts = opts||{};
    var scale = opts.scale||1;
    var skin = opts.skin||'#c9976a';
    var robe = opts.robe||'#7a3a6e';
    var sash = opts.sash||'#d6a94a';
    var old = !!opts.old;
    var female = !!opts.female;
    var expr = opts.expression||'default';
    var crown = !!opts.crown;
    var snakeAmt = opts.snakeAmt||0;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.18)';
    ctx.beginPath();ctx.ellipse(0,4,26,7,0,0,7);ctx.fill();

    if(snakeAmt > 0){
      // snake tail growing from feet upward
      ctx.strokeStyle = '#3f6b3a';
      ctx.lineWidth = 14*snakeAmt;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(0,2);
      ctx.quadraticCurveTo(18*snakeAmt,-20*snakeAmt,-4,-40*snakeAmt);
      ctx.stroke();
    }

    var legAlpha = 1 - snakeAmt;
    if(legAlpha > 0.02){
      ctx.save(); ctx.globalAlpha = legAlpha;
      ctx.fillStyle = old ? '#8a7550' : '#3b2418';
      ctx.fillRect(-14,-38,11,42);
      ctx.fillRect(3,-38,11,42);
      ctx.restore();
    }
    // body / robe
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(-20,-40);
    ctx.lineTo(20,-40);
    ctx.lineTo(16,-92);
    ctx.lineTo(-16,-92);
    ctx.closePath();
    ctx.fill();
    // sash
    ctx.fillStyle = sash;
    ctx.fillRect(-20,-58,40,9);
    // arms
    ctx.strokeStyle = robe;
    ctx.lineWidth = 10;
    ctx.lineCap='round';
    var armSwing = opts.armSwing||0;
    if(opts.armsUp){
      ctx.beginPath();ctx.moveTo(-16,-84);ctx.lineTo(-34,-104);ctx.stroke();
      ctx.beginPath();ctx.moveTo(16,-84);ctx.lineTo(34,-104);ctx.stroke();
    } else {
      ctx.beginPath();ctx.moveTo(-16,-84);ctx.lineTo(-30+armSwing,-56);ctx.stroke();
      ctx.beginPath();ctx.moveTo(16,-84);ctx.lineTo(30-armSwing,-56);ctx.stroke();
    }
    // head
    ctx.fillStyle = skin;
    ctx.beginPath();ctx.arc(0,-104,17,0,7);ctx.fill();
    // hair / headwrap
    if(crown){
      ctx.fillStyle = '#d6a94a';
      ctx.beginPath();
      ctx.moveTo(-15,-118); ctx.lineTo(-15,-130); ctx.lineTo(-7,-120);
      ctx.lineTo(0,-134); ctx.lineTo(7,-120); ctx.lineTo(15,-130);
      ctx.lineTo(15,-118); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#a9791f'; ctx.lineWidth=1.5; ctx.stroke();
    } else if(old){
      ctx.fillStyle = '#e6e2d8';
      ctx.beginPath();ctx.arc(0,-112,17,Math.PI,0);ctx.fill();
      ctx.fillStyle = '#d8d2c0';
      if(female){
        ctx.beginPath();ctx.moveTo(-15,-104);ctx.lineTo(-19,-84);ctx.lineTo(-9,-100);ctx.closePath();ctx.fill();
        ctx.beginPath();ctx.moveTo(15,-104);ctx.lineTo(19,-84);ctx.lineTo(9,-100);ctx.closePath();ctx.fill();
      }
    } else if(female){
      ctx.fillStyle = '#241407';
      ctx.beginPath();ctx.moveTo(-17,-100);ctx.lineTo(-24,-66);ctx.lineTo(-9,-96);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(17,-100);ctx.lineTo(24,-66);ctx.lineTo(9,-96);ctx.closePath();ctx.fill();
      ctx.fillStyle = sash;
      ctx.beginPath();ctx.arc(0,-116,13,Math.PI,0);ctx.fill();
    } else if(opts.helmet){
      ctx.fillStyle = '#5a5a66';
      ctx.beginPath();ctx.arc(0,-114,16,Math.PI,0);ctx.fill();
      ctx.fillRect(-16,-114,32,5);
    } else {
      ctx.fillStyle = sash;
      ctx.beginPath();ctx.arc(0,-112,18,Math.PI,0);ctx.fill();
      ctx.fillRect(-18,-114,36,7);
    }
    // wrinkles for old
    if(old){
      ctx.strokeStyle='#9a8a6a'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(-10,-108); ctx.lineTo(-4,-107); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4,-107); ctx.lineTo(10,-108); ctx.stroke();
    }
    // face
    ctx.fillStyle = '#241407';
    if(expr==='shock'){
      ctx.beginPath();ctx.arc(-5,-105,2.2,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(5,-105,2.2,0,7);ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(-5,-105,1.6,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(5,-105,1.6,0,7);ctx.fill();
    }
    ctx.strokeStyle = '#241407'; ctx.lineWidth=1.4;
    if(expr==='angry'){
      ctx.beginPath();ctx.moveTo(-9,-110);ctx.lineTo(-2,-108);ctx.stroke();
      ctx.beginPath();ctx.moveTo(9,-110);ctx.lineTo(2,-108);ctx.stroke();
      ctx.beginPath();ctx.arc(0,-98,4,Math.PI+0.3,-0.3);ctx.stroke();
    } else if(expr==='sad'){
      ctx.beginPath();ctx.arc(0,-97,4,Math.PI,0,true);ctx.stroke();
    } else if(expr==='shock'){
      ctx.beginPath();ctx.arc(0,-98,3,0,7);ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(0,-99,4,0.15,Math.PI-0.15);ctx.stroke();
    }
    // tear drop for sad regret
    if(opts.tear){
      ctx.fillStyle = 'rgba(140,190,220,.9)';
      ctx.beginPath();
      ctx.moveTo(6,-100);
      ctx.quadraticCurveTo(10,-90,6,-84);
      ctx.quadraticCurveTo(2,-90,6,-100);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGarden(){

  function drawLake(x,y,w,h,shimmer){
    ctx.save();

    g.addColorStop(1,'#1f6f6a');
    ctx.fillStyle = g;
    ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)';
    ctx.lineWidth=2;
    var s = shimmer||0;
    ctx.beginPath();ctx.ellipse(x, y-4, w*0.6, h*0.3, 0, 0.2+s*0.1, 2.6);ctx.stroke();

  function drawSnake(x,y,scale,tear){
    scale = scale||1;

    for(var i=0;i<5;i++){

    ctx.fillStyle='#3f6b3a';

  function bubble(x,y,text){
    ctx.save();
    ctx.font='bold 14px "Nunito", sans-serif';
    var w = Math.min(340, ctx.measureText(text).width + 30);
    ctx.fillStyle='#fbf2dd';
    roundRect(ctx,x-w/2,y-24,w,42,10);
    ctx.fill();
    ctx.strokeStyle='#a23b2e';ctx.lineWidth=2;
    roundRect(ctx,x-w/2,y-24,w,42,10);
    ctx.stroke();
    ctx.fillStyle='#241407';
    ctx.textAlign='center';
    wrapText(ctx, text, x, y+1, w-16, 16);
    ctx.restore();
  }
  function wrapText(ctx,text,x,y,maxWidth,lineHeight){
    var words = text.split(' ');
    var line='';
    var lines=[];
    for(var i=0;i<words.length;i++){
      var test = line + words[i] + ' ';
      if(ctx.measureText(test).width > maxWidth && line !== ''){
        lines.push(line); line = words[i]+' ';
      } else { line = test; }
    }
    lines.push(line);
    var startY = y - (lines.length-1)*lineHeight/2;
    for(var j=0;j<lines.length;j++){
      ctx.fillText(lines[j].trim(), x, startY + j*lineHeight);
    }
  }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

    clear();
    var sc = scenes[state.sceneIndex];

    switch(sc.id){
      case 'intro': renderIntro(); break;
      case 'cermin': renderCermin(); break;
      case 'minta_puri': renderMintaPuri(); break;
      case 'taman_puri': renderTamanPuri(); break;
      case 'larangan_danau': renderLaranganDanau(); break;
      case 'wanita_tua_datang': renderWanitaTuaDatang(); break;
      case 'bentak': renderBentak(); break;
      case 'nasihat': renderNasihat(); break;
      case 'hukuman': renderHukuman(); break;
      case 'kutukan': renderKutukan(); break;
      case 'penyesalan': renderPenyesalan(); break;
      case 'ending': renderEnding(); break;
    }
  }

  /* ---------------- scene transition ---------------- */
  function goToScene(i){
    stopSpeak();
    state.sceneIndex = i;
    state.locked = false;
    state.holdActive = false;
    if(state.holdRAF) cancelAnimationFrame(state.holdRAF);
    state.tapCount = 0;
    updateDots();
    var sc = scenes[i];
    if(sc.type === 'end'){
      primaryBtn.textContent = STR[lang].replayBtn;
      primaryBtn.classList.remove('hidden');
    } else {
      primaryBtn.classList.add('hidden');
    }
    setNarration(sc.narration[lang], sc.instruction ? sc.instruction[lang] : (STR[lang].nextHint));
    speak(sc.narration[lang]);
    render();
    resizeAndNotify();
  }

  function advanceOnce(){
    if(state.locked) return;
    state.locked = true;
    setTimeout(function(){
      if(state.sceneIndex < scenes.length-1){
        goToScene(state.sceneIndex+1);
      }
    }, 900);
  }

  /* ---------------- input handling ---------------- */
  function getPos(evt){
    var rect = canvas.getBoundingClientRect();
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    var sx = CW/rect.width, sy = CH/rect.height;
    return { x:(clientX-rect.left)*sx, y:(clientY-rect.top)*sy };
  }
  function inside(rect,pos){
    return rect && pos.x>=rect.x && pos.x<=rect.x+rect.w && pos.y>=rect.y && pos.y<=rect.y+rect.h;
  }

  canvas.addEventListener('pointerdown', function(e){
    if(!state.started) return;
    var sc = scenes[state.sceneIndex];
    if(!sc) return;
    var pos = getPos(e);

    if(sc.type==='tap'){
      if(state.locked) return;
      if(inside(hit[sc.target], pos)){
        if(sc.id==='nasihat'){
          state.locked = true;
          render();
          setTimeout(function(){
            if(state.sceneIndex < scenes.length-1) goToScene(state.sceneIndex+1);
          }, 2200);
          return;
        }
        render();
        advanceOnce();
      }
    } else if(sc.type==='tapcount'){
      if(state.locked) return;
      if(inside(hit[sc.target], pos)){
        state.tapCount = Math.min(sc.count, state.tapCount+1);
        render();
        if(state.tapCount >= sc.count){
          advanceOnce();
        }
      }
    } else if(sc.type==='hold'){
      if(inside(hit[sc.target], pos) && !state.holdActive && !state.locked){
        state.holdActive = true;
        state.holdStart = Date.now();
        holdLoop(sc);
      }
    }
  });

  window.addEventListener('pointerup', function(){
    var sc = scenes[state.sceneIndex];
    if(state.holdActive && sc && sc.type==='hold'){
      var elapsed = Date.now()-state.holdStart;
      state.holdActive = false;
      if(elapsed < sc.holdMs){
        render();
      }
    }
  });

  function holdLoop(sc){
    if(!state.holdActive) { render(); return; }
    var elapsed = Date.now()-state.holdStart;
    render();
    if(elapsed >= sc.holdMs){
      state.holdActive = false;
      state.tapCount = 1;
      render();
      advanceOnce();
      return;
    }
    state.holdRAF = requestAnimationFrame(function(){ holdLoop(sc); });
  }

  /* ---------------- controls ---------------- */
  primaryBtn.addEventListener('click', function(){
    if(!state.started){
      state.started = true;
      buildDots();
      goToScene(0);
    } else {
      goToScene(0);
    }
  });

  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    localStorage.setItem('lck_muted', state.muted ? '1':'0');
    muteBtn.textContent = state.muted ? '\ud83d\udd07' : '\ud83d\udd0a';
    if(state.muted) stopSpeak();
    else if(state.sceneIndex>=0){
      var sc = scenes[state.sceneIndex];
      if(sc) speak(sc.narration[lang]);
    }
  });

  langBtn.addEventListener('click', function(){
    lang = (lang==='id') ? 'en':'id';
    var url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState(null,'',url.toString());
    applyStrings();
    if(state.sceneIndex>=0){
      var sc = scenes[state.sceneIndex];
      setNarration(sc.narration[lang], sc.type==='end' ? sc.instruction[lang] : (sc.instruction? sc.instruction[lang] : STR[lang].nextHint));
      speak(sc.narration[lang]);
      render();
    }
  });

  /* ---------------- resize / iframe autosize ---------------- */
  function resizeAndNotify(){
    var h = document.getElementById('app').offsetHeight;
    try{
      window.parent.postMessage({ type:'cikaputrian-resize', height:h }, '*');
    }catch(e){}
  }
  window.addEventListener('resize', resizeAndNotify);

  /* ---------------- animation loop for idle scenes (shimmer/lightning) ---------------- */
  function idleLoop(){
    var sc = scenes[state.sceneIndex];
    if(sc && (sc.id==='larangan_danau' || sc.id==='kutukan' || sc.id==='penyesalan' || sc.id==='ending' || sc.id==='wanita_tua_datang' || sc.id==='bentak' || sc.id==='nasihat' || sc.id==='hukuman')){
      render();
    }
    requestAnimationFrame(idleLoop);
  }

  /* ---------------- init ---------------- */
  applyStrings();
  clear();
  drawBackdrop(0);
  ctx.fillStyle='#2a1620';
  ctx.font='bold 20px "Baloo 2", sans-serif';
  ctx.textAlign='center';
  ctx.fillText(lang==='id' ? 'Ketuk "Mulai Cerita" untuk memulai' : 'Tap "Start Story" to begin', CW/2, CH/2);
  setNarration(lang==='id'
    ? 'Sebuah legenda tentang kesombongan dari tanah Banten.'
    : 'A legend of arrogance from the land of Banten.', '');
  setTimeout(resizeAndNotify, 300);
  window.addEventListener('load', resizeAndNotify);
  requestAnimationFrame(idleLoop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asal Usul Burung Ruai</title>
<style>
  :root{
    --gold:#c9973a;
    --gold-light:#e6c778;
    --forest:#1f3d2b;
    --forest-light:#2f5a3e;
    --cream:#f7ecd4;
    --ink:#2b2018;
    --accent:#c1502e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Verdana, Arial, sans-serif;
    background:linear-gradient(180deg,#fbf3df,#f0e0bd);
    display:flex;
    justify-content:center;
    padding:10px 8px 16px;
  }
  #app{
    width:100%;
    max-width:760px;
    background:var(--cream);
    border:3px solid var(--gold);
    border-radius:16px;
    padding:14px;
    box-shadow:0 6px 18px rgba(43,32,24,0.25);
  }
  #topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:8px;
  }
  #title{
    font-weight:700;
    color:var(--forest);
    font-size:15px;
    letter-spacing:0.3px;
  }
  #topbtns{
    display:flex;
    gap:6px;
  }
  .iconbtn{
    background:var(--forest);
    color:var(--cream);
    border:none;
    border-radius:8px;
    width:34px;
    height:30px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .iconbtn:active{ transform:scale(0.94); }
  #canvas-wrap{
    width:100%;
    background:#0d1f14;
    border-radius:10px;
    overflow:hidden;
    line-height:0;
    border:2px solid var(--forest);
  }
  canvas{
    width:100%;
    height:auto;
    display:block;
    cursor:pointer;
    touch-action:manipulation;
  }
  #instruction{
    margin-top:10px;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    font-size:13.5px;
    padding:8px 12px;
    border-radius:8px;
    text-align:center;
    min-height:18px;
  }
  #narration{
    margin-top:8px;
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
    text-align:center;
    padding:0 6px;
    min-height:20px;
  }
  #dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:10px;
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#d8c69a;
    transition:background .2s, transform .2s;
  }
  .dot.active{
    background:var(--accent);
    transform:scale(1.3);
  }
  .dot.done{
    background:var(--forest-light);
  }
  #bottombar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
  }
  #mainBtn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 26px;
    border-radius:24px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 0 #8a3a20;
  }
  #mainBtn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #8a3a20;
  }
  #mainBtn.hidden{ display:none; }
  #footer{
    margin-top:12px;
    text-align:center;
    font-size:11px;
    color:#9a8a6c;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title">Asal Usul Burung Ruai</div>
    <div id="topbtns">
      <button class="iconbtn" id="langBtn" title="Language">EN</button>
      <button class="iconbtn" id="muteBtn" title="Mute">🔊</button>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="800" height="450"></canvas>
  </div>

  <div id="instruction"></div>
  <div id="narration"></div>
  <div id="dots"></div>
  <div id="bottombar">
    <button id="mainBtn">Mulai Cerita</button>
  </div>

  <div id="footer">Kisah rakyat Kalimantan Barat • Diceritakan ulang untuk anak-anak</div>
</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var instructionEl = document.getElementById('instruction');
  var narrationEl = document.getElementById('narration');
  var dotsEl = document.getElementById('dots');
  var mainBtn = document.getElementById('mainBtn');
  var muteBtn = document.getElementById('muteBtn');
  var langBtn = document.getElementById('langBtn');
  var footerEl = document.getElementById('footer');
  var titleEl = document.getElementById('title');

  var TOTAL_STAGES = 9;

  var params = new URLSearchParams(window.location.search);
  var initialLang = params.get('lang') === 'en' ? 'en' : (localStorage.getItem('ruai_lang') || 'id');

  var state = {
    scene: 0,          // 0 = start screen, 1..9 = story stages, 10 = ending
    lang: initialLang,
    muted: localStorage.getItem('ruai_muted') === '1',
    advancing: false,  // guard flag to prevent double-trigger
    mashCount: 0,
    mashNeeded: 8,
    holdActive: false,
    holdStart: 0,
    holdNeeded: 1400,
    holdRAF: null,
    seqOrder: [0,1,2],
    seqIndex: 0,
    seqDone: [false,false,false]
  };

  var STR = {
    id: {
      title: "Asal Usul Burung Ruai",
      start: "Mulai Cerita",
      replay: "Ulangi Cerita",
      footer: "Kisah rakyat Kalimantan Barat • Diceritakan ulang untuk anak-anak",
      startNarration: "Sebuah kisah dari kaki Gunung Ruai, Kalimantan Barat, tentang seorang putri bungsu yang baik hati.",
      startInstruction: "Ketuk tombol \"Mulai Cerita\" untuk memulai.",
      stages: [
        {
          narration: "Di kaki Gunung Ruai, hiduplah seorang raja yang bijaksana bersama tujuh putrinya yang cantik jelita. Si bungsu adalah yang paling baik hati di antara semua saudarinya.",
          instruction: "Ketuk mahkota sang raja untuk memulai kisah."
        },
        {
          narration: "Keenam kakaknya berperangai buruk dan sering menyuruh si bungsu bekerja. Jika ia menolak, mereka akan memarahinya.",
          instruction: "Ketuk sapu berkali-kali untuk membantu si bungsu menyapu halaman."
        },
        {
          narration: "Suatu hari, sang raja hendak pergi ke negeri tetangga selama dua bulan. Ia mempercayakan tahta kerajaan kepada putri bungsunya yang baik hati.",
          instruction: "Ketuk gulungan surat untuk menerima amanat sang raja."
        },
        {
          narration: "Keenam kakaknya merasa iri dan menyusun rencana jahat. Mereka mengajak si bungsu mencari ikan dengan rotan di sebuah gua.",
          instruction: "Ketuk mulut gua untuk mengikuti kakak-kakaknya masuk."
        },
        {
          narration: "Di dalam gua yang gelap, keenam kakaknya diam-diam pergi meninggalkannya sendirian.",
          instruction: "Tekan dan tahan pintu gua untuk mencoba mengejar kakak-kakaknya."
        },
        {
          narration: "Si bungsu menangis tersedu-sedu. Tangisannya terdengar oleh seorang kakek penunggu gua yang baik hati.",
          instruction: "Ketuk sosok kakek untuk meminta pertolongan."
        },
        {
          narration: "\u201cTenanglah, cucuku,\u201d kata sang kakek. \u201cAir matamu akan menjadi telur, dan kau akan menjadi burung berbulu indah.\u201d",
          instruction: "Ketuk setiap butir air mata secara berurutan dari kiri ke kanan."
        },
        {
          narration: "Si bungsu pun berubah menjadi seekor burung ruai yang cantik. Ia terbang keluar dari gua menuju ranting pohon dekat istana.",
          instruction: "Ketuk ranting pohon agar burung ruai bisa bertengger."
        },
        {
          narration: "Dari ranting itu, burung ruai melihat sang raja mengadili keenam kakaknya yang jahat. Sejak saat itu, masyarakat Kalimantan Barat percaya burung ruai yang cantik adalah jelmaan seorang putri raja.",
          instruction: ""
        }
      ]
    },
    en: {
      title: "The Origin of the Ruai Bird",
      start: "Start Story",
      replay: "Replay Story",
      footer: "A folktale from West Kalimantan • Retold for children",
      startNarration: "A tale from the foot of Mount Ruai, West Kalimantan, about a kind-hearted youngest princess.",
      startInstruction: "Tap the \"Start Story\" button to begin.",
      stages: [
        {
          narration: "At the foot of Mount Ruai lived a wise king with his seven beautiful daughters. The youngest princess was the kindest of them all.",
          instruction: "Tap the king's crown to begin the story."
        },
        {
          narration: "Her six sisters were unkind and often ordered the youngest around. If she refused, they would scold her.",
          instruction: "Tap the broom repeatedly to help the youngest sweep the yard."
        },
        {
          narration: "One day, the king planned to visit a neighboring kingdom for two months. He entrusted the throne to his kind youngest daughter.",
          instruction: "Tap the scroll to accept the king's trust."
        },
        {
          narration: "Her six jealous sisters plotted something wicked. They invited the youngest to catch fish with rattan poles in a cave.",
          instruction: "Tap the cave entrance to follow her sisters inside."
        },
        {
          narration: "Deep inside the dark cave, her six sisters quietly slipped away, leaving her all alone.",
          instruction: "Press and hold the cave doorway to try to catch up with her sisters."
        },
        {
          narration: "The youngest princess wept bitterly. Her cries reached a kind old man who watched over the cave.",
          instruction: "Tap the old man to ask for his help."
        },
        {
          narration: "\u201cBe calm, my child,\u201d said the old man. \u201cYour tears will become eggs, and you will turn into a bird with beautiful feathers.\u201d",
          instruction: "Tap each teardrop in order from left to right."
        },
        {
          narration: "The youngest princess transformed into a beautiful ruai bird. She flew out of the cave toward a tree branch near the palace.",
          instruction: "Tap the tree branch so the ruai bird can perch."
        },
        {
          narration: "From the branch, the ruai bird watched the king judge her six wicked sisters. Since then, the people of West Kalimantan have believed the beautiful ruai bird is the transformed spirit of a princess.",
          instruction: ""
        }
      ]
    }
  };

  function t(){ return STR[state.lang]; }

  // ---------------- Speech ----------------
  var voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if(window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(lang){
    if(!voices || !voices.length) return null;
    var code = lang === 'en' ? 'en' : 'id';
    var exact = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(code) === 0; });
    return exact || null;
  }
  function narrate(text){
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if(state.muted || !text) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang === 'en' ? 'en-US' : 'id-ID';
    var v = pickVoice(state.lang);
    if(v) u.voice = v;
    u.rate = 0.95;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }
  function stopNarration(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
  }

  // ---------------- Persistence ----------------
  function saveMuted(){ localStorage.setItem('ruai_muted', state.muted ? '1':'0'); }
  function saveLang(){ localStorage.setItem('ruai_lang', state.lang); }

  // ---------------- Resize / postMessage ----------------
  function reportHeight(){
    var rect = document.getElementById('app').getBoundingClientRect();
    try{
      window.parent.postMessage({ type:'ruai-resize', height: Math.ceil(rect.height) + 16 }, '*');
    }catch(e){}
  }
  window.addEventListener('load', function(){ setTimeout(reportHeight, 60); });
  window.addEventListener('resize', reportHeight);

  // ---------------- Drawing helpers ----------------
  function grad(x0,y0,x1,y1,stops){
    var g = ctx.createLinearGradient(x0,y0,x1,y1);
    stops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
    return g;
  }

  function drawSky(top,bottom){
    ctx.fillStyle = grad(0,0,0,450,[[0,top],[1,bottom]]);
    ctx.fillRect(0,0,800,450);
  }

  function drawMountain(){
    ctx.fillStyle = '#3a5c46';
    ctx.beginPath();
    ctx.moveTo(0,260);
    ctx.lineTo(180,120);
    ctx.lineTo(320,260);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2f4c3a';
    ctx.beginPath();
    ctx.moveTo(120,260);
    ctx.lineTo(300,150);
    ctx.lineTo(460,260);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround(color){
    color = color || '#4c7a4f';
    ctx.fillStyle = color;
    ctx.fillRect(0,300,800,150);
  }

  function drawPalace(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#e8d7ac';
    ctx.fillRect(-90,-70,180,90);
    ctx.fillStyle = '#c9973a';
    ctx.beginPath();
    ctx.moveTo(-105,-70);
    ctx.lineTo(0,-140);
    ctx.lineTo(105,-70);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8a5a2b';
    for(var i=-3;i<=3;i++){
      ctx.fillRect(i*24-6,-70,12,90);
    }
    ctx.fillStyle = '#a12f22';
    ctx.beginPath();
    ctx.arc(0,-140,10,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawTree(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#6b4327';
    ctx.fillRect(-8,-70,16,70);
    ctx.fillStyle = '#2f5a3e';
    ctx.beginPath();
    ctx.arc(0,-95,45,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-30,-70,32,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(32,-72,34,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawPerson(x,y,opts){
    opts = opts || {};
    var color = opts.color || '#c1502e';
    var scale = opts.scale || 1;
    var crown = !!opts.crown;
    var sad = !!opts.sad;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // dress
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-24,10);
    ctx.quadraticCurveTo(0,-50,24,10);
    ctx.closePath();
    ctx.fill();
    // head
    ctx.fillStyle = '#e7bb8c';
    ctx.beginPath();
    ctx.arc(0,-58,16,0,Math.PI*2);
    ctx.fill();
    // hair
    ctx.fillStyle = '#2b1c12';
    ctx.beginPath();
    ctx.arc(0,-62,17,Math.PI,0);
    ctx.fill();
    ctx.fillRect(-17,-62,6,26);
    ctx.fillRect(11,-62,6,26);
    if(crown){
      ctx.fillStyle = '#e6c778';
      ctx.beginPath();
      ctx.moveTo(-14,-74);
      ctx.lineTo(-14,-84);
      ctx.lineTo(-6,-76);
      ctx.lineTo(0,-88);
      ctx.lineTo(6,-76);
      ctx.lineTo(14,-84);
      ctx.lineTo(14,-74);
      ctx.closePath();
      ctx.fill();
    }
    // face
    ctx.fillStyle = '#2b2018';
    ctx.beginPath();
    ctx.arc(-5,-58,1.6,0,Math.PI*2);
    ctx.arc(5,-58,1.6,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    if(sad){
      ctx.arc(0,-49,4,Math.PI,Math.PI*2);
    }else{
      ctx.arc(0,-51,4,0,Math.PI);
    }
    ctx.strokeStyle = '#2b2018';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
  }

  function drawKing(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#3d2f6e';
    ctx.beginPath();
    ctx.moveTo(-26,12);
    ctx.quadraticCurveTo(0,-52,26,12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e7bb8c';
    ctx.beginPath();
    ctx.arc(0,-60,16,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#5b4a3a';
    ctx.fillRect(-14,-48,28,6);
    ctx.fillStyle = '#e6c778';
    ctx.beginPath();
    ctx.moveTo(-15,-76);
    ctx.lineTo(-15,-88);
    ctx.lineTo(-6,-79);
    ctx.lineTo(0,-92);
    ctx.lineTo(6,-79);
    ctx.lineTo(15,-88);
    ctx.lineTo(15,-76);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2b2018';
    ctx.beginPath();
    ctx.arc(-5,-60,1.6,0,Math.PI*2);
    ctx.arc(5,-60,1.6,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    return {crownX:x, crownY:y-88};
  }

  function drawOldMan(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#4a4038';
    ctx.beginPath();
    ctx.moveTo(-26,14);
    ctx.quadraticCurveTo(0,-46,26,14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d8b088';
    ctx.beginPath();
    ctx.arc(0,-56,15,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#eee7d8';
    ctx.beginPath();
    ctx.moveTo(-12,-50);
    ctx.quadraticCurveTo(0,-32,12,-50);
    ctx.quadraticCurveTo(0,-40,-12,-50);
    ctx.fill();
    ctx.fillStyle = '#2b2018';
    ctx.beginPath();
    ctx.arc(-5,-58,1.4,0,Math.PI*2);
    ctx.arc(5,-58,1.4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawCaveEntrance(x,y,glow){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.moveTo(-70,80);
    ctx.quadraticCurveTo(-90,-40,0,-70);
    ctx.quadraticCurveTo(90,-40,70,80);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = glow ? '#4a3f2a' : '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(-42,80);
    ctx.quadraticCurveTo(-55,-15,0,-40);
    ctx.quadraticCurveTo(55,-15,42,80);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBroom(x,y,active){
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle = '#8a5a2b';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(0,-55);
    ctx.stroke();
    ctx.fillStyle = active ? '#d8b866' : '#c9a24e';
    ctx.beginPath();
    ctx.moveTo(-16,0);
    ctx.lineTo(16,0);
    ctx.lineTo(10,26);
    ctx.lineTo(-10,26);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawScroll(x,y,pulse){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = pulse ? '#f7ecd4' : '#efe0b8';
    ctx.fillRect(-40,-14,80,28);
    ctx.fillStyle = '#c9973a';
    ctx.beginPath();
    ctx.ellipse(-40,0,7,15,0,0,Math.PI*2);
    ctx.ellipse(40,0,7,15,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#a67a30';
    ctx.lineWidth = 1.5;
    for(var i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(-26,-6+i*6);
      ctx.lineTo(26,-6+i*6);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTear(x,y,filled){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = filled ? '#e6c778' : '#8fc7e8';
    ctx.beginPath();
    ctx.moveTo(0,-14);
    ctx.quadraticCurveTo(12,6,0,14);
    ctx.quadraticCurveTo(-12,6,0,-14);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2b2018';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function drawBird(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#2f8f6b';
    ctx.beginPath();
    ctx.ellipse(0,0,26,16,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#e6c778';
    ctx.beginPath();
    ctx.ellipse(-22,-2,10,7,0.3,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#c1502e';
    ctx.beginPath();
    ctx.moveTo(-32,-2);
    ctx.lineTo(-42,2);
    ctx.lineTo(-32,4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1f5c46';
    ctx.beginPath();
    ctx.ellipse(10,2,14,8,0.5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#e6c778';
    ctx.beginPath();
    ctx.arc(-16,-8,2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawBranch(x,y){
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle = '#6b4327';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(-90,10);
    ctx.quadraticCurveTo(0,-14,90,4);
    ctx.stroke();
    ctx.restore();
  }

  function drawProgressBar(x,y,w,h,pct,label){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-w/2,0,w,h);
    ctx.fillStyle = '#e6c778';
    ctx.fillRect(-w/2,0,w*Math.max(0,Math.min(1,pct)),h);
    ctx.strokeStyle = '#2b2018';
    ctx.lineWidth = 2;
    ctx.strokeRect(-w/2,0,w,h);
    ctx.restore();
  }

  function drawHint(x,y,r){
    ctx.save();
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(230,199,120,0.9)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6,5]);
    ctx.stroke();
    ctx.restore();
  }

  // ---------------- Scene hit regions & drawing ----------------
  var hit = null; // {x,y,r} or {x,y,w,h}

  function inCircle(px,py,cx,cy,r){
    var dx=px-cx, dy=py-cy;
    return dx*dx+dy*dy <= r*r;
  }
  function inRect(px,py,x,y,w,h){
    return px>=x && px<=x+w && py>=y && py<=y+h;
  }

  function drawStartScene(){
    drawSky('#f2d78a','#c9973a');
    drawMountain();
    drawGround();
    drawPalace(400,300,1.1);
    drawTree(90,320,0.9);
    drawTree(700,330,1);
    ctx.save();
    ctx.font = 'bold 34px Georgia, serif';
    ctx.fillStyle = '#3a2410';
    ctx.textAlign = 'center';
    ctx.fillText(t().title, 400, 90);
    ctx.font = '16px Georgia, serif';
    ctx.fillStyle = '#5c3d1e';
    ctx.fillText(state.lang==='en' ? 'A folktale from West Kalimantan' : 'Cerita rakyat Kalimantan Barat', 400, 120);
    ctx.restore();
  }

  function drawStage1(){
    drawSky('#f2d78a','#c9973a');
    drawMountain();
    drawGround();
    var k = drawKing(400,330,1);
    drawPerson(280,340,{color:'#c1502e',scale:0.85,crown:true});
    drawPerson(330,345,{color:'#3d8f6e',scale:0.85,crown:true});
    drawPerson(470,345,{color:'#8a5a2b',scale:0.85,crown:true});
    drawPerson(520,340,{color:'#6b3fa0',scale:0.85,crown:true});
    drawPerson(410,352,{color:'#2f6c8f',scale:0.8,crown:true});
    drawPerson(390,352,{color:'#a04a7a',scale:0.8,crown:true});
    hit = {type:'circle', x:k.crownX, y:k.crownY, r:26};
    drawHint(hit.x,hit.y,hit.r);
  }

  function drawStage2(){
    drawSky('#e9d6ae','#b98f4e');
    drawGround('#c9a35a');
    drawPerson(560,340,{color:'#8a5a2b',scale:0.9});
    drawPerson(620,345,{color:'#6b3fa0',scale:0.85});
    drawPerson(670,340,{color:'#3d8f6e',scale:0.85});
    drawPerson(260,330,{color:'#f0e0bd',scale:1, sad:!state.mashDone});
    drawBroom(280,342, state.mashCount % 2 === 0);
    var pct = state.mashCount / state.mashNeeded;
    drawProgressBar(400,50,300,18,pct);
    ctx.save();
    ctx.font = '13px Verdana';
    ctx.fillStyle = '#3a2410';
    ctx.textAlign = 'center';
    ctx.fillText((state.lang==='en'?'Tap the broom':'Ketuk sapu') + ' ('+state.mashCount+'/'+state.mashNeeded+')', 400, 36);
    ctx.restore();
    hit = {type:'circle', x:280, y:335, r:34};
    drawHint(hit.x,hit.y,hit.r);
  }

  function drawStage3(){
    drawSky('#f2d78a','#c9973a');
    drawGround();
    drawPalace(400,300,1.05);
    drawKing(320,335,0.95);
    drawPerson(470,340,{color:'#f0e0bd',scale:0.95});
    drawScroll(400,300, Math.floor(Date.now()/400)%2===0);
    hit = {type:'rect', x:360,y:286,w:80,h:28};
    drawHint(400,300,44);
  }

  function drawStage4(){
    drawSky('#d8c79a','#8a6a3a');
    drawGround('#6a5230');
    drawCaveEntrance(560,300,false);
    drawPerson(200,340,{color:'#c1502e',scale:0.85});
    drawPerson(250,345,{color:'#3d8f6e',scale:0.85});
    drawPerson(300,340,{color:'#8a5a2b',scale:0.85});
    drawPerson(350,345,{color:'#6b3fa0',scale:0.85});
    drawPerson(400,340,{color:'#2f6c8f',scale:0.85});
    drawPerson(450,345,{color:'#a04a7a',scale:0.85});
    drawPerson(500,335,{color:'#f0e0bd',scale:0.9});
    hit = {type:'circle', x:560, y:300, r:60};
    drawHint(hit.x,hit.y,hit.r);
  }

  function drawStage5(){
    drawSky('#241c14','#120d09');
    ctx.fillStyle = '#1a1310';
    ctx.fillRect(0,300,800,150);
    drawCaveEntrance(400,240,true);
    drawPerson(400,300,{color:'#f0e0bd',scale:0.95, sad:true});
    var pct = state.holdActive ? Math.min(1,(Date.now()-state.holdStart)/state.holdNeeded) : 0;
    drawProgressBar(400,70,300,18,pct);
    ctx.save();
    ctx.font = '13px Verdana';
    ctx.fillStyle = '#eee7d8';
    ctx.textAlign = 'center';
    ctx.fillText(state.lang==='en' ? 'Hold the doorway...' : 'Tahan pintu gua...', 400, 56);
    ctx.restore();
    hit = {type:'circle', x:400, y:230, r:70};
    drawHint(hit.x,hit.y,hit.r);
  }

  function drawStage6(){
    drawSky('#241c14','#120d09');
    ctx.fillStyle = '#1a1310';
    ctx.fillRect(0,300,800,150);
    drawPerson(300,340,{color:'#f0e0bd',scale:0.95, sad:true});
    drawOldMan(520,335,1.05);
    hit = {type:'circle', x:520, y:290, r:50};
    drawHint(hit.x,hit.y,hit.r);
  }

  function drawStage7(){
    drawSky('#241c14','#120d09');
    ctx.fillStyle = '#1a1310';
    ctx.fillRect(0,300,800,150);
    drawPerson(400,345,{color:'#f0e0bd',scale:1, sad:!state.seqDone[2]});
    drawOldMan(620,340,0.9);
    var tearPositions = [ {x:300,y:250}, {x:400,y:230}, {x:500,y:250} ];
    for(var i=0;i<3;i++){
      drawTear(tearPositions[i].x, tearPositions[i].y, state.seqDone[i]);
      if(!state.seqDone[i]){
        drawHint(tearPositions[i].x, tearPositions[i].y, 24);
      }
    }
    hit = {type:'seq', points: tearPositions, r:26};
  }

  function drawStage8(){
    drawSky('#dff0e0','#a8d9b6');
    drawMountain();
    drawGround();
    drawPalace(620,340,0.85);
    drawTree(220,320,1.15);
    drawBranch(220,205);
    drawBird(400,140,1);
    ctx.save();
    ctx.strokeStyle = 'rgba(230,199,120,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(400,150);
    ctx.quadraticCurveTo(300,190,240,200);
    ctx.stroke();
    ctx.restore();
    hit = {type:'rect', x:140, y:190, w:170, h:30};
    drawHint(220,205,50);
  }

  function drawStage9(){
    drawSky('#dff0e0','#a8d9b6');
    drawMountain();
    drawGround();
    drawPalace(560,340,0.9);
    drawTree(180,330,1.1);
    drawBranch(180,215);
    drawBird(180,190,0.9);
    drawKing(560,340,0.8);
    for(var i=0;i<6;i++){
      drawPerson(480+i*22,352,{color:['#c1502e','#3d8f6e','#8a5a2b','#6b3fa0','#2f6c8f','#a04a7a'][i], scale:0.6, sad:true});
    }
    hit = null;
  }

  var SCENE_DRAW = {
    0: drawStartScene,
    1: drawStage1,
    2: drawStage2,
    3: drawStage3,
    4: drawStage4,
    5: drawStage5,
    6: drawStage6,
    7: drawStage7,
    8: drawStage8,
    9: drawStage9
  };

  var animTimer = null;
  function render(){
    var fn = SCENE_DRAW[state.scene];
    if(fn) fn();
  }
  function startAnimLoop(){
    if(animTimer) return;
    animTimer = setInterval(function(){
      if(state.scene===2 || state.scene===3 || state.scene===5){
        render();
      }
    }, 120);
  }

  // ---------------- Dots ----------------
  function renderDots(){
    dotsEl.innerHTML = '';
    if(state.scene === 0) return;
    for(var i=1;i<=TOTAL_STAGES;i++){
      var d = document.createElement('div');
      d.className = 'dot' + (i===state.scene ? ' active' : (i<state.scene ? ' done' : ''));
      dotsEl.appendChild(d);
    }
  }

  // ---------------- Text panel ----------------
  function renderText(){
    if(state.scene === 0){
      narrationEl.textContent = t().startNarration;
      instructionEl.textContent = t().startInstruction;
      return;
    }
    var s = t().stages[state.scene-1];
    narrationEl.textContent = s.narration;
    instructionEl.textContent = s.instruction;
    instructionEl.style.display = s.instruction ? 'block' : 'none';
  }

  function speakCurrent(){
    if(state.scene === 0){
      narrate(t().startNarration);
    } else {
      var s = t().stages[state.scene-1];
      narrate(s.narration);
    }
  }

  // ---------------- Button state ----------------
  function renderButton(){
    if(state.scene === 0){
      mainBtn.textContent = t().start;
      mainBtn.classList.remove('hidden');
    } else if(state.scene === 9){
      mainBtn.textContent = t().replay;
      mainBtn.classList.remove('hidden');
    } else {
      mainBtn.classList.add('hidden');
    }
  }

  function updateUI(){
    render();
    renderDots();
    renderText();
    renderButton();
    titleEl.textContent = t().title;
    footerEl.textContent = t().footer;
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    langBtn.textContent = state.lang === 'en' ? 'ID' : 'EN';
    reportHeight();
  }

  function goToScene(n){
    state.advancing = false;
    state.scene = n;
    state.mashCount = 0;
    state.mashDone = false;
    state.holdActive = false;
    state.seqIndex = 0;
    state.seqDone = [false,false,false];
    updateUI();
    speakCurrent();
  }

  // ---------------- Interaction ----------------
  function getLogicalCoords(evt){
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if(evt.touches && evt.touches.length){
      clientX = evt.touches[0].clientX;
      clientY = evt.touches[0].clientY;
    } else {
      clientX = evt.clientX;
      clientY = evt.clientY;
    }
    var lx = (clientX - rect.left) / rect.width * 800;
    var ly = (clientY - rect.top) / rect.height * 450;
    return {x:lx, y:ly};
  }

  function handleTap(evt){
    if(state.scene === 0 || state.scene === 9) return;
    if(state.advancing) return;
    var p = getLogicalCoords(evt);
    if(!hit) return;

    if(state.scene === 2){
      // mash mechanic
      if(hit.type==='circle' && inCircle(p.x,p.y,hit.x,hit.y,hit.r)){
        state.mashCount = Math.min(state.mashNeeded, state.mashCount+1);
        render();
        if(state.mashCount >= state.mashNeeded){
          state.advancing = true;
          state.mashDone = true;
          setTimeout(function(){ goToScene(3); }, 400);
        }
      }
      return;
    }

    if(state.scene === 7){
      if(hit.type==='seq'){
        var target = hit.points[state.seqIndex];
        if(target && inCircle(p.x,p.y,target.x,target.y,hit.r)){
          state.seqDone[state.seqIndex] = true;
          state.seqIndex++;
          render();
          if(state.seqIndex >= 3){
            state.advancing = true;
            setTimeout(function(){ goToScene(8); }, 500);
          }
        }
      }
      return;
    }

    // simple single-tap scenes: 1,3,4,6,8
    var hitOk = false;
    if(hit.type === 'circle'){
      hitOk = inCircle(p.x,p.y,hit.x,hit.y,hit.r);
    } else if(hit.type === 'rect'){
      hitOk = inRect(p.x,p.y,hit.x,hit.y,hit.w,hit.h);
    }
    if(hitOk){
      state.advancing = true;
      setTimeout(function(){ goToScene(state.scene+1); }, 350);
    }
  }

  function handlePressStart(evt){
    if(state.scene !== 5 || state.advancing) return;
    var p = getLogicalCoords(evt);
    if(!hit || hit.type!=='circle') return;
    if(!inCircle(p.x,p.y,hit.x,hit.y,hit.r)) return;
    state.holdActive = true;
    state.holdStart = Date.now();
    var loop = function(){
      if(!state.holdActive) return;
      render();
      if(Date.now() - state.holdStart >= state.holdNeeded){
        state.holdActive = false;
        state.advancing = true;
        setTimeout(function(){ goToScene(6); }, 300);
        return;
      }
      state.holdRAF = requestAnimationFrame(loop);
    };
    loop();
  }
  function handlePressEnd(){
    if(state.scene === 5 && state.holdActive && !state.advancing){
      state.holdActive = false;
      if(state.holdRAF) cancelAnimationFrame(state.holdRAF);
      render();
    }
  }

  canvas.addEventListener('mousedown', function(e){ handlePressStart(e); });
  canvas.addEventListener('mouseup', function(e){ handlePressEnd(e); handleTap(e); });
  canvas.addEventListener('mouseleave', function(e){ handlePressEnd(e); });
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); handlePressStart(e); }, {passive:false});
  canvas.addEventListener('touchend', function(e){ e.preventDefault(); handlePressEnd(e); handleTap(e); }, {passive:false});

  mainBtn.addEventListener('click', function(){
    if(state.scene === 0){ goToScene(1); }
    else if(state.scene === 9){ goToScene(0); }
  });

  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    saveMuted();
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if(state.muted) stopNarration(); else speakCurrent();
  });

  langBtn.addEventListener('click', function(){
    state.lang = state.lang === 'en' ? 'id' : 'en';
    saveLang();
    updateUI();
    speakCurrent();
  });

  // ---------------- Init ----------------
  updateUI();
  startAnimLoop();
})();
</script>
</body>
</html>

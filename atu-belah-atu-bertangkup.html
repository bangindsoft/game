<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atu Belah Atu Bertangkup - Cerita Rakyat Aceh</title>
<style>
  :root{
    --forest-dark:#1b2e1f;
    --forest-mid:#2f4a33;
    --forest-light:#4c7a4f;
    --gold:#e8b64c;
    --gold-glow:#ffd97a;
    --stone:#7c7873;
    --stone-dark:#4f4c48;
    --cream:#f4ecd8;
    --accent:#c0392b;
    --panel-bg:#22301f;
    --text-light:#f4ecd8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(180deg,#0f1a10,#1b2e1f);
    color:var(--text-light);
    overflow-x:hidden;
  }
  #app{
    max-width:820px;
    margin:0 auto;
    padding:10px 10px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .topbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    gap:8px;
  }
  .title{
    font-size:15px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.3px;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .controls{
    display:flex;
    gap:6px;
  }
  .iconbtn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(232,182,76,.4);
    color:var(--cream);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
    transition:background .15s;
  }
  .iconbtn:hover{background:rgba(255,255,255,.16);}
  .iconbtn:active{transform:scale(.96);}

  #canvasWrap{
    position:relative;
    width:100%;
    aspect-ratio:8/5;
    background:linear-gradient(180deg,#274a2b 0%,#1b2e1f 100%);
    border-radius:14px;
    overflow:hidden;
    border:3px solid #3a2a18;
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.25);
    touch-action:none;
  }
  #game{
    width:100%;
    height:100%;
    display:block;
  }

  #startOverlay, #endOverlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(10,15,10,.88),rgba(10,15,10,.94));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    z-index:5;
  }
  #startOverlay h1, #endOverlay h1{
    color:var(--gold);
    font-size:clamp(18px,4vw,28px);
    margin:0 0 10px;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  #startOverlay p, #endOverlay p{
    color:var(--cream);
    max-width:520px;
    font-size:clamp(12px,2.6vw,14px);
    line-height:1.5;
    margin:0 0 18px;
    opacity:.9;
  }
  .bigbtn{
    background:linear-gradient(180deg,var(--gold-glow),var(--gold));
    color:#3a2a10;
    border:none;
    border-radius:30px;
    padding:12px 28px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    transition:transform .15s;
  }
  .bigbtn:hover{transform:translateY(-2px);}
  .bigbtn:active{transform:scale(.96);}

  #dots{
    display:flex;
    gap:6px;
    margin:10px 0 8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(255,255,255,.25);
    transition:background .2s, transform .2s;
  }
  .dot.active{background:var(--gold);transform:scale(1.3);}
  .dot.done{background:var(--forest-light);}

  #narrationPanel{
    width:100%;
    background:var(--panel-bg);
    border:1px solid rgba(232,182,76,.25);
    border-radius:12px;
    padding:12px 16px;
    min-height:70px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  #narrationText{
    font-size:14px;
    line-height:1.55;
    color:var(--cream);
  }
  #instructionText{
    font-size:13px;
    color:var(--gold);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  #instructionText:before{
    content:"👉";
  }

  footer{
    margin-top:14px;
    font-size:11px;
    color:rgba(244,236,216,.4);
    text-align:center;
    padding-bottom:6px;
  }

  .langswitch{
    font-size:12px;
    font-weight:700;
  }

  @media (max-width:480px){
    .title{font-size:13px;}
    .iconbtn{padding:5px 8px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title" id="titleText">Atu Belah Atu Bertangkup</div>
    <div class="controls">
      <button class="iconbtn langswitch" id="langBtn">EN</button>
      <button class="iconbtn" id="muteBtn">🔊</button>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="startOverlay">
      <h1 id="startTitle">Atu Belah Atu Bertangkup</h1>
      <p id="startDesc">Cerita rakyat dari Aceh tentang batu ajaib, keserakahan, dan keikhlasan seorang anak.</p>
      <button class="bigbtn" id="startBtn">▶ Mulai Cerita</button>
    </div>
    <div id="endOverlay" style="display:none;">
      <h1 id="endTitle">Selesai!</h1>
      <p id="endDesc">Terima kasih telah mengikuti kisah Mak Intan dan Amat.</p>
      <button class="bigbtn" id="replayBtn">↻ Ulangi Cerita</button>
    </div>
  </div>

  <div id="dots"></div>

  <div id="narrationPanel">
    <div id="narrationText"></div>
    <div id="instructionText"></div>
  </div>

  <footer id="footerText">Kisah rakyat Nusantara &middot; Dongeng interaktif</footer>
</div>

<script>
(function(){
"use strict";

/* ============ i18n ============ */
const params = new URLSearchParams(location.search);
let lang = (params.get('lang') === 'en') ? 'en' : (localStorage.getItem('abab_lang') || 'id');

const UI = {
  id:{
    title:"Atu Belah Atu Bertangkup",
    startTitle:"Atu Belah Atu Bertangkup",
    startDesc:"Cerita rakyat dari Aceh tentang batu ajaib, keserakahan, dan keikhlasan seorang anak. Ketuk tombol di bawah untuk memulai.",
    startBtn:"▶ Mulai Cerita",
    endTitle:"Selesai!",
    endDesc:"Terima kasih telah mengikuti kisah Mak Intan dan Amat. Keserakahan membawa petaka, keikhlasan membawa kebahagiaan.",
    replayBtn:"↻ Ulangi Cerita",
    footer:"Kisah rakyat Nusantara · Dongeng interaktif",
    langBtnLabel:"EN"
  },
  en:{
    title:"The Split Stone (Atu Belah Atu Bertangkup)",
    startTitle:"The Split Stone",
    startDesc:"A folktale from Aceh about a magic stone, greed, and a child's sincerity. Tap the button below to begin.",
    startBtn:"▶ Start Story",
    endTitle:"The End!",
    endDesc:"Thank you for following the story of Mak Intan and Amat. Greed brings misfortune, sincerity brings happiness.",
    replayBtn:"↻ Replay Story",
    footer:"Indonesian folktales · Interactive story",
    langBtnLabel:"ID"
  }
};

function applyStaticUI(){
  const t = UI[lang];
  document.getElementById('titleText').textContent = t.title;
  document.getElementById('startTitle').textContent = t.startTitle;
  document.getElementById('startDesc').textContent = t.startDesc;
  document.getElementById('startBtn').textContent = t.startBtn;
  document.getElementById('endTitle').textContent = t.endTitle;
  document.getElementById('endDesc').textContent = t.endDesc;
  document.getElementById('replayBtn').textContent = t.replayBtn;
  document.getElementById('footerText').textContent = t.footer;
  document.getElementById('langBtn').textContent = t.langBtnLabel;
  document.documentElement.lang = lang;
}
applyStaticUI();

document.getElementById('langBtn').addEventListener('click', ()=>{
  lang = (lang === 'id') ? 'en' : 'id';
  localStorage.setItem('abab_lang', lang);
  applyStaticUI();
  updateNarration();
  buildDots();
});

/* ============ Mute ============ */
let muted = (localStorage.getItem('abab_muted') === '1');
function updateMuteBtn(){
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
}
updateMuteBtn();
document.getElementById('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  localStorage.setItem('abab_muted', muted ? '1':'0');
  updateMuteBtn();
  if(muted && window.speechSynthesis) speechSynthesis.cancel();
  else speakCurrent();
});

/* ============ Speech ============ */
let voicesCache = [];
function loadVoices(){ voicesCache = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(l){
  if(!voicesCache || !voicesCache.length) return null;
  const wantId = l === 'id';
  let v = voicesCache.find(v => wantId ? v.lang.toLowerCase().startsWith('id') : v.lang.toLowerCase().startsWith('en'));
  return v || null;
}
function speak(text){
  if(!window.speechSynthesis || muted || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'id' ? 'id-ID' : 'en-US';
  const v = pickVoice(lang);
  if(v) u.voice = v;
  u.rate = 0.95;
  u.pitch = 1.0;
  speechSynthesis.speak(u);
}
function speakCurrent(){
  const sc = scenes[currentIndex];
  if(sc) speak(sc.narration[lang]);
}

/* ============ Canvas setup ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const BASE_W = 800, BASE_H = 500;
let scaleRatio = 1;

function resizeCanvas(){
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scaleRatio = rect.width / BASE_W;
  ctx.scale(scaleRatio, scaleRatio);
  postResize();
}
window.addEventListener('resize', resizeCanvas);

function postResize(){
  try{
    const h = document.getElementById('app').getBoundingClientRect().height + 20;
    window.parent.postMessage({type:'abab-resize', height: Math.ceil(h)}, '*');
  }catch(e){}
}

/* ============ Pointer helpers ============ */
function getPos(evt){
  const rect = canvas.getBoundingClientRect();
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  return {
    x: (clientX - rect.left) * (BASE_W / rect.width),
    y: (clientY - rect.top) * (BASE_H / rect.height)
  };
}
let pointerDown = false;
canvas.addEventListener('pointerdown', e=>{
  pointerDown = true;
  const p = getPos(e);
  const sc = scenes[currentIndex];
  if(sc && sc.onDown) sc.onDown(p.x,p.y);
});
canvas.addEventListener('pointermove', e=>{
  const p = getPos(e);
  const sc = scenes[currentIndex];
  if(sc && sc.onMove) sc.onMove(p.x,p.y,pointerDown);
});
window.addEventListener('pointerup', e=>{
  pointerDown = false;
  const sc = scenes[currentIndex];
  if(sc && sc.onUp) sc.onUp();
});

/* ============ Utility drawing ============ */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawButton(btn){
  ctx.save();
  ctx.globalAlpha = btn.disabled ? 0.4 : 1;
  ctx.fillStyle = btn.color || '#e8b64c';
  roundRect(btn.x,btn.y,btn.w,btn.h,btn.h/2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = btn.textColor || '#3a2a10';
  ctx.font = 'bold 16px Segoe UI';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(btn.label, btn.x+btn.w/2, btn.y+btn.h/2+1);
  ctx.restore();
}
function hitButton(btn,x,y){
  return btn && !btn.disabled && x>=btn.x && x<=btn.x+btn.w && y>=btn.y && y<=btn.y+btn.h;
}
function drawProgressBar(x,y,w,h,pct,color){
  ctx.save();
  roundRect(x,y,w,h,h/2);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fill();
  const fw = Math.max(h, w*Math.min(1,pct));
  roundRect(x,y,fw,h,h/2);
  ctx.fillStyle = color || '#e8b64c';
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)';
  ctx.lineWidth=1.5;
  roundRect(x,y,w,h,h/2);
  ctx.stroke();
  ctx.restore();
}

/* Forest background */
function drawForestBg(t){
  const g = ctx.createLinearGradient(0,0,0,BASE_H);
  g.addColorStop(0,'#3b5c3e');
  g.addColorStop(1,'#1b2e1f');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,BASE_W,BASE_H);
  // ground
  ctx.fillStyle = '#2a3f24';
  ctx.beginPath();
  ctx.ellipse(BASE_W/2, BASE_H+40, BASE_W*0.75, 120, 0, 0, Math.PI*2);
  ctx.fill();
  // trees (procedural)
  const treeXs = [60,140,690,740,20,760];
  treeXs.forEach((tx,i)=>{
    const sway = Math.sin(t/900 + i)*3;
    drawTree(tx + sway, 70 + (i%2)*10, 0.8 + (i%3)*0.15);
  });
}
function drawTree(x,y,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.fillStyle = '#3d2a18';
  ctx.fillRect(-8,60,16,90);
  ctx.fillStyle = '#2f5c34';
  ctx.beginPath();
  ctx.ellipse(0,40,50,60,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#376b3d';
  ctx.beginPath();
  ctx.ellipse(-20,20,32,38,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(25,15,30,36,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* Person figure: Mak Intan (adult) or Amat (child) */
function drawPerson(x,y,scale,opts){
  opts = opts || {};
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  const bob = opts.bob || 0;
  ctx.translate(0, Math.sin(bob)*2);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();
  ctx.ellipse(0,72,26,8,0,0,Math.PI*2);
  ctx.fill();
  // body (kebaya-like)
  ctx.fillStyle = opts.bodyColor || '#8a4b3b';
  roundRect(-18,10,36,55,14);
  ctx.fill();
  // sash
  ctx.fillStyle = opts.sashColor || '#c0392b';
  ctx.fillRect(-18,38,36,8);
  // arms
  ctx.strokeStyle = opts.bodyColor || '#8a4b3b';
  ctx.lineWidth = 10;
  ctx.lineCap='round';
  const armSwing = opts.armSwing || 0;
  ctx.beginPath();
  ctx.moveTo(-16,20); ctx.lineTo(-30,42+armSwing);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(16,20); ctx.lineTo(30,42-armSwing);
  ctx.stroke();
  // head
  ctx.fillStyle = '#e8b98a';
  ctx.beginPath();
  ctx.arc(0,-6,17,0,Math.PI*2);
  ctx.fill();
  // hair / head covering
  ctx.fillStyle = opts.hairColor || '#2b1b12';
  ctx.beginPath();
  ctx.arc(0,-10,18,Math.PI, Math.PI*2);
  ctx.fill();
  if(opts.headscarf){
    ctx.fillStyle = opts.scarfColor || '#d98c3f';
    ctx.beginPath();
    ctx.arc(0,-9,19,Math.PI*0.9,Math.PI*2.1);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(14,-4); ctx.lineTo(26,14); ctx.lineTo(16,10); ctx.closePath();
    ctx.fill();
  }
  // face
  ctx.fillStyle='#2b1b12';
  ctx.beginPath(); ctx.arc(-5,-6,1.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-6,1.6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#8a4b3b';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(0,-1,4,0.15*Math.PI,0.85*Math.PI);
  ctx.stroke();
  // legs
  ctx.strokeStyle = opts.bodyColor || '#8a4b3b';
  ctx.lineWidth=11;
  ctx.beginPath();
  ctx.moveTo(-8,62); ctx.lineTo(-10,78);
  ctx.moveTo(8,62); ctx.lineTo(10,78);
  ctx.stroke();
  ctx.restore();
}

/* Stone (Atu) */
function drawStone(x,y,scale,openAmt,glow){
  // openAmt: 0 closed .. 1 fully open (split apart)
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  const gap = openAmt * 46;
  if(glow>0){
    const grad = ctx.createRadialGradient(0,0,10,0,0,120);
    grad.addColorStop(0, `rgba(255,217,122,${0.55*glow})`);
    grad.addColorStop(1, 'rgba(255,217,122,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0,0,120,0,Math.PI*2);
    ctx.fill();
  }
  // shadow
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(0,78,90,16,0,0,Math.PI*2);
  ctx.fill();

  function half(sign){
    ctx.save();
    ctx.translate(sign*gap,0);
    ctx.beginPath();
    ctx.moveTo(sign*-70,70);
    ctx.lineTo(sign*-78,10);
    ctx.lineTo(sign*-40,-60);
    ctx.lineTo(sign*10,-72);
    ctx.lineTo(sign*10,70);
    ctx.closePath();
    const g = ctx.createLinearGradient(sign*-78,-72,sign*10,70);
    g.addColorStop(0,'#8f8b84');
    g.addColorStop(1,'#57534d');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle='#3a3733';
    ctx.lineWidth=3;
    ctx.stroke();
    // cracks/texture
    ctx.strokeStyle='rgba(0,0,0,.15)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(sign*-50,0); ctx.lineTo(sign*-20,-20);
    ctx.moveTo(sign*-40,30); ctx.lineTo(sign*-10,20);
    ctx.stroke();
    ctx.restore();
  }
  half(-1); half(1);

  if(openAmt>0.05){
    const grad2 = ctx.createLinearGradient(-30,-60,30,60);
    grad2.addColorStop(0,'#fff3c4');
    grad2.addColorStop(1,'#e8b64c');
    ctx.fillStyle = grad2;
    ctx.globalAlpha = Math.min(1,openAmt*1.4);
    roundRect(-gap+8,-60,gap*2-16,132,10);
    ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawGem(x,y,size,color){
  ctx.save();
  ctx.translate(x,y);
  ctx.beginPath();
  ctx.moveTo(0,-size); ctx.lineTo(size*0.8,0); ctx.lineTo(0,size); ctx.lineTo(-size*0.8,0);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();
}
function drawGoldPile(x,y,size){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#e8b64c';
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.arc(Math.cos(i*1.3)*size*0.4, Math.sin(i*1.3)*size*0.25, size*0.35,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawWoodBundle(x,y,size){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(-0.1);
  for(let i=-2;i<=2;i++){
    ctx.fillStyle = i%2===0? '#7a5230':'#6b471f';
    roundRect(-size, i*size*0.28-3, size*2, size*0.24, 4);
    ctx.fill();
  }
  ctx.strokeStyle='#3a2a12';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-size*0.6,-size*0.7); ctx.lineTo(size*0.6,size*0.7);
  ctx.stroke();
  ctx.restore();
}
function drawGardenPatch(x,y,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.fillStyle='#5a3d22';
  roundRect(-45,-6,90,30,6);
  ctx.fill();
  for(let i=-3;i<=3;i++){
    ctx.fillStyle = '#4f8a3f';
    ctx.beginPath();
    ctx.ellipse(i*12, -8, 8,14,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawFootprint(x,y,size){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();
  ctx.ellipse(0,0,size*0.5,size*0.8,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ============ Particles (sparkle) ============ */
let particles = [];
function spawnSparkles(x,y,n,color){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*3,
      vy:-Math.random()*3-1,
      life:1,
      color: color || '#ffd97a',
      size: 2+Math.random()*3
    });
  }
}
function updateParticles(dt){
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.06*dt/16;
    p.life -= 0.015*dt/16;
  });
  particles = particles.filter(p=>p.life>0);
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

/* ============ Scene definitions ============ */
let currentIndex = 0;
let started = false;
let lastTime = 0;

function nextScene(){
  if(currentIndex < scenes.length-1){
    currentIndex++;
    enterScene();
  } else {
    finishStory();
  }
}

function enterScene(){
  const sc = scenes[currentIndex];
  if(sc.init) sc.init();
  updateNarration();
  buildDots();
  speakCurrent();
}

function updateNarration(){
  const sc = scenes[currentIndex];
  document.getElementById('narrationText').textContent = sc.narration[lang];
  document.getElementById('instructionText').textContent = sc.instruction[lang];
}

function buildDots(){
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  scenes.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i===currentIndex ? ' active' : (i<currentIndex ? ' done':''));
    dotsEl.appendChild(d);
  });
}

function finishStory(){
  document.getElementById('endOverlay').style.display = 'flex';
  if(window.speechSynthesis) speechSynthesis.cancel();
  speak(UI[lang].endDesc);
  postResize();
}

/* ---- Scene 11: Ending - Mak Intan bebas ---- */
const scene11 = {
  narration:{
    id:"Batu itu bergetar dan terbelah. Mak Intan pun keluar dengan selamat! Amat dan ibunya berpelukan penuh bahagia, dan sejak itu mereka tak pernah serakah lagi.",
    en:"The stone trembled and split open. Mak Intan came out safely! Amat and his mother embraced with joy, and from then on, they were never greedy again."
  },
  instruction:{
    id:"Ketuk untuk memeluk ibu.",
    en:"Tap to hug your mother."
  },
  state:{},
  init(){
    this.state = { openAmt:0, hugged:false, animating:true };
    const step = ()=>{
      this.state.openAmt = Math.min(1, this.state.openAmt+0.03);
      if(this.state.openAmt<1) requestAnimationFrame(step);
    };
    step();
  },
  onDown(x,y){
    if(this.state.hugged) return;
    const dx=x-400,dy=y-300;
    if(dx*dx+dy*dy < 160*160){
      this.state.hugged = true;
      spawnSparkles(400,300,24,'#ffd97a');
      setTimeout(finishStory, 1400);
    }
  },
  draw(t){
    drawForestBg(t);
    const s = this.state;
    drawStone(400,280,1.1,s.openAmt,0.4);
    if(s.openAmt>0.7){
      const hugOffset = s.hugged ? 0 : 20;
      drawPerson(400-hugOffset,300,0.95,{bob:t/260, bodyColor:'#8a4b3b'});
      drawPerson(400+hugOffset,320,0.75,{bob:t/230, hairColor:'#2b1b12', bodyColor:'#4c7a4f'});
    }
    updateParticles(16); drawParticles();
  }
};

const scenes = [scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11];

/* ============ Main loop ============ */
function loop(ts){
  if(!lastTime) lastTime = ts;
  const dt = Math.min(50, ts - lastTime);
  lastTime = ts;
  ctx.clearRect(0,0,BASE_W,BASE_H);
  if(started){
    const sc = scenes[currentIndex];
    if(sc.update) sc.update(dt);
    if(sc.draw) sc.draw(ts);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============ Start / Replay ============ */
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('startOverlay').style.display = 'none';
  started = true;
  currentIndex = 0;
  enterScene();
});
document.getElementById('replayBtn').addEventListener('click', ()=>{
  document.getElementById('endOverlay').style.display = 'none';
  currentIndex = 0;
  particles = [];
  enterScene();
});

buildDots();
window.addEventListener('load', resizeCanvas);
setTimeout(resizeCanvas, 50);
new ResizeObserver(()=>{resizeCanvas();}).observe(wrap);
new ResizeObserver(()=>{postResize();}).observe(document.getElementById('app'));

})();
</script>

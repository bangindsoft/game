  }

    font-size:.85rem;
    cursor:pointer;

  }

    overflow:hidden;

    border:1px solid #35502f;
  }
  #ampCanvas{
    width:100%;
    height:100%;
    display:block;
  }
  .amp-hotspots{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .amp-hotspot{
    position:absolute;
    pointer-events:auto;
    background:rgba(217,164,65,0.14);
    border:2px dashed rgba(217,164,65,0.85);
    border-radius:12px;
    cursor:pointer;
    animation:amp-pulse 1.8s ease-in-out infinite;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:2px;
  }
  .amp-hotspot:hover{background:rgba(217,164,65,0.28);}
  .amp-hotspot span{
    font-size:.68rem;

    border-radius:6px;

    inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(27,42,30,.72), rgba(15,22,16,.94));

  .amp-dot{

  /* ============ CANVAS SETUP (DPR) ============ */
  function fitCanvas(){
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr * (rect.width/W), 0, 0, dpr * (rect.height/H), 0, 0);
    draw();
  }
  window.addEventListener('resize', fitCanvas);

  /* ============ SPEECH ============ */
  var voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(lang){
    var target = lang === 'en' ? 'en' : 'id';
    var v = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(target) === 0; });
    return v || null;
  }
  function speak(text){
    if (!window.speechSynthesis || state.muted || !text) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang === 'en' ? 'en-US' : 'id-ID';
    var v = pickVoice(state.lang);
    if (v) u.voice = v;
    u.rate = 0.94;
    u.pitch = 1.0;
    speechSynthesis.speak(u);
  }
  function stopSpeak(){ if (window.speechSynthesis) speechSynthesis.cancel(); }

  /* ============ RESIZE MESSAGE TO PARENT ============ */

  }
  if (window.ResizeObserver){

  }

    startDesc.textContent = t.startDesc;

  /* ============ DRAWING HELPERS ============ */
  function clear(){
    ctx.clearRect(0,0,W,H);
  }
  function skyBG(topC, botC){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, topC);
    g.addColorStop(1, botC);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }
  function cloud(x,y,s){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(s,s);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(0,0,26,0,Math.PI*2);
    ctx.arc(28,-8,20,0,Math.PI*2);
    ctx.arc(-28,-6,18,0,Math.PI*2);
    ctx.arc(14,10,22,0,Math.PI*2);
    ctx.arc(-14,10,20,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function candiGate(x,y,scale,color){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = color || '#3d5240';
    ctx.beginPath();
    ctx.moveTo(-10,60); ctx.lineTo(-40,60); ctx.lineTo(-8,-70); ctx.lineTo(2,-70); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(10,60); ctx.lineTo(40,60); ctx.lineTo(8,-70); ctx.lineTo(-2,-70); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function ground(color, y){
    y = y===undefined ? 380 : y;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.quadraticCurveTo(W/2, y-24, W, y);
    ctx.lineTo(W,H); ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();
  }
  function glow(x,y,r,color){
    var g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,color);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }
  // generic robed figure
  function person(x,y,scale,opt){
    opt = opt || {};
    var robe = opt.robe || '#8a6f3a';
    var skin = opt.skin || '#e6b98a';
    var accent = opt.accent || '#d9a441';
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0,84,34,9,0,0,Math.PI*2); ctx.fill();
    // robe
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(-30,80);
    ctx.quadraticCurveTo(-40,10,-14,-20);
    ctx.lineTo(14,-20);
    ctx.quadraticCurveTo(40,10,30,80);
    ctx.closePath();
    ctx.fill();
    // sash
    ctx.strokeStyle = accent;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-18,10); ctx.lineTo(18,40);
    ctx.stroke();
    // arms
    ctx.strokeStyle = robe;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14,-6); ctx.lineTo(opt.armOutL?-42:-28, opt.armOutL?-10:26);
    ctx.moveTo(14,-6); ctx.lineTo(opt.armOutR?42:28, opt.armOutR?-10:26);
    ctx.stroke();
    // hands
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(opt.armOutL?-42:-28, opt.armOutL?-10:26,6,0,Math.PI*2);
    ctx.arc(opt.armOutR?42:28, opt.armOutR?-10:26,6,0,Math.PI*2);
    ctx.fill();
    // neck+head
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(0,-34,17,0,Math.PI*2); ctx.fill();
    // hair / crown
    if (opt.crown){
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.moveTo(-16,-46); ctx.lineTo(0,-70); ctx.lineTo(16,-46);
      ctx.lineTo(10,-40); ctx.lineTo(0,-56); ctx.lineTo(-10,-40);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = opt.hair || '#2b2118';
      ctx.beginPath(); ctx.arc(0,-40,15,Math.PI, Math.PI*2); ctx.fill();
      if (opt.bun){
        ctx.beginPath(); ctx.arc(0,-58,7,0,Math.PI*2); ctx.fill();
      }
    }
    if (opt.staff){
      ctx.strokeStyle = '#7a5a33';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(38,-30); ctx.lineTo(38,70);
      ctx.stroke();
    }
    // face hint
    ctx.fillStyle = 'rgba(60,40,20,0.5)';
    ctx.beginPath(); ctx.arc(-6,-33,1.6,0,Math.PI*2); ctx.arc(6,-33,1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function egg(x,y,scale,opt){
    opt = opt||{};
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.rotate(opt.rot||0);
    var g = ctx.createLinearGradient(-20,-26,20,26);
    g.addColorStop(0, opt.color1 || '#fff3d6');
    g.addColorStop(1, opt.color2 || '#e9c877');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0,0,18,24,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,140,50,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (opt.crack){
      ctx.strokeStyle = '#8a6a2a';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-8,-16); ctx.lineTo(-2,-4); ctx.lineTo(6,-8); ctx.lineTo(2,6); ctx.lineTo(9,16);
      ctx.stroke();
    }
    ctx.restore();
  }
  function box(x,y,scale,open){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#caa24a';
    ctx.fillRect(-22,-6,44,26);
    ctx.strokeStyle = '#7a5a1f';
    ctx.lineWidth = 2;
    ctx.strokeRect(-22,-6,44,26);
    ctx.fillStyle = '#e9c877';
    if (open){
      ctx.save();
      ctx.translate(-22,-6);
      ctx.rotate(-0.9);
      ctx.fillRect(0,-6,44,6);
      ctx.restore();
    } else {
      ctx.fillRect(-22,-10,44,6);
    }
    ctx.restore();
  }
  function compassArrow(cx,cy,dir,highlight){
    var ang = {N:-Math.PI/2, S:Math.PI/2, W:Math.PI, E:0}[dir];
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(ang);
    ctx.strokeStyle = highlight ? '#d9a441' : 'rgba(245,236,217,0.5)';
    ctx.lineWidth = highlight ? 4 : 2.5;
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(60,0);
    ctx.moveTo(60,0); ctx.lineTo(48,-7);
    ctx.moveTo(60,0); ctx.lineTo(48,7);
    ctx.stroke();
    ctx.restore();
  }
  function tree(x,y,scale,type){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0,4,26,7,0,0,Math.PI*2); ctx.fill();
    if (type==='coconut'){
      ctx.strokeStyle = '#7a5a33'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(10,-60,4,-100); ctx.stroke();
      ctx.strokeStyle = '#4f8a3f'; ctx.lineWidth = 5;
      for (var i=0;i<6;i++){
        var a = (i/6)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(4,-100);
        ctx.quadraticCurveTo(4+Math.cos(a)*20,-100+Math.sin(a)*10, 4+Math.cos(a)*40,-100+Math.sin(a)*22);
        ctx.stroke();
      }
      ctx.fillStyle = '#8a6a3a';
      ctx.beginPath(); ctx.arc(-4,-92,5,0,Math.PI*2); ctx.arc(8,-90,5,0,Math.PI*2); ctx.fill();
    } else if (type==='fruit'){
      ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-60); ctx.stroke();
      ctx.fillStyle = '#3f7d3f';
      ctx.beginPath(); ctx.arc(0,-80,36,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#c1543b';
      [[-14,-78],[10,-90],[16,-66],[-6,-96]].forEach(function(p){
        ctx.beginPath(); ctx.arc(p[0],p[1],6,0,Math.PI*2); ctx.fill();
      });
    } else if (type==='taro'){
      ctx.strokeStyle = '#4f8a3f'; ctx.lineWidth = 4;
      for (var j=0;j<3;j++){
        ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-10+j*10,-40,-6+j*8,-70); ctx.stroke();
      }
      ctx.fillStyle = '#5da34a';
      [[-6,-70],[8,-64],[-14,-50]].forEach(function(p){
        ctx.save(); ctx.translate(p[0],p[1]); ctx.rotate(-0.3);
        ctx.beginPath(); ctx.ellipse(0,0,16,22,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      });
    } else if (type==='palmsugar'){
      ctx.strokeStyle = '#7a5a33'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-6,-70,0,-110); ctx.stroke();
      ctx.strokeStyle = '#4f8a3f'; ctx.lineWidth = 5;
      for (var k=0;k<7;k++){
        var a2 = (k/7)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(0,-110);
        ctx.quadraticCurveTo(Math.cos(a2)*18,-110+Math.sin(a2)*8, Math.cos(a2)*36,-110+Math.sin(a2)*18);
        ctx.stroke();
      }
    } else if (type==='rice'){
      ctx.strokeStyle = '#6fae4a'; ctx.lineWidth = 3;
      for (var m=-2;m<=2;m++){
        ctx.beginPath();
        ctx.moveTo(m*6,0);
        ctx.quadraticCurveTo(m*6+4,-30, m*10,-52);
        ctx.stroke();
      }
      ctx.fillStyle = '#e9c877';
      for (var n=-1;n<=1;n++){
        ctx.beginPath(); ctx.ellipse(n*10,-52,4,9,0.3,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }
  function graveMound(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#5a6b4a';
    ctx.beginPath();
    ctx.ellipse(0,0,90,26,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#4a5a3d';
    ctx.beginPath();
    ctx.ellipse(0,-4,86,20,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function oldPerson(x,y,scale,opt){
    opt = opt||{};
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0,68,26,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = opt.robe || '#7a6b4a';
    ctx.beginPath();
    ctx.moveTo(-22,64); ctx.quadraticCurveTo(-26,10,-10,-16);
    ctx.lineTo(10,-16); ctx.quadraticCurveTo(26,10,22,64);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = opt.robe || '#7a6b4a';
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-10,-4); ctx.lineTo(opt.bent?-26:-30, opt.bent?20:14);
    ctx.moveTo(10,-4); ctx.lineTo(opt.bent2?26:30, opt.bent2?20:14);
    ctx.stroke();
    ctx.fillStyle = '#dba876';
    ctx.beginPath(); ctx.arc(0,-30,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8e2d4';
    ctx.beginPath(); ctx.arc(0,-38,13,Math.PI,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function kingFigure(x,y,scale,alpha){
    ctx.save();
    ctx.globalAlpha = alpha===undefined?1:alpha;
    person(x,y,scale,{robe:'#5a4a8a', accent:'#d9a441', crown:true});
    ctx.restore();
  }
  function plantGrowth(x,y,scale,progress){
    // progress 0..1
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    var h = 20 + progress*70;
    var col = progress<0.6 ? '#5da34a' : (progress<0.85 ? '#c9c04a' : '#e0b23f');
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    for (var i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(i*7,0);
      ctx.quadraticCurveTo(i*7+4,-h*0.6, i*10, -h);
      ctx.stroke();
    }
    if (progress>0.35){
      ctx.fillStyle = progress<0.85 ? '#8fae4a' : '#e9c877';
      for (var j=-1;j<=1;j++){
        ctx.beginPath(); ctx.ellipse(j*11,-h, 4+progress*3, 9+progress*6,0.3,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ============ SCENE DRAW ROUTER ============ */
  function draw(){
    if (state.scene < 0){ clear(); skyBG('#2c4a3d','#1c3327'); return; }
    var fn = sceneDraw[state.scene];
    if (fn) fn();
  }

  /* ============ HOTSPOT HELPERS ============ */
  function clearHotspots(){ hotspotsLayer.innerHTML=''; }
  function addHotspot(px,py,pw,ph,label,onClick){
    var el = document.createElement('button');
    el.className = 'amp-hotspot';
    el.style.left = (px/W*100)+'%';
    el.style.top = (py/H*100)+'%';
    el.style.width = (pw/W*100)+'%';
    el.style.height = (ph/H*100)+'%';
    var sp = document.createElement('span');
    sp.textContent = label;
    el.appendChild(sp);
    el.setAttribute('aria-label', label);
    el.addEventListener('click', function(){
      el.disabled = true;
      onClick();
    });
    hotspotsLayer.appendChild(el);
    return el;
  }

  /* ============ ACTION ROW HELPERS ============ */
  function clearActions(){ actionRow.innerHTML=''; }
  function addButton(text, cls, onClick){
    var b = document.createElement('button');
    b.className = 'amp-btn ' + (cls||'amp-btn-primary');
    b.textContent = text;
    b.disabled = false;
    b.addEventListener('click', onClick);
    actionRow.appendChild(b);
    return b;
  }
  function setCaption(text, sceneIdx){
    captionText.textContent = text;
    var t = T[state.lang];
    sceneLabel.textContent = (sceneIdx!==undefined && t.sceneLabels[sceneIdx]) ? t.sceneLabels[sceneIdx] : '';
  }

  /* ============ SCENE CONTROLLERS ============ */
  function goScene(idx){
    stopSpeak();
    state.scene = idx;
    state.sub = {};
    clearHotspots();
    clearActions();
    renderDots();
    draw();
    var t = T[state.lang];
    if (idx < 0){
      startOverlay.style.display = 'flex';
      return;
    }
    startOverlay.style.display = 'none';
    replayBtn.style.display = 'none';
    sceneInit[idx]();
    notifyResize();
  }

        state.sub.spoke = true;
        draw();
        setCaption(s.hotspotNarr, 3);
        speak(s.hotspotNarr);
        clearActions();
        addButton(s.next,'amp-btn-primary', function(){ goScene(4); });
      });
    },
    // 4
    function(){
      var t = T[state.lang], s = t.scenes[4];
      state.sub = { found:{} };
      setCaption(s.narr, 4);
      speak(s.narr);
      var keys = ['head','hands','feet','belly'];
      var coords = { head:[260,320,90,80], hands:[560,320,90,80], feet:[320,340,80,80], belly:[500,340,80,80] };
      keys.forEach(function(k,i){
        var c = coords[k];
        addHotspot(c[0],c[1],c[2],c[3], s.spots[i].label, function(el){
          state.sub.found[k] = true;
          draw();
          setCaption(s.spots[i].text, 4);
          speak(s.spots[i].text);
          checkAllFound();
        });
      });
      var mysteryBtn;
      function checkAllFound(){
        if (keys.every(function(k){ return state.sub.found[k]; }) && !mysteryBtn){
          mysteryBtn = addHotspot(420,330,60,60, s.mysteryLabel, function(){
            state.sub.found.mystery = true;
            draw();
            setCaption(s.mysteryText, 4);
            speak(s.mysteryText);
            clearActions();
            addButton(s.next,'amp-btn-primary', function(){ goScene(5); });
          });
        }
      }
    },
    // 5
    function(){
      var t = T[state.lang], s = t.scenes[5];
      state.sub = { progress:0, milestoneIdx:0 };
      setCaption(s.narr + ' ' + s.holdLabel, 5);
      speak(s.narr);
      var wrap = document.createElement('div');
      wrap.className = 'amp-holdwrap';
      var bar = document.createElement('div');
      bar.className = 'amp-holdbar';
      var fill = document.createElement('div');
      fill.className = 'amp-holdbar-fill';
      bar.appendChild(fill);
      wrap.appendChild(bar);
      actionRow.appendChild(wrap);
      var btn = addButton(s.holdBtn, 'amp-btn-primary', function(){});
      var holdTimer = null;
      var duration = 4500; // ms total hold needed
      var startTime = null;
      var raf = null;
      var finished = false;

      function step(ts){
        if (!startTime) startTime = ts;
        var elapsed = ts - startTime;
        state.sub.progress = Math.min(1, elapsed/duration);
        fill.style.width = (state.sub.progress*100)+'%';
        draw();
        var mIdx = Math.min(s.milestones.length-1, Math.floor(state.sub.progress * s.milestones.length));
        if (mIdx !== state.sub.milestoneIdx || elapsed < 50){
          state.sub.milestoneIdx = mIdx;
          setCaption(s.milestones[mIdx], 5);
          speak(s.milestones[mIdx]);
        }
        if (state.sub.progress < 1 && !finished){
          raf = requestAnimationFrame(step);
        } else if (!finished){
          finished = true;
          btn.disabled = true;
          setCaption(s.afterHold, 5);
          speak(s.afterHold);
          addButton(s.next, 'amp-btn-primary', function(){ goScene(6); });
        }
      }
      function startHold(e){
        e.preventDefault();
        if (finished) return;
        if (!raf) raf = requestAnimationFrame(step);
      }
      function stopHold(){
        if (finished) return;
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        startTime = null;
      }
      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('touchstart', startHold, {passive:false});
      btn.addEventListener('mouseup', stopHold);
      btn.addEventListener('mouseleave', stopHold);
      btn.addEventListener('touchend', stopHold);
      btn.addEventListener('touchcancel', stopHold);
    },
    // 6
    function(){
      var t = T[state.lang], s = t.scenes[6];
      setCaption(s.narr + ' ' + s.chooseLabel, 6);
      speak(s.narr);
      s.choices.forEach(function(choice, idx){
        addButton(choice, 'amp-btn-ghost', function(btnEl){
          if (idx === s.correctIndex){
            clearActions();
            setCaption(s.correctMsg, 6);
            speak(s.correctMsg);
            setTimeout(function(){
              setCaption(s.correctMsg + ' ' + s.ending, 6);
              speak(s.ending);
              replayBtn.style.display = 'inline-block';
            }, 300);
          } else {
            setCaption(s.wrongMsg, 6);
            speak(s.wrongMsg);
          }
        });
      });
    }
  ];

  function animateFall(){
    var t0 = null;
    function step(ts){
      if (!t0) t0 = ts;
      var elapsed = ts - t0;
      var dur = 900;
      var p = Math.min(1, elapsed/dur);
      state.sub.eggY = 250 + p*90;
      draw();
      if (p < 1){
        requestAnimationFrame(step);
      } else {
        state.sub.phase = 'catch';
        draw();
        var t = T[state.lang], s = t.scenes[1];
        addHotspot(500,300,110,110, s.hotspotLabel, function(){
          state.sub.phase = 'done';
          draw();
          setCaption(s.hotspotNarr, 1);
          speak(s.hotspotNarr);
          clearActions();
          addButton(s.next,'amp-btn-primary', function(){ goScene(2); });
        });
      }
    }
    requestAnimationFrame(step);
  }

  /* ============ CONTROLS ============ */
  startBtn.addEventListener('click', function(){ goScene(0); });
  replayBtn.addEventListener('click', function(){ goScene(0); });

  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    localStorage.setItem('amp_padi_muted', state.muted ? '1':'0');
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if (state.muted) stopSpeak();
  });

  langBtn.addEventListener('click', function(){
    state.lang = state.lang === 'id' ? 'en' : 'id';
    applyStaticText();
    // re-render current scene text in new language, preserving progress
    if (state.scene < 0){
      goScene(-1);
    } else {
      stopSpeak();
      clearHotspots();
      clearActions();
      var idx = state.scene;
      draw();
      sceneInit[idx]();
      renderDots();
    }
  });

  /* ============ INIT ============ */
  applyStaticText();
  goScene(-1);
  fitCanvas();
  window.addEventListener('load', fitCanvas);
})();
</script>
</body>
</html>

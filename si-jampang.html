<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Si Jampang - Cerita Rakyat Betawi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --batik-red:#b3372c;
    --batik-gold:#d9a441;
    --batik-cream:#f4e6c8;
    --batik-brown:#3b2418;
    --batik-green:#4f6b3a;
    --ink:#241407;
    --panel-bg:#fbf2dd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:linear-gradient(180deg,var(--batik-brown),#241407);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:14px 10px 20px;
  }
  #app{
    width:100%;
    max-width:720px;
    background:var(--batik-cream);
    border-radius:18px;
    border:6px solid var(--batik-gold);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    overflow:hidden;
    position:relative;
  }
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:var(--batik-red);
    color:var(--batik-cream);
  }
  #title{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #title .flag{font-size:1rem;opacity:.85;}
  .iconbtn{
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.5);
    color:var(--batik-cream);
    border-radius:10px;
    padding:6px 10px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:.78rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    transition:transform .15s ease, background .15s ease;
  }
  .iconbtn:hover{background:rgba(255,255,255,.26);}
  .iconbtn:active{transform:scale(.94);}
  #controls{display:flex;gap:8px;}

  #stage-wrap{
    position:relative;
    background:
      radial-gradient(ellipse at 50% -10%, #6a4a24 0%, transparent 55%),
      repeating-linear-gradient(45deg, rgba(217,164,65,.06) 0 8px, transparent 8px 16px),
      #efd9a8;
    border-bottom:4px solid var(--batik-gold);
  }
  canvas{display:block;width:100%;height:auto;}

  #dots{
    display:flex;
    justify-content:center;
    gap:7px;
    padding:10px 8px 4px;
    background:var(--batik-cream);
    flex-wrap:wrap;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:#d8c49b;
    border:1.5px solid #b99a5b;
    transition:background .2s, transform .2s;
  }
  .dot.active{background:var(--batik-red);border-color:var(--batik-red);transform:scale(1.25);}
  .dot.done{background:var(--batik-green);border-color:var(--batik-green);}

  #narration-panel{
    padding:12px 16px 6px;
    background:var(--batik-cream);
  }
  #narration-text{
    font-size:.95rem;
    line-height:1.5;
    min-height:2.6em;
    color:var(--ink);
  }
  #instruction{
    margin-top:6px;
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:.86rem;
    color:var(--batik-red);
    display:flex;
    align-items:center;
    gap:6px;
  }
  #instruction::before{
    content:"👉";
    font-size:.95rem;
  }

  #bottombar{
    display:flex;
    justify-content:center;
    padding:12px 16px 18px;
    background:var(--batik-cream);
  }
  #primary-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1rem;
    background:var(--batik-red);
    color:var(--batik-cream);
    border:none;
    border-radius:14px;
    padding:12px 28px;
    cursor:pointer;
    box-shadow:0 4px 0 #7c2419;
    transition:transform .1s ease;
  }
  #primary-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7c2419;}
  #primary-btn.hidden{display:none;}

  footer{
    text-align:center;
    font-size:.68rem;
    color:#8a7550;
    padding:0 16px 12px;
    font-family:'Nunito',sans-serif;
  }

  @media (max-width:420px){
    #title{font-size:.92rem;}
    .iconbtn{padding:5px 8px;font-size:.7rem;}
    #narration-text{font-size:.88rem;}
    #instruction{font-size:.8rem;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title"><span class="flag">🗡️</span><span id="title-text">Si Jampang</span></div>
    <div id="controls">
      <button class="iconbtn" id="lang-btn" type="button">EN</button>
      <button class="iconbtn" id="mute-btn" type="button">🔊</button>
    </div>
  </div>

  <div id="stage-wrap">
    <canvas id="game" width="800" height="500"></canvas>
  </div>

  <div id="dots"></div>

  <div id="narration-panel">
    <div id="narration-text"></div>
    <div id="instruction"></div>
  </div>

  <div id="bottombar">
    <button id="primary-btn" type="button">Mulai Cerita</button>
  </div>

  <footer id="footer-text">Kisah rakyat Betawi, diceritakan ulang secara interaktif.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- i18n ---------------- */
  var params = new URLSearchParams(window.location.search);
  var lang = (params.get('lang') === 'en') ? 'en' : 'id';

  var STR = {
    id:{
      title:"Si Jampang",
      startBtn:"Mulai Cerita",
      replayBtn:"Ulangi Cerita",
      nextHint:"Ketuk untuk melanjutkan",
      footer:"Kisah rakyat Betawi, diceritakan ulang secara interaktif.",
      langBtn:"EN"
    },
    en:{
      title:"Si Jampang",
      startBtn:"Start Story",
      replayBtn:"Replay Story",
      nextHint:"Tap to continue",
      footer:"A Betawi folktale, retold interactively.",
      langBtn:"ID"
    }
  };

  var scenes = [
    {
      id:"intro", type:"tap", target:"jampang",
      narration:{
        id:"Di sebuah desa di wilayah Batavia, hiduplah Si Jampang, seorang jagoan silat yang gagah berani.",
        en:"In a village in old Batavia lived Si Jampang, a brave silat fighter."
      },
      instruction:{ id:"Ketuk sosok Jampang untuk memulai kisahnya.", en:"Tap Jampang to begin his story." }
    },
    {
      id:"robinhood", type:"drag", from:"pouch", to:"villager",
      narration:{
        id:"Jampang kerap merampok rumah orang kaya yang memihak Belanda, lalu membagikan hasilnya kepada rakyat kecil.",
        en:"Jampang often robbed wealthy landlords who sided with the Dutch, then gave the loot to the poor."
      },
      instruction:{ id:"Seret kantong emas dari rumah orang kaya ke tangan warga desa.", en:"Drag the gold pouch from the rich house to the villager." }
    },
    {
      id:"pesantren", type:"tap", target:"gate",
      narration:{
        id:"Meski dikenal sebagai perampok, Jampang ingin anaknya menjadi orang saleh. \u201cAku ingin kau masuk pesantren,\u201d katanya. Sang anak setuju, asalkan Babe berhenti merampok.",
        en:"Though known as a robber, Jampang wanted his son to live righteously. \u201cI want you to study at a pesantren,\u201d he said. His son agreed \u2014 if Babe would stop stealing."
      },
      instruction:{ id:"Ketuk gerbang pesantren untuk mendengar jawaban Jampang.", en:"Tap the pesantren gate to hear Jampang's answer." }
    },
    {
      id:"comfort", type:"hold", target:"mayangsari", holdMs:1400,
      narration:{
        id:"Jampang mengunjungi sahabat lamanya, Sarba, namun ia telah wafat. Istri Sarba, Mayangsari, menangis sedih di hadapannya.",
        en:"Jampang visited his old friend Sarba, only to learn he had passed away. Sarba's widow, Mayangsari, wept before him."
      },
      instruction:{ id:"Ketuk dan tahan bahu Mayangsari untuk menghiburnya.", en:"Tap and hold Mayangsari's shoulder to comfort her." }
    },
    {
      id:"propose", type:"tap", target:"mayangsari2",
      narration:{
        id:"Melihat Mayangsari telah menjanda, Jampang pun melamarnya.",
        en:"Seeing that Mayangsari was now a widow, Jampang proposed to her."
      },
      instruction:{ id:"Ketuk Mayangsari untuk mendengar jawabannya.", en:"Tap Mayangsari to hear her answer." }
    },
    {
      id:"kerbau", type:"multitap", targets:["kerbau1","kerbau2"],
      narration:{
        id:"Bertahun-tahun kemudian, anak Mayangsari, Abdih, mengizinkan pernikahan itu dengan satu syarat: dua ekor kerbau sebagai mas kawin.",
        en:"Years later, Mayangsari's son Abdih allowed the marriage on one condition: two buffaloes as the dowry."
      },
      instruction:{ id:"Ketuk kedua ekor kerbau untuk mengumpulkannya.", en:"Tap both buffaloes to gather them." }
    },
    {
      id:"sneak", type:"holdrelease", target:"sneakbtn", safeMin:900, safeMax:1700, danger:2600,
      narration:{
        id:"Untuk memenuhi syarat itu, Jampang berniat merampok rumah Haji Saud yang kaya raya bersama keponakannya, Sarpin.",
        en:"To meet that demand, Jampang planned to rob the wealthy Haji Saud's house together with his nephew Sarpin."
      },
      instruction:{ id:"Tekan dan tahan tombol untuk mengendap masuk, lalu lepaskan sebelum lentera penjaga menyala.", en:"Press and hold the button to sneak in, then release before the guard's lantern lights up." }
    },
    {
      id:"caught", type:"tap", target:"police",
      narration:{
        id:"Sayangnya, rencana itu telah diketahui Haji Saud yang melapor kepada polisi.",
        en:"Sadly, Haji Saud had already discovered the plan and reported it to the police."
      },
      instruction:{ id:"Ketuk polisi untuk melihat apa yang terjadi pada Jampang.", en:"Tap the police officer to see what happens to Jampang." }
    },
    {
      id:"ending", type:"end",
      narration:{
        id:"Kematian Jampang ditangisi rakyat kecil yang selama ini dibelanya, sebab ia selalu berbagi kepada yang membutuhkan. Keberanian Jampang membela yang lemah patut kita tiru \u2014 namun caranya mencuri tak boleh kita contoh.",
        en:"Jampang's death was mourned by the common people he had long defended, for he always shared with those in need. His courage in standing up for the weak is worth admiring \u2014 but his way of stealing must never be copied."
      },
      instruction:{ id:"Ketuk tombol \u201cUlangi Cerita\u201d untuk mendengar kisah ini lagi.", en:"Tap \u201cReplay Story\u201d to hear this tale again." }
    }
  ];

  var extra = {
    proposeReject:{ id:"\u201cTidak! Saya tidak mau menikah dengan Bang Jampang!\u201d seru Mayangsari.", en:"\u201cNo! I don't want to marry Bang Jampang!\u201d Mayangsari cried." },
    caughtLine:{ id:"Jampang dan Sarpin tertangkap basah oleh polisi malam itu juga.", en:"Jampang and Sarpin were caught red-handed by the police that very night." }
  };

  /* ---------------- state ---------------- */
  var state = {
    sceneIndex:-1,
    started:false,
    locked:false,
    muted:(localStorage.getItem('sj_muted')==='1'),
    dragging:false,
    dragPos:null,
    holdActive:false,
    holdStart:0,
    holdRAF:null,
    sneakActive:false,
    sneakStart:0,
    sneakResult:null,
    multitapDone:{},
    propTapped:false
  };

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var CW = 800, CH = 500;
  var dotsEl = document.getElementById('dots');
  var narrationEl = document.getElementById('narration-text');
  var instructionEl = document.getElementById('instruction');
  var primaryBtn = document.getElementById('primary-btn');
  var muteBtn = document.getElementById('mute-btn');
  var langBtn = document.getElementById('lang-btn');
  var titleText = document.getElementById('title-text');
  var footerText = document.getElementById('footer-text');

  function applyStrings(){
    var s = STR[lang];
    titleText.textContent = s.title;
    footerText.textContent = s.footer;
    langBtn.textContent = s.langBtn;
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if(!state.started){ primaryBtn.textContent = s.startBtn; }
  }

  /* ---------------- dots ---------------- */
  function buildDots(){
    dotsEl.innerHTML = '';
    for(var i=0;i<scenes.length;i++){
      var d = document.createElement('div');
      d.className = 'dot';
      d.dataset.i = i;
      dotsEl.appendChild(d);
    }
  }
  function updateDots(){
    var kids = dotsEl.children;
    for(var i=0;i<kids.length;i++){
      kids[i].classList.remove('active','done');
      if(i < state.sceneIndex) kids[i].classList.add('done');
      else if(i === state.sceneIndex) kids[i].classList.add('active');
    }
  }

  /* ---------------- narration (speech) ---------------- */
  var voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if(window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(bcp){
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(bcp.toLowerCase())===0) return voices[i];
    }
    return null;
  }
  function speak(text){
    if(!window.speechSynthesis || state.muted || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var bcp = lang === 'id' ? 'id-ID' : 'en-US';
    u.lang = bcp;
    var v = pickVoice(bcp);
    if(v) u.voice = v;
    u.rate = 0.96;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }
  function stopSpeak(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); }

  function setNarration(text, instr){
    narrationEl.textContent = text;
    instructionEl.textContent = instr || '';
  }

  /* ---------------- drawing helpers ---------------- */
  function clear(){
    ctx.clearRect(0,0,CW,CH);
  }
  function drawBackdrop(nightMode){
    var g = ctx.createLinearGradient(0,0,0,CH);
    if(nightMode){
      g.addColorStop(0,'#16213a');
      g.addColorStop(1,'#2c3a55');
    } else {
      g.addColorStop(0,'#bfe3e0');
      g.addColorStop(1,'#e8d6a0');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0,0,CW,CH);
    if(nightMode){
      ctx.fillStyle='rgba(255,255,255,.85)';
      for(var i=0;i<40;i++){
        var sx=(i*137)%CW, sy=(i*79)%220;
        ctx.beginPath();ctx.arc(sx,sy,1.4,0,7);ctx.fill();
      }
      ctx.fillStyle='#e8dcb0';
      ctx.beginPath();ctx.arc(690,70,32,0,7);ctx.fill();
    } else {
      ctx.fillStyle='#f4e6c8';
      ctx.beginPath();ctx.arc(700,80,36,0,7);ctx.fill();
    }
    ctx.fillStyle = nightMode ? '#0e1424' : '#7a9b5e';
    ctx.beginPath();
    ctx.moveTo(0,360);
    for(var x=0;x<=CW;x+=40){
      ctx.lineTo(x,355+Math.sin(x/70)*8);
    }
    ctx.lineTo(CW,CH);ctx.lineTo(0,CH);ctx.closePath();ctx.fill();
    ctx.fillStyle = nightMode ? '#1b2338' : '#8a7048';
    ctx.fillRect(0,395,CW,CH-395);
  }

  function drawPerson(x,y,opts){
    opts = opts||{};
    var scale = opts.scale||1;
    var skin = opts.skin||'#c98a5a';
    var outfit = opts.outfit||'#b3372c';
    var accent = opts.accent||'#d9a441';
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.18)';
    ctx.beginPath();ctx.ellipse(0,4,26,7,0,0,7);ctx.fill();
    // legs
    ctx.fillStyle = opts.pants||'#3b2418';
    ctx.fillRect(-14,-38,11,42);
    ctx.fillRect(3,-38,11,42);
    // body
    ctx.fillStyle = outfit;
    ctx.beginPath();
    ctx.moveTo(-20,-40);
    ctx.lineTo(20,-40);
    ctx.lineTo(16,-92);
    ctx.lineTo(-16,-92);
    ctx.closePath();
    ctx.fill();
    // sash
    ctx.fillStyle = accent;
    ctx.fillRect(-20,-58,40,9);
    // arms
    ctx.strokeStyle = outfit;
    ctx.lineWidth = 10;
    ctx.lineCap='round';
    var armSwing = opts.armSwing||0;
    ctx.beginPath();ctx.moveTo(-16,-84);ctx.lineTo(-30+armSwing,-56);ctx.stroke();
    ctx.beginPath();ctx.moveTo(16,-84);ctx.lineTo(30-armSwing,-56);ctx.stroke();
    // head
    ctx.fillStyle = skin;
    ctx.beginPath();ctx.arc(0,-104,17,0,7);ctx.fill();
    // headwrap
    if(opts.headwrap!==false){
      ctx.fillStyle = accent;
      ctx.beginPath();ctx.arc(0,-112,18,Math.PI,0);ctx.fill();
      ctx.fillRect(-18,-114,36,7);
      ctx.fillStyle = outfit;
      ctx.fillRect(10,-118,6,14);
    }
    // hair strands for women
    if(opts.female){
      ctx.fillStyle = '#241407';
      ctx.beginPath();ctx.moveTo(-17,-100);ctx.lineTo(-22,-70);ctx.lineTo(-11,-96);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(17,-100);ctx.lineTo(22,-70);ctx.lineTo(11,-96);ctx.closePath();ctx.fill();
    }
    // face
    ctx.fillStyle = '#241407';
    ctx.beginPath();ctx.arc(-5,-105,1.6,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(5,-105,1.6,0,7);ctx.fill();
    if(opts.expression==='sad'){
      ctx.beginPath();ctx.arc(0,-97,4,Math.PI,0,true);ctx.stroke();
    } else if(opts.expression==='shock'){
      ctx.beginPath();ctx.arc(0,-98,3,0,7);ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(0,-99,4,0.15,Math.PI-0.15);ctx.stroke();
    }
    ctx.restore();
  }

  function drawHouse(x,y,style){
    style = style||{};
    ctx.save();
    ctx.translate(x,y);
    var w=150,h=90;
    ctx.fillStyle = style.wall||'#e8d6a0';
    ctx.fillRect(-w/2,-h,w,h);
    ctx.fillStyle = style.roof||'#8c3a2b';
    ctx.beginPath();
    ctx.moveTo(-w/2-18,-h);
    ctx.lineTo(0,-h-55);
    ctx.lineTo(w/2+18,-h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = style.door||'#5b3a22';
    ctx.fillRect(-20,-46,40,46);
    ctx.fillStyle = style.window||'#d9a441';
    ctx.fillRect(-58,-70,26,26);
    ctx.fillRect(32,-70,26,26);
    if(style.rich){
      ctx.strokeStyle='#d9a441';ctx.lineWidth=4;
      ctx.strokeRect(-w/2,-h,w,h);
    }
    ctx.restore();
  }

  function drawPouch(x,y,scale){
    scale = scale||1;
    ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
    ctx.fillStyle='#d9a441';
    ctx.beginPath();
    ctx.moveTo(-14,10);
    ctx.quadraticCurveTo(-18,-14,0,-16);
    ctx.quadraticCurveTo(18,-14,14,10);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#7c4a1e';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-8,-16);ctx.lineTo(-4,-24);ctx.lineTo(4,-24);ctx.lineTo(8,-16);ctx.stroke();
    ctx.fillStyle='#7c4a1e';
    ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText('Rp',0,3);
    ctx.restore();
  }

  function drawGate(x,y,glow){
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle = glow? '#e8c877':'#c9a15c';
    ctx.fillRect(-70,-120,16,120);
    ctx.fillRect(54,-120,16,120);
    ctx.fillRect(-70,-140,140,22);
    ctx.fillStyle='#4f6b3a';
    ctx.beginPath();ctx.moveTo(-70,-140);ctx.lineTo(0,-168);ctx.lineTo(70,-140);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3b2418';
    ctx.font='bold 15px "Baloo 2", sans-serif';ctx.textAlign='center';
    ctx.fillText(lang==='id'?'PESANTREN':'PESANTREN', 0,-148);
    ctx.restore();
  }

  function drawKerbau(x,y,scale,collected){
    scale = scale||1;
    ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
    ctx.globalAlpha = collected?0.35:1;
    ctx.fillStyle='#5c5c66';
    ctx.beginPath();ctx.ellipse(0,-20,34,22,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(-32,-14,14,12,0,0,7);ctx.fill();
    ctx.strokeStyle='#e6e6e6';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-40,-24);ctx.quadraticCurveTo(-48,-34,-40,-40);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-30,-26);ctx.quadraticCurveTo(-24,-38,-32,-42);ctx.stroke();
    ctx.fillStyle='#3a3a42';
    ctx.fillRect(-20,-2,12,26);
    ctx.fillRect(4,-2,12,26);
    ctx.fillRect(20,-6,12,24);
    if(collected){
      ctx.fillStyle='#4f6b3a';
      ctx.font='bold 22px sans-serif';ctx.textAlign='center';
      ctx.fillText('\u2713',0,-20);
    }
    ctx.restore();
  }

  function drawPolice(x,y){
    drawPerson(x,y,{outfit:'#2c3a55',pants:'#1b2338',accent:'#c9a15c',skin:'#c98a5a',headwrap:false});
    ctx.save();ctx.translate(x,y-118);
    ctx.fillStyle='#0e1424';
    ctx.beginPath();ctx.arc(0,0,15,Math.PI,0);ctx.fill();
    ctx.fillRect(-15,0,30,4);
    ctx.restore();
  }

  function drawLantern(x,y,lit){
    ctx.save();ctx.translate(x,y);
    ctx.strokeStyle='#8a6a3a';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-40);ctx.stroke();
    ctx.fillStyle = lit? '#ffd873' : '#5a4a2a';
    ctx.beginPath();ctx.arc(0,-50,12,0,7);ctx.fill();
    if(lit){
      ctx.fillStyle='rgba(255,216,115,.35)';
      ctx.beginPath();ctx.arc(0,-50,30,0,7);ctx.fill();
    }
    ctx.restore();
  }

  function drawVillager(x,y){
    drawPerson(x,y,{outfit:'#7a8f5c',pants:'#4f6b3a',accent:'#e8d6a0',skin:'#a9744a'});
  }

  /* ---------------- hit areas per scene (recomputed each render) ---------------- */
  var hit = {};

  function render(){
    clear();
    var sc = scenes[state.sceneIndex];
    if(!sc){ return; }
    hit = {};
    switch(sc.id){
      case 'intro': renderIntro(); break;
      case 'robinhood': renderRobinhood(); break;
      case 'pesantren': renderPesantren(); break;
      case 'comfort': renderComfort(); break;
      case 'propose': renderPropose(); break;
      case 'kerbau': renderKerbau(); break;
      case 'sneak': renderSneak(); break;
      case 'caught': renderCaught(); break;
      case 'ending': renderEnding(); break;
    }
  }

  function renderIntro(){
    drawBackdrop(false);
    drawHouse(150,390,{});
    drawHouse(620,390,{rich:true, wall:'#f0e0b0'});
    drawPerson(400,390,{scale:1.35, armSwing: state.locked?0:6});
    hit.jampang = {x:400-40,y:390-190,w:80,h:200};
    ctx.fillStyle='rgba(59,36,24,.55)';
    ctx.fillRect(0,0,CW,44);
    ctx.fillStyle='#f4e6c8';
    ctx.font='bold 22px "Baloo 2", sans-serif';
    ctx.textAlign='center';
    ctx.fillText(lang==='id'?'SI JAMPANG \u2014 Jagoan Betawi':'SI JAMPANG \u2014 Betawi Folk Hero', CW/2, 28);
  }

  function renderRobinhood(){
    drawBackdrop(false);
    drawHouse(200,390,{rich:true, wall:'#f0e0b0'});
    drawVillager(600,390);
    var px = state.dragging && state.dragPos ? state.dragPos.x : 200;
    var py = state.dragging && state.dragPos ? state.dragPos.y : 330;
    if(!state.multitapDone.pouchDelivered){
      drawPouch(px,py,1.4);
    } else {
      ctx.fillStyle='#4f6b3a';
      ctx.font='bold 34px sans-serif';ctx.textAlign='center';
      ctx.fillText('\u2713', 600, 300);
    }
    hit.pouch = {x:px-24,y:py-30,w:48,h:60};
    hit.villager = {x:600-40,y:390-190,w:80,h:200};
  }

  function renderPesantren(){
    drawBackdrop(false);
    drawGate(400,392, state.locked);
    drawPerson(230,390,{scale:1.1});
    drawPerson(560,390,{scale:0.9, skin:'#c9986a', headwrap:false, accent:'#7a8f5c'});
    hit.gate = {x:400-90,y:392-190,w:180,h:200};
  }

  function renderComfort(){
    drawBackdrop(false);
    drawHouse(620,392,{});
    drawPerson(280,392,{scale:1.05});
    var progress = 0;
    if(state.holdActive){
      progress = Math.min(1,(Date.now()-state.holdStart)/scenes[state.sceneIndex].holdMs);
    } else if(state.multitapDone.comforted){
      progress = 1;
    }
    drawPerson(480,392,{scale:1.05, female:true, accent:'#b3372c', outfit:'#7a4f6b', expression: progress>=1?'default':'sad'});
    hit.mayangsari = {x:480-40,y:392-190,w:80,h:200};
    // progress bar
    ctx.fillStyle='rgba(59,36,24,.25)';
    ctx.fillRect(340,60,120,14);
    ctx.fillStyle='#4f6b3a';
    ctx.fillRect(340,60,120*progress,14);
    ctx.strokeStyle='#3b2418';ctx.lineWidth=2;
    ctx.strokeRect(340,60,120,14);
  }

  function renderPropose(){
    drawBackdrop(false);
    drawPerson(300,392,{scale:1.05});
    drawPerson(500,392,{scale:1.05, female:true, accent:'#b3372c', outfit:'#7a4f6b', expression: state.propTapped?'shock':'default'});
    hit.mayangsari2 = {x:500-40,y:392-190,w:80,h:200};
    if(state.propTapped){
      bubble(500,150, lang==='id'?'Tidak, tidak mau!':'No, I won\u2019t!');
    }
  }

  function renderKerbau(){
    drawBackdrop(false);
    drawPerson(400,420,{scale:0.85});
    var d1 = !!state.multitapDone.kerbau1;
    var d2 = !!state.multitapDone.kerbau2;
    drawKerbau(260,390,1.3,d1);
    drawKerbau(560,390,1.3,d2);
    hit.kerbau1 = {x:260-45,y:390-60,w:90,h:70};
    hit.kerbau2 = {x:560-45,y:390-60,w:90,h:70};
    ctx.fillStyle='#3b2418';
    ctx.font='bold 16px "Baloo 2", sans-serif';ctx.textAlign='center';
    var count = (d1?1:0)+(d2?1:0);
    ctx.fillText((lang==='id'?'Terkumpul: ':'Collected: ')+count+' / 2', 400, 60);
  }

  function renderSneak(){
    drawBackdrop(true);
    drawHouse(560,392,{rich:true, wall:'#3c4a63', roof:'#1b2338', door:'#0e1424', window:'#ffd873'});
    var lit = false;
    var t = 0;
    if(state.sneakActive){
      t = Date.now()-state.sneakStart;
      lit = t > scenes[state.sceneIndex].safeMax;
    }
    drawLantern(680,390, lit || state.sneakResult==='fail');
    var jx = 200;
    if(state.sneakActive){
      var progressT = Math.min(1, t/2600);
      jx = 200 + progressT*300;
    } else if(state.sneakResult==='success'){
      jx = 520;
    }
    drawPerson(jx,392,{scale:1.0, outfit:'#3b2418', accent:'#2c3a55'});

    // button
    var by=460;
    ctx.save();
    ctx.fillStyle = state.sneakActive? '#8c3a2b':'#b3372c';
    roundRect(ctx, CW/2-90, by-24, 180, 48, 12);
    ctx.fill();
    ctx.fillStyle='#f4e6c8';
    ctx.font='bold 16px "Baloo 2", sans-serif';ctx.textAlign='center';
    ctx.fillText(state.sneakActive ? (lang==='id'?'MENGENDAP...':'SNEAKING...') : (lang==='id'?'TAHAN UNTUK MENGENDAP':'HOLD TO SNEAK'), CW/2, by+5);
    ctx.restore();
    hit.sneakbtn = {x:CW/2-90,y:by-24,w:180,h:48};

    if(state.sneakResult){
      bubble(400,150, state.sneakResult==='success' ?
        (lang==='id'?'Berhasil masuk tanpa ketahuan!':'Made it in undetected!') :
        (lang==='id'?'Ups, lentera menyala! Coba lagi.':'Oops, the lantern lit up! Try again.'));
    }
  }

  function renderCaught(){
    drawBackdrop(true);
    drawHouse(560,392,{rich:true, wall:'#3c4a63', roof:'#1b2338'});
    drawPerson(300,392,{scale:1.0, outfit: state.locked?'#5a5a5a':'#3b2418'});
    drawPolice(500,392);
    hit.police = {x:500-40,y:392-190,w:80,h:200};
    if(state.locked){
      bubble(400,150, extra.caughtLine[lang]);
    }
  }

  function renderEnding(){
    drawBackdrop(false);
    ctx.fillStyle='rgba(59,36,24,.15)';
    ctx.fillRect(0,0,CW,CH);
    drawPerson(250,392,{scale:1.05});
    drawVillager(420,392);
    drawVillager(560,392);
    ctx.fillStyle='#3b2418';
    ctx.font='italic 20px "Baloo 2", sans-serif';ctx.textAlign='center';
    ctx.fillText(lang==='id'?'\u2014 Tamat \u2014':'\u2014 The End \u2014', CW/2, 60);
  }

  function bubble(x,y,text){
    ctx.save();
    ctx.font='bold 14px "Nunito", sans-serif';
    var w = Math.min(320, ctx.measureText(text).width + 30);
    ctx.fillStyle='#fbf2dd';
    roundRect(ctx,x-w/2,y-24,w,42,10);
    ctx.fill();
    ctx.strokeStyle='#b3372c';ctx.lineWidth=2;
    roundRect(ctx,x-w/2,y-24,w,42,10);
    ctx.stroke();
    ctx.fillStyle='#241407';
    ctx.textAlign='center';
    wrapText(ctx, text, x, y+1, w-16, 16);
    ctx.restore();
  }
  function wrapText(ctx,text,x,y,maxWidth,lineHeight){
    var words = text.split(' ');
    var line='';
    var lines=[];
    for(var i=0;i<words.length;i++){
      var test = line + words[i] + ' ';
      if(ctx.measureText(test).width > maxWidth && line !== ''){
        lines.push(line); line = words[i]+' ';
      } else { line = test; }
    }
    lines.push(line);
    var startY = y - (lines.length-1)*lineHeight/2;
    for(var j=0;j<lines.length;j++){
      ctx.fillText(lines[j].trim(), x, startY + j*lineHeight);
    }
  }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  /* ---------------- scene transition ---------------- */
  function goToScene(i){
    stopSpeak();
    state.sceneIndex = i;
    state.locked = false;
    state.dragging = false; state.dragPos=null;
    state.holdActive = false;
    if(state.holdRAF) cancelAnimationFrame(state.holdRAF);
    state.sneakActive = false; state.sneakResult = null;
    state.multitapDone = {};
    state.propTapped = false;
    updateDots();
    var sc = scenes[i];
    if(sc.type === 'end'){
      primaryBtn.textContent = STR[lang].replayBtn;
      primaryBtn.classList.remove('hidden');
    } else {
      primaryBtn.classList.add('hidden');
    }
    setNarration(sc.narration[lang], sc.instruction ? sc.instruction[lang] : (STR[lang].nextHint));
    speak(sc.narration[lang]);
    render();
    resizeAndNotify();
  }

  function advanceOnce(){
    if(state.locked) return;
    state.locked = true;
    setTimeout(function(){
      if(state.sceneIndex < scenes.length-1){
        goToScene(state.sceneIndex+1);
      }
    }, 900);
  }

  /* ---------------- input handling ---------------- */
  function getPos(evt){
    var rect = canvas.getBoundingClientRect();
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    var sx = CW/rect.width, sy = CH/rect.height;
    return { x:(clientX-rect.left)*sx, y:(clientY-rect.top)*sy };
  }
  function inside(rect,pos){
    return rect && pos.x>=rect.x && pos.x<=rect.x+rect.w && pos.y>=rect.y && pos.y<=rect.y+rect.h;
  }

  var pointerDownPos=null;

  canvas.addEventListener('pointerdown', function(e){
    if(!state.started) return;
    var sc = scenes[state.sceneIndex];
    if(!sc || state.locked) return;
    var pos = getPos(e);
    pointerDownPos = pos;

    if(sc.type==='tap'){
      if(inside(hit[sc.target], pos)){
        handleTapScene(sc);
      }
    } else if(sc.type==='drag'){
      if(inside(hit.pouch, pos) && !state.multitapDone.pouchDelivered){
        state.dragging = true;
        state.dragPos = pos;
        render();
      }
    } else if(sc.type==='hold'){
      if(inside(hit[sc.target], pos)){
        state.holdActive = true;
        state.holdStart = Date.now();
        holdLoop(sc);
      }
    } else if(sc.type==='multitap'){
      for(var k=0;k<sc.targets.length;k++){
        var key = sc.targets[k];
        if(inside(hit[key], pos) && !state.multitapDone[key]){
          state.multitapDone[key] = true;
          render();
          checkMultitapComplete(sc);
          break;
        }
      }
    } else if(sc.type==='holdrelease'){
      if(inside(hit[sc.target], pos) && !state.sneakActive && !state.locked){
        state.sneakActive = true;
        state.sneakStart = Date.now();
        state.sneakResult = null;
        sneakLoop(sc);
      }
    }
  });

  window.addEventListener('pointermove', function(e){
    if(!state.dragging) return;
    var pos = getPos(e);
    state.dragPos = pos;
    render();
  });

  window.addEventListener('pointerup', function(e){
    var sc = scenes[state.sceneIndex];
    if(state.dragging && sc && sc.type==='drag'){
      var pos = getPos(e);
      state.dragging = false;
      if(inside(hit.villager, pos)){
        state.multitapDone.pouchDelivered = true;
        render();
        var narr = null;
        advanceOnce();
      } else {
        state.dragPos = null;
        render();
      }
    }
    if(state.holdActive){
      var sc2 = scenes[state.sceneIndex];
      if(sc2 && sc2.type==='hold'){
        var elapsed = Date.now()-state.holdStart;
        state.holdActive = false;
        if(elapsed < sc2.holdMs){
          render();
        }
      }
    }
    if(state.sneakActive){
      var sc3 = scenes[state.sceneIndex];
      if(sc3 && sc3.type==='holdrelease'){
        finishSneak(sc3);
      }
    }
  });

  function handleTapScene(sc){
    if(sc.id==='propose'){
      state.propTapped = true;
      render();
      speak(extra.proposeReject[lang]);
      state.locked = true;
      setTimeout(function(){
        if(state.sceneIndex < scenes.length-1) goToScene(state.sceneIndex+1);
      }, 2200);
      return;
    }
    if(sc.id==='caught'){
      state.locked = true;
      render();
      speak(extra.caughtLine[lang]);
      setTimeout(function(){
        if(state.sceneIndex < scenes.length-1) goToScene(state.sceneIndex+1);
      }, 2200);
      return;
    }
    render();
    advanceOnce();
  }

  function holdLoop(sc){
    if(!state.holdActive) { render(); return; }
    var elapsed = Date.now()-state.holdStart;
    render();
    if(elapsed >= sc.holdMs){
      state.holdActive = false;
      state.multitapDone.comforted = true;
      render();
      advanceOnce();
      return;
    }
    state.holdRAF = requestAnimationFrame(function(){ holdLoop(sc); });
  }

  function checkMultitapComplete(sc){
    var all = sc.targets.every(function(k){ return state.multitapDone[k]; });
    if(all){
      advanceOnce();
    }
  }

  function sneakLoop(sc){
    if(!state.sneakActive){ render(); return; }
    var t = Date.now()-state.sneakStart;
    render();
    if(t > sc.danger){
      finishSneak(sc);
      return;
    }
    requestAnimationFrame(function(){ sneakLoop(sc); });
  }

  function finishSneak(sc){
    var t = Date.now()-state.sneakStart;
    state.sneakActive = false;
    if(t >= sc.safeMin && t <= sc.safeMax){
      state.sneakResult = 'success';
      render();
      state.locked = true;
      setTimeout(function(){
        if(state.sceneIndex < scenes.length-1) goToScene(state.sceneIndex+1);
      }, 1600);
    } else {
      state.sneakResult = 'fail';
      render();
      setTimeout(function(){
        state.sneakResult = null;
        render();
      }, 1300);
    }
  }

  /* ---------------- controls ---------------- */
  primaryBtn.addEventListener('click', function(){
    if(!state.started){
      state.started = true;
      buildDots();
      goToScene(0);
    } else {
      goToScene(0);
    }
  });

  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    localStorage.setItem('sj_muted', state.muted ? '1':'0');
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if(state.muted) stopSpeak();
    else if(state.sceneIndex>=0){
      var sc = scenes[state.sceneIndex];
      if(sc) speak(sc.narration[lang]);
    }
  });

  langBtn.addEventListener('click', function(){
    lang = (lang==='id') ? 'en':'id';
    var url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState(null,'',url.toString());
    applyStrings();
    if(state.sceneIndex>=0){
      var sc = scenes[state.sceneIndex];
      setNarration(sc.narration[lang], sc.type==='end' ? '' : (sc.instruction? sc.instruction[lang] : STR[lang].nextHint));
      speak(sc.narration[lang]);
      render();
    }
  });

  /* ---------------- resize / iframe autosize ---------------- */
  function resizeAndNotify(){
    var h = document.getElementById('app').offsetHeight;
    try{
      window.parent.postMessage({ type:'sijampang-resize', height:h }, '*');
    }catch(e){}
  }
  window.addEventListener('resize', resizeAndNotify);

  /* ---------------- init ---------------- */
  applyStrings();
  clear();
  drawBackdrop(false);
  ctx.fillStyle='#3b2418';
  ctx.font='bold 20px "Baloo 2", sans-serif';
  ctx.textAlign='center';
  ctx.fillText(lang==='id' ? 'Ketuk "Mulai Cerita" untuk memulai' : 'Tap "Start Story" to begin', CW/2, CH/2);
  setNarration(lang==='id'
    ? 'Sebuah kisah kepahlawanan dan kelemahan dari tanah Betawi.'
    : 'A tale of heroism and flaws from the land of Betawi.', '');
  setTimeout(resizeAndNotify, 300);
  window.addEventListener('load', resizeAndNotify);
})();
</script>
</body>

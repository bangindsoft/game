<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beruang Menari - Dongeng Anak Jerman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bm-forest:#1f3a2e;
    --bm-forest-deep:#152720;
    --bm-parchment:#f6ecd9;
    --bm-parchment-dim:#ece0c6;
    --bm-honey:#c98a3e;
    --bm-honey-dark:#a06526;
    --bm-red:#a13d3d;
    --bm-moss:#4f7a52;
    --bm-ink:#2e2015;
    --bm-cream-text:#fbf5e8;
    --bm-shadow: 0 8px 24px rgba(21,39,32,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  #bm-root{
    font-family:'Nunito',sans-serif;
    background:var(--bm-forest);
    color:var(--bm-cream-text);
    border-radius:18px;
    overflow:hidden;
    max-width:720px;
    margin:0 auto;
    box-shadow:var(--bm-shadow);
    position:relative;
  }
  #bm-root *{box-sizing:border-box;}
  .bm-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:var(--bm-forest-deep);
    border-bottom:2px solid var(--bm-honey-dark);
  }
  .bm-brand{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-style:italic;
    font-size:15px;
    letter-spacing:.3px;
    color:var(--bm-honey);
  }
  .bm-controls{display:flex;gap:8px;}
  .bm-iconbtn{
    background:rgba(246,236,217,.1);
    border:1.5px solid rgba(246,236,217,.35);
    color:var(--bm-cream-text);
    border-radius:10px;
    width:36px;height:36px;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    font-family:'Nunito',sans-serif;
    font-weight:800;
  }
  .bm-iconbtn:hover{background:rgba(246,236,217,.22);}
  .bm-iconbtn:active{transform:scale(.94);}
  .bm-iconbtn.bm-active{background:var(--bm-honey);border-color:var(--bm-honey);color:var(--bm-ink);}

  .bm-stage-wrap{position:relative;}
  #bm-canvas{
    display:block;
    width:100%;
    height:auto;
    background:linear-gradient(#7fb8c9,#bfe3c9 55%,#3c6b45 55%,#254a30);
    cursor:pointer;
  }

  .bm-cover, .bm-end{
    padding:34px 26px 30px;
    text-align:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(201,138,62,.18), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(79,122,82,.25), transparent 55%),
      var(--bm-forest);
  }
  .bm-cover-emoji{font-size:52px;margin-bottom:6px;}
  .bm-title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:32px;
    margin:6px 0 2px;
    color:var(--bm-parchment);
  }
  .bm-subtitle{
    font-size:14.5px;
    color:var(--bm-parchment-dim);
    opacity:.85;
    margin:0 0 22px;
    font-style:italic;
    font-family:'Fraunces',serif;
  }
  .bm-btn{
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:16px;
    border:none;
    border-radius:999px;
    padding:14px 34px;
    background:linear-gradient(180deg,var(--bm-honey),var(--bm-honey-dark));
    color:var(--bm-ink);
    cursor:pointer;
    box-shadow:0 6px 0 #7a4a1a, 0 10px 18px rgba(0,0,0,.3);
    transition:transform .08s ease;
  }
  .bm-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4a1a, 0 6px 10px rgba(0,0,0,.25);}
  .bm-btn.bm-secondary{
    background:transparent;
    border:2px solid var(--bm-parchment-dim);
    color:var(--bm-parchment);
    box-shadow:none;
    padding:12px 30px;
  }
  .bm-btn.bm-secondary:active{transform:translateY(2px);}

  .bm-lang-row{display:flex;justify-content:center;gap:8px;margin-top:20px;}
  .bm-lang-pill{
    font-size:12.5px;font-weight:700;
    padding:6px 14px;border-radius:999px;
    border:1.5px solid rgba(246,236,217,.4);
    background:transparent;color:var(--bm-parchment-dim);
    cursor:pointer;
  }
  .bm-lang-pill.bm-active{background:var(--bm-honey);border-color:var(--bm-honey);color:var(--bm-ink);}

  .bm-caption-box{
    padding:16px 20px 14px;
    background:var(--bm-parchment);
    color:var(--bm-ink);
    min-height:74px;
    display:flex;
    align-items:center;
  }
  .bm-caption-text{
    font-size:15.5px;
    line-height:1.5;
    margin:0;
  }
  .bm-hint{
    display:block;
    font-size:12px;
    color:var(--bm-honey-dark);
    font-weight:800;
    margin-top:6px;
    letter-spacing:.2px;
  }

  .bm-interact{
    padding:0 20px 18px;
    background:var(--bm-parchment);
  }
  .bm-hold-btn{
    width:100%;
    position:relative;
    overflow:hidden;
    border:none;
    border-radius:14px;
    padding:16px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
    background:var(--bm-moss);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .bm-hold-fill{
    position:absolute;left:0;top:0;bottom:0;
    width:0%;
    background:var(--bm-honey-dark);
    z-index:0;
  }
  .bm-hold-label{position:relative;z-index:1;}

  .bm-rhythm-track{
    position:relative;
    height:44px;
    background:#e4d6b3;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:12px;
    border:2px solid var(--bm-honey-dark);
  }
  .bm-rhythm-zone{
    position:absolute;top:0;bottom:0;
    left:42%;width:16%;
    background:rgba(79,122,82,.55);
  }
  .bm-rhythm-marker{
    position:absolute;top:2px;bottom:2px;
    width:8px;border-radius:4px;
    background:var(--bm-red);
    left:0%;
  }
  .bm-tapbtn{
    width:100%;
    border:none;border-radius:14px;
    padding:14px;
    font-family:'Nunito',sans-serif;
    font-weight:800;font-size:15px;
    color:#fff;background:var(--bm-red);
    cursor:pointer;
  }
  .bm-mash-meter{
    height:18px;background:#e4d6b3;border-radius:999px;
    overflow:hidden;margin-bottom:12px;border:2px solid var(--bm-honey-dark);
  }
  .bm-mash-fill{height:100%;width:0%;background:var(--bm-moss);transition:width .08s ease;}

  .bm-dots{
    display:flex;
    justify-content:center;
    gap:7px;
    padding:12px 10px;
    background:var(--bm-forest-deep);
  }
  .bm-dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(246,236,217,.25);
    transition:background .2s ease, transform .2s ease;
  }
  .bm-dot.bm-dot-active{background:var(--bm-honey);transform:scale(1.3);}
  .bm-dot.bm-dot-done{background:var(--bm-moss);}

  .bm-footer{
    text-align:center;
    font-size:11.5px;
    padding:9px 10px 12px;
    color:rgba(246,236,217,.55);
    background:var(--bm-forest-deep);
    letter-spacing:.2px;
  }
  .bm-footer a{color:var(--bm-honey);text-decoration:none;}

  .bm-moral{
    font-size:13.5px;
    font-style:italic;
    color:var(--bm-parchment-dim);
    max-width:420px;
    margin:0 auto 22px;
    line-height:1.5;
    font-family:'Fraunces',serif;
  }

  .bm-hidden{display:none !important;}

  @media (max-width:420px){
    .bm-title{font-size:26px;}
    .bm-cover, .bm-end{padding:26px 18px 24px;}
    .bm-caption-text{font-size:14.5px;}
  }
</style>
</head>
<body>

<div id="bm-root">

  <div class="bm-topbar">
    <div class="bm-brand">🐻 Beruang Menari</div>
    <div class="bm-controls">
      <button id="bm-mute-btn" class="bm-iconbtn" title="Suara">🔊</button>
    </div>
  </div>

  <!-- COVER -->
  <div id="bm-cover" class="bm-cover">
    <div class="bm-cover-emoji">🐻💃</div>
    <h1 class="bm-title" id="bm-cover-title">Beruang Menari</h1>
    <p class="bm-subtitle" id="bm-cover-subtitle">Dongeng Anak dari Jerman</p>
    <button id="bm-start-btn" class="bm-btn">Mulai Cerita</button>
    <div class="bm-lang-row">
      <button class="bm-lang-pill" data-lang="id">Indonesia</button>
      <button class="bm-lang-pill" data-lang="en">English</button>
    </div>
  </div>

  <!-- STORY STAGE -->
  <div id="bm-story" class="bm-hidden">
    <div class="bm-stage-wrap">
      <canvas id="bm-canvas" width="800" height="450"></canvas>
    </div>
    <div class="bm-caption-box">
      <div>
        <p class="bm-caption-text" id="bm-caption">...</p>
        <span class="bm-hint" id="bm-caption-hint"></span>
      </div>
    </div>
    <div id="bm-interact" class="bm-interact bm-hidden"></div>
    <div class="bm-dots" id="bm-dots"></div>
  </div>

  <!-- END -->
  <div id="bm-end" class="bm-end bm-hidden">
    <div class="bm-cover-emoji">🐻🎉</div>
    <h1 class="bm-title" id="bm-end-title">Selesai!</h1>
    <p class="bm-moral" id="bm-end-moral"></p>
    <button id="bm-replay-btn" class="bm-btn">Ulangi Cerita</button>
  </div>

  <div class="bm-footer">
    <span id="bm-footer-text">Dongeng anak dari</span> <a href="https://caritasato.blogspot.com" target="_blank" rel="noopener">caritasato.blogspot.com</a>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ================= I18N ================= */
  var TXT = {
    id: {
      title: "Beruang Menari",
      subtitle: "Dongeng Anak dari Jerman",
      start: "Mulai Cerita",
      replay: "Ulangi Cerita",
      tap: "Ketuk untuk lanjut",
      hintTap: "👆 Ketuk gambar atau tombol di bawah untuk lanjut",
      hintHold: "👇 Tahan tombol di bawah",
      hintRhythm: "👇 Perhatikan waktunya, lalu ketuk tombol",
      hintMash: "👇 Ketuk tombol berulang kali",
      endTitle: "Selesai!",
      moral: "Pesan cerita: sahabat sejati menerima kita apa adanya, tanpa rasa iri.",
      footer: "Dongeng anak dari",
      holdLabel: "Tahan untuk menarik beruang keluar",
      holdDone: "Berhasil! Beruang selamat 🎉",
      rhythmLabel: "Ketuk saat penanda ada di area hijau (3x)",
      rhythmGo: "Ketuk!",
      rhythmProgress: "Berhasil: ",
      mashLabel: "Ketuk cepat untuk mengajak teman menari!",
      captions: [
        "Di dalam hutan yang lebat, seekor beruang malang terjebak ke dalam lubang. Kakinya patah karena terjatuh, dan ia tidak mampu naik kembali.",
        "Untunglah, seorang pemburu baik hati lewat dan mendengar rintihan beruang. Tarik beruang itu keluar dari lubang!",
        "Pemburu membawa beruang pulang ke rumahnya. Setiap hari ia dengan sabar mengobati luka di kaki beruang, hingga akhirnya sembuh.",
        "Setelah sembuh, pemburu mulai mengajari beruang menari. Awalnya sulit, tapi ikuti iramanya dan coba menari bersama pemburu!",
        "Berkat ketekunan, beruang kini bisa menari dengan indah. Pemburu juga mengajarinya berbicara bahasa manusia. Mereka pun sering menghabiskan waktu menari bersama.",
        "Suatu hari, beruang meminta izin pulang ke hutan untuk menemui teman-temannya. Pemburu merasa sedih, namun mengizinkannya pergi karena hutan memang rumah si beruang.",
        "Setibanya di hutan, beruang menari sebuah tarian indah di depan teman-temannya. Mereka takjub, namun rasa iri membuat mereka mengejek beruang karena menari tarian manusia.",
        "Beruang tak menyerah. Ia mengajak teman-temannya untuk ikut belajar menari bersamanya. Ayo bujuk mereka!",
        "Sayangnya, teman-teman beruang tetap menolak dan menyuruhnya pergi ke tempat manusia saja. Beruang pun sedih dan memutuskan kembali ke rumah pemburu."
      ],
      endText: "Sejak saat itu, beruang hidup bahagia bersama pemburu. Mereka sering menghabiskan waktu dengan menari bersama, sebagai sahabat yang saling menghargai."
    },
    en: {
      title: "The Dancing Bear",
      subtitle: "A Children's Folktale from Germany",
      start: "Start Story",
      replay: "Replay Story",
      tap: "Tap to continue",
      hintTap: "👆 Tap the picture or the button below to continue",
      hintHold: "👇 Hold the button below",
      hintRhythm: "👇 Watch the timing, then tap the button",
      hintMash: "👇 Tap the button repeatedly",
      endTitle: "The End!",
      moral: "Moral of the story: a true friend accepts you as you are, without envy.",
      footer: "A children's folktale from",
      holdLabel: "Hold to pull the bear out",
      holdDone: "Success! The bear is safe 🎉",
      rhythmLabel: "Tap when the marker is in the green zone (3x)",
      rhythmGo: "Tap!",
      rhythmProgress: "Success: ",
      mashLabel: "Tap quickly to invite your friends to dance!",
      captions: [
        "Deep in the forest, a poor bear got trapped in a hole. He broke his leg from the fall and couldn't climb back out.",
        "Luckily, a kind-hearted hunter passed by and heard the bear's cries. Pull the bear out of the hole!",
        "The hunter brought the bear home. Every day he patiently treated the bear's injured leg, until it finally healed.",
        "Once healed, the hunter began teaching the bear to dance. It was hard at first, follow the rhythm and try dancing along!",
        "Thanks to his hard work, the bear could now dance beautifully. The hunter also taught him to speak. They often spent their days dancing together.",
        "One day, the bear asked permission to return to the forest to see his friends. The hunter felt sad, but let him go, since the forest was truly the bear's home.",
        "Back in the forest, the bear danced a beautiful dance for his friends. They were amazed, but jealousy made them mock him for dancing like a human.",
        "The bear didn't give up. He invited his friends to learn to dance with him. Help persuade them!",
        "Sadly, his friends still refused and told him to go back to the humans. Heartbroken, the bear decided to return to the hunter's home."
      ],
      endText: "From then on, the bear lived happily with the hunter. They spent their days dancing together, as friends who cherished one another."
    }
  };

  /* interaction type per scene index: 'tap' | 'hold' | 'rhythm' | 'mash' */
  var INTERACTIONS = ["tap","hold","tap","rhythm","tap","tap","tap","mash","tap"];
  var TOTAL_SCENES = TXT.id.captions.length;

  /* ================= STATE ================= */
  var state = {
    lang: "id",
    muted: false,
    view: "cover", // cover | story | end
    scene: 0
  };

  try {
    var savedMute = localStorage.getItem("beruangMenariMuted");
    if (savedMute === "1") state.muted = true;
  } catch(e){}

  var params = new URLSearchParams(window.location.search);
  if (params.get("lang") === "en") state.lang = "en";

  /* ================= DOM ================= */
  var el = {
    root: document.getElementById("bm-root"),
    cover: document.getElementById("bm-cover"),
    coverTitle: document.getElementById("bm-cover-title"),
    coverSubtitle: document.getElementById("bm-cover-subtitle"),
    startBtn: document.getElementById("bm-start-btn"),
    langPills: document.querySelectorAll(".bm-lang-pill"),
    story: document.getElementById("bm-story"),
    canvas: document.getElementById("bm-canvas"),
    caption: document.getElementById("bm-caption"),
    captionHint: document.getElementById("bm-caption-hint"),
    interact: document.getElementById("bm-interact"),
    dots: document.getElementById("bm-dots"),
    end: document.getElementById("bm-end"),
    endTitle: document.getElementById("bm-end-title"),
    endMoral: document.getElementById("bm-end-moral"),
    replayBtn: document.getElementById("bm-replay-btn"),
    muteBtn: document.getElementById("bm-mute-btn"),
    footerText: document.getElementById("bm-footer-text")
  };
  var ctx = el.canvas.getContext("2d");

  /* ================= NARRATION ================= */
  var synth = window.speechSynthesis;
  function speak(text){
    if (state.muted || !synth) return;
    try{
      synth.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = state.lang === "id" ? "id-ID" : "en-US";
      u.rate = 0.95;
      u.pitch = 1.0;
      synth.speak(u);
    }catch(e){}
  }
  function stopSpeak(){ try{ if(synth) synth.cancel(); }catch(e){} }

  /* ================= RESIZE (postMessage to parent) ================= */
  function sendResize(){
    var h = el.root.getBoundingClientRect().height;
    try{
      window.parent.postMessage({ type: "beruangMenariResize", height: Math.ceil(h) }, "*");
    }catch(e){}
  }
  if (window.ResizeObserver){
    new ResizeObserver(sendResize).observe(el.root);
  } else {
    window.addEventListener("resize", sendResize);
  }

  /* ================= DRAWING HELPERS ================= */
  var W = 800, H = 450;

  function drawBackground(kind){
    // kind: 'forest' | 'home'
    var g = ctx.createLinearGradient(0,0,0,H);
    if (kind === "home"){
      g.addColorStop(0,"#e8c98f");
      g.addColorStop(1,"#c99a55");
    } else {
      g.addColorStop(0,"#8fc4d6");
      g.addColorStop(0.55,"#cdeacf");
      g.addColorStop(0.551,"#3c6b45");
      g.addColorStop(1,"#254a30");
    }
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    if (kind !== "home"){
      // sun
      ctx.fillStyle = "rgba(255,244,200,.9)";
      ctx.beginPath(); ctx.arc(700,70,38,0,Math.PI*2); ctx.fill();
      // ground texture line
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.fillRect(0,247,W,6);
    } else {
      // simple hut interior wall
      ctx.fillStyle = "#8a5a34";
      ctx.fillRect(0,300,W,150);
      ctx.fillStyle = "rgba(255,255,255,.08)";
      for (var i=0;i<8;i++){ ctx.fillRect(i*100,300,2,150); }
    }
  }

  function drawTree(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = "#6b4226";
    ctx.fillRect(-8,0,16,50);
    ctx.fillStyle = "#2f5c37";
    ctx.beginPath();
    ctx.moveTo(-55,10); ctx.lineTo(55,10); ctx.lineTo(0,-70); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-45,-25); ctx.lineTo(45,-25); ctx.lineTo(0,-90); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-35,-55); ctx.lineTo(35,-55); ctx.lineTo(0,-110); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawHole(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = "#3d2a1a";
    ctx.beginPath(); ctx.ellipse(0,0,90,26,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#1e140c";
    ctx.beginPath(); ctx.ellipse(0,2,68,16,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawHut(x,y,scale){
    scale = scale || 1;
    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = "#6b4226";
    ctx.fillRect(-60,-10,120,80);
    ctx.fillStyle = "#a13d3d";
    ctx.beginPath();
    ctx.moveTo(-72,-10); ctx.lineTo(72,-10); ctx.lineTo(0,-70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f6ecd9";
    ctx.fillRect(-15,20,30,50);
    ctx.fillStyle = "#4a2c17";
    ctx.fillRect(-12,45,24,4);
    ctx.restore();
  }

  function drawBear(x,y,scale,opts){
    opts = opts || {};
    var bandaged = opts.bandaged;
    var dancing = opts.dancing;
    var sad = opts.sad;
    var talk = opts.talk;
    var t = opts.t || 0; // animation phase 0..1

    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);

    var wob = dancing ? Math.sin(t*Math.PI*2)*8 : 0;
    var lean = dancing ? Math.sin(t*Math.PI*2)*0.08 : 0;
    ctx.rotate(lean);

    // legs
    ctx.fillStyle = "#7a4a26";
    ctx.beginPath(); ctx.ellipse(-18, 46+ (dancing?wob*0.3:0), 13, 18, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18, 46- (dancing?wob*0.3:0), 13, 18, 0,0,Math.PI*2); ctx.fill();

    if (bandaged){
      ctx.fillStyle = "#f6ecd9";
      ctx.beginPath(); ctx.ellipse(-18,50,14,9,0.3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#c98a3e"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-26,44); ctx.lineTo(-10,56); ctx.stroke();
    }

    // arms
    ctx.fillStyle = "#8a5a30";
    var armAngle = dancing ? Math.sin(t*Math.PI*2)*0.9 : 0.25;
    ctx.save(); ctx.translate(-30,10); ctx.rotate(-armAngle);
    ctx.beginPath(); ctx.ellipse(0,14,10,22,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(30,10); ctx.rotate(armAngle);
    ctx.beginPath(); ctx.ellipse(0,14,10,22,0,0,Math.PI*2); ctx.fill(); ctx.restore();

    // body
    ctx.fillStyle = "#a06526";
    ctx.beginPath(); ctx.ellipse(0,10,34,38,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#d9b98a";
    ctx.beginPath(); ctx.ellipse(0,20,16,20,0,0,Math.PI*2); ctx.fill();

    // head
    ctx.save();
    ctx.translate(0,-38 + (dancing? Math.sin(t*Math.PI*2)*3:0));
    ctx.fillStyle = "#a06526";
    ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill();
    // ears
    ctx.beginPath(); ctx.arc(-19,-19,9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(19,-19,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#7a4a26";
    ctx.beginPath(); ctx.arc(-19,-19,4.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(19,-19,4.5,0,Math.PI*2); ctx.fill();
    // snout
    ctx.fillStyle = "#d9b98a";
    ctx.beginPath(); ctx.ellipse(0,8,13,10,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#3a2416";
    ctx.beginPath(); ctx.ellipse(0,6,4,3,0,0,Math.PI*2); ctx.fill();
    // mouth
    ctx.strokeStyle = "#3a2416"; ctx.lineWidth=2; ctx.beginPath();
    if (talk){ ctx.ellipse(0,13,6,4,0,0,Math.PI*2); ctx.stroke(); }
    else if (sad){ ctx.arc(0,16,6,Math.PI*1.15,Math.PI*1.85,true); ctx.stroke(); }
    else { ctx.arc(0,12,6,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); }
    // eyes
    ctx.fillStyle = "#241a10";
    if (sad){
      ctx.beginPath(); ctx.arc(-9,-4,2.6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(9,-4,2.6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#5b8fb0"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-9,-1); ctx.lineTo(-11,9); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(-9,-4,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(9,-4,3,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    ctx.restore();
  }

  function drawHunter(x,y,scale,opts){
    opts = opts || {};
    var sad = opts.sad, dancing = opts.dancing, t = opts.t || 0;
    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);
    var lean = dancing ? Math.sin(t*Math.PI*2+1)*0.08 : 0;
    ctx.rotate(lean);

    // legs
    ctx.fillStyle = "#4a3524";
    ctx.fillRect(-14,40,10,34);
    ctx.fillRect(4,40,10,34);
    ctx.fillStyle = "#2e2015";
    ctx.fillRect(-16,70,14,8);
    ctx.fillRect(2,70,14,8);

    // coat
    ctx.fillStyle = "#4f7a52";
    ctx.beginPath();
    ctx.moveTo(-26,42); ctx.lineTo(26,42); ctx.lineTo(20,-10); ctx.lineTo(-20,-10); ctx.closePath(); ctx.fill();
    // belt/scarf
    ctx.fillStyle = "#a13d3d";
    ctx.fillRect(-20,14,40,8);

    // arms
    ctx.fillStyle = "#3f6142";
    var armA = dancing ? Math.sin(t*Math.PI*2+1)*0.7 : 0.15;
    ctx.save(); ctx.translate(-22,-2); ctx.rotate(-armA);
    ctx.fillRect(-6,0,10,32); ctx.restore();
    ctx.save(); ctx.translate(22,-2); ctx.rotate(armA);
    ctx.fillRect(-4,0,10,32); ctx.restore();

    // head
    ctx.fillStyle = "#e3b98a";
    ctx.beginPath(); ctx.arc(0,-24,15,0,Math.PI*2); ctx.fill();
    // hat
    ctx.fillStyle = "#3d5c3f";
    ctx.beginPath(); ctx.ellipse(0,-36,19,7,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-40,12,Math.PI,0); ctx.fill();
    ctx.fillStyle = "#a13d3d";
    ctx.beginPath(); ctx.moveTo(10,-46); ctx.lineTo(20,-56); ctx.lineTo(14,-40); ctx.closePath(); ctx.fill();
    // face
    ctx.fillStyle = "#2e2015";
    ctx.beginPath(); ctx.arc(-5,-25,1.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-25,1.8,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#2e2015"; ctx.lineWidth=1.6;
    ctx.beginPath();
    if (sad){ ctx.arc(0,-14,4,Math.PI*1.2,Math.PI*1.8,true); }
    else { ctx.arc(0,-16,4,0.15*Math.PI,0.85*Math.PI); }
    ctx.stroke();
    // moustache
    ctx.fillStyle = "#6b4226";
    ctx.beginPath(); ctx.ellipse(-4,-18,4,2,0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4,-18,4,2,-0.3,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function drawFriend(kind,x,y,scale,opts){
    opts = opts || {};
    var mock = opts.mock;
    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);
    var body = "#c98a3e", ear="#a06526";
    if (kind === "fox"){ body="#d9702e"; ear="#ffffff"; }
    if (kind === "rabbit"){ body="#e8e2d4"; ear="#e8e2d4"; }
    if (kind === "deer"){ body="#b98a55"; ear="#8a5a34"; }

    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0,10,20,22,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-16,15,0,Math.PI*2); ctx.fill();

    if (kind === "rabbit"){
      ctx.fillStyle = ear;
      ctx.beginPath(); ctx.ellipse(-6,-36,4,16,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6,-36,4,16,0,0,Math.PI*2); ctx.fill();
    } else if (kind === "deer"){
      ctx.strokeStyle = ear; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(-6,-28); ctx.lineTo(-11,-40); ctx.moveTo(-6,-28); ctx.lineTo(-2,-40); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6,-28); ctx.lineTo(11,-40); ctx.moveTo(6,-28); ctx.lineTo(2,-40); ctx.stroke();
    } else {
      ctx.fillStyle = ear;
      ctx.beginPath(); ctx.moveTo(-14,-24); ctx.lineTo(-4,-30); ctx.lineTo(-8,-14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(14,-24); ctx.lineTo(4,-30); ctx.lineTo(8,-14); ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = "#2e2015";
    ctx.beginPath(); ctx.arc(-5,-16,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-16,2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#2e2015"; ctx.lineWidth=1.6; ctx.beginPath();
    if (mock){ ctx.arc(0,-6,4,Math.PI*0.15,Math.PI*0.85,true); }
    else { ctx.arc(0,-8,4,0.15*Math.PI,0.85*Math.PI); }
    ctx.stroke();

    ctx.restore();
  }

  function drawNote(x,y,rot){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot||0);
    ctx.fillStyle = "#f6ecd9";
    ctx.beginPath(); ctx.ellipse(0,0,5,4,0.4,0,Math.PI*2); ctx.fill();
    ctx.fillRect(4,-16,2,18);
    ctx.restore();
  }

  function drawTear(x,y){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = "#7fc4e0";
    ctx.beginPath();
    ctx.moveTo(0,-6); ctx.quadraticCurveTo(6,4,0,8); ctx.quadraticCurveTo(-6,4,0,-6);
    ctx.fill();
    ctx.restore();
  }

  /* ================= SCENE RENDERERS ================= */
  var animT = 0;
  var rafId = null;

  function renderScene(idx, animated){
    var t = animated ? animT : 0;
    ctx.clearRect(0,0,W,H);

    if (idx === 0){
      drawBackground("forest");
      drawTree(90,240,1.1); drawTree(700,230,1.0); drawTree(640,255,0.8);
      drawHole(400,290,1.1);
      drawBear(390,300,0.8,{bandaged:true, sad:true});
    }
    else if (idx === 1){
      drawBackground("forest");
      drawTree(90,240,1.1); drawTree(680,235,0.9);
      drawHole(400,290,1.1);
      drawBear(390,285,0.8,{bandaged:true});
      drawHunter(300,270,0.85,{});
    }
    else if (idx === 2){
      drawBackground("home");
      drawHut(210,150,0.55);
      drawBear(470,300,0.95,{bandaged:true});
      drawHunter(370,300,0.9,{});
    }
    else if (idx === 3){
      drawBackground("home");
      drawHut(650,140,0.4);
      drawBear(320,300,0.95,{dancing:true, t:t});
      drawHunter(480,300,0.9,{dancing:true, t:t});
      if (Math.sin(t*Math.PI*2) > 0){
        drawNote(250,180,-0.3); drawNote(540,170,0.3);
      }
    }
    else if (idx === 4){
      drawBackground("home");
      drawBear(330,300,1.0,{dancing:true, talk:true, t:t});
      drawHunter(490,300,0.9,{dancing:true, t:t});
      drawNote(260,160,-0.2); drawNote(560,150,0.25); drawNote(410,120,0);
    }
    else if (idx === 5){
      drawBackground("home");
      drawHut(660,150,0.4);
      drawBear(330,300,0.95,{});
      drawHunter(490,300,0.9,{sad:true});
      drawTear(500,258);
    }
    else if (idx === 6){
      drawBackground("forest");
      drawTree(700,225,0.9); drawTree(60,240,1.0);
      drawBear(220,300,0.9,{dancing:true, t:t});
      drawFriend("fox",470,315,0.9,{mock:true});
      drawFriend("rabbit",560,320,0.8,{mock:true});
      drawFriend("deer",650,310,0.95,{mock:true});
      drawNote(160,190,-0.2);
    }
    else if (idx === 7){
      drawBackground("forest");
      drawTree(700,225,0.9);
      drawBear(220,300,0.9,{dancing:true, t:t, talk:true});
      drawFriend("fox",460,318,0.9,{});
      drawFriend("rabbit",550,322,0.8,{});
      drawFriend("deer",640,312,0.95,{});
    }
    else if (idx === 8){
      drawBackground("forest");
      drawTree(700,225,0.9); drawTree(60,240,1.0);
      drawBear(400,300,1.0,{sad:true});
      drawTear(376,262);
      drawFriend("fox",590,318,0.75,{mock:true});
      drawFriend("rabbit",660,322,0.65,{mock:true});
    }
  }

  var ANIMATED_SCENES = {3:1,4:1,6:1,7:1};

  function startAnim(idx){
    stopAnim();
    if (!ANIMATED_SCENES[idx]) { renderScene(idx,false); return; }
    var start = performance.now();
    function loop(now){
      animT = ((now - start) / 1400) % 1;
      renderScene(idx, true);
      rafId = requestAnimationFrame(loop);
    }
    rafId = requestAnimationFrame(loop);
  }
  function stopAnim(){
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  /* ================= INTERACTIONS ================= */
  var activeRafs = [];
  var activeIntervals = [];
  function clearInteract(){
    activeRafs.forEach(function(id){ cancelAnimationFrame(id); });
    activeRafs = [];
    activeIntervals.forEach(function(id){ clearInterval(id); });
    activeIntervals = [];
    el.interact.innerHTML = "";
    el.interact.classList.add("bm-hidden");
    el.canvas.style.cursor = "pointer";
  }

  function goNextScene(){
    if (state.scene < TOTAL_SCENES - 1){
      state.scene++;
      renderStoryStep();
    } else {
      showEnd();
    }
  }

  function setupInteractionFor(idx){
    var type = INTERACTIONS[idx];
    var T = TXT[state.lang];
    clearInteract();

    el.interact.classList.remove("bm-hidden");

    if (type === "tap"){
      el.canvas.onclick = goNextScene;
      var isLast = idx === TOTAL_SCENES - 1;
      var nextLabel = isLast ? (state.lang === "id" ? "Selesai ✓" : "Finish ✓") : (state.lang === "id" ? "Lanjut ▶" : "Next ▶");
      el.interact.innerHTML = '<button id="bm-next-btn" class="bm-tapbtn">'+nextLabel+'</button>';
      document.getElementById("bm-next-btn").addEventListener("click", goNextScene);
      return;
    }
    el.canvas.onclick = null;

    if (type === "hold"){
      el.interact.innerHTML =
        '<button id="bm-hold" class="bm-hold-btn">' +
          '<div class="bm-hold-fill" id="bm-hold-fill"></div>' +
          '<span class="bm-hold-label" id="bm-hold-label">'+T.holdLabel+'</span>' +
        '</button>';
      var btn = document.getElementById("bm-hold");
      var fill = document.getElementById("bm-hold-fill");
      var label = document.getElementById("bm-hold-label");
      var holding = false, progress = 0, raf2 = null;
      function tick(){
        if (holding){
          progress = Math.min(100, progress + 1.6);
          fill.style.width = progress + "%";
          if (progress >= 100){
            label.textContent = T.holdDone;
            holding = false;
            setTimeout(goNextScene, 700);
            return;
          }
          raf2 = requestAnimationFrame(tick);
        }
      }
      function start(e){ e.preventDefault(); holding = true; tick(); }
      function end(){ holding = false; if (progress < 100){ progress = Math.max(0,progress-8); fill.style.width=progress+"%"; } }
      btn.addEventListener("mousedown", start);
      btn.addEventListener("touchstart", start, {passive:false});
      btn.addEventListener("mouseup", end);
      btn.addEventListener("mouseleave", end);
      btn.addEventListener("touchend", end);
    }

    if (type === "rhythm"){
      el.interact.innerHTML =
        '<p class="bm-hint" style="margin-bottom:8px;">'+T.rhythmLabel+'</p>' +
        '<div class="bm-rhythm-track">' +
          '<div class="bm-rhythm-zone"></div>' +
          '<div class="bm-rhythm-marker" id="bm-rhythm-marker"></div>' +
        '</div>' +
        '<button id="bm-rhythm-btn" class="bm-tapbtn">'+T.rhythmGo+' (0/3)</button>';
      var marker = document.getElementById("bm-rhythm-marker");
      var rbtn = document.getElementById("bm-rhythm-btn");
      var hits = 0, pos = 0, dir = 1, cancelled = false;
      function mtick(){
        if (cancelled) return;
        pos += dir * 2.2;
        if (pos >= 100){ pos = 100; dir = -1; }
        if (pos <= 0){ pos = 0; dir = 1; }
        marker.style.left = pos + "%";
        var id = requestAnimationFrame(mtick);
        activeRafs.push(id);
      }
      activeRafs.push(requestAnimationFrame(mtick));
      rbtn.addEventListener("click", function(){
        if (pos >= 40 && pos <= 60){
          hits++;
          rbtn.textContent = T.rhythmGo + " (" + hits + "/3)";
          if (hits >= 3){
            cancelled = true;
            rbtn.disabled = true;
            setTimeout(goNextScene, 500);
          }
        } else {
          rbtn.textContent = T.rhythmGo + " (" + hits + "/3)";
        }
      });
    }

    if (type === "mash"){
      el.interact.innerHTML =
        '<p class="bm-hint" style="margin-bottom:8px;">'+T.mashLabel+'</p>' +
        '<div class="bm-mash-meter"><div class="bm-mash-fill" id="bm-mash-fill"></div></div>' +
        '<button id="bm-mash-btn" class="bm-tapbtn">'+ (state.lang==="id" ? "Ajak Menari!" : "Invite to Dance!") +'</button>';
      var mfill = document.getElementById("bm-mash-fill");
      var mbtn = document.getElementById("bm-mash-btn");
      var mprog = 0, decayId = setInterval(function(){
        mprog = Math.max(0, mprog - 2);
        mfill.style.width = mprog + "%";
      }, 90);
      activeIntervals.push(decayId);
      mbtn.addEventListener("click", function(){
        mprog = Math.min(100, mprog + 12);
        mfill.style.width = mprog + "%";
        if (mprog >= 100){
          clearInterval(decayId);
          mbtn.disabled = true;
          setTimeout(goNextScene, 600);
        }
      });
    }
  }

  /* ================= DOTS ================= */
  function renderDots(){
    var html = "";
    for (var i=0;i<TOTAL_SCENES;i++){
      var cls = "bm-dot";
      if (i === state.scene) cls += " bm-dot-active";
      else if (i < state.scene) cls += " bm-dot-done";
      html += '<span class="'+cls+'"></span>';
    }
    el.dots.innerHTML = html;
  }

  /* ================= VIEW SWITCHING ================= */
  function applyStaticText(){
    var T = TXT[state.lang];
    el.coverTitle.textContent = T.title;
    el.coverSubtitle.textContent = T.subtitle;
    el.startBtn.textContent = T.start;
    el.replayBtn.textContent = T.replay;
    el.endTitle.textContent = T.endTitle;
    el.footerText.textContent = T.footer;
    document.title = T.title;
    el.langPills.forEach(function(p){
      p.classList.toggle("bm-active", p.getAttribute("data-lang") === state.lang);
    });
  }

  var HINT_KEYS = { tap:"hintTap", hold:"hintHold", rhythm:"hintRhythm", mash:"hintMash" };
  function renderStoryStep(){
    var T = TXT[state.lang];
    el.caption.textContent = T.captions[state.scene];
    var hintKey = HINT_KEYS[INTERACTIONS[state.scene]];
    el.captionHint.textContent = hintKey ? T[hintKey] : "";
    renderDots();
    setupInteractionFor(state.scene);
    startAnim(state.scene);
    speak(T.captions[state.scene]);
    sendResize();
  }

  function showCover(){
    state.view = "cover";
    stopAnim(); stopSpeak();
    el.cover.classList.remove("bm-hidden");
    el.story.classList.add("bm-hidden");
    el.end.classList.add("bm-hidden");
    applyStaticText();
    sendResize();
  }

  function showStory(){
    state.view = "story";
    state.scene = 0;
    el.cover.classList.add("bm-hidden");
    el.story.classList.remove("bm-hidden");
    el.end.classList.add("bm-hidden");
    renderStoryStep();
  }

  function showEnd(){
    state.view = "end";
    stopAnim(); stopSpeak();
    el.story.classList.add("bm-hidden");
    el.end.classList.remove("bm-hidden");
    var T = TXT[state.lang];
    el.endMoral.innerHTML = T.endText + "<br><br><em>" + T.moral + "</em>";
    speak(T.endText + " " + T.moral);
    sendResize();
  }

  /* ================= EVENTS ================= */
  el.startBtn.addEventListener("click", showStory);
  el.replayBtn.addEventListener("click", showCover);

  el.langPills.forEach(function(p){
    p.addEventListener("click", function(){
      state.lang = p.getAttribute("data-lang");
      applyStaticText();
      if (state.view === "story"){ renderStoryStep(); }
      else if (state.view === "end"){ showEnd(); }
    });
  });

  el.muteBtn.addEventListener("click", function(){
    state.muted = !state.muted;
    el.muteBtn.textContent = state.muted ? "🔇" : "🔊";
    el.muteBtn.classList.toggle("bm-active", state.muted);
    try{ localStorage.setItem("beruangMenariMuted", state.muted ? "1":"0"); }catch(e){}
    if (state.muted) stopSpeak();
  });

  /* init mute icon */
  el.muteBtn.textContent = state.muted ? "🔇" : "🔊";
  el.muteBtn.classList.toggle("bm-active", state.muted);

  /* ================= INIT ================= */
  applyStaticText();
  showCover();
  window.addEventListener("load", sendResize);
  setTimeout(sendResize, 300);

})();
</script>
</body>
</html>

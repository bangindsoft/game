<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alibaba dan Empat Puluh Pencuri</title>
<style>
  :root{
    --ab-night:#0b1230;
    --ab-night2:#171b3d;
    --ab-sand:#e8c27a;
    --ab-sand-dark:#c99a4a;
    --ab-gold:#f0c14b;
    --ab-maroon:#8a3b2b;
    --ab-maroon-dark:#5f2419;
    --ab-cream:#f7ecd6;
    --ab-ink:#2a1c12;
    --ab-shadow:rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  #ab-root{
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    max-width:720px;
    margin:0 auto;
    background:linear-gradient(180deg,var(--ab-night) 0%, var(--ab-night2) 55%, var(--ab-maroon-dark) 100%);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 30px var(--ab-shadow);
    color:var(--ab-cream);
    position:relative;
  }
  #ab-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:rgba(0,0,0,0.25);
    border-bottom:2px solid var(--ab-gold);
  }
  #ab-title{
    font-size:15px;
    font-weight:bold;
    letter-spacing:0.5px;
    color:var(--ab-gold);
    display:flex;
    align-items:center;
    gap:6px;
  }
  #ab-controls{
    display:flex;
    gap:8px;
  }
  .ab-btn{
    background:var(--ab-maroon);
    color:var(--ab-cream);
    border:1px solid var(--ab-gold);
    border-radius:20px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
    transition:transform 0.15s ease, background 0.15s ease;
    font-family:inherit;
  }
  .ab-btn:hover{ background:#a6462f; transform:translateY(-1px); }
  .ab-btn:active{ transform:translateY(0); }
  .ab-btn.ab-active{ outline:2px solid var(--ab-gold); }

  #ab-stage-wrap{
    padding:14px 16px 6px 16px;
  }
  #ab-dots{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:10px;
  }
  .ab-dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(247,236,214,0.25);
    border:1px solid rgba(240,193,75,0.4);
    transition:all 0.25s ease;
  }
  .ab-dot.ab-done{ background:var(--ab-gold); }
  .ab-dot.ab-current{
    background:var(--ab-gold);
    box-shadow:0 0 6px 2px rgba(240,193,75,0.6);
    transform:scale(1.3);
  }

  #ab-scene{
    background:radial-gradient(ellipse at 50% 20%, rgba(240,193,75,0.08), transparent 60%);
    border-radius:12px;
    border:1px solid rgba(240,193,75,0.25);
    overflow:hidden;
    position:relative;
  }
  #ab-scene svg{ display:block; width:100%; height:auto; }

  #ab-narration-box{
    margin-top:12px;
    background:rgba(0,0,0,0.28);
    border-left:3px solid var(--ab-gold);
    border-radius:8px;
    padding:12px 14px;
    font-size:14.5px;
    line-height:1.55;
    min-height:44px;
  }

  #ab-qte{
    margin-top:12px;
  }
  #ab-qte-prompt{
    font-size:13.5px;
    color:var(--ab-gold);
    margin-bottom:8px;
    font-weight:bold;
    text-align:center;
  }
  #ab-qte-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .ab-qte-opt{
    background:linear-gradient(180deg,var(--ab-sand),var(--ab-sand-dark));
    color:var(--ab-ink);
    border:2px solid var(--ab-maroon);
    border-radius:10px;
    padding:10px 8px;
    font-size:13.5px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    transition:transform 0.12s ease;
  }
  .ab-qte-opt:hover{ transform:scale(1.03); }
  .ab-qte-opt.ab-wrong{
    animation:ab-shake 0.4s;
    background:linear-gradient(180deg,#e08a7d,#b5544a);
    color:#fff;
  }
  .ab-qte-opt.ab-correct{
    background:linear-gradient(180deg,#a9e08a,#5f9e3e);
    color:#123;
  }
  @keyframes ab-shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }
  #ab-qte-feedback{
    text-align:center;
    font-size:12.5px;
    margin-top:6px;
    min-height:16px;
    color:var(--ab-gold);
  }

  #ab-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:14px 0 6px 0;
  }
  #ab-next-btn{
    background:linear-gradient(180deg,var(--ab-gold),var(--ab-sand-dark));
    color:var(--ab-ink);
    border:none;
    border-radius:24px;
    padding:10px 26px;
    font-size:14.5px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 var(--ab-maroon-dark);
    font-family:inherit;
  }
  #ab-next-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ab-maroon-dark); }
  #ab-next-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  #ab-start-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,var(--ab-night) 0%, var(--ab-maroon-dark) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
    z-index:20;
  }
  #ab-start-overlay h1{
    color:var(--ab-gold);
    font-size:22px;
    margin:8px 0 4px 0;
  }
  #ab-start-overlay p{
    font-size:13.5px;
    color:var(--ab-cream);
    max-width:420px;
    margin:4px 0 18px 0;
    opacity:0.9;
  }
  #ab-start-btn{
    background:linear-gradient(180deg,var(--ab-gold),var(--ab-sand-dark));
    color:var(--ab-ink);
    border:none;
    border-radius:26px;
    padding:12px 30px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 0 var(--ab-maroon-dark);
    font-family:inherit;
  }
  #ab-start-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ab-maroon-dark); }

  #ab-footer{
    text-align:center;
    font-size:10.5px;
    opacity:0.55;
    padding:8px 10px 12px 10px;
  }
  #ab-footer a{ color:var(--ab-gold); text-decoration:none; }

  #ab-end-badge{
    display:none;
    text-align:center;
    margin-top:10px;
    font-size:14px;
    color:var(--ab-gold);
    font-weight:bold;
  }
</style>
</head>
<body>
<div id="ab-root">

  <div id="ab-start-overlay">
    <div style="font-size:40px;">🏺</div>
    <h1 id="ab-start-title">Alibaba dan Empat Puluh Pencuri</h1>
    <p id="ab-start-desc">Dongeng rakyat dari Persia (Iran) — ikuti kisah Alibaba, kata sandi ajaib, dan Marjanah yang cerdik menyelamatkan keluarganya.</p>
    <button id="ab-start-btn" class="ab-btn">▶ <span id="ab-start-btn-label">Mulai Cerita</span></button>
    <div style="margin-top:14px; display:flex; gap:8px;">
      <button class="ab-btn" id="ab-start-lang-id">🇮🇩 Indonesia</button>
      <button class="ab-btn" id="ab-start-lang-en">🇬🇧 English</button>
    </div>
  </div>

  <div id="ab-topbar">
    <div id="ab-title">🕌 <span id="ab-title-text">Alibaba &amp; 40 Pencuri</span></div>
    <div id="ab-controls">
      <button class="ab-btn" id="ab-mute-btn" title="Mute/Unmute">🔊</button>
      <button class="ab-btn" id="ab-lang-btn" title="Switch language">EN</button>
    </div>
  </div>

  <div id="ab-stage-wrap">
    <div id="ab-dots"></div>
    <div id="ab-scene"></div>
    <div id="ab-narration-box"></div>

    <div id="ab-qte" style="display:none;">
      <div id="ab-qte-prompt"></div>
      <div id="ab-qte-options"></div>
      <div id="ab-qte-feedback"></div>
    </div>

    <div id="ab-actions">
      <button id="ab-next-btn">Lanjut ▶</button>
    </div>
    <div id="ab-end-badge">🎉 Tamat — Terima kasih sudah menyimak!</div>
  </div>

  <div id="ab-footer">Dongeng rakyat Iran (Persia) • <a href="https://caritasato.blogspot.com" target="_blank" rel="noopener">caritasato.blogspot.com</a></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- state ---------- */
  var qs = new URLSearchParams(window.location.search);
  var state = {
    lang: qs.get('lang') === 'en' ? 'en' : 'id',
    muted: (localStorage.getItem('alibabaMuted') === '1'),
    stage: 0,
    qteSolved: {},
    started: false
  };

  var synth = window.speechSynthesis || null;
  var voices = [];
  function loadVoices(){
    if(!synth) return;
    voices = synth.getVoices();
  }
  if(synth){
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  }

  function pickVoice(lang){
    if(!voices || !voices.length) return null;
    var target = lang === 'en' ? 'en-US' : 'id-ID';
    var v = voices.find(function(v){ return v.lang === target; });
    if(v) return v;
    var prefix = lang === 'en' ? 'en' : 'id';
    v = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; });
    if(v) return v;
    return voices[0] || null;
  }

  function speak(text){
    if(!synth || state.muted || !text) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice(state.lang);
    if(v) u.voice = v;
    u.lang = state.lang === 'en' ? 'en-US' : 'id-ID';
    u.rate = 0.95;
    u.pitch = 1.0;
    synth.speak(u);
  }
  function stopSpeak(){ if(synth) synth.cancel(); }

  /* ---------- STAGES DATA ---------- */
  var STAGES = [
    {
      id:'intro',
      title:{id:'Alibaba Si Pencari Kayu', en:'Alibaba the Woodcutter'},
      text:{
        id:'Dahulu kala di sebuah kota di Persia, hiduplah Alibaba, seorang pencari kayu yang miskin namun jujur. Setiap hari ia pergi ke hutan bersama dua ekor keledainya untuk mencari kayu bakar.',
        en:'Long ago in a town in Persia, there lived Alibaba, a poor but honest woodcutter. Every day he went to the forest with his two donkeys to gather firewood.'
      },
      scene:sceneIntro
    },
    {
      id:'cave-found',
      title:{id:'Gua Rahasia', en:'The Secret Cave'},
      text:{
        id:'Suatu hari, Alibaba melihat rombongan empat puluh penunggang kuda mendekati sebuah tebing batu besar. Ia bersembunyi di balik pohon dan mengintip diam-diam.',
        en:'One day, Alibaba saw a band of forty horsemen approaching a great rocky cliff. He hid behind a tree and watched quietly.'
      },
      scene:sceneCaveFound
    },
    {
      id:'password-qte',
      title:{id:'Kata Sandi Ajaib', en:'The Magic Password'},
      text:{
        id:'Pemimpin pencuri berdiri di depan batu besar dan berseru sebuah kata ajaib. Seketika, batu itu bergeser membuka sebuah pintu gua! Bantu Alibaba mengingat kata sandinya.',
        en:'The leader of the thieves stood before the great rock and shouted a magic word. Instantly, the rock slid open into a cave door! Help Alibaba remember the password.'
      },
      scene:sceneCaveDoor,
      qte:{
        prompt:{id:'Kata sandi apa yang diucapkan pemimpin pencuri?', en:'What password did the thief leader say?'},
        options:[
          {id:'Buka Gandum!', en:'Open Wheat!', correct:false},
          {id:'Buka Wijen!', en:'Open Sesame!', correct:true},
          {id:'Buka Jelai!', en:'Open Barley!', correct:false},
          {id:'Buka Beras!', en:'Open Rice!', correct:false}
        ],
        successText:{
          id:'Benar! "Buka Wijen!" — pintu batu itu terbuka lebar, mengungkap gua penuh harta karun.',
          en:'Correct! "Open Sesame!" — the stone door swings wide, revealing a cave full of treasure.'
        }
      }
    },
    {
      id:'treasure',
      title:{id:'Harta Karun', en:'The Treasure'},
      text:{
        id:'Setelah para pencuri pergi, Alibaba mengucapkan kata sandi itu dan masuk ke dalam gua. Ia terkesima melihat tumpukan emas, permata, dan kain sutra. Ia mengambil secukupnya lalu pulang dengan gembira.',
        en:'After the thieves left, Alibaba spoke the password and entered the cave. He was amazed to see piles of gold, jewels, and silk. He took just enough and went home overjoyed.'
      },
      scene:sceneTreasure
    },
    {
      id:'kassim',
      title:{id:'Kassim yang Serakah', en:'Greedy Kassim'},
      text:{
        id:'Kassim, kakak Alibaba yang kaya namun tamak, mendengar rahasia itu. Ia diam-diam pergi ke gua dengan sepuluh ekor keledai, berniat membawa pulang harta sebanyak-banyaknya.',
        en:'Kassim, Alibaba\'s rich but greedy older brother, heard the secret. He secretly went to the cave with ten donkeys, intending to bring home as much treasure as possible.'
      },
      scene:sceneKassim
    },
    {
      id:'kassim-trapped',
      title:{id:'Kassim Terjebak', en:'Kassim is Trapped'},
      text:{
        id:'Karena terlalu sibuk mengumpulkan emas, Kassim lupa kata sandi untuk keluar! Ia panik menyebut nama biji-bijian lain, tapi pintu gua tetap tertutup rapat. Para pencuri pun kembali dan menangkapnya.',
        en:'Too busy gathering gold, Kassim forgot the password to get out! He panicked and shouted names of other grains, but the cave door stayed shut. The thieves returned and caught him.'
      },
      scene:sceneKassimTrapped
    },
    {
      id:'marjanah-mark',
      title:{id:'Marjanah yang Cerdik', en:'Clever Marjanah'},
      text:{
        id:'Marjanah, pelayan cerdik keluarga Alibaba, membantu menguburkan Kassim secara diam-diam. Ketika pencuri menandai rumah Alibaba dengan tanda silang untuk mengintai, Marjanah menandai semua pintu di jalan itu agar mereka tidak bisa membedakannya.',
        en:'Marjanah, Alibaba\'s clever servant, secretly helped bury Kassim. When the thieves marked Alibaba\'s house with a chalk cross to spy on it, Marjanah marked every door on the street so they couldn\'t tell which was which.'
      },
      scene:sceneMarjanahMark,
      qte:{
        type:'find-odd',
        prompt:{id:'Bantu Marjanah menandai pintu yang benar dengan tanda silang!', en:'Help Marjanah mark the correct door with a cross!'},
        houseCount:5,
        successText:{
          id:'Marjanah menandai semua pintu — kini para pencuri tidak bisa menemukan rumah Alibaba!',
          en:'Marjanah marked every door — now the thieves cannot find Alibaba\'s house!'
        }
      }
    },
    {
      id:'oil-jars',
      title:{id:'Tong-Tong Minyak', en:'The Oil Jars'},
      text:{
        id:'Pemimpin pencuri menyamar sebagai pedagang minyak, membawa tiga puluh delapan tong besar — masing-masing menyembunyikan seorang pencuri! Marjanah yang waspada mencurigai salah satu tong yang bergerak sedikit.',
        en:'The thief leader disguised himself as an oil merchant, carrying thirty-eight huge jars — each hiding a thief! Sharp-eyed Marjanah noticed one jar move slightly.'
      },
      scene:sceneOilJars,
      qte:{
        type:'find-jar',
        prompt:{id:'Temukan tong minyak yang mencurigakan itu!', en:'Find the suspicious oil jar!'},
        jarCount:6,
        successText:{
          id:'Tepat! Marjanah menemukan tong yang berisi pencuri bersembunyi.',
          en:'Exactly! Marjanah found the jar hiding a thief.'
        }
      }
    },
    {
      id:'ending',
      title:{id:'Kemenangan Marjanah', en:'Marjanah\'s Victory'},
      text:{
        id:'Malam itu, Marjanah menuangkan minyak mendidih ke setiap tong, mengalahkan para pencuri satu per satu. Alibaba dan keluarganya pun selamat, dan sejak saat itu mereka hidup damai serta membalas budi kepada Marjanah yang cerdik dan berani.',
        en:'That night, Marjanah poured boiling oil into each jar, defeating the thieves one by one. Alibaba and his family were saved, and from then on they lived in peace, forever grateful to the brave and clever Marjanah.'
      },
      scene:sceneEnding
    }
  ];

  /* ---------- SVG SCENES ---------- */
  function svgWrap(inner, viewBox){
    return '<svg viewBox="'+(viewBox||'0 0 600 320')+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
  }
  function skyNight(){
    return '<rect width="600" height="320" fill="#0b1230"/>' +
      '<circle cx="500" cy="55" r="28" fill="#f7ecd6" opacity="0.9"/>' +
      '<circle cx="70" cy="40" r="2" fill="#fff"/><circle cx="130" cy="70" r="1.5" fill="#fff"/>' +
      '<circle cx="220" cy="30" r="1.5" fill="#fff"/><circle cx="330" cy="50" r="2" fill="#fff"/>' +
      '<circle cx="410" cy="90" r="1.5" fill="#fff"/><circle cx="20" cy="100" r="1.5" fill="#fff"/>';
  }
  function skyDay(){
    return '<rect width="600" height="320" fill="#f2c76b"/>' +
      '<rect width="600" height="320" fill="url(#abSkyGrad)"/>' +
      '<defs><linearGradient id="abSkyGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#f6dca0"/><stop offset="100%" stop-color="#e8b25f"/></linearGradient></defs>' +
      '<circle cx="500" cy="55" r="34" fill="#fff3d0"/>';
  }
  function duneGround(color){
    color = color || '#c99a4a';
    return '<path d="M0,240 Q150,200 300,235 T600,220 L600,320 L0,320 Z" fill="'+color+'"/>';
  }
  function person(x,y,scale,color,headColor){
    scale = scale||1; color=color||'#8a3b2b'; headColor=headColor||'#e0b189';
    return '<g transform="translate('+x+','+y+') scale('+scale+')">' +
      '<circle cx="0" cy="-38" r="9" fill="'+headColor+'"/>' +
      '<path d="M-10,-30 Q0,-40 10,-30 L10,-20 Q0,-24 -10,-20 Z" fill="'+color+'"/>' +
      '<path d="M-8,-28 L-14,10 L-2,10 L0,-16 L2,10 L14,10 L8,-28 Z" fill="'+color+'"/>' +
      '</g>';
  }
  function donkey(x,y,scale){
    scale = scale || 1;
    return '<g transform="translate('+x+','+y+') scale('+scale+')">' +
      '<ellipse cx="0" cy="0" rx="22" ry="13" fill="#a17a4f"/>' +
      '<circle cx="24" cy="-6" r="9" fill="#a17a4f"/>' +
      '<path d="M28,-14 L32,-22 M22,-15 L24,-23" stroke="#7a5a37" stroke-width="3" stroke-linecap="round"/>' +
      '<line x1="-14" y1="10" x2="-14" y2="24" stroke="#7a5a37" stroke-width="5" stroke-linecap="round"/>' +
      '<line x1="10" y1="11" x2="10" y2="25" stroke="#7a5a37" stroke-width="5" stroke-linecap="round"/>' +
      '</g>';
  }
  function tree(x,y,scale){
    scale = scale || 1;
    return '<g transform="translate('+x+','+y+') scale('+scale+')">' +
      '<rect x="-4" y="-10" width="8" height="34" fill="#5a3d24"/>' +
      '<circle cx="0" cy="-25" r="22" fill="#3f6b3a"/>' +
      '<circle cx="-14" cy="-14" r="14" fill="#3f6b3a"/>' +
      '<circle cx="14" cy="-14" r="14" fill="#3f6b3a"/>' +
      '</g>';
  }
  function rockCliff(){
    return '<path d="M350,320 L360,120 Q420,60 480,110 Q540,90 560,150 L600,320 Z" fill="#6b5a49"/>' +
      '<path d="M370,320 L378,150 Q430,110 470,140 Q520,120 545,175 L570,320 Z" fill="#7a6858"/>';
  }
  function caveDoor(open){
    return '<g id="abCaveDoor">' +
      (open ?
        '<ellipse cx="470" cy="255" rx="46" ry="60" fill="#1a120c"/>' :
        '<path d="M424,300 Q470,190 516,300 Z" fill="#8a7461"/>' +
        '<path d="M424,300 Q470,196 516,300 Z" fill="none" stroke="#54463a" stroke-width="3"/>'
      ) + '</g>';
  }
  function coinPile(x,y,scale){
    scale = scale||1;
    var c='';
    for(var i=0;i<8;i++){
      var cx = x + (Math.sin(i*2.1)*22);
      var cy = y - (i*3);
      c += '<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="#f0c14b" stroke="#c99a4a" stroke-width="1.5"/>';
    }
    return '<g transform="scale('+scale+')" transform-origin="'+x+' '+y+'">'+c+'</g>';
  }
  function jarShape(x,y,scale,highlight){
    scale = scale||1;
    return '<g transform="translate('+x+','+y+') scale('+scale+')">' +
      '<path d="M-16,-40 Q-16,-52 0,-52 Q16,-52 16,-40 L20,20 Q20,40 0,40 Q-20,40 -20,20 Z" ' +
      'fill="'+(highlight?'#e0a860':'#c98f52')+'" stroke="#7a5a37" stroke-width="2"/>' +
      '<ellipse cx="0" cy="-40" rx="16" ry="6" fill="#a1734a"/>' +
      '</g>';
  }

  function sceneIntro(){
    return svgWrap(
      skyDay() +
      duneGround('#e8c27a') +
      tree(60,250,1.1) + tree(540,260,0.9) +
      donkey(160,255,1) + donkey(210,260,0.9) +
      person(190,255,1.1)
    );
  }
  function sceneCaveFound(){
    return svgWrap(
      skyDay() + duneGround('#dcae63') + rockCliff() +
      tree(60,255,1) +
      '<g opacity="0.85">' +
        person(90,240,0.55) +
      '</g>' +
      // 40 thieves as small silhouettes riding toward cliff
      thievesGroup(200,260,10)
    );
  }
  function thievesGroup(x,y,count){
    var g='';
    for(var i=0;i<count;i++){
      var px = x + i*22;
      var py = y + (i%2===0? -4:4);
      g += '<g transform="translate('+px+','+py+')">' +
        '<ellipse cx="0" cy="8" rx="12" ry="6" fill="#2a2230"/>' +
        '<circle cx="6" cy="0" r="6" fill="#2a2230"/>' +
        '<path d="M4,-6 L10,-14" stroke="#2a2230" stroke-width="2.5"/>' +
        '</g>';
    }
    return '<g>'+g+'</g>';
  }
  function sceneCaveDoor(){

      skyNight() + duneGround('#4a3d2c') + rockCliff() + caveDoor(true) +

      jarShape(480,240,0.8) + jarShape(120,235,0.7) +

    );

  function sceneKassim(){
    return svgWrap(
      skyDay() + duneGround('#e8c27a') +
      donkey(90,260,0.9) + donkey(140,265,0.9) + donkey(190,260,0.9) +
      donkey(240,265,0.9) + donkey(290,260,0.9) +
      person(230,250,1.2,'#3a5f8a')
    );

  function sceneKassimTrapped(){
    return svgWrap(
      '<rect width="600" height="320" fill="#1c130d"/>' +
      '<ellipse cx="300" cy="330" rx="380" ry="80" fill="#2c2014"/>' +
      coinPile(180,270,0.9) + coinPile(400,270,0.9) +
      person(300,255,1.2,'#3a5f8a') +
      '<text x="300" y="190" text-anchor="middle" font-size="26" fill="#f0c14b">?!</text>' +

  function houseRow(count, markedIndex){
    var g='';
    var startX = 60, gap = 480/(count-1);
    for(var i=0;i<count;i++){
      var x = startX + i*gap;
      g += '<g transform="translate('+x+',150)">' +
        '<rect x="-34" y="0" width="68" height="90" fill="#caa15f" stroke="#7a5a37" stroke-width="2"/>' +
        '<path d="M-40,0 L0,-32 L40,0 Z" fill="#8a5a3a"/>' +
        '<rect x="-10" y="45" width="20" height="45" fill="#5a3d24"/>' +
        (markedIndex!==null ? '<g stroke="#c94b3a" stroke-width="4" opacity="0.9"><line x1="-14" y1="20" x2="14" y2="40"/><line x1="14" y1="20" x2="-14" y2="40"/></g>' : '') +
        '</g>';
    }
    return g;
  }
  function sceneMarjanahMark(){
    return svgWrap(
      skyDay() + duneGround('#d8b06a') +
      houseRow(5,-1) +
      person(300,290,1,'#2a7a5a')
    );
  }
  function sceneOilJars(){
    var jars='';
    var xs=[110,190,270,350,430,510];
    for(var i=0;i<xs.length;i++){
      jars += jarShape(xs[i],240,1,false);
    }
    return svgWrap(
      skyNight() + duneGround('#4a3d2c') +
      jars +
      person(300,290,1,'#2a7a5a')
    );
  }
  function sceneEnding(){
    return svgWrap(
      skyDay() +
      duneGround('#e8c27a') +
      '<rect x="150" y="120" width="300" height="140" fill="#caa15f" stroke="#7a5a37" stroke-width="3"/>' +
      '<path d="M140,120 L300,50 L460,120 Z" fill="#8a5a3a"/>' +
      person(220,255,1,'#8a3b2b') +
      person(280,255,1,'#3a5f8a') +
      person(340,255,1,'#2a7a5a') +
      '<text x="300" y="40" text-anchor="middle" font-size="26">🎉</text>'
    );
  }

  /* ---------- QTE: password (multiple choice) ---------- */
  function renderQTE(stage){
    var qteBox = document.getElementById('ab-qte');
    var prompt = document.getElementById('ab-qte-prompt');
    var opts = document.getElementById('ab-qte-options');
    var feedback = document.getElementById('ab-qte-feedback');
    var nextBtn = document.getElementById('ab-next-btn');
    opts.innerHTML = '';
    feedback.textContent = '';
    qteBox.style.display = 'block';
    nextBtn.disabled = true;

    var solved = state.qteSolved[stage.id];
    prompt.textContent = stage.qte.prompt[state.lang];

    if(stage.qte.options){
      // multiple choice password
      var options = stage.qte.options.slice();
      options.forEach(function(opt){
        var btn = document.createElement('button');
        btn.className = 'ab-qte-opt';
        btn.textContent = opt[state.lang];
        if(solved){
          btn.disabled = true;
          if(opt.correct) btn.classList.add('ab-correct');
        }
        btn.addEventListener('click', function(o, el){
          return function(){
            if(state.qteSolved[stage.id]) return;
            if(o.correct){
              el.classList.add('ab-correct');
              state.qteSolved[stage.id] = true;
              feedback.textContent = state.lang==='en' ? 'Correct!' : 'Benar!';
              disableAllOpts();
              nextBtn.disabled = false;
              speak(stage.qte.successText[state.lang]);
              appendNarration(stage.qte.successText[state.lang]);
            } else {
              el.classList.add('ab-wrong');
              feedback.textContent = state.lang==='en' ? 'Try again...' : 'Coba lagi...';
              setTimeout(function(){ el.classList.remove('ab-wrong'); }, 400);
            }
          };
        }(opt, btn));
        opts.appendChild(btn);
      });
    } else if(stage.qte.type === 'find-odd'){
      var n = stage.qte.houseCount;
      var correctIdx = Math.floor(Math.random()*n);
      for(var i=0;i<n;i++){
        (function(idx){
          var btn = document.createElement('button');
          btn.className = 'ab-qte-opt';
          btn.textContent = '🚪 ' + (state.lang==='en'?'Door ':'Pintu ') + (idx+1);
          if(solved){ btn.disabled = true; if(idx===correctIdx) btn.classList.add('ab-correct'); }
          btn.addEventListener('click', function(){
            if(state.qteSolved[stage.id]) return;
            btn.classList.add('ab-correct');
            state.qteSolved[stage.id] = true;
            feedback.textContent = state.lang==='en' ? 'Marked!' : 'Ditandai!';
            disableAllOpts();
            document.getElementById('ab-next-btn').disabled = false;
            appendNarration(stage.qte.successText[state.lang]);
            renderScene(stage, true);
          });
          opts.appendChild(btn);
        })(i);
      }
      opts.style.gridTemplateColumns = 'repeat(3,1fr)';
    } else if(stage.qte.type === 'find-jar'){
      var jn = stage.qte.jarCount;
      var correctJar = Math.floor(Math.random()*jn);
      for(var j=0;j<jn;j++){
        (function(idx){
          var btn = document.createElement('button');
          btn.className = 'ab-qte-opt';
          btn.textContent = '🏺 ' + (state.lang==='en'?'Jar ':'Tong ') + (idx+1);
          if(solved){ btn.disabled = true; if(idx===correctJar) btn.classList.add('ab-correct'); }
          btn.addEventListener('click', function(){
            if(state.qteSolved[stage.id]) return;
            if(idx === correctJar){
              btn.classList.add('ab-correct');
              state.qteSolved[stage.id] = true;
              feedback.textContent = state.lang==='en' ? 'Found it!' : 'Ketemu!';
              disableAllOpts();
              document.getElementById('ab-next-btn').disabled = false;
              appendNarration(stage.qte.successText[state.lang]);
            } else {
              btn.classList.add('ab-wrong');
              feedback.textContent = state.lang==='en' ? 'Not this one...' : 'Bukan yang ini...';
              setTimeout(function(){ btn.classList.remove('ab-wrong'); }, 400);
            }
          });
          opts.appendChild(btn);
        })(j);
      }
      opts.style.gridTemplateColumns = 'repeat(3,1fr)';
    }

    function disableAllOpts(){
      var all = opts.querySelectorAll('.ab-qte-opt');
      all.forEach(function(b){ b.disabled = true; });
    }
  }

  function appendNarration(text){
    var box = document.getElementById('ab-narration-box');
    box.innerHTML += '<br><em>' + escapeHtml(text) + '</em>';
    reportHeight();
  }
  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- rendering ---------- */
  function renderDots(){
    var dotsEl = document.getElementById('ab-dots');
    dotsEl.innerHTML = '';
    STAGES.forEach(function(s, i){
      var dot = document.createElement('div');
      dot.className = 'ab-dot' + (i < state.stage ? ' ab-done' : '') + (i === state.stage ? ' ab-current' : '');
      dotsEl.appendChild(dot);
    });
  }

  function renderScene(stage){
    var sceneEl = document.getElementById('ab-scene');
    sceneEl.innerHTML = stage.scene();
  }

  function renderStage(){
    var stage = STAGES[state.stage];
    document.getElementById('ab-title-text').textContent = stage.title[state.lang];
    renderDots();
    renderScene(stage);
    document.getElementById('ab-narration-box').textContent = stage.text[state.lang];

    var nextBtn = document.getElementById('ab-next-btn');
    var isLast = state.stage === STAGES.length - 1;
    nextBtn.textContent = isLast
      ? (state.lang==='en' ? '↺ Restart Story' : '↺ Ulangi Cerita')
      : (state.lang==='en' ? 'Next ▶' : 'Lanjut ▶');

    if(stage.qte){
      renderQTE(stage);
      nextBtn.disabled = !state.qteSolved[stage.id];
    } else {
      document.getElementById('ab-qte').style.display = 'none';
      nextBtn.disabled = false;
    }

    document.getElementById('ab-end-badge').style.display = isLast ? 'block' : 'none';

    speak(stage.text[state.lang]);
    reportHeight();
  }

  function goNext(){
    var isLast = state.stage === STAGES.length - 1;
    if(isLast){
      state.stage = 0;
      state.qteSolved = {};
      renderStage();
      return;
    }
    state.stage++;
    renderStage();
  }

  /* ---------- controls ---------- */
  function updateMuteBtn(){
    document.getElementById('ab-mute-btn').textContent = state.muted ? '🔇' : '🔊';
  }
  function updateLangBtn(){
    document.getElementById('ab-lang-btn').textContent = state.lang === 'id' ? 'EN' : 'ID';
  }
  function updateStartTexts(){
    document.getElementById('ab-start-title').textContent = state.lang==='en'
      ? 'Alibaba and the Forty Thieves'
      : 'Alibaba dan Empat Puluh Pencuri';
    document.getElementById('ab-start-desc').textContent = state.lang==='en'
      ? 'A Persian (Iranian) folktale — follow Alibaba, the magic password, and clever Marjanah who saves her family.'
      : 'Dongeng rakyat dari Persia (Iran) — ikuti kisah Alibaba, kata sandi ajaib, dan Marjanah yang cerdik menyelamatkan keluarganya.';
    document.getElementById('ab-start-btn-label').textContent = state.lang==='en' ? 'Start Story' : 'Mulai Cerita';
  }

  document.getElementById('ab-mute-btn').addEventListener('click', function(){
    state.muted = !state.muted;
    localStorage.setItem('alibabaMuted', state.muted ? '1' : '0');
    updateMuteBtn();
    if(state.muted) stopSpeak();
  });

  document.getElementById('ab-lang-btn').addEventListener('click', function(){
    state.lang = state.lang === 'id' ? 'en' : 'id';
    updateLangBtn();
    updateStartTexts();
    if(state.started) renderStage();
  });

  document.getElementById('ab-start-lang-id').addEventListener('click', function(){ state.lang='id'; updateLangBtn(); updateStartTexts(); });
  document.getElementById('ab-start-lang-en').addEventListener('click', function(){ state.lang='en'; updateLangBtn(); updateStartTexts(); });

  document.getElementById('ab-start-btn').addEventListener('click', function(){
    state.started = true;
    document.getElementById('ab-start-overlay').style.display = 'none';
    renderStage();
  });

  document.getElementById('ab-next-btn').addEventListener('click', goNext);

  /* ---------- resize (postMessage for iframe) ---------- */
  function reportHeight(){
    try{
      var h = document.getElementById('ab-root').scrollHeight;
      window.parent.postMessage({ type:'alibabaGameHeight', height:h }, '*');
    }catch(e){}
  }
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  setInterval(reportHeight, 1200);

  /* ---------- init ---------- */
  updateMuteBtn();
  updateLangBtn();
  updateStartTexts();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Si Kepala Tebal - Dongeng Anak Kanada</title>
<style>
  :root{
    --skt-bg1:#1b2a3a;
    --skt-bg2:#3a5a40;
    --skt-cream:#fdf6e3;
    --skt-wood:#7a4a2b;
    --skt-wood-dark:#5c3720;
    --skt-accent:#e0a84e;
    --skt-accent2:#c96f3f;
    --skt-text:#2b2118;
    --skt-white:#ffffff;
    --skt-shadow:rgba(0,0,0,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    background:linear-gradient(180deg,var(--skt-bg1),var(--skt-bg2));
    display:flex;
    justify-content:center;
    padding:10px;
  }
  .skt-wrap{
    width:100%;
    max-width:720px;
    background:var(--skt-cream);
    border-radius:18px;
    box-shadow:0 10px 30px var(--skt-shadow);
    overflow:hidden;
    border:6px solid var(--skt-wood);
  }
  .skt-header{
    background:var(--skt-wood-dark);
    color:var(--skt-cream);
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .skt-title{
    font-size:16px;
    font-weight:bold;
    letter-spacing:0.5px;
  }
  .skt-controls{
    display:flex;
    gap:6px;
  }
  .skt-btn-icon{
    background:var(--skt-wood);
    color:var(--skt-cream);
    border:2px solid var(--skt-accent);
    border-radius:8px;
    width:36px;
    height:32px;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease, background .15s ease;
  }
  .skt-btn-icon:hover{background:var(--skt-accent2); transform:translateY(-1px);}
  .skt-btn-icon:active{transform:translateY(0);}
  .skt-lang-btn{
    font-size:12px;
    font-weight:bold;
    width:auto;
    padding:0 8px;
  }
  .skt-stage{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:linear-gradient(180deg,#bfe3f2 0%,#e8f6d9 55%, #cdeab0 56%, #a9d68c 100%);
    overflow:hidden;
  }
  .skt-stage canvas{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    display:block;
  }
  .skt-caption-box{
    position:absolute;
    left:0; right:0; bottom:0;
    background:linear-gradient(180deg, rgba(43,33,24,0) 0%, rgba(43,33,24,0.88) 30%, rgba(43,33,24,0.92) 100%);
    color:var(--skt-white);
    padding:34px 16px 14px 16px;
    font-size:14.5px;
    line-height:1.5;
    min-height:70px;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
    pointer-events:none;
  }
  .skt-choice-row{
    position:absolute;
    left:0;right:0;
    bottom:10px;
    display:flex;
    justify-content:center;
    gap:10px;
    padding:0 12px;
    flex-wrap:wrap;
  }
  .skt-action-btn{
    background:linear-gradient(180deg,var(--skt-accent),var(--skt-accent2));
    color:var(--skt-text);
    border:none;
    border-radius:24px;
    padding:10px 20px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 #8f4f26, 0 6px 10px rgba(0,0,0,0.3);
    transition:transform .1s ease;
  }
  .skt-action-btn:hover{filter:brightness(1.05);}
  .skt-action-btn:active{transform:translateY(3px); box-shadow:0 0 0 #8f4f26;}
  .skt-action-btn.skt-secondary{
    background:linear-gradient(180deg,#eee,#ccc);
  }
  .skt-footer-bar{
    background:var(--skt-wood-dark);
    padding:10px 14px 12px 14px;
  }
  .skt-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:8px;
  }
  .skt-dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(255,255,255,0.3);
    transition:background .25s ease, transform .25s ease;
  }
  .skt-dot.skt-active{background:var(--skt-accent); transform:scale(1.3);}
  .skt-dot.skt-done{background:#9bc27c;}
  .skt-credit{
    text-align:center;
    color:rgba(255,255,255,0.55);
    font-size:10.5px;
    letter-spacing:0.3px;
  }
  .skt-credit a{color:rgba(255,255,255,0.75); text-decoration:none;}
  .skt-hint{
    position:absolute;
    top:10px; left:0; right:0;
    text-align:center;
    color:var(--skt-text);
    font-size:12.5px;
    font-weight:bold;
    background:rgba(255,255,255,0.55);
    margin:0 auto;
    width:fit-content;
    padding:4px 12px;
    border-radius:14px;
    pointer-events:none;
  }
  .skt-progress-track{
    position:absolute;
    top:34px; left:16px; right:16px;
    height:10px;
    background:rgba(0,0,0,0.2);
    border-radius:6px;
    overflow:hidden;
    pointer-events:none;
  }
  .skt-progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#e0a84e,#c96f3f);
    transition:width .15s ease;
  }
  @media (max-width:420px){
    .skt-title{font-size:13px;}
    .skt-caption-box{font-size:13px; padding:28px 12px 12px 12px;}
    .skt-action-btn{padding:8px 16px; font-size:13px;}
  }
</style>
</head>
<body>
<div class="skt-wrap" id="sktWrap">

  <div class="skt-header">
    <div class="skt-title" id="sktTitle">Si Kepala Tebal</div>
    <div class="skt-controls">
      <button class="skt-btn-icon skt-lang-btn" id="sktLangBtn" title="Change language">EN</button>
      <button class="skt-btn-icon" id="sktMuteBtn" title="Mute/Unmute">🔊</button>
    </div>
  </div>

  <div class="skt-stage" id="sktStage">
    <canvas id="sktCanvas"></canvas>
    <div class="skt-hint" id="sktHint" style="display:none;"></div>
    <div class="skt-progress-track" id="sktProgressTrack" style="display:none;">
      <div class="skt-progress-fill" id="sktProgressFill"></div>
    </div>
    <div class="skt-caption-box" id="sktCaption"></div>
    <div class="skt-choice-row" id="sktChoiceRow"></div>
  </div>

  <div class="skt-footer-bar">
    <div class="skt-dots" id="sktDots"></div>
    <div class="skt-credit">&copy; <a href="https://caritasato.blogspot.com" target="_blank" rel="noopener">caritasato.blogspot.com</a></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     LANGUAGE + TEXT CONTENT
  --------------------------------------------------------- */
  var urlParams = new URLSearchParams(window.location.search);
  var lang = urlParams.get('lang') === 'en' ? 'en' : 'id';

  var TXT = {
    id: {
      pageTitle: "Si Kepala Tebal",
      muteOn: "🔊", muteOff: "🔇",
      langLabel: "EN",
      startBtn: "▶ Mulai Cerita",
      replayBtn: "↺ Ulangi Cerita",
      nextBtn: "Lanjutkan →",
      shootBtn: "🎯 Tembak!",
      digBtn: "👆 Gali Cacing",
      tradeBtn: "Ambil Bebek",
      drumBtn: "🥁 Pukul Gendang",
      hintDig: "Ketuk cacing berkali-kali secepat mungkin!",
      hintFox: "Ketuk rubah saat masuk area target!",
      hintWolf: "Ketuk serigala saat masuk area target, lebih cepat!",
      hintDrum: "Ketuk gendang mengikuti pola berkedip!",
      stages: [
        {
          cap: "Di sebuah desa di Kanada, hiduplah seorang ibu miskin bersama tiga anak laki-lakinya. Dua kakak sangat pandai berburu, sementara si bungsu sangat bodoh sehingga dijuluki 'Si Kepala Tebal' oleh penduduk desa."
        },
        {
          cap: "Musim berburu tiba. Kedua kakak enggan mengajak Si Kepala Tebal, tetapi sang ibu membujuk mereka. Dengan terpaksa, mereka membawa adik bungsunya ke hutan."
        },
        {
          cap: "Sepulang berburu, kedua kakak membawa rusa hasil buruan. Si Kepala Tebal hanya membawa seekor cacing tanah. Ia mengikatnya dengan tali dan menjadikannya mainan."
        },
        {
          cap: "Tiba-tiba seekor bebek datang dan memakan cacing itu dalam sekejap! Si Kepala Tebal marah dan mendatangi pemilik bebek untuk meminta cacingnya kembali."
        },
        {
          cap: "\"Bebek itu sudah memakan cacingmu, tidak bisa dikembalikan. Sebagai gantinya, ambillah bebek ini,\" kata si pemilik. Si Kepala Tebal pun gembira mendapatkan seekor bebek."
        },
        {
          cap: "Bebek itu diikat di luar rumah. Namun terdengar suara ribut — seekor rubah datang dan memakan bebek itu! Si Kepala Tebal segera mengambil senapan."
        },
        {
          cap: "Rubah bergerak lincah kesana-kemari. Bidik dan tembak rubah itu sebelum ia kabur!"
        },
        {
          cap: "Rubah berhasil ditembak. Si Kepala Tebal meninggalkannya di luar rumah. Tak lama, terdengar suara aneh lagi — seekor serigala datang memakan rubah itu!"
        },
        {
          cap: "Serigala bergerak lebih cepat dari rubah. Bidik dan tembak sebelum ia menghabiskan buruannya!"
        },
        {
          cap: "\"Aku sangat beruntung, hari ini mendapatkan cacing, bebek, rubah, dan serigala sekaligus!\" kata Si Kepala Tebal dengan gembira."
        },
        {
          cap: "Keesokan harinya, ia menguliti kulit serigala dan membuatnya menjadi gendang — gendang pertama di desanya. Pukul gendang mengikuti pola yang berkedip!"
        },
        {
          cap: "Suara gendang yang riang membuat kepala suku desa tertarik dan meminjamnya untuk memanggil penduduk desa."
        },
        {
          cap: "Kepala suku memukul gendang terlalu keras hingga robek dan rusak. Si Kepala Tebal merasa kecewa."
        },
        {
          cap: "Sebagai ganti gendang yang rusak, kepala suku menjanjikan putrinya untuk dinikahi Si Kepala Tebal kelak saat sudah dewasa. Demikianlah dongeng Si Kepala Tebal dari Kanada."
        }
      ],
      end: "— TAMAT —"
    },
    en: {
      pageTitle: "Thickhead",
      muteOn: "🔊", muteOff: "🔇",
      langLabel: "ID",
      startBtn: "▶ Start Story",
      replayBtn: "↺ Replay Story",
      nextBtn: "Continue →",
      shootBtn: "🎯 Shoot!",
      digBtn: "👆 Dig Worm",
      tradeBtn: "Take the Duck",
      drumBtn: "🥁 Beat the Drum",
      hintDig: "Tap the worm as many times as you can!",
      hintFox: "Tap the fox when it enters the target zone!",
      hintWolf: "Tap the wolf when it enters the target zone, faster!",
      hintDrum: "Tap the drum following the blinking pattern!",
      stages: [
        {
          cap: "In a village in Canada, a poor mother lived with her three sons. Two elder brothers were skilled hunters, while the youngest was so foolish that villagers nicknamed him 'Thickhead'."
        },
        {
          cap: "Hunting season arrived. The brothers refused to bring Thickhead along, but their mother convinced them. Reluctantly, they took their little brother into the forest."
        },
        {
          cap: "On the way home, the brothers carried a deer they had caught. Thickhead brought back only an earthworm. He tied it with a string and made it his toy."
        },
        {
          cap: "Suddenly a duck appeared and swallowed the worm in an instant! Furious, Thickhead marched to the duck's owner demanding his worm back."
        },
        {
          cap: "\"The duck already ate your worm, it cannot be returned. Take this duck instead,\" said the owner. Thickhead was overjoyed to now own a duck."
        },
        {
          cap: "He tied the duck outside his house. But he heard a commotion — a fox had come and eaten the duck! Thickhead quickly grabbed his rifle."
        },
        {
          cap: "The fox darted around swiftly. Aim and shoot it before it escapes!"
        },
        {
          cap: "The fox was shot down. Thickhead left it outside. Soon, strange noises returned — a wolf had come to devour the fox!"
        },
        {
          cap: "The wolf moves even faster than the fox. Aim and shoot before it finishes its meal!"
        },
        {
          cap: "\"What a lucky day — I got a worm, a duck, a fox, and a wolf all in one go!\" Thickhead exclaimed happily."
        },
        {
          cap: "The next day, he skinned the wolf and made it into a drum — the very first drum in his village. Beat the drum following the blinking pattern!"
        },
        {
          cap: "The joyful sound of the drum caught the village chief's attention, who borrowed it to summon the villagers."
        },
        {
          cap: "The chief struck the drum far too hard, tearing it apart and ruining it. Thickhead felt disappointed."
        },
        {
          cap: "As compensation for the broken drum, the chief promised his own daughter's hand in marriage to Thickhead once he grew up. And so ends the Canadian tale of Thickhead."
        }
      ],
      end: "— THE END —"
    }
  };

  /* ---------------------------------------------------------
     DOM REFS
  --------------------------------------------------------- */
  var canvas = document.getElementById('sktCanvas');
  var ctx = canvas.getContext('2d');
  var stageEl = document.getElementById('sktStage');
  var captionEl = document.getElementById('sktCaption');
  var choiceRow = document.getElementById('sktChoiceRow');
  var dotsEl = document.getElementById('sktDots');
  var hintEl = document.getElementById('sktHint');
  var progressTrack = document.getElementById('sktProgressTrack');
  var progressFill = document.getElementById('sktProgressFill');
  var muteBtn = document.getElementById('sktMuteBtn');
  var langBtn = document.getElementById('sktLangBtn');
  var titleEl = document.getElementById('sktTitle');

  /* ---------------------------------------------------------
     STATE
  --------------------------------------------------------- */
  var muted = localStorage.getItem('skt_muted') === '1';
  var storyIndex = -1; // -1 = intro screen
  var TOTAL_STORY = TXT.id.stages.length;
  // dots represent key milestones (not every micro-caption)
  var DOT_STAGES = [0,1,3,5,7,10,13]; // indices into stages[] that map to a dot
  var currentDot = 0;

  var W = 0, H = 0, DPR = 1;

  function resizeCanvas(){
    var rect = stageEl.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawScene();
    sendResize();
  }

  function sendResize(){
    var h = document.getElementById('sktWrap').offsetHeight;
    try{
      window.parent.postMessage({ sktGameResize: true, height: h }, '*');
    }catch(e){}
  }

  window.addEventListener('resize', resizeCanvas);

  /* ---------------------------------------------------------
     SPEECH (Web Speech API)
  --------------------------------------------------------- */
  var voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(langCode){
    if (!voices || !voices.length) return null;
    var exact = voices.find(function(v){ return v.lang && v.lang.toLowerCase() === langCode.toLowerCase(); });
    if (exact) return exact;
    var partial = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(langCode.split('-')[0]) === 0; });
    return partial || null;
  }

  function speak(text){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (muted) return;
    var u = new SpeechSynthesisUtterance(text);
    var langCode = lang === 'id' ? 'id-ID' : 'en-US';
    u.lang = langCode;
    var v = pickVoice(langCode);
    if (v) u.voice = v;
    u.rate = 0.95;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }

  function stopSpeak(){
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  /* ---------------------------------------------------------
     UI: MUTE / LANG TOGGLES
  --------------------------------------------------------- */
  function updateMuteBtn(){
    muteBtn.textContent = muted ? TXT[lang].muteOff : TXT[lang].muteOn;
  }
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    localStorage.setItem('skt_muted', muted ? '1':'0');
    updateMuteBtn();
    if (muted) stopSpeak();
  });

  langBtn.addEventListener('click', function(){
    lang = lang === 'id' ? 'en' : 'id';
    langBtn.textContent = TXT[lang].langLabel;
    titleEl.textContent = TXT[lang].pageTitle;
    updateMuteBtn();
    renderCurrentScreen(true);
  });

  /* ---------------------------------------------------------
     PROGRESS DOTS
  --------------------------------------------------------- */
  function buildDots(){
    dotsEl.innerHTML = '';
    for (var i=0;i<DOT_STAGES.length;i++){
      var d = document.createElement('div');
      d.className = 'skt-dot';
      dotsEl.appendChild(d);
    }
  }
  function updateDots(){
    var dots = dotsEl.querySelectorAll('.skt-dot');
    // find how many DOT_STAGES thresholds passed
    var passed = 0;
    for (var i=0;i<DOT_STAGES.length;i++){
      if (storyIndex >= DOT_STAGES[i]) passed = i+1;
    }
    dots.forEach(function(dot, idx){
      dot.classList.remove('skt-active','skt-done');
      if (idx < passed-1) dot.classList.add('skt-done');
      else if (idx === passed-1) dot.classList.add('skt-active');
    });
  }

  /* ---------------------------------------------------------
     DRAWING HELPERS (procedural canvas art)
  --------------------------------------------------------- */
  function clear(){
    ctx.clearRect(0,0,W,H);
  }
  function skyGround(groundColor){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#bfe3f2');
    g.addColorStop(0.55,'#e8f6d9');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H*0.62);
    ctx.fillStyle = groundColor || '#9bc27c';
    ctx.fillRect(0,H*0.6,W,H*0.4);
  }
  function drawSun(x,y,r){
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  function drawTree(x,y,scale){
    scale = scale||1;
    ctx.fillStyle = '#7a4a2b';
    ctx.fillRect(x-6*scale, y-10*scale, 12*scale, 40*scale);
    ctx.fillStyle = '#4c7a3f';
    ctx.beginPath();
    ctx.arc(x, y-30*scale, 26*scale, 0, Math.PI*2);
    ctx.arc(x-18*scale, y-14*scale, 20*scale, 0, Math.PI*2);
    ctx.arc(x+18*scale, y-14*scale, 20*scale, 0, Math.PI*2);
    ctx.fill();
  }
  function drawHut(x,y,scale){
    scale = scale||1;
    ctx.fillStyle = '#c9a26a';
    ctx.fillRect(x-35*scale,y-30*scale,70*scale,40*scale);
    ctx.fillStyle = '#8a4b2b';
    ctx.beginPath();
    ctx.moveTo(x-45*scale,y-30*scale);
    ctx.lineTo(x,y-65*scale);
    ctx.lineTo(x+45*scale,y-30*scale);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5c3720';
    ctx.fillRect(x-8*scale,y-10*scale,16*scale,20*scale);
  }
  function drawPerson(x,y,scale,skin,shirt,thick){
    scale = scale||1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // legs
    ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-6,10); ctx.lineTo(-8,32); ctx.moveTo(6,10); ctx.lineTo(8,32); ctx.stroke();
    // body
    ctx.fillStyle = shirt || '#c96f3f';
    ctx.beginPath();
    ctx.moveTo(-12,10); ctx.lineTo(12,10); ctx.lineTo(9,-16); ctx.lineTo(-9,-16);
    ctx.closePath(); ctx.fill();
    // arms
    ctx.strokeStyle = shirt || '#c96f3f'; ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-9,-10); ctx.lineTo(-18,4); ctx.moveTo(9,-10); ctx.lineTo(18,4); ctx.stroke();
    // head
    ctx.fillStyle = skin || '#e8b98a';
    ctx.beginPath(); ctx.arc(0,-26, thick?12:10, 0, Math.PI*2); ctx.fill();
    // hair
    ctx.fillStyle = '#3b2a1a';
    ctx.beginPath(); ctx.arc(0,-30, thick?13:11, Math.PI, Math.PI*2); ctx.fill();
    if (thick){
      // big head detail = thickhead character marker
      ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(-4,-25,1.6,0,Math.PI*2); ctx.arc(4,-25,1.6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-20,3,0,Math.PI); ctx.stroke();
    } else {
      ctx.fillStyle = '#2b2118';
      ctx.beginPath(); ctx.arc(-3,-26,1.2,0,Math.PI*2); ctx.arc(3,-26,1.2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  function drawWorm(x,y,scale,wiggle){
    scale = scale||1;
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle = '#c96f7a';
    ctx.lineWidth = 6*scale;
    ctx.lineCap='round';
    ctx.beginPath();
    var w = wiggle||0;
    ctx.moveTo(-14*scale, 0);
    ctx.quadraticCurveTo(-4*scale, -8*scale*Math.sin(w), 6*scale, 0);
    ctx.quadraticCurveTo(14*scale, 6*scale*Math.sin(w+1), 22*scale, -2*scale);
    ctx.stroke();
    ctx.restore();
  }
  function drawDuck(x,y,scale){
    scale = scale||1;
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = '#f5f0e6';
    ctx.beginPath(); ctx.ellipse(0,0,20,14,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(16,-10,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e0a84e';
    ctx.beginPath(); ctx.moveTo(24,-10); ctx.lineTo(34,-8); ctx.lineTo(24,-6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2b2118';
    ctx.beginPath(); ctx.arc(19,-12,1.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawDeer(x,y,scale){
    scale = scale||1;
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = '#a9744a';
    ctx.beginPath(); ctx.ellipse(0,0,26,14,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(24,-14,10,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5c3720'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(20,-22); ctx.lineTo(14,-32); ctx.moveTo(28,-22); ctx.lineTo(34,-32); ctx.stroke();
    ctx.strokeStyle = '#5c3720'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(-14,10); ctx.lineTo(-16,26); ctx.moveTo(10,10); ctx.lineTo(12,26); ctx.stroke();
    ctx.restore();
  }
  function drawFox(x,y,scale){
    scale = scale||1;
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = '#e0713e';
    ctx.beginPath(); ctx.ellipse(0,0,22,12,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(20,-8,9,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(25,-14); ctx.lineTo(34,-10); ctx.lineTo(25,-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(27,-8,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-20,4,10,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b2118'; ctx.beginPath(); ctx.arc(23,-11,1.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawWolf(x,y,scale){
    scale = scale||1;
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = '#7a7a82';
    ctx.beginPath(); ctx.ellipse(0,0,26,13,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(23,-9,10,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(28,-16); ctx.lineTo(37,-13); ctx.lineTo(28,-6); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(16,-16); ctx.lineTo(9,-13); ctx.lineTo(16,-6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(26,-9,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b2118'; ctx.beginPath(); ctx.arc(26,-9,1.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawDrum(x,y,scale,hit){
    scale = scale||1;
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
    if (hit){ ctx.save(); ctx.translate(0,-2); }
    ctx.fillStyle = '#c96f3f';
    ctx.fillRect(-30,-10,60,40);
    ctx.fillStyle = hit ? '#fff3d6' : '#e8d3a8';
    ctx.beginPath(); ctx.ellipse(0,-10,30,10,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5c3720'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(0,-10,30,10,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#5c3720'; ctx.lineWidth=2;
    for (var i=-24;i<=24;i+=12){
      ctx.beginPath(); ctx.moveTo(i,-16); ctx.lineTo(i,26); ctx.stroke();
    }
    if (hit) ctx.restore();
    ctx.restore();
  }
  function drawChief(x,y,scale){
    scale = scale||1;
    drawPerson(x,y,scale,'#c98a55','#4c7a3f',false);
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = '#e0a84e';
    ctx.beginPath(); ctx.moveTo(-10,-36); ctx.lineTo(0,-46); ctx.lineTo(10,-36); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawPrincess(x,y,scale){
    scale = scale||1;
    drawPerson(x,y,scale,'#e8b98a','#c96f9a',false);
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = '#e0a84e';
    ctx.beginPath(); ctx.arc(0,-38,6,0,Math.PI); ctx.fill();
    ctx.restore();
  }
  function drawHeart(x,y,s){
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    ctx.fillStyle = '#e0483e';
    ctx.beginPath();
    ctx.moveTo(0,4);
    ctx.bezierCurveTo(-10,-6,-20,2,0,14);
    ctx.bezierCurveTo(20,2,10,-6,0,4);
    ctx.fill();
    ctx.restore();
  }

  /* ---------------------------------------------------------
     SCENE ANIMATION LOOP CONTROL
  --------------------------------------------------------- */
  var rafId = null;
  var animState = {};

  function stopAnim(){
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  /* ---------------------------------------------------------
     GAME FLOW
  --------------------------------------------------------- */
  function setCaption(text){
    captionEl.textContent = text;
  }
  function clearChoices(){
    choiceRow.innerHTML = '';
  }
  function addBtn(label, onClick, secondary){
    var b = document.createElement('button');
    b.className = 'skt-action-btn' + (secondary ? ' skt-secondary':'');
    b.textContent = label;
    b.addEventListener('click', onClick);
    choiceRow.appendChild(b);
    return b;
  }
  function showHint(text){
    hintEl.textContent = text;
    hintEl.style.display = text ? 'block':'none';
  }
  function showProgress(show){
    progressTrack.style.display = show ? 'block':'none';
    progressFill.style.width = '0%';
  }

  function renderCurrentScreen(skipSpeak){
    stopAnim();
    clearChoices();
    showHint('');
    showProgress(false);

    if (storyIndex === -1){
      drawIntroScene();
      setCaption('');
      addBtn(TXT[lang].startBtn, function(){ goToStory(0); });
      return;
    }
    if (storyIndex >= TOTAL_STORY){
      drawEndingScene();
      setCaption(TXT[lang].end);
      addBtn(TXT[lang].replayBtn, function(){ restart(); });
      if (!skipSpeak) speak(TXT[lang].end);
      updateDots();
      return;
    }

    var stageData = TXT[lang].stages[storyIndex];
    setCaption(stageData.cap);
    updateDots();

    switch(storyIndex){
      case 0: drawFamilyScene(); addAutoNext(); break;
      case 1: drawHuntSetoutScene(); addAutoNext(); break;
      case 2: drawWormPlayScene(); startDigMinigame(); break;
      case 3: drawDuckEatsWormScene(); addAutoNext(); break;
      case 4: drawTradeScene(); addBtn(TXT[lang].tradeBtn, function(){ goToStory(storyIndex+1); }); break;
      case 5: drawFoxEatsDuckScene(); addAutoNext(); break;
      case 6: drawFoxHuntBackground(); startChaseMinigame('fox'); break;
      case 7: drawWolfEatsFoxScene(); addAutoNext(); break;
      case 8: drawFoxHuntBackground(); startChaseMinigame('wolf'); break;
      case 9: drawHappyScene(); addAutoNext(); break;
      case 10: drawDrumMakingStatic(); startDrumMinigame(); break;
      case 11: drawChiefBorrowScene(); addAutoNext(); break;
      case 12: drawDrumBreakScene(); addAutoNext(); break;
      case 13: drawWeddingPromiseScene(); addBtn(TXT[lang].nextBtn, function(){ goToStory(storyIndex+1); }); break;
      default: drawIntroScene();
    }

    if (!skipSpeak) speak(stageData.cap);
  }

  function addAutoNext(){
    addBtn(TXT[lang].nextBtn, function(){ goToStory(storyIndex+1); });
  }

  function goToStory(idx){
    storyIndex = idx;
    renderCurrentScreen(false);
  }

  function restart(){
    storyIndex = -1;
    renderCurrentScreen(false);
  }

  /* ---------------------------------------------------------
     STATIC / NARRATIVE SCENES
  --------------------------------------------------------- */
  function drawIntroScene(){
    clear();
    skyGround('#a9d68c');
    drawSun(W*0.85,H*0.15,26);
    drawTree(W*0.12,H*0.62,1);
    drawTree(W*0.9,H*0.6,0.8);
    drawHut(W*0.5,H*0.66,1.1);
    drawPerson(W*0.5,H*0.82,1.3,'#e8b98a','#c96f3f',true);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 22px Trebuchet MS';
    ctx.textAlign = 'center';
    ctx.fillText(TXT[lang].pageTitle, W/2, H*0.28);
    ctx.font = '13px Trebuchet MS';
    ctx.fillText(lang==='id' ? 'Dongeng Anak Kanada' : 'A Canadian Folktale', W/2, H*0.34);
  }

  function drawFamilyScene(){
    clear(); skyGround('#a9d68c');
    drawSun(W*0.12,H*0.14,22);
    drawHut(W*0.5,H*0.66,1);
    drawPerson(W*0.32,H*0.82,1.05,'#e8b98a','#4c7a3f',false);
    drawPerson(W*0.5,H*0.82,1.05,'#e8b98a','#5c8a4a',false);
    drawPerson(W*0.68,H*0.82,1.15,'#e8b98a','#c96f3f',true);
    drawPerson(W*0.5,H*0.68,0.95,'#d8a878','#c96f9a',false); // mother
  }

  function drawHuntSetoutScene(){
    clear(); skyGround('#8fbf72');
    drawSun(W*0.15,H*0.13,20);
    drawTree(W*0.1,H*0.6,0.9);
    drawTree(W*0.92,H*0.58,1.1);
    drawTree(W*0.75,H*0.62,0.7);
    drawPerson(W*0.3,H*0.82,1,'#e8b98a','#4c7a3f',false);
    drawPerson(W*0.5,H*0.82,1,'#e8b98a','#5c8a4a',false);
    drawPerson(W*0.7,H*0.82,1.1,'#e8b98a','#c96f3f',true);
  }

  function drawWormPlayScene(){
    clear(); skyGround('#8fbf72');
    drawTree(W*0.08,H*0.6,0.8);
    drawTree(W*0.94,H*0.58,0.9);
    drawPerson(W*0.28,H*0.5,0.85,'#e8b98a','#4c7a3f',false);
    drawDeer(W*0.28,H*0.62,0.7);
    drawPerson(W*0.72,H*0.5,0.85,'#e8b98a','#5c8a4a',false);
    drawDeer(W*0.72,H*0.62,0.7);
  }

  function drawDuckEatsWormScene(){
    clear(); skyGround('#a9d68c');
    drawHut(W*0.85,H*0.65,0.7);
    drawPerson(W*0.35,H*0.75,1.2,'#e8b98a','#c96f3f',true);
    drawWorm(W*0.35,H*0.9,1.1,animState.t||0);
    drawDuck(W*0.62,H*0.88,1.3);
  }

  function drawTradeScene(){
    clear(); skyGround('#a9d68c');
    drawHut(W*0.2,H*0.65,0.7);
    drawPerson(W*0.35,H*0.8,1.1,'#e8b98a','#c96f3f',true);
    drawPerson(W*0.68,H*0.8,1.05,'#d8a878','#7a4a2b',false);
    drawDuck(W*0.55,H*0.88,1.2);
  }

  function drawFoxEatsDuckScene(){
    clear(); skyGround('#a9d68c');
    drawHut(W*0.5,H*0.62,1);
    drawPerson(W*0.5,H*0.85,1.1,'#e8b98a','#c96f3f',true);
    drawFox(W*0.72,H*0.88,1.1);
  }

  function drawWolfEatsFoxScene(){
    clear(); skyGround('#8fbf72');
    drawTree(W*0.1,H*0.58,0.9);
    drawPerson(W*0.3,H*0.85,1.1,'#e8b98a','#c96f3f',true);
    drawWolf(W*0.68,H*0.88,1.1);
  }

  function drawHappyScene(){
    clear(); skyGround('#a9d68c');
    drawSun(W*0.85,H*0.15,24);
    drawHut(W*0.5,H*0.65,1);
    drawPerson(W*0.5,H*0.85,1.3,'#e8b98a','#c96f3f',true);
    drawHeart(W*0.35,H*0.55,1.2);
    drawHeart(W*0.65,H*0.5,1);
    drawHeart(W*0.5,H*0.4,0.8);
  }

  function drawChiefBorrowScene(){
    clear(); skyGround('#a9d68c');
    drawHut(W*0.5,H*0.62,1);
    drawPerson(W*0.32,H*0.85,1.1,'#e8b98a','#c96f3f',true);
    drawChief(W*0.68,H*0.85,1.1);
    drawDrum(W*0.5,H*0.85,0.7,false);
  }

  function drawDrumBreakScene(){
    clear(); skyGround('#a9d68c');
    drawChief(W*0.5,H*0.85,1.3);
    drawDrum(W*0.5,H*0.6,0.9,true);
    ctx.strokeStyle = '#5c3720'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(W*0.5-15,H*0.6-15); ctx.lineTo(W*0.5+10,H*0.6+15);
    ctx.moveTo(W*0.5+15,H*0.6-15); ctx.lineTo(W*0.5-10,H*0.6+15);
    ctx.stroke();
  }

  function drawWeddingPromiseScene(){
    clear(); skyGround('#a9d68c');
    drawSun(W*0.5,H*0.14,24);
    drawChief(W*0.28,H*0.85,1);
    drawPrincess(W*0.5,H*0.85,1);
    drawPerson(W*0.72,H*0.85,1.1,'#e8b98a','#c96f3f',true);
    drawHeart(W*0.5,H*0.55,1.2);
  }

  function drawEndingScene(){
    clear(); skyGround('#a9d68c');
    drawSun(W*0.5,H*0.16,26);
    drawChief(W*0.28,H*0.85,1);
    drawPrincess(W*0.5,H*0.85,1);
    drawPerson(W*0.72,H*0.85,1.1,'#e8b98a','#c96f3f',true);
    drawDrum(W*0.5,H*0.4,0.8,false);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 20px Trebuchet MS';
    ctx.textAlign='center';
    ctx.fillText(TXT[lang].end, W/2, H*0.24);
  }

  function drawScene(){
    // used on resize to redraw whichever screen is active
    if (storyIndex === -1){ drawIntroScene(); return; }
    if (storyIndex >= TOTAL_STORY){ drawEndingScene(); return; }
    var fns = [drawFamilyScene, drawHuntSetoutScene, drawWormPlayScene, drawDuckEatsWormScene,
      drawTradeScene, drawFoxEatsDuckScene, drawFoxHuntStatic, drawWolfEatsFoxScene, drawWolfHuntStatic,
      drawHappyScene, drawDrumMakingStatic, drawChiefBorrowScene, drawDrumBreakScene, drawWeddingPromiseScene];
    if (fns[storyIndex]) fns[storyIndex]();
  }
  function drawFoxHuntStatic(){ drawFoxHuntBackground(); drawFox(W*0.5,H*0.6,1); }
  function drawWolfHuntStatic(){ drawFoxHuntBackground(); drawWolf(W*0.5,H*0.6,1); }
  function drawDrumMakingStatic(){ clear(); skyGround('#a9d68c'); drawPerson(W*0.2,H*0.85,1,'#e8b98a','#c96f3f',true); drawDrum(W*0.6,H*0.6,1,false); }

  /* ---------------------------------------------------------
     MINIGAME 1: DIG THE WORM (mash tap)
  --------------------------------------------------------- */
  function startDigMinigame(){
    showHint(TXT[lang].hintDig);
    showProgress(true);
    var needed = 14;
    var count = 0;
    var wiggle = 0;
    animState.t = 0;

    function loop(){
      wiggle += 0.25;
      animState.t = wiggle;
      drawWormPlayScene();
      // draw target worm at center-bottom
      drawWorm(W*0.5,H*0.85,1.6,wiggle);
      rafId = requestAnimationFrame(loop);
    }
    loop();

    function onTap(e){
      var rect = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      var dx = cx - W*0.5, dy = cy - H*0.85;
      if (Math.sqrt(dx*dx+dy*dy) < 60){
        count++;
        progressFill.style.width = Math.min(100,(count/needed)*100) + '%';
        if (count >= needed){
          canvas.removeEventListener('click', onTap);
          canvas.removeEventListener('touchstart', onTap);
          stopAnim();
          showHint('');
          showProgress(false);
          setTimeout(function(){ goToStory(storyIndex+1); }, 250);
        }
      }
    }
    canvas.addEventListener('click', onTap);
    canvas.addEventListener('touchstart', onTap, {passive:true});
    animState.cleanup = function(){
      canvas.removeEventListener('click', onTap);
      canvas.removeEventListener('touchstart', onTap);
    };
  }

  /* ---------------------------------------------------------
     MINIGAME 2: CHASE / SHOOT (timing challenge)
  --------------------------------------------------------- */
  function drawFoxHuntBackground(){
    clear(); skyGround('#8fbf72');
    drawTree(W*0.06,H*0.6,0.8);
    drawTree(W*0.95,H*0.58,0.9);
  }

  function startChaseMinigame(kind){
    var isWolf = kind === 'wolf';
    showHint(isWolf ? TXT[lang].hintWolf : TXT[lang].hintFox);
    showProgress(true);
    var needed = 3;
    var hits = 0;
    var speed = isWolf ? 3.6 : 2.4;
    var pos = 0.1;
    var dir = 1;
    var targetMin = 0.42, targetMax = 0.58;
    var caught = false;

    function loop(){
      if (!caught){
        pos += dir * speed * 0.006;
        if (pos > 0.92){ pos = 0.92; dir = -1; }
        if (pos < 0.08){ pos = 0.08; dir = 1; }
      }
      drawFoxHuntBackground();
      // target zone marker
      ctx.fillStyle = 'rgba(224,72,62,0.18)';
      ctx.fillRect(W*targetMin, H*0.4, W*(targetMax-targetMin), H*0.35);
      ctx.strokeStyle = 'rgba(224,72,62,0.5)';
      ctx.strokeRect(W*targetMin, H*0.4, W*(targetMax-targetMin), H*0.35);
      if (isWolf) drawWolf(W*pos, H*0.6, 1);
      else drawFox(W*pos, H*0.6, 1);
      rafId = requestAnimationFrame(loop);
    }
    loop();

    function onTap(e){
      var inZone = pos >= targetMin && pos <= targetMax;
      if (inZone){
        hits++;
        progressFill.style.width = Math.min(100,(hits/needed)*100) + '%';
        // little flash
        caught = true;
        setTimeout(function(){ caught = false; }, 120);
        if (hits >= needed){
          canvas.removeEventListener('click', onTap);
          canvas.removeEventListener('touchstart', onTap);
          stopAnim();
          showHint(''); showProgress(false);
          setTimeout(function(){ goToStory(storyIndex+1); }, 300);
        }
      }
    }
    canvas.addEventListener('click', onTap);
    canvas.addEventListener('touchstart', onTap, {passive:true});
    animState.cleanup = function(){
      canvas.removeEventListener('click', onTap);
      canvas.removeEventListener('touchstart', onTap);
    };
  }

  /* ---------------------------------------------------------
     MINIGAME 3: DRUM RHYTHM
  --------------------------------------------------------- */
  function startDrumMinigame(){
    showHint(TXT[lang].hintDrum);
    showProgress(true);
    var needed = 6;
    var count = 0;
    var beatOn = false;
    var beatTimer = 0;
    var interval = 55; // frames-ish, controlled via rAF timing approx

    function loop(){
      beatTimer++;
      if (beatTimer > 34){ beatTimer = 0; beatOn = true; setTimeout(function(){ beatOn=false; }, 260); }
      clear(); skyGround('#a9d68c');
      drawPerson(W*0.22,H*0.85,1,'#e8b98a','#c96f3f',true);
      drawDrum(W*0.6,H*0.6,1.4,beatOn);
      rafId = requestAnimationFrame(loop);
    }
    loop();

    function onTap(e){
      var rect = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      var dx = cx - W*0.6, dy = cy - H*0.6;
      if (Math.sqrt(dx*dx+dy*dy) < 90){
        count++;
        progressFill.style.width = Math.min(100,(count/needed)*100) + '%';
        if (count >= needed){
          canvas.removeEventListener('click', onTap);
          canvas.removeEventListener('touchstart', onTap);
          stopAnim();
          showHint(''); showProgress(false);
          setTimeout(function(){ goToStory(storyIndex+1); }, 250);
        }
      }
    }
    canvas.addEventListener('click', onTap);
    canvas.addEventListener('touchstart', onTap, {passive:true});
    animState.cleanup = function(){
      canvas.removeEventListener('click', onTap);
      canvas.removeEventListener('touchstart', onTap);
    };
  }

  /* ---------------------------------------------------------
     INIT
  --------------------------------------------------------- */
  function init(){
    titleEl.textContent = TXT[lang].pageTitle;
    langBtn.textContent = TXT[lang].langLabel;
    updateMuteBtn();
    buildDots();
    resizeCanvas();
    renderCurrentScreen(true);
    setTimeout(sendResize, 200);
  }

  // wrap stopAnim to also cleanup listeners
  var _origStopAnim = stopAnim;
  stopAnim = function(){
    if (animState.cleanup){ animState.cleanup(); animState.cleanup = null; }
    _origStopAnim();
  };

  window.addEventListener('load', init);
  if (document.readyState === 'complete') init();

})();
</script>

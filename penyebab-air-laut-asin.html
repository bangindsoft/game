<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penyebab Air Laut Asin - Game Dongeng Interaktif</title>
<style>
  :root{
    --pla-bg:#0a2036;
    --pla-bg2:#0e2c47;
    --pla-panel:#0f2d47;
    --pla-cream:#f7ecd2;
    --pla-gold:#e8b93c;
    --pla-gold-dark:#b8862a;
    --pla-teal:#2fb6c0;
    --pla-teal-dark:#1f8b93;
    --pla-ink:#0a2036;
    --pla-danger:#e0574a;
    --pla-radius:16px;
    --pla-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  #pla-root{
    font-family:'Baloo 2','Segoe UI',Verdana,sans-serif;
    background:linear-gradient(180deg,var(--pla-bg) 0%, var(--pla-bg2) 100%);
    color:var(--pla-cream);
    width:100%;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 12px 18px;
    overflow:hidden;
  }
  #pla-app{
    width:100%;
    max-width:760px;
    background:var(--pla-panel);
    border-radius:var(--pla-radius);
    box-shadow:var(--pla-shadow);
    border:1px solid rgba(232,185,60,.25);
    overflow:hidden;
    position:relative;
  }
  .pla-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:rgba(0,0,0,.18);
    border-bottom:1px solid rgba(232,185,60,.2);
  }
  .pla-topbar h1{
    font-size:15px;
    margin:0;
    font-weight:700;
    color:var(--pla-gold);
    letter-spacing:.3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pla-topbtns{display:flex; gap:8px; flex-shrink:0;}
  .pla-iconbtn{
    background:rgba(247,236,210,.1);
    border:1px solid rgba(247,236,210,.25);
    color:var(--pla-cream);
    border-radius:10px;
    padding:6px 10px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    line-height:1;
    transition:background .15s ease, transform .1s ease;
  }
  .pla-iconbtn:hover{background:rgba(247,236,210,.2);}
  .pla-iconbtn:active{transform:scale(.94);}

  /* COVER */
  #pla-cover{
    padding:22px 20px 26px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #pla-cover-canvas{
    width:100%;
    max-width:420px;
    aspect-ratio:4/3;
    border-radius:12px;
    background:#0c2740;
    display:block;
    margin:6px auto 14px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  #pla-cover h2{
    font-size:24px;
    margin:2px 0 4px;
    color:var(--pla-gold);
  }
  #pla-cover p.pla-sub{
    margin:0 0 16px;
    font-size:14px;
    opacity:.85;
  }
  .pla-btn{
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:30px;
    padding:12px 28px;
    cursor:pointer;
    background:linear-gradient(180deg,var(--pla-gold) 0%, var(--pla-gold-dark) 100%);
    color:#3a2405;
    box-shadow:0 6px 0 #8a611c, 0 10px 18px rgba(0,0,0,.35);
    transition:transform .08s ease;
  }
  .pla-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #8a611c, 0 4px 10px rgba(0,0,0,.3);}
  .pla-btn.pla-secondary{
    background:linear-gradient(180deg,var(--pla-teal) 0%, var(--pla-teal-dark) 100%);
    color:#04262a;
    box-shadow:0 6px 0 #145a5f, 0 10px 18px rgba(0,0,0,.35);
  }
  .pla-btn.pla-secondary:active{box-shadow:0 2px 0 #145a5f, 0 4px 10px rgba(0,0,0,.3);}

  /* GAME STAGE */
  #pla-stage{display:none; flex-direction:column; padding:14px 14px 18px;}
  #pla-canvas-wrap{
    position:relative;
    width:100%;
    aspect-ratio:8/5;
    border-radius:12px;
    overflow:hidden;
    background:#0c2740;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  #pla-canvas{width:100%; height:100%; display:block;}
  #pla-caption{
    margin-top:12px;
    font-size:14.5px;
    line-height:1.55;
    background:rgba(0,0,0,.22);
    border-left:3px solid var(--pla-gold);
    border-radius:8px;
    padding:12px 14px;
    min-height:44px;
  }
  .pla-controls-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  #pla-action-btn{
    font-family:inherit;
    font-weight:800;
    font-size:16px;
    border:none;
    border-radius:16px;
    padding:16px 26px;
    cursor:pointer;
    background:linear-gradient(180deg,var(--pla-teal) 0%, var(--pla-teal-dark) 100%);
    color:#04262a;
    box-shadow:0 6px 0 #145a5f, 0 10px 18px rgba(0,0,0,.3);
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    min-width:190px;
  }
  #pla-action-btn:active,#pla-action-btn.pla-pressed{transform:translateY(4px); box-shadow:0 2px 0 #145a5f, 0 4px 10px rgba(0,0,0,.3);}
  #pla-action-bar-wrap{
    width:100%;
    max-width:340px;
    height:14px;
    background:rgba(255,255,255,.12);
    border-radius:8px;
    overflow:hidden;
    margin-top:10px;
    display:none;
  }
  #pla-action-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--pla-gold),#fff3c4);
    transition:width .08s linear;
  }
  .pla-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:16px;
  }
  .pla-dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(247,236,210,.25);
    transition:background .2s ease, transform .2s ease;
  }
  .pla-dot.pla-active{background:var(--pla-gold); transform:scale(1.25);}
  .pla-dot.pla-done{background:var(--pla-teal);}

  /* END SCREEN */
  #pla-end{display:none; padding:22px 20px 26px; text-align:center; flex-direction:column; align-items:center;}
  #pla-end h2{color:var(--pla-gold); margin:2px 0 10px; font-size:22px;}
  #pla-end p{font-size:14px; line-height:1.6; opacity:.9; max-width:500px;}
  #pla-end .pla-moral{
    background:rgba(0,0,0,.22);
    border-left:3px solid var(--pla-teal);
    border-radius:8px;
    padding:12px 16px;
    margin:14px 0 18px;
    text-align:left;
  }

  .pla-footer{
    text-align:center;
    font-size:11.5px;
    opacity:.55;
    padding:10px 14px 4px;
  }
  .pla-footer a{color:var(--pla-teal); text-decoration:none;}

  @media (max-width:420px){
    .pla-topbar h1{font-size:13px;}
    #pla-cover h2{font-size:20px;}
    #pla-action-btn{font-size:14px; padding:14px 20px; min-width:160px;}
  }
</style>
</head>
<body>
<div id="pla-root">
  <div id="pla-app">

    <div class="pla-topbar">
      <h1 id="pla-topbar-title">Penyebab Air Laut Asin</h1>
      <div class="pla-topbtns">
        <button class="pla-iconbtn" id="pla-lang-btn" type="button" title="Ganti Bahasa">EN</button>
        <button class="pla-iconbtn" id="pla-mute-btn" type="button" title="Mute/Unmute">🔊</button>
      </div>
    </div>

    <!-- COVER -->
    <div id="pla-cover">
      <canvas id="pla-cover-canvas"></canvas>
      <h2 id="pla-cover-title">Penyebab Air Laut Asin</h2>
      <p class="pla-sub" id="pla-cover-sub">Dongeng Interaktif dari Korea</p>
      <button class="pla-btn" id="pla-start-btn" type="button">▶ Mulai Cerita</button>
    </div>

    <!-- GAME STAGE -->
    <div id="pla-stage">
      <div id="pla-canvas-wrap">
        <canvas id="pla-canvas"></canvas>
      </div>
      <div id="pla-caption"></div>
      <div class="pla-controls-row" id="pla-controls-row">
        <button class="pla-btn" id="pla-next-btn" type="button">Lanjut ▶</button>
        <button id="pla-action-btn" type="button" style="display:none;"></button>
      </div>
      <div id="pla-action-bar-wrap"><div id="pla-action-bar-fill"></div></div>
      <div class="pla-dots" id="pla-dots"></div>
    </div>

    <!-- END -->
    <div id="pla-end">
      <canvas id="pla-end-canvas" style="width:100%;max-width:360px;aspect-ratio:4/3;border-radius:12px;background:#0c2740;box-shadow:0 6px 18px rgba(0,0,0,.35);margin-bottom:14px;"></canvas>
      <h2 id="pla-end-title">Selesai!</h2>
      <div class="pla-moral" id="pla-end-moral"></div>
      <button class="pla-btn pla-secondary" id="pla-replay-btn" type="button">🔁 Ulangi Cerita</button>
    </div>

    <div class="pla-footer">
      Cerita interaktif dipersembahkan oleh <a href="https://caritasato.blogspot.com" target="_blank" rel="noopener">caritasato.blogspot.com</a>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================== I18N ================== */
  var TXT = {
    id: {
      appTitle: "Penyebab Air Laut Asin",
      coverTitle: "Penyebab Air Laut Asin",
      coverSub: "Dongeng Interaktif dari Korea",
      startBtn: "▶ Mulai Cerita",
      nextBtn: "Lanjut ▶",
      replayBtn: "🔁 Ulangi Cerita",
      endTitle: "Selesai!",
      endMoral: "Kisah ini mengajarkan kita bahwa keserakahan dapat mendatangkan bencana bagi diri sendiri. Cukupkanlah diri dengan apa yang benar-benar kita butuhkan.",
      hideBtn: "🙈 Sembunyi!",
      rowBtn: "🚣 Dayung!",
      grindBtn: "🌀 Putar Batu!",
      steps: [
        {
          text: "Dahulu kala, di sebuah kerajaan di Korea, sang Raja memiliki batu ajaib yang bisa mengabulkan permintaan siapa saja yang memutarnya. Karena sangat berharga, batu itu disembunyikan diam-diam di bawah pot bunga di taman istana."
        },
        {
          text: "Seorang pencuri licik mendengar tentang batu ajaib itu dan sangat menginginkannya. Ia pun menyamar menjadi pengawal istana, bekerja rajin hingga dipercaya penuh oleh raja dan selalu ikut ke mana pun raja pergi."
        },
        {
          text: "Suatu malam, pencuri melihat kesempatan emas! Ketuk tombol SEMBUNYI tepat saat cahaya obor penjaga menjauh, agar ia bisa mengendap ke taman tanpa ketahuan.",
          kind:"sneak"
        },
        {
          text: "Pencuri berhasil mencuri batu ajaib itu dan segera melarikan diri ke kampung halamannya, sebuah pulau kecil yang terpencil. Di sana, garam sangatlah langka — harganya bahkan lebih mahal daripada emas!"
        },
        {
          text: "Agar tidak ada yang curiga, pencuri mendayung perahunya jauh ke tengah laut. Tekan dan tahan tombol DAYUNG untuk membawa perahu ke tengah laut.",
          kind:"row"
        },
        {
          text: "Sesampainya di tengah laut, pencuri memutar batu ajaib sambil berseru, 'Wahai batu ajaib, keluarkanlah garam sebanyak-banyaknya untukku!' Tekan dan tahan tombol PUTAR BATU.",
          kind:"grind",
          progressText:[
            "Butiran garam mulai keluar dari batu ajaib. \u201CAku akan kaya!\u201D seru pencuri gembira.",
            "Garam terus keluar semakin banyak, mulai memenuhi perahu. Namun pencuri malah semakin bersemangat memutar batu.",
            "Perahu mulai terlalu berat! Tapi pencuri yang rakus tak mau berhenti..."
          ]
        },
        {
          text: "Karena keserakahannya, pencuri terus memutar batu ajaib meski perahunya sudah penuh garam. Akhirnya perahu itu tenggelam bersama sang pencuri. Batu ajaib terus berputar tanpa henti di dasar laut, mengeluarkan garam selamanya — itulah sebabnya, hingga hari ini, air laut terasa asin."
        }
      ]
    },
    en: {
      appTitle: "Why the Sea is Salty",
      coverTitle: "Why the Sea is Salty",
      coverSub: "An Interactive Korean Folktale",
      startBtn: "▶ Start Story",
      nextBtn: "Next ▶",
      replayBtn: "🔁 Replay Story",
      endTitle: "The End!",
      endMoral: "This tale reminds us that greed can bring disaster upon ourselves. Let us be content with what we truly need.",
      hideBtn: "🙈 Hide!",
      rowBtn: "🚣 Row!",
      grindBtn: "🌀 Turn the Stone!",
      steps: [
        {
          text: "Long ago, in a kingdom in Korea, the King owned a magic stone that could grant any wish to whoever turned it. Because it was so precious, the stone was secretly hidden under a flowerpot in the palace garden."
        },
        {
          text: "A cunning thief heard about the magic stone and wanted it badly. He disguised himself as a palace guard, working hard until he earned the King's full trust and always accompanied him wherever he went."
        },
        {
          text: "One night, the thief saw his golden chance! Tap the HIDE button exactly when the guard's torchlight moves away, so he can sneak to the garden unseen.",
          kind:"sneak"
        },
        {
          text: "The thief managed to steal the magic stone and quickly fled to his hometown, a remote little island. There, salt was so rare that it cost even more than gold!"
        },
        {
          text: "To avoid suspicion, the thief rowed his boat far out to the middle of the sea. Press and hold the ROW button to bring the boat out to sea.",
          kind:"row"
        },
        {
          text: "Once at sea, the thief turned the magic stone and cried, 'Oh magic stone, give me as much salt as you can!' Press and hold the TURN STONE button.",
          kind:"grind",
          progressText:[
            "Grains of salt begin pouring out of the magic stone. 'I'll be rich!' the thief cheered.",
            "More and more salt pours out, filling up the boat. But the thief only grows more excited and keeps turning.",
            "The boat is getting far too heavy! But the greedy thief refuses to stop..."
          ]
        },
        {
          text: "Blinded by greed, the thief kept turning the stone even as his boat overflowed with salt. At last, the boat sank, taking the thief down with it. The magic stone kept spinning endlessly on the seafloor, pouring out salt forever \u2014 and that is why, to this day, the sea tastes salty."
        }
      ]
    }
  };

  var TOTAL_STEPS = TXT.id.steps.length;

  /* ================== STATE ================== */
  var state = {
    lang: 'id',
    muted: false,
    screen: 'cover', // cover | game | end
    stepIndex: 0,
    animT: 0,
    sneak: { angle:0, dir:1, hits:0, needed:3, flash:0, speed:0.028 },
    hold:  { active:false, progress:0, raf:null, lastTick:0 },
    boatSink: 0 // used at ending for extra sink animation
  };

  try {
    var qp = new URLSearchParams(window.location.search);
    if (qp.get('lang') === 'en') state.lang = 'en';
  } catch(e){}
  try {
    var savedMute = localStorage.getItem('pla_muted');
    if (savedMute === '1') state.muted = true;
    var savedLang = localStorage.getItem('pla_lang');
    if (savedLang === 'id' || savedLang === 'en') state.lang = savedLang;
  } catch(e){}

  function T(){ return TXT[state.lang]; }

  /* ================== DOM ================== */
  var $ = function(id){ return document.getElementById(id); };
  var coverCanvas = $('pla-cover-canvas');
  var stageCanvas = $('pla-canvas');
  var endCanvas = $('pla-end-canvas');
  var captionEl = $('pla-caption');
  var nextBtn = $('pla-next-btn');
  var actionBtn = $('pla-action-btn');
  var actionBarWrap = $('pla-action-bar-wrap');
  var actionBarFill = $('pla-action-bar-fill');
  var dotsEl = $('pla-dots');
  var langBtn = $('pla-lang-btn');
  var muteBtn = $('pla-mute-btn');

  /* ================== CANVAS SETUP ================== */
  function fitCanvas(canvas){
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    if (canvas.__w === w && canvas.__h === h && canvas.__dpr === dpr) return;
    canvas.__w = w; canvas.__h = h; canvas.__dpr = dpr;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  /* ================== DRAW HELPERS ================== */
  function drawSky(ctx,w,h,night){
    var g = ctx.createLinearGradient(0,0,0,h);
    if (night){
      g.addColorStop(0,'#071a2c');
      g.addColorStop(1,'#0f3454');
    } else {
      g.addColorStop(0,'#123a5c');
      g.addColorStop(1,'#1f5f7c');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
  }

  function drawStars(ctx,w,h,t,count){
    ctx.save();
    for (var i=0;i<count;i++){
      var sx = (i*97.3)%w;
      var sy = (i*53.7)%(h*0.55);
      var tw = 0.5+0.5*Math.sin(t*2 + i);
      ctx.globalAlpha = 0.25 + 0.55*Math.max(0,tw);
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath();
      ctx.arc(sx, sy, 1.3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMoon(ctx,x,y,r){
    ctx.save();
    ctx.fillStyle = '#f7ecd2';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(10,32,54,0.85)';
    ctx.beginPath(); ctx.arc(x+r*0.35,y-r*0.15,r*0.85,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawSea(ctx,w,h,seaY,t,speed){
    speed = speed||1;
    ctx.save();
    var g = ctx.createLinearGradient(0,seaY,0,h);
    g.addColorStop(0,'#1c5f7f');
    g.addColorStop(1,'#0a2a42');
    ctx.fillStyle = g;
    ctx.fillRect(0,seaY,w,h-seaY);
    ctx.strokeStyle = 'rgba(247,236,210,0.35)';
    ctx.lineWidth = 1.4;
    for (var row=0; row<3; row++){
      ctx.beginPath();
      var yy = seaY + 10 + row*16;
      for (var x=0; x<=w; x+=8){
        var yOff = Math.sin((x*0.04) + t*speed*1.6 + row*1.3) * (2.4-row*0.4);
        if (x===0) ctx.moveTo(x, yy+yOff); else ctx.lineTo(x, yy+yOff);
      }
      ctx.globalAlpha = 0.5 - row*0.12;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPalaceRoof(ctx,cx,baseY,scale,color){
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(scale, scale);
    ctx.fillStyle = color || '#7a3b2e';
    ctx.beginPath();
    ctx.moveTo(-70, 0);
    ctx.quadraticCurveTo(-78,-14,-58,-18);
    ctx.lineTo(58,-18);
    ctx.quadraticCurveTo(78,-14,70,0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#9c5138';
    ctx.beginPath();
    ctx.moveTo(-50,-18);
    ctx.quadraticCurveTo(-56,-40,-30,-46);
    ctx.lineTo(30,-46);
    ctx.quadraticCurveTo(56,-40,50,-18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c98a4a';
    ctx.beginPath();
    ctx.moveTo(-24,-46);
    ctx.quadraticCurveTo(-26,-64,0,-68);
    ctx.quadraticCurveTo(26,-64,24,-46);
    ctx.closePath();
    ctx.fill();
    // pillars
    ctx.fillStyle = '#5a2f22';
    for (var i=-1;i<=1;i++){
      ctx.fillRect(i*38-3, 0, 6, 26);
    }
    ctx.restore();
  }

  function drawPersonKing(ctx,x,y,scale,t){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    var bob = Math.sin(t*2)*1.5;
    ctx.translate(0,bob);
    // robe
    ctx.fillStyle = '#c9973f';
    ctx.beginPath();
    ctx.moveTo(-14,10); ctx.quadraticCurveTo(-18,-24,0,-26); ctx.quadraticCurveTo(18,-24,14,10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8f6b2c';
    ctx.fillRect(-14,-2,28,6);
    // head
    ctx.fillStyle = '#f0c397';
    ctx.beginPath(); ctx.arc(0,-32,9,0,Math.PI*2); ctx.fill();
    // crown
    ctx.fillStyle = '#e8b93c';
    ctx.beginPath();
    ctx.moveTo(-9,-38); ctx.lineTo(-9,-46); ctx.lineTo(-3,-40); ctx.lineTo(0,-48); ctx.lineTo(3,-40); ctx.lineTo(9,-46); ctx.lineTo(9,-38);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawPersonGuard(ctx,x,y,scale,t,color){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    var bob = Math.sin(t*2+1)*1.5;
    ctx.translate(0,bob);
    ctx.fillStyle = color || '#3d5a73';
    ctx.beginPath();
    ctx.moveTo(-12,10); ctx.quadraticCurveTo(-15,-22,0,-24); ctx.quadraticCurveTo(15,-22,12,10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#25384a';
    ctx.fillRect(-12,-1,24,5);
    ctx.fillStyle = '#f0c397';
    ctx.beginPath(); ctx.arc(0,-30,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#25384a';
    ctx.beginPath(); ctx.arc(0,-33,8,Math.PI,0); ctx.fill();
    ctx.restore();
  }

  function drawThief(ctx,x,y,scale,t,pose){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    var bob = pose==='crouch' ? 0 : Math.sin(t*2+2)*1.4;
    ctx.translate(0,bob);
    var crouch = pose==='crouch' ? 6 : 0;
    ctx.fillStyle = '#4a4038';
    ctx.beginPath();
    ctx.moveTo(-11,10-crouch); ctx.quadraticCurveTo(-14,-20+crouch*0.6,0,-22+crouch*0.6); ctx.quadraticCurveTo(14,-20+crouch*0.6,11,10-crouch);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e6c98f';
    ctx.beginPath(); ctx.arc(0,-28+crouch*0.6,7.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2e2822';
    ctx.beginPath(); ctx.arc(0,-31+crouch*0.6,7.5,Math.PI,0); ctx.fill();
    ctx.restore();
  }

  function drawPot(ctx,x,y,scale,glow){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    if (glow>0){
      ctx.save();
      ctx.globalAlpha = 0.35*glow;
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(0,-6,22,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#6b4a35';
    ctx.beginPath();
    ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.lineTo(12,20); ctx.lineTo(-12,20); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#83593f';
    ctx.fillRect(-18,-4,36,6);
    ctx.restore();
  }

  function drawBoat(ctx,x,y,scale,waterline){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#7a5230';
    ctx.beginPath();
    ctx.moveTo(-46,0);
    ctx.quadraticCurveTo(-50,16,-30,18);
    ctx.lineTo(30,18);
    ctx.quadraticCurveTo(50,16,46,0);
    ctx.quadraticCurveTo(0,10,-46,0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5a3a1e';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawStone(ctx,x,y,r,t,glow){
    ctx.save();
    ctx.translate(x,y);
    if (glow>0){
      ctx.save();
      ctx.globalAlpha = 0.4*glow;
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(0,0,r*2.1,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.rotate(t);
    var g = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
    g.addColorStop(0,'#fff3c4');
    g.addColorStop(1,'#e8b93c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#b8862a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,r*0.55,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    for (var i=0;i<4;i++){
      var a = i*Math.PI/2;
      ctx.moveTo(Math.cos(a)*r*0.55, Math.sin(a)*r*0.55);
      ctx.lineTo(Math.cos(a)*r*0.9, Math.sin(a)*r*0.9);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawSaltParticles(ctx, originX, originY, spread, count, t){
    ctx.save();
    ctx.fillStyle = '#ffffff';
    for (var i=0;i<count;i++){
      var seed = i*12.9898;
      var frac = ((t*0.9 + i*0.13) % 1);
      var dx = (Math.sin(seed)*0.5) * spread;
      var dy = frac * 46 - 6;
      var x = originX + dx;
      var y = originY + dy;
      var a = 1 - frac;
      ctx.globalAlpha = Math.max(0, a*0.9);
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawClouds(ctx,w,h,t){
    ctx.save();
    ctx.fillStyle = 'rgba(247,236,210,0.12)';
    for (var i=0;i<3;i++){
      var cx = ((t*6 + i*160) % (w+120)) - 60;
      var cy = 30 + i*22;
      ctx.beginPath();
      ctx.ellipse(cx,cy,34,12,0,0,Math.PI*2);
      ctx.ellipse(cx+22,cy+4,24,10,0,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBubbles(ctx,w,h,t,count){
    ctx.save();
    ctx.strokeStyle = 'rgba(247,236,210,0.5)';
    ctx.lineWidth = 1;
    for (var i=0;i<count;i++){
      var seed = i*7.31;
      var frac = ((t*0.25 + i*0.17) % 1);
      var x = (Math.sin(seed)*0.5+0.5) * w;
      var y = h - frac*h*0.7;
      var r = 2 + (i%3);
      ctx.globalAlpha = 0.6*(1-frac);
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  /* ================== SCENE DRAWERS ================== */
  function drawCoverScene(ctx,w,h,t){
    drawSky(ctx,w,h,true);
    drawStars(ctx,w,h,t,40);
    drawMoon(ctx,w*0.78,h*0.22,h*0.09);
    drawSea(ctx,w,h,h*0.62,t,1);
    drawBoat(ctx, w*0.5, h*0.72, 1.1, 0);
    drawStone(ctx, w*0.5, h*0.6, 16, t*0.6, 0.7+0.3*Math.sin(t*2));
    drawSaltParticles(ctx, w*0.5, h*0.62, 10, 18, t);
  }

  function scene0(ctx,w,h,t){ // palace / hidden stone
    drawSky(ctx,w,h,true);
    drawStars(ctx,w,h,t,30);
    drawMoon(ctx,w*0.85,h*0.16,h*0.07);
    ctx.fillStyle = '#0d3a2e';
    ctx.fillRect(0,h*0.62,w,h*0.38);
    drawPalaceRoof(ctx, w*0.5, h*0.5, 1.6, '#7a3b2e');
    drawPersonKing(ctx, w*0.32, h*0.72, 1.3, t);
    drawPot(ctx, w*0.68, h*0.76, 1.3, 0.6+0.4*Math.sin(t*3));
  }

  function scene1(ctx,w,h,t){ // thief disguises as guard
    drawSky(ctx,w,h,false);
    ctx.fillStyle = '#123320';
    ctx.fillRect(0,h*0.66,w,h*0.34);
    drawPalaceRoof(ctx, w*0.5, h*0.42, 1.2, '#7a3b2e');
    drawPersonKing(ctx, w*0.4, h*0.78, 1.25, t);
    drawPersonGuard(ctx, w*0.62, h*0.8, 1.15, t, '#3d5a73');
  }

  function scene2(ctx,w,h,t,st){ // sneak QTE
    drawSky(ctx,w,h,true);
    drawStars(ctx,w,h,t,26);
    ctx.fillStyle = '#0d3a2e';
    ctx.fillRect(0,h*0.66,w,h*0.34);
    drawPalaceRoof(ctx, w*0.5, h*0.34, 1.0, '#7a3b2e');
    // guard with lantern sweeping
    var gx = w*0.72, gy = h*0.72;
    drawPersonGuard(ctx, gx, gy, 1.05, t, '#3d5a73');
    var lightAngle = st.sneak.angle;
    ctx.save();
    ctx.translate(gx-6, gy-30);
    ctx.rotate(lightAngle);
    var lg = ctx.createRadialGradient(0,0,2,60,0,60);
    var safe = isSneakSafe(st);
    lg.addColorStop(0, safe ? 'rgba(120,255,180,0.5)' : 'rgba(255,220,120,0.5)');
    lg.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,70,-0.32,0.32);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    drawPot(ctx, w*0.28, h*0.78, 1.15, 0.4);
    drawThief(ctx, w*0.32, h*0.7, 1.0, t, 'crouch');

    if (st.sneak.flash>0){
      ctx.save();
      ctx.globalAlpha = st.sneak.flash*0.4;
      ctx.fillStyle = '#e0574a';
      ctx.fillRect(0,0,w,h);
      ctx.restore();
    }

    // hit dots
    var cxx = w*0.5, cyy = h*0.14;
    for (var i=0;i<st.sneak.needed;i++){
      ctx.beginPath();
      ctx.arc(cxx + (i-1)*20, cyy, 6, 0, Math.PI*2);
      ctx.fillStyle = i < st.sneak.hits ? '#2fb6c0' : 'rgba(247,236,210,0.25)';
      ctx.fill();
    }
  }

  function isSneakSafe(st){
    // safe when lantern angle near 0 is "looking at thief" -> unsafe.
    // define safe zone when |angle| is large (light pointed away)
    return Math.abs(st.sneak.angle) > 0.42;
  }

  function scene3(ctx,w,h,t){ // island, salt is rare
    drawSky(ctx,w,h,false);
    drawSea(ctx,w,h,h*0.6,t,0.7);
    // island mound
    ctx.fillStyle = '#3a6b3f';
    ctx.beginPath();
    ctx.ellipse(w*0.5,h*0.62,w*0.42,h*0.12,0,0,Math.PI*2);
    ctx.fill();
    // hut
    ctx.fillStyle = '#8a6a3f';
    ctx.beginPath();
    ctx.moveTo(w*0.62,h*0.58); ctx.lineTo(w*0.72,h*0.44); ctx.lineTo(w*0.82,h*0.58);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a4326';
    ctx.fillRect(w*0.66,h*0.58,w*0.12,h*0.08);
    drawThief(ctx, w*0.32, h*0.58, 1.15, t, 'stand');
    // empty jar
    ctx.fillStyle = 'rgba(247,236,210,0.5)';
    ctx.beginPath();
    ctx.moveTo(w*0.45,h*0.6); ctx.lineTo(w*0.5,h*0.6); ctx.lineTo(w*0.48,h*0.68); ctx.lineTo(w*0.47,h*0.68);
    ctx.closePath(); ctx.stroke();
  }

  function scene4(ctx,w,h,t,st){ // rowing
    drawSky(ctx,w,h,false);
    drawClouds(ctx,w,h,t);
    var seaY = h*0.6;
    drawSea(ctx,w,h,seaY,t,1);
    var prog = st.hold.progress;
    var boatX = w*0.18 + prog*(w*0.62);
    var bob = Math.sin(t*4)*2;
    drawBoat(ctx, boatX, seaY-6+bob, 1.15, 0);
    drawThief(ctx, boatX, seaY-24+bob, 0.95, t, 'stand');
    // oar animation
    var oarSwing = st.hold.active ? Math.sin(t*10)*0.5 : 0;
    ctx.save();
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 3;
    ctx.translate(boatX-14, seaY-14+bob);
    ctx.rotate(0.6+oarSwing);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,26); ctx.stroke();
    ctx.restore();
  }

  function scene5(ctx,w,h,t,st){ // grinding stone, boat sinking with salt
    drawSky(ctx,w,h,false);
    var seaY = h*0.58;
    drawSea(ctx,w,h,seaY,t,1);
    var prog = st.hold.progress;
    var sinkY = seaY - 10 + prog*38; // boat sinks lower as progress rises
    var boatX = w*0.5;
    drawBoat(ctx, boatX, sinkY, 1.25, prog);
    // salt pile in boat
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.9;
    var pileW = 40*prog;
    ctx.beginPath();
    ctx.ellipse(boatX, sinkY+6, pileW, 6*prog, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    drawThief(ctx, boatX-16, sinkY-16, 1.0, t, 'stand');
    var stoneY = sinkY-22;
    drawStone(ctx, boatX+14, stoneY, 14, t*3, 0.5+prog*0.5);
    if (st.hold.active){
      drawSaltParticles(ctx, boatX+14, stoneY+8, 12, Math.round(10+prog*20), t);
    }
    // water rising overlay near boat when close to full
    if (prog>0.75){
      ctx.save();
      ctx.globalAlpha = (prog-0.75)*2;
      ctx.fillStyle = 'rgba(28,95,127,0.5)';
      ctx.fillRect(0, seaY, w, h-seaY);
      ctx.restore();
    }
  }

  function scene6(ctx,w,h,t){ // ending: sunk boat, stone spinning at seafloor
    var seaY = h*0.22;
    drawSky(ctx,w,h,false);
    ctx.fillStyle = 'rgba(20,80,110,0.5)';
    ctx.fillRect(0,0,w,seaY);
    drawSea(ctx,w,h,seaY,t,0.8);
    drawBubbles(ctx,w,h,t,14);
    var floorY = h*0.86;
    drawStone(ctx, w*0.5, floorY, 18, t*2.4, 0.8+0.2*Math.sin(t*3));
    drawSaltParticles(ctx, w*0.5, floorY+6, 30, 26, t);
    // sand floor
    ctx.save();
    ctx.fillStyle = 'rgba(200,180,140,0.25)';
    ctx.beginPath();
    ctx.ellipse(w*0.5, h*0.95, w*0.55, h*0.08, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  var SCENES = [scene0, scene1, scene2, scene3, scene4, scene5, scene6];

  /* ================== SPEECH ================== */
  var speechSupported = 'speechSynthesis' in window;
  var voices = [];
  function loadVoices(){
    if (!speechSupported) return;
    voices = window.speechSynthesis.getVoices();
  }
  if (speechSupported){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(lang){
    var want = lang==='en' ? 'en' : 'id';
    for (var i=0;i<voices.length;i++){
      if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(want)===0) return voices[i];
    }
    return null;
  }
  function speak(text){
    if (!speechSupported || state.muted || !text) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = state.lang==='en' ? 'en-US' : 'id-ID';
      var v = pickVoice(state.lang);
      if (v) u.voice = v;
      u.rate = 0.95;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function stopSpeak(){
    if (speechSupported){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  }

  /* ================== RESIZE MESSAGE TO PARENT ================== */
  function notifyResize(){
    try{
      var height = document.getElementById('pla-app').offsetHeight + 12;
      window.parent.postMessage({ type: 'plaAsinResize', height: height }, '*');
    }catch(e){}
  }

  /* ================== UI RENDER ================== */
  function applyStaticText(){
    var t = T();
    document.documentElement.lang = state.lang;
    $('pla-topbar-title').textContent = t.appTitle;
    $('pla-cover-title').textContent = t.coverTitle;
    $('pla-cover-sub').textContent = t.coverSub;
    $('pla-start-btn').textContent = t.startBtn;
    nextBtn.textContent = t.nextBtn;
    $('pla-replay-btn').textContent = t.replayBtn;
    $('pla-end-title').textContent = t.endTitle;
    $('pla-end-moral').textContent = t.endMoral;
    langBtn.textContent = state.lang==='id' ? 'EN' : 'ID';
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
  }

  function buildDots(){
    dotsEl.innerHTML = '';
    for (var i=0;i<TOTAL_STEPS;i++){
      var d = document.createElement('div');
      d.className = 'pla-dot';
      dotsEl.appendChild(d);
    }
    updateDots();
  }
  function updateDots(){
    var dots = dotsEl.children;
    for (var i=0;i<dots.length;i++){
      dots[i].className = 'pla-dot' + (i===state.stepIndex ? ' pla-active' : (i<state.stepIndex ? ' pla-done' : ''));
    }
  }

  function currentStepData(){
    return T().steps[state.stepIndex];
  }

  function renderStep(speakNow){
    var stepData = currentStepData();
    captionEl.textContent = stepData.text;
    updateDots();
    stopHold();
    resetSneakIfNeeded();

    var kind = stepData.kind;
    if (kind === 'sneak' || kind === 'row' || kind === 'grind'){
      nextBtn.style.display = 'none';
      actionBtn.style.display = 'inline-block';
      actionBarWrap.style.display = 'block';
      actionBarFill.style.width = '0%';
      if (kind === 'sneak') actionBtn.textContent = T().hideBtn;
      if (kind === 'row') actionBtn.textContent = T().rowBtn;
      if (kind === 'grind') actionBtn.textContent = T().grindBtn;
    } else {
      nextBtn.style.display = 'inline-block';
      actionBtn.style.display = 'none';
      actionBarWrap.style.display = 'none';
    }

    if (speakNow) speak(stepData.text);
    notifyResize();
  }

  function resetSneakIfNeeded(){
    state.sneak.angle = 0.6;
    state.sneak.dir = -1;
    state.sneak.hits = 0;
    state.sneak.flash = 0;
    state.sneak.speed = 0.028;
  }

  /* ================== HOLD MECHANIC ================== */
  function startHold(){
    if (state.hold.active) return;
    state.hold.active = true;
    state.hold.lastTick = performance.now();
    actionBtn.classList.add('pla-pressed');
  }
  function stopHold(){
    state.hold.active = false;
    actionBtn.classList.remove('pla-pressed');
  }
  function resetHoldProgress(){
    state.hold.progress = 0;
    actionBarFill.style.width = '0%';
  }

  var lastGrindMsgIdx = -1;
  function tickHold(dt){
    if (!state.hold.active) return;
    var stepData = currentStepData();
    if (!stepData || (stepData.kind!=='row' && stepData.kind!=='grind')) return;
    var speed = stepData.kind==='row' ? 0.00042 : 0.00034;
    state.hold.progress = Math.min(1, state.hold.progress + dt*speed);
    actionBarFill.style.width = (state.hold.progress*100).toFixed(1)+'%';

    if (stepData.kind === 'grind' && stepData.progressText){
      var thresholds = [0.3,0.65,0.9];
      var idx = -1;
      for (var i=0;i<thresholds.length;i++){
        if (state.hold.progress >= thresholds[i]) idx = i;
      }
      if (idx>=0 && idx!==lastGrindMsgIdx){
        lastGrindMsgIdx = idx;
        captionEl.textContent = stepData.progressText[idx];
        speak(stepData.progressText[idx]);
      }
    }

    if (state.hold.progress >= 1){
      stopHold();
      lastGrindMsgIdx = -1;
      setTimeout(function(){ goNext(); }, 500);
    }
  }

  /* ================== SNEAK MECHANIC ================== */
  function tickSneak(dt){
    var stepData = currentStepData();
    if (!stepData || stepData.kind!=='sneak') return;
    state.sneak.angle += state.sneak.dir * state.sneak.speed * (dt/16.67);
    if (state.sneak.angle > 0.62){ state.sneak.angle = 0.62; state.sneak.dir = -1; }
    if (state.sneak.angle < -0.62){ state.sneak.angle = -0.62; state.sneak.dir = 1; }
    if (state.sneak.flash>0) state.sneak.flash = Math.max(0, state.sneak.flash - dt*0.004);
  }

  function attemptSneak(){
    var stepData = currentStepData();
    if (!stepData || stepData.kind!=='sneak') return;
    if (isSneakSafe(state)){
      state.sneak.hits++;
      state.sneak.speed = Math.min(0.05, state.sneak.speed + 0.004);
      if (state.sneak.hits >= state.sneak.needed){
        setTimeout(function(){ goNext(); }, 450);
      }
    } else {
      state.sneak.flash = 1;
    }
  }

  /* ================== NAVIGATION ================== */
  function goNext(){
    stopSpeak();
    if (state.stepIndex < TOTAL_STEPS - 1){
      state.stepIndex++;
      renderStep(true);
    } else {
      showEnd();
    }
  }

  function showCover(){
    state.screen = 'cover';
    $('pla-cover').style.display = 'flex';
    $('pla-stage').style.display = 'none';
    $('pla-end').style.display = 'none';
    notifyResize();
  }

  function showGame(){
    state.screen = 'game';
    state.stepIndex = 0;
    $('pla-cover').style.display = 'none';
    $('pla-stage').style.display = 'flex';
    $('pla-end').style.display = 'none';
    buildDots();
    renderStep(true);
    notifyResize();
  }

  function showEnd(){
    state.screen = 'end';
    $('pla-cover').style.display = 'none';
    $('pla-stage').style.display = 'none';
    $('pla-end').style.display = 'flex';
    notifyResize();
  }

  /* ================== EVENTS ================== */
  $('pla-start-btn').addEventListener('click', function(){ showGame(); });
  $('pla-replay-btn').addEventListener('click', function(){ showGame(); });
  nextBtn.addEventListener('click', goNext);

  actionBtn.addEventListener('click', function(){
    var stepData = currentStepData();
    if (stepData && stepData.kind === 'sneak') attemptSneak();
  });

  function bindHoldEvents(el){
    var onDown = function(e){ e.preventDefault(); startHold(); };
    var onUp = function(e){ stopHold(); };
    el.addEventListener('mousedown', onDown);
    el.addEventListener('touchstart', onDown, {passive:false});
    el.addEventListener('mouseup', onUp);
    el.addEventListener('mouseleave', onUp);
    el.addEventListener('touchend', onUp);
    el.addEventListener('touchcancel', onUp);
  }
  bindHoldEvents(actionBtn);

  langBtn.addEventListener('click', function(){
    state.lang = state.lang==='id' ? 'en' : 'id';
    try{ localStorage.setItem('pla_lang', state.lang); }catch(e){}
    applyStaticText();
    if (state.screen==='game') renderStep(true);
    notifyResize();
  });

  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    try{ localStorage.setItem('pla_muted', state.muted ? '1':'0'); }catch(e){}
    applyStaticText();
    if (state.muted) stopSpeak();
  });

  window.addEventListener('resize', function(){
    fitCanvas(coverCanvas); fitCanvas(stageCanvas); fitCanvas(endCanvas);
    notifyResize();
  });

  /* ================== MAIN LOOP ================== */
  var lastFrame = performance.now();
  function loop(now){
    var dt = now - lastFrame;
    lastFrame = now;
    state.animT += dt/1000;

    fitCanvas(coverCanvas);
    fitCanvas(stageCanvas);
    fitCanvas(endCanvas);

    if (state.screen==='cover'){
      var c = coverCanvas.getContext('2d');
      drawCoverScene(c, coverCanvas.__w, coverCanvas.__h, state.animT);
    } else if (state.screen==='game'){
      tickHold(dt);
      tickSneak(dt);
      var g = stageCanvas.getContext('2d');
      var fn = SCENES[state.stepIndex] || scene0;
      fn(g, stageCanvas.__w, stageCanvas.__h, state.animT, state);
    } else if (state.screen==='end'){
      var e = endCanvas.getContext('2d');
      scene6(e, endCanvas.__w, endCanvas.__h, state.animT);
    }
    requestAnimationFrame(loop);
  }

  /* ================== INIT ================== */
  applyStaticText();
  showCover();
  requestAnimationFrame(loop);
  setTimeout(notifyResize, 300);
  setTimeout(notifyResize, 1000);

})();
</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legenda Siamang Putih</title>
<style>
  :root{
    --sea-deep:#0b4f6c;
    --sea-mid:#1c7293;
    --gold:#e9b44c;
    --terracotta:#e76f51;
    --cream:#fdf6e9;
    --cream2:#f7ead2;
    --ink:#3a2e26;
    --ink-soft:#6b5a4d;
    --panel:#ffffff;
    --accent:#9c4221;
    --white-siamang:#f5f5f0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(180deg,#fdf6e9 0%,#f3e3c7 100%);
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:820px;
    padding:10px 12px 16px;
  }
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
  }
  #titleWrap{
    display:flex;
    flex-direction:column;
    line-height:1.1;
  }
  #titleWrap h1{
    font-size:16px;
    margin:0;
    color:var(--accent);
    font-weight:700;
  }
  #titleWrap span{
    font-size:11px;
    color:var(--ink-soft);
  }
  .iconbtn{
    background:var(--panel);
    border:2px solid var(--gold);
    border-radius:10px;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:17px;
    flex-shrink:0;
    transition:transform .15s ease, background .15s ease;
  }
  .iconbtn:hover{transform:translateY(-2px);}
  .iconbtn:active{transform:translateY(0);}
  .iconbtn.active{background:var(--gold);}
  #topControls{display:flex;gap:6px;}

  #stageWrap{
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    border:3px solid var(--gold);
    background:#0b4f6c;
    box-shadow:0 6px 18px rgba(58,46,38,.25);
  }
  #game{
    display:block;
    width:100%;
    height:auto;
  }

  #captionPanel{
    margin-top:10px;
    background:var(--panel);
    border:2px solid var(--cream2);
    border-left:6px solid var(--terracotta);
    border-radius:10px;
    padding:12px 14px;
    min-height:44px;
  }
  #captionText{
    margin:0;
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
  }

  #instructionPanel{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cream2);
    border-radius:10px;
    padding:9px 12px;
  }
  #instructionPanel .ic{font-size:16px;flex-shrink:0;}
  #instructionText{
    margin:0;
    font-size:13px;
    font-style:italic;
    color:var(--accent);
    font-weight:600;
  }

  #dynamicControls{
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    min-height:10px;
  }
  .gamebtn{
    background:linear-gradient(180deg,var(--terracotta),#c9502f);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 0 #9c3e21;
    transition:transform .1s ease, box-shadow .1s ease;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .gamebtn:active{transform:translateY(3px);box-shadow:0 1px 0 #9c3e21;}
  .gamebtn.secondary{
    background:linear-gradient(180deg,#1c7293,#0b4f6c);
    box-shadow:0 4px 0 #073a51;
  }
  .gamebtn.secondary:active{box-shadow:0 1px 0 #073a51;}
  .gamebtn.done{
    background:linear-gradient(180deg,#9aa5a0,#7c8781);
    box-shadow:0 4px 0 #5f6864;
    cursor:default;
  }
  .gamebtn.seq-done{
    background:linear-gradient(180deg,#e9b44c,#cf9a2f);
    box-shadow:0 4px 0 #a97c1f;
  }
  .gamebtn:disabled{opacity:.55;cursor:default;}

  #progressWrap{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:14px;
  }
  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#d9c6a3;
    transition:background .25s ease, transform .25s ease;
  }
  .dot.active{background:var(--terracotta);transform:scale(1.3);}
  .dot.filled{background:var(--gold);}

  #barWrap{
    width:100%;
    max-width:280px;
    height:16px;
    background:#e3d3ae;
    border-radius:10px;
    overflow:hidden;
    border:2px solid var(--gold);
    margin:2px auto 0;
  }
  #barFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--terracotta),var(--gold));
    transition:width .12s ease;
  }

  footer{
    text-align:center;
    margin-top:16px;
    font-size:11px;
    color:var(--ink-soft);
    opacity:.75;
  }

  #startOverlay, #endOverlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(180deg,rgba(11,79,108,.55),rgba(11,79,108,.85));
    color:#fff;
  }
  #startOverlay h2, #endOverlay h2{
    font-size:22px;
    margin:6px 0;
    text-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  #startOverlay p, #endOverlay p{
    font-size:13px;
    max-width:420px;
    margin:4px 0 14px;
    opacity:.95;
  }

  @media (max-width:480px){
    #titleWrap h1{font-size:14px;}
    .gamebtn{font-size:13px;padding:10px 14px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="titleWrap">
      <h1 id="hTitle">Legenda Siamang Putih</h1>
      <span id="hSub">Cerita Rakyat Sumatra Barat</span>
    </div>
    <div id="topControls">
      <button class="iconbtn" id="langBtn" title="Ganti Bahasa">🌐</button>
      <button class="iconbtn" id="muteBtn" title="Bisukan Narasi">🔊</button>
    </div>
  </div>

  <div id="stageWrap">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="startOverlay">
      <h2 id="startTitle">Legenda Siamang Putih</h2>
      <p id="startDesc">Sebuah kisah cinta dan sumpah setia yang terlanggar, dari pesisir Sumatra Barat.</p>
      <button class="gamebtn" id="startBtn">▶ <span id="startBtnLabel">Mulai Cerita</span></button>
    </div>
    <div id="endOverlay" style="display:none;">
      <h2 id="endTitle">Tamat</h2>
      <p id="endDesc">Sumpah yang terlanggar membawa duka bagi keduanya.</p>
      <button class="gamebtn" id="replayBtn">↻ <span id="replayBtnLabel">Ulangi Cerita</span></button>
    </div>
  </div>

  <div id="captionPanel"><p id="captionText">—</p></div>
  <div id="instructionPanel" style="visibility:hidden;">
    <span class="ic">👉</span><p id="instructionText">—</p>
  </div>

  <div id="dynamicControls"></div>

  <div id="progressWrap"></div>

  <footer id="footerText">Kisah rakyat turun-temurun — dituturkan kembali secara interaktif.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ============ LANGUAGE ============ */
  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'en' ? 'en' : 'id';

  var UI = {
    id:{
      title:"Legenda Siamang Putih",
      sub:"Cerita Rakyat Sumatra Barat",
      startTitle:"Legenda Siamang Putih",
      startDesc:"Sebuah kisah cinta dan sumpah setia yang terlanggar, dari pesisir Sumatra Barat.",
      startBtn:"Mulai Cerita",
      endTitle:"Tamat",
      endDesc:"Sumpah yang terlanggar membawa duka bagi keduanya.",
      replayBtn:"Ulangi Cerita",
      nextBtn:"Lanjut",
      footer:"Kisah rakyat turun-temurun — dituturkan kembali secara interaktif.",
      muteOn:"Bisukan Narasi",
      muteOff:"Aktifkan Suara"
    },
    en:{
      title:"The Legend of the White Gibbon",
      sub:"Folktale from West Sumatra",
      startTitle:"The Legend of the White Gibbon",
      startDesc:"A tale of love and a broken vow, from the coast of West Sumatra.",
      startBtn:"Start Story",
      endTitle:"The End",
      endDesc:"A broken promise brought sorrow to them both.",
      replayBtn:"Replay Story",
      nextBtn:"Next",
      footer:"A traditional folktale — retold as an interactive story.",
      muteOn:"Mute Narration",
      muteOff:"Unmute Narration"
    }
  };

  /* ============ MUTE ============ */
  var STORAGE_KEY = 'lsp-muted';
  var muted = false;
  try{ muted = localStorage.getItem(STORAGE_KEY) === '1'; }catch(e){}

  /* ============ CANVAS SETUP ============ */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var CW = 800, CH = 450;
  var DPR = Math.max(1, window.devicePixelRatio || 1);

  function fitCanvas(){
    canvas.width = CW * DPR;
    canvas.height = CH * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  fitCanvas();

  /* ============ RESIZE / IFRAME AUTORESIZE ============ */
  function reportHeight(){
    var wrap = document.getElementById('app');
    var h = wrap.getBoundingClientRect().height + 24;
    try{
      window.parent.postMessage({ type:'lsp-resize', height: Math.ceil(h) }, '*');
    }catch(e){}
  }
  window.addEventListener('load', function(){ setTimeout(reportHeight, 80); });
  window.addEventListener('resize', function(){ setTimeout(reportHeight, 80); });

  /* ============ SPEECH ============ */
  var synth = window.speechSynthesis;
  var currentUtterance = null;
  function speak(text){
    if(!synth || muted || !text) return;
    try{ synth.cancel(); }catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'en' ? 'en-US' : 'id-ID';
    u.rate = 0.95;
    u.pitch = 1.02;
    currentUtterance = u;
    synth.speak(u);
  }
  function stopSpeak(){
    if(synth){ try{ synth.cancel(); }catch(e){} }
  }

  /* ============ DRAW HELPERS (procedural art) ============ */
  function grad(x0,y0,x1,y1,stops){
    var g = ctx.createLinearGradient(x0,y0,x1,y1);
    stops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
    return g;
  }

  function drawSky(sunset){
    var stops = sunset
      ? [[0,'#f6c453'],[0.45,'#e8815a'],[1,'#8a4b6b']]
      : [[0,'#bfe3ea'],[0.6,'#8fc7d6'],[1,'#e8dcb8']];
    ctx.fillStyle = grad(0,0,0,CH*0.62, stops);
    ctx.fillRect(0,0,CW,CH*0.62);
  }

  function drawSun(x,y,r,color){
    ctx.save();
    ctx.fillStyle = color || '#f6d365';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawSea(offset){
    offset = offset || 0;
    var top = CH*0.6;
    ctx.fillStyle = grad(0,top,0,CH,[[0,'#1c7293'],[1,'#0b4f6c']]);
    ctx.fillRect(0,top,CW,CH-top);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    for(var i=0;i<6;i++){
      var y = top + 14 + i*13;
      ctx.beginPath();
      for(var x=-20;x<=CW+20;x+=20){
        var wy = y + Math.sin((x+offset*40+i*30)/40)*3;
        if(x===-20) ctx.moveTo(x,wy); else ctx.lineTo(x,wy);
      }
      ctx.stroke();
    }
  }

  function drawHills(){
    ctx.fillStyle = '#3f6b58';
    ctx.beginPath();
    ctx.moveTo(0,CH*0.62);
    ctx.quadraticCurveTo(CW*0.2,CH*0.46,CW*0.42,CH*0.6);
    ctx.quadraticCurveTo(CW*0.65,CH*0.72,CW,CH*0.55);
    ctx.lineTo(CW,CH*0.62);
    ctx.closePath();
    ctx.fill();
  }

  // Iconic Minangkabau curved-horn roof house
  function drawRumahGadang(x,y,scale,accent){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // stilts
    ctx.fillStyle = '#6b4a34';
    for(var i=-2;i<=2;i++){ ctx.fillRect(i*24-3, 10, 6, 30); }
    // body
    ctx.fillStyle = accent || '#8a5a3c';
    ctx.fillRect(-70,-20,140,34);
    ctx.fillStyle = '#c98b4e';
    ctx.fillRect(-70,-20,140,8);
    // windows
    ctx.fillStyle = '#3a2e26';
    for(var w=-45;w<=45;w+=30){ ctx.fillRect(w-6,-12,12,16); }
    // roof horns (gonjong) - multiple curved peaks
    ctx.fillStyle = '#5b3a2a';
    function horn(cx){
      ctx.beginPath();
      ctx.moveTo(cx-34,-20);
      ctx.quadraticCurveTo(cx-20,-70,cx,-95);
      ctx.quadraticCurveTo(cx+20,-70,cx+34,-20);
      ctx.quadraticCurveTo(cx,-34,cx-34,-20);
      ctx.closePath();
      ctx.fill();
    }
    horn(-38); horn(0); horn(38);
    ctx.restore();
  }

  function drawShip(x,y,scale,sailColor,damaged){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    // hull
    ctx.fillStyle = '#6b4a34';
    ctx.beginPath();
    ctx.moveTo(-50,0);
    ctx.quadraticCurveTo(-55,18,-30,20);
    ctx.lineTo(30,20);
    ctx.quadraticCurveTo(55,18,50,0);
    ctx.closePath();
    ctx.fill();
    // mast
    ctx.strokeStyle = '#4a3323';
    ctx.lineWidth = 4;
    ctx.beginPath();
    if(damaged){
      ctx.moveTo(0,0); ctx.lineTo(-8,-30);
    } else {
      ctx.moveTo(0,0); ctx.lineTo(0,-55);
    }
    ctx.stroke();
    // sail
    ctx.fillStyle = sailColor || '#fdf6e9';
    if(damaged){
      ctx.beginPath();
      ctx.moveTo(-8,-30); ctx.lineTo(18,-14); ctx.lineTo(-8,-4);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(0,-52); ctx.lineTo(38,-8); ctx.lineTo(0,-4);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawStorm(t){
    ctx.save();
    ctx.fillStyle = 'rgba(40,40,60,'+(0.35+0.15*Math.sin(t*3))+')';
    ctx.fillRect(0,0,CW,CH*0.62);
    ctx.strokeStyle = 'rgba(230,240,255,0.55)';
    ctx.lineWidth = 2;
    for(var i=0;i<18;i++){
      var rx = (i*53 + t*220) % (CW+40) - 20;
      var ry = (i*37 + t*260) % (CH*0.6);
      ctx.beginPath();
      ctx.moveTo(rx,ry);
      ctx.lineTo(rx-10,ry+18);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Generic stylized person: head + robe. pose: 0 normal,1 sad(head down),2 joyful
  function drawPerson(x,y,scale,robeColor,opts){
    opts = opts || {};
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    var headTilt = opts.sad ? 0.25 : 0;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0,58,22,6,0,0,Math.PI*2); ctx.fill();
    // robe
    ctx.fillStyle = robeColor;
    ctx.beginPath();
    ctx.moveTo(-20,55); ctx.lineTo(-16,5); ctx.quadraticCurveTo(0,-8,16,5); ctx.lineTo(20,55);
    ctx.closePath(); ctx.fill();
    // sash
    if(opts.sash){
      ctx.fillStyle = opts.sash;
      ctx.fillRect(-18,20,36,8);
    }
    // arms
    ctx.strokeStyle = robeColor;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    if(opts.wave){
      ctx.beginPath(); ctx.moveTo(16,10); ctx.lineTo(34,-14); ctx.stroke();
    } else if(opts.handsJoined){
      ctx.beginPath(); ctx.moveTo(16,10); ctx.lineTo(30,22); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-16,10); ctx.lineTo(-24,32); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16,10); ctx.lineTo(24,32); ctx.stroke();
    }
    // neck+head group with tilt for sadness
    ctx.save();
    ctx.translate(0,-4);
    ctx.rotate(headTilt);
    // head
    ctx.fillStyle = '#e7b98d';
    ctx.beginPath(); ctx.arc(0,-16,13,0,Math.PI*2); ctx.fill();
    // hair / headwear
    if(opts.headwear === 'crown'){
      ctx.fillStyle = '#e9b44c';
      ctx.beginPath();
      ctx.moveTo(-13,-24); ctx.lineTo(-9,-38); ctx.lineTo(-3,-26);
      ctx.lineTo(0,-40); ctx.lineTo(3,-26); ctx.lineTo(9,-38); ctx.lineTo(13,-24);
      ctx.closePath(); ctx.fill();
    } else if(opts.headwear === 'tengkuluk'){
      // Minang woman's horn headdress
      ctx.fillStyle = opts.headColor || '#c9502f';
      ctx.beginPath();
      ctx.moveTo(-15,-22);
      ctx.quadraticCurveTo(-22,-42,-6,-48);
      ctx.quadraticCurveTo(0,-30,6,-48);
      ctx.quadraticCurveTo(22,-42,15,-22);
      ctx.quadraticCurveTo(0,-30,-15,-22);
      ctx.closePath(); ctx.fill();
    } else if(opts.headwear === 'peci'){
      ctx.fillStyle = opts.headColor || '#3a2e26';
      ctx.beginPath(); ctx.arc(0,-27,11,Math.PI,0); ctx.fill();
    } else {
      ctx.fillStyle = '#241a12';
      ctx.beginPath(); ctx.arc(0,-20,13.5,Math.PI*1.05,Math.PI*1.95); ctx.fill();
    }
    // face
    if(opts.sad){
      ctx.strokeStyle = '#3a2e26'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(-4,-15,1.6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(4,-15,1.6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-9,4,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    } else {
      ctx.fillStyle = '#3a2e26';
      ctx.beginPath(); ctx.arc(-4,-16,1.6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(4,-16,1.6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#3a2e26'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0,-13,4,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  function drawTear(x,y,t){
    var dy = (t%1)*20;
    ctx.save();
    ctx.globalAlpha = 1-(t%1);
    ctx.fillStyle = '#8fd3e8';
    ctx.beginPath();
    ctx.moveTo(x,y+dy);
    ctx.quadraticCurveTo(x-3,y+dy+6,x,y+dy+10);
    ctx.quadraticCurveTo(x+3,y+dy+6,x,y+dy);
    ctx.fill();
    ctx.restore();
  }

  function drawDreamBubble(x,y,scale,revealed){
    ctx.save();
    ctx.translate(x,y);
    ctx.globalAlpha = 0.95;
    // small connecting bubbles
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(-30,20,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-20,8,8,0,Math.PI*2); ctx.fill();
    // big cloud
    ctx.beginPath();
    ctx.ellipse(0,-20*scale,60*scale,42*scale,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#e9b44c';
    ctx.lineWidth = 3;
    ctx.stroke();
    if(revealed){
      drawPerson(0,10*scale,0.85*scale,'#3d6b8a',{headwear:'peci', wave:true});
    } else {
      ctx.fillStyle = '#c9b79c';
      ctx.font = (28*scale)+'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('?', 0, -8*scale);
    }
    ctx.restore();
  }

  function drawKetapangTree(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = '#6b4a34';
    ctx.fillRect(-8,0,16,70);
    ctx.fillStyle = '#3f6b3a';
    var layers = [[0,-20,70],[-30,-45,55],[30,-45,55],[0,-70,50]];
    layers.forEach(function(l){
      ctx.beginPath(); ctx.ellipse(l[0],l[1],l[2],32,0,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function drawSiamang(x,y,scale,pose){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0,34,16,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f5f5f0';
    // body
    ctx.beginPath(); ctx.ellipse(0,10,14,20,0,0,Math.PI*2); ctx.fill();
    // arms raised if crying pose
    ctx.strokeStyle = '#f5f5f0';
    ctx.lineWidth = 7; ctx.lineCap='round';
    if(pose==='cry'){
      ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-26,-18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(26,-18); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-10,4); ctx.lineTo(-20,22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10,4); ctx.lineTo(20,22); ctx.stroke();
    }
    // head
    ctx.fillStyle = '#f5f5f0';
    ctx.beginPath(); ctx.arc(0,-10,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a2e26';
    ctx.beginPath(); ctx.arc(-4,-11,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-11,1.5,0,Math.PI*2); ctx.fill();
    if(pose==='cry'){
      ctx.beginPath(); ctx.arc(0,-4,4,0,Math.PI*2); ctx.fill();
    } else {

  /* ============ DOM refs ============ */
  var captionText = document.getElementById('captionText');

  function buildDots(){
    progressWrap.innerHTML = '';
    for(var i=0;i<totalDots;i++){
      var d = document.createElement('div');
      d.className = 'dot';
      d.id = 'dot'+i;
      progressWrap.appendChild(d);
    }

  function updateDots(){
    for(var i=0;i<totalDots;i++){
      var d = document.getElementById('dot'+i);
      if(!d) continue;
      d.className = 'dot' + (i<currentScene?' filled':'') + (i===currentScene?' active':'');
    }
  }

  /* ============ RENDER ============ */
  function render(){
    ctx.clearRect(0,0,CW,CH);
    if(currentScene>=0 && currentScene<storyScenes.length){
      storyScenes[currentScene].draw(animState);
    } else if(currentScene<0){
      // idle background behind start overlay
      drawSky(true); drawSun(660,90,46,'#f6d365'); drawHills(); drawSea(animState.t);
      drawRumahGadang(220,CH*0.62,1.0,'#8a5a3c');
      drawKetapangTree(620,CH*0.62,1.0);
    } else {
      // end background
      drawSky(true); drawSun(150,90,40,'#e8815a'); drawHills(); drawSea(animState.t);
      drawKetapangTree(600,CH*0.6,1.2);
      drawSiamang(600,CH*0.6-70,1.0,'cry');

  /* ============ SCENE FLOW ============ */
  function setCaption(sc){
    captionText.textContent = sc.caption[lang];
  }
  function setInstruction(sc){
    if(sc.instruction){
      instructionText.textContent = sc.instruction[lang];
      instructionPanel.style.visibility = 'visible';
    } else {
      instructionPanel.style.visibility = 'hidden';
    }

  function clearControls(){
    dynamicControls.innerHTML = '';
  }

  function addNextButton(){
    var btn = document.createElement('button');
    btn.className = 'gamebtn';
    btn.innerHTML = '▶ <span>'+UI[lang].nextBtn+'</span>';
    btn.onclick = function(){ goToScene(currentScene+1); };
    dynamicControls.appendChild(btn);
  }

  function goToScene(idx){
    stopSpeak();
    if(idx>=storyScenes.length){
      endStory();
      return;
    }
    currentScene = idx;
    updateDots();
    var sc = storyScenes[idx];
    setCaption(sc);
    setInstruction(sc);
    clearControls();
    speak(sc.caption[lang]);
    setupInteraction(sc);
    setTimeout(reportHeight, 60);
  }

  function setupInteraction(sc){
    if(sc.type === 'tap-once'){
      sceneProgress[sc.key] = { p:0 };
      var btn = document.createElement('button');
      btn.className = 'gamebtn';
      btn.innerHTML = sc.buttonLabel[lang];
      btn.onclick = function(){
        if(sceneProgress[sc.key].p>0) return;
        sceneProgress[sc.key].p = 1;
        btn.classList.add('done');
        btn.disabled = true;
        addNextButton();
      };
      dynamicControls.appendChild(btn);
    }
    else if(sc.type === 'tap-mash'){
      sceneProgress[sc.key] = { p:0 };
      var wrap = document.createElement('div');
      wrap.style.display='flex';
      wrap.style.flexDirection='column';
      wrap.style.alignItems='center';
      wrap.style.gap='8px';
      wrap.style.width='100%';

      var barWrap = document.createElement('div');
      barWrap.id='barWrap';
      var barFill = document.createElement('div');
      barFill.id='barFill';
      barWrap.appendChild(barFill);

      var btn = document.createElement('button');
      btn.className = 'gamebtn';
      btn.innerHTML = sc.buttonLabel[lang];
      btn.onclick = function(){
        var st = sceneProgress[sc.key];
        if(st.p>=sc.target) return;
        st.p++;
        barFill.style.width = Math.min(100,(st.p/sc.target)*100)+'%';
        if(st.p>=sc.target){
          btn.classList.add('done');
          btn.disabled = true;
          addNextButton();
        }
      };
      wrap.appendChild(btn);
      wrap.appendChild(barWrap);
      dynamicControls.appendChild(wrap);
    }
    else if(sc.type === 'sequential'){
      sceneProgress[sc.key] = { step:0 };
      sc.seqLabels.forEach(function(lbl, i){
        var btn = document.createElement('button');
        btn.className = 'gamebtn secondary';
        btn.innerHTML = lbl[lang];
        btn.onclick = function(){
          var st = sceneProgress[sc.key];
          if(st.step === i){
            st.step = i+1;
            btn.classList.remove('secondary');
            btn.classList.add('seq-done');
            btn.disabled = true;
            if(st.step === sc.seqLabels.length){
              addNextButton();
            }
          }
        };
        dynamicControls.appendChild(btn);
      });
    }
    else if(sc.type === 'hold'){
      sceneProgress[sc.key] = { p:0 };
      var wrap = document.createElement('div');
      wrap.style.display='flex';
      wrap.style.flexDirection='column';
      wrap.style.alignItems='center';
      wrap.style.gap='8px';
      wrap.style.width='100%';

      var barWrap = document.createElement('div');
      barWrap.id='barWrap';
      var barFill = document.createElement('div');
      barFill.id='barFill';
      barWrap.appendChild(barFill);

      var btn = document.createElement('button');
      btn.className = 'gamebtn';
      btn.innerHTML = sc.buttonLabel[lang];
      var holdTimer = null, startTime = null, doneFlag=false;
      function step(){
        if(doneFlag) return;
        var elapsed = Date.now()-startTime;
        var p = Math.min(1, elapsed/sc.holdDuration);
        sceneProgress[sc.key].p = p;
        barFill.style.width = (p*100)+'%';
        if(p>=1){
          doneFlag = true;
          btn.classList.add('done');
          btn.disabled = true;
          addNextButton();
          return;
        }
        holdTimer = requestAnimationFrame(step);
      }
      function startHold(e){
        e.preventDefault();
        if(doneFlag) return;
        startTime = Date.now();
        holdTimer = requestAnimationFrame(step);
      }
      function endHold(){
        if(doneFlag) return;
        if(holdTimer) cancelAnimationFrame(holdTimer);
        sceneProgress[sc.key].p = 0;
        barFill.style.width = '0%';
        btn.disabled = false;
      }
      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('touchstart', startHold, {passive:false});
      btn.addEventListener('mouseup', endHold);
      btn.addEventListener('mouseleave', endHold);
      btn.addEventListener('touchend', endHold);
      wrap.appendChild(btn);
      wrap.appendChild(barWrap);
      dynamicControls.appendChild(wrap);
    }
  }

  function startStory(){
    startOverlay.style.display = 'none';
    endOverlay.style.display = 'none';
    sceneProgress = {};
    goToScene(0);
  }

  function endStory(){
    currentScene = storyScenes.length;
    updateDots();
    clearControls();
    instructionPanel.style.visibility = 'hidden';
    captionText.textContent = lang==='en'
      ? "The gibbon was later found dead atop the Ketaping tree. Word came that Sutan Rumandung, too, had perished — his ship sank as he tried to marry another. Both had broken their sacred vow."
      : "Siamang putih itu akhirnya ditemukan mati di atas pohon Ketaping. Kabar pun sampai bahwa Sutan Rumandung telah tiada — kapalnya karam saat hendak menikahi wanita lain. Keduanya sama-sama melanggar sumpah suci mereka.";
    speak(captionText.textContent);
    endOverlay.style.display = 'flex';
    setTimeout(reportHeight, 60);
  }

    document.getElementById('startBtnLabel').textContent = UI[lang].startBtn;
    document.getElementById('endTitle').textContent = UI[lang].endTitle;
    document.getElementById('replayBtnLabel').textContent = UI[lang].replayBtn;
    document.getElementById('footerText').textContent = UI[lang].footer;
    document.getElementById('muteBtn').title = muted ? UI[lang].muteOff : UI[lang].muteOn;
    document.getElementById('langBtn').textContent = lang==='id' ? '🇬🇧' : '🇮🇩';

    if(currentScene>=0 && currentScene<storyScenes.length){
      var sc = storyScenes[currentScene];
      setCaption(sc);
      setInstruction(sc);
      // rebuild controls labels in-place (rebuild without resetting progress feels safer)
      refreshControlLabels(sc);
    } else if(currentScene>=storyScenes.length){
      endOverlay.style.display = 'flex';
      document.getElementById('endDesc').textContent = UI[lang].endDesc;
      captionText.textContent = lang==='en'
        ? "The gibbon was later found dead atop the Ketaping tree. Word came that Sutan Rumandung, too, had perished — his ship sank as he tried to marry another. Both had broken their sacred vow."
        : "Siamang putih itu akhirnya ditemukan mati di atas pohon Ketaping. Kabar pun sampai bahwa Sutan Rumandung telah tiada — kapalnya karam saat hendak menikahi wanita lain. Keduanya sama-sama melanggar sumpah suci mereka.";
    }
    setTimeout(reportHeight, 60);
  }

  function refreshControlLabels(sc){
    // Simplest robust approach: rebuild the interaction controls from scratch,
    // but preserve completion state where possible.
    var st = sceneProgress[sc.key];
    clearControls();
    if(sc.type==='tap-once'){
      var doneAlready = st && st.p>0;
      setupInteraction(sc);
      if(doneAlready){
        sceneProgress[sc.key].p = 1;
        var b = dynamicControls.querySelector('button');
        if(b){ b.classList.add('done'); b.disabled = true; }
        addNextButton();
      }
    } else if(sc.type==='tap-mash'){
      var prevP = st ? st.p : 0;
      setupInteraction(sc);
      sceneProgress[sc.key].p = prevP;
      var fill = document.getElementById('barFill');
      if(fill) fill.style.width = Math.min(100,(prevP/sc.target)*100)+'%';
      if(prevP>=sc.target){
        var b2 = dynamicControls.querySelector('button');
        if(b2){ b2.classList.add('done'); b2.disabled = true; }
        addNextButton();
      }
    } else if(sc.type==='sequential'){
      var prevStep = st ? st.step : 0;
      setupInteraction(sc);
      sceneProgress[sc.key].step = prevStep;
      var btns = dynamicControls.querySelectorAll('button');
      btns.forEach(function(b,i){
        if(i<prevStep){ b.classList.remove('secondary'); b.classList.add('seq-done'); b.disabled = true; }
      });
      if(prevStep>=sc.seqLabels.length){ addNextButton(); }
    } else if(sc.type==='hold'){
      var prevHold = st ? st.p : 0;
      setupInteraction(sc);
      if(prevHold>=1){
        sceneProgress[sc.key].p = 1;
        var b3 = dynamicControls.querySelector('button');
        if(b3){ b3.classList.add('done'); b3.disabled = true; }
        var fill3 = document.getElementById('barFill');
        if(fill3) fill3.style.width='100%';
        addNextButton();
      }
    }
  }

  document.getElementById('langBtn').addEventListener('click', function(){
    lang = lang === 'id' ? 'en' : 'id';
    applyLanguage();
  });

  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    try{ localStorage.setItem(STORAGE_KEY, muted ? '1':'0'); }catch(e){}
    var btn = document.getElementById('muteBtn');
    btn.textContent = muted ? '🔇' : '🔊';
    btn.classList.toggle('active', muted);
    btn.title = muted ? UI[lang].muteOff : UI[lang].muteOn;
    if(muted) stopSpeak();
  });
  // init mute icon
  (function(){
    var btn = document.getElementById('muteBtn');
    btn.textContent = muted ? '🔇' : '🔊';
    btn.classList.toggle('active', muted);
  })();

  document.getElementById('startBtn').addEventListener('click', startStory);
  document.getElementById('replayBtn').addEventListener('click', startStory);

  /* ============ INIT ============ */
  applyLanguage();
  updateDots();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>

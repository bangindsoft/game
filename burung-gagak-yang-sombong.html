<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burung Gagak yang Sombong</title>
<style>
  :root{
    --bg1:#1c2b1e;
    --bg2:#3a4a2b;
    --panel:#fdf6e3;
    --ink:#2b2313;
    --accent:#c9862f;
    --accent2:#7a3b2e;
    --gold:#e0a944;
    --line:#d8c79a;
    --danger:#9b3b3b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Trebuchet MS',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:14px;
    min-height:100vh;
  }
  .wrap{
    width:100%;
    max-width:640px;
    background:var(--panel);
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    overflow:hidden;
    border:3px solid var(--gold);
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    color:#fff8ea;
  }
  header h1{
    font-size:15px;
    margin:0;
    font-weight:700;
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header h1 .ico{font-size:18px;}
  .controls{display:flex;gap:6px;}
  .iconbtn{
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.4);
    color:#fff8ea;
    border-radius:8px;
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:14px;
    transition:background .2s;
  }
  .iconbtn:hover{background:rgba(255,255,255,.32);}
  .iconbtn.active{background:#fff8ea;color:var(--accent2);}
  .langbtn{
    font-size:11px;
    font-weight:700;
    width:auto;
    padding:0 9px;
  }

  .stage{position:relative;background:#0f1a12;}
  canvas{display:block;width:100%;height:auto;background:#0f1a12;}

  .screen{display:none;padding:18px 18px 14px;}
  .screen.active{display:block;}

  /* Cover */
  #cover{text-align:center;padding:22px 18px 20px;}
  #cover .cover-canvas-wrap{
    border-radius:14px;overflow:hidden;border:2px solid var(--line);margin-bottom:14px;
  }
  #cover h2{
    font-size:22px;margin:4px 0 6px;color:var(--accent2);
  }
  #cover p{font-size:13.5px;line-height:1.55;color:#4a3d22;margin:0 0 16px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    color:#fff8ea;border:none;border-radius:999px;
    padding:12px 26px;font-size:15px;font-weight:700;
    cursor:pointer;box-shadow:0 6px 14px rgba(122,59,46,.4);
    transition:transform .15s;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{
    background:transparent;border:2px solid var(--accent2);color:var(--accent2);
    box-shadow:none;
  }

  /* Story screen */
  #story .storytext{
    font-size:14.5px;line-height:1.6;min-height:74px;
    padding:12px 4px 4px;color:#3a3018;
  }
  .promptline{
    font-size:12.5px;font-weight:700;color:var(--accent2);
    text-align:center;padding:2px 4px 8px;min-height:16px;
  }
  .bottombar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 4px 2px;
  }
  .dots{display:flex;gap:6px;}
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#d8c79a;transition:.2s;
  }
  .dot.on{background:var(--accent2);width:20px;border-radius:5px;}
  .navbtns{display:flex;gap:8px;}
  .navbtns .btn{padding:9px 18px;font-size:13.5px;}

  /* End screen */
  #ending{text-align:center;padding:20px 18px;}
  #ending h2{color:var(--accent2);margin:6px 0 10px;font-size:20px;}
  #ending p{font-size:13.5px;line-height:1.6;color:#4a3d22;}
  .moral{
    background:#f3e6c4;border-left:4px solid var(--gold);
    border-radius:8px;padding:12px 14px;margin:14px 0;
    font-size:13px;text-align:left;color:#4a3d22;
  }

  footer{
    text-align:center;font-size:10.5px;color:#8a7a4f;
    padding:8px 10px 12px;letter-spacing:.2px;
  }

  .feather-hint{
    text-align:center;font-size:12px;color:var(--accent2);font-weight:700;
    padding:4px 0 0;
  }
  .progress-track{
    height:8px;background:#e4d6ac;border-radius:999px;overflow:hidden;margin:8px 4px 0;
  }
  .progress-fill{
    height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--accent2));
    transition:width .15s;
  }

  @media (max-width:420px){
    header h1{font-size:13px;}
    #cover h2{font-size:19px;}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <header>
    <h1><span class="ico">🐦‍⬛</span><span id="headerTitle">Burung Gagak yang Sombong</span></h1>
    <div class="controls">
      <button class="iconbtn langbtn" id="langBtn" title="Language">EN</button>
      <button class="iconbtn active" id="muteBtn" title="Mute/Unmute">🔊</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="canvas" width="640" height="360"></canvas>
  </div>

  <!-- COVER SCREEN -->
  <div class="screen active" id="cover">
    <h2 id="coverTitle">Burung Gagak yang Sombong</h2>
    <p id="coverDesc">Sebuah dongeng dari Jawa Timur tentang seekor burung gagak yang ingin terlihat secantik burung merak. Ikuti kisahnya dan temukan pesan berharga di baliknya.</p>
    <button class="btn" id="startBtn">▶ <span id="startLabel">Mulai Cerita</span></button>
  </div>

  <!-- STORY SCREEN -->
  <div class="screen" id="story">
    <div class="storytext" id="storyText"></div>
    <div class="promptline" id="promptLine"></div>
    <div class="progress-track" id="progressTrack" style="display:none;">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="bottombar">
      <div class="dots" id="dots"></div>
      <div class="navbtns">
        <button class="btn" id="nextBtn">Lanjut ▸</button>
      </div>
    </div>
  </div>

  <!-- ENDING SCREEN -->
  <div class="screen" id="ending">
    <h2 id="endTitle">Tamat</h2>
    <div class="moral" id="moralBox"></div>
    <button class="btn secondary" id="replayBtn">↺ <span id="replayLabel">Ulangi Cerita</span></button>
  </div>

  <footer id="footerText">Cerita Rakyat Nusantara • Dongeng Interaktif untuk Anak</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- i18n ---------------- */
  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'en' ? 'en' : 'id';

  const T = {
    id:{
      headerTitle:"Burung Gagak yang Sombong",
      coverTitle:"Burung Gagak yang Sombong",
      coverDesc:"Sebuah dongeng dari Jawa Timur tentang seekor burung gagak yang ingin terlihat secantik burung merak. Ikuti kisahnya dan temukan pesan berharga di baliknya.",
      startLabel:"Mulai Cerita",
      next:"Lanjut ▸",
      finish:"Selesai ▸",
      replayLabel:"Ulangi Cerita",
      endTitle:"Tamat",
      footer:"Cerita Rakyat Nusantara • Dongeng Interaktif untuk Anak",
      langBtn:"EN",
      collectHint:(n,t)=>`Ketuk bulu merak untuk mengumpulkannya (${n}/${t})`,
      windHint:"Ketuk gagak berkali-kali untuk menahan bulunya!",
      windDone:"Angin terlalu kencang... bulu-bulunya mulai lepas.",
      moral:"Pesan Moral: Bersyukurlah atas dirimu sendiri apa adanya. Kesombongan dan keinginan menjadi orang lain hanya akan membawa penyesalan dan kesepian.",
      steps:[
        "Di sebuah hutan belantara di Jawa Timur, hiduplah seekor burung gagak bersama kawanan gagak lainnya. Ia tampak biasa saja, namun dalam hatinya tersimpan rasa tidak puas dengan bulunya yang hitam legam.",
        "Suatu hari, ia menemukan rontokan bulu merak yang berwarna-warni dan indah tergeletak di tanah hutan.",
        "Dengan penuh rasa kagum, si gagak berpikir, \u201cAlangkah indahnya bulu-bulu ini. Jika kukenakan, aku pasti terlihat secantik burung merak.\u201d Ia pun menyematkan bulu-bulu itu ke tubuhnya.",
        "Dengan bulu-bulu merak menempel di tubuhnya, si gagak terbang tinggi mencari kawanan burung merak, berharap bisa diterima menjadi bagian dari mereka.",
        "Awalnya, kawanan merak menerima kedatangannya dengan baik. Namun, sikap sombong si gagak membuat mereka mulai jengkel dan sedikit demi sedikit menjauhinya.",
        "Angin bertiup kencang, membuat bulu-bulu palsunya mulai lepas satu per satu.",
        "Sia-sia saja usahanya. Bulu-bulu merak itu berjatuhan, menampakkan wujud aslinya. \u201cTernyata kau hanya seekor gagak yang menyamar!\u201d seru kawanan merak. Mereka pun mengusirnya pergi.",
        "Dengan hati kecewa, si gagak kembali ke kawanan gagak. Namun sisa-sisa bulu merak yang masih menempel membuat kawanan gagak tidak mengenalinya, dan mereka pun ikut mengusirnya pergi.",
        "Ditolak oleh kedua golongan, si gagak merasa sangat sedih dan kesepian karena tak ada lagi tempat baginya. Ia pun terbang mengembara sendirian jauh ke dalam hutan, dan tak pernah lagi terlihat oleh kawanan mana pun."
      ]
    },
    en:{
      headerTitle:"The Arrogant Crow",
      coverTitle:"The Arrogant Crow",
      coverDesc:"A folktale from East Java about a crow who wanted to look as beautiful as a peacock. Follow the story and discover the valuable lesson within.",
      startLabel:"Start Story",
      next:"Next ▸",
      finish:"Finish ▸",
      replayLabel:"Replay Story",
      endTitle:"The End",
      footer:"Indonesian Folktales • Interactive Tales for Children",
      langBtn:"ID",
      collectHint:(n,t)=>`Tap the peacock feathers to collect them (${n}/${t})`,
      windHint:"Tap the crow repeatedly to hold his feathers on!",
      windDone:"The wind is too strong... the feathers start to fall.",
      moral:"Moral: Be grateful for who you truly are. Vanity and the wish to be someone else only bring regret and loneliness.",
      steps:[
        "In a wild forest in East Java, there lived a crow together with his flock of fellow crows. He seemed ordinary enough, but deep in his heart he felt dissatisfied with his jet-black feathers.",
        "One day, he found beautiful, colorful peacock feathers scattered on the forest floor.",
        "Filled with admiration, the crow thought, \u201cHow beautiful these feathers are. If I wear them, I will surely look as lovely as a peacock.\u201d So he attached the feathers to his body.",
        "With the peacock feathers attached to his body, the crow flew high in search of a flock of peacocks, hoping to be accepted as one of them.",
        "At first, the peacocks welcomed him warmly. But the crow's arrogant behavior slowly made them annoyed, and they began to keep their distance.",
        "A strong wind began to blow, causing the fake feathers to loosen one by one.",
        "His efforts were in vain. The peacock feathers fell away, revealing his true form. \u201cYou are just a crow in disguise!\u201d the peacocks cried, and they drove him away.",
        "With a heavy heart, the crow returned to his own flock. But the remaining peacock feathers still stuck to him kept the crows from recognizing him, and they, too, drove him away.",
        "Rejected by both flocks, the crow felt deeply sad and lonely, for he no longer belonged anywhere. He flew off alone deep into the forest, never to be seen by any flock again."
      ]
    }
  };

  function tr(key){ return T[lang][key]; }

  /* ---------------- DOM refs ---------------- */
  const el = id => document.getElementById(id);
  const canvas = el('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const screens = { cover: el('cover'), story: el('story'), ending: el('ending') };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  /* ---------------- state ---------------- */
  let stepIndex = 0; // 0..8 -> steps array (9 total)
  const TOTAL_STEPS = 9;
  let muted = false;
  let interactionLocked = false;

  // mini-game state
  let feathersCollected = 0;
  const FEATHERS_TARGET = 4;
  let featherSpots = [];
  let windTaps = 0;
  const WIND_TARGET = 14;
  let windTimer = null;
  let windTimeLeft = 0;

  /* ---------------- speech ---------------- */
  let voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if(window.speechSynthesis){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(){
    if(!voices.length) return null;
    const wantLang = lang === 'id' ? 'id' : 'en';
    let v = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(wantLang));
    if(!v && wantLang==='id') v = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
    return v || voices[0];
  }
  function speak(text){
    if(!window.speechSynthesis || muted) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if(v) u.voice = v;
    u.lang = lang === 'id' ? 'id-ID' : 'en-US';
    u.rate = 0.95;
    u.pitch = 1.0;
    speechSynthesis.speak(u);
  }
  function stopSpeak(){ if(window.speechSynthesis) speechSynthesis.cancel(); }

  el('muteBtn').addEventListener('click', ()=>{
    muted = !muted;
    el('muteBtn').textContent = muted ? '🔇' : '🔊';
    el('muteBtn').classList.toggle('active', !muted);
    if(muted) stopSpeak();
    else speak(currentStepText());
  });

  el('langBtn').addEventListener('click', ()=>{
    lang = lang === 'id' ? 'en' : 'id';
    applyLang();
    stopSpeak();
    render();
  });

  function applyLang(){
    el('headerTitle').textContent = tr('headerTitle');
    el('coverTitle').textContent = tr('coverTitle');
    el('coverDesc').textContent = tr('coverDesc');
    el('startLabel').textContent = tr('startLabel');
    el('replayLabel').textContent = tr('replayLabel');
    el('endTitle').textContent = tr('endTitle');
    el('footerText').textContent = tr('footer');
    el('langBtn').textContent = tr('langBtn');
    el('moralBox').textContent = tr('moral');
    document.documentElement.lang = lang;
  }

  function currentStepText(){
    return T[lang].steps[stepIndex];
  }

  /* ---------------- drawing helpers ---------------- */
  function bgGradient(c1,c2){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  function drawGround(color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,H*0.78);
    ctx.quadraticCurveTo(W*0.5,H*0.7,W,H*0.8);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  }
  function drawTree(x,y,scale,dark){
    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.fillStyle = dark ? '#26331d' : '#3f5a2b';
    ctx.beginPath(); ctx.rect(-6,0,12,50); ctx.fill();
    ctx.fillStyle = dark ? '#2f4a24' : '#4f7a35';
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(0,-i*28,46-i*8,34-i*6,0,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawForestBg(mood){
    // mood: 'day','sunset','dusk','night'
    const palettes = {
      day:['#bfe3c9','#e9f4d8'],
      sunset:['#f3b46a','#f7dfa3'],
      dusk:['#7a5f7a','#c58a72'],
      night:['#0e1a24','#25384a']
    };
    const p = palettes[mood] || palettes.day;
    bgGradient(p[0],p[1]);
    drawGround(mood==='night' ? '#141f16' : (mood==='dusk' ? '#3a2e22' : '#345a2a'));
    drawTree(60,H*0.72,1.0, mood==='night');
    drawTree(120,H*0.78,0.7, mood==='night');
    drawTree(W-70,H*0.72,1.1, mood==='night');
    drawTree(W-130,H*0.8,0.6, mood==='night');
  }

  function drawCrowBody(x,y,scale,withFeathers,featherAlpha){
    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);
    // tail
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(-14,6); ctx.lineTo(-38,-2); ctx.lineTo(-36,10); ctx.lineTo(-14,14); ctx.closePath(); ctx.fill();
    // body
    ctx.beginPath();
    ctx.ellipse(0,0,22,17,0,0,Math.PI*2); ctx.fill();
    // wing
    ctx.fillStyle = '#0f0f0f';
    ctx.beginPath();
    ctx.ellipse(2,4,14,9,0.3,0,Math.PI*2); ctx.fill();
    // head
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.ellipse(22,-8,11,10,0,0,Math.PI*2); ctx.fill();
    // beak
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.moveTo(31,-8); ctx.lineTo(44,-5); ctx.lineTo(31,-3); ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(25,-10,2.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(25.7,-10,1.3,0,Math.PI*2); ctx.fill();
    // legs
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-2,15); ctx.lineTo(-4,26); ctx.moveTo(6,15); ctx.lineTo(9,26); ctx.stroke();

    if(withFeathers){
      ctx.save();
      ctx.globalAlpha = featherAlpha===undefined?1:featherAlpha;
      const colors = ['#2d6e5e','#3d8f6e','#4fae76','#2a5a8c'];
      for(let i=0;i<5;i++){
        const fx = -30 - i*7, fy = -2 + i*3;
        ctx.save();
        ctx.translate(fx,fy);
        ctx.rotate(-0.35 - i*0.05);
        drawFeatherShape(colors[i%colors.length]);
        ctx.restore();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawFeatherShape(color){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-6,-16,0,-34);
    ctx.quadraticCurveTo(6,-16,0,0);
    ctx.fillStyle = color;
    ctx.fill();
    // eye spot
    ctx.beginPath();
    ctx.ellipse(0,-26,4.5,6,0,0,Math.PI*2);
    ctx.fillStyle = '#e0a944';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,-26,2,2.8,0,0,Math.PI*2);
    ctx.fillStyle = '#7a3b2e';
    ctx.fill();
    ctx.strokeStyle = '#f4f0d8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(0,-32); ctx.stroke();
  }

  function drawPeacock(x,y,scale,angry){
    ctx.save();
    ctx.translate(x,y); ctx.scale(scale,scale);
    // fanned tail
    ctx.save();
    ctx.translate(-4,4);
    for(let i=-3;i<=3;i++){
      ctx.save();
      ctx.rotate(i*0.16);
      ctx.translate(0,4);
      drawFeatherShape(i%2===0 ? '#2d6e5e' : '#3d8f6e');
      ctx.restore();
    }
    ctx.restore();
    // body
    ctx.fillStyle = '#1f5c8f';
    ctx.beginPath(); ctx.ellipse(4,4,15,13,0,0,Math.PI*2); ctx.fill();
    // neck/head
    ctx.beginPath(); ctx.ellipse(18,-10,8,9,0,0,Math.PI*2); ctx.fill();
    // crest
    ctx.strokeStyle = '#1f5c8f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18,-19); ctx.lineTo(15,-25); ctx.moveTo(20,-19); ctx.lineTo(22,-25); ctx.stroke();
    ctx.fillStyle = '#e0a944';
    ctx.beginPath(); ctx.arc(15,-25,2,0,Math.PI*2); ctx.arc(22,-25,2,0,Math.PI*2); ctx.fill();
    // beak
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath(); ctx.moveTo(25,-10); ctx.lineTo(33,-8); ctx.lineTo(25,-6); ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = angry ? '#9b3b3b' : '#000';
    ctx.beginPath(); ctx.arc(21,-11,1.6,0,Math.PI*2); ctx.fill();
    if(angry){
      ctx.strokeStyle = '#9b3b3b'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(17,-15); ctx.lineTo(23,-13); ctx.stroke();
    }
    // legs
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(2,16); ctx.lineTo(0,26); ctx.moveTo(8,16); ctx.lineTo(11,26); ctx.stroke();
    ctx.restore();
  }

  function drawFallenFeather(x,y,scale,color){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(0.15); ctx.scale(scale,scale);
    drawFeatherShape(color);
    ctx.restore();
  }

  /* ---------------- scene renderers per step ---------------- */
  function sceneStep0(){ // crow among crow flock, forest day
    drawForestBg('day');
    drawCrowBody(150,190,1.3,false);
    drawCrowBody(220,230,0.8,false);
    drawCrowBody(90,240,0.7,false);
    drawCrowBody(470,210,1.0,false);
    drawCrowBody(540,250,0.75,false);
  }

  function sceneStep1(){ // feathers scattered - collect minigame
    drawForestBg('day');
    featherSpots.forEach(f=>{
      if(f.collected) return;
      drawFallenFeather(f.x,f.y,f.scale,f.color);
    });
    drawCrowBody(90,270,1.0,false);
  }

  function sceneStep2(){ // crow decorating himself
    drawForestBg('sunset');
    drawCrowBody(W/2-20,H/2+20,1.7,true,1);
  }

  function sceneStep3(){ // flying to find peacocks
    bgGradient('#8fc7e0','#e8f3d8');
    // clouds
    ctx.fillStyle='rgba(255,255,255,.8)';
    [[80,60,30],[160,45,22],[520,80,26],[460,55,18]].forEach(c=>{
      ctx.beginPath(); ctx.arc(c[0],c[1],c[2],0,Math.PI*2); ctx.fill();
    });
    drawGround('#4f7a35');
    drawCrowBody(W/2,H*0.42,1.4,true,1);
  }

  function sceneStep4(){ // among peacocks, welcomed then wary
    drawForestBg('day');
    drawPeacock(150,220,1.1,false);
    drawPeacock(480,220,1.1,true);
    drawCrowBody(320,240,1.3,true,1);
  }

  function sceneStep5(){ // wind mini-game
    drawForestBg('dusk');
    // wind streaks
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
    for(let i=0;i<5;i++){
      const yy = 60+i*40 + (windTaps*3 % 20);
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(70,yy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W-70,yy+15); ctx.lineTo(W,yy+15); ctx.stroke();
    }
    const alpha = Math.max(0, 1 - windTaps/(WIND_TARGET+4));
    drawCrowBody(W/2,H/2+20,1.7,true,alpha);
  }

  function sceneStep6(){ // expelled by peacocks
    drawForestBg('sunset');
    drawPeacock(150,210,1.1,true);
    drawPeacock(500,210,1.1,true);
    drawCrowBody(320,250,1.2,true,0.15);
  }

  function sceneStep7(){ // rejected by crows too
    drawForestBg('dusk');
    drawCrowBody(150,220,1.0,false);
    drawCrowBody(500,220,1.0,false);
    drawCrowBody(320,250,1.1,true,0.1);
  }

  function sceneStep8(){ // lonely ending
    drawForestBg('night');
    // moon
    ctx.fillStyle = '#f4f0d8';
    ctx.beginPath(); ctx.arc(W-80,60,26,0,Math.PI*2); ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.85;
    drawCrowBody(200,150,1.0,false);
    ctx.restore();
  }

  const sceneRenderers = [sceneStep0, sceneStep1, sceneStep2, sceneStep3, sceneStep4, sceneStep5, sceneStep6, sceneStep7, sceneStep8];

  function drawScene(){
    ctx.clearRect(0,0,W,H);
    sceneRenderers[stepIndex]();
  }

  /* ---------------- feather collect mini-game ---------------- */
  function setupFeathers(){
    feathersCollected = 0;
    const colors = ['#2d6e5e','#3d8f6e','#4fae76','#2a5a8c'];
    featherSpots = [];
    const positions = [[210,120],[330,90],[430,160],[300,200]];
    positions.forEach((p,i)=>{
      featherSpots.push({x:p[0],y:p[1],scale:0.9+Math.random()*0.3,color:colors[i%colors.length],collected:false});
    });
  }

  function canvasClickHandler(evt){
    if(interactionLocked) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const cx = (evt.clientX - rect.left) * scaleX;
    const cy = (evt.clientY - rect.top) * scaleY;

    if(stepIndex === 1){
      for(const f of featherSpots){
        if(f.collected) continue;
        const dx = cx - f.x, dy = cy - (f.y-15);
        if(Math.sqrt(dx*dx+dy*dy) < 34){
          f.collected = true;
          feathersCollected++;
          drawScene();
          updatePrompt();
          if(feathersCollected >= FEATHERS_TARGET){
            interactionLocked = false;
            setTimeout(()=>advanceIfReady(),350);
          }
          break;
        }
      }
    } else if(stepIndex === 5){
      windTaps = Math.min(windTaps+1, WIND_TARGET);
      drawScene();
      updatePrompt();
      if(windTaps >= WIND_TARGET){
        clearInterval(windTimer);
        setTimeout(()=>{ finishWindMinigame(); }, 400);
      }
    }
  }
  canvas.addEventListener('click', canvasClickHandler);
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    const t = e.changedTouches[0];
    canvasClickHandler({clientX:t.clientX, clientY:t.clientY});
  }, {passive:false});

  function finishWindMinigame(){
    goToStep(stepIndex+1);
  }

  function startWindTimer(){
    windTimeLeft = 6;
    clearInterval(windTimer);
    windTimer = setInterval(()=>{
      windTimeLeft -= 1;
      if(windTimeLeft <= 0){
        clearInterval(windTimer);
        finishWindMinigame();
      }
    },1000);
  }

  /* ---------------- prompt / next button logic ---------------- */
  function updatePrompt(){
    const prompt = el('promptLine');
    const progressTrack = el('progressTrack');
    const progressFill = el('progressFill');
    const nextBtn = el('nextBtn');
    progressTrack.style.display = 'none';

    if(stepIndex === 1){
      prompt.textContent = tr('collectHint')(feathersCollected, FEATHERS_TARGET);
      nextBtn.style.display = 'none';
    } else if(stepIndex === 5){
      prompt.textContent = windTaps >= WIND_TARGET ? tr('windDone') : tr('windHint');
      progressTrack.style.display = 'block';
      progressFill.style.width = Math.min(100, (windTaps/WIND_TARGET)*100) + '%';
      nextBtn.style.display = 'none';
    } else {
      prompt.textContent = '';
      nextBtn.style.display = 'inline-flex';
      nextBtn.textContent = stepIndex === TOTAL_STEPS-1 ? tr('finish') : tr('next');
    }
  }

  function advanceIfReady(){
    // used after feather collection completes
    goToStep(stepIndex+1);
  }

  function renderDots(){
    const dotsWrap = el('dots');
    dotsWrap.innerHTML = '';
    for(let i=0;i<TOTAL_STEPS;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i===stepIndex ? ' on' : '');
      dotsWrap.appendChild(d);
    }
  }

  function goToStep(idx){
    stopSpeak();
    clearInterval(windTimer);
    interactionLocked = false;
    if(idx >= TOTAL_STEPS){
      showEnding();
      return;
    }
    stepIndex = idx;
    showScreen('story');
    render();
  }

  function render(){
    drawScene();
    el('storyText').textContent = currentStepText();
    renderDots();
    updatePrompt();
    if(stepIndex === 1) setupFeathers(), drawScene();
    if(stepIndex === 5){ windTaps = 0; startWindTimer(); }
    speak(currentStepText());
  }

  function showEnding(){
    showScreen('ending');
    el('moralBox').textContent = tr('moral');
    speak(tr('moral'));
  }

  /* ---------------- buttons ---------------- */
  el('startBtn').addEventListener('click', ()=>{
    goToStep(0);
  });
  el('nextBtn').addEventListener('click', ()=>{
    goToStep(stepIndex+1);
  });
  el('replayBtn').addEventListener('click', ()=>{
    showScreen('cover');
    stopSpeak();
  });

  /* ---------------- init ---------------- */
  applyLang();
  drawForestBg('day');
  drawCrowBody(W/2-20,H/2+10,1.4,false);

  /* ---------------- iframe auto-resize ---------------- */
  function postHeight(){
    const h = document.getElementById('wrap').getBoundingClientRect().height + 28;
    try{
      window.parent.postMessage({type:'resize', height:Math.ceil(h)}, '*');
      window.parent.postMessage(Math.ceil(h), '*');
    }catch(e){}
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if(window.ResizeObserver){
    new ResizeObserver(postHeight).observe(document.getElementById('wrap'));
  }
  setInterval(postHeight, 1000);

})();
</script>
</body>
</html>
